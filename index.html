<script>
const DATA = {"days":[{"date":"2026-10-22","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"한승구 건설협회장 \"산안법 개정안, 주택공급 위축 부를 것\""},{"n":3,"text":"월세가 점령한 서울…'전세의 월세화' 외곽까지 확산"},{"n":8,"text":"부진한 일산 1기 신도시 재건축…홍지선 장관 \"제도·행정 지원\""}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"한승구 건설협회장 \"산안법 개정안, 주택공급 위축 부를 것\"","meta":"2026.10.21 16:00 · 머니투데이방송(MTN)","body":"한승구 대한건설협회 회장이 21일 출입기자단 간담회에서 국회를 통과한 산업안전보건법 개정안과 철도 건설 부가세 영세율 폐지 등 규제 강화 움직임에 우려를 나타냈다. 그는 도시철도 공사의 부가세 영세율이 폐지되면 공사비가 8~10% 오를 수 있어 사업 자금조달에도 부담이 될 것이라고 지적했다. 중대재해가 연 3건 이상 발생한 기업에 영업이익의 최대 5%를 과징금으로 물리는 산안법 개정안에 대해서도 정부의 주택공급 확대 정책과 배치되고 중소 건설사의 존립을 위협할 수 있다고 비판했다. 한 회장은 \"건설산업을 둘러싼 여건이 녹록지 않은데 규제가 첩첩이 더해지고 있다\"며 정부의 규제 완화 검토를 촉구했다.","url":"https://news.mtn.co.kr/news-detail/2026102115581299482"},{"n":2,"title":"李 주택 공급 전격전에… 與 '모듈러 특별법' 드라이브","meta":"2026.10.22 00:39 · 서울신문","body":"이재명 대통령이 주택 공급 속도를 높이기 위해 모듈러 공법 전면 검토를 지시한 데 따라 더불어민주당이 '모듈러 특별법'을 하반기 핵심 입법 과제로 정했다. 국회 국토교통위원회는 다음 달 중 서너 차례 소위원회를 열어 법안을 논의할 계획이며, 신속한 공급이 필요한 공공임대주택 등에 모듈러 기술 적용을 확대하는 내용이 핵심이다. 모듈러 공법은 기존 공법보다 공사 기간을 20~30% 단축할 수 있는 것으로 평가되지만, 대량 입찰과 통합 조달 조항을 둘러싼 업계 조율이 더 필요한 상황이다.","url":"https://seoul.co.kr/news/politics/2026/10/22/20261022004006"}]},{"name":"시장동향","articles":[{"n":3,"title":"월세가 점령한 서울…'전세의 월세화' 외곽까지 확산","meta":"2026.10.21 23:25 · 서울신문","body":"올해 1~9월 서울 아파트 전월세 거래 중 월세 비중이 51.0%를 기록해 2011년 관련 통계 집계 이후 처음으로 전세를 넘어섰다. 같은 기간 전세 거래량은 27.4% 급감한 반면 월세 거래는 2.8% 감소에 그쳤고, 평균 월세는 166만1000원으로 1년 전보다 21만8000원 올랐다. 전세의 월세 전환 현상은 노원·도봉·강북 등 이른바 '노도강' 외곽 지역까지 번져 일부 전용 84㎡ 단지는 보증금 5000만원에 월세 315만원 수준까지 치솟았다. 대출 규제와 전세 매물 부족이 겹치며 세입자의 주거비 부담이 커지고 있다는 평가다.","url":"https://www.seoul.co.kr/news/economy/2026/10/21/20261021001005"},{"n":4,"title":"\"경기도 전세라도…\" 서울 전셋집 포기하려던 30대 '한숨'","meta":"2026.10.21 17:55 · 한국경제","body":"서울 아파트 평균 전셋값이 6억4100만원으로 4년 만에 최고치를 다시 썼고, 25개 자치구 중 13곳이 기존 최고가를 넘어섰다. 전·월세 매물이 1년 전보다 15.3% 줄면서 수급지수가 2021년 이후 최고 수준까지 치솟았고, 20·30대의 전·월세대출 잔액은 75조원으로 사상 최대를 기록했다. 내년 서울 아파트 입주물량이 올해보다 8% 줄어들 것으로 예상되면서 전세난이 당분간 이어질 것이라는 우려가 나온다. 서울 전셋값 급등 여파로 경기 광명·하남 등 일부 단지 전세가도 10억원을 넘어서고 있다.","url":"https://www.hankyung.com/article/2026102167471"}]},{"name":"정비사업","articles":[{"n":8,"title":"부진한 일산 1기 신도시 재건축…홍지선 장관 \"제도·행정 지원\"","meta":"2026.10.21 15:52 · 한국경제","body":"홍지선 국토교통부 장관이 21일 경기 고양 일산신도시를 찾아 노후계획도시 정비사업 추진 현황을 점검했다. 홍 장관은 일산의 선도지구 사업 추진 속도가 다른 1기 신도시보다 더디다고 지적하며 특별정비구역 지정 등 후속 절차에 속도를 내 달라고 당부했다. 정부는 기준 용적률 상향 등 제도 개선을 서두르는 한편, 1995년 준공된 영구임대주택인 흰돌마을4단지의 특별정비구역 지정도 내년 상반기 목표로 추진하기로 했다. 국토부는 고양특례시·LH와 협력해 제도적·행정적 지원을 강화하겠다고 밝혔다.","url":"https://www.hankyung.com/article/202610216318i"},{"n":9,"title":"연말 재건축 12조 '큰 장'…건설사 도시정비 수주 역대 최대 전망","meta":"2026.10.21 10:34 · 글로벌이코노믹","body":"연말까지 서울 목동·성수, 경기 광명 등 수도권 주요 재건축·재개발 사업장 11곳에서 총 12조6922억원 규모의 시공사 선정이 예정돼 있다. 현대건설과 삼성물산이 올해 누적 수주액에서 이미 지난해 연간 실적을 넘어섰으며, 추가 수주가 이어지면 주요 건설사의 누적 수주액 합계가 50조원을 돌파할 수 있다는 전망도 나온다. 다만 대형 건설사들의 선별 수주 전략으로 단독 입찰이 늘면서 조합의 공사비 협상력이 약화될 수 있다는 우려도 제기된다.","url":"https://www.g-enews.com/article/Real-Estate/2026/10/2026102110063695892aa6f4cdad_1"}]},{"name":"금융/세제","articles":[{"n":11,"title":"HUG, 공적보증 연 100조로 확대…주택공급 지원 강화","meta":"2026.10.21 08:13 · 서울경제","body":"주택도시보증공사(HUG)가 제4회 한국건설부동산산업대상 주택 부문에서 수상하며 주택 공적보증을 연간 100조원 규모로 확대하겠다고 밝혔다. HUG는 지방 시장 침체로 어려움을 겪는 중소·중견 건설사를 위한 임대보증 제도를 개선하고, 내년 5월까지 분양보증료를 30%, PF 연계 사업은 최대 60%까지 한시 할인하기로 했다. 서울 청년주택 사업 10곳, 약 2000가구에 대해서는 절차를 간소화해 공급 속도를 높이고, LH와 협력해 공공주택 공급의 금융 비용도 낮추기로 했다.","url":"https://www.sedaily.com/article/20104086"},{"n":12,"title":"청년층 주담대 충분히 못 받아…LTV 하락","meta":"2026.10.21 18:00 · 서울경제","body":"올해 8월까지 19~39세 청년층의 평균 주택담보대출 승인액은 1년 전보다 약 7% 늘었지만, 주택 가격 대비 대출 비율(LTV)은 58.7%에서 56.2%로 2.5%포인트 떨어져 2022년 이후 처음으로 하락했다. 은행권 관계자는 LTV 하락이 청년층이 주택 구입에 충분한 대출을 받지 못하고 있다는 신호라며 자금 부담이 커지고 있다고 설명했다. 집값 상승과 대출 규제 강화, 청년층 내 소득 양극화가 겹치며 고소득 청년은 큰 대출을 받는 반면 저소득 청년은 대출 문턱에 막히는 현상이 뚜렷해지고 있다.","url":"https://www.sedaily.com/article/20104492"}]},{"name":"임대주택","articles":[{"n":13,"title":"김이탁 국토교통부 제1차관, \"행복기숙사 지속 공급 확대\" 강조","meta":"2026.10.21 17:32 · 중부뉴스통신","body":"김이탁 국토교통부 제1차관이 인천 계양구 경인여대에서 열린 행복기숙사 '루디아 하우스' 개관식에 참석해 청년 주거비 부담 완화 의지를 밝혔다. 행복기숙사 사업은 통학이 어려운 대학생을 위해 주택도시기금을 연 1.5% 저리로 한국사학진흥재단에 융자해 저렴한 기숙사를 짓는 사업이다. 2012년 이후 80개 사업에 1조614억원이 지원돼 5만명 이상의 대학생에게 거처를 제공했으며, 국토부는 행복기숙사와 함께 공유형 청년주택도 확대 공급할 계획이다.","url":"https://www.jungbunews.com/news/articleView.html?idxno=2769438"}]},{"name":"택지/도시개발","articles":[{"n":14,"title":"대통령이 주문한 3기 신도시 고밀화…공급 확대 기대 속 '인프라' 숙제","meta":"2026.10.21 15:38 · 데일리안","body":"정부가 3기 신도시 평균 용적률을 기존 206%에서 250% 이상으로 높여 주택 공급 물량을 늘리는 방안을 추진 중이다. 이재명 대통령은 인천 계양 3기 신도시를 찾아 공급 확대와 사업 속도 개선을 지시했다. 전문가들은 공급 증가가 시장 안정에 도움이 될 것으로 평가하면서도 GTX·지하철 등 광역교통망 조기 완성과 상하수도·학교 등 생활 인프라 재계획이 함께 이뤄져야 한다고 지적한다.","url":"https://www.dailian.co.kr/news/view/1704213/%EB%8C%80%ED%86%B5%EB%A0%B9-%EC%A3%BC%EB%AC%B8%ED%95%9C-3%EA%B8%B0-%EC%8B%A0%EB%8F%84%EC%8B%9C-%EA%B3%A0%EB%B0%80%ED%99%94%EA%B3%B5%EA%B8%89-2026"},{"n":15,"title":"모듈러주택 활성화…LH, 2030년까지 1.6만가구 발주","meta":"2026.10.21 17:21 · 데일리안","body":"한국토지주택공사(LH)가 2030년까지 모듈러주택 1만6000가구를 발주하겠다고 밝혔다. 올해는 애초 목표(2000가구)를 넘어선 2100가구를 발주할 예정이며, 고양창릉·남양주왕숙2·포천송우 등에서 모듈러 공법을 적용한 사업을 추진한다. 2027~2030년에는 매년 3000가구 이상, 총 1만4000가구를 단계적으로 발주할 계획이다. LH는 이날 모듈러 제조사와 삼성전자·LG전자 등 가전기업, 학계 전문가와 간담회를 열어 'AI 모듈러 홈' 구현 방안도 논의했다.","url":"https://www.dailian.co.kr/news/view/1704289"}]},{"name":"주택품질/안전","articles":[{"n":16,"title":"리모델링 150곳서 활발… 직권조사 도입해 조합 감시 강화","meta":"2026.10.21 18:25 · 파이낸셜뉴스","body":"개정된 주택법에 따라 내년 3월 9일부터 아파트 리모델링 조합도 국토교통부와 지방자치단체의 직권조사 대상에 포함된다. 그동안 재개발·재건축 조합만 직권조사 대상이었으나, 법 개정으로 공무원과 전문가로 구성된 점검반이 현장조사를 벌여 위법사항 시정요구나 수사기관 고발 등의 조치를 할 수 있는 법적 근거가 마련됐다. 현재 전국 150개 단지, 약 12만가구에서 리모델링이 추진되고 있으며 이 가운데 서울이 82개 단지로 절반 이상을 차지해 조합 운영 투명성 강화가 시급하다는 지적이 나온다.","url":"https://www.fnnews.com/news/202610211825255967"}]},{"name":"분양정보","articles":[{"n":17,"title":"\"분양가 지금이 가장 싸다\"…청약·정책대출 문 두드려라","meta":"2026.10.21 15:58 · 한국경제","body":"서울 아파트값이 88주 연속 오르는 가운데 전세가격도 함께 뛰면서 내 집 마련을 미루던 실수요자들이 매수로 돌아서고 있다. 경기권도 최근 5년 내 가장 가파른 주간 상승률(0.26%)을 나타냈으며 분당구 등 남부권 상승세가 두드러졌다. 전문가들은 신규 아파트 청약과 정부 정책대출, 공공분양 등을 자금 여력과 시기에 맞춰 전략적으로 조합할 것을 권하며, 디딤돌대출 등 연 2%대 저리 정책대출 활용을 강조했다.","url":"https://hankyung.com/article/2026102152621"},{"n":18,"title":"반도건설, 3기 신도시 '계양신도시 카이브 유보라·시간' 23일 견본주택 개관","meta":"2026.10.21 10:48 · 파이낸셜뉴스","body":"반도건설이 10월 23일 경기 부천시에서 계양신도시 첫 민간분양 단지인 '카이브 유보라'와 상업시설 '시간'의 견본주택을 개관한다. 이 단지는 AC3·AC4블록에 걸쳐 전용 84~93㎡, 총 1110가구 규모로 공급되며 지하철 박촌역과 인접하고 김포공항역까지 3정거장 거리라는 입지를 강조하고 있다. 입주는 2029년 8월로 예정돼 있으며 청약은 11월 2~4일 진행된다.","url":"https://www.fnnews.com/news/202610211014122391"}]},{"name":"논설/사설","articles":[{"n":20,"title":"[사설] 李 \"주택 공급 전격전\"…병목 풀어낼 실행력이 관건","meta":"2026.10.21 11:07 · 헤럴드경제","body":"이재명 대통령이 주택 공급 확대를 정권의 핵심 과제로 내세우며 기존 관행과 절차에 얽매이지 말고 인허가·착공 기간을 대폭 단축하라고 주문했다. 사설은 과거 3기 신도시가 계획 발표 후 첫 입주까지 8년이 걸렸던 점을 지적하며, 절차적 병목 해소와 건설사 참여를 이끌 유인책 마련이 필수적이라고 짚는다. 말이 아닌 실제 성공 사례로 시장의 신뢰를 얻어야 한다고 평가한다.","url":"https://biz.heraldcorp.com/article/10909779"}]}]},{"date":"2026-10-21","count":15,"pdf_count":15,"highlights":[{"n":1,"text":"李대통령 \"관행·절차 얽매이지 말고 주택공급 전격전 펼치길\""},{"n":2,"text":"수도권 주택사업경기 전망, 3개월 만에 기준선 회복"},{"n":4,"text":"삼성물산, 여의도 시범 재건축 수주…정비사업 누적 10조 고지"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"李대통령 \"관행·절차 얽매이지 말고 주택공급 전격전 펼치길\"","meta":"2026.10.20 10:10 · 한국경제","body":"이재명 대통령이 20일 청와대 국무회의에서 주택 공급 정책과 관련해 기존의 관행과 절차에 얽매이지 말라고 지시했다. 이 대통령은 단순히 공급 계획을 발표하는 데 그치지 않고 실제 착공과 입주로 이어지는 성과를 내야 한다고 말했다. 택지 조성부터 인허가, 착공까지 걸리는 기간을 최대한 단축해 \"주택공급 전격전\"을 펼쳐달라고 주문했다. 국민이 체감할 수 있는 주거 안정이 국정 성패를 좌우한다는 점도 강조했다.","url":"https://www.hankyung.com/article/2026102026667"}]},{"name":"시장동향","articles":[{"n":2,"title":"수도권 주택사업경기 전망, 3개월 만에 기준선 회복","meta":"2026.10.20 17:26 · 센머니","body":"주택산업연구원 조사 결과 10월 수도권 주택사업경기전망지수가 100.2로 집계돼 전월(89.2)보다 11.0포인트 올랐다. 기준선인 100을 넘은 것은 지난 7월(101.6) 이후 3개월 만으로, 100을 넘으면 경기를 긍정적으로 보는 응답이 더 많다는 의미다. 서울이 97.2에서 110.0으로 12.8포인트 급등하며 상승을 주도했고 인천과 경기도 각각 오름세를 보였다. 서울 외곽과 경기 일부 지역의 집값 상승세가 주택사업자들의 기대감을 끌어올린 것으로 분석된다.","url":"https://www.senmoney.co.kr/news/articleView.html?idxno=38030"},{"n":3,"title":"서울 중저가 아파트 거래 비중 22%…1년새 5%P↑","meta":"2026.10.20 17:36 · 머니투데이방송(MTN)","body":"올해 1~3분기 서울에서 6억원 미만 아파트 매매 거래 비중이 21.9%로 지난해 같은 기간보다 5.0%포인트 높아진 것으로 나타났다. 분기별로도 1분기 21.3%, 2분기 20.5%, 3분기 25.4%로 비중이 꾸준히 확대됐다. 서울 전역이 규제지역으로 묶이고 주택담보대출 한도가 차등 적용되면서 생애최초 매수자 등 정책대출을 활용한 실수요층이 저가 주택으로 몰린 영향으로 풀이된다. 반면 올해 남부권 중심으로 집값이 크게 오른 경기도는 같은 기간 6억원 미만 거래 비중이 1.3%포인트 줄어든 60.0%를 기록해 대조를 이뤘다.","url":"https://news.mtn.co.kr/article/2026102017043717116"}]},{"name":"정비사업","articles":[{"n":4,"title":"삼성물산, 여의도 시범 재건축 수주…정비사업 누적 10조 고지","meta":"2026.10.20 11:05 · 한국금융신문","body":"삼성물산 건설부문이 서울 영등포구 여의도 시범아파트 재건축 사업의 시공사로 선정됐다. 공사 예정금액은 약 2조2685억원으로, 이번 수주로 삼성물산의 올해 도시정비사업 누적 수주액은 9조6055억원에 달해 지난해 연간 수주액(9조2388억원)을 이미 넘어섰다. 삼성물산은 여의도에서만 세 곳의 재건축 사업장을 확보해 래미안 브랜드로 한강 조망 세대를 늘릴 계획이다. 목동13단지, 창원 용호1구역 등을 추가 수주하면 누적액이 12조원을 넘어설 수 있어 연간 목표인 13조원 달성 여부에 업계 관심이 쏠린다.","url":"https://www.fntimes.com/html/view.php?ud=202610201053468566b372994c95_18"},{"n":5,"title":"서울 아파트 착공 10가구 중 8가구는 재개발·재건축","meta":"2026.10.20 18:31 · 파이낸셜뉴스","body":"올해 1~8월 서울 아파트 착공 물량 1만5654가구 중 1만2445가구(79.5%)가 재개발·재건축 등 정비사업으로 이뤄진 것으로 나타났다. 서울 내 신규 가용 부지가 부족한 상태에서 정비사업 외에는 실질적인 공급 대안이 마땅치 않다는 게 전문가들의 지적이다. 갈현1구역(4467가구), 한남3구역(5970가구) 등 대규모 사업이 착공 물량을 주도하고 있다. 정부가 추진하는 공급 확대 정책의 실효성에 대해서도 의문이 제기된다.","url":"https://fnnews.com/news/202610201831102627"},{"n":6,"title":"목동·성수·광명서 연내 12조 규모 재건축 시공사 선정 줄줄이","meta":"2026.10.20 18:01 · 한국경제","body":"서울 목동과 성수, 경기 광명 등에서 연내 시공사 선정이 예상되는 주요 정비사업이 11곳, 총 12조6922억원 규모에 달하는 것으로 집계됐다. 이 가운데 목동 일대가 5조2000억원으로 전체의 42%를 차지하며, 목동13단지(삼성물산), 목동12단지(GS건설), 목동8단지(대우건설) 등이 각각 사업을 추진 중이다. 성수2지구와 광명 지역 사업장도 대형 건설사들의 수주 경쟁 대상으로 꼽힌다. 이번 시공사 선정 결과에 따라 국내 10대 건설사의 올해 도시정비사업 수주 순위도 요동칠 전망이다.","url":"https://www.hankyung.com/article/2026102039611"}]},{"name":"금융/세제","articles":[{"n":7,"title":"\"거주도 못 하는데 재산세까지?\"…서울시의회, 리모델링 세제 개선 촉구","meta":"2026.10.20 09:36 · 글로벌이코노믹","body":"서울시의회 김지훈 의원이 노후 공동주택 리모델링 공사 기간에 재산세를 면제해달라는 내용의 건의안을 발의했다. 현행 제도에서는 재건축·재개발은 철거가 완료돼 건축물이 사실상 사라진 것으로 인정되면 주택분 재산세가 면제되지만, 리모델링은 골조를 유지한다는 이유로 조합원 전원이 이주해 실거주가 불가능한 기간에도 재산세가 그대로 부과된다. 현재 서울 내 리모델링 추진 단지는 약 78곳, 4만7000호 규모로 공사비와 금리 인상까지 겹쳐 주민 부담이 커지고 있다. 건의안은 정부를 향해 지방세법 시행령을 개정해 이주 완료 후 공사 기간을 재산세 비과세 대상에 포함할 것을 촉구하는 내용을 담았다.","url":"https://www.g-enews.com/article/General-News/2026/10/20261020093202841720ae620e86_1"},{"n":8,"title":"재건축 조합장이 제안한 재초환 부담금 산정 개선안 눈길","meta":"2026.10.20 09:19 · 위클리한국주택경제신문","body":"대구 범어우방1차 재건축조합의 박선용 조합장이 재건축초과이익환수제(재초환) 부담금 산정방식 개선안을 국토교통부와 국회에 제출했다. 조합이 전국 5개 재건축 사업장 자료를 분석한 결과 행정구역 전체 평균값을 쓰는 현행 방식이 개별 사업장의 주택시장 변화를 제대로 반영하지 못하는 것으로 나타났다. 실제로 서울 반포현대의 경우 현행 적용 상승률은 22.148%인데 실거래가격지수 상승률은 88.983%로 큰 차이를 보였다. 조합은 공동주택 실거래가격지수나 인근 유사단지 가격 변화 등을 보완지표로 도입해 시행령과 업무지침을 개선해달라고 요청했다.","url":"https://www.arunews.com/news/articleView.html?idxno=68292"}]},{"name":"임대주택","articles":[{"n":9,"title":"민간임대주택 관리비 신고 의무화…임대 조건 공개 확대","meta":"2026.10.20 16:16 · 이투데이","body":"국토교통부는 20일 국무회의에서 민간임대주택에 관한 특별법 시행령 개정안이 의결됐다고 밝혔다. 앞으로 임대사업자는 임대차계약을 신고할 때 임대료뿐 아니라 관리비와 사용료도 함께 신고해야 하며, 지자체는 이 같은 임대 조건을 공보와 누리집에 공고한다. 시도는 100가구 이상 민간임대주택단지의 임대료 증액 비율을 조례로 별도 규정할 수 있게 된다. 신고 누락 등 경미한 의무 위반에 대한 과태료는 완화되며, 개정안은 공포 후 6개월 뒤부터 시행된다.","url":"https://www.etoday.co.kr/news/view/2637767"}]},{"name":"택지/도시개발","articles":[{"n":10,"title":"李 \"3기 신도시 하루라도 당겨야\"…인천 계양 현장서 속도전 지시","meta":"2026.10.20 17:43 · 한국경제","body":"이재명 대통령이 20일 3기 신도시 가운데 처음으로 입주를 앞둔 인천 계양 공공주택지구를 찾아 택지 조성부터 인허가, 착공까지의 기간을 최대한 단축하라고 지시했다. 이 대통령은 \"3기 신도시의 신속한 주택 공급이 부동산 정책의 성패를 가르는 분기점\"이라며 중요한 것은 속도라고 강조했다. 보상 절차를 끝낸 뒤에도 버티는 토지주로 인해 사업이 지연되는 상황을 막기 위한 법 정비 필요성도 거론했다. 정부와 LH는 2030년까지 3기 신도시 공공주택 물량의 90%를 착공한다는 목표이며, 인천 계양에서는 오는 12월 공공분양과 신혼희망타운 등 1285가구가 3기 신도시 중 처음으로 입주한다.","url":"https://www.hankyung.com/article/2026102041041"}]},{"name":"주택품질/안전","articles":[{"n":11,"title":"송도 신축 아파트, 테라스 붕괴 이어 100여 세대 침수 피해","meta":"2026.10.20 16:06 · 더퍼블릭","body":"인천 송도 럭스오션SK뷰 아파트에서 지난 18일 내린 비로 100여 가구가 침수 피해를 입었다. 이 단지는 SK에코플랜트가 시공한 1114가구 규모로, 지난 8월에는 한 세대의 테라스 구조물과 외장재가 붕괴해 떨어지는 사고도 있었다. 입주민들은 창호 설계·시공 불량을 지적하며 2년 가까이 보수를 거듭해도 누수 문제가 해결되지 않았다고 주장했다. 사용승인 후 1년여 만에 접수된 하자만 5만7000건이 넘는 것으로 나타났으며, 국토교통부와 인천시는 공동 사고조사위원회를 꾸려 다음 달 20일까지 원인 규명에 나섰다.","url":"https://www.thepublic.kr/news/articleView.html?idxno=322914"},{"n":12,"title":"DL이앤씨, 4년 연속 아파트 하자판정 '제로' 달성","meta":"2026.10.20 17:48 · 서울경제","body":"DL이앤씨가 2026 건설부동산산업대상 건축 부문 대상을 받았다. 국토교통부 하자심사분쟁조정위원회 기준으로 2023년부터 2026년 2월까지 4년 연속 하자판정 '제로'를 달성했다. 회사는 시공 전 교육, 30개 필수 점검항목, 24개 핵심 품질점검, 데이터 분석으로 이어지는 4단계 품질관리 체계를 운영하며, 2022년 국내 건설사 최초로 데이터 플랫폼 팔란티어를 도입해 기획·설계·시공·유지관리 전 단계에 AI 분석을 적용하고 있다. 고급 주거 브랜드 '아크로'는 1만6048명을 대상으로 한 설문에서 46.1%의 선택을 받아 6년 연속 고급 아파트 선호도 1위에 올랐다.","url":"https://sedaily.com/article/20103937"}]},{"name":"분양정보","articles":[{"n":13,"title":"부산·평택·인천, 수십조 개발사업 배후로 아파트 분양 쏟아진다","meta":"2026.10.20 18:33 · 파이낸셜뉴스","body":"부산 북항, 평택 삼성전자 반도체 캠퍼스, 인천 계양신도시 등 수십조 원 규모 개발사업이 진행 중인 지역 인근에서 신규 아파트 분양이 잇따르고 있다. 20조원 규모로 복합도심 전환이 추진되는 부산 북항 인근에서는 호반건설이 11월 '호반써밋 초량'(432가구) 분양을 앞두고 있다. 60조원 규모 반도체 시설 확충이 진행 중인 평택에서는 한화건설이 '한화포레나 지제역'(1098가구) 공급을 계획하고 있으며, 약 1만8000가구 규모로 조성되는 인천 계양신도시에서는 반도건설이 '계양신도시 카이브 유보라'(1110가구) 분양을 추진한다.","url":"https://www.fnnews.com/news/202610201833207719"},{"n":14,"title":"'용인반도체 라온프라이빗' 564가구 분양","meta":"2026.10.20 18:00 · 한국경제","body":"라온이 경기 용인시에 지상 20층, 7개동, 564가구 규모의 '용인반도체 라온프라이빗'을 선보인다. 단지는 보행자 중심 설계와 중앙 잔디광장을 갖췄으며, 분양가 상한제 적용 대상으로 SK하이닉스 반도체 생산시설과 가깝다는 입지가 강점으로 꼽힌다. 라온은 같은 시기 서울 중랑구에서도 아파트 176가구와 오피스텔 74실로 구성된 별도 단지를 선보이며, 지하철과 향후 개통 예정인 GTX-B 노선 접근성을 내세우고 있다.","url":"https://hankyung.com/article/2026102039531"}]},{"name":"논설/사설","articles":[{"n":15,"title":"[사설] 李 \"공급 전격전\"…전월세난 키운 '토허제'도 손볼 때다","meta":"2026.10.21 00:07 · 서울경제","body":"이재명 대통령이 국무회의에서 기존의 관행과 절차에 얽매이지 말라며 주택 공급 가속화를 지시한 데 대해, 사설은 정부가 2030년까지 수도권에 150만 가구 착공을 목표로 하면서도 최근 5년간 인허가를 받은 공공분양의 66%가 아직 착공하지 못한 현실을 지적했다. 공급 확대 의지만으로는 부족하며 토지거래허가제(토허제) 재검토가 함께 이뤄져야 한다고 주장한다. 현재 서울 전역과 경기 15곳이 토허구역으로 지정돼 있는데, 이것이 임대 매물 공급을 제약해 전월세난을 악화시키고 있다는 것이다. 서울시장과 경기도지사도 토허제 해제를 촉구한 만큼 정부가 이제는 응답할 때라고 강조했다.","url":"https://m.sedaily.com/article/20104010"}]}]},{"date":"2026-10-20","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"李대통령 \"부동산, 2028년 넘어서부터 공급 정상화될 것\""},{"n":4,"text":"정부는 '안정론', 시장은 '상승세'...서울 집값 어디로"},{"n":8,"text":"현대건설, 목동10단지 재건축 수주...목동 첫 '디에이치'"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"李대통령 \"부동산, 2028년 넘어서부터 공급 정상화될 것\"","meta":"2026.10.19 17:53 · 머니투데이","body":"이재명 대통령은 19일 부동산 공급이 2028년 이후부터 정상화될 것이라고 밝혔다. 그는 \"부동산을 방치하면 언젠가는 사고가 난다\"며 공급 감소에 따른 시장 충격에 대비해야 한다고 말했다. 집값을 잡으려고 세금을 올렸다거나 세수 확보를 노린 것이라는 주장은 사실이 아니라고 선을 그었다. 공급이 줄며 시장이 이를 감당하지 못하는 상황이 전월세 불안의 근본 원인이라는 설명이다.","url":"https://www.mt.co.kr/politics/2026/10/19/2026101917525542249"},{"n":2,"title":"김은혜 \"10·15 대책에 경기 집값 최대 20% 급등\"...추미애 \"해제 건의\"","meta":"2026.10.19 19:07 · 뉴스1","body":"국회 국토교통위원회의 경기도 국정감사에서 국민의힘 김은혜 의원이 10·15 부동산 대책 시행 1년 만에 경기도 아파트값이 평균 6.6%, 규제지역 12곳 중 11곳은 최대 20% 넘게 올랐다고 지적했다. 전세 매물도 지난해 2만853건에서 올해 1만2328건으로 반토막 났다며 규제 해제를 건의해야 한다고 주장했다. 추미애 경기도지사는 토지거래허가제가 투기 수요 억제에는 도움이 되지만 가격 상승을 누르는 효과는 제한적이라며, 남양주·광주 등 일부 지역은 연말 이후 해제를 정부에 건의하고 있다고 답했다.","url":"https://www.news1.kr/local/gyeonggi/6324901"}]},{"name":"시장동향","articles":[{"n":4,"title":"정부는 '안정론', 시장은 '상승세'...서울 집값 어디로","meta":"2026.10.19 14:18 · 핀포인트뉴스","body":"서울 아파트값은 지난해 2월부터 88주 연속 상승을 이어가고 있지만 지역별 온도차는 더 커지고 있다. 강남·서초·송파 등 강남3구는 하락세를 이어가는 반면, 중랑구(0.42%)와 성북구(0.41%) 등 외곽 지역은 오히려 상승폭이 확대됐다. 정부는 3~8월 주택 인허가 물량이 전년 대비 74% 늘었고 매물도 30% 증가했다며 시장 안정을 전망했다. 하지만 실제로는 강남권의 하락세가 서울 전역으로 확산되지 않고 있어 정부 진단과 시장 체감 사이의 온도차가 이어지고 있다.","url":"https://www.pinpointnews.co.kr/news/articleView.html?idxno=496506"},{"n":5,"title":"3개월 만에 규제 약발 '뚝'...동탄·기흥·구리 집값 다시 들썩","meta":"2026.10.20 07:17 · 데일리안","body":"정부가 지난 6월 경기 구리, 화성 동탄, 용인 기흥을 규제지역으로 지정한 지 3개월여 만에 세 지역 모두 아파트값 상승폭이 다시 확대되고 있다. 10월 둘째 주 기준 구리 아파트값은 전주 대비 0.43% 올라 토지거래허가구역 지정 이후 14주 만에 최고 상승률을 기록했고, 화성 동탄구도 0.66% 올라 7월 둘째 주 이후 가장 높은 상승률을 보였다. 거래량은 급감했지만 가격은 계속 오르는 상황으로, 전세 매물 부족에 따른 매수 전환 수요와 인접 지역으로의 풍선효과가 원인으로 지목된다.","url":"https://www.dailian.co.kr/news/view/1703156/3%EA%B0%9C%EC%9B%94-%EB%A7%8C%EC%97%90-%EA%B7%9C%EC%A0%9C-%EC%95%BD%EB%B0%9C-%E2%80%98%EB%9A%9D%E2%80%99%EB%8F%99%ED%83%84%EA%B8%B0%ED%9D%A5-2026"}]},{"name":"정비사업","articles":[{"n":8,"title":"현대건설, 목동10단지 재건축 수주...목동 첫 '디에이치'","meta":"2026.10.19 12:32 · 한국경제","body":"현대건설이 목동10단지 재건축 시공사로 최종 선정됐다. 기존 2160가구를 최고 40층, 총 4248가구 규모로 재건축하는 사업으로 공사비는 약 2조6136억원이다. 현대건설은 하이엔드 주거 브랜드 '디에이치'를 목동에 처음 적용해 '디에이치 목동 에세르'로 이름 짓기로 했으며, 이번 수주로 목동신시가지 14개 단지 중 처음으로 재건축 시공권을 확보했다. 현대건설의 올해 도시정비 누적 수주액은 12조7315억원을 기록했다.","url":"https://www.hankyung.com/article/2026101905136"},{"n":9,"title":"삼성물산, 여의도 시범아파트 재건축 수주...'래미안 소넬리'로","meta":"2026.10.19 17:29 · 한국경제","body":"삼성물산이 여의도 시범아파트 재건축 시공사로 선정돼 2조2685억원 규모 사업을 수주했다. 한국자산신탁이 사업시행자인 이 사업은 지하 6층~지상 최고 59층, 18개동, 총 2480가구 규모로 조성되며, 삼성물산은 새 단지명으로 '래미안 소넬리'를 제안했다. 글로벌 건축설계사 OMA와 협업해 기존 21개동의 격자형 배치를 18개동으로 줄이고, 한강 조망 세대를 기존 1616세대에서 2032세대로 늘렸다. 1971년 준공돼 국내 고층 주거문화의 효시로 꼽히는 여의도 시범아파트가 반세기 만에 새로운 랜드마크로 탈바꿈하게 됐다.","url":"https://www.hankyung.com/article/2026101913681"}]},{"name":"금융/세제","articles":[{"n":11,"title":"이찬진 금감원장 \"가계대출 총량규제, 직접적 규제 조항 없다\"","meta":"2026.10.19 17:34 · 뉴스핌","body":"19일 국정감사에서 국민의힘 조정훈 의원은 금융감독원의 가계대출 총량규제가 법적 근거 없는 월권행위라고 지적했다. 이찬진 금융감독원장은 \"직접적인 규제 조항은 없는 것 같다\"고 답했다. 금융위원회도 법적 근거가 없으며 은행이 자율적으로 설정하는 것이라고 답변했으나, 조 의원은 당국이 사실상 은행에 지시를 내리는 것 아니냐며 강하게 문제를 제기했다.","url":"https://www.newspim.com/news/view/20261019001404"},{"n":12,"title":"해킹 사태에 가계부채까지...국감 출석한 5대 은행장 '진땀'","meta":"2026.10.19 17:50 · 데일리안","body":"KB국민·신한·하나·우리·NH농협 등 5대 은행장이 19일 국회 정무위원회 국정감사에 출석해 최근 발생한 해킹 보안 사고에 대해 사과했다. 여야 의원들은 \"첫 침입 후 최종 확인까지 80시간\"이 걸린 늑장 대응을 질타했고, 가산금리 인하 경쟁에 따른 풍선효과와 구두 지시로 이뤄지는 비공식적 가계대출 총량 규제도 도마에 올랐다. 금융지주의 폐쇄적 지배구조와 경영진의 '셀프 정년 연장' 의혹도 집중 추궁됐다.","url":"https://dailian.co.kr/news/view/1703342/2026-%EA%B5%AD%EA%B0%90-%EB%B3%B4%EC%95%88-%EA%B5%AC%EB%A9%8D-%EA%B0%80%EA%B3%84%EB%B6%80%EC%B1%84%EA%B9%8C%EC%A7%80-2026"}]},{"name":"임대주택","articles":[{"n":13,"title":"전월세 불안에 '양도세 카드'...이형일 \"임대아파트 공공 매각 땐 추가 감면 검토\"","meta":"2026.10.19 10:00 · 뉴스핌","body":"이형일 부총리 겸 기획재정부 장관은 조정대상지역 매입임대아파트를 한국토지주택공사 등 공공부문에 매각할 경우 양도소득세를 추가 감면하는 방안을 검토 중이라고 밝혔다. 임대사업자의 매각 어려움과 세입자의 전월세 불안을 동시에 해소하려는 취지다. 임대 등록이 자동으로 말소되는 물량은 6만3000호에 달하며, 구체적인 감면 폭과 매입 대상 기관은 추후 결정될 예정이다.","url":"https://www.newspim.com/news/view/20261019000219"},{"n":14,"title":"경기 GH, 전세사기 피해자 예방 교육...보증금 회수 절차 안내","meta":"2026.10.19 13:38 · 중도일보","body":"경기주택도시공사(GH)가 운영하는 경기도 전세피해 및 예방지원센터가 19일 안산문화재단에서 올해 마지막 순회 전세사기 피해 예방 교육을 열었다. 센터는 올해 네 차례에 걸쳐 전세사기 피해자 500여 명을 대상으로 법률교육을 진행했으며, 이번 교육에서는 소송·강제집행부터 경·공매 절차, 배당표 분석까지 보증금 회수에 필요한 법률 지식을 안내했다. 다만 교육 참여 인원만으로 실제 피해 회복 정도를 판단하기는 어려우며, 계약 단계의 위험 감소와 사후 지원 연계까지 종합적으로 이뤄져야 한다는 지적도 나온다.","url":"https://www.joongdo.co.kr/web/view.php?key=20261019010005120"}]},{"name":"택지/도시개발","articles":[{"n":15,"title":"용산공원 빗장 풀리나...여권發 '주택용지 활용' 입법 봇물","meta":"2026.10.19 18:27 · 파이낸셜뉴스","body":"국토교통부와 서울시의 협의가 교착 상태에 빠진 가운데, 여당 의원들이 용산공원 본체 부지 일부를 주택용지로 활용하는 법안을 잇따라 발의하고 있다. 김남근·박민규 의원은 공원 조성 대상에서 일부 부지를 제외하거나 택지로 활용하는 용산공원 특별법 개정안을 각각 대표 발의했고, 차규근 의원도 지난 8월 비슷한 안을 내놓았다. 그러나 오세훈 서울시장은 토양 오염 정화에만 최소 3~7년이 걸린다며 반대 입장을 유지하고 있어, 2007년 제정된 특별법의 '공원 외 용도 금지' 원칙이 실제로 깨질지는 미지수다.","url":"https://www.fnnews.com/news/202610191827531737"},{"n":16,"title":"하남시의장 \"교산신도시 입주 전 교통대책 마련해야\"","meta":"2026.10.19 16:48 · 아시아투데이","body":"하남시의회 정병용 의장이 19일 하남 교산신도시 A2블록 입주예정자들과 간담회를 열었다. 이 자리에서는 교통 혼잡, 대중교통 접근성, 자녀 전학 문제 등이 주요 논의 사항으로 다뤄졌다. 정 의장은 주택 공급과 교통 인프라 조성이 균형 있게 추진돼야 한다며 입주 전 교통대책 마련의 필요성을 강조했다.","url":"https://www.asiatoday.co.kr/kn/view.php?key=20261019010006089"}]},{"name":"주택품질/안전","articles":[{"n":17,"title":"\"10억짜리 집 맞아?\"...발코니 붕괴 아파트, 이번엔 물난리","meta":"2026.10.20 05:42 · 이데일리","body":"지난 8월 발코니 구조물 붕괴 사고가 있었던 인천 송도국제도시 럭스오션SK뷰 아파트에서 폭우로 100여 가구가 침수 피해를 입었다. 입주민들은 창문을 닫아도 빗물이 유입됐다며 창호 설계나 시공 과정의 문제를 의심하고 있다. 2025년 3월 입주를 시작한 이 신축 아파트는 SK에코플랜트가 시공했으며, 누수 문제가 수차례 보수에도 해결되지 않아 왔다고 입주민들은 주장한다. 국토교통부와 인천시는 발코니 붕괴 사고 원인 규명을 위한 합동 사고조사위원회를 구성해 조사를 진행 중이다.","url":"https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=01935206645614888"}]},{"name":"분양정보","articles":[{"n":18,"title":"'산곡역자이힐스테이트&하늘채', 19일 특별공급 시작으로 청약 돌입","meta":"2026.10.19 15:11 · 헤럴드경제","body":"GS건설·현대건설·코오롱글로벌 컨소시엄이 공급하는 인천 부평구 산곡동의 '산곡역자이힐스테이트&하늘채'가 19일 특별공급을 시작으로 청약 일정에 들어갔다. 지하 3층~지상 최고 33층, 20개동, 총 2706가구 규모의 대단지로 지하철 7호선 산곡역 인근 역세권 입지를 갖췄다. 계약자에게는 인덕션, 시스템에어컨, 식기세척기 등을 무상 제공하며, 입주는 2029년 12월 예정이다. 견본주택은 개관 나흘 만에 약 2만7000명이 방문할 정도로 수요자 관심이 높았다.","url":"https://biz.heraldcorp.com/article/10907420"}]},{"name":"논설/사설","articles":[{"n":20,"title":"[사설] '전국적인 전세난?' 국토부의 이상한 진단","meta":"2026.10.20 04:01 · 머니투데이","body":"국토교통부가 최근 전·월세난을 공급 부족에 따른 전국적 현상이라고 진단한 데 대해, 이 사설은 10·15 부동산 대책의 부작용을 외면하는 처사라고 지적한다. 국토부는 지방 4대 광역시 아파트 전월세 매물이 1년 전보다 33% 감소한 점을 근거로 들었지만, 실제로는 규제지역 내 임대사업자들이 세입자를 내보내고 보유 주택을 매물로 내놓은 것이 더 근본적인 원인이라고 반박한다. 서울 아파트 전셋값은 10·15 대책 이후 1년간 가파르게 올랐고 전세 매물도 크게 줄어든 상태다. 사설은 신규 주택 공급 확대와 함께 규제 완화 등 명확한 해법을 제시하는 것이 시급하다고 주문한다.","url":"https://www.mt.co.kr/opinion/2026/10/20/2026101915295542020"}]}]},{"date":"2026-10-19","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"국토부, 月 2회 주택 공급 브리핑 하기로…올해 23만호 첫 삽 뜬다"},{"n":3,"text":"국토부 \"강남 집값 떨어지고 매물 쌓여…시장 하향 안정 신호\""},{"n":7,"text":"[단독] 여의도 '래미안 벨트' 윤곽…삼성물산, 2.2조 시범아파트 재건축 시공사 선정"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"국토부, 月 2회 주택 공급 브리핑 하기로…올해 23만호 첫 삽 뜬다","meta":"2026.10.16 16:00 · 뉴데일리","body":"국토교통부가 이달부터 매월 2회 주택 공급 정례 브리핑을 실시하기로 했다. 10월 둘째 주 기준 수도권에서 3기 신도시 7300호를 포함해 총 9만9000호가 착공했으며, 연말까지 21만8000~23만5000호 착공을 목표로 한다. 공공분양은 3기 신도시 2000호를 포함해 1만호, 공공임대는 5000호 이상 입주자를 모집할 계획이다. 국토부는 매월 브리핑을 통해 착공·분양·입주 실적과 향후 공급 계획을 공개해 시장 예측 가능성을 높이겠다고 밝혔다.","url":"https://biz.newdaily.co.kr/site/data/html/2026/10/16/2026101600185.html"},{"n":2,"title":"김이탁 국토차관·김성보 서울시 부시장부터 회동…정비사업 완화·주택공급 협의 재개","meta":"2026.10.16 11:22 · 헤럴드경제","body":"국토교통부와 서울시가 국정감사 종료 후 김이탁 국토1차관과 김성보 서울시 부시장 간 회동을 시작으로 정비사업 규제완화·주택공급 협의를 재개했다. 서울시는 민간 정비사업 용적률 완화, 조합원 지위 양도 제한 완화, 임대주택 의무비율 완화 등을 국토부에 요구할 방침이다. 다만 용산공원 부지를 주택공급 후보지로 활용하는 방안을 두고는 입장이 엇갈린다. 국토부는 미군 반환 부지 활용을 검토 중이나 서울시는 용산공원특별법 취지에 어긋난다며 반대하고 있고, 환경오염 정화에만 최소 3~7년이 걸린다는 점도 걸림돌로 꼽힌다.","url":"https://biz.heraldcorp.com/article/10904917"}]},{"name":"시장동향","articles":[{"n":3,"title":"국토부 \"강남 집값 떨어지고 매물 쌓여…시장 하향 안정 신호\"","meta":"2026.10.18 16:10 · 파이낸셜뉴스","body":"국토교통부는 서울 강남구·서초구 아파트값이 10주 연속 하락하고 매물이 쌓이는 등 시장에 하향 안정 신호가 나타나고 있다고 평가했다. 9월 아파트 매매가격은 강남 -1.65%, 서초 -1.25%, 송파 -0.45%를 기록했고, 서울 아파트 매매거래량은 5월 8900건에서 8월 4600건으로 줄었다. 매매 매물은 10월 둘째 주 기준 약 7만4000건으로 연초 대비 30% 늘었고, 갭투자 거래 비중은 지난해 10월 37.9%에서 올해 8월 6.1%로 급감했다. 정부는 2028년부터 3기 신도시 입주가 본격화하면 중장기적으로 주택 수급 여건이 개선될 것으로 내다봤다.","url":"https://www.fnnews.com/news/202610181610353388"},{"n":4,"title":"경기 상급지 이동 수요에…분당 상승률 1위","meta":"2026.10.18 16:55 · 한국경제","body":"한국부동산원 집계에 따르면 10월 둘째 주 경기 성남 분당구가 전국 시·군·구 중 아파트 매매가격 상승률 1위(0.79%)를 기록했다. 1기 신도시 재건축 기대감에 수원·동탄 등에서 분당으로 옮기려는 '상급지 이동' 수요가 겹친 영향으로 풀이된다. 뒤이어 군포(0.72%), 수원 영통(0.69%), 화성 동탄(0.66%), 광명(0.62%) 순으로 상승폭이 컸고, 경기 전체 아파트값은 0.26% 올라 약 4년 11개월 만에 최대 상승폭을 기록했다. 서울에서는 재건축 추진 단지인 신현대12차가 88억원에 거래되며 최고가를 경신했다.","url":"https://www.hankyung.com/article/2026101887721"}]},{"name":"정비사업","articles":[{"n":7,"title":"[단독] 여의도 '래미안 벨트' 윤곽…삼성물산, 2.2조 시범아파트 재건축 시공사 선정","meta":"2026.10.16 23:25 · 청년일보","body":"삼성물산이 공사비 약 2조1616억원 규모의 서울 영등포구 여의도 시범아파트 재건축사업 시공사로 선정됐다. 영등포구의 사업시행계획 인가가 난 지 사흘 만에 시공사가 결정됐으며, 지하 6층~지상 최고 59층, 21개 동, 2491가구 규모로 지어질 예정이다. 삼성물산은 앞서 수주한 대교·목화아파트에 이어 여의도에서 세 번째 사업을 확보하며 올해 도시정비 누적 수주액이 9조5000억원에 육박하게 됐다.","url":"https://youthdaily.co.kr/news/article.html?no=228480"},{"n":8,"title":"'압구정 터줏대감' 갤러리아명품관, 40여 년 만에 새 옷 입는다…재건축 허가","meta":"2026.10.16 16:01 · 이투데이","body":"서울 강남구는 10월 15일 압구정동 갤러리아명품관 서관(WEST) 재건축사업에 건축허가를 내줬다. 1979년 준공된 서관(47년 경과)과 1985년 준공된 동관(41년 경과)을 포함해 영업면적을 기존 약 2만9091㎡에서 5만9504㎡ 이상으로 두 배 넘게 확대하는 계획이다. 설계에는 세계적 건축설계사무소 헤더윅 스튜디오의 곡선형 파사드가 적용돼 모래시계를 연상시키는 외관으로 조성된다. 다만 이번 건축허가가 곧바로 착공을 뜻하는 것은 아니며, 실시설계와 환경영향평가·재해영향평가 등 후속 인허가 절차를 거쳐야 한다.","url":"https://www.etoday.co.kr/news/view/2636772"}]},{"name":"금융/세제","articles":[{"n":10,"title":"\"집값 따라가기 벅차\"…10명 중 3명, 주담대 2억 이상 빌렸다 '역대 최고'","meta":"2026.10.18 07:01 · 파이낸셜뉴스","body":"한국은행이 국회에 제출한 자료에 따르면 올해 2분기 말 기준 은행·비은행권 주택담보대출 차주 가운데 대출 잔액이 2억원 이상인 비중이 30.2%로 역대 최고치를 기록했다. 서울과 수도권을 중심으로 집값이 오르면서 주택 구입에 필요한 자금 규모가 커져 '주담대 고액화' 현상이 뚜렷해지고 있다는 분석이다. 금융당국은 은행권 주담대 위험가중치 추가 인상 여부도 시장 상황을 지켜보며 검토하겠다는 입장이다. 현재 수도권·규제지역 주택구입 목적 주담대 한도는 시가 15억원 이하 최대 6억원, 15억원 초과~25억원 이하 4억원, 25억원 초과 2억원이다.","url":"https://www.fnnews.com/news/202610180701302749"},{"n":11,"title":"고금리에 얼어붙은 내 집 마련…정책대출로 살 수 있는 아파트는","meta":"2026.10.18 16:07 · 한국경제","body":"서울 아파트값이 88주 연속 오르는 가운데 고금리로 내 집 마련 부담이 커지면서 실수요자들이 저금리 정책대출로 눈을 돌리고 있다. 올해 1~9월 서울 아파트 거래 중 9억원 이하 거래 비중은 지난해 같은 기간 40.47%에서 49.0%로 8.53%포인트 상승했다. 전체 거래량은 5만3611건으로 전년 동기 대비 19.2% 줄었지만, 6억원 이하 거래는 1만2306건으로 5.4% 늘며 비중이 17.59%에서 22.95%로 커졌다. 시중은행보다 낮은 금리의 버팀목 전세자금대출 등 정책대출이 신혼부부와 20·30대 실수요자의 주요 대안으로 떠오르고 있다.","url":"https://www.hankyung.com/article/202610188720i"}]},{"name":"임대주택","articles":[{"n":12,"title":"전월세난 대응…내년 말까지 수도권 공적주택 10만가구 입주 추진","meta":"2026.10.16 16:00 · 뉴스1","body":"국토교통부는 전월세난에 대응해 올해 4분기부터 내년 말까지 수도권에 공적주택 10만가구를 입주시키겠다고 밝혔다. 유형별로는 공공분양 9000가구, 건설임대 8000가구, 매입임대 2만9000가구, 전세임대 4만5000가구, 공공지원 민간임대 5000가구 등으로 구성된다. 오는 12월 인천 계양을 시작으로 3기 신도시 입주도 본격화한다. 김이탁 국토1차관은 \"주택시장 수급 불안을 완화해 시장 안정을 기대한다\"고 말했다.","url":"https://www.news1.kr/realestate/general/6322455"},{"n":13,"title":"월세 거래 비중 '70%' 선 뚫었다","meta":"2026.10.18 17:00 · 비즈워치","body":"KB금융지주 경영연구소의 'KB주택시장리뷰-2026년 10월호'에 따르면 8월 전국 주택 월세 거래 비중이 70%까지 상승했다. 전체 전월세 거래 19만9204건 중 13만9455건이 월세로, 전월 대비 전체 거래량은 5.6% 줄었지만 전세 거래량만 12.7% 급감한 영향이 컸다. KB경영연구소는 \"임대물량 부족과 보증금 마련 부담으로 초기 목돈이 적게 드는 월세를 선택하는 경향이 지속되고 있다\"고 설명했다. 서울의 매수우위지수는 69.5로 전주보다 3.8포인트 하락해 매수심리도 위축되는 모습이다.","url":"https://news.bizwatch.co.kr/article/real_estate/2026/10/16/0028"}]},{"name":"택지/도시개발","articles":[{"n":14,"title":"'3억대' 내 집 마련…'3기신도시 첫 입주' 계양신도시 미래가치는","meta":"2026.10.18 13:11 · 머니투데이","body":"한국토지주택공사(LH)는 3기 신도시 중 처음으로 입주를 앞둔 인천 계양신도시 A2·A3블록 입주자 모집에 나섰다. A2블록은 10월 17일부터 특별공급·일반공급 순으로 18일까지 청약을 접수하며, 평균 공급가격은 59형 호당 4억1000만원, 74형 5억1000만원, 84형 5억7000만원 수준이다. 입주 예정 시기는 3기 신도시 중 가장 빠른 2026년 12월로, 계양신도시는 인천 계양구 일원 약 335만㎡에 약 1만8000가구 규모로 조성된다. 당첨자는 10월 31일 발표될 예정이다.","url":"https://www.mt.co.kr/estate/2026/10/18/2026101613110380031"}]},{"name":"주택품질/안전","articles":[{"n":15,"title":"목포 아파트 11층서 창호 교체하던 50대…사다리차서 추락해 숨져","meta":"2026.10.16 16:23 · 서울신문","body":"10월 16일 낮 12시 56분쯤 전남 목포시 상동의 한 아파트 11층에서 창호 교체 작업을 하던 50대 남성이 사다리차에서 추락해 숨졌다. 경찰은 사다리차 지지대가 지면에 제대로 고정되지 않아 작업대가 흔들리면서 사고가 난 것으로 보고 조사 중이다. 숨진 남성은 응급대원이 현장에 도착했을 당시 이미 심정지 상태였으며, 해당 창호 교체 업체의 사업주였던 것으로 확인됐다.","url":"https://seoul.co.kr/news/society/2026/10/16/20261016500233"}]},{"name":"분양정보","articles":[{"n":16,"title":"서울 아파트 일반분양 1만가구 돌파…작년 3배 수준","meta":"2026.10.18 11:19 · 머니투데이","body":"부동산 플랫폼 직방 조사에 따르면 올해 서울 아파트 일반분양 예상 물량은 1만887가구로 지난해(3979가구)보다 약 2.7배 늘었다. 서울 아파트 일반분양 물량은 2021년 2902가구에서 2024년 1만120가구까지 늘었다가 지난해 급감했는데, 올해는 미뤄졌던 물량이 풀리고 주요 재건축 단지들이 분양에 나서며 다시 늘었다. 지난 4월 분양한 아크로 서초는 평균 1099.1대 1의 청약 경쟁률을 기록해 2015년 이후 서울 민간 아파트 단지 중 최고 수준을 보였다. 다만 전문가들은 물량이 늘었어도 여전히 공급 갈증이 해소되기에는 부족하다고 평가한다.","url":"https://news.mtn.co.kr/article/2026101811191935331"},{"n":17,"title":"[분양캘린더] 10월 넷째 주 13개 단지 청약…6734가구 공급","meta":"2026.10.17 08:00 · 뉴스1","body":"10월 넷째 주(17~24일) 전국 13개 단지에서 오피스텔·공공지원 민간임대·조합원 취소분을 포함해 총 6734가구가 청약을 받는다. 수도권에서는 인천 부평구 '산곡역자이힐스테이트&하늘채' 1289가구, 경기 성남시 '힐스테이트 성남메트로블' 189실 등이 공급된다. 지방에서는 충남 아산시 '아산 그랑시티필하우스' 1380가구, 충북 청주시 '청주 가경 아이파크 7·8단지' 1671가구 등이 분양에 나선다. 이번 주 인천에서는 견본주택 1곳이 새로 문을 연다.","url":"https://www.news1.kr/realestate/general/6322702"}]},{"name":"논설/사설","articles":[{"n":19,"title":"[사설] 서울 집값 상승, 획기적 공급 대책 나오지 않으면 멈추지 않을 것","meta":"2026.10.16 16:30 · 파이낸셜뉴스","body":"올해 주택 착공 목표(26만8000가구) 대비 실적은 37%(9만9000가구)에 그쳤고, 공공주택 진도율은 26%, 민간 정비사업은 목표의 24%에 머물렀다고 지적했다. 그 사이 서울 아파트값은 88주 연속 올랐다며, 수요억제책만으로는 시장 안정에 한계가 있다고 평가했다. 신규 공급 확대와 인허가 절차 간소화 등 획기적인 대책이 뒤따르지 않으면 집값 상승세가 쉽게 꺾이지 않을 것이라고 주장했다.","url":"https://fnnews.com/news/202610161329255322"}]}]},{"date":"2026-10-16","count":15,"pdf_count":18,"highlights":[{"n":1,"text":"수도권 공공주택 착공 27%에 그쳐…총리·국토장관·LH사장까지 현장 점검"},{"n":3,"text":"숨 고르던 서울 아파트값 다시 상승폭 확대…분당·군포 등 경기 남부 강세"},{"n":7,"text":"오세훈, 국감서 \"조합원 지위 양도 제한 3년 풀어야\"…용산공원 주택공급엔 반대"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"수도권 공공주택 착공 27%에 그쳐…총리·국토장관·LH사장까지 현장 점검","meta":"2026.10.15 10:43 · 글로벌이코노믹","body":"올해 3분기까지 수도권 공공주택 착공 물량이 약 1만7000가구로 연간 목표 6만2000가구의 27.4%에 그친 것으로 나타났다. 목표 달성을 위해서는 4분기에만 약 4만5000가구를 착공해야 하는 상황이다. 이에 홍지선 국토교통부 장관은 서울 마포구 신축 매입임대주택 현장을 찾아 \"인허가가 착공으로, 착공이 입주로 이어지도록 속도를 더 높이겠다\"고 말했다. 한성숙 국무총리도 수원 재개발 현장을 점검하며 이해관계자 간 협력을 강조했고, 이성훈 LH 사장은 고양창릉 신도시를 찾아 공급 속도 확대를 주문했다.","url":"https://www.g-enews.com/article/Real-Estate/2026/10/2026101510050066802aa6f4cdad_1"},{"n":2,"title":"조정훈 의원 \"10·15대책 1년, 서울 집값 88주 연속 상승…규제만으로 못 잡아\"","meta":"2026.10.15 16:23 · 뉴스핌","body":"국민의힘 조정훈 의원은 정부의 10·15 부동산 대책 발표 1년을 맞아 서울 아파트값이 88주 연속 상승했다며 정책 실효성을 지적했다. 그는 올해 8월까지 서울 주택 준공이 지난해보다 19% 줄었고, 8월 착공 물량은 80% 이상 급감했다는 수치를 근거로 들었다. 조 의원은 \"거래를 묶어두고 공급까지 막히니 가격이 내려갈 이유가 없다\"며 \"규제만으로는 집값을 잡을 수 없다\"고 주장했다. 그는 정부에 정책 기조 전환을 촉구했다.","url":"https://www.newspim.com/news/view/20261015001121"}]},{"name":"시장동향","articles":[{"n":3,"title":"숨 고르던 서울 아파트값 다시 상승폭 확대…분당·군포 등 경기 남부 강세","meta":"2026.10.15 16:11 · 서울신문","body":"한국부동산원 조사 결과 서울 아파트 매매가격이 전주보다 0.16% 올라 지난해 2월부터 88주째 상승세를 이어갔다. 강남3구는 약세를 지속했지만 용산구와 한강벨트 지역의 상승폭이 확대됐다. 경기 남부 지역은 특히 강세를 보여 성남 분당구가 0.79%, 군포시가 0.72%, 화성 동탄이 0.66% 올랐고, 동탄은 올해 누적 상승률이 20%를 넘었다. 전문가는 수원을 중심으로 한 경기 남부 가격 과열이 인근 지역으로 연쇄 확산되고 있다고 분석했다.","url":"https://www.seoul.co.kr/news/economy/estate/2026/10/15/20261015500229"},{"n":4,"title":"경기 집값 5년 만에 최대폭 상승…영통 찍고 군포·의왕까지 번졌다","meta":"2026.10.15 17:36 · 한국경제","body":"지난주(10월 12일 기준) 경기 아파트 매매가격이 0.26% 올라 2021년 11월 둘째 주(0.27%) 이후 가장 높은 상승률을 기록했다. 수원 영통에서 시작된 상승세가 군포, 의왕 등 인접 지역으로 확산되는 모습이다. 성남 분당(0.79%), 군포(0.72%), 의왕(0.60%) 등이 강한 오름세를 보였다. 전문가들은 삼성전자 관련 자금 유입과 구매력이 낮은 실수요자들이 수원 인근 지역으로 이동한 영향으로 분석했다.","url":"https://www.hankyung.com/article/2026101546451"}]},{"name":"정비사업","articles":[{"n":7,"title":"오세훈, 국감서 \"조합원 지위 양도 제한 3년 풀어야\"…용산공원 주택공급엔 반대","meta":"2026.10.15 18:11 · 한국경제","body":"오세훈 서울시장은 국회 행정안전위원회의 서울시 국정감사에서 주택 공급 확대 방안으로 \"조합원 지위 양도 제한을 한시적으로 3년만 해제해주면 조합 내 갈등 요소가 현저히 줄어든다\"고 제안했다. 분담금이나 이주비 부담이 큰 소유자가 부동산을 매각하고 매수자가 조합원 지위를 이어받도록 해 정비사업 속도를 높이려는 취지다. 아울러 서울 아파트값이 88주 연속 상승하는 가운데 민간임대사업자 지원 확대와 이주비 대출 규제 완화도 요청했다. 반면 정부가 검토 중인 용산공원 부지 내 주택공급 방안에 대해서는 \"용산공원특별법을 정면으로 거스르는 조치\"라며 반대 입장을 재확인했다.","url":"https://www.hankyung.com/article/2026101548131"},{"n":8,"title":"IPARK현산, 군포 금정역세권1구역 재개발 우선협상자 선정","meta":"2026.10.15 17:33 · 한국경제","body":"HDC현대산업개발이 경기 군포 금정역세권1구역 재개발사업의 우선협상 대상자로 선정됐다. HDC현대산업개발은 단지명으로 '아이파크 원 어센트'를 제안했으며, 재개발조합은 10월 24일 총회를 열어 시공사 선정을 의결할 예정이다. 이 단지는 지하 4층~지상 35층, 10개 동, 총 1137가구 규모로 조성되며 모든 가구를 남향으로 배치하는 판상형 설계가 적용된다. 최고층에는 수리산과 도심을 조망하는 스카이 커뮤니티가, 단지 중앙부에는 7200㎡ 규모의 광장이 들어설 예정이다.","url":"https://www.hankyung.com/article/2026101546521"}]},{"name":"금융/세제","articles":[{"n":10,"title":"9월 은행 가계대출 6000억원 증가 그쳐…주담대 증가폭도 둔화","meta":"2026.10.15 12:00 · 뉴스핌","body":"한국은행이 발표한 '2026년 9월 금융시장 동향'에 따르면 9월 은행 가계대출은 전월 대비 6000억원 증가해 1198조9000억원으로 집계됐다. 증가폭은 7월 5조5000억원, 8월 3조5000억원에서 9월 6000억원으로 계속 줄었고 전년 동월보다도 작은 수준이다. 주택담보대출은 전세거래 둔화와 입주물량 감소 등의 영향으로 2조9000억원 증가에 그쳤고, 전세자금대출은 9000억원 줄어 3개월 연속 감소했다. 반면 기업대출은 10조7000억원 늘었으며 대기업대출은 2022년 10월 이후 최대폭인 7조5000억원 증가했다.","url":"https://www.newspim.com/news/view/20261015000426"},{"n":11,"title":"9월 전 금융권 가계대출 2.2조 감소…작년 12월 이후 첫 순감","meta":"2026.10.15 13:41 · 한국경제TV","body":"금융위원회와 금융감독원에 따르면 9월 전 금융권 가계대출이 2조2000억원 감소해 지난해 12월 이후 처음으로 순감소를 기록했다. 국내 증시 하락에 따른 이른바 '빚투' 축소가 주요 요인으로, 신용대출 등 기타대출 증가폭이 전월 4000억원에서 3조원 감소로 돌아섰다. 은행권 가계대출은 6000억원 증가에 그쳤고 제2금융권은 2조8000억원 감소했다. 주택담보대출 증가폭도 함께 둔화된 것으로 나타났다.","url":"https://www.wowtv.co.kr/NewsCenter/News/Read?articleId=A202610150089"}]},{"name":"임대주택","articles":[{"n":12,"title":"[2026 국감] LH 매입임대주택 실적 '목표의 13.8%'…\"평가체제 손봐야\"","meta":"2026.10.15 15:41 · FETV","body":"국회 국토교통위원회 김남근 더불어민주당 의원이 LH로부터 제출받은 국정감사 자료를 분석한 결과, LH의 올해 매입임대주택 실적이 연간 목표 1만8340호 중 8월 말까지 2539호에 그쳐 목표의 13.8%에 불과한 것으로 나타났다. 호당 정부 지원단가가 2025년 기준 1억7000만원인 반면 실제 매입비는 3억2700만원에 달해 LH가 차액을 떠안고 있는 구조가 지적됐다. 매입심의 통과율도 33% 수준에 머물러 절차 지연 문제도 제기됐다. 김 의원은 지원기준 현실화와 평가체계 개선이 필요하다고 강조했다.","url":"https://www.fetv.co.kr/news/articleView.html?idxno=311830"}]},{"name":"택지/도시개발","articles":[{"n":13,"title":"공급대책 쏟아냈는데…수도권 착공·준공은 지지부진","meta":"2026.10.15 05:01 · 파이낸셜뉴스","body":"정부가 주택공급 대책을 잇따라 내놓고 있지만 수도권의 실제 착공·준공 실적은 좀처럼 살아나지 않고 있다. 올해 1~8월 수도권 착공은 8만6739가구로 전년 동기 대비 1.5% 늘어나는 데 그쳤고, 8월 한 달은 전월보다 30.3% 급감했다. 같은 기간 서울 준공량은 19.1%, 수도권 전체는 21.6% 줄었다. 올해 예상 입주량은 10만5000가구로 과거 10년 평균(18만3000가구)보다 42.6% 적은 수준이며, 전문가들은 신규 택지 조성뿐 아니라 기존 주택 거래 활성화와 민간 정비사업 지원 등 단기 대책이 필요하다고 지적했다.","url":"https://www.fnnews.com/news/202610150501417622"}]},{"name":"주택품질/안전","articles":[{"n":14,"title":"여수 아파트 5층서 화재…주민 8명 부상","meta":"2026.10.15 11:33 · 뉴스1","body":"전남소방본부에 따르면 10월 15일 오전 5시 52분쯤 전남 여수시 신기동의 한 아파트 5층에서 화재가 발생했다. 이 불로 주민 8명이 연기를 흡입하거나 대피 중 경상을 입은 것으로 파악됐다. 화재는 신고 약 30분 만인 오전 6시 20분쯤 완전히 진압됐다. 소방 당국은 정확한 화재 원인과 피해 규모를 조사하고 있다.","url":"https://www.news1.kr/local/gwangju-jeonnam/6321024"}]},{"name":"분양정보","articles":[{"n":15,"title":"'힐스테이트 거제' 1963가구 분양…19일 특별공급","meta":"2026.10.15 17:34 · 한국경제","body":"현대엔지니어링이 경남 거제시 옥포동에 짓는 '힐스테이트 거제'가 지하 7층~지상 최고 36층, 1963가구(전용 84~165㎡) 규모로 분양에 나선다. 옥포항 오션뷰와 실내 수영장·사우나·인도어 골프연습장 등 커뮤니티 시설을 갖췄고 초등학교·외국인학교가 인근에 있다. 청약은 19일 특별공급, 20일 1순위, 21일 2순위 순으로 진행되며 계약금을 5%로 낮추고 1차 계약금을 500만원 정액제로 적용한다. 전매 제한이 없다는 점도 특징이다.","url":"https://www.hankyung.com/article/2026101546461"},{"n":16,"title":"청주 가경 아이파크 7·8단지 등 전국 3곳 오늘 견본주택 개관","meta":"2026.10.16 06:00 · 이투데이","body":"리얼투데이에 따르면 10월 16일 전국 3곳에서 견본주택이 문을 열고 본격적인 분양에 들어간다. 부산 연제구 '연산센텀 월드메르디앙', 충남 아산시 '아산 그랑시티필하우스'와 함께 충북 청주시 흥덕구 가경동의 'HDC현대산업개발 청주 가경 아이파크 7·8단지'가 견본주택을 연다. 7단지 543가구, 8단지 1128가구 등 총 1671가구 규모이며 3.3㎡당 평균 분양가는 1578만원이다. 전용면적은 84㎡A·B형부터 102㎡, 116㎡형까지 구성돼 있다.","url":"https://supple.kr/news/cmva10ex90018cla6iijukczb"}]},{"name":"논설/사설","articles":[{"n":17,"title":"[사설] 집값 못잡고 시장 왜곡한 토허제 1년…원점서 재검토할 때","meta":"2026.10.15 17:38 · 한국경제","body":"한국경제는 사설에서 토지거래허가구역 확대와 투기과열지구 지정을 뼈대로 한 10·15 대책 시행 1년을 평가하며, 정부 의도와 달리 서울 아파트값이 역대 최장인 88주 연속 오르는 등 집값을 잡지 못했다고 지적했다. 정책 시행 후 서울 아파트 매매가는 10.6% 올랐고 성북·강서·구로 등 외곽 지역의 상승률이 더 가팔랐다는 점을 근거로 들었다. 2년 실거주 의무화로 전세 물건이 급감하며 전셋값이 오르고 서민 주거난이 심화됐다고 평가했다. 사설은 강남 일부 지역의 집값 억제에는 성공했지만 사유재산권 침해와 거주 이전의 자유 제한, 시장 왜곡 등 부작용이 크다며 정책의 단계적 완화를 주장했다.","url":"https://www.hankyung.com/article/2026101547691"},{"n":18,"title":"[사설] 10·15대책 1년, 이제 실패에서 배워야","meta":"2026.10.15 04:00 · 머니투데이","body":"머니투데이는 사설에서 정부의 10·15 부동산 대책이 시행 1년을 맞았지만 정책 목표 달성에 실패했다고 평가했다. 투기 수요 차단과 시장 안정이라는 당초 의도와 달리 서울 아파트 가격은 87주 연속 상승했고 전월세난은 더욱 심화됐다고 지적했다. 아파트 매물 부족 심화, 주택 준공 실적 20% 감소, 공공주택 착공 실적 저조, 대출 규제로 인한 외곽 아파트 가격 상승 등을 문제점으로 꼽았다. 사설은 막연한 기대보다 정책 결과를 재검토하고 출구 전략을 마련해 세입자 고통을 완화하고 규제를 완화할 필요가 있다고 제언했다.","url":"https://www.mt.co.kr/amp/opinion/2026/10/15/2026101415224878073"}]}]},{"date":"2026-10-15","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"약발 안 먹히는 고강도 규제… 주택공급 확대 '시험대'"},{"n":4,"text":"'규제의 역설' 부른 10·15 대책…서울 집값 1년 내내 올랐다"},{"n":7,"text":"IPARK현산, 금정역세권1구역 우선협상대상자 선정"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"약발 안 먹히는 고강도 규제… 주택공급 확대 '시험대'","meta":"2026.10.14 18:55 · 세계일보","body":"정부의 10·15 부동산 대책 시행 1년을 맞았지만 서울 아파트값은 87주 연속 상승하며 역대 최장 기록을 세웠다. 이에 정부는 수도권에 150만 호 이상의 주택 공급을 확대하겠다는 방침을 내세우고 있다. 그러나 실제 공급 실적은 부진해 올해 1~8월 서울의 주택 준공 실적은 전년 동기보다 19.1% 감소했다. 국토교통부 장관은 국정감사에서 \"100% 계획 물량을 확보하기는 어려울 것 같다\"고 밝혔다. 전문가들은 기존 주택의 유통 물량 확대와 민간 공급 확대가 함께 필요하다고 지적했다.","url":"https://www.segye.com/newsView/20261014520350"},{"n":2,"title":"정부, 청년·신혼부부 주거지원 확대…공공주택 57만호 공급","meta":"2026.10.14 14:00 · 이투데이","body":"정부가 인구전략위원회를 통해 국가인구전략 기본계획을 발표했다. 청년을 위한 '청년미래 보금자리론'을 신설해 최대 2.1%포인트의 금리 우대를 제공하고, 역세권 등 선호 지역에 공공주택 57만1000호를 공급하기로 했다. 신혼부부에게는 정책대출 소득요건을 완화하고, 결혼 후에도 공공임대주택 재계약을 허용하기로 했다. 미혼 청년이 결혼으로 소득·자산 기준을 초과해도 기존 계약을 유지할 수 있도록 한 것이 이번 계획의 특징이다.","url":"https://www.etoday.co.kr/news/view/2635612"}]},{"name":"시장동향","articles":[{"n":4,"title":"'규제의 역설' 부른 10·15 대책…서울 집값 1년 내내 올랐다","meta":"2026.10.15 06:00 · 뉴스핌","body":"정부의 10·15 주택시장 안정화 대책이 시행 1년을 맞은 가운데 서울 아파트값은 오히려 10.4% 상승해 규제 중심 정책의 한계를 드러냈다. 대출 규제와 토지거래허가구역 지정으로 강남권 고가주택 수요는 일부 억제됐지만, 상대적으로 부담이 낮은 비강남권으로 수요가 옮겨가며 풍선효과가 나타났다. 전셋값도 9.9% 올라 임대차시장 불안이 함께 심화됐다. 전문가들은 향후 정책이 수요 억제보다 공급 확대와 실수요자 보호에 초점을 맞춰야 한다고 지적했다.","url":"https://www.newspim.com/news/view/20261014001125"},{"n":5,"title":"광명·동탄·분당 사람 몰리더니…경기도 국평 5000만원 껑충","meta":"2026.10.14 08:41 · 한국경제","body":"올해 들어 9개월 사이 경기도 아파트값이 큰 폭으로 뛰었다. 국민평형(전용 84㎡)은 평균 4726만 원, 7.3% 올랐다. 두 자릿수 상승률을 보인 6개 지역은 모두 한강 이남에 위치했으며 광명시가 16.2%로 가장 높았고 성남시가 11.7%로 뒤를 이었다. 화성 동탄구는 15.6% 올라 국민평형 기준 1억2716만 원이 상승했다. 업계는 강남 접근성과 일자리 밀집이라는 두 요인이 맞물려 반도체 업종 고소득 근로자 수요가 동탄구와 용인 수지구 등 경기 남부에 몰린 결과라고 분석했다.","url":"https://www.hankyung.com/article/2026101402856"}]},{"name":"정비사업","articles":[{"n":7,"title":"IPARK현산, 금정역세권1구역 우선협상대상자 선정","meta":"2026.10.14 11:14 · 한국경제","body":"HDC현대산업개발의 아이파크가 경기 군포시 금정역세권1구역 재개발사업 우선협상대상자로 선정됐다. 조합은 단지명을 '아이파크 원 어센트'로 제시했다. 사업은 지하 4층~지상 35층, 10개 동, 1137가구 규모로 계획됐다. 시공사는 동 수를 기존 계획보다 2개 줄여 동 간 거리를 넓히고 전 가구를 남향으로 배치하는 설계 변경안을 제안했다. 이 단지는 지하철 1·4호선을 이용할 수 있고 향후 GTX-C 노선 개통도 예정돼 있다.","url":"https://www.hankyung.com/article/202610141050i"},{"n":8,"title":"성남 상대원동 재개발 '기지개'⋯3구역 본격화·2구역 정상화 모색","meta":"2026.10.15 06:00 · 이투데이","body":"성남시 중원구 상대원동 일대에서 대규모 재개발 사업이 본격화하고 있다. 가장 규모가 큰 상대원3구역은 8792가구 규모로 한국토지주택공사(LH)가 공공재개발 방식으로 추진 중이다. 상대원 1·3구역 생활권 재개발은 지난 8월 31일 정비구역 지정·고시를 마쳤고 2270가구를 조성할 예정이다. 시공권 분쟁으로 지연됐던 상대원2구역은 최근 법원이 DL이앤씨의 시공사 지위를 임시로 인정하면서 정상화 움직임을 보이고 있다. 상대원동 일대에서는 모두 약 1만6800가구가 공급될 예정이다.","url":"https://www.etoday.co.kr/news/view/2635209"}]},{"name":"금융/세제","articles":[{"n":10,"title":"토허제 '세 낀 매물' 주담대 더 많이 받고 사는 법","meta":"2026.10.14 08:57 · 한국경제","body":"토지거래허가구역에서는 무주택자가 세입자가 있는 아파트를 매수할 경우 2027년 말까지 실거주 의무를 유예받을 수 있다. 다만 세입자가 집을 비울 때 보증금 반환을 위한 생활안정자금 대출 한도는 1억 원으로 제한된다. 기사는 전세, 반전세, 월세 등 임대차 계약 형태에 따라 매수에 필요한 자기자금 규모가 달라진다고 설명했다. 매수자는 계약 형태별 자금 계획을 미리 세밀하게 점검해야 한다고 조언했다.","url":"https://www.hankyung.com/article/202610140385i"},{"n":11,"title":"전세사기 피해, 혈세로 메웠다... 악성 임대인 '먹튀' 보증금만 5조1,000여억","meta":"2026.10.15 04:30 · 한국일보","body":"주택도시보증공사(HUG)가 악성 임대인 대신 지급한 전세보증금 가운데 5조1241억 원을 아직 환수하지 못한 것으로 나타났다. 올해 8월까지 상습 채무불이행자 2559명에 대해 대위변제한 금액은 7조3866억 원에 이르지만, 이 중 69.3%가 미회수 상태이고 회수한 금액도 절반가량은 현금이 아닌 채권 형태다. 실제 현금으로 회수된 비율은 전체 대위변제액의 16% 수준에 그쳤다. 최근 5년간 정부가 HUG에 출자한 금액은 6조4000억 원에 달한다. 국회 국토교통위원회 김은혜 의원은 \"악성 임대인 재산 추적까지 포기하는 것은 혈세 낭비\"라고 지적했다.","url":"https://www.hankookilbo.com/news/article/A2026101415390003292"}]},{"name":"임대주택","articles":[{"n":13,"title":"[2026 국감] 유상범 \"LH 공공임대주택 화재 사망자 46%가 영구임대서 발생\"","meta":"2026.10.14 10:16 · 뉴스핌","body":"2020년부터 올해 9월까지 한국토지주택공사(LH) 공공임대주택에서 발생한 화재는 총 1142건으로 26명이 숨지고 232명이 다쳤다. 노후 주택이 많은 영구임대주택은 전체 임대 재고의 15.3%에 불과하지만 전체 사망자 26명 중 12명(46.2%)이 이곳에서 발생했다. 화재가 발생한 영구임대 109개 단지 가운데 106곳은 정확한 세대 위치를 특정하지 못하고 동·층 단위로만 알리는 노후 화재감지 설비를 사용하고 있는 것으로 조사됐다. 국회 국토교통위원회 유상범 의원은 관계 기관이 전수 점검과 설비 개선에 나서야 한다고 지적했다.","url":"https://www.newspim.com/news/view/20261014000379"},{"n":14,"title":"서울서 전세 구하기 '하늘의 별따기'.. 동대문·구로구 물량 50~60% 급감","meta":"2026.10.14 18:13 · 파이낸셜뉴스","body":"10·15 대책 시행 1년을 맞아 서울 임대차시장의 지역별 양상이 엇갈리고 있다. 강남권은 전월세 가격이 다소 내렸지만, 외곽 지역은 매물이 줄고 가격은 오히려 올랐다. 동대문구와 구로구의 전월세 물량은 각각 63.4%, 49.1% 줄었다. 마포구에서는 매매가 상승률은 둔화한 반면 전세 상승률이 1.30%에서 7.31%로 5배 이상 뛰었다. 한 공인중개사는 \"전세는 금방 나가지만 월세 물건이 늘었다\"며 집주인들의 월세 선호 현상이 가속화되고 있다고 전했다.","url":"https://www.fnnews.com/news/202610141813545195"}]},{"name":"택지/도시개발","articles":[{"n":15,"title":"서울 저층주거지 규제완화…용적률 최대 1.2배","meta":"2026.10.14 17:18 · 한국경제","body":"서울시가 노후 저층주거지 7곳을 특별건축구역으로 지정하는 '휴먼타운 2.0' 사업 대상지를 14일 발표했다. 대상지는 중랑구 망우동, 강북구 수유동 등 총 25만3874㎡ 규모다. 특별건축구역으로 지정되면 용적률, 건폐율, 높이 제한 등 5개 항목의 건축 규제가 완화되며, 설계 가이드라인을 충족하면 조례상 용적률의 최대 1.2배까지 적용받을 수 있다. 기존 대규모 정비사업과 달리 개별 필지 단위의 신축과 주택 개량을 지원하는 방식으로, 서울시는 기존 거리 구조와 동네 특성을 유지하면서 노후 주택 개선을 유도할 방침이다.","url":"https://www.hankyung.com/article/2026101420861"},{"n":16,"title":"서울시, 주택 31만 호 착공 속도전… 올해 3만 호 총력","meta":"2026.10.14 09:52 · 국토교통뉴스","body":"서울시가 2031년까지 주택 31만 호 착공 목표를 유지하겠다고 밝혔다. 올해 목표인 3만 호 가운데 현재까지 약 1만5000호가 착공해 목표의 절반가량을 채웠다. 서울시는 연내 남은 1만6117호의 착공을 앞당기기 위해 정비사업 조합 11곳, 시공사 5곳, 자치구 8곳이 참여하는 '주택공급 목표 달성 공동협력 협약'을 체결했다. 오세훈 서울시장은 \"주택 안정의 유일한 길은 시민이 눈으로 확인하고 체감할 수 있는 공급\"이라고 강조했다.","url":"https://guktonews.co.kr/9598"}]},{"name":"주택품질/안전","articles":[{"n":17,"title":"LH, 공동주택 하자 관리 강화… 공공임대 중대하자 3년새 87%↓","meta":"2026.10.14 10:07 · 머니투데이","body":"한국토지주택공사(LH)가 공동주택 품질관리를 강화한 결과를 14일 밝혔다. 공공분양·공공임대주택의 중대하자는 2022년 534건에서 지난해 71건으로 86.7% 줄었다. 다만 입주 후 접수되는 전체 하자 건수는 가구당 평균 기준으로 오히려 늘어난 것으로 나타났다. 주요 접수 사유는 도배(20%), 창호(18%), 바닥·가구(각 11%), 타일(9%) 순이었다. LH는 도배 하자를 줄이기 위해 보양 범위를 넓히고, 욕실 타일 시공은 습식에서 건식 공법으로 전환할 계획이라고 밝혔다.","url":"https://www.mt.co.kr/estate/2026/10/14/2026101409455247031"}]},{"name":"분양정보","articles":[{"n":18,"title":"\"국평 포기합니다\"…서울 청약 넣으려다 마음 바꾼 이유","meta":"2026.10.14 09:08 · 한국경제","body":"수도권 아파트 분양가가 1년 사이 22.2% 오르면서 청약시장의 구조가 바뀌고 있다. 서울 국민평형(전용 60~85㎡) 청약 비중은 지난해 35.5%에서 올해 11.5%로 급감했다. 자금 부담이 커진 실수요자들은 전용 60㎡ 이하 소형으로 몰리면서 소형 비중이 60.6%에서 79.8%로 늘었다. 반면 자산이 충분한 수요층은 희소성이 높은 전용 85㎡ 초과 대형에 몰리면서 실수요자는 소형, 고자산가는 대형으로 나뉘는 청약 양극화 현상이 나타나고 있다.","url":"https://www.hankyung.com/article/2026101403886"}]},{"name":"논설/사설","articles":[{"n":20,"title":"[사설]10·15대책 1년, 이제 실패에서 배워야","meta":"2026.10.15 04:00 · 머니투데이","body":"머니투데이는 사설에서 지난해 10·15 부동산 대책이 시행 1년을 맞았지만 애초 목표 달성에 실패했다고 평가했다. 서울 아파트값은 87주 연속 상승해 역대 최장 기록을 세웠고, 전셋값도 10월 첫째 주 기준으로 1년 전보다 9.96% 올라 매물 품귀가 심각한 수준이라고 지적했다. 같은 기간 서울과 수도권의 주택 공급은 약 20% 줄었고, 공급 주체인 LH 경영진이 집값 하락을 기대하는 듯한 태도를 보이면서 적극적인 공급 확대를 주저하게 만들었다고 비판했다. 사설은 막연한 가격 조정 기대에 기대기보다 정책 성과를 냉정히 점검하고, 대출 규제 완화와 정비사업 가속화 등 공급 확대 대책을 서둘러야 한다고 주문했다.","url":"https://www.mt.co.kr/opinion/2026/10/15/2026101415224878073"}]}]},{"date":"2026-10-14","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"오세훈 시장, 연내 3만호 착공 총력…정비사업 11곳 직접 챙긴다"},{"n":2,"text":"서울 핵심지 수요 몰리는데 공급은 외곽뿐…수급 불균형 지속 전망"},{"n":4,"text":"한성숙 총리, 수원 영통1구역 현장 찾아 재개발 신속 추진 당부"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"오세훈 시장, 연내 3만호 착공 총력…정비사업 11곳 직접 챙긴다","meta":"2026.10.13 14:59 · 아주경제","body":"오세훈 서울시장은 13일 서울시청에서 연내 착공 예정인 정비사업 조합 11곳, 시공사 5곳, 자치구 8곳과 '주택공급 목표 달성 공동협력 협약'을 체결했다. 서울시는 2031년까지 31만 가구 착공을 목표로 하고 있으며, 올해 집중 관리 중인 정비사업장 25곳 가운데 14곳 약 1만5000가구는 이미 착공을 마쳤다. 남은 11곳 1만6117가구에 대해서는 공사비 갈등과 인허가 지연 등 걸림돌을 자치구·조합·시공사가 함께 풀어 연내 첫 삽을 뜨도록 집중 관리하기로 했다.","url":"https://ajunews.com/view/20261013145434677"}]},{"name":"시장동향","articles":[{"n":2,"title":"서울 핵심지 수요 몰리는데 공급은 외곽뿐…수급 불균형 지속 전망","meta":"2026.10.13 11:07 · 뉴스핌","body":"뉴스핌은 13일 한국신용평가 분석을 인용해 정부의 세제 개편과 공급대책에도 서울과 광명·하남·성남 등 수도권 핵심지역은 실거주 수요에 따른 가격 상승 압력이 계속될 것이라고 전했다. 새 주택을 빠르게 공급하기 어려운 구조상 초고가 주택을 제외한 중저가 물량에 대한 수요가 이어질 것으로 분석됐다. 수도권 외곽에서 공공주택 2만7000가구 공급이 확대되더라도 수도권 내 지역 간 수급 불균형은 일정 수준 지속될 것으로 전망됐다.","url":"https://www.newspim.com/news/view/20261013000349"},{"n":3,"title":"규제지역 넓힌 '10·15 대책' 1년, 서울 집값 10% 오르고 외곽 전세는 반토막","meta":"2026.10.14 04:30 · 한국일보","body":"한국일보는 14일 지난해 서울 전역과 경기 12개 지역을 규제지역·토지거래허가구역으로 묶은 '10·15 대책' 시행 1년을 점검했다. 1년간 서울 아파트값은 10.42% 올랐고, 전세 매물은 2만4369건에서 2만520건으로 15.8% 줄었다. 강남3구는 상승폭이 저조했던 반면 성북구(15.52%), 강서구(13.78%) 등 도심 외곽은 강세를 보였고, 동대문구는 전세 매물이 69.4% 급감하는 등 가격대가 낮은 지역에서 공급 부족이 두드러졌다. 같은 기간 월세 가격도 12.4% 올라 전월세 품귀가 심화된 것으로 나타났다.","url":"https://www.hankookilbo.com/news/article/A2026101314120002265"}]},{"name":"정비사업","articles":[{"n":4,"title":"한성숙 총리, 수원 영통1구역 현장 찾아 재개발 신속 추진 당부","meta":"2026.10.13 18:06 · 경기신문","body":"한성숙 국무총리는 13일 수원시 영통구 영통1구역 재개발사업 현장을 방문해 신속한 추진을 당부했다. 영통1구역은 2017년 정비구역으로 지정된 뒤 2025~2026년 주민 이주를 마치고 현재 철거 단계에 들어섰다. 한 총리는 간담회에서 최근 3년간 수도권 주택 착공물량의 80% 이상을 민간부문이 차지하고 있다며, 민간 재개발·재건축사업의 신속한 추진 없이는 정부 목표 달성이 어렵다고 강조했다. 이어 계획된 물량이 실제 착공으로 이어져야 국민이 공급 노력을 체감할 수 있다고 말했다.","url":"https://www.kgnews.co.kr/news/article.html?no=914993"},{"n":5,"title":"강남구 가람아파트, 수서택지지구 첫 재건축 조합설립인가","meta":"2026.10.13 17:03 · 더쎈뉴스","body":"서울 강남구는 일원동 가람아파트 재건축정비사업 조합설립을 인가했다고 13일 밝혔다. 지난달 22일 신청 접수 이후 근무일 기준 10일 만에 인가가 이뤄져 법정 처리기간 30일을 대폭 단축했다. 토지등소유자 511명 가운데 480명이 동의해 93.93%의 동의율을 기록했으며, 1993년 준공된 5층 496세대 단지는 최고 25층 818세대로 재건축된다. 수서택지개발지구 내 재건축 단지 가운데 조합설립인가를 받은 것은 가람아파트가 처음이다.","url":"https://www.mhns.co.kr/news/articleView.html?idxno=763870"},{"n":6,"title":"재건축·재개발 분쟁 90일 내 중재…확정판결과 같은 효력 추진","meta":"2026.10.13 16:18 · 위클리한국주택경제신문","body":"이용선 의원이 국토교통부 산하에 정비사업분쟁중재위원회를 신설하는 내용의 도시정비법 개정안을 발의했다. 중재부는 중재절차 개시일로부터 90일 이내에 중재판정을 내리되 1회에 한해 최대 60일 연장할 수 있으며, 중재판정은 확정판결과 동일한 효력을 갖는다. 소규모주택정비사업, 재정비촉진사업, 노후계획도시정비사업도 중재 대상에 포함된다. 개정안은 공포 후 6개월이 지나 시행되며 5년간 한시적으로 운영될 예정이다.","url":"https://arunews.com/news/articleView.html?idxno=67913"}]},{"name":"금융/세제","articles":[{"n":10,"title":"주거사업장 PF 자기자본비율 규제 2년 유예 확정","meta":"2026.10.13 12:00 · 뉴스핌","body":"금융당국은 13일 주거사업장에 한정해 부동산 프로젝트파이낸싱(PF) 자기자본비율 규제 시행을 2029년으로 2년 유예한다고 확정했다. 2029년 5%를 시작으로 매년 5%포인트씩 높여 2032년 20%까지 단계적으로 적용하며, 비주거 사업장은 당초 계획대로 2027년부터 규제를 적용받는다. 6월 말 기준 PF대출 잔액은 115조8000억원으로 3개월 전보다 3000억원 늘어 2년 반 만에 증가세로 전환됐고, 수도권 규제지역 주거사업장 279곳은 밀착 관리 대상에 포함됐다.","url":"https://www.newspim.com/news/view/20261013000451"}]},{"name":"임대주택","articles":[{"n":11,"title":"\"임대주택 지을수록 손해\"…수도권 택지 20곳 중 착공은 4곳뿐","meta":"2026.10.13 18:24 · 파이낸셜뉴스","body":"2021~2024년 수도권 택지에 공급 계획이 잡힌 공공임대 단지 20곳 가운데 실제 착공한 곳은 9월 기준 4곳에 그친 것으로 나타났다. 공공임대 공사에 적용되는 표준건축비는 ㎡당 111만8800원으로 일반 분양에 쓰이는 기본형건축비(㎡당 230만2000원)의 49% 수준에 머물러 있다. 업계는 임대주택을 30% 공급할 경우 매출이 약 9% 줄어드는 구조라고 설명했으며, 표준건축비가 2023년 2월 이후 거의 오르지 않은 점을 원인으로 꼽았다. 국회에는 표준건축비를 기본형건축비의 80% 수준으로 올리는 법안이 계류돼 있다.","url":"https://www.fnnews.com/news/202610131824089022"}]},{"name":"택지/도시개발","articles":[{"n":12,"title":"이성훈 LH 사장 \"고양창릉 공급 속도 높인다…내년 말 첫 입주\"","meta":"2026.10.13 15:34 · 뉴스핌","body":"이성훈 한국토지주택공사(LH) 사장은 13일 3기 신도시 고양창릉 현장을 찾아 지구 조성과 주택 건설 진행 상황을 점검했다. 첫마을 A4·S5·S6블록 총 2089가구는 2027년 12월 첫 입주가 예정돼 있으며 현재 블록별 공정률은 약 45% 수준이다. 고양창릉은 약 789만㎡ 부지에 3만8000가구, 계획인구 약 9만2000명 규모로 조성된다. 이 사장은 역세권 등 우수 입지에 청년과 신혼부부 등 다양한 계층이 거주할 수 있는 주택을 빠르게 공급하도록 속도를 높여야 한다고 강조했다.","url":"https://www.newspim.com/news/view/20261013000985"}]},{"name":"주택품질/안전","articles":[{"n":13,"title":"입주 4년 신혼희망타운 하자 6213건인데 LH, 시공사 벌점은 '0건'","meta":"2026.10.13 16:03 · 머니투데이","body":"2022년 4월 입주한 LH 신혼희망타운에서 지하주차장 천장재 탈락, 어린이 놀이시설 부실시공 등 총 6213건의 하자가 접수된 것으로 나타났다. 지하주차장 천장재는 보수 후 약 한 달 만에 같은 자리에서 다시 탈락했고, 균열이 간 창호는 1년 가까이 방치된 사례도 확인됐다. 그러나 발주청인 LH가 해당 시공사에 부과한 벌점은 0건이었으며, 시공사는 2024년 97점, 2025년 98점의 상호협력평가 점수를 받았다. 문정복 의원은 LH가 공공주택 하자와 보수 지연 실태를 전수조사하고 시공사 책임을 엄격히 물어야 한다고 지적했다.","url":"https://www.mt.co.kr/policy/2026/10/13/2026101315543691689"},{"n":14,"title":"경기북부소방, 입주민 세대 내 소방시설 셀프 점검 시범 안내","meta":"2026.10.13 10:11 · 뉴스핌","body":"경기도북부소방재난본부는 지난 10~12일 고양시 일산동구 한 아파트 입주자 사전점검 현장에서 입주민이 세대 내 소방시설을 직접 점검하도록 안내하는 시범사업을 진행했다. 공동주택 세대 내 소방시설은 2년마다 정기점검이 필요하지만 입주민 참여를 유도하기 어려웠던 점을 보완하기 위해 마련됐다. 신발장에 부착한 QR코드 스티커와 해당 아파트에 실제 설치된 소방시설 사진을 활용해 스프링클러·화재감지기 위치와 점검 방법을 쉽게 확인하도록 했다. 북부소방재난본부는 이번 시범사업 결과를 토대로 표준 운영모델을 만들어 다른 공동주택으로 확대할 계획이다.","url":"https://www.newspim.com/news/view/20261013000360"}]},{"name":"분양정보","articles":[{"n":15,"title":"10월 아파트 분양전망지수 하락세 속 서울만 반등","meta":"2026.10.13 11:00 · 파이낸셜뉴스","body":"주택산업연구원 조사 결과 10월 전국 아파트 분양전망지수는 82.3으로 9월보다 4.0포인트 하락했다. 반면 서울은 11.8포인트 오른 105.7을 기록해 3개월 만에 기준선인 100을 넘겼고, 수도권 전체도 92.0으로 8.0포인트 상승했다. 지방은 하락세가 이어져 경북이 23.5포인트 급락한 76.5를 기록하는 등 수도권과 지방의 온도 차가 뚜렷했다. 분양가격 전망지수는 114.3으로 5.5포인트 올라 분양가 상승 기대가 커진 것으로 나타났다.","url":"https://www.fnnews.com/news/202610130804405289"},{"n":16,"title":"화성 향남권 5년 만의 새 아파트 '향남역 그로브 스위첸' 분양","meta":"2026.10.13 17:25 · 아주경제","body":"경기 화성시 향남읍에 공급되는 '향남역 그로브 스위첸'이 13일 1순위 청약을 받았다. 지하 2층~지상 29층, 7개 동, 총 933가구 규모로 전용 84㎡ 기준 분양가는 5억원대 중반이며 입주는 2029년 6월로 예정됐다. 단지는 산업단지와 가깝고 2028년 12월 개통을 목표로 하는 신안산선 연장선, 2028년 준공 예정인 H-테크노밸리 조성사업 인근에 자리해 교통·일자리 여건 개선이 기대된다. 특별공급은 12일, 1순위는 13일, 2순위는 14일 접수로 진행됐다.","url":"https://www.ajunews.com/view/20261013171504395"}]},{"name":"논설/사설","articles":[{"n":18,"title":"[사설] 훼손된 그린벨트에 주택공급, 불법 정당화 우려 크다","meta":"2026.10.13 18:19 · 경향신문","body":"경제정의실천시민연합 조사에 따르면 2016~2024년 전국 그린벨트에서 무단 건축 149만1000㎡, 무단 경작·불법 매립 등으로 인한 토지 훼손 270만8000㎡가 적발됐다. 그러나 단속 인력은 평균 4명, 관리 예산은 평균 200만원에 불과해 관리 체계가 부실하다는 점이 지적된다. 사설은 이미 훼손된 그린벨트를 주택공급 명분으로 해제하면 불법 행위를 정당화하는 결과가 되고, 전국적인 그린벨트 무단 훼손을 부추길 우려가 크다고 경고했다. 정부가 해제를 추진하기 전에 훼손 경위를 철저히 검증하고 관리 체계부터 강화해야 한다고 주장했다.","url":"https://www.khan.co.kr/article/202610131819001"},{"n":19,"title":"[사설] 강남만 잡으면 부동산정책 성공인가","meta":"2026.10.13 15:16 · 아주경제","body":"지난해 10월 15일 발표된 부동산 대책 시행 1년을 돌아본 사설이다. 정부의 강남권 집중 규제로 강남구 1.40%, 서초구 3.35% 상승에 그쳐 억제 효과가 있었다고 평가하면서도, 억눌린 수요가 다른 지역으로 옮겨갔다고 지적했다. 그 사이 성북구 아파트값은 16.52% 올랐고 전세난이 심화되면서 중저가 주택의 가격 인상이 실수요자의 내 집 마련 문턱을 더 높였다고 분석했다. 사설은 강남 집값만 누르는 성적표 뒤에 세입자들의 불안이 가려져서는 안 된다고 강조했다.","url":"https://www.ajunews.com/view/20261013151629797"}]}]},{"date":"2026-10-13","count":15,"pdf_count":17,"highlights":[{"n":1,"text":"LH 국감, 부채 372조 전망에 조직분사·공급지연 집중 질타"},{"n":4,"text":"서울 아파트 3분기 매매 54.7% '전고점' 넘어…외곽까지 확산"},{"n":8,"text":"서울시 '모아통합기획' 도입…모아타운 후보지 공모 개시"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"LH 국감, 부채 372조 전망에 조직분사·공급지연 집중 질타","meta":"2026.10.12 12:37 · 머니투데이","body":"국회 국토교통위원회는 12일 한국토지주택공사(LH) 등을 대상으로 국정감사를 열었다. 국민의힘 유상범 의원은 LH 부채가 지난해 173조6567억원에서 2030년 372조8000억원까지 늘어날 것이라는 전망을 근거로, 정부가 추진하는 '토지주택개발공사'·'비축공사' 분사 방안의 실효성에 의문을 제기했다. 더불어민주당은 임대주택 운영 손실 확대에 따른 부채 배분 문제를, 여야 모두 주택 공급 목표는 늘었는데 정규직 인력은 오히려 줄었다는 점을 지적했다. 이성훈 LH 사장은 조직 분사 이후에도 공급 속도를 유지하려면 정부 지원이 필요하다고 답했다.","url":"https://www.mt.co.kr/politics/2026/10/12/2026101212375997384"},{"n":2,"title":"9월 전세사기 피해자 623건 추가 인정…누적 4만1559건","meta":"2026.10.12 · 아시아투데이","body":"국토교통부는 12일 지난 9월 한 달간 전세사기피해지원위원회 전체회의를 세 차례 열어 1642건을 심의하고 이 가운데 623건을 전세사기피해자로 추가 인정했다고 밝혔다. 이로써 위원회가 최종 결정한 전세사기피해자 등은 누적 4만1559건으로 늘었다. 긴급 경·공매 유예 협조 요청 결정은 1251건이며, 피해자에게 제공된 주거·금융·법적 절차 지원은 누적 8만188건으로 집계됐다. 최소보장제에 따라 경·공매 이후에도 보증금의 3분의 1을 회수하지 못한 피해자에게는 그 부족분을 추가로 지원한다.","url":"https://www.asiatoday.co.kr/kn/view.php?key=20261012010003212"},{"n":3,"title":"이성훈 LH 사장, '생애최초 대출규제' 발언 논란에 국회서 사과","meta":"2026.10.12 15:17 · 머니투데이","body":"이성훈 LH 사장은 12일 국정감사에서 생애최초 주택구입자에게 적용되는 주택담보인정비율(LTV)을 낮춰야 한다고 밝혀온 자신의 발언에 대해 사과했다. 그는 지난달 30일 경기 용인 기자간담회에서 시가 15억원 이하 주택의 주택담보대출 한도 6억원과 생애최초 LTV 70%를 더 줄일 필요가 있다고 말한 바 있다. 김은혜 국민의힘 의원이 \"신혼부부·청년은 어떻게 집을 사라는 것이냐\"고 추궁하자, 이 사장은 금융 등 자신이 관할하지 않는 업무에 대해 언급한 점이 죄송하다면서도 가계소득 대비 주거비 부담 완화라는 발언 취지 자체는 유지했다. 본인 소유 주택의 매각 여부를 묻는 질의에는 아직 등기 이전이 끝나지 않았다고 답했다.","url":"https://www.mt.co.kr/estate/2026/10/12/2026101215174143771"}]},{"name":"시장동향","articles":[{"n":4,"title":"서울 아파트 3분기 매매 54.7% '전고점' 넘어…외곽까지 확산","meta":"2026.10.12 · 이투데이","body":"부동산 플랫폼 직방이 국토교통부 아파트 매매 실거래가를 분석한 결과, 올해 3분기 서울에서 과거 거래와 가격 비교가 가능한 아파트 거래 1만930건 중 5977건(54.7%)이 전고점과 같거나 높은 가격에 거래된 것으로 나타났다. 전고점 이상 거래 비중은 1분기 38.2%에서 2분기 43%, 3분기 54.7%로 분기마다 높아졌고, 서울 25개 자치구 중 22곳에서 1분기보다 비중이 상승했다. 반면 강남구는 55%에서 43%로, 서초구는 67.6%에서 62.6%로, 용산구는 71.3%에서 66.9%로 오히려 낮아졌다. 직방은 대출 규제로 상대적으로 가격 접근성이 높은 지역으로 실수요가 옮겨가면서 외곽 지역에서도 전고점 회복 거래가 늘었다고 분석했다.","url":"https://www.etoday.co.kr/news/view/2634506"},{"n":5,"title":"이성훈 LH 사장 \"집값 급락 가능성 많아…지금 안 사도 손해 없어\"","meta":"2026.10.12 · 서울신문","body":"이성훈 LH 사장은 12일 국정감사에서 \"금리가 계속 높아지고 있어 집값이 많이 낮아질 가능성이 있다\"며 \"집값이 안정되면 지금 바로 집을 사지 않아도 손해를 보지 않는다\"고 말했다. 정동만 국민의힘 의원이 최근 집값 상승세를 거론하며 안정되지 않으면 책임질 것이냐고 묻자 \"언제 꺾일지는 모르나 꺾이는 것은 시간문제\"라고 답했다. 서울 아파트값이 87주 연속 상승하며 역대 최장 기록을 이어가는 가운데 나온 발언이어서, 공급 기관 수장의 '나 홀로 낙관론'이라는 지적도 나온다. 이 발언은 앞서 그가 주장해온 대출 규제 강화 필요성과 맞물려 논란이 이어졌다.","url":"https://www.seoul.co.kr/news/economy/2026/10/12/20261012500275"},{"n":6,"title":"서울 중간 가격대 아파트도 10억8000만원…올해만 1억 넘게 올라","meta":"2026.10.12 · 뉴스핌","body":"한국부동산원 통계에 따르면 지난 8월 서울 아파트 3분위(중간 가격대) 평균 매매가격은 10억8470만원으로 집계됐다. 이는 올해 들어서만 1억1300만원 넘게 오른 수치로, 월평균 1400만원꼴로 상승한 셈이다. 고가 주택은 세 부담과 대출 규제로 매수세가 눌린 반면, 상대적으로 접근 가능한 중간 가격대의 상승세는 꺾이지 않고 있다는 분석이다. 이는 실수요자의 매수 여력이 중저가 구간으로 몰리는 흐름을 보여준다.","url":"https://www.newspim.com/news/view/20261012000991"}]},{"name":"정비사업","articles":[{"n":8,"title":"서울시 '모아통합기획' 도입…모아타운 후보지 공모 개시","meta":"2026.10.12 10:18 · 머니투데이","body":"서울시는 모아타운 관리계획 수립과 모아주택 조합설립을 동시에 추진하는 '모아통합기획' 추진계획을 마련하고, 13일부터 후보지 공모에 나선다고 12일 밝혔다. 이 방식이 적용되면 후보지 선정부터 착공까지 걸리는 기간이 기존 약 6년에서 4.5년으로 줄어든다. 서울시는 올해 12곳을 시작으로 내년부터 매년 22곳씩 선정해 2030년까지 총 100곳, 추가 8만가구 규모의 모아주택 공급 기반을 마련할 계획이다. 접수는 다음 달 2일부터 시작하며, 시는 10월 한 달간 권역별 주민설명회를 열어 제도를 안내하기로 했다.","url":"https://www.mt.co.kr/estate/2026/10/12/2026101210185859969"},{"n":9,"title":"서울시 '정비사업 정보몽땅' 개편…착공 현황까지 분기별 공개","meta":"2026.10.12 16:31 · 글로벌이코노믹","body":"서울시는 12일부터 정비사업 전용 포털 '정비사업 정보몽땅'을 대대적으로 개편해, 인허가 단계를 넘어 실제 공사 진행 단계까지 정보를 공개한다고 밝혔다. 개편된 포털에는 주요 추진 물량과 실적 변화, 신속통합기획 2.0 착공 현황 등이 분기별로 수록된다. 현재 신속통합기획 2차 공모로 선정된 구역은 창신9·10구역, 서계동통합구역, 상봉13구역 등 23곳에 이른다. 시공사 선정 공고를 낸 구역 중에서도 2회 이상 유찰돼 수의계약으로 넘어가는 곳이 다수 있어, 시는 이번 개편으로 정비사업 추진 과정의 투명성을 높인다는 방침이다.","url":"https://www.g-enews.com/article/Real-Estate/2026/10/202610121631097888a9fc143920_1"}]},{"name":"금융/세제","articles":[{"n":11,"title":"LH 부채 2030년 372조원 전망…공공주택 공급 차질 우려","meta":"2026.10.12 · 한국경제","body":"국회 국토교통위원회 국정감사에서 한국토지주택공사(LH)의 부채가 지난해 173조원대에서 2030년 372조8000억원으로 늘어날 것이라는 전망이 제시됐다. LH는 지난해 영업손실 6413억원, 당기순손실 918억원을 냈는데, 분양토지 수익 감소와 분양주택 손실, 임대주택 운영 손실 누증이 겹친 결과로 풀이된다. 부채 증가 속도가 빨라지면서 정부가 추진하는 주택 공급 확대 계획에 차질이 빚어질 수 있다는 우려가 나온다. LH는 공사채 발행 확대 등으로 재원을 조달하고 있으나, 재무구조 악화가 장기적인 공급 능력을 제약할 수 있다는 지적이 제기된다.","url":"https://www.hankyung.com/article/2026101268491"},{"n":12,"title":"전세금 떼이고 HUG가 대신 갚은 돈 12조…다주택 채무자가 6.8조","meta":"2026.10.12 · 스트레이트뉴스","body":"국회 국토교통위원회 국정감사에서 주택도시보증공사(HUG)의 전세보증금반환보증 누적 대위변제액이 올해 7월 기준 12조414억원, 5만7032건에 이른다는 자료가 제시됐다. 이 가운데 2건 이상 보증사고를 낸 다주택 채무자에 대한 대위변제가 6조7993억원, 3만4152건으로 절반 이상을 차지했다. 묵시적 갱신을 이유로 HUG가 보증 이행을 거절한 건수도 2021년 1건에서 2024년 150건으로 늘어난 것으로 나타났다. 현재 HUG 전세보증금 반환보증 가입 한도는 공시가격의 126% 이하로, 2023년 전세사기 대책에서 적용비율과 보증 가능 전세가율을 낮춘 결과다.","url":"https://www.straightnews.co.kr/news/articleView.html?idxno=311339"}]},{"name":"임대주택","articles":[{"n":13,"title":"LH 임대주택 150만호 돌파…10년 새 55만호 늘었다","meta":"2026.10.12 09:26 · 글로벌이코노믹","body":"한국토지주택공사(LH)가 운영하는 임대주택이 누적 150만호를 넘어선 것으로 집계됐다. 건설임대·매입임대·전세임대를 합한 물량으로, 최근 10년간 55만호 이상 늘면서 현재 약 266만명이 LH 임대주택에 거주하고 있다. LH 임대주택의 임대조건은 시중 전세 시세의 약 45% 수준으로 책정돼 입주 가구당 연간 약 392만원의 주거비를 절감하는 효과가 있으며, 수도권은 연간 약 486만원에 이른다. LH는 이 물량이 공공임대 전체의 77%를 차지한다고 밝혔다.","url":"https://www.g-enews.com/article/Real-Estate/2026/10/202610120926559237ea13369bfa_1"},{"n":14,"title":"하남 신혼희망타운 행복주택 예비입주자 73명 모집…12일 접수 시작","meta":"2026.10.12 · 비건뉴스","body":"LH청약플러스에 하남감일 A7블록과 위례 A3-3b블록을 대상으로 한 신혼희망타운 행복주택 예비입주자 모집 공고가 올라와 12일부터 14일까지 접수한다. 이번 모집은 예비입주자 73명을 선발하는 것으로, 대학생·신혼부부·주거취약계층·저소득층 등을 대상으로 한다. 같은 날 경기 수원당수 A-3블록 공공분양 잔여세대 1호도 무순위로 공급돼 12일 오전 10시부터 오후 5시까지 신청을 받았다. 10월 한 달간 신혼희망타운 청약이 순차 접수되는 가운데, 인천계양 A17블록 공공분양 일정도 함께 진행된다.","url":"https://www.vegannews.co.kr/news/article.html?no=392009"}]},{"name":"주택품질/안전","articles":[{"n":15,"title":"대구 상가 천장 붕괴사고 여파…대구시, 노후건물 점검 나선다","meta":"2026.10.12 · 서울신문","body":"지난 10일 대구 북구의 한 4층 상가 건물 2층에서 천장 마감재가 떨어져 노인 38명이 다치는 사고가 발생한 가운데, 대구시가 관내 노후 건물에 대한 긴급 점검에 나서기로 했다. 경찰은 생활용품 판매 행사장을 운영한 업자를 업무상과실치상 혐의로 입건했으며, 국립과학수사연구원 등과 합동 감식을 진행했다. 사고가 난 건물은 1994년 준공된 철근콘크리트 구조로, 문제가 된 2층은 당구장 폐업 이후 공실로 있다가 이달 3일부터 판매 행사장으로 임대된 상태였다. 대구시는 유사한 노후 상가 건물의 구조 안전 실태를 전수 점검하겠다는 방침이다.","url":"https://www.seoul.co.kr/news/economy/2026/10/12/20261012500154"}]},{"name":"분양정보","articles":[{"n":16,"title":"대구 '더샵 동인센트리체' 특별공급 개시…1순위 청약 13일","meta":"2026.10.12 · 이투데이","body":"포스코이앤씨가 시공하는 대구 중구 동인동1가 '더샵 동인센트리체'가 12일 특별공급을 시작으로 청약 일정에 들어갔다. 단지는 총 314세대로 특별공급 185세대, 일반공급 129세대로 구성되며, 분양가는 8억2553만원에서 8억6878만원 사이다. 1순위 청약은 13일, 2순위 청약은 14일 진행되며 당첨자는 20일 발표된다. 계약은 11월 2일부터 4일까지 진행되고 입주는 2028년 6월 예정이다.","url":"https://www.etoday.co.kr/news/view/2634565"}]},{"name":"논설/사설","articles":[{"n":17,"title":"[사설] LH, 2030년 '372조 빚더미'… 결국 국민 혈세로 메울 텐가","meta":"2026.10.13 · 디지털타임스","body":"이 사설은 국회 국정감사에서 드러난 한국토지주택공사(LH)의 부채가 지난해 173조원대에서 2030년 372조원으로 불과 5년 만에 두 배 이상 늘어날 것이라는 전망을 짚었다. 지난해 LH가 영업손실 6413억원, 당기순손실 918억원을 기록한 배경에는 분양토지 수익 감소와 분양주택 손실, 임대주택 운영 손실 누증이 겹쳐 있다고 지적했다. 사설은 LH와 한국전력 등 공기업이 짊어진 400조원이 넘는 부채가 결국 미래 세대가 세금으로 메워야 할 청구서라고 평가했다. 주택 공급 확대와 재무 건전성이라는 두 과제를 동시에 달성하려면 구조적인 해법이 필요하다는 게 사설의 논지다.","url":"https://www.dt.co.kr/article/12088620"}]}]},{"date":"2026-10-12","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"LH 분사·파업 변수… 이성훈 사장, 주택 공급 시험대"},{"n":4,"text":"강남 빠져도 상승폭 커진 서울 집값... 87주째 오르며 역대최장 기록 경신"},{"n":10,"text":"대구 서문시장 4지구 재건축, 공사비 이견에 다시 제동"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"LH 분사·파업 변수… 이성훈 사장, 주택 공급 시험대","meta":"2026.10.12 04:46 · 머니투데이","body":"이성훈 한국토지주택공사(LH) 사장이 12일 취임 후 첫 국정감사에 출석해 조직 분사와 노동조합의 총파업 예고 등 현안에 대해 질의를 받는다. 국회 국토교통위원회는 LH를 택지개발·주택건설 조직과 주거복지·자산관리 조직으로 나누는 분사가 실제 공급 속도를 높일 수 있는지, 분리 이후 사업 연계와 재무 관리 방안이 적절한지를 검증할 예정이다. 야당은 이 사장이 \"대출을 계속 6억원씩 해주는 것에 국민이 부담을 느낀다\"고 발언한 것도 집중 추궁할 것으로 보인다. 인천계양 등 3기 신도시의 '선교통 후입주' 원칙 이행 여부도 점검 대상에 올랐다.","url":"https://www.mt.co.kr/estate/2026/10/12/2026101119444459613"},{"n":2,"title":"LH, 수도권 미분양 주택 매입확약…분양가 92%까지","meta":"2026.10.09 12:31 · 서울신문","body":"한국토지주택공사(LH)가 수도권 공공택지 내 민간 미분양 주택을 매입하는 확약 신청을 올해 말까지 받는다. 매입가격은 분양가의 85~92% 수준으로 보장하며, 내년 상반기까지 착공하면 인센티브를 적용해 매입가 비율을 높여준다. 대상은 민간이 요청한 전용면적 85㎡ 이하 미분양 주택이며, 적용 물량은 최대 1만8000가구다. 정부는 이번 조치로 민간 건설사의 자금 부담을 줄여 주택 공급 속도를 높인다는 계획이다.","url":"https://www.seoul.co.kr/news/economy/2026/10/09/20261009500084"},{"n":3,"title":"[2026 국정감사] '집값 급등·공급 미달' 숙제 남긴 국토위 국감, 검증대 오른 LH","meta":"2026.10.11 17:00 · 아주경제","body":"국회 국토교통위원회의 국정감사에서 한국토지주택공사(LH)의 주택공급 실적이 도마에 올랐다. 올해 8월 11일 기준 LH의 신축매입임대 착공률은 목표 대비 22.6%에 그쳤고, 임차인을 구하지 못한 공가는 2024년 1262호에서 2234호로 77% 늘었다. LH의 부채는 173조6567억원으로 전년보다 13조원 이상 증가했다. 정부는 수도권 주택공급 목표를 100% 달성하기 어렵다고 보고 달성률 전망을 80~88%로 낮췄으며, 조직개편 과정의 사업 공백 여부와 시공사 하자관리도 국감 검증 대상에 올랐다.","url":"https://www.ajunews.com/view/20261011142230616"}]},{"name":"시장동향","articles":[{"n":4,"title":"강남 빠져도 상승폭 커진 서울 집값... 87주째 오르며 역대최장 기록 경신","meta":"2026.10.08 18:17 · 파이낸셜뉴스","body":"한국부동산원 조사에서 서울 아파트 매매가격이 전주 대비 0.12% 올라 87주 연속 상승, 역대 최장 기록을 새로 썼다. 강남구는 올랐으나 서초구와 송파구는 내렸고, 서대문구·강북구·금천구 등 외곽 지역이 강세를 보였다. 부동산원은 \"대단지와 역세권 아파트를 중심으로 견조한 수요가 이어졌다\"고 분석했다. 전국에서는 삼성전자 사내대출 유동성 영향으로 수원 영통구가 0.62%로 최고 상승률을 기록했다.","url":"https://www.fnnews.com/news/202610081817422229"},{"n":5,"title":"반도체가 이끈 집값 상승, 서울도 밀어 올릴까?","meta":"2026.10.10 08:00 · 비즈워치","body":"경기 남부 지역 아파트값이 반도체 업계 종사자의 유동성 증가로 급등하고 있다. 삼성전자 본사가 있는 수원 영통은 올해 누적 상승률이 15.39%에 달했고, 성남 분당과 평촌 등도 높은 상승률을 보였다. 반면 강남3구와 용산은 2주 연속 하락세를 이어갔다. 우리은행 연구원은 삼성전자 사내대출에 따른 유동성 유입이 수원 영통과 분당의 가격 상승을 주도했다며, 이 흐름이 장기적으로 서울 외곽 지역 가격에도 영향을 줄 수 있다고 전망했다.","url":"https://news.bizwatch.co.kr/article/real_estate/2026/10/08/0042"}]},{"name":"정비사업","articles":[{"n":10,"title":"대구 서문시장 4지구 재건축, 공사비 이견에 다시 제동","meta":"2026.10.11 16:06 · 경북일보","body":"대구 서문시장 4지구 시장정비사업조합이 지난 8일 대의원회의에서 기존 시공사인 동신건설과의 본계약을 체결하지 않기로 결정했다. 대의원 46명 중 40명이 찬성했다. 동신건설은 착공 전 선행조건과 실제 착공 시점이 확정되지 않아 계약 체결이 어렵다는 입장이며, 입찰 당시 제시한 공사비 715억원이 지난해 9월 기준이어서 현재 시장 여건에 맞게 재검토가 필요하다고 설명했다. 조합은 조합원 총회를 거쳐 새 시공사를 선정할 예정이어서, 대구시가 목표했던 연내 착공은 불투명해졌다.","url":"https://www.kyongbuk.co.kr/news/articleView.html?idxno=4086726"},{"n":11,"title":"'청약 대박 로또' 디에이치 대치 에델루이가 보여준 재건축의 역설…사업비 정산 표류·분담금 갈등·조합장 수사 '첩첩산산'","meta":"2026.10.08 11:55 · 뉴스스페이스","body":"서울 강남구 대치동 재건축 단지 디에이치 대치 에델루이가 역대 최고 청약 경쟁률(1025.57대 1)을 기록했지만 현재 재정난에 처해 있다. 이 단지 조합이 만기를 연장하지 못한 프로젝트파이낸싱(PF) 대출은 1692억원이며, 부족한 사업비 약 1500억원을 조합원 분담금으로 충당하려던 계획은 총회에서 부결됐다. 분양에는 성공했으나 공사비 잔금과 사업비 정산 문제가 남아 있으며, 시공사인 현대건설은 신용공여를 중단했다. 조합장에 대한 경찰 수사도 진행 중이다.","url":"https://newsspace.kr/news/article.html?no=16050"}]},{"name":"금융/세제","articles":[{"n":12,"title":"이억원 금융위원장 \"가계부채 관리 엄격하게..실수요자 대출은 핀셋형\"","meta":"2026.10.08 10:18 · 파이낸셜뉴스","body":"이억원 금융위원장이 8일 국정감사 업무보고에서 금리 인상기에 대비해 가계부채를 엄격하게 관리하면서 서민·취약계층 지원은 강화하겠다고 밝혔다. 금융위는 150조원 규모인 국민성장펀드를 200조원으로 확대하고, 서민금융·포용금융 지원도 늘리기로 했다. 주택 실수요자에게는 '핀셋형 지원'을 적용하겠다는 방침도 제시했다. 이 위원장은 대외 불확실성이 커진 상황에서 투기적 대출 수요는 계속 제한하겠다고 강조했다.","url":"https://www.fnnews.com/news/202610080918126231"}]},{"name":"임대주택","articles":[{"n":13,"title":"수도권 신축매입 4만 호 연내 착공… 서울 1만 호 포함","meta":"2026.10.11 13:51 · 아주경제","body":"한국토지주택공사(LH)가 올해 약정한 신축 매입임대주택 가운데 수도권 4만호를 연내 착공하며, 이 중 서울 물량은 1만호 이상이라고 밝혔다. 제도개선 시행 이후 수도권 월평균 약정 체결 물량은 이전보다 482% 늘었다. LH는 민간사업자에 대한 초기 사업비 지원을 강화하고 공정률에 따라 공사비를 지급하는 등 제도를 개선했으며, 관련 인력도 199명에서 282명으로 늘렸다. 향후 3년간 서울 25개 자치구에서 2만528호의 매입임대주택 입주자를 모집할 계획이며, 이 중 청년 물량이 70.9%를 차지한다.","url":"https://www.ajunews.com/view/20261011114845466"},{"n":14,"title":"[단독] LH, 오피스텔 신축매입에 허리 휜다","meta":"2026.10.12 05:00 · 대한경제","body":"한국토지주택공사(LH)가 지난해부터 올해 상반기까지 신축매입임대로 약정한 주거용 오피스텔이 4만호를 넘어섰다. 지난해 LH 매입약정 4건 중 3건이 오피스텔이었고, 올해 상반기에도 약정의 67.6%가 오피스텔이었다. 불경기로 분양에 어려움을 겪는 민간 건설사들이 물량을 LH에 넘기는 구조가 형성된 결과로 풀이된다. LH는 신축매입임대 한 호당 자체사업비로 약 2억1400만원이 든다고 밝혔으며, 재무 부담 완화를 위해 민간 공급 활성화 대책이 필요하다는 지적이 나온다.","url":"https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610110249549220013"}]},{"name":"택지/도시개발","articles":[{"n":16,"title":"GTX 역세권 운정 3·4블록 2년 만에 분양 재추진…분양가 부담 계약 변수로","meta":"2026.10.12 06:00 · 이투데이","body":"경기 파주 운정3지구 주상복합 3·4블록이 약 2년 만에 분양을 재개한다. 시티건설과 넥스트건설이 주도하는 'GTX 운정중앙역 시티프라디움'은 944가구 규모다. 당초 2026년 8월이던 입주 예정 시기는 2030년 하반기로 미뤄졌고, 기존 사전청약 당첨자 546가구는 분양가가 약 1억원 가까이 오른 점을 지적하고 있다. 이 사업은 2022년 민간 사전청약 이후 차질을 빚어 LH가 2024년 7월 토지계약을 해제했던 곳으로, 동·호수 배정에 따른 추가 자금 부담도 변수로 꼽힌다.","url":"https://etoday.co.kr/news/view/2634083"}]},{"name":"주택품질/안전","articles":[{"n":17,"title":"[2026 국감] LH 품질미흡 경고 반복 건설현장 23곳…허영 \"현장 단위 품질관리 체계 필요\"","meta":"2026.10.11 11:08 · 뉴스핌","body":"한국토지주택공사(LH)가 2023년부터 올해 8월까지 252개 업체에 385건의 품질미흡통지를 발급했으며, 이 중 23곳 현장은 2차 이상 반복 통지를 받았고 일부는 4차 통지까지 받은 것으로 나타났다. 허영 더불어민주당 의원은 국정감사에서 반복 문제가 확인된 현장을 별도로 관리해 실제 개선 여부까지 지속적으로 점검할 수 있는 현장 단위 품질관리 체계가 필요하다고 지적했다. 현행 입찰심사에서는 품질미흡통지 이력을 최근 1년만 반영하는 한계가 있다는 평가도 나왔다.","url":"https://www.newspim.com/news/view/20261011000040"}]},{"name":"분양정보","articles":[{"n":18,"title":"[분양캘린더] 10월 셋째 주 '당산역 더클래스 한강' 등 1829가구 분양","meta":"2026.10.10 06:00 · 이투데이","body":"10월 셋째 주 전국 8개 단지에서 오피스텔을 포함해 총 1829가구가 청약에 나선다. 12일에는 경기 오산시 '더샵 오산역아크시티'와 제주 '아이린 8차 아파트'가, 13일에는 서울 영등포구 '당산역 더클래스 한강'을 포함한 6개 단지가 청약을 진행한다. 오는 16일에는 부산·충남·충북 3개 단지의 견본주택이 문을 연다.","url":"https://www.etoday.co.kr/news/view/2634068"},{"n":19,"title":"GS건설 컨소시엄, '산곡역자이힐스테이트&하늘채' 8일 견본주택 개관","meta":"2026.10.08 15:29 · 파이낸셜뉴스","body":"GS건설 컨소시엄이 인천 부평구에서 추진하는 총 2706가구 규모의 '산곡역자이힐스테이트&하늘채'가 8일 견본주택을 열고 분양에 들어갔다. 지하철 7호선 산곡역을 도보로 이용할 수 있는 입지가 특징이며, 일반분양은 전용 50~84㎡ 1289가구다. 특별공급은 19일부터 시작하며, 1순위 청약은 20일, 2순위 청약은 21일 진행된다. 단지에는 피트니스클럽, 도서관, 게스트하우스 등 다양한 커뮤니티 시설이 들어설 계획이다.","url":"https://www.fnnews.com/news/202610081521273872"}]},{"name":"논설/사설","articles":[{"n":20,"title":"층간 소음과 벽 곰팡이, 안 참고 보상 받을 수 있다","meta":"2026.10.12 04:30 · 한국일보","body":"이 칼럼은 겨울철 안방 벽 곰팡이, 거실 타일 들뜸, 베란다 누수, 윗집 소음 등 신축 아파트 하자를 겪는 입주민의 사례를 소개하며 법적 대응 방법을 설명한다. 필자인 박은지 변호사는 이런 문제들이 하자로 판정될 수 있으며 정부가 공개한 하자 판정 기준과 그간의 사례를 활용할 수 있다고 조언한다. 부위별로 보수 청구 기한이 다른데, 도배·타일은 2년, 창호·설비는 3년, 방수는 5년, 건물 뼈대는 10년이라고 설명한다. 시공사는 하자가 확인되면 60일 안에 보수를 완료할 의무가 있다고 덧붙인다.","url":"https://hankookilbo.com/news/article/A2026100813570005221"}]}]},{"date":"2026-10-08","count":14,"pdf_count":14,"highlights":[{"n":1,"text":"홍지선 국토장관, 국감서 \"연말까지 집값 상승폭 줄어들 것\""},{"n":5,"text":"9월 서울 아파트 경매 낙찰가율 94.7%…1년 7개월 만에 최저"},{"n":8,"text":"오세훈 \"아파트 리모델링도 재건축처럼 지원하겠다\""}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"홍지선 국토장관, 국감서 \"연말까지 집값 상승폭 줄어들 것\"","meta":"2026.10.07 11:43 · 한국경제","body":"홍지선 국토교통부 장관은 7일 국회 국토교통위원회 국정감사에서 서울 아파트값이 지난해 2월부터 86주 연속 상승해 역대 최장 기록을 세운 가운데, 강남3구와 용산구는 이미 집값이 하락 전환했다며 연말로 갈수록 서울 집값 상승폭이 줄어들 것으로 전망했다. 그는 최근 3년간 주택 착공이 줄어든 것을 집값 상승의 주요 원인으로 꼽았고, 투기 수요도 일부 작용했다고 설명했다. 공급 지연 지적에는 국민이 주택 공급 진행 상황을 직접 확인할 수 있는 '공급 상황판'을 구축하겠다고 답했다. 또 전세 제도가 점차 사라지는 흐름에 대해서는 1인 가구 증가와 전세 사기 우려를 들어 '메가트렌드'라고 평가했다.","url":"https://www.hankyung.com/article/202610077965i"},{"n":2,"title":"한성숙 총리 \"주택공급 닥치고 속도\"…인허가 68개월→37개월 단축","meta":"2026.10.07 16:30 · 아주경제","body":"한성숙 국무총리는 7일 취임 100일 기자간담회에서 수도권 주택 공급을 최우선 국정 과제로 제시하며 \"대책 발표에 머물지 않고 실제 현장이 바뀌어야 한다\"고 말했다. 공공택지 인허가 기간을 현재 68개월에서 37개월로 단축하기 위해 순차적으로 진행하던 절차를 병행 처리하는 방안을 추진하고, 공급 관련 대출도 우선적으로 완화하겠다고 밝혔다. 2030년까지 공적주택 119만호를 차질 없이 공급하고, 내년 1분기 안에 인허가·분양·입주 단계를 국민이 직접 확인할 수 있는 '디지털 주택 공급 상황판'을 공개하겠다고 약속했다. 전·월세 안정을 위해서는 LH의 신축 매입임대 주택을 확대해 내년 하반기부터 효과를 내겠다고 덧붙였다.","url":"https://www.ajunews.com/view/20261007151737177"},{"n":3,"title":"범야권 \"李 정부, 부동산 정책 고집 말라\"…여당서도 기조 전환 요구","meta":"2026.10.07 15:37 · 파이낸셜뉴스","body":"서울 아파트값이 86주 연속 상승하고 전·월세까지 급등하자 범야권은 7일 이재명 정부에 부동산 정책 기조 전환을 촉구했다. 국민의힘과 개혁신당은 민간 중심의 공급 확대를 주장했고, 오세훈 서울시장도 \"규제 중심의 정책 기조를 전환하고 실제로 지을 수 있는 공급을 약속해야 한다\"고 강조했다. 더불어민주당 내에서도 집값 상승에 대한 우려가 나오며 정책 수정을 요구하는 목소리가 나왔다. 현재 정책으로는 집값과 전·월세 문제를 동시에 해결하기 어렵다는 평가가 여야를 가리지 않고 확산하는 모습이다.","url":"https://www.fnnews.com/news/202610071409455654"},{"n":4,"title":"홍지선 \"LH 실효성 있는 개혁안 마련\"…분리 개편 국감 쟁점으로","meta":"2026.10.07 10:21 · 뉴스핌","body":"홍지선 국토교통부 장관은 7일 국정감사에서 \"LH가 국민 신뢰 속에서 주택 공급과 주거복지라는 본연의 역할을 제대로 수행할 수 있도록 실효성 있는 개혁 방안을 마련하겠다\"고 밝혔다. 정부는 LH를 택지개발·주택건설을 맡는 조직과 주거복지·자산비축을 맡는 조직으로 분리하는 방안을 추진 중이나, 160조원대 부채 배분 문제와 노조 반발로 연내 세부안 확정이 쉽지 않은 상황이다. 홍 장관은 이와 함께 수도권 주택 공급 확대를 위해 공공택지 최단기 착공 모델 구축, 신규택지 확보, 재개발·재건축 사업 속도 개선을 추진하겠다고 말했다.","url":"https://www.newspim.com/news/view/20261007000397"}]},{"name":"시장동향","articles":[{"n":5,"title":"9월 서울 아파트 경매 낙찰가율 94.7%…1년 7개월 만에 최저","meta":"2026.10.07 13:10 · 한국경제","body":"지난달 서울 아파트 경매 낙찰가율이 94.7%로 떨어지며 지난해 2월(91.8%) 이후 1년 7개월 만에 최저치를 기록했다. 고가 단지들이 감정가보다 낮은 가격에 낙찰되는 사례가 늘어난 반면, 강북구와 노원구 등 중저가 지역에서는 감정가를 웃도는 낙찰이 이어지며 지역별 양극화가 뚜렷해지고 있다. 대출 규제로 자금 조달이 어려워지면서 고가 단지 수요가 위축된 것이 주된 배경으로 꼽힌다.","url":"https://www.hankyung.com/article/202610078119i"},{"n":6,"title":"미분양관리지역 5곳으로 확대…오산·경산 신규 지정","meta":"2026.10.07 13:43 · 한국경제","body":"주택도시보증공사(HUG)는 7일 10월 미분양관리지역으로 인천 영종구, 경기 오산시, 부산 강서구, 충남 천안시, 경북 경산시 등 5곳을 지정했다고 밝혔다. 기존에 지정됐던 강원 강릉시는 이번에 해제됐고, 경기 오산시와 경북 경산시가 새로 포함됐다. 오산시는 미분양이 지난 6월 말 31가구에서 8월 말 1846가구로 두 달 새 약 1800가구 급증해 지정 사유에 포함됐다. 이들 5곳의 미분양 주택은 8월 말 기준 총 1만1235가구로, 전국 미분양 6만9134가구의 16.2%에 해당한다.","url":"https://www.hankyung.com/article/202610078181i"},{"n":7,"title":"지방 '악성 미분양' 4채 중 1채가 대구·부산에 몰려","meta":"2026.10.07 11:06 · 이투데이","body":"국토교통부 8월 주택통계에 따르면 대구와 부산의 준공 후 미분양(이른바 '악성 미분양')이 지난해 12월 5603가구에서 올해 8월 6344가구로 741가구(13.2%) 늘었다. 전체 미분양은 수요가 받쳐주지 못한 과거 물량이 해소되며 줄었지만, 준공 후에도 팔리지 않은 물량이 차지하는 비중은 오히려 커졌다. 대구는 전체 미분양 중 준공 후 미분양 비중이 50.5%에서 81.1%로 높아져 기존 미분양이 해소되지 않고 그대로 적체되고 있음을 보여준다. 선호 지역에 수요가 쏠리면서 상대적으로 선호도가 낮은 지역의 적체가 길어지고 있다는 분석이다.","url":"https://www.etoday.co.kr/news/view/2631532"}]},{"name":"정비사업","articles":[{"n":8,"title":"오세훈 \"아파트 리모델링도 재건축처럼 지원하겠다\"","meta":"2026.10.07 17:43 · 한국경제","body":"오세훈 서울시장은 7일 민선 9기 취임 100일 기자간담회에서 \"주택 리모델링을 지금처럼 방치할 이유가 없다\"며 재건축과 동일한 조건에서 경쟁할 수 있도록 최대한 지원하라고 지시했다고 밝혔다. 그는 리모델링 촉진책을 마련 중이며 조만간 구체적인 내용을 공개하겠다고 말했다. 그동안 서울시가 재개발·재건축 규제를 대폭 완화하면서 리모델링을 추진하던 단지 상당수가 재건축으로 방향을 바꾼 상황을 개선하려는 취지다. 오 시장은 올해 1~8월 서울 주택 인허가 약 4만가구 중 절반 이상인 2만2000가구가 정비사업에서 나왔다며, 2031년까지 31만가구 착공 목표 달성을 위해 정부와 서울시의 규제 완화와 속도전이 필요하다고 강조했다.","url":"https://www.hankyung.com/article/2026100792181"}]},{"name":"금융/세제","articles":[{"n":9,"title":"정부, 세제개편 대국민 인식조사 착수…3년 만에 실시","meta":"2026.10.07 18:27 · 파이낸셜뉴스","body":"정부가 지난 8월 3일 발표한 부동산 세제개편안에 대한 반발이 이어지자 국토연구원을 통해 대국민 인식조사를 발주한 것으로 7일 확인됐다. 조사는 부동산 세제와 금융정책, 규제지역, 임대차제도 등 주요 정책에 대한 국민 인식을 파악하는 것으로, 3년 만에 실시되는 조사다. 개별 정책을 따로 평가하는 데 그치지 않고 여러 정책을 함께 적용했을 때의 국민 수용성을 분석한다는 점이 특징이다.","url":"https://fnnews.com/news/202610071826337790"}]},{"name":"임대주택","articles":[{"n":10,"title":"\"전월세 불안 커지자\"…토허제 완화·민간임대 확대 주장 나와","meta":"2026.10.07 17:59 · 파이낸셜뉴스","body":"서울시가 7일 한국프레스센터에서 연 '2026 서울주거포럼'에서 전문가들은 전월세 시장 안정을 위한 방안을 제시했다. 이창무 서울시 총괄건축가는 비거주 1주택자 규제 강화와 다주택자·등록임대사업자 규제, 토지거래허가구역 지정 등을 걷어내는 것이 전월세 시장 안정의 종점이라고 주장했다. 이상영 교수는 기업형 민간임대 제도 정비가 필요하다고 봤고, 김준형 교수는 장기전세주택을 자산 축적을 돕는 지원 프로그램과 결합해야 한다고 제안했다.","url":"https://www.fnnews.com/news/202610071448431583"}]},{"name":"택지/도시개발","articles":[{"n":11,"title":"용산공원 주택공급 국감서 공방…수도권 착공 목표 100% 달성 어려워","meta":"2026.10.07 17:35 · 데일리안","body":"7일 국토교통부 국정감사에서 용산공원 내 주택공급 계획을 둘러싼 공방이 벌어졌다. 홍지선 국토교통부 장관은 올해 수도권 착공 목표에 대해 \"100% 계획 물량을 확보하기는 어려울 것 같다\"면서도 \"80~88% 정도는 달성할 수 있을 것\"이라고 답했다. 서울시가 용산공원 개발 대안으로 제안한 탄천물재생센터 부지는 시설 이전 등에 장기간이 소요돼 실현 가능성에 의문이 제기됐다.","url":"https://www.dailian.co.kr/news/view/1699088/2026-%EA%B5%AD%EA%B0%90-%EC%9A%A9%EC%82%B0%EA%B3%B5%EC%9B%90-%EC%A3%BC%ED%83%9D%EA%B3%B5%EA%B8%89-%EB%8F%84%EB%A7%88-2026"},{"n":12,"title":"GTX-A 삼성역 철근누락 공방…홍지선 \"안전 담보 없인 공사 재개 불가\"","meta":"2026.10.07 18:39 · 데일리안","body":"홍지선 국토교통부 장관은 7일 국정감사에서 GTX-A 삼성역 구간의 철근 누락 문제와 관련해 \"시민 안전에 대한 담보 없이는 공사를 재개하는 것은 불가능하다\"고 밝혔다. 11월쯤 전문가들의 정밀안전진단 결과가 나올 것으로 예상되며, 이를 토대로 보강 공사 중 열차 운행 재개 여부를 검토하겠다고 설명했다. 서울시는 현재 시공된 구조물의 안전성이 A등급이라며 보강공법을 조속히 결정해 달라고 촉구했다.","url":"https://www.dailian.co.kr/news/view/1699117/2026-%EA%B5%AD%EA%B0%90-GTX-%EC%82%BC%EC%84%B1%EC%97%AD-%EA%B3%B5%EB%B0%A9%ED%99%8D%EC%A7%80-2026"}]},{"name":"주택품질/안전","articles":[{"n":13,"title":"건설현장 사망자 절반이 '추락사'…5년간 642명 숨져","meta":"2026.10.07 10:35 · 뉴스1","body":"국회 국토교통위원회 소속 더불어민주당 황희 의원이 7일 국토교통부에서 받은 자료에 따르면, 2021년부터 올해 6월까지 건설현장 사망자 1220명 가운데 추락사가 642명으로 전체의 52.6%를 차지했다. 상위 10대 건설사 현장에서도 사망자 120명 중 36명(30.0%)이 추락사로 숨졌으며, 현대건설과 롯데건설에서 각각 6명으로 가장 많았다. 황 의원은 \"안전 주의 교육보다는 난간·작업통로 같은 기본 안전시설 확보가 선행돼야 한다\"고 지적했다.","url":"https://www.news1.kr/realestate/general/6312594"}]},{"name":"분양정보","articles":[{"n":14,"title":"쌍용건설, 양수역 '쌍용 더 플래티넘 한강' 견본주택 8일 개관","meta":"2026.10.07 15:13 · 글로벌이코노믹","body":"쌍용건설은 경기 양평군 두물머리 일대에 짓는 '쌍용 더 플래티넘 한강'의 견본주택을 8일 열고 분양에 들어간다고 7일 밝혔다. 단지는 경의중앙선 양수역에서 도보 3분 거리에 지하 2층~지상 최고 19층, 6개 동, 총 333가구 규모로 조성되며 전용면적은 74~146㎡다. 특별공급은 12일, 1순위 청약은 13일, 2순위 청약은 14일 접수한다.","url":"https://www.g-enews.com/article/Real-Estate/2026/10/202610071512407269a9fc143920_1"}]}]}],"holidays":["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-02","2026-05-01","2026-05-05","2026-05-25","2026-06-03","2026-06-06","2026-08-17","2026-09-24","2026-09-25","2026-09-26","2026-10-05","2026-10-09","2026-12-25"],"art":null};

const WD = ["일","월","화","수","목","금","토"];
const FS = [0.9, 1, 1.15, 1.3];   // 글자 크기 단계. 기본은 1(최적 크기), −로 90%, +로 115%·130%
const FS_DEFAULT = 1;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const parts = iso => { const [y,m,d] = iso.split("-").map(Number); const w = WD[new Date(y, m-1, d).getDay()]; return {y,m,d,w}; };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch(e) { return ""; } };
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const store = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} } };

let dayIdx = 0;
let fsIdx = (() => { const i = FS.indexOf(Number(store.get("dn-fs"))); return i >= 0 ? i : FS_DEFAULT; })();

function findArticle(day, n){ for (const c of day.categories) for (const a of c.articles) if (a.n === n) return {a, c}; return null; }
function firstSentence(t){ const m = t.match(/^.+?[다요]\.(?=\s|$)/); return m ? m[0] : t; }

// 그림으로 보는 오늘: 최신 날짜를 볼 때만, 그날 그림이 준비됐을 때만 보인다. 그림을 누르면 오늘의 주택 뉴스의 그 장면(#s1~#s6)으로 바로 간다.
function artStrip(day){
  const art = DATA.art;
  if (dayIdx !== 0 || !art || art.date !== day.date || !art.items || !art.items.length) return "";
  const go = it => `${esc(art.url)}#${esc(it.anchor)}`;
  return `<div class="art-b"><h3>인포그래픽 뉴스 <a href="${esc(art.url)}" target="_blank" rel="noopener">크게 보기 →</a></h3>
    <div class="strip">${art.items.map(it => `<a href="${go(it)}" target="_blank" rel="noopener"><img src="${esc(it.img)}" alt="${esc(it.cat)} 그림" loading="lazy" width="132" height="129"><span>${esc(it.cat)}</span><b>${esc(it.title)}</b></a>`).join("")}</div></div>`;
}

function cover(day, p){
  const hs = day.highlights.map(h => { const f = findArticle(day, h.n); return { text: h.text, n: h.n, cat: f ? f.c.name : "", art: f ? f.a : null }; });
  const lead = hs[0];
  const subs = hs.slice(1).map(h => `<a href="#a-${h.n}"><span class="hl-cat">${esc(h.cat)}</span><b>${esc(h.text)}</b></a>`).join("");
  return `<div class="cover">
    <div class="mast">
      <div class="mast-top"><span class="logo"><img src="${LOGO}" alt="한국주택협회 Korea Housing Association"></span></div>
      <div class="mast-row"><b>Daily News</b><span>${p.y}.${pad(p.m)}.${pad(p.d)} (${p.w})</span></div>
    </div>
    <div class="lead">
      <div class="lead-cat">오늘의 핵심 · ${esc(lead.cat)}</div>
      <h2>${esc(lead.text)}</h2>
      ${lead.art ? `<p>${esc(firstSentence(lead.art.body))}</p>` : ""}
      <a class="more" href="#a-${lead.n}">기사 전체 보기 →</a>
    </div>
    <div class="subs">${subs}</div>
    ${artStrip(day)}
    <div class="foot"><span class="stats">기사 ${day.count}건 · ${day.categories.length}개 분야</span></div>
  </div>`;
}

function applyFs(){
  document.documentElement.style.setProperty("--fs", FS[fsIdx]);
  $("#fsDown").disabled = fsIdx === 0;
  $("#fsUp").disabled = fsIdx === FS.length - 1;
  $("#fsLabel").setAttribute("aria-label", `글자 크기 ${Math.round(FS[fsIdx] * 100)}%`);
}

function render(){
  const day = DATA.days[dayIdx];
  const p = parts(day.date);
  document.title = `Daily News ${p.m}.${p.d}(${p.w}) · 주택·부동산`;

  // 안내 띠: 지난 날짜를 보는 중이거나, 오늘 자료가 아직 없을 때
  const today = new Date(); const tIso = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  const latest = DATA.days[0];
  const isWorkday = today.getDay() > 0 && today.getDay() < 6 && !(DATA.holidays || []).includes(tIso);
  let notice = "";
  if (dayIdx > 0) notice = `<div class="notice"><span>지난 뉴스를 보고 있습니다 · ${p.m}월 ${p.d}일(${p.w})</span><button type="button" data-go="0">최신 뉴스로</button></div>`;
  else if (latest.date !== tIso && isWorkday && today.getHours() >= 10) { const lp = parts(latest.date); notice = `<div class="notice"><span>오늘 뉴스가 아직 올라오지 않았습니다. 지금은 ${lp.m}월 ${lp.d}일(${lp.w}) 뉴스입니다.</span></div>`; }
  $("#notice").innerHTML = notice;

  $("#cover").innerHTML = cover(day, p);

  $("#catnav").innerHTML = day.categories.map((c, i) => `<a class="chip" href="#s-${i}" data-i="${i}">${esc(c.name)}<span>${c.articles.length}</span></a>`).join("");
  $("#list").innerHTML = day.categories.map((c, i) => `<section class="sec" id="s-${i}" data-i="${i}">
      <h2 class="sec-h"><b>${esc(c.name)}</b><span>${c.articles.length}건</span></h2>
      ${c.articles.map(a => `<article class="card" id="a-${a.n}">
        <h3>${esc(a.title)}</h3>
        <div class="meta">${esc(a.meta)}</div>
        <p>${esc(a.body)}</p>
        <a class="src" href="${esc(a.url)}" target="_blank" rel="noopener">원문 보기 <small>${esc(host(a.url))}</small>${arrow}</a>
      </article>`).join("")}
    </section>`).join("");

  watchSections();
}

let io;
function watchSections(){
  if (io) io.disconnect();
  const chips = [...document.querySelectorAll(".chip")];
  io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      const i = e.target.dataset.i;
      chips.forEach(c => c.classList.toggle("on", c.dataset.i === i));
      const on = chips[i]; if (on) on.parentElement.scrollTo({left: on.offsetLeft - 16, behavior: "smooth"});
    });
  }, {rootMargin: "-120px 0px -65% 0px"});
  document.querySelectorAll(".sec").forEach(s => io.observe(s));
}

function openSheet(){
  $("#days").innerHTML = DATA.days.map((d, i) => { const p = parts(d.date); return `<li><button type="button" data-go="${i}" class="${i === dayIdx ? "cur" : ""}">
    <div>${p.m}월 ${p.d}일 (${p.w})${i === 0 ? "<em>최신</em>" : ""}</div><span>기사 ${d.count}건</span></button></li>`; }).join("");
  $("#scrim").hidden = false; $("#sheet").hidden = false;
  const cur = $("#days .cur"); if (cur) cur.focus();
}
function closeSheet(){ $("#scrim").hidden = true; $("#sheet").hidden = true; $("#btnPast").focus(); }

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { dayIdx = +go.dataset.go; closeSheet(); render(); window.scrollTo({top: 0}); }
});
function stepFs(d){ fsIdx = Math.min(FS.length - 1, Math.max(0, fsIdx + d)); store.set("dn-fs", FS[fsIdx]); applyFs(); }
$("#fsDown").addEventListener("click", () => stepFs(-1));
$("#fsUp").addEventListener("click", () => stepFs(1));
$("#btnPast").addEventListener("click", openSheet);
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
$("#toTop").addEventListener("click", () => window.scrollTo({top: 0, behavior: "smooth"}));
applyFs();
render();
</script>

</body></html>
