<script>
const DATA = {"days":[{"date":"2026-11-12","count":15,"pdf_count":24,"highlights":[{"n":1,"text":"주택공급 걸림돌 '버티기·알박기' 뽑아낸다"},{"n":6,"text":"한달새 1.5만건 불어난 서울·경기 아파트 매물…집값 하락 신호탄?"},{"n":12,"text":"홍지선 \"재초환 부과 기준 조만간 결론…혼란 막을 것\""}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"주택공급 걸림돌 '버티기·알박기' 뽑아낸다","meta":"2026.11.11 17:29 · 한국경제","body":"정부가 재개발 현장의 명도집행 방해와 이른바 '알박기' 등 정비사업 지연 요인에 대한 전국 실태조사에 착수한다. 이재명 대통령이 지난 10일 국무회의에서 이 문제를 거론하며 경찰청과 행정안전부, 법무부에 관련 사례를 전수 점검하라고 지시한 데 따른 후속 조치다. 올해 수도권 주택 착공 목표는 26만8000가구이지만 10월 둘째 주까지 착공 물량은 9만9000여 가구로 목표의 37%에 그쳤다. 국토교통부는 이주비 대출 기준 변경과 인허가·금융 통합지원센터 출범 등 지원책을 함께 추진하고 있다. 업계에서는 알박기 처벌 요건을 명확히 하는 등 제도 정비가 병행돼야 실효성이 있다는 의견이 나온다.","url":"https://www.hankyung.com/article/2026111108941"},{"n":2,"title":"홍지선 국토장관, 주 2회 공급 현장 방문… 3기 신도시·정비구역 직접 챙긴다","meta":"2026.11.12 04:00 · 머니투데이","body":"홍지선 국토교통부 장관이 지난 9월 취임 이후 매주 1~2회 주택공급 현장을 직접 방문하며 사업 진행 상황을 점검하고 있다. 수도권 3기 신도시와 재건축 구역, 도심 공공주택 복합사업 등이 주된 점검 대상이다. 홍 장관은 최근 약수역 공공주택 복합사업 현장을 찾아 서울시에 절차를 서둘러 달라고 요구했고, 신규택지로 발표된 김포아라지구(3만7000가구)에 대해서는 입주 전까지 서울지하철 5호선 연장사업을 마칠 수 있도록 지원하겠다고 밝혔다. 정부는 수도권에서 향후 5년간 150만가구 이상 착공을 목표로 하고 있으며, 연내 통합 주택공급 지원센터 출범을 추진 중이다.","url":"https://www.mt.co.kr/estate/2026/11/12/2026111119484626786"},{"n":3,"title":"국토부·서울시 전방위 충돌…도심복합 승인권부터 남산 곤돌라까지","meta":"2026.11.12 05:05 · 뉴스1","body":"국토교통부와 서울시가 주요 주택공급 현안을 놓고 전방위로 충돌하고 있다. 홍지선 국토부 장관은 서울시의 사전기획협의체 운영이 도심 공공주택 복합사업 지연의 원인이라며 \"법에 없는 절차로 사업이 지연되고 있다\"고 지적했다. 갈등 사안은 도심복합사업 승인권뿐 아니라 남산 곤돌라, GTX-A 삼성역 등으로 번지고 있다. 여권에서는 용산공원 부지를 활용한 주택공급 법안 발의도 추진되고 있어 양측의 대립이 당분간 이어질 전망이다.","url":"https://www.news1.kr/realestate/general/6350924"}]},{"name":"시장동향","articles":[{"n":6,"title":"한달새 1.5만건 불어난 서울·경기 아파트 매물…집값 하락 신호탄?","meta":"2026.11.11 17:13 · 머니투데이","body":"서울과 경기 지역 아파트 매물이 한 달 사이 1만5500건 이상 늘었다. 서울은 7만4576건에서 8만1714건으로 7138건(9.6%) 증가했고, 경기는 15만4543건에서 16만2906건으로 8363건(5.4%) 늘었다. 노원구와 성북구 등 외곽·중저가 지역의 매물 증가가 두드러졌고, 경기에서는 안양 동안구와 성남 분당구의 증가폭이 컸다. 이들 지역은 올해 경기에서 집값이 가장 많이 오른 곳이다. 업계에서는 대출 규제와 금리 부담, 단기 급등 피로감이 겹치며 매수자의 관망세가 짙어진 결과라는 분석이 나온다.","url":"https://www.mt.co.kr/estate/2026/11/11/2026111114261264163"},{"n":7,"title":"\"강남은 빠지고 성북은 뛰고\"…15억 이하로 번진 서울 집값 온기","meta":"2026.11.12 06:00 · 뉴시스","body":"서울 주택시장에서 고가 지역과 중저가 지역의 흐름이 뒤바뀌는 현상이 나타나고 있다. 강남구와 서초구, 송파구 등 고가 지역은 13주 연속 하락세를 보인 반면 15억원 이하 중저가 지역은 상승세를 이어가고 있다. 특히 성북구의 오름세가 두드러진다. NH투자증권 관계자는 비싼 동네는 내려오고 중위가격 지역은 올라오면서 가격 격차가 좁혀지고 있다고 설명했다. 대출 규제로 수요가 15억원 이하 구간에 몰린 영향이 크며, 내년에도 상승폭은 둔화되겠지만 부족한 입주 물량이 가격을 떠받칠 것이라는 전망이 제시됐다.","url":"https://www.newsis.com/view/?id=NISX20261111_0003863450"},{"n":8,"title":"동탄 묶어도 병점 5%↑…경기 12곳 집값 '규제선' 넘었다","meta":"2026.11.12 06:00 · 뉴시스","body":"정부가 지난 7월 경기 화성 동탄구와 용인 기흥구, 구리시를 규제지역으로 추가 지정한 뒤 인접한 비규제지역으로 아파트값 강세가 번지고 있다. 비규제지역 29개 시·구 가운데 12곳이 규제지역 지정 기준을 넘어선 것으로 나타났다. 8~10월 수원 권선구가 5.53%, 군포시가 5.45%, 화성 병점구가 5.05% 올랐다. 경기 전체 3분기 거래량은 23.2% 줄었지만 이들 12곳은 0.3% 늘었고 오산시와 병점구는 각각 34.7%, 24.6% 증가했다. 전문가들은 대출 규제를 피하려는 수요가 비규제지역으로 이동한 풍선효과로 분석했다.","url":"https://www.newsis.com/view/?id=NISX20261111_0003864382"}]},{"name":"정비사업","articles":[{"n":12,"title":"홍지선 \"재초환 부과 기준 조만간 결론…혼란 막을 것\"","meta":"2026.11.11 19:37 · 한국경제","body":"홍지선 국토교통부 장관이 재건축초과이익환수제 부담금 부과 시점과 관련해 유권해석을 의뢰했으며 결과를 기다리고 있다고 밝혔다. 홍 장관은 조만간 결론을 내려 시장의 혼란을 막겠다고 설명했다. 여당은 공공주택특별법 시행령을 고쳐 서울시장에게 위임된 공공주택 사업승인권을 국토부 장관에게 되돌려 달라고 요구하고 있다. 서울 공공도심복합개발사업은 34곳에서 약 5만9000가구를 공급하는 대규모 사업이다. 홍 장관은 권한 회수를 곧바로 추진하기보다 서울시와의 실무 협의를 신속히 진행하겠다는 입장을 보였다.","url":"https://www.hankyung.com/article/202611111209i"},{"n":13,"title":"안쓰는 땅 많은데…재건축 학교용지 先확보 논란","meta":"2026.11.11 17:28 · 한국경제","body":"서울 양천구 목동 14개 단지 재건축을 앞두고 학교용지 확보 방식을 둘러싼 논란이 커지고 있다. 교육당국은 재건축이 끝나면 초·중학교 207개 학급이 부족해질 것으로 보고 학교용지를 미리 확보해야 한다는 입장이다. 목동6단지는 1362가구에서 2173가구로, 목동5단지는 1848가구에서 3930가구로 늘어나며, 강서양천교육지원청은 두 단지에서만 초등학교 43개 학급이 더 필요하다고 주장한다. 서울시는 기부채납 부지를 우선 공공공지로 지정한 뒤 교육부 심사를 거쳐 학교용지로 바꾸는 방안을 추진하고 있다. 2033~2035년 목동 가구 수는 2만6629가구에서 4만7366가구로 늘어날 전망이다.","url":"https://www.hankyung.com/article/2026111108871"}]},{"name":"금융/세제","articles":[{"n":17,"title":"'稅 부담'에 다주택 털고 실거주… 전월세 매물도 씨 마른다","meta":"2026.11.11 18:14 · 파이낸셜뉴스","body":"세제 개편 압박에 다주택자들이 보유 주택을 팔거나 증여하는 흐름이 뚜렷해지고 있다. 강남 3구의 올해 1~10월 증여 건수는 6056건으로 지난해 같은 기간 6175건에 근접했다. 문제는 전월세 물량 감소다. 서울 아파트 매매 매물은 연초 대비 43% 늘었지만 전세와 월세 매물은 함께 줄었고, 강남구 전세 매물은 1월 5996건에서 4376건으로 감소했다. 토지거래허가구역 규제로 주택을 사면 실거주해야 해 임대 목적 매입이 사실상 막힌 영향이 크다. 전문가들은 전월세 물량 감소가 전셋값 상승을 거쳐 매매가를 밀어 올릴 수 있다고 우려했다.","url":"https://www.fnnews.com/news/202611111814244253"}]},{"name":"임대주택","articles":[{"n":18,"title":"40대, 7억 넘는 전셋집 구했는데…'내 돈 어쩌나' 술렁","meta":"2026.11.11 17:50 · 한국경제","body":"올해 서울 아파트 전세 계약의 32.1%가 보증금 7억원을 넘어섰다. 지난해 25.7%에서 크게 늘어난 수치이며, 수도권 전체로는 15%가 7억원을 초과했다. 보증금이 7억원을 넘으면 주택도시보증공사(HUG)와 한국주택금융공사(HF)의 공적 전세보증에 가입할 수 없어 세입자가 민간 보증을 이용하며 추가 비용을 떠안게 된다. 서울 아파트 중위 전셋값은 6억4667만원, 평균은 7억2898만원으로 조사됐다. 성동구는 전세 계약의 54.5%, 과천시는 91.8%가 7억원을 넘었고, 올해 서울 월세 계약 비중은 51.02%로 2011년 통계 작성 이후 처음 절반을 넘었다.","url":"https://www.hankyung.com/article/2026111109601"},{"n":19,"title":"전세사기 피해 76%가 2030…보증보험 가입은 되레 감소","meta":"2026.11.11 17:38 · 한국경제","body":"올해 9월까지 전세사기 피해로 인정된 사례는 4만1559건이며 이 가운데 20·30대가 3만1534명으로 75.9%를 차지했다. 피해 보증금은 97.7%가 3억원 이하였고 20대는 95.7%가 2억원 이하였다. 지역별로는 수도권이 60.7%, 대전 11.0%, 부산 10.2% 순이었으며 주택 유형은 다세대주택 28.3%, 오피스텔 21.0%, 다가구주택 18.8% 순으로 나타났다. 한국토지주택공사(LH)가 9월 말까지 사들인 피해 주택은 1만1148가구다. 그럼에도 20·30대의 전세보증 가입 건수는 2023년 20만1947건에서 2025년 18만4153건으로 8.8% 줄었다.","url":"https://www.hankyung.com/article/2026111109641"}]},{"name":"택지/도시개발","articles":[{"n":21,"title":"옛 가리봉시장 부지에 공공주택 181가구 들어선다","meta":"2026.11.11 14:47 · 서울경제","body":"서울 구로구 가리봉동 옛 가리봉시장 부지에 공공임대주택 181가구가 들어선다. 전용 25㎡ 137가구와 31㎡ 44가구로 구성되며 주차면 166면과 청년센터, 전통시장 고객지원시설이 함께 조성된다. 당초 174가구에서 181가구로 늘었는데, 모듈러 공법 대신 철근콘크리트 공법을 적용해 높이 제한 안에서 한 개 층을 더 올릴 수 있게 된 덕분이다. 2027년 착공해 2030년 준공할 계획이다. 사업지는 가산디지털단지역에서 약 500m 떨어져 있고 서울디지털산업단지와 가깝다.","url":"https://www.sedaily.com/article/20112990"}]},{"name":"분양정보","articles":[{"n":22,"title":"'100대 1 vs 미달'…청약 큰장 열리자 '옥석 가리기'","meta":"2026.11.11 17:31 · 한국경제","body":"11월 수도권에서 21개 단지 약 7000가구가 분양되는 가운데 단지별 청약 성적이 극명하게 갈리고 있다. 수원 광교 자연앤 센트레빌 지분적립형 주택은 평균 100.46대 1의 경쟁률을 기록했고 공공분양 일부 주택형은 184.3대 1까지 치솟았다. 반면 평택 한화포레나 지제역은 1022가구 모집에 282건만 접수돼 경쟁률이 0.28대 1에 그쳤고 전체 모집 물량의 72.4%가 미달됐다. 전문가들은 대출 규제와 분양가 상승, 지역별 미분양 누적이 겹치며 입지와 가격 경쟁력에 따라 청약 수요가 양극화되고 있다고 분석했다.","url":"https://www.hankyung.com/article/2026111108851"}]},{"name":"논설/사설","articles":[{"n":23,"title":"[사설] 부동산, 당리당략보다 주거안정이 먼저","meta":"2026.11.12 04:05 · 머니투데이","body":"비거주 1주택자의 종합부동산세 공제 한도를 12억원에서 14억원으로 높이는 방안을 두고 당정이 엇갈리는 상황을 다룬 사설이다. 정부는 당초 9억원으로 낮추려다 여당 요구로 12억원을 유지하기로 했지만, 일부 의원은 14억원으로 올려야 한다고 주장하고 있다. 사설은 공제액을 정하는 합리적 근거가 뚜렷하지 않고 표심 우려가 앞선다고 지적했다. 기준은 정치적 유불리가 아니라 주거 안정이어야 한다는 것이 사설의 핵심 주장이다. 내 집 마련을 원하는 사람에게는 감당 가능한 구매 기회를, 세입자에게는 전월세 주택을 충분히 공급하는 일이 먼저라고 강조했다.","url":"https://www.mt.co.kr/opinion/2026/11/12/2026111116315982337"},{"n":24,"title":"[사설] 부동산 세제 당정 엇박자, 서민 주거불안부터 해소해야","meta":"2026.11.11 23:10 · 세계일보","body":"부동산 세제 개편을 둘러싼 여당 내부 갈등을 비판하고 정책 방향 재검토를 촉구한 사설이다. 여권에서 1주택 규제를 더 풀라는 요구가 나오는 배경에 2028년 총선에 대한 우려가 자리하고 있다고 진단했다. 사설은 비거주 1주택에 대한 차등 과세가 공정과세·과세형평과 거리가 멀다고 평가했다. 또 임대주택 공급 축소와 전월세 급등이 서민의 주거 고통을 키우고 있는 것이 현실이라고 지적했다. 정책을 점진적으로 손질하되 임대 물량을 대폭 확대하고 주거비 부담을 덜어주는 데서 출발해야 한다고 제언했다.","url":"https://www.segye.com/newsView/20261111516040"}]}]},{"date":"2026-11-11","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"부정청약 354건 적발…위장전입 334건, 전원 수사의뢰"},{"n":6,"text":"서울 아파트값 91주 연속 상승…역대 최장 기록 또 경신"},{"n":11,"text":"서초·강남 10개 재건축조합, 재초환 폐지 2차 탄원서 제출"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"부정청약 354건 적발…위장전입 334건, 전원 수사의뢰","meta":"2026.11.10 13:35 · 한국경제","body":"국토교통부와 국무조정실 부동산 감독 추진단은 지난해 7월부터 올해 3월까지 서울 등 43개 단지에서 분양한 2만5000가구 당첨자를 전수 점검해 부정청약 의심 사례 354건을 적발하고 전원 수사의뢰하기로 했다. 유형별로는 위장전입이 334건(94.4%)으로 대부분을 차지했고 위장미혼 18건, 청약자격 매매 1건, 위장퇴사 1건이 뒤를 이었다. 서울의 한 의사 부부는 청약 공고일 직전 병원을 퇴사했다가 공고일 직후 재입사하는 방식으로 소득 기준을 맞춰 신혼부부 특별공급에 당첨된 것으로 조사됐다. 점검 대상 가구 수는 지난해 상반기(2만8000가구)보다 줄었지만 적발 건수는 252건에서 354건으로 40.5% 늘었다. 정부는 의료시설 이용내역과 직장 소재지, 전월세 계약내역까지 확인 범위를 넓혔으며, 부정청약이 확정되면 주택 환수와 형사처벌, 10년간 청약 제한 조치가 뒤따른다.","url":"https://www.hankyung.com/article/202611107416i"},{"n":2,"title":"기부채납으로 용적률 올리고 분양가도 높였나…국토부 검증 착수","meta":"2026.11.11 05:05 · 뉴스1","body":"국토교통부가 분양가상한제 적용 아파트의 기부채납 비용 적정성 검증에 착수했다. 국토부는 서초구·송파구 등 지방자치단체에 관련 자료 제출을 요청하고, 기부채납으로 용적률 혜택을 받은 단지가 그 비용을 분양가 가산비에 과다하게 반영했는지 점검하고 있다. 검증 대상에는 기부채납 시설로 분류됐지만 사실상 입주민 전용으로 운영되는 공공시설도 포함된다. 국토부는 이번 점검 결과를 토대로 기부채납 가산비 산정 기준을 손질하는 등 분양가상한제 개편을 추진할 계획이다. 업계에서는 가산비 인정 범위가 좁아지면 정비사업 사업성에 영향이 불가피하다는 반응이 나온다.","url":"https://www.news1.kr/realestate/general/6349618"},{"n":3,"title":"용적률 1.2배 높인다면서…중앙도시계획위 심의 또 받으라는 국토부","meta":"2026.11.11 07:05 · 서울경제","body":"정부가 민간 재개발·재건축의 용적률을 법정 상한의 1.2배까지 올려주는 특례를 추진하면서, 적용 여부를 중앙도시계획위원회 심의로 결정하기로 해 이중 심의 논란이 일고 있다. 지방자치단체 심의에 더해 중앙정부 심의가 추가되면서 사업 속도를 높이겠다는 취지와 달리 절차가 늘어난다는 지적이다. 특례는 3년 한시로 운영되며 강남3구(강남·서초·송파)와 용산구는 시장 과열 우려를 이유로 대상에서 제외된다. 지난해 6월부터 올해 11월까지 강남3구를 뺀 서울 아파트값이 17.23% 올라 강남3구(11.04%)보다 상승폭이 컸던 점을 들어, 사업성이 낮은 지역이 오히려 특례에서 배제될 수 있다는 우려도 제기된다. 국토교통부는 LH가 수도권 22개 구역 3만9000가구를 맡아 2027년 착공하는 공공 주도 정비사업에 무게를 싣고 있다.","url":"https://www.sedaily.com/article/20112568"}]},{"name":"시장동향","articles":[{"n":6,"title":"서울 아파트값 91주 연속 상승…역대 최장 기록 또 경신","meta":"2026.11.11 06:30 · 한국경제","body":"한국부동산원 주간 조사에서 서울 아파트 매매가격이 0.07% 올라 91주 연속 상승을 기록했다. 문재인 정부 시절 최장 기록인 86주를 이미 넘어섰고, 내년 1월 첫째 주까지 오름세가 이어지면 전례 없는 100주 연속 상승이 된다. 강북권이 0.19% 올라 상승을 이끈 반면 강남권은 0.03% 내렸으며, 서대문구(0.31%)·금천구(0.30%)·성북구(0.30%)의 상승폭이 컸다. 다만 증시 변동성과 가격 피로감으로 매수세 자체는 약해졌다는 것이 현장의 평가다. 전문가들은 상승세가 비규제 외곽으로 번지는 풍선효과가 나타나면 규제지역 추가 지정과 대출 규제 강화로 이어질 수 있다고 내다봤다.","url":"https://www.hankyung.com/article/2026111080226"},{"n":7,"title":"서울서 집 넓히려면 4억4000만원…소형 거래 쏠림 심화","meta":"2026.11.10 17:25 · 한국경제","body":"올해 3분기 서울에서 전용 60㎡ 이하 소형 아파트 대신 60~85㎡ 중형을 사려면 평균 4억4000만원을 더 부담해야 하는 것으로 나타났다. 서울 소형 평균 가격은 8억149만원, 중형은 12억4107만원이었고, 경기는 두 면적대 격차가 1억5000만원 수준에 그쳤다. 가격 부담이 커지면서 서울의 소형 거래 비중은 3분기 47.2%로 2년 새 7.4%포인트 올라 전체 면적대 가운데 가장 높았다. 서울 아파트 거래량은 1만3251건으로 전년 동기 대비 27.7% 줄었지만 소형의 감소폭은 상대적으로 작았다. 반면 경기는 60~85㎡ 거래가 49.0%로 절반에 육박해 이른바 국민평형 선호가 유지됐다.","url":"https://www.hankyung.com/article/2026111082551"},{"n":8,"title":"2년 내 수도권 오피스텔 2만3400실 공급 가능…6억원 기준이 걸림돌","meta":"2026.11.10 18:22 · 파이낸셜뉴스","body":"2027~2028년 2년간 수도권에서 공급 가능한 오피스텔이 2만3400여 실에 이르는 것으로 조사됐다. 민간 보유 토지에서 8728실, LH 미분양 택지에서 1만4720실이 나올 수 있다는 집계다. 그러나 현행 제도가 오피스텔을 빌라·도시형생활주택과 묶어 전용 60㎡ 이하, 수도권 6억원 이하를 주택 수 제외 요건으로 두고 있어 실제 공급으로 이어지기 어렵다는 지적이 나온다. 업계는 가격 기준을 수도권 9억원·지방 6억원으로 올리고 면적 기준도 전용 85㎡ 이하로 넓혀야 한다고 요구하고 있다. 아울러 일몰제로 운영되는 현행 특례를 상시 제도로 전환하고 1세대 1주택 특례 세제 혜택 범위를 확대해 달라는 의견도 제기됐다.","url":"https://www.fnnews.com/news/202611101822288214"}]},{"name":"정비사업","articles":[{"n":11,"title":"서초·강남 10개 재건축조합, 재초환 폐지 2차 탄원서 제출","meta":"2026.11.10 12:37 · 파이낸셜뉴스","body":"서초구가 재건축초과이익환수제 폐지를 촉구하는 2차 탄원서를 국토교통부에 전달했다. 탄원에는 주민 6936명이 참여했고, 반포현대·반포3주구 등 서초구 9개 재건축조합과 강남구 1개 조합 등 모두 10개 조합이 이름을 올렸다. 조합들은 재초환이 실현되지 않은 잠재 이익에 부담금을 매겨 사유재산권을 침해하고, 기부채납·재산세·양도세에 더해지는 이중·삼중 과세라고 주장했다. 서초구는 재건축부담금 부과기한에 대한 명확한 유권해석을 13일까지 회신해 달라고 공문으로 요청했다. 전성수 서초구청장은 폐지해야 마땅한 제도라면서도 현행법에 따라 절차를 이행할 수밖에 없다는 입장을 밝혔다.","url":"https://www.fnnews.com/news/202611101152371504"},{"n":12,"title":"재초환 부담에 눌린 강남 재건축…가격 메리트 커졌다는 분석도","meta":"2026.11.11 06:00 · 뉴시스","body":"재건축초과이익환수 부담금 부과 가능성이 강남권 재건축 단지의 시세를 끌어내리는 요인으로 작용하고 있다. 재초환은 사업 개시·준공 시점에 따라 부담금이 2억원 이상 차이 날 수 있어 매수자들이 가격을 깎는 근거로 삼고 있다는 설명이다. 대치동 은마아파트와 잠실주공5단지의 작은 평형은 각각 30억원대, 36억원대까지 조정받았다. 김건우 분전아카데미 대표는 초기 재개발보다 이미 사업이 진행된 재건축이 생각보다 비싸지 않다며, 재초환을 감안해도 현재 강남 재건축의 가격 메리트가 가장 크다고 평가했다. 다만 주변 신축 가격이 추가로 내리면 재건축도 함께 조정받을 수 있어 매수 시점 판단이 필요하다는 신중론도 함께 제시됐다.","url":"https://www.newsis.com/view/NISX20261110_0003861733"},{"n":13,"title":"디에이치반포124 분양공고에 공공보행통로 통행권 명시","meta":"2026.11.11 06:00 · 서울경제","body":"서초구가 다음 달 분양하는 디에이치반포124의 입주자모집공고에 공공보행통로 지역권 설정 내용을 담기로 했다. 계약서뿐 아니라 분양공고 단계에서 통행 권리를 알려, 입주 후 생기는 통로 폐쇄 분쟁을 사전에 차단하겠다는 취지다. 그동안 재건축조합은 인허가 과정에서 개방을 약속하지만, 입주 후 구성된 입주자대표회의가 외부인 통행을 막는 사례가 반복돼 왔다. 서초구는 1억2000만원을 들여 연구용역을 발주해 통행로를 막는 관리주체에 대한 행정처분 근거를 마련하고 서울시·국토교통부에 제도 개선을 건의할 계획이다. 강남구와 송파구의 대규모 정비사업에도 공공보행통로가 예정돼 있어 이번 조치가 선례가 될 것으로 보인다.","url":"https://www.sedaily.com/article/20112591"}]},{"name":"금융/세제","articles":[{"n":14,"title":"장특공제 정부안대로면 양도세 7억 늘어…여당 완화론에 강남 촉각","meta":"2026.11.11 05:20 · 뉴스1","body":"정부가 추진하는 장기보유특별공제 축소안이 그대로 시행되면 강남권 고가 주택의 양도소득세 부담이 최대 7억원 이상 늘어날 수 있다는 전망이 제시됐다. 더불어민주당 소속 서울 지역 의원들을 중심으로 공제 축소 폭을 완화해야 한다는 요구가 제기되고 있고, 관련 국민동의청원 참여자는 2만4000명을 넘어섰다. 집주인들은 세 부담이 확정되기 전까지 매도 시점을 저울질하며 국회 논의를 지켜보는 분위기다. 다만 전문가들은 세 부담이 다소 줄더라도 대출 규제가 유지되는 한 강남권 매매·전세시장에 미치는 영향은 제한적일 것으로 평가했다. 세제개편안은 종부세 기본공제 등 다른 쟁점과 맞물려 국회 심의가 진행 중이다.","url":"https://www.news1.kr/realestate/general/6349629"},{"n":15,"title":"이형일 부총리 \"종부세 공제, 실거주 우대 원칙 지켜야\"","meta":"2026.11.10 19:31 · 한국일보","body":"이형일 부총리 겸 기획재정부 장관이 종합부동산세 기본공제를 거주용과 비거주용에 동일하게 적용하면 실거주 우대 원칙이 지켜지지 않는다고 밝혔다. 정부 원안은 실거주 1주택자 공제를 14억원으로 올리고 비거주 1주택자는 9억원으로 낮추는 내용이었다. 더불어민주당 서울 지역 의원들은 비거주 공제액도 12억원에서 14억원으로 올려 달라고 요구해 왔다. 당정협의 결과 비거주 공제액을 9억원으로 축소하는 방안은 폐기되고 현행 12억원이 유지되는 것으로 정리됐다. 정부는 부득이한 사유로 거주하지 못하는 경우에는 14억원 수준의 공제를 적용할 수 있도록 시행령에서 정하기로 했다.","url":"https://www.hankookilbo.com/news/article/A2026111019110004863"}]},{"name":"임대주택","articles":[{"n":17,"title":"전셋값 뛰는데 전세대출 금리까지…세입자 주거비 이중고","meta":"2026.11.10 14:49 · 아주경제","body":"5대 은행이 지난 9월 새로 취급한 전세자금대출 평균금리는 연 4.47%로 전월보다 0.15%포인트 올랐고, 1년 전(연 3.74%)과 비교하면 0.73%포인트 상승했다. 같은 4억원을 빌려도 연간 이자가 1496만원에서 1788만원으로 늘어 월 24만원가량 부담이 커지는 셈이다. 서울 아파트 평균 전셋값은 지난달 7억2898만원으로 1년 전보다 10.9% 올랐다. 서울 아파트 전세 매물은 2만6069건에서 2만1721건으로 16.7% 줄어 품귀 현상이 이어지고 있다. 올해 9월까지 서울 아파트 임대차 거래 중 월세 비중은 52.7%로 작년 같은 기간보다 8.3%포인트 높아졌다.","url":"https://www.ajunews.com/view/20261110142424375"},{"n":18,"title":"올림픽파크포레온 전세 만기 1056건 동시 도래…보증금 7499억원","meta":"2026.11.10 13:52 · 서울경제","body":"국내 최대 단지인 강동구 올림픽파크포레온(1만2032가구)에서 입주 2년 만에 전세 계약 만기가 한꺼번에 돌아오면서 서울 동남권 전세시장이 흔들리고 있다. 다음 달부터 내년 3월까지 만기가 도래하는 임대차 계약은 1056건, 보증금 합계는 7499억원이며, 내년 11월까지로 넓히면 1301건·9157억원에 이른다. 전용 84㎡ 전세는 올해 초 11억원에서 16억5000만원으로, 전용 59㎡는 13억원 수준으로 뛰었다. 2024년 2월 주택법 개정으로 실거주 의무 시작 시점이 최초 입주 가능일로부터 3년 뒤로 미뤄졌는데, 통상적인 2+2년 전세 계약과 맞물리면서 집주인들이 내년 11월까지 집을 비워 달라고 요구하는 상황이 벌어지고 있다. 업계는 공급 부족이 2027년까지 이어지다가 집주인들의 실거주 의무가 끝나는 2028년 11월 이후에야 숨통이 트일 것으로 보고 있다.","url":"https://www.sedaily.com/article/20112416"}]},{"name":"분양정보","articles":[{"n":19,"title":"국내 첫 지분적립형 공공분양 1순위 경쟁률 100대 1","meta":"2026.11.11 01:24 · 한국경제","body":"경기주택도시공사(GH)가 수원 광교신도시에 공급한 광교 자연앤 센트레빌의 지분적립형 일반공급 72가구에 7233명이 몰려 1순위 경쟁률 100.45대 1을 기록했다. 특별공급에서도 지분적립형 168가구에 1만1985건이 접수돼 71.34대 1의 경쟁률을 나타냈으며, 일반 공공분양 물량보다 약 2배 높았다. 지분적립형은 분양대금을 20~30년에 걸쳐 4~5년 간격으로 나눠 내면서 주택 지분을 단계적으로 취득하는 방식으로, 최초 취득 지분은 25% 수준이다. 초기 자금 부담이 작아 실수요자 관심이 높았다는 분석이 나온다. LH는 다음 달 고양창릉 S2블록 1057가구 가운데 284가구를 지분적립형으로 공급할 예정이다.","url":"https://www.hankyung.com/article/2026111086411"}]},{"name":"논설/사설","articles":[{"n":20,"title":"[사설] 종부세 완화 놓고 맞선 당청, 전월세 불안부터 살펴야","meta":"2026.11.10 21:19 · 서울신문","body":"사설은 여당이 종부세 완화를 요구하고 청와대가 실거주 우대 원칙을 고수하면서 당청 이견이 좁혀지지 않고 있다고 지적했다. 국회 검토보고서를 인용해 실거주자에 대한 세제 혜택이 임대주택 공급을 줄이고 임대료 상승을 부를 수 있다는 점을 경고했다. 서울 아파트 전세 매물이 1년 전보다 15.6% 줄고 월세는 1년 새 22만원 올라 세입자 부담이 커진 현실도 함께 제시했다. 시민 74%가 전월세 부담이 늘었다고 답했고 43%는 전월세 안정을 최우선 과제로 꼽았다는 조사 결과도 인용됐다. 사설은 집 가진 사람의 세금만 문제가 아니라 집 없는 서민의 주거 불안도 절박하다며 임대 물량 유지와 주거비 완화 대책을 함께 마련할 것을 촉구했다.","url":"https://www.seoul.co.kr/news/editOpinion/editorial/2026/11/11/20261111027007"}]}]},{"date":"2026-11-10","count":15,"pdf_count":22,"highlights":[{"n":1,"text":"전세사기 피해 보증금, 정부가 최소 3분의 1 보장…10일 사전신청"},{"n":5,"text":"토지거래허가구역이 갈랐다…산본 거래 2배 늘 때 분당은 반토막"},{"n":9,"text":"'강남권 재초환 1호' 반포현대에 179억 통지…1인당 2억2000만원"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"전세사기 피해 보증금, 정부가 최소 3분의 1 보장…10일 사전신청","meta":"2026.11.09 18:04 · 한국경제","body":"국토교통부가 전세사기 피해자가 돌려받지 못한 임차보증금의 최소 3분의 1을 보장하는 '최소보장제'를 13일부터 시행한다. 10일부터는 LH 청약플러스에서 온라인 사전신청을 받는다. 경·공매로 회수한 금액이 보증금의 3분의 1에 못 미치면 정부가 부족분을 현금으로 지급하는 구조로, 보증금 1억원 중 1000만원만 회수했다면 2333만원을, 한 푼도 받지 못했다면 3333만원을 받는다. 신탁사기처럼 적법한 임대 권한이 없는 사람과 계약한 피해자는 경·공매 절차가 끝나기 전에도 지원금을 먼저 받을 수 있다. 신청 후 90일 이내에 지급 여부가 결정된다.","url":"https://www.hankyung.com/article/2026110957081"},{"n":2,"title":"민주당 수도권 의원 20여 명 '전실모' 결성…11일 전월세 토론회로 출범","meta":"2026.11.09 16:27 · 신아일보","body":"더불어민주당 수도권 지역구 의원 20여 명이 '전월세 주거 안정화를 위한 부동산 실용주의 의원 모임'(전실모)을 결성하고 11일 국회에서 첫 공개 토론회를 열어 공식 출범한다. 김영배·김준혁·민병덕·박민규 의원 등이 참여한다. 이들은 정부 주택정책이 강남 집값 억제에 치우쳐 중산층·서민의 전월세 시장 안정에는 소홀했다고 지적한다. 전세시장 불안이 '생존형 매수'로 이어져 서울 외곽 집값을 밀어올렸다는 문제의식 아래 비거주 1주택 규제와 대출 규제를 다시 살펴보겠다는 계획이다. 토론회에서는 명지대·중앙대 교수진이 분석과 대안을 발표한다.","url":"https://www.shinailbo.co.kr/news/articleView.html?idxno=5081433"},{"n":3,"title":"'비거주 14억' 요구한 여당에 대통령실 제동…당청 엇박자 노출","meta":"2026.11.10 00:16 · 서울신문","body":"더불어민주당이 1주택자 종합부동산세 기본공제를 거주 여부와 관계없이 14억원으로 통일하자고 공개 요구했으나 대통령실이 난색을 표했다. 권칠승 민주당 정책위의장은 정부와 논의를 이어가겠다고 밝혔지만, 대통령실은 부동산 세제가 회의 안건이 아니었다며 선을 그어 당정 간 엇박자가 드러났다. 현재 정부안은 실거주 1주택 14억원, 비거주 1주택 12억원으로 공제를 차등화하는 내용이다. 수도권 지역구 의원들은 2028년 총선을 앞두고 부동산 민심 악화를 우려하고 있다. 진보당은 노정현 대변인을 통해 투기 목적 보유자의 세 부담을 줄이는 것은 용납할 수 없다고 비판했다.","url":"https://www.seoul.co.kr/news/politics/2026/11/10/20261110004003"}]},{"name":"시장동향","articles":[{"n":5,"title":"토지거래허가구역이 갈랐다…산본 거래 2배 늘 때 분당은 반토막","meta":"2026.11.09 18:06 · 한국경제","body":"지난해 10·15 대책 이후 1년간 수도권 1기 신도시 아파트 거래가 토지거래허가구역 지정 여부에 따라 엇갈렸다. 군포 산본은 1532건에서 3190건으로 108.2%, 부천 중동은 1546건에서 2842건으로 83.8% 늘었고 고양 일산도 34% 증가했다. 반면 허가구역으로 묶인 성남 분당은 5033건에서 2967건으로 41.0% 줄었고 안양 평촌도 2.5% 감소했다. 가격은 반대로 움직여 분당 3.3㎡당 중위가격은 5224만원에서 7081만원으로 35.5% 올랐고 평촌은 22% 상승한 반면, 산본은 8.3%, 중동은 5.4% 오르는 데 그쳤고 일산은 2% 내렸다. 허가구역에서는 매수 후 실거주 의무가 붙어 갭투자가 막히면서 거래가 위축된 것으로 풀이된다.","url":"https://www.hankyung.com/article/2026110957091"},{"n":6,"title":"서울 전세난, '준서울' 광명으로…경기 전셋값 상승률 1위","meta":"2026.11.10 05:20 · 뉴스1","body":"서울 전세난이 '준서울'로 불리는 경기 광명으로 번지고 있다. 광명 아파트 전셋값은 올해 들어 15.1% 올라 경기도에서 가장 높은 누적 상승률을 기록했다. 전세 매물은 1년 전 같은 시기보다 73.7% 줄어든 558건에 그쳐 품귀 현상이 뚜렷하다. 1000가구가 넘는 단지에서도 전세 물건이 한 건도 없다는 현장 중개업소 설명이 나온다. 고준석 교수는 재건축 이주 수요가 전세시장을 더 불안하게 만들 수 있다고 내다봤으며, 하안주공 이주도 변수로 꼽힌다.","url":"https://www.news1.kr/realestate/general/6348061"}]},{"name":"정비사업","articles":[{"n":9,"title":"'강남권 재초환 1호' 반포현대에 179억 통지…1인당 2억2000만원","meta":"2026.11.09 17:01 · 뉴스1","body":"서울 서초구가 반포현대(현 반포센트레빌아스테리움) 재건축조합에 재건축초과이익 부담금 예정액 179억원을 통지했다. 조합원 80명 기준으로 1인당 약 2억2000만원 수준이다. 강남권에서 재초환 부담금 부과 절차가 본격화된 첫 사례로, 조합은 50일간 이의신청을 할 수 있고 검토를 거쳐 금액이 달라질 수 있다. 대치동 은마아파트에는 1인당 평균 4억6000만원대 부담금 예정액이 통지된 것으로 전해졌다. 업계에서는 부담금이 현실화되면서 강남권 재건축 사업이 위축될 수 있다는 우려가 나온다.","url":"https://www.news1.kr/realestate/general/6348067"}]},{"name":"금융/세제","articles":[{"n":10,"title":"'종부세 공제 14억' 절충안 거론…실거주 인정 범위 넓히나","meta":"2026.11.09 18:03 · 한국경제","body":"1주택자 종합부동산세 기본공제를 둘러싼 당정 이견이 커지면서 절충안이 거론되고 있다. 정부는 비거주 1주택자 차등을 완전히 없애는 데는 선을 그었지만, 실거주로 인정하는 범위를 넓히는 방안이 대안으로 제시된다. 근무지 이전, 질병 치료, 가족 돌봄 등으로 집을 비운 경우 최대 3년까지 실거주로 보는 방식이다. 양도소득세 장기보유특별공제도 2029년 이후 일률적인 한도를 두는 대신 보유 기간에 따라 한도를 차등하는 안이 검토된다. 민주당에서는 30~40년 보유한 1주택자에게 같은 한도를 적용하는 것은 과하다는 의견이 나온다.","url":"https://www.hankyung.com/article/2026110958251"},{"n":11,"title":"여당 요구에 또 흔들리는 세제개편…비거주 1주택 차등 논란 재점화","meta":"2026.11.10 06:00 · 뉴스1","body":"여당 요구로 정부 세제개편안이 다시 흔들리면서 비거주 1주택자 종부세 차등 논란이 재점화됐다. 더불어민주당은 거주 여부와 무관하게 기본공제를 14억원으로 통일하자고 압박하고 있다. 정부는 당초 비거주 1주택 공제를 9억원으로 낮추려다 12억원 유지로 물러섰고, 실거주 14억원·비거주 12억원이라는 차등 자체는 지키겠다는 입장이다. 정부는 가상자산 과세 유예와 개인종합자산관리계좌(ISA) 축소 철회 등도 잇따라 내놓았다. 전문가들은 사전 협의와 설명이 부족한 채 수정이 반복돼 정책 신뢰가 떨어지고 있다고 지적한다.","url":"https://www.news1.kr/economy/trend/6348171"}]},{"name":"임대주택","articles":[{"n":14,"title":"LH, 서울 역세권 오피스텔 1000가구 매입…노·도·강은 한도 없이","meta":"2026.11.09 16:12 · 한국경제","body":"한국토지주택공사(LH)가 청년·신혼부부 임대주택으로 공급할 서울 역세권 주거용 오피스텔 1000가구를 매입한다. 지하철역 출입구에서 1km 이내, 2011년 1월 이후 사용승인, 30실 초과 건물, 전용 85㎡ 이하가 대상이다. 청년형은 전용 16~60㎡, 신혼·신생아형은 방 2개 이상인 36~85㎡를 받는다. 노원·도봉·강북구 오피스텔은 1000가구 한도와 무관하게 신청 물량에 따라 추가로 매입한다. 사용승인 1년 이내이고 기존 세입자가 없어 바로 입주자를 모집할 수 있는 신축을 우선하며, 매도 희망자는 12월 4일까지 신청할 수 있다.","url":"https://www.hankyung.com/article/202611095484i"},{"n":15,"title":"\"비거주 종부세 올리면 전세 거둬들인다\"…전월세 공급 위축 우려","meta":"2026.11.09 18:57 · 국민일보","body":"2028년 시행 예정인 비거주 1주택자 종부세 공제 차등화를 두고 전월세 공급이 줄어들 수 있다는 경고가 나왔다. 정부안은 1주택자 기본공제를 실거주 14억원, 비거주 12억원으로 나누고 주택 수와 관계없이 최고세율 5%를 적용하는 내용이다. 최한수 교수는 비거주자에게 불이익을 주면 사실상 서울 전역을 비우라는 신호가 돼 정치적으로 지속하기 어렵다고 지적했다. 김인만 부동산경제연구소장은 서울의 비거주 1주택자를 약 83만 명으로 추산하며 이들의 세입자 주거 안정이 흔들릴 수 있다고 우려했다. 민주당은 장기보유 혜택 축소에는 공감하면서도 공정과세를 넘어선 정책 목적에 보유세를 쓰는 것에는 의문을 제기했다.","url":"https://www.kmib.co.kr/article/20261109501719"}]},{"name":"택지/도시개발","articles":[{"n":16,"title":"송도 생활형숙박시설, 오피스텔로 전환…연수구 첫 사례 214실","meta":"2026.11.09 18:05 · 한국경제","body":"인천경제자유구역청이 4일 '힐스테이트 송도 스테이에디션' 214실의 오피스텔 용도변경을 승인했다. 송도가 있는 연수구에서 생활형숙박시설이 오피스텔로 바뀐 첫 사례다. 2024년 6월 준공된 이 건물은 608실 규모로, 업무지구라는 지구단위계획 제약 때문에 전환이 미뤄져 왔으나 인천경제청이 9월 지구단위계획을 바꿔 길을 열었다. 시행사인 고려자산개발이 공공기여금 43억원을 부담해 수분양자가 따로 낼 비용은 없다. 608실 가운데 214실이 전환을 마쳤고 19실이 2차 신청을 기다리고 있으며, 나머지도 소유자가 원하면 전환할 수 있다.","url":"https://www.hankyung.com/article/2026110957061"}]},{"name":"분양정보","articles":[{"n":17,"title":"10일 수도권 7곳 1순위 청약…일반분양 3823가구 쏟아진다","meta":"2026.11.09 18:07 · 한국경제","body":"10일 전국 12개 단지에서 5215가구의 청약이 진행되며 이 가운데 약 80%가 이날 하루에 몰린다. 평택·의정부·구리 등 수도권 7곳에서 1순위 청약을 받고 일반분양 물량은 3823가구다. 공급 규모가 가장 큰 단지는 한화 건설부문이 평택시 세교동에 짓는 '한화포레나 지제역'으로 전용 84~116㎡ 1098가구를 모두 일반분양한다. 평택 고덕 우미린(623가구), 의정부 '힐스테이트 회룡역 파크뷰'(909가구), 수원 광교신도시의 국내 첫 지분적립형 공공분양 '광교 자연앤 센트레빌'(600가구)도 포함된다. 시흥·구리·용인 단지와 춘천·구미 등 지방 2곳도 같은 날 청약을 받는다.","url":"https://www.hankyung.com/article/2026110957121"},{"n":18,"title":"지방 청약자 41%가 '1000가구 이상 대단지'로 몰렸다","meta":"2026.11.09 14:12 · 서울경제","body":"지방 분양시장에서 1000가구가 넘는 대단지로 청약 수요가 쏠리고 있다. 올해 10월까지 지방에서 분양한 100개 단지 가운데 대단지는 공급량의 20% 수준인데, 전체 청약자 13만3001명 중 41.3%인 5만4886명이 대단지에 몰렸다. 단지당 평균 청약 건수는 대단지가 2744건으로 그 외 단지 976건의 2.8배였다. 경쟁률 상위 20개 단지 중 6곳이 대단지였고, 진주 '포레나 힐스테이트'가 21.15대 1, 천안 '아이파크시티'가 11.01대 1을 기록했다. 업계는 커뮤니티·관리비·환금성 등 규모의 경제 효과로 검증된 단지에 수요가 집중된다고 설명한다.","url":"https://www.sedaily.com/article/20111947"}]},{"name":"논설/사설","articles":[{"n":20,"title":"[사설] 여당도 수긍하지 못하는 정부의 부동산 세제 개편","meta":"2026.11.10 00:10 · 한국일보","body":"더불어민주당이 8일 당정협의에서 정부 종합부동산세 개편안의 수정을 요구했다고 사설은 전했다. 정부안은 1주택자 기본공제를 실거주 14억원, 비거주 12억원으로 차등하는 내용으로, 비거주 공제는 당초 9억원에서 12억원으로 한 차례 올라온 수치다. 여당은 거주 여부로 나누지 말고 14억원으로 통일해야 한다고 주장한다. 사설은 서울 집값이 91주 연속 오른 상황에서 2028년 총선을 의식한 여당이 사정상 집을 세놓은 사람의 세 부담 증가를 우려한다고 짚었다. 정부는 집을 투자 대상이 아니라 사는 곳으로 봐야 하며 거주 여부에 따른 차등이 공평하다는 입장이다.","url":"https://www.hankookilbo.com/news/article/A2026110914390002109"},{"n":21,"title":"[세종로의 아침] 매물 늘고 거래량 줄면, 집값은 내려갈까","meta":"2026.11.10 00:27 · 서울신문","body":"허백윤 산업부 기자는 8·3 세제개편 발표 이후 서울 아파트 매물이 8월 3일 6만409건에서 11월 8일 8만528건으로 33.3% 늘어난 점에 주목했다. 강남3구가 서울 전체 매물의 38%를 차지하며, 올해 누적 변동률은 강남구 -2.02%, 서초구 -0.23%로 하락 흐름이 뚜렷하다. 그러나 서울 집값은 91주 연속 상승 중이고 주간 상승폭만 0.16%에서 0.07%로 줄었을 뿐이다. 칼럼은 강남 아파트값이 2억원 내리는 사이 강북과 외곽에서는 매매가와 전셋값이 1억~2억원씩 오르고 월세도 뛰었다고 지적했다. 매물 증가와 거래 감소가 실수요자의 주거 불안을 덜어줄지에 대해서는 회의적인 시각을 드러냈다.","url":"https://www.seoul.co.kr/news/editOpinion/column/politics-story/2026/11/10/20261110025001"}]}]},{"date":"2026-11-09","count":15,"pdf_count":26,"highlights":[{"n":1,"text":"LH, 공공주택 종합심사낙찰제 10년 만에 손질…\"공사비 거품 뺀다\""},{"n":4,"text":"서울 아파트 매물 8만건 돌파…석 달 새 33% 늘었지만 거래는 급감"},{"n":10,"text":"재건축부담금 5조3000억 통보…79개 사업장에 청구서"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"LH, 공공주택 종합심사낙찰제 10년 만에 손질…\"공사비 거품 뺀다\"","meta":"2026.11.06 17:20 · 한국경제","body":"한국토지주택공사(LH)가 2015년 도입한 종합심사낙찰제를 10년 만에 개편해 실질적인 가격경쟁을 유도하기로 했다. 경쟁사 평균보다 낮은 금액을 써낸 업체에 더 높은 점수를 주는 방식으로 바꿔, 여러 업체가 같은 금액을 써내 나란히 만점을 받는 관행을 막겠다는 것이다. LH 아파트 공사의 낙찰률은 2021년 75%에서 지난해 92%까지 올랐고, 3300억원 규모 공사에서는 입찰 50개사 중 37개사가 가격 부문 만점을 받은 사례도 있었다. LH는 예정가격 기준을 설계가의 98~102%에서 2015년 이전의 96~100%로 되돌리면 연간 약 13억7000만원을 아낄 수 있다고 추산했다. 정부는 2027년 1월부터 10억원 미만 공사까지 기술자격 심사를 확대할 계획이지만, 건설업계는 자재비 상승 국면에서 적자 시공이 늘 수 있다고 우려한다.","url":"https://www.hankyung.com/article/2026110614281"},{"n":2,"title":"공공주택 사업승인 71%가 일정 연기…최대 6년씩 밀렸다","meta":"2026.11.08 18:38 · 파이낸셜뉴스","body":"최근 1년간 공공주택 사업승인 물량의 71.1%가 일정이 미뤄졌고, 지연 기간은 1개월에서 최대 72개월에 달한 것으로 나타났다. 석문국가산업단지와 장항국가생태산업단지 등 3곳은 6년씩 사업이 늦춰졌다. LH 자료 기준으로 사업승인 후 착공하지 못한 물량은 전국 111개 지구 20만9270가구이며, 이 가운데 79.9%가 토지보상과 기반시설 문제로 지연됐다. 남양주왕숙, 안산신길 등 3기 신도시 사업지도 16~26개월씩 일정이 밀렸다. 이재명 대통령이 보상 절차를 서두르라고 주문했지만, 전문가들은 재산권과 감정평가 분쟁 소지를 고려하면 기간 단축이 쉽지 않다고 지적한다.","url":"https://www.fnnews.com/news/202611081838255680"}]},{"name":"시장동향","articles":[{"n":4,"title":"서울 아파트 매물 8만건 돌파…석 달 새 33% 늘었지만 거래는 급감","meta":"2026.11.08 06:05 · 파이낸셜뉴스","body":"11월 7일 기준 서울 아파트 매매 매물은 8만528건으로, 정부가 세제개편안을 발표한 8월 3일의 6만409건보다 2만119건(33.3%) 늘었다. 반면 9월 서울 아파트 매매거래량은 신고일 기준 3915건으로 지난해 같은 달보다 42.4% 줄었다. 매물은 쌓이는데 거래는 끊기는 흐름 속에서 강남3구는 가격이 내리고 나머지 22개 자치구는 올라 지역별 온도차가 뚜렷했다. 2021년에도 세 부담 강화로 매물이 늘었다가 이후 매물이 거둬들여지고 가격이 반등한 전례가 있어, 전문가들은 내년 6월 1일 보유세 과세기준일을 앞둔 4월까지 매물 회수 가능성을 거론한다. 공공주택 공급 정보를 더 적극적으로 알려 매수 대기 수요를 청약으로 돌려야 한다는 제언도 나왔다.","url":"https://www.fnnews.com/news/202611080605530182"},{"n":5,"title":"경기 아파트값 8주째 서울 추월…경매장엔 33명 몰려","meta":"2026.11.08 14:37 · 아시아경제","body":"11월 첫째 주 경기 아파트값은 전주 대비 0.20% 올라 서울 상승폭(0.07%)의 세 배 가까이 됐고, 8주 연속 서울을 앞질렀다. 용인 기흥구와 군포시, 안양 동안구, 화성 동탄구 등 서울 접근성이 좋은 지역이 상승을 이끌었다. 서울은 91주 연속 올랐지만 상승폭은 3주째 줄었고 강남·서초·송파는 하락했다. 규제가 덜한 경기권으로 수요가 옮겨가면서 경매시장에서도 응찰자가 33명까지 몰려 감정가를 웃도는 낙찰 사례가 나왔다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026110814371847452"}]},{"name":"정비사업","articles":[{"n":10,"title":"재건축부담금 5조3000억 통보…79개 사업장에 청구서","meta":"2026.11.08 17:50 · 한국경제","body":"8월 말 기준 전국 79개 재건축 사업장에 통보된 재건축초과이익 부담금 예정액이 5조3000억원에 이르는 것으로 집계됐다. 서울이 53곳 4조3600억원으로 가장 많고, 강남3구와 용산구가 3조800억원으로 서울 전체의 70%를 차지한다. 용산구 한강맨션 조합원은 1인당 약 7억2200만원, 대치동 은마아파트는 평균 4억6300만원을 부담해야 할 것으로 추산됐다. 재초환은 2006년 도입돼 조합원 1인당 초과이익 8000만원을 넘는 금액의 최대 50%를 환수하는 제도다. 조합과 조합원 사이의 납부 책임을 둘러싼 법적 다툼도 정리되지 않아 향후 거래에 혼선이 생길 수 있다는 지적이 나온다.","url":"https://www.hankyung.com/article/2026110833101"},{"n":11,"title":"은마아파트 재초환 예정액 2조444억…조합원 1인당 4억6334만원","meta":"2026.11.06 17:39 · 서울경제","body":"강남구청은 지난 10월 30일 대치동 은마아파트 재건축조합에 재건축부담금 예정액 약 2조444억원을 통지했다. 조합원 1인당 평균 부담액은 약 4억6334만원으로 추산된다. 이번 통지는 확정 고지가 아니라 2035년 10월 15일 준공을 전제로 한 예정액이며, 실제 부담금은 준공 시점의 시세와 개발비용을 반영해 확정된다. 공사비 상승으로 조합원 분담금이 이미 늘어날 전망인 상황에서 부담금까지 겹치면 사업 추진 부담이 크게 커진다는 우려가 나온다. 조합은 2027년 상반기 이주를 목표로 하고 있다.","url":"https://www.sedaily.com/article/20111287"}]},{"name":"금융/세제","articles":[{"n":18,"title":"종부세 기본공제 '14억 통일' 요구에 대통령실 제동…당정 이견","meta":"2026.11.09 07:30 · 서울경제","body":"더불어민주당은 11월 8일 고위당정협의회에서 1주택자 종합부동산세 기본공제를 실거주 여부와 관계없이 14억원으로 통일해 달라고 정부에 요청했다. 대통령실은 실거주와 비거주 구분을 없애면 정책 일관성이 훼손되고 부동산 정책 신뢰가 떨어진다며 수용하기 어렵다는 입장을 밝혔다. 정부는 8월 세제개편안에서 실거주 1주택 공제를 12억원에서 14억원으로 올리고 비거주는 9억원으로 낮추려 했으나, 여당 반발로 9월 수정안에서 비거주 공제를 현행 12억원으로 유지했다. 민주당은 남은 2억원 차이까지 없애야 한다는 입장으로, 내년 보유세 고지서가 2028년 4월 총선을 앞둔 서울 민심에 영향을 줄 수 있다는 우려가 깔려 있다.","url":"https://www.sedaily.com/article/20111698"}]},{"name":"임대주택","articles":[{"n":19,"title":"서울 아파트 월세 비중 51%…중랑구는 85%로 역대 최고","meta":"2026.11.09 06:30 · 한국경제","body":"올해 1~9월 서울 아파트 임대차 계약 중 월세 비중은 51.1%였고 9월에는 55.3%까지 올랐다. 중랑구는 월세 비중이 85%로, 2011년 통계 작성 이후 처음으로 80%를 넘긴 자치구가 됐다. 고금리와 대출 규제로 세입자가 큰 보증금을 마련하기 어려워진 데다, 집주인도 역전세 위험과 세제 변화로 월세를 선호하게 된 영향이다. 서울 월세 비중은 2011년 1월 16.9%에서 올해 6월 55.8%로 역대 최고를 기록했다. 전세 매물은 3년 새 3만3898건에서 11월 6일 기준 2만1783건으로 35.8% 줄었다.","url":"https://www.hankyung.com/article/2026110608116"},{"n":20,"title":"\"월세 내년에도 안 떨어진다\"…전세 줄고 월세 오르는 구조","meta":"2026.11.07 03:00 · 파이낸셜뉴스","body":"서울 아파트 평균 월세가 1년 새 15% 올랐고 임대차 계약 10건 중 4건은 월세가 100만원을 넘는 것으로 나타났다. 전문가들은 고금리와 물가, 임대인의 세 부담 증가가 임차인에게 전가되고 있다고 분석했다. 전월세 전환율이 시장금리를 웃돌 때 전세의 월세 전환이 가격 상승을 더 키운다는 설명이다. 지방은 집값 정체로 전세를 유지할 유인이 줄었고, 서울은 대출 규제가 월세 전환을 앞당기는 등 지역별 원인도 다르다. 전문가들은 내년에도 월세 상승 압력이 이어질 것으로 보며, 전세대출 금리와 월세·매수 비용을 비교해 선택하라고 조언하고 대출 규제 완화와 외곽 매수 세제 지원을 해법으로 제시했다.","url":"https://www.fnnews.com/news/202611070300326152"}]},{"name":"택지/도시개발","articles":[{"n":21,"title":"금천구 석수역 인근 40년 철재상가, 43층 944가구로 탈바꿈","meta":"2026.11.08 07:58 · 아시아경제","body":"서울 금천구 시흥3동 966-2 일대 중앙철재상가 자리가 43층 944가구 규모의 주거·상업 복합단지로 개발된다. 서울시 시장정비위원회가 지난 10월 30일 이 계획을 통과시켰다. 40년 된 철재상가는 화재와 붕괴 위험이 지적돼 왔고 금속 가공 과정의 분진·소음으로 인근 주민 민원도 이어졌다. 금천구는 공공체육시설을 함께 넣고 주변 지형을 고려해 계획을 세웠으며, 지역 활성화 효과를 기대한다고 밝혔다. 행정 절차 고시 후 정비구역으로 정식 지정된다.","url":"https://www.asiae.co.kr/article/real-estate-dev-sales/2026110807584486758"}]},{"name":"주택품질/안전","articles":[{"n":22,"title":"외국인 근로자 늘어난 아파트 건설현장…품질관리 사각지대","meta":"2026.11.08 09:25 · 아시아타임즈","body":"건설현장의 외국인 근로자는 2024년 기준 하루 평균 22만9541명으로 전체 건설인력의 14.7%를 차지해 2020년 11.8%보다 크게 늘었다. 젊은 내국인이 열악한 처우를 이유로 현장을 떠나면서 숙련 인력이 줄어든 결과로, 충분한 교육과 경험 없이 투입되는 사례도 적지 않다. 언어 장벽 탓에 시공 기준과 안전 지시가 제대로 전달되지 않아 감독 공백이 생기고, 이는 아파트 시공 품질 저하로 이어진다는 지적이 나온다. GS건설 등 대형 건설사는 120여개 언어를 지원하는 AI 번역 프로그램을 도입했지만 중소 건설사는 이런 투자를 감당하기 어렵다. 전문가들은 건설기능인 등급제의 실효성을 높이는 등 직업훈련 체계를 손봐야 한다고 강조한다.","url":"https://www.asiatime.co.kr/article/20261105500388"}]},{"name":"분양정보","articles":[{"n":23,"title":"파주 운정·과천 4가구에 8000명 몰려…분상제 청약 과열","meta":"2026.11.08 17:00 · 헤럴드경제","body":"분양가상한제가 적용된 소규모 분양 물량에 청약 수요가 대거 몰렸다. 파주 운정중앙역 우미린 더센트럼은 전용 84㎡ 1가구 모집에 2564명이 신청해 2000대 1을 넘는 경쟁률을 기록했다. 과천 디에트르 프레스티지도 전용 59㎡ 2가구에 3264명이 몰려 1632대 1을 나타냈다. 파주는 시세보다 4000만~5000만원, 과천은 10억원가량 저렴하다는 점이 수요를 끌어모은 배경으로 꼽힌다. 전세난에 따른 수요와 함께, 정부가 12월부터 잔여 물량을 공공주택으로 돌리기 전에 청약하려는 움직임도 겹쳤다는 분석이 나온다.","url":"https://biz.heraldcorp.com/article/10929723"},{"n":24,"title":"서울 연말 분양 3750가구…반포 디에이치 1801가구 최대어","meta":"2026.11.09 06:19 · 서울경제","body":"11~12월 서울에서 12개 단지, 일반분양 약 3750가구가 공급될 예정이다. 9~10월 두 달간 일반분양이 27가구에 그쳤던 것과 비교하면 크게 늘어난 물량이며, 지난해 같은 기간의 6배 수준이다. 최대 단지는 반포주공1단지 1·2·4주구를 재건축하는 서초구 '디에이치 반포 124'로 총 5007가구 중 1801가구가 일반분양돼 연말 물량의 48%를 차지한다. 전용 84㎡ 분양가는 30억원 안팎으로 예상되는데 인근 시세가 57억~62억8000만원대여서 20억~30억원대 시세차익 기대가 나온다. 이 밖에 서초동 롯데캐슬아트팰리스 146가구, 강북구 북서울한울채시그니프 534가구, 종로구 경희궁에피트 135가구 등이 예정돼 있으며, 올해 서울 평균 청약경쟁률이 60대 1에 이른 만큼 분상제 단지에 수요가 집중될 전망이다.","url":"https://www.sedaily.com/article/20111688"}]},{"name":"논설/사설","articles":[{"n":25,"title":"[사설] 재건축 걸림돌 5조 재초환…부담 덜어 공급 숨통 틔워야","meta":"2026.11.08 17:44 · 한국경제","body":"전국 79개 재건축 사업장에 통보된 재초환 부담금 예정액이 5조3000억원에 이르며 서울 53곳, 경기 15곳에 집중돼 있다는 점을 짚었다. 대치동 은마는 조합원 1인당 4억6600만원, 용산 한강맨션은 7억원이 넘고 '재초환 1호'인 반포현대는 이번 주 가구당 평균 2억2000만원대 고지서를 받는다고 전했다. 2006년 도입된 이 제도는 지금까지 실제로 징수된 적이 없다는 점도 지적했다. 사설은 공사비 상승으로 사업성이 이미 흔들리는 상황에서 부담금까지 더해지면 정부의 공급 확대 기조와 충돌한다고 주장했다. 제도를 폐지하거나 주민 부담을 크게 줄여 공급 속도를 높여야 한다는 것이 사설의 결론이다.","url":"https://www.hankyung.com/article/2026110832991"},{"n":26,"title":"[광화문뷰] \"공급! 공급! 공급!\" 누구를 위한 공급대책인가","meta":"2026.11.07 20:11 · 아주경제","body":"홍승우 논설위원은 주택 공급 확대 자체는 맞는 방향이지만 시점과 인구 구조를 함께 봐야 한다고 지적했다. 정부가 수도권 23만가구 추가 공급과 10만가구 이상 신규 택지를 발표했지만, 실제 입주는 빨라야 2030년이어서 지금의 청년·신혼부부에게는 때를 놓친 대책이 될 수 있다는 것이다. 출산율 하락과 주택 구입 연령대 인구 감소를 고려하면 그때까지 수요가 유지될지도 불확실하다고 봤다. 칼럼은 공급 물량을 늘리는 것만으로는 부족하며 '누구에게, 언제까지, 어떤 주택을' 공급할 것인지를 분명히 하고 당장의 주거비 부담도 함께 다뤄야 한다고 주문했다.","url":"https://www.ajunews.com/view/20261107201113028"}]}]},{"date":"2026-11-06","count":15,"pdf_count":23,"highlights":[{"n":1,"text":"홍지선 국토장관 \"수도권 주택공급 수요 못 미쳐…공급에 총력\""},{"n":5,"text":"서울 아파트값 91주 연속 상승했지만 오름폭 7개월 만에 최저"},{"n":11,"text":"李 대통령 잇단 정비사업 부정 언급…국토부·서울시 공조 차질 우려"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"홍지선 국토장관 \"수도권 주택공급 수요 못 미쳐…공급에 총력\"","meta":"2026.11.05 16:03 · 파이낸셜뉴스","body":"홍지선 국토교통부 장관이 5일 소셜미디어를 통해 결혼과 1인 가구 증가로 주택 수요는 이어지는데 서울과 수도권 주택 공급은 아직 그에 미치지 못하고 있다고 밝혔다. 홍 장관은 2022년 이후 인허가와 착공 부진을 해소하기 위해 범정부 역량을 모아 세 차례 공급대책을 마련했고, 5년간 수도권 150만가구 이상 공급을 추진하고 있다고 설명했다. 해법으로는 재개발·재건축 활성화와 공공도심복합사업의 신속 추진을 제시했으며, 서울시에도 적극적인 공급대책 마련을 요청했다. 서울 주택시장에 대해서는 가격 상승세가 둔화하고 매물이 늘어나는 등 일부 긍정적 신호가 나타나고 있다고 평가했다.","url":"https://www.fnnews.com/news/202611051554195998"},{"n":2,"title":"김이탁 국토부 1차관 \"인허가·금융 통합지원센터 이달 출범\"","meta":"2026.11.05 14:57 · 머니투데이방송","body":"김이탁 국토교통부 1차관은 5일 2026 MTN 도시정비포럼에서 인허가 기능과 금융 지원 기능을 합친 통합지원센터를 11월 말 출범시키겠다고 밝혔다. 김 차관은 금융당국 인력 1명이 약 20개 사업장을 전담해 수도권 주요 재개발·재건축 사업의 자금조달을 관리하는 방식을 설명했다. 한국부동산원은 조합을 대상으로 공사비와 사업성 분석 컨설팅을 강화한다. 정부는 서울에서 정비사업을 통해 연간 3만가구 이상 착공을 목표로 절차 간소화와 초기 사업비 지원 확대를 추진하며, 현장에서 실제로 기간이 줄고 주민 부담이 낮아지는지 확인해 미흡한 부분은 계속 보완하겠다고 밝혔다.","url":"https://news.mtn.co.kr/article/2026110514573754231"}]},{"name":"시장동향","articles":[{"n":5,"title":"서울 아파트값 91주 연속 상승했지만 오름폭 7개월 만에 최저","meta":"2026.11.05 18:05 · 한국경제","body":"한국부동산원이 5일 발표한 11월 1주(2일 기준) 주간 아파트 가격 동향에서 서울 아파트 매매가격은 0.07% 올라 91주 연속 상승했지만 상승폭은 3주째 줄며 7개월 만에 가장 낮았다. 부동산원은 고강도 대출 규제와 증시 변동성 확대로 매수 여력이 위축됐다고 설명했다. 강남구(-0.39%), 서초구(-0.37%), 송파구(-0.17%)는 하락세를 이어간 반면 경기는 0.20% 올라 서울을 웃돌았고 용인 기흥구가 0.60%로 수도권 최고 상승률을 기록했다. 전세가격은 서울 0.16%, 전국 0.10% 오르며 상승세를 유지했다.","url":"https://www.hankyung.com/article/2026110589821"},{"n":6,"title":"강남·서초 13주 연속 하락…올해 누적 상승분 모두 반납","meta":"2026.11.05 18:26 · 파이낸셜뉴스","body":"서울 아파트값이 91주 연속 올랐지만 강남구와 서초구는 13주 연속 하락하며 올해 누적 상승률이 나란히 마이너스로 돌아섰다. 지난주보다 하락폭이 커졌고 송파구도 약세를 이어가 강남3구 전체가 조정 국면에 들어섰다. 개포동 성원대치2단지는 10월 초 20억2500만원에서 한 달 만에 14억원으로 6억원 넘게 떨어졌고, 반포동과 잠실 일대에서도 수억원대 하락 거래가 나왔다. 업계는 8·3 세제 개편안에 따른 보유세 부담 확대 전망과 기준금리 인상이 고가 주택이 몰린 강남·서초에 상대적으로 큰 부담으로 작용한 것으로 분석했다.","url":"https://www.fnnews.com/news/202611051826036115"}]},{"name":"정비사업","articles":[{"n":11,"title":"李 대통령 잇단 정비사업 부정 언급…국토부·서울시 공조 차질 우려","meta":"2026.11.06 06:00 · 뉴스핌","body":"이재명 대통령은 4일 서울 성북구 장위9구역 공공재개발 현장을 찾아 공공이 재개발을 하면 속도도 빨라지고 부정부패 소지도 줄어드는데 여전히 민간 주도로 하려는 움직임이 많은 것은 부정부패 때문이라고 말했다. 이 발언으로 정부 정책의 무게중심이 민간 정비사업에서 공공정비사업으로 옮겨갈 가능성이 거론된다. 오세훈 서울시장은 최근 3년간 서울 주택공급의 약 90%를 민간사업이 담당했다고 반박했다. 업계에서는 국토교통부와 서울시가 추진해 온 정비사업 활성화 공조에 차질이 빚어질 수 있다는 우려가 나온다.","url":"https://www.newspim.com/news/view/20261105001386"},{"n":12,"title":"서울시 \"민간 재개발 죄악시 안 돼\"…대통령 발언에 공식 반박","meta":"2026.11.05 16:59 · 아시아경제","body":"서울시는 5일 보도자료를 내고 민간 재개발을 죄악시하는 접근은 주택공급 확대에 도움이 되지 않는다며 이재명 대통령의 발언을 반박했다. 시는 서울 재개발 계획 물량의 약 90%가 민간 재개발인 만큼 사업이 위축되지 않도록 정부가 규제 개선과 사업성 지원에 나서야 한다고 밝혔다. 또 공공재개발이 사업기간을 10년 이상에서 5년으로 줄이겠다고 했지만 서울에서 아직 착공한 공공재개발 사업장이 없고, 사업성 문제로 공공에서 민간으로 방식을 바꾼 구역도 있다고 지적했다. 대통령이 방문한 장위9구역에 대해서도 행정절차상 하자와 주민 소송이 있었다고 언급했다.","url":"https://view.asiae.co.kr/article/2026110516593805784"}]},{"name":"금융/세제","articles":[{"n":15,"title":"민주당 서울시당, 부동산 세제개편 당정협의 추진…\"3주 내 결론\"","meta":"2026.11.05 18:22 · 뉴스1","body":"더불어민주당 서울시당이 5일 부동산 세제개편안을 두고 정부와 당정협의를 추진하기로 했다. 국회 재정경제기획위원회에서 세법개정안이 처리되기 전 3주 안에 당 차원의 입장을 정리하겠다는 계획이다. 다만 종합부동산세 1세대1주택 기본공제 14억원 적용과 양도소득세 장기보유특별공제 축소를 두고 지역별로 의견이 엇갈려 이날 회의에서는 결론을 내지 못했다. 정부안은 종부세 과세 기준을 주택 수에서 주택가액과 실거주 여부로 바꾸는 내용을 담고 있다.","url":"https://www.news1.kr/politics/assembly/6344781"},{"n":16,"title":"주담대 막히자 임대시장 공략…은행권, 무주택 세입자 서비스 경쟁","meta":"2026.11.05 16:30 · 서울신문","body":"금융당국의 주택담보대출 규제로 매매 관련 대출 영업이 위축되자 은행권이 무주택 세입자 대상 서비스로 고객 접점을 넓히고 있다. 케이뱅크는 5일 공공임대주택 모집 정보와 대출 상품을 함께 볼 수 있는 '행복주택 모아보기'를 내놨고, KB국민은행은 KB부동산에서 공공임대 모집 알림과 AI 기반 '집찾는 AI'를 제공한다. 우리은행은 '전세 지킴이'로 깡통전세 위험을 진단하고, 신한은행은 청년·다문화가정·장애인 전세대출 고객에게 반환보증료를 지원하며 하나은행은 청년 대상 전월세 사기 보장 보험을 무료로 제공한다. KB국민·신한·하나·우리·NH농협 등 5대 은행의 10월 말 전세대출 잔액은 118조7265억원으로 9월보다 5715억원 줄었다.","url":"https://www.seoul.co.kr/news/economy/finance/2026/11/05/20261105500254"}]},{"name":"임대주택","articles":[{"n":17,"title":"LH, 올해 수도권 매입임대 4만가구 착공…2년 새 18배로","meta":"2026.11.05 18:26 · 파이낸셜뉴스","body":"한국토지주택공사(LH)가 올해 수도권 매입임대주택 착공 물량을 4만가구 규모로 늘린다고 5일 밝혔다. 2024년 2200가구와 비교하면 2년 만에 18배 이상 늘어난 규모다. 이성훈 LH 사장은 지난 9월 발표된 정부 주거안정 플랜에 따라 청년과 신혼부부가 부담 가능한 비용으로 안정적으로 살 수 있도록 공공임대주택을 대폭 확대하고 있다고 설명했다. LH는 2028년까지 서울에서 2만가구 이상을 공급할 계획이며 동대문구·구로구·마포구 등에서 입주자 모집이 예정돼 있다. 이날 서울 금천구 청년 매입임대주택에서 열린 주거복지 국민소통 토론회에서는 역세권 우수 입지 공급 확대와 청약 절차 개선이 과제로 제시됐다.","url":"https://www.fnnews.com/news/202611051826227681"},{"n":18,"title":"민주당 주거복지특위, 공적주택 119만호 첫 점검…\"취약계층 몫 줄까\" 우려","meta":"2026.11.05 16:45 · 비즈니스포스트","body":"더불어민주당 주거복지특별위원회와 서울시당 주택공급정책특별위원회는 5일 국회의원회관에서 '주거안정플랜, 현장에서 다시 묻다' 1차 간담회를 열었다. 국토교통부는 내년 예산에 공공주택 공급 재원 30조원을 배정하고, 청년에게 물량의 50%를 우선 배정하는 보편적 공공임대를 도입하며 소득·자산 요건을 완화할 계획이라고 밝혔다. 시민사회는 확대 방향에는 공감하면서도 소득 기준 완화로 혜택이 상대적으로 소득이 높은 청년에게 쏠리고 취약계층 몫이 줄어들 수 있다고 지적했다. 계약갱신청구권 확대와 민간임대 등록 의무화 등 세입자 보호 강화도 제안됐다.","url":"https://www.businesspost.co.kr/BP?command=article_view&num=451294"}]},{"name":"주택품질/안전","articles":[{"n":19,"title":"신축 아파트 하자 분쟁 5년간 2만3000건…대형 건설사도 예외 없어","meta":"2026.11.05 10:41 · 아시아타임즈","body":"신축 아파트에서 누수·균열·마감 불량 같은 하자가 이어지면서 2021~2025년 5년간 하자 분쟁이 2만3085건 접수됐다. 연평균 4600건 수준이며 실제 하자로 판정된 비율은 약 68%에 이른다. 하자 유형은 기능 불량이 18%로 가장 많고 들뜸·탈락, 균열, 결로, 누수가 뒤를 이었다. SK에코플랜트가 시공한 아파트에서 대규모 침수 피해가 발생하는 등 대형 건설사도 예외가 아니었다. 전문가는 관리감독자 역량 부족과 불법 재하도급이 고질적 품질 문제를 낳는다며 사전점검 확대를 넘어 시공 과정의 품질 관리와 하자 보수 이행을 관리하는 체계가 필요하다고 지적했다.","url":"https://www.asiatime.co.kr/article/20261105500139"}]},{"name":"분양정보","articles":[{"n":20,"title":"수도권 민간아파트 분양가 1년 새 25.7% 급등…서울은 38% 올라","meta":"2026.11.05 09:00 · 글로벌이코노믹","body":"9월 말 기준 최근 1년간 수도권 민간아파트의 ㎡당 평균 분양가는 1095만9000원으로 지난해 같은 기간 871만7000원보다 25.7% 올랐다. 3.3㎡당 약 3623만원 수준이다. 서울은 1377만9000원에서 1901만8000원으로 38.0% 올라 3.3㎡당 약 6287만원을 기록했다. 건설공사비지수가 전년 동월 대비 6.0% 오르고 수도권 주택 준공 물량이 21.6% 줄어든 점이 배경으로 꼽힌다. 경기 성남 분당구 '더샵 분당하이스트' 전용 84㎡는 27억3900만~29억8100만원에 책정됐다.","url":"https://www.g-enews.com/article/Real-Estate/2026/11/2026110508313393562aa6f4cdad_1"},{"n":21,"title":"계룡건설 '엘리프 시흥 더프라임' 분양…전용 84㎡ 5억원대","meta":"2026.11.05 14:50 · 중도일보","body":"계룡건설이 시흥거모 공공주택지구에서 짓는 '엘리프 시흥 더프라임'이 분양에 들어갔다. 분양가상한제가 적용돼 전용 84㎡ 최고 분양가가 5억9930만원으로 6억원 미만에 책정됐고 초기 계약금은 5%로 낮췄다. 총 338가구 가운데 304가구가 일반분양이며, 시흥시와 경기도, 서울·인천에 사는 만 19세 이상 세대주와 세대원이 신청할 수 있고 1주택자도 추첨제에 참여할 수 있다. 특별공급은 11월 9일, 1·2순위 청약은 10~11일, 당첨자 발표는 17일이다. 4호선·수인분당선 신길온천역을 걸어서 이용할 수 있고 반월·시화 산업단지와 가깝다.","url":"https://www.joongdo.co.kr/web/view.php?key=20261105010001890"}]},{"name":"논설/사설","articles":[{"n":22,"title":"[사설] 주택공급, 서로 탓하면 막힌 사업은 누가 푸나","meta":"2026.11.05 14:45 · 아주경제","body":"아주경제는 사설에서 공공개발의 효율성을 강조하는 대통령과 민간 주도를 옹호하는 서울시장의 논쟁을 두고 양쪽 모두 문제가 있다고 지적했다. 대통령에게는 민간 재개발을 부정부패와 연결하는 인식부터 거둬야 한다고 촉구했다. 서울시장에게는 공공개발 만능론을 비판하면서 정비사업 만능론에 기대서는 안 된다고 경고했다. 사설은 서로를 비판할 것이 아니라 금융·세제·도시계획·인허가 수단을 동원해 실제로 주택이 공급되도록 책임을 다해야 한다고 주장했다.","url":"https://www.ajunews.com/view/20261105144331113"},{"n":23,"title":"[사설] '민간 주도 많은 건 부패 탓' 주택 공급도 편 가르기 하나","meta":"2026.11.05 12:00 · 문화일보","body":"문화일보는 사설에서 이재명 대통령이 여전히 민간 주도로 하려는 움직임이 많은 것은 소위 부정부패 때문이라고 말한 데 대해 과도한 일반화라고 비판했다. 최근 3년간 서울에서 공급된 주택 10채 중 9채가량을 민간이 담당했고 아파트 공급의 63%가 재개발·재건축으로 이뤄졌다는 점을 근거로 들었다. 대통령 논리대로면 그 주택 대부분이 부정부패로 지어졌다는 뜻이 된다는 것이다. 사설은 한국토지주택공사(LH)의 신도시 사전 투기 사건을 들어 공공개발도 부패에서 자유롭지 않다고 지적했다.","url":"https://www.munhwa.com/article/11629044"}]}]},{"date":"2026-11-05","count":15,"pdf_count":24,"highlights":[{"n":1,"text":"李대통령, 장위동 공공재개발 현장 방문…\"조기 추진 땐 용적률·금융 인센티브 강화\""},{"n":7,"text":"수도권 분양가 1년 새 25.7% 상승…국평 분양가 30억 '턱밑'"},{"n":10,"text":"현대건설 13조·삼성물산 10조 돌파…'수의계약' 쏠림 속 정비사업 수주왕 경쟁"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"李대통령, 장위동 공공재개발 현장 방문…\"조기 추진 땐 용적률·금융 인센티브 강화\"","meta":"2026.11.05 04:30 · 동아일보","body":"이재명 대통령은 4일 서울 성북구 장위동 공공재개발 현장을 찾아 \"공공이 하면 속도도 빨라지고 부정부패 소지도 줄어든다\"며 조기에 진행되는 사업에는 용적률이나 금융 지원 등 인센티브를 강화하라고 주문했다. 민간 재개발로 추진 중인 사업도 주민이 원하면 불이익 없이 공공재개발로 전환할 수 있도록 제도 개선을 검토하라고 했고, LH에는 인력 확충을 촉구했다. 국토교통부는 재개발 조합설립 동의율을 75%에서 70%로 낮추고 빨리 착공하는 사업장에 취득세 감면 등 혜택을 주겠다고 밝혔다. 정부·여당은 공공재개발 시행자가 법적 상한 용적률의 130%까지 지을 수 있게 하는 도시정비법 개정을 추진하고 있으나, 국민의힘은 민간 재개발 용적률(120%)도 같이 높여야 한다며 반대하고 있다.","url":"https://www.donga.com/news/Politics/article/all/20261105/134968694/2"},{"n":2,"title":"李 \"집값 하락은 강남·서초·송파만 말한 것\" 해명…野 \"강남 3구만 서울인가\"","meta":"2026.11.04 17:55 · 조선일보","body":"이재명 대통령은 4일 '집값 폭락 중 대통령 발언, 강남만 맞았다'는 언론 보도를 \"가짜 뉴스\"라고 반박하며, 국무회의에서 말한 '주요 지역'은 서울 전체가 아니라 강남 3구(강남·서초·송파)를 가리킨 것이라고 X(옛 트위터)에 밝혔다. 이 대통령은 '폭락 중'이라는 표현을 직접 인용으로 쓴 것도 잘못이라고 지적했다. 이에 국민의힘 장동혁 대표는 \"애당초 강남 3구만 '주요 지역'이라고 생각하는 인식부터 틀렸다\"며 \"강남 3구조차 '놀라울 정도'로 떨어지지도 않았다\"고 반발했다. 이 대통령이 방문한 성북구는 한국부동산원 기준 올해 누적 상승률 16.56%로 서울 25개 구 가운데 가장 많이 올랐다.","url":"https://www.chosun.com/economy/real_estate/2026/11/05/GEOCEBF3XNHA3ELTNYZHI6NPHY/"}]},{"name":"시장동향","articles":[{"n":7,"title":"수도권 분양가 1년 새 25.7% 상승…국평 분양가 30억 '턱밑'","meta":"2026.11.04 09:11 · 파이낸셜뉴스","body":"HUG 민간아파트 분양시장 동향에 따르면 9월 말 수도권 민간아파트 ㎡당 평균 분양가는 1095만9000원으로 1년 전(871만7000원)보다 25.7% 올랐고, 서울은 1377만9000원에서 1901만8000원으로 38.0% 뛰었다. 9월 분당에서 분양한 '더샵 분당하이스트' 전용 84㎡는 27억~29억원대로 30억원에 근접했다. 8월 건설공사비지수가 1년 새 6.0% 오르고 9월 기본형건축비가 4.07% 인상된 데다, 올해 1~8월 수도권 준공 물량이 21.6% 줄어든 것이 상승 요인으로 꼽힌다. 다만 9월 말 서울 미분양은 996가구로 한 달 새 98가구 늘어 시장이 같은 방향으로만 움직이지는 않는다는 분석도 나온다.","url":"https://www.fnnews.com/news/202611040908302022"},{"n":8,"title":"서울 아파트 직거래 비중 연초 2%→9월 11.7%…정책 바뀔 때마다 급증","meta":"2026.11.05 05:00 · 머니투데이","body":"머니투데이가 국토교통부 실거래가 자료를 분석한 결과 올해 1~10월 서울 아파트 매매 5만4657건 중 직거래는 2822건(5.2%)으로, 지난해 같은 기간(4.3%)보다 비중이 0.9%포인트 높아졌다. 월별로는 1월 2.05%에서 9월 11.71%로 5배 이상 뛰어 연중 최고치를 기록했다. 다주택자 양도세 중과가 재개된 5월(7.22%), 6·27 대출 규제 직후인 7월(8.35%), 세제 개편안 발표 다음 달인 9월에 직거래 비중이 직전 달보다 두 배 안팎 늘었다. 전문가들은 세금 부담과 자금 조달 여건이 바뀔 때마다 집주인들이 가족 간 거래 등 직거래로 처분 방식을 바꾸고 있다고 분석했다.","url":"https://www.mt.co.kr/estate/2026/11/05/2026110422200665266"}]},{"name":"정비사업","articles":[{"n":10,"title":"현대건설 13조·삼성물산 10조 돌파…'수의계약' 쏠림 속 정비사업 수주왕 경쟁","meta":"2026.11.05 06:04 · 조선일보","body":"현대건설은 10월 31일 용산구 한강로구역 재개발(총공사비 5990억원) 시공사로 선정되며 올해 도시정비 누적 수주액 13조3305억원(10개 사업장)을 기록해 8년 연속 1위에 다가섰다. 삼성물산은 압구정4구역, 성수3구역, 여의도시범 등을 확보해 11월 4일 기준 10조4686억원(11개 사업장)을 달성했고, 7일 목동13단지(약 2조4000억원) 수의계약 총회를 앞두고 있다. 현대건설의 10개 사업장 중 9곳, 삼성물산의 11개 사업장 중 10곳이 단독 응찰에 따른 수의계약이었다. 업계는 공사비 상승과 조합원 선호 양극화로 대형사조차 출혈 경쟁을 피하는 구도가 굳어졌다고 분석했다.","url":"https://www.chosun.com/economy/realty/realestate_industry/2026/11/05/MQZWGZJQHBSWKMRVGBSTCMBRGY/"}]},{"name":"금융/세제","articles":[{"n":11,"title":"금융위 \"집값 상승세 당분간 지속 우려…대출 규제 엄격 기조 불가피\"","meta":"2026.11.05 04:30 · 동아일보","body":"국민의힘 신동욱 의원실에 따르면 금융위원회는 4일 국회 답변서에서 \"주택 공급 부진과 주택가격 상승 전망 등을 감안 시 주택가격 상승세는 당분간 지속될 우려가 있다\"고 밝혔다. 금융위는 수도권 아파트 착공·입주 물량이 10년 평균을 밑돌고 5~9월 주택가격전망지수가 100 이상을 유지한 점을 근거로 들었고, 공급 확대와 기준금리 인상 효과가 나타나면 상승세가 둔화될 수 있다는 전망도 함께 소개했다. 주담대 한도 6억원 제한 등 6·27 대출 규제에 대해선 \"엄격한 관리 기조는 불가피하다\"면서 온라인에 퍼진 추가 한도 규제설은 사실이 아니라고 했다. 신 의원은 대통령과 정부의 전망이 엇갈려 시장 혼선을 키운다고 비판했다.","url":"https://www.donga.com/news/Politics/article/all/20261105/134968690/2"},{"n":12,"title":"15억 넘으면 대출 한도 6억→4억…서울 집 사려면 대출·토허 요건 따로 따져야","meta":"2026.11.05 06:30 · 한국경제","body":"수도권·규제지역의 주택 구입 목적 주담대 한도는 주택가격 15억원 이하 6억원, 15억원 초과~25억원 4억원, 25억원 초과 2억원이며, 규제지역에는 LTV 40%와 은행권 DSR 40%가 함께 적용된다. 예컨대 15억원 주택은 대출 6억원을 빼고 9억원이 필요하지만, 15억1000만원 주택은 한도가 4억원으로 줄어 자기자금이 11억1000만원으로 늘어난다. 대출과 별개로 서울 전역 아파트가 토지거래허가구역이어서 관할 구청의 허가를 받아야 하고, 주거용 취득 시 원칙적으로 2년 실거주 의무가 따른다. 기사는 스트레스 DSR과 기존 부채에 따라 실제 대출액이 달라지므로 실수요자가 자금 계획을 미리 점검해야 한다고 짚었다.","url":"https://www.hankyung.com/article/2026110444596"}]},{"name":"임대주택","articles":[{"n":13,"title":"전세금은 HUG가 보관, 집주인엔 연 4.35%…'전월세 안심신탁' 첫 임대인 모집","meta":"2026.11.05 00:30 · 동아일보","body":"국토교통부와 HUG는 4일 8·13 공급대책 후속 조치인 '전월세 안심신탁' 임대인 모집 공고를 냈으며, 임차인은 내년 1월부터 순차 입주한다. 임차인이 보증금을 HUG에 예치하면 HUG가 운용해 임대인에게 매달 약정 수익을 주는 3자 계약 구조로, 주택이 압류·경매돼도 예치금은 보호된다. 첫 모집 수익률은 세전 연 4.35%(예치금 3억원이면 월 108만7500원)이며, 정부는 소득·법인세 절반 감면, 공실 최대 2개월 수익 지원 등을 더한다. 대상은 집값 20억원 이하, 선순위 부채비율 80% 이하 주택이다. 전문가들은 수익률이 전월세전환율(5.4%)보다 낮아 임대인 참여가 얼마나 될지 의문이라는 지적도 내놨다.","url":"https://www.donga.com/news/Economy/article/all/20261104/134967332/2"},{"n":14,"title":"대전 도안신도시 청년주택 951가구 착공…시세 95% 이하로 10년 임대","meta":"2026.11.04 16:54 · 연합뉴스","body":"대전시는 4일 서구 도안신도시 갑천 4블록에서 청년주택 951가구 기공식을 열었다. 대전도시공사가 민간 사업자와 함께 추진하는 지역제안형 공공지원민간임대주택(10년 의무임대)으로, 민선 9기 청년주택 5000가구 공급 공약의 첫 사업이다. 전용 59㎡ 규모로 청년과 신혼부부에게 100% 공급되며, 임대료는 주변 시세의 70% 이하(특별공급)에서 95% 이하(일반공급) 수준이다. 2029년 5월 준공을 목표로 하며 입주자 모집은 2028년 하반기에 진행된다.","url":"https://www.yna.co.kr/view/AKR20261104150500063"}]},{"name":"택지/도시개발","articles":[{"n":15,"title":"LH, 10·29 신규 공공주택지구 6곳 '보상 투기' 차단 나서","meta":"2026.11.04 14:47 · 연합뉴스","body":"LH 경기북부지역본부는 국토교통부가 10월 29일 발표한 신규 공공주택지구 6곳(김포 아라, 하남 미사 K-컬처·강일2, 구리 건원, 고양 대곡지식융합2, 의정부 다락원)의 보상 목적 투기를 막기 위해 관리를 강화한다고 4일 밝혔다. 지구 내 건축물·농작물·수목 현황과 식재 시기를 확인하기 위해 항공사진을 확보해 보상 때 조서 작성 기초자료로 쓴다. 주요 지점에 제한 사항 안내판을 설치하고 현장 경비를 배치해 불법 지장물 설치나 무분별한 수목 식재를 막을 계획이다. LH는 지분쪼개기 우려에 대해 보상 기준일 등 엄격한 규정이 적용된다며 기획부동산 투자 권유에 주의하라고 당부했다.","url":"https://www.yna.co.kr/view/AKR20261104119600060"},{"n":16,"title":"\"또다시 지옥철?\"…김포·하남 신규택지 주민들 '先교통대책' 요구","meta":"2026.11.05 07:17 · 연합뉴스","body":"10·29 신규 택지로 3만7000여가구가 들어설 김포에서는 이미 출퇴근 혼잡이 심한 김포골드라인이 다시 '지옥철'이 될 것이라는 우려가 컸다. 2031년 착공 목표인 서울 5호선 김포 연장은 기존 교통난 해소용일 뿐 신규 택지 대책이 될 수 없다는 지적이 나오며, 김포 시민단체들은 '선(先)교통 후(後)입주' 원칙 확립을 촉구했다. K-컬처지구 1만2000가구 등이 지정된 하남에서도 미사섬 진입로가 왕복 4차로 도로 한 곳뿐이라며 교통 대책을 요구했다. 고양·의정부에서는 자족기능 확보를 요구하는 목소리가 나왔고, 사업 예정지 주변 토지주들 사이에선 기대와 우려가 엇갈렸다.","url":"https://www.yna.co.kr/view/AKR20261104106800065"}]},{"name":"주택품질/안전","articles":[{"n":17,"title":"국내 첫 목조 아파트 시험동 공개…성북구 개운산마을 18가구 목조로","meta":"2026.11.04 16:33 · 파이낸셜뉴스","body":"서울 성북구 종암동 개운산마을 가로주택정비사업 조합은 4일 국내 공동주택 최초로 목구조를 적용하는 아파트의 시험동(지상 2층, 연면적 약 108㎡)을 공개했다. 이 사업은 지하 3층~지상 최고 20층, 3개동 130가구 규모이며 이 중 2개동 18가구를 대형 목구조 공법인 '매스팀버'로 짓는다. 이원형 조합장은 철근콘크리트의 품질 관리 난도와 하자·안전사고 위험을 줄이고 탄소 배출을 낮추기 위해 목조를 택했다고 설명했다. 시공사인 보미건설 측은 20층 콘크리트 아파트가 요구하는 구조 강도를 충족한다고 밝혔다.","url":"https://www.fnnews.com/news/202611041534282874"},{"n":18,"title":"아파트 관리업체 4곳 통합한 'KES' 출범…전국 1500개 단지 관리","meta":"2026.11.04 17:13 · 한국경제","body":"사모펀드 제네시스PE가 인수한 광인토탈관리, 대원에스테이트서비스, 제일에스테이트서비스, 푸른종합주택관리 등 주택관리업체 4곳을 통합한 KES(코리아에스테이트서비스)가 3일 출범식을 열었다. KES는 전국 1500여 개 아파트 단지를 관리하는 국내 최대 규모 주택관리회사다. 시설 유지·보수뿐 아니라 입주민 안전, 생활 편의, 커뮤니티 운영 등 주거관리 전반의 품질을 높이겠다는 계획이다. '짓는 3년보다 사는 40년을 책임진다'는 미션과 예방·책임·일관성·투명을 뜻하는 4대 핵심 가치도 공개했다.","url":"https://www.hankyung.com/article/2026110462371"}]},{"name":"분양정보","articles":[{"n":19,"title":"분양가 25%만 내고 입주…LH '지분적립형 주택' 내달 고양창릉 284가구 첫 분양","meta":"2026.11.05 00:30 · 동아일보","body":"국토교통부는 4일 LH가 다음 달 고양창릉 S2블록 284가구를 지분적립형 주택으로 분양한다고 밝혔다. 입주 때 지분 25%만 먼저 취득하고 이후 4년마다 5회에 걸쳐 15%씩 나머지 지분을 사는 구조로, 미취득 지분에는 주변 전세 시세의 90% 수준 임대료를 낸다. 분양가 5억1000만원이면 최초 취득 비용은 1억2800만원이고, 인근 전세 시세가 4억원이라면 입주 후 4년간 매달 약 79만원을 내야 한다. 정책대출은 어려울 것으로 보이며 시중은행 주담대는 검토 중이다.","url":"https://www.donga.com/news/Economy/article/all/20261104/134967353/2"}]},{"name":"논설/사설","articles":[{"n":23,"title":"[광화문에서] 주택공급 리스크된 재초환…'닥공' 위해선 손질해야","meta":"2026.11.04 23:12 · 동아일보","body":"칼럼은 서초구가 일부 재건축 단지에 연내 재건축초과이익 부담금을 부과하겠다고 밝히면서 재초환이 다시 쟁점이 됐다고 소개했다. 재초환은 조합원당 이익이 8000만원을 넘으면 초과이익의 최대 절반을 환수하는 제도로, 2006년 도입 이후 주요 단지에 실제 부과된 적이 없다. 필자는 조합 설립부터 준공까지 10년 넘게 걸리는 동안의 집값 상승분을 예측해야 해 사업성 판단을 어렵게 한다며, 재초환이 재건축 속도를 늦추는 장애물로 작동한다고 지적했다. 그러면서 정부의 공급 속도전 목표에 맞게 임대주택·기부채납 등 다른 환수 방식을 활용하는 방향으로 제도를 손질해야 한다고 주장했다.","url":"https://www.donga.com/news/Opinion/article/all/20261104/134968266/2"}]}]},{"date":"2026-11-04","count":15,"pdf_count":23,"highlights":[{"n":1,"text":"李대통령 \"부동산 불패신화 깨야…집값 급락 땐 공적임대용 대량매입\""},{"n":5,"text":"서울 집합건물 증여 700건…14개월 만에 최저"},{"n":11,"text":"대우건설, 도시정비 수주 5조 돌파…의정부 가능4구역·성산모아타운4구역 수주"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"李대통령 \"부동산 불패신화 깨야…집값 급락 땐 공적임대용 대량매입\"","meta":"2026.11.03 14:01 · 서울경제","body":"이재명 대통령은 3일 국무회의에서 서울 아파트 매물 급증과 거래량 감소, 주요 지역 실거래가 하락을 거론하며 \"부동산 불패신화는 이제 깨질 때가 됐고 반드시 깨야 한다\"고 밝혔다. 집값이 크게 떨어질 경우에 대비해 정부가 주택을 대량 매입해 공적임대주택으로 활용하는 방안을 포함한 대비책을 이미 강구 중이라고 설명했다. 이 대통령은 가계대출 증가 억제와 주택담보대출 관리로 집값 변동에 따른 금융시장 불안도 제한적일 것이라고 진단했다. 또 주택 가격을 판단하려면 거래량과 매물 증감, 선도지역 거래가격 추이, 공급 흐름, 금리와 경기, 담보대출 연체율, 경매물건 증감과 낙찰률 등 객관적 자료를 함께 봐야 한다고 강조했다. 2022년부터 시작된 인허가 급감이 최근 서울 집값 상승의 배경이며 인허가 정상화로 2028년 전후부터 공급절벽이 완화될 것이라는 전망도 내놨다.","url":"https://www.sedaily.com/article/20109602"},{"n":2,"title":"다세대·다가구 면적 660㎡→1000㎡…다가구는 4층까지 허용","meta":"2026.11.03 17:23 · 한국경제","body":"국토교통부는 3일 국무회의에서 건축법 시행령 일부개정안이 의결돼 오는 12일부터 시행된다고 밝혔다. 개정안에 따라 다세대·다가구주택의 연면적 상한이 기존 660㎡에서 1000㎡로 51.5% 확대되고, 다가구주택의 층수 제한도 3층에서 4층으로 완화된다. 1990년대 이후 30년 넘게 유지돼 온 규제가 풀리는 것으로, 지난 8월 발표한 '주택 신속 공급 방안'의 후속 조치다. 정북 방향 일조권 규제도 높이 10m 초과~17m 이하 구간에 5m 고정 이격 기준을 적용하는 방식으로 완화해 사선 형태 설계 부담을 줄였다. 국토부는 중·대규모 대지에서 증축·재건축을 통한 도심 내 주택 공급이 늘어나고 건축설계 자율성도 높아질 것으로 기대했다.","url":"https://www.hankyung.com/article/2026110335861"}]},{"name":"시장동향","articles":[{"n":5,"title":"서울 집합건물 증여 700건…14개월 만에 최저","meta":"2026.11.03 18:24 · 파이낸셜뉴스","body":"10월 서울 집합건물 증여 신청이 700건으로 집계돼 14개월 만에 최저 수준을 기록했다. 양도소득세 중과 유예 종료를 앞두고 4월 2164건으로 정점을 찍은 뒤 급격히 줄어드는 흐름이다. 강남3구는 446건에서 161건으로 63.9% 줄었고, 한강벨트 7개구는 699건에서 189건으로 73.0% 감소해 핵심 지역의 낙폭이 두드러졌다. 30대 수증인도 784명에서 196명으로 75% 감소해 \"할 사람은 다 했다\"는 평가가 나온다. 전문가들은 정책 불확실성이 커지면서 추가로 움직이기보다 향후 정책 방향을 지켜보려는 수요가 많다고 분석했다.","url":"https://www.fnnews.com/news/202611031824198034"},{"n":6,"title":"반도체·AI 거점이 집값 끌어올렸다…경기 상승 상위 10곳 중 6곳","meta":"2026.11.03 18:11 · 파이낸셜뉴스","body":"반도체와 AI 등 첨단산업 거점을 중심으로 수도권 아파트값이 오르고 있다는 분석이 나왔다. 지난해 9월부터 올해 9월까지 경기 아파트 매매가격지수 상승률 상위 10개 지역 가운데 6곳이 반도체·AI 관련 기업이 있거나 대규모 투자가 추진되는 곳이었다. 성남시 분당구의 한 단지는 1년 새 4억원 올랐고, 화성시의 한 단지도 지난해 10월보다 3억7000만원 상승했다. 성남시 아파트 월세는 2023년 4월부터 올해 9월까지 42개월 연속 상승했다. 라온건설은 용인반도체클러스터 일대에 564가구 규모 아파트를 12월 분양할 예정이다.","url":"https://www.fnnews.com/news/202611031811252573"}]},{"name":"정비사업","articles":[{"n":11,"title":"대우건설, 도시정비 수주 5조 돌파…의정부 가능4구역·성산모아타운4구역 수주","meta":"2026.11.03 17:24 · 한국경제","body":"대우건설이 올해 도시정비사업 누적 수주액 5조673억원을 기록하며 '5조 클럽'에 진입했다고 3일 밝혔다. 최근 경기 의정부 가능4구역 재개발(공사비 4647억원)과 서울 마포구 성산모아타운4구역(2506억원) 시공사로 선정된 결과다. 의정부 가능4구역은 1368가구 규모로 GTX-C노선 개통과 캠프 레드클라우드 부지 개발이 호재로 꼽힌다. 성산모아타운4구역은 지하 4층~지상 29층 7개 동 685가구 규모로, 인근 사업지와 함께 2000가구 규모의 푸르지오 브랜드 타운을 형성할 전망이다. 대우건설은 서울 목동·여의도·신월동 등에서도 추가 수주를 추진하고 있다.","url":"https://www.hankyung.com/article/2026110335881"},{"n":12,"title":"구룡마을 화재 후 SH 명도소송 취하 검토…주민은 법적 대응 예고","meta":"2026.11.03 11:45 · 아시아경제","body":"서울 강남구 구룡마을에서 지난달 27일 발생한 화재로 주택 약 60채가 소실된 가운데 서울주택도시개발공사(SH)가 명도소송 취하를 검토하고 있다. 2012년부터 추진된 구룡마을 개발사업은 주민 140여 가구의 이주 거부로 지연돼 왔고, SH는 지난 3월 명도소송을 제기했다. 주민들은 임대주택 거주 후 우선분양권 부여를 요구하지만 SH는 법적 근거가 없다는 입장이다. 주민 측은 강제집행정지 가처분 신청과 행정소송으로 대응하겠다고 예고했다. 법적 갈등이 길어지면 3739가구 규모의 주택 공급 일정에도 차질이 우려되며, 강제집행정지가 인정되면 최종 판결까지 1~2년이 더 걸릴 수 있다는 전망이 나온다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026110308003361054"}]},{"name":"금융/세제","articles":[{"n":13,"title":"압구정 50억 이상 거래 45%가 '집주인 대출'","meta":"2026.11.03 11:45 · 헤럴드경제","body":"서울 강남구 압구정동에서 50억원 이상에 거래된 아파트의 45%가 매도인이 매수인에게 잔금을 빌려주는 '집주인 대출'(셀러 파이낸싱) 방식으로 이뤄진 것으로 나타났다. 8~10월 소유권 이전이 끝난 11건 중 5건이 이 방식을 활용했고 채권최고액은 수십억원에 달했다. 정부의 대출 규제로 25억원 초과 주택의 담보대출 한도가 최대 2억원으로 묶이면서 이를 보완하는 수단으로 쓰이고 있다는 분석이다. 높은 이자를 감수하더라도 빠르게 자금을 마련하려는 매수자와 세 부담 탓에 서둘러 처분하려는 매도자의 이해가 맞물린 결과다. 고가주택 대출 규제와 세제 개편이 겹치면서 강남·서초 고급 주택시장의 새로운 거래 방식으로 자리 잡고 있다.","url":"https://biz.heraldcorp.com/article/10924010"},{"n":14,"title":"보금자리론 금리 5% 돌파…연체잔액은 3년 8개월 만에 3배","meta":"2026.11.03 15:52 · 이데일리","body":"정책 주택담보대출인 보금자리론의 최저금리가 연 5%대로 올라 2014년 출시 이후 처음으로 10년 만기 금리가 5%를 넘어섰다. 금리 부담이 커지면서 월간 신규 공급액은 올해 1월 대비 36.4% 줄어 대출 수요가 크게 위축됐다. 기존 차주의 상환 여건도 나빠져 연체잔액은 3년 8개월 만에 3배 이상 늘었다. 한국주택금융공사가 담보주택 경매에 들어간 사례는 4117건, 회수하지 못한 채권은 304억원으로 집계됐다. 전문가들은 신규 차주의 진입 부담과 기존 차주의 상환 능력을 함께 고려한 정책적 지원이 필요하다고 지적했다.","url":"https://www.edaily.co.kr/News/Read?newsId=04752726645642112&mediaCodeNo=257"}]},{"name":"임대주택","articles":[{"n":15,"title":"포스코이앤씨, '더샵 일산센트로' 민간임대 229가구…10년 보증금 동결","meta":"2026.11.03 09:14 · 아시아경제","body":"포스코이앤씨가 경기 고양시 일산동구에 '더샵 일산센트로' 장기일반민간임대주택 229가구를 공급한다. 단지는 지하 2층~지상 29층 총 526가구 규모이며, 이 가운데 임대 물량은 전용면적 84㎡ 단일 면적으로 구성된다. 포스코이앤씨는 '더샵 멤버십 10'을 처음 적용해 계약자가 10년간 임대보증금 인상 없이 거주할 수 있도록 했다. 임대 종료 후에는 사전에 정한 확정분양가로 분양 전환할 우선권을 주고, 임대보증금은 주택도시보증공사 보증보험에 가입한다. 풍산역·백마역과 가까워 서울 도심과 강남 접근성이 좋다는 것이 회사 측 설명이다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026110309145004175"}]},{"name":"택지/도시개발","articles":[{"n":16,"title":"17년 끌어온 동탄 트램 착수…외곽 주거지 접근성 개선 기대","meta":"2026.11.04 05:00 · 뉴시스","body":"17년간 미뤄져 온 동탄 트램 사업이 지난 2일 착수식을 열고 본격화됐다. 8개월간 실시설계를 거쳐 2027년 하반기 본공사에 들어가며 2031년 12월 개통을 목표로 한다. 총 31.5㎞ 규모의 Y자형 도시철도망이 구축되면 동탄역과 외곽 주거지역의 접근성이 개선될 전망이다. 현재 동탄역 인근 아파트는 22억원대인 반면 외곽 지역은 6억~11억원대로 격차가 2배 이상 벌어져 있다. 삼성전자의 임직원 주택자금 대출 지원과 수도권 규제에 따른 수요 유입이 겹치면서 동탄 집값은 최근 경기도 평균의 2배 수준 상승률을 보이고 있다.","url":"https://www.newsis.com/view/NISX20261103_0003852478"}]},{"name":"주택품질/안전","articles":[{"n":17,"title":"LH, 공동주택 첫 태양광 요금상계거래…가구당 월 8000원 절감","meta":"2026.11.03 09:33 · 아시아경제","body":"한국토지주택공사(LH)가 공동주택으로는 처음으로 태양광 잉여전력을 활용한 '요금상계거래'를 세종시 산울마을 4단지에 도입한다. 태양광으로 생산한 전력 중 남은 양을 한국전력에 공급한 뒤 사용 전력량과 상계해 전기요금을 줄이는 방식이다. 해당 단지는 238가구 규모 행복주택으로 LH 최초로 제로에너지건축물 3등급을 받았고 246kW 규모의 태양광 발전설비를 갖추고 있다. LH는 가구당 월평균 약 8000원의 추가 전기요금 절감 효과를 예상한다. 앞으로 제로에너지건축물 5등급 이상 단지 가운데 적용이 가능한 곳으로 대상을 넓힐 계획이다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026110309330619362"},{"n":18,"title":"GS건설, 벽이 움직이는 '무빙월' 공개…공간 가변형 아파트 추진","meta":"2026.11.03 10:02 · 아시아경제","body":"GS건설이 로보틱스 기술과 가구를 결합해 아파트 내부 벽체를 움직일 수 있는 '무빙월'을 선보였다. 입주자가 필요에 따라 공간을 나누거나 합칠 수 있도록 한 제품으로, 별도의 주행 레일 없이 가구 본체를 수평 이동시키는 정밀 제어 기술과 장애물 감지 기능을 적용했다. 와이드 다이닝, 히든 키친, 와이드 리빙 등 여러 타입을 제공하고 앱으로 조명·보안을 통합 관리할 수 있다. GS건설은 앞으로 LG전자의 'AI 홈'과 연계해 음성 명령 기능을 확대하고 자동화 수준을 높일 계획이다. 1~2인 가구 증가와 재택근무 확산으로 공간 활용도를 높이려는 수요에 대응한 상품이라는 설명이다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026110310022457707"}]},{"name":"분양정보","articles":[{"n":19,"title":"광교 마지막 공공분양에 4만명…전국 첫 지분적립형 적용","meta":"2026.11.04 06:30 · 한국경제","body":"경기 수원 광교신도시의 마지막 대형 공공분양인 '광교 자연앤 센트레빌'에 첫 주에만 4만여 명이 관심을 보였다. 전용 59㎡는 6억5010만~6억8440만원, 전용 84㎡는 9억110만~9억4930만원으로 인근 시세의 반값 수준이다. 인근 '광교호반베르디움'과 비교하면 평형별로 최소 6억원 이상의 차익이 예상된다. 전용 59㎡에는 입주 때 분양가의 25%만 내고 20년에 걸쳐 나머지 지분을 나눠 취득하는 지분적립형이 전국 처음으로 적용된다. 다만 지분을 모두 취득하기 전에 팔면 시세차익을 보유 지분만큼만 가져가므로 신중한 청약 검토가 필요하다는 지적이 나온다.","url":"https://www.hankyung.com/article/2026110332276"},{"n":20,"title":"3.3㎡당 1억3300만원…'디에이치 신반포 에스테라' 최고 분양가","meta":"2026.11.03 16:09 · 파이낸셜뉴스","body":"서울 서초구 잠원동 '디에이치 신반포 에스테라'가 3.3㎡당 1억3300만원으로 국내 아파트 최고 분양가 기록을 세웠다. 일반분양 물량이 28가구로 30가구 미만이어서 분양가상한제 등 규제를 받지 않고 조합이 가격과 청약 방식을 자율적으로 정할 수 있다. 조합은 최고가 공개 경쟁입찰 방식을 택해 가장 높은 금액을 제시한 신청자가 당첨되는 구조로 공급한다. 종전 최고가는 2024년 광진구 '포제스 한강'이었으나 공급면적 차이로 3.3㎡당 가격에서 이번 단지에 밀렸다. 계약금 20%와 입찰보증금 5000만원이 필요해 상당한 현금 동원력이 요구되며, 입찰은 6일, 개찰은 7일로 예정돼 있다.","url":"https://www.fnnews.com/news/202611031114004407"}]},{"name":"논설/사설","articles":[{"n":22,"title":"[사설] 7만6700가구 공급 발표, 보상에 막히면 무슨 소용인가","meta":"2026.11.04 05:00 · 이데일리","body":"정부가 수도권 6개 지역에 7만6700가구 규모의 신규 택지를 조성하겠다고 발표했으나 토지보상이 실행의 걸림돌이 될 수 있다는 지적이 제기됐다. 사설은 하남·김포 등 대상지에서 지분거래 비중이 급증해 보상과 수용 절차가 복잡해질 가능성이 크다고 짚었다. 정부가 제시한 2030년 공급 목표는 시장이 체감할 실제 공급 시점과는 거리가 있다는 평가다. 보상과 인허가를 해결하고 최소한 첫 삽을 떠야 공급이라고 할 수 있으며, 실제 입주 물량이 정책 신뢰를 증명한다고 강조했다. 집값은 지금 움직이는데 공급은 4~5년 뒤라는 시차를 어떻게 메울 것인지가 과제라는 것이 사설의 결론이다.","url":"https://www.edaily.co.kr/News/Read?newsId=01659686645642440&mediaCodeNo=257"}]}]},{"date":"2026-11-03","count":15,"pdf_count":25,"highlights":[{"n":1,"text":"국토부·서울시 도심 주택공급 협의 평행선…장기화 예고"},{"n":5,"text":"30대 생애 첫 주택 매입, 영끌 절정이던 2021년 넘어섰다"},{"n":11,"text":"서울 재개발·재건축 1184곳…주거지도 다시 그려진다"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"국토부·서울시 도심 주택공급 협의 평행선…장기화 예고","meta":"2026.11.03 06:00 · 뉴스핌","body":"국토교통부와 서울시의 도심 주택공급 협의가 단기간에 접점을 찾기 어려울 것이라는 전망이 나왔다. 홍지선 국토부 장관은 실무 협의가 마무리된 뒤에야 오세훈 서울시장과 대면 협의를 진행하겠다는 뜻을 밝혀 조기 회동 가능성이 낮아졌다. 용산공원 본체부지 주택공급, 그린벨트 해제, 정비사업 규제 완화 등 쟁점마다 양측 입장이 갈리고 있다. 지난해 10월 주택공급 대책 이후 누적된 갈등이 정책 이견을 넘어 감정 대립으로 번졌다는 평가도 나온다. 전문가들은 서울시가 토지이용 권한 이양에 소극적이고 국토부도 일부 규제 완화에 부정적이어서 돌파구 마련이 쉽지 않다고 지적했다.","url":"https://www.newspim.com/news/view/20261102001558"},{"n":2,"title":"서울시, 소규모 정비사업 공동시행 전면 손질…수수료 폭리 차단","meta":"2026.11.02 11:15 · 아시아경제","body":"서울시가 소규모 주택정비사업의 조합·건설사 공동시행 방식을 전면 개선하기로 했다. 시가 45개 계약을 조사한 결과 공동시행자가 총사업비의 2.0~2.8%를 수수료로 받아 통상적인 컨설팅 대가의 약 4배에 달했고, 시공이나 재무 책임은 지지 않는 구조였다. 시공자 선정의 투명성 부족, 수수료 산정 기준 불명확, 사업 수익이 나기 전 수수료 60~80% 선지급 등도 문제로 지적됐다. 서울시는 다음 달 표준 가이드라인을 배포하고, 공동시행자로 참여하는 건설사가 시공 책임을 지도록 하는 법령 개정을 추진할 방침이다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026110208200256365"},{"n":3,"title":"현실화율 동결 전망에도 내년 공시가격은 오를 듯","meta":"2026.11.02 11:29 · 아시아경제","body":"정부가 내년 공시가격 현실화율을 올해와 같은 69% 안팎으로 동결할 것으로 전망되지만, 실거래가 상승 탓에 공시가격 자체는 오를 것으로 예상된다. 올해 1~9월 서울 아파트값은 8.32% 올라 지난해 연간 상승률과 비슷한 수준을 기록했다. 성북구가 14.69% 오르는 등 비강남권이 상승을 주도한 반면, 강남권은 최근 하락세로 돌아서 압구정 현대아파트 등 초고가 단지에서는 직전 거래보다 수억원 내린 사례도 나왔다. 지역별 가격 흐름이 엇갈리면서 보유세 부담의 편차도 커질 전망이다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026110211294450588"}]},{"name":"시장동향","articles":[{"n":5,"title":"30대 생애 첫 주택 매입, 영끌 절정이던 2021년 넘어섰다","meta":"2026.11.02 18:08 · 한국경제","body":"올해 수도권에서 생애 첫 집을 산 사람 10명 중 6명이 20~30대로 집계됐다. 30대 생애최초 매수자는 10월까지 11만1001명으로, 이른바 영끌 열풍이 불었던 2021년 연간 10만7970명을 이미 넘어섰다. 집값이 떨어지기를 기다리기보다 지금 사겠다는 수요가 서울 노원·강서구와 경기 동탄·안양 등 중저가 지역에 몰렸다. 전문가들은 더 늦으면 내 집 마련이 어려워진다는 불안 심리가 반영된 결과라고 분석했다.","url":"https://www.hankyung.com/article/2026110211371"},{"n":6,"title":"경매 물량 쏟아진다…올해 35만건으로 사상 최대 전망","meta":"2026.11.02 18:09 · 한국경제","body":"올해 법원 부동산 경매 신청 건수가 연간 35만건 안팎에 이를 것으로 전망된다. 이는 금융위기 직후인 2009년의 종전 최대치 29만7038건을 웃도는 규모다. 전국 평균 낙찰률은 21.2%까지 떨어져 10건 중 8건가량이 주인을 찾지 못하고 있다. 다만 서울 노원구 등 일부 지역에서는 경쟁이 붙어 감정가의 120~135% 선에 낙찰되는 아파트도 나오는 등 지역별 온도차가 뚜렷하다.","url":"https://www.hankyung.com/article/2026110211361"},{"n":7,"title":"같은 단지 소형·중형 아파트 가격차 2억원 아래로 좁혀져","meta":"2026.11.03 06:30 · 한국경제","body":"같은 단지 안에서도 면적별 가격 차이가 크게 줄어드는 현상이 서울 곳곳에서 나타나고 있다. 사당 롯데캐슬골든포레는 전용 49㎡가 15억2000만원에 거래돼, 일주일 전 16억9900만원에 팔린 전용 84㎡와 1억7900만원 차이에 그쳤다. 주택 가격 구간별로 대출 한도를 달리하는 규제가 강화되면서 매수세가 소형으로 쏠린 데다, 1~2인 가구 증가로 넓은 집 수요가 줄어든 영향으로 분석된다. 다만 대출 여건과 공급 상황에 따라 면적별 가격차가 다시 벌어질 수 있다는 의견도 나온다.","url":"https://www.hankyung.com/article/2026110209586"}]},{"name":"정비사업","articles":[{"n":11,"title":"서울 재개발·재건축 1184곳…주거지도 다시 그려진다","meta":"2026.11.02 08:45 · 한국경제","body":"서울시 집계 결과 10월 기준 서울에서 진행 중인 정비사업은 25개 자치구를 합쳐 1184곳으로 나타났다. 영등포구가 122곳으로 가장 많았다. 정비사업은 노후 주택을 바꾸는 데 그치지 않고 도로·공원·주차장 등 기반시설까지 함께 정비하는 효과가 있다는 평가다. 연희동 디파인 연희는 151가구 모집에 6655명이 몰려 44.1 대 1의 경쟁률을 기록했다. 7월 기준 정비사업이 몰린 서남권과 동북권 아파트값은 각각 16.06%, 15.91% 올라 서울 평균을 웃돌았다.","url":"https://www.hankyung.com/article/2026110291416"},{"n":12,"title":"반쪽 뉴타운 장위뉴타운 재시동…9개 구역 2만2000가구","meta":"2026.11.02 17:25 · 한국경제","body":"장기간 정체됐던 서울 성북구 장위뉴타운 사업이 다시 속도를 내고 있다. 가장 규모가 큰 장위13-1구역은 최근 조합 설립 동의율 75%를 넘겨 2027년 상반기 조합설립인가를 목표로 하고 있으며, 이는 2014년 구역 해제 이후 12년 만이다. 서울시 신속통합기획으로 용적률이 상향되면서 9개 구역을 합쳐 약 2만2000가구가 공급될 전망이다. 최근 신고가 거래가 나오는 등 집값도 오르고 있고, 2027년 말 개통 예정인 동북선도 수요를 끌어올릴 요인으로 꼽힌다.","url":"https://www.hankyung.com/article/2026110209721"}]},{"name":"금융/세제","articles":[{"n":19,"title":"예산정책처, 보유세·양도세 동시 인상 부동산 세제개편 모순 지적","meta":"2026.11.02 12:04 · 헤럴드경제","body":"국회예산정책처가 정부 부동산 세제개편안이 보유세와 양도세를 동시에 올려 주택시장 활력을 떨어뜨릴 수 있다고 분석했다. 종합부동산세 누진세율을 폐지하면서도 공제를 차등 적용해, 시가 30억원 주택 기준 1주택자와 다주택자의 세 부담 격차가 2028년 1.6배에서 5.1배로 벌어진다고 지적했다. 임대주택 공급이 줄고 전셋값이 오를 수 있다는 우려도 함께 제기됐다. 예정처는 거래 단계 과세를 낮추고 보유 단계 과세를 강화하라는 OECD 권고와도 어긋난다고 평가했다.","url":"https://biz.heraldcorp.com/article/10922692"},{"n":20,"title":"은행채 금리 내리자 5대 은행 주담대 금리 최대 0.61%p 하락","meta":"2026.11.02 17:52 · 아시아투데이","body":"KB국민·신한·하나·우리·NH농협 등 5대 은행의 5년 혼합형 주택담보대출 금리가 한 달 새 최대 0.61%포인트 내렸다. 준거금리인 은행채 5년물(AAA) 금리가 10월 말 4.179%로 0.346%포인트 떨어진 영향이다. 국고채 발행 축소와 글로벌 안전자산 수요 확대가 은행채 금리를 끌어내렸다. 하나은행 등 일부 은행은 중단했던 주택담보대출 취급을 재개했다. 다만 기준금리 인상 가능성과 가계대출 총량 규제가 유지되고 있어 금리 하락이 일시적일 수 있다는 분석도 나온다.","url":"https://www.asiatoday.co.kr/kn/view.php?key=20261102010000714"}]},{"name":"임대주택","articles":[{"n":21,"title":"재개발 물량 절반이 임대인 곳도…용산구 동자동 46.5%","meta":"2026.11.02 18:28 · 파이낸셜뉴스","body":"서울 25개 자치구의 정비사업장 369곳을 분석한 결과 전체 공급예정 52만9949가구 가운데 임대주택은 9만5797가구로 평균 18.08%였다. 그러나 임대 비율이 40%를 넘는 사업장도 5곳 있어 두 집 중 한 집이 임대인 셈이다. 용산구 동자동 사업장이 2150가구 중 1000가구로 46.51%를 기록해 가장 높았고, 서울역 일대가 45.82%로 뒤를 이었다. 건설업계는 공사비가 오르는 상황에서 높은 임대 의무비율이 일반분양 수익을 깎아 사업 추진을 어렵게 한다고 주장한다.","url":"https://www.fnnews.com/news/202611021827214937"}]},{"name":"주택품질/안전","articles":[{"n":22,"title":"GS건설, 스틸 모듈러 표준 평면 20종 개발","meta":"2026.11.02 10:11 · 아시아경제","body":"GS건설이 아파트·오피스텔·호텔·기숙사에 적용할 수 있는 스틸 모듈러 표준 평면 20종을 개발했다. 평면도와 3D 모델, 인테리어 투시도를 함께 제공하고 BIM과 연계해 공사비 산출과 사업성 검토 기간을 줄일 수 있도록 했다. 전용 포털을 만들어 자료를 제공하며, 내년에는 LH와 협력해 전용 65~75㎡ 중대형 평면으로 범위를 넓힐 계획이다. 회사 측은 발주처가 초기에 적합한 평면을 고르고 사업성과 공사비를 빠르게 검토할 수 있게 된다고 설명했다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026110210115921608"},{"n":23,"title":"용인 아파트 신축 공사장서 60대 근로자 3m 추락 부상","meta":"2026.11.02 17:45 · 뉴스1","body":"경기 용인시 처인구 역북서희스타힐스프라임시티 신축 공사장에서 60대 일용직 근로자가 옹벽에서 약 3m 아래로 떨어져 다쳤다. 이 근로자는 머리 부위 출혈 등의 부상을 입었다. 경찰은 바닥이 젖어 미끄러진 것으로 보고 있으나 정확한 사고 경위를 조사하고 있다.","url":"https://www.news1.kr/local/gyeonggi/6339678"}]},{"name":"분양정보","articles":[{"n":24,"title":"이달 전국 4만4358가구 분양…반포 디에이치반포124 주목","meta":"2026.11.02 17:24 · 한국경제","body":"11월 전국에서 60개 단지, 4만4358가구가 분양에 나선다. 지난해 같은 달보다 58% 많은 물량이다. 일반분양은 3만4909가구로 지난해 11월 1만7894가구의 두 배 수준이다. 수도권에서는 서울 반포동 디에이치반포124가 일반분양 1801가구로 가장 큰 단지이며, 전체 물량의 약 55%는 지방에 몰려 있다. 지방에서는 경북이 6083가구로 가장 많다.","url":"https://www.hankyung.com/article/2026110209771"}]},{"name":"논설/사설","articles":[{"n":25,"title":"[사설] 노도강도 월세 300만원, 서민 주거비 대책 시급하다","meta":"2026.11.03 04:11 · 서울신문","body":"서울신문은 사설에서 서울 아파트 월세가 올해 9월까지 7.7% 올라 지난해 연간 상승률의 두 배에 육박했다고 지적했다. 노원구가 12.9%, 성북구가 11.8% 오르며 노원구 중계동에서는 보증금 2억원에 월세 340만원짜리 계약까지 나왔다고 전했다. 전세 거래가 1~9월 27% 넘게 줄어 월세 비중이 처음 50%를 넘어선 점, 대출 규제와 실거주 의무가 전세 물량을 줄인 점을 원인으로 꼽았다. 신문은 정부가 8월 공급대책과 9월 실거주 예외 확대를 내놨지만 당장 효과를 보기 어렵다며, 집값 안정과 세입자 부담 완화를 함께 고려해 정책을 더 정교하게 다듬어야 한다고 주장했다.","url":"https://www.seoul.co.kr/news/editOpinion/editorial/2026/11/03/20261103027003"}]}]},{"date":"2026-11-02","count":15,"pdf_count":29,"highlights":[{"n":1,"text":"홍지선 국토부 장관 \"서울시가 협조하면 연내 추가 택지 발표 가능\""},{"n":5,"text":"올해 서울 아파트값 상승률, 벌써 지난해 연간치 넘어 역대 최고"},{"n":12,"text":"세운4구역 매장유산 심의 또 보류…서울시 \"불확실성 장기화 우려\""}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"홍지선 국토부 장관 \"서울시가 협조하면 연내 추가 택지 발표 가능\"","meta":"2026.10.30 17:29 · 한국경제","body":"홍지선 국토교통부 장관이 10월 30일 서울 노원구 상계2구역 재개발 현장을 찾아 \"서울시가 적극 협조하면 연내에 추가 택지를 발표할 수 있다\"고 밝혔다. 정부와 더불어민주당은 민간 정비사업의 용적률을 법정 상한의 1.2배까지 올리는 방안을 추진 중이며, 3종 일반주거지역은 300%에서 360%까지 확대될 수 있다. 2008년 정비구역으로 지정된 상계2구역은 2023년 공사비 인상안이 부결되며 사업이 지연됐고, 조합은 대출 규제 완화와 정부의 주택도시보증 지원, 공사비 분쟁 조정 강화를 요청했다. 국토부는 연말 지원 강화와 관리처분인가 전 현장 상담 확대를 약속했다.","url":"https://www.hankyung.com/article/2026103068051"},{"n":2,"title":"서울시, 홍지선 장관 발언 반박…\"용적률 1.2배는 이미 건의, 정부가 나설 때\"","meta":"2026.10.30 18:57 · 헤럴드경제","body":"서울시가 10월 30일 \"정비사업 용적률 상향과 관련해 서울시 회신을 기다리고 있다\"는 홍지선 국토교통부 장관 발언을 정면 반박했다. 서울시는 용적률 1.2배 상향을 이미 정부에 지속적으로 건의해 왔으며, 도시 및 주거환경정비법 개정은 정부가 신속히 추진해야 할 사안이라고 밝혔다. 또 용적률 상향을 다른 현안과 연계하는 것은 적절하지 않다고 선을 그었다. 용산공원 본체 부지에 대해서는 특별법 취지대로 온전히 공원으로 조성해야 한다며 주택 공급지 활용에 반대 입장을 분명히 했다.","url":"https://biz.heraldcorp.com/article/10921021"}]},{"name":"시장동향","articles":[{"n":5,"title":"올해 서울 아파트값 상승률, 벌써 지난해 연간치 넘어 역대 최고","meta":"2026.10.31 07:00 · 아시아경제","body":"한국부동산원 통계 기준 서울 아파트값의 올해 1~10월 누적 상승률이 8.73%를 기록해 지난해 연간 상승률 8.71%를 이미 넘어섰다. 2012년 주간 통계 집계 이래 최고치다. 지난해에는 강남3구와 용산구가 상승을 이끌었지만 올해는 성북구 16.56%, 구로구 13.03% 등 서울 외곽이 상승을 주도하는 것이 특징이다. 전문가들은 전세 매물 급감과 신규 입주 물량 부족이 전월세 가격을 밀어 올리며 집값의 하방을 지지하고 있다고 분석했다. 주택 보유 여부에 따른 자산 양극화가 심해질 수 있다는 우려도 제기됐다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026103016233034806"},{"n":6,"title":"집값은 오르는데 거래는 끊겨…서울 아파트 매물 8만건 육박","meta":"2026.10.31 15:30 · 서울경제","body":"서울 아파트값이 90주 연속 올랐지만 10월 28일 기준 매도 물량이 8만건에 육박하며 올해 3월 최고치에 161건 차이까지 근접했다. 9월 거래량은 5월 고점 대비 56% 급감해 가격 상승과 거래 절벽이 동시에 나타나고 있다. 주간 상승률은 0.09%로 오름폭이 둔화됐고, 강남구(-0.38%)·서초구(-0.35%)·송파구(-0.22%)는 하락 전환했다. 업계에서는 최근 오른 가격을 낮추지 않으려는 매도자와 대출·금리 부담에 관망하는 매수자가 맞서는 국면이라는 해석이 나온다.","url":"https://www.sedaily.com/article/20108588"}]},{"name":"정비사업","articles":[{"n":12,"title":"세운4구역 매장유산 심의 또 보류…서울시 \"불확실성 장기화 우려\"","meta":"2026.10.30 15:54 · 한국경제","body":"국가유산청 심의위원회가 종로구 세운4구역 재개발의 매장유산 보존방안 심의를 네 번째로 보류하자 서울시가 공개적으로 우려를 표명했다. 서울시는 반복된 보류로 사업 지연은 물론 행정의 신뢰성과 예측 가능성이 떨어진다고 밝혔다. 2024년 1월 심의에서는 유물 이전 보존이 인정됐으나 최근에는 현지 보존 원칙이 제시되면서 건축·보존계획을 전면 수정해야 하는 상황이다. 서울시는 2025년 11월 발굴조사를 마치는 등 2024년 조건을 모두 이행했다며 일관된 심의 기준을 요구했다.","url":"https://www.hankyung.com/article/202610306035i"},{"n":13,"title":"동작구 흑석동 재정비촉진지구에 817가구 공급","meta":"2026.10.30 17:28 · 한국경제","body":"서울시가 동작구 흑석동 일대 신속통합기획 가이드라인을 확정해 최고 23층, 817가구 규모의 주거단지를 조성하기로 했다. 2014년 7월 구역 해제 이후 약 10년간 멈춰 있던 지역으로, 최대 69m에 이르는 심한 고저차는 단차 개발과 단계식 조경으로 완화한다. 흑석로를 12m에서 15m로 넓히고 동양중학교와 연결되는 폭 14m 도로도 새로 낸다. 능선부에는 6~8층 저층 주거를, 저지대에는 최고 23층 건물을 배치해 지형과 경관을 함께 고려했다.","url":"https://www.hankyung.com/article/2026103068041"}]},{"name":"금융/세제","articles":[{"n":18,"title":"중도금 대출금리 연 5% 육박…청약 당첨자 자금 부담 가중","meta":"2026.11.01 11:00 · 헤럴드경제","body":"신축 아파트 중도금 대출 금리가 연 5% 수준까지 올라 청약 당첨자들의 부담이 커지고 있다. 최근 분양한 '드파인 아르티아'는 4.88%, '공덕역 자이르네'는 4.93%의 중도금 대출 금리가 적용됐다. 후불제 방식이어서 잔금 납부 시점에 이자를 한꺼번에 정산해야 해 입주 때 필요한 자금이 크게 늘어난다. 전세대출 제한과 LTV 40% 규제로 계약금뿐 아니라 중도금 일부까지 직접 마련해야 하는 상황이라는 점도 부담 요인으로 꼽힌다.","url":"https://biz.heraldcorp.com/article/10921564"},{"n":19,"title":"부동산 세제개편안 국회 심사 돌입…실거주 못한 1주택자 구제 범위가 쟁점","meta":"2026.11.02 06:00 · 뉴시스","body":"국회 재정경제기획위원회가 정부의 부동산 세제개편안 심사에 들어갔다. 정부안은 종합부동산세 기본공제를 실거주자에 한해 12억원에서 14억원으로 올리고 비거주자는 12억원을 유지하는 내용을 담았다. 양도소득세 장기보유특별공제도 2029년부터 보유기간 대신 실거주 기간을 중심으로 재편된다. 직장 근무와 가족 돌봄, 질병 등 불가피한 사유로 집을 비운 1주택자를 어디까지 인정할지, 기존 등록임대사업자에 대한 세제 지원을 어떻게 할지가 주요 쟁점으로 떠올랐다.","url":"https://www.newsis.com/view/?id=NISX20261101_0003849967"}]},{"name":"택지/도시개발","articles":[{"n":20,"title":"김포 3만7000가구 공급에 주민 한숨…\"교통 대책이 먼저\"","meta":"2026.11.01 06:05 · 머니투데이","body":"국토교통부가 김포시 고촌읍 일대에 3만7000가구를 공급하기로 했지만 주민들은 교통 대책 부재를 우려하고 있다. 김포골드라인 혼잡률은 이미 180% 수준이고, 2028년까지 기존 지역에서만 1만가구 이상이 추가로 입주한다. 김포시장은 철저한 교통 대책 없이 주택만 공급하면 김포가 소비형 베드타운으로 전락한다고 지적했다. 주민들은 서울 지하철 5호선 연장(방화~검단~김포, 25.8km)에 기대를 걸고 있으나 목표 개통 시점은 2033년이다. 전문가들은 택지 선정 단계부터 주택 공급과 기반시설 계획을 함께 세워야 한다고 조언했다.","url":"https://www.mt.co.kr/estate/2026/11/01/2026103011393759240"},{"n":21,"title":"39년 된 석수역 중앙철재종합상가, 944세대 주상복합으로","meta":"2026.11.01 11:15 · 머니투데이","body":"1987년 준공돼 39년이 지난 서울 금천구 중앙철재종합상가가 시장정비사업을 통해 주상복합으로 재탄생한다. 불법 증축과 개조로 안전 문제가 꾸준히 제기됐고 2023년에는 화재도 발생했으며 공실률은 38.4%에 달했다. 새 계획은 지하 4층~지상 최고 43층 6개 동에 944세대를 공급하고 대형 점포와 공공체육시설, 사회복지시설도 함께 조성하는 내용이다. 신안산선이 개통되면 접근성이 좋아져 서울 서남권의 새 주거·생활 거점이 될 것으로 기대된다.","url":"https://www.mt.co.kr/estate/2026/11/01/2026110109270795120"}]},{"name":"주택품질/안전","articles":[{"n":23,"title":"SH공사, 공공주택 보일러 배기통 이탈방지장치 무료 보급","meta":"2026.10.30 13:29 · 아시아경제","body":"서울주택도시개발공사(SH)와 한국가스안전공사가 보일러 배기통 이탈방지장치 무료 보급사업 업무협약을 체결했다. 동절기 가스보일러 사용이 늘면서 발생하는 일산화탄소 중독사고를 막기 위한 조치다. 진동이나 외부 충격으로 배기통이 빠지는 상황을 막는 장치를 공공주택 입주민에게 무료로 보급·설치할 계획이다. 황상하 SH 사장은 배기통 이탈이 큰 사고로 이어질 수 있는 만큼 사전 예방이 중요하다고 밝혔다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026103013291061916"},{"n":24,"title":"GS건설 아파트 커뮤니티 예약시스템 해킹…입주민 개인정보 유출","meta":"2026.10.30 16:44 · 아시아경제","body":"GS건설의 아파트 커뮤니티시설 예약관리 시스템이 외부 해킹 공격을 받아 입주민 개인정보가 유출됐다. 회사는 10월 28일 오후 10시 15분경 외부 비인가 접근이 발생했고 오후 11시 29분경 이를 감지해 즉시 차단했다고 밝혔다. 유출된 정보는 이름, 별명, 생년월일, 휴대전화번호, 성별, 이메일, 주소, 회원번호, 거주유형 등이며 주민등록번호와 금융정보는 수집하지 않아 포함되지 않았다고 설명했다. GS건설은 정밀 조사 후 피해 규모와 개별 유출 여부를 입주민에게 안내하고 재발 방지 대책을 마련하겠다고 밝혔다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026103016441968400"}]},{"name":"분양정보","articles":[{"n":26,"title":"11월 전국 4만2393가구 분양…서울 일반분양은 1369가구뿐","meta":"2026.10.31 06:00 · 머니투데이","body":"11월 전국 55개 단지에서 4만2393가구가 공급되고 일반분양 물량은 3만5788가구로 전월의 약 세 배에 이를 전망이다. 수도권이 1만7195가구(48%), 지방이 1만8593가구(52%)이며 경기도가 1만1877가구로 가장 많다. 서울 일반분양은 1369가구로 전국의 3.8%에 그쳐 희소성이 부각된다. 주요 단지로는 서초 롯데캐슬, 종로 경희궁 에피트, 영등포 해링턴 플레이스 등이 꼽힌다. 전문가는 물량이 늘면서 청약 수요가 분산되고 가격 경쟁력과 입지에 따른 단지별 양극화가 나타날 수 있다고 전망했다.","url":"https://www.mt.co.kr/estate/2026/10/31/2026103008423659834"},{"n":27,"title":"11월 첫째 주 전국 5곳 4928가구 청약…고덕강일3단지 본청약","meta":"2026.11.01 17:35 · 서울경제","body":"11월 2~6일 전국 5개 단지에서 4928가구가 청약에 들어간다. 11월 3일에는 반도건설이 인천 계양신도시 AC3·AC4블록 '계양신도시 카이브 유보라' 1순위 청약을 받는다. 지상 8~15층 16개 동에 전용 84~93㎡ 1110가구와 근린생활시설로 구성된다. 11월 4일에는 서울주택도시개발공사(SH)의 강동구 '고덕강일3단지' 토지임대부 분양주택 1305가구가 본청약에 나서며, 전매는 5년간 제한되고 10년까지는 차익 일부를 공유한 뒤 그 이후 자유로운 거래가 가능하다. 11월 6일에는 경룡건설의 경기 시흥 '엘리프 시흥 더프라임'이 견본주택을 연다.","url":"https://www.sedaily.com/article/20108768"}]},{"name":"논설/사설","articles":[{"n":29,"title":"[사설] 수도권 주택공급, 정부·지자체 적극 협력해야","meta":"2026.10.30 18:33 · 경향신문","body":"정부가 경기 지역 6곳의 그린벨트를 풀어 7만6700가구를 공급하기로 한 결정을 두고 사설은 2030년 착공을 목표로 공급 계획을 구체화한 점은 의미가 있다고 평가했다. 다만 지방자치단체와 사전 협의가 부족했다는 점을 한계로 지적했다. 김포시장은 일방적 강행에 깊은 유감을 표했고 하남시장은 교통시설 완비와 지하철 조기 개통을 요구했다. 사설은 주택공급이 정부 의지만으로는 불가능하며 광역교통망 확충과 생활 인프라 조성이 함께 가야 실효성이 있다고 주장했다.","url":"https://www.khan.co.kr/article/202610301833001"}]}]},{"date":"2026-10-30","count":15,"pdf_count":22,"highlights":[{"n":1,"text":"김포·하남 등 수도권 신규택지 6곳 확정…7만6700가구 2030년 착공"},{"n":5,"text":"서울 새 아파트 입주 물량 13년 만에 최저…분양가는 5년 새 두 배"},{"n":9,"text":"서울 세운지구 용적률 880%로…비주거 비율 20%까지 낮춘다"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"김포·하남 등 수도권 신규택지 6곳 확정…7만6700가구 2030년 착공","meta":"2026.10.29 17:44 · 한국경제","body":"국토교통부가 8·13 주택 신속공급방안의 후속으로 서울 경계에서 5㎞ 이내인 경기 김포·구리·하남·의정부·고양 등 6곳을 신규 공공주택지구 후보지로 지정하고 총 7만6700가구를 공급한다고 29일 발표했다. 김포아라지구가 3만7000가구로 가장 크고 구리건원 1만4600가구, 하남미사 K-컬처 1만2000가구, 하남감일2 6500가구, 고양대곡 4000가구, 의정부다락원 2600가구가 뒤를 이었다. 정부는 공공택지 최단기 착공모델을 처음 적용해 지구 지정부터 착공까지 기간을 단축하고 2030년까지 착공, 이르면 2033년 입주를 목표로 제시했다. 정우진 국토부 주택공급추진본부장은 최단기 모델을 통해 2030년 안에 착공할 수 있을 것이라고 밝혔다. 다만 교통망 확충 지연과 기존 주민 반발이 과제로 지적된다.","url":"https://www.hankyung.com/article/2026102943641"},{"n":2,"title":"서울 그린벨트는 또 빠졌다…국토부 “서울시 회신 기다리는 중”","meta":"2026.10.29 17:13 · 뉴스핌","body":"이번 신규택지 후보지 6곳이 모두 경기도에 집중되면서 정작 수요가 가장 많은 서울은 제외됐다. 국토부는 지방자치단체와 협의가 끝난 곳부터 후보지로 발표했다고 설명했으며, 서울시와는 그린벨트 해제 범위와 용산공원 주택 활용을 놓고 이견이 이어지고 있다. 홍지선 국토부 장관은 서울시의 회신을 기다리고 있다고 밝혔고, 조만간 오세훈 서울시장과의 면담이 예상된다. 서울시는 환경 훼손 우려와 신속 공급 일정의 실현 가능성에 의문을 제기하고 있어 협의 타결까지 시간이 걸릴 전망이다.","url":"https://www.newspim.com/news/view/20261029001278"}]},{"name":"시장동향","articles":[{"n":5,"title":"서울 새 아파트 입주 물량 13년 만에 최저…분양가는 5년 새 두 배","meta":"2026.10.29 08:43 · 한국경제","body":"올해 서울 아파트 입주 물량은 1만7698가구로 2013년 1만6321가구 이후 13년 만에 가장 적은 수준으로 집계됐다. 지난해 3만2370가구와 비교하면 45% 줄어든 규모다. 내년 예정 물량은 1만8329가구지만 2028년에는 1만3212가구로 다시 급감할 것으로 전망됐다. 반면 서울 아파트 평균 분양가는 2021년 3.3㎡당 2799만원에서 올해 5401만원으로 5년 새 약 두 배로 올랐다. 업계에서는 입주 물량 감소와 가격 상승이 겹치며 실수요자의 진입 문턱이 계속 높아지고 있다고 지적했다.","url":"https://www.hankyung.com/article/2026102921906"},{"n":6,"title":"서울 아파트값 90주 연속 상승…오름세는 수원·군포 등 경기 남부로","meta":"2026.10.29 14:00 · 한국경제","body":"한국부동산원 집계에서 서울 아파트값은 90주 연속 올라 역대 최장 상승 기록을 이어갔으나 주간 상승률은 0.09%로 둔화됐다. 반면 경기는 전주 대비 0.20% 올랐고 수원 영통구와 군포시가 각각 0.58% 상승해 수도권에서 가장 높은 상승률을 기록했다. 수원발 상승세가 의왕, 용인 기흥 등 인접 지역으로 번지는 모습이다. 전세 매물 부족으로 구매력이 낮아진 세입자들이 인근 지역으로 이동하면서 비규제지역의 6억원 안팎 주택이 특히 강세를 보이고 있다는 분석이 나왔다.","url":"https://www.hankyung.com/article/2026102930826"}]},{"name":"정비사업","articles":[{"n":9,"title":"서울 세운지구 용적률 880%로…비주거 비율 20%까지 낮춘다","meta":"2026.10.29 17:28 · 한국경제","body":"서울시가 세운재정비촉진지구의 재정비촉진계획 변경안을 마련해 29일부터 11월 12일까지 주민공람에 들어갔다. 일반상업지역 허용용적률을 800%에서 880%로 높이고, 업무·상업 등 비주거용도 비율은 50% 이상에서 20% 이상으로 완화한다. 건폐율 기준도 50% 이하에서 60% 이하로 풀었고, 사업이 장기간 지연된 존치정비구역 12곳은 재정비촉진구역으로 전환해 전체 정비구역이 44곳에서 46곳으로 늘어난다. 서울시는 오래 멈춰 있던 구역의 사업성을 높이고 생활편의시설을 확충하려는 조치라고 설명했다.","url":"https://www.hankyung.com/article/2026102941791"},{"n":10,"title":"도시정비 수주액은 늘고 경쟁은 줄고…상위 3사가 62% 차지","meta":"2026.10.30 07:51 · 아시아타임즈","body":"올해 건설사들의 도시정비사업 누적 수주액은 46조2067억원으로 집계됐다. 현대건설이 12조7315억원으로 1위, 삼성물산이 10조4686억원, GS건설이 5조5477억원으로 뒤를 이었으며 상위 3개사 점유율이 62.2%에 달했다. 대형사들이 수주 가능성이 높은 사업장에 집중하면서 경쟁입찰이 성립하지 않고 단독 응찰로 끝나는 사례가 늘고 있다는 것이 업계의 분석이다. 목동 5개 단지는 예정공사비만 9조원을 넘어 연말 수주 경쟁의 분수령으로 꼽힌다.","url":"https://www.asiatime.co.kr/article/20261029500351"}]},{"name":"금융/세제","articles":[{"n":12,"title":"주담대 금리 연 4.88%…고정형은 사상 처음 5% 넘어섰다","meta":"2026.10.29 13:17 · 한국일보","body":"한국은행이 29일 발표한 9월 금융기관 가중평균금리에 따르면 예금은행의 신규취급액 기준 주택담보대출 금리는 연 4.88%로 전월보다 0.22%포인트 올랐다. 2012년 4월 4.94% 이후 14년 5개월 만의 최고 수준으로, 지난 5월 4.32%부터 5개월 연속 상승했다. 고정형 주담대 금리는 5.11%로 전월 대비 0.23%포인트 올라 한은이 고정형과 변동형을 구분해 통계를 작성하기 시작한 2013년 1월 이후 처음으로 5%를 넘어섰다. 9월 가계대출 금리 전체도 4.96%로 0.20%포인트 상승했다. 금리 부담이 커지면서 대출을 끼고 집을 산 수요자의 이자 부담이 가중될 것으로 보인다.","url":"https://www.hankookilbo.com/news/article/A2026102913170005148"}]},{"name":"임대주택","articles":[{"n":13,"title":"서울시, 내년 공공임대 2만7200가구…청년월세 지원 9000명 확대","meta":"2026.10.29 16:39 · 뉴스핌","body":"서울시가 29일 발표한 2027년도 예산안에 공공임대주택 공급 예산 1조1228억원이 담겼다. 매입형 2만736가구, 임차형 3100가구, 건설형 3364가구 등 모두 2만7200가구를 공급할 계획이다. 청년월세 지원 대상은 2만3000명에서 3만2000명으로 9000명 늘리고, 청년·신혼부부 주거비 지원에 2054억원을 반영했다. 역세권 청년주택 등으로 청년·신혼부부용 3027가구를 공급하고 대학가 인근에 서울형 시작주택 500호를 새로 조성한다. 기준중위소득 48% 이하 가구에 지급하는 주거급여에는 1조337억원이 배정됐다.","url":"https://www.newspim.com/news/view/20261029001240"}]},{"name":"택지/도시개발","articles":[{"n":14,"title":"김포 아라지구에만 3만7000가구…서울 서부권 주거거점으로","meta":"2026.10.29 10:00 · 뉴스핌","body":"이번 신규택지 중 최대 규모인 김포 아라지구는 365만㎡ 부지에 3만7000가구가 들어선다. 전체 신규 공급 물량 7만6700가구의 약 48%가 이 한 곳에 집중된 셈이다. 서울 강서구와 맞닿은 한강변 입지로, 정부는 지하철 5호선 연장사업과 한강시네폴리스 산업단지, 고촌 물류단지 등과 연계해 직주근접이 가능한 자족형 주거단지로 개발하겠다고 밝혔다. 다만 물량이 한 지역에 쏠려 서울 중저가 주택 수요를 흡수하는 효과는 제한적일 수 있다는 지적도 함께 나온다.","url":"https://www.newspim.com/news/view/20261029000263"},{"n":15,"title":"김포·하남에 물량 72% 쏠려…“교통 없는 공급은 베드타운”","meta":"2026.10.29 14:15 · 국민일보","body":"이번에 발표된 7만6700가구 가운데 김포와 하남 물량이 약 72.3%를 차지했다. 김포시는 지하철 5호선과 9호선 연장 등 광역교통망 확충과 지방세 손실 보전을 요구하고 나섰다. 이기형 김포시장은 철저한 대책 없는 일방적 주택 공급은 도시를 단순 소비형 베드타운으로 전락시킬 것이라고 밝혔다. 정부는 지구 지정부터 착공까지 걸리는 기간을 기존 68개월에서 37개월로 단축해 2030년까지 착공하겠다는 계획이다.","url":"https://www.kmib.co.kr/article/20261029501057"}]},{"name":"주택품질/안전","articles":[{"n":17,"title":"SH, 마곡 공공주택 등 건설현장 6곳 안전점검","meta":"2026.10.29 16:01 · 헤럴드경제","body":"황상하 서울주택도시개발공사 사장이 10월 27~28일 이틀간 공공주택과 기반시설 건설현장 6곳을 직접 찾아 안전관리 실태를 점검했다. 점검 대상은 마곡 16단지와 마곡동 1410 공공주택, 사천빗물펌프장, 송파 창의혁신 개발사업, 홍릉R&D지원센터, 고덕강일 체육공원 등이다. 기온 하강과 강풍 등 계절적 위험요인을 확인하고 지능형 영상분석 CCTV와 스마트 안전장비를 묶은 SH의 스마트 안전관리 체계도 함께 살폈다. 황 사장은 건설현장 안전은 기본 수칙을 지키고 위험요인을 미리 찾아 개선하는 데서 시작된다며 현장 관계자와 근로자의 자율적 안전관리 실천을 당부했다.","url":"https://biz.heraldcorp.com/article/10919446"},{"n":18,"title":"고양시, 노후 공동주택 44곳 승강기·급수관 교체 지원","meta":"2026.10.29 09:36 · 서울경제","body":"고양시가 올해 26억여 원을 들여 사용검사 후 15년이 지난 관내 노후 공동주택 44곳을 대상으로 공동주택 유지관리 지원사업을 진행하고 있다. 승강기와 급수관 교체, 옥상 방수 등이 지원 대상이며 전체 사업의 80% 이상이 마무리됐다. 여기에 1억2000만 원을 별도로 마련해 자동 화재감지 설비와 전기차 충전시설 지상 이전, 화재감지 CCTV 설치 비용의 50%를 단지당 최대 2500만 원까지 보조하고 있다. 노후 주택 14가구에는 고효율 창호 교체와 단열 개선을 가구당 최대 1000만 원까지 지원했다. 민경선 고양시장은 시민의 생명과 직결된 안전 확보가 최우선 과제라고 밝혔다.","url":"https://m.sedaily.com/article/20107548"}]},{"name":"분양정보","articles":[{"n":19,"title":"인천 청라 아크원 푸르지오, 30일 견본주택 열고 868가구 분양","meta":"2026.10.29 09:09 · 아시아타임즈","body":"청라스마트시티가 시행하고 대우건설이 시공하는 청라 아크원 푸르지오가 10월 30일 견본주택을 열고 분양에 들어간다. 지하 5층~지상 최고 49층, 6개 동에 아파트 868가구와 주거형 오피스텔 987실 등 총 1855가구 규모로, 전용 84~103㎡ 아파트가 분양가상한제를 적용받아 공급된다. 청약은 11월 2일 특별공급, 3일 1순위, 4일 2순위 순으로 진행된다. 계약금은 분양대금의 5%로 책정됐다. 인근에는 서울 지하철 7호선 청라 연장과 하나금융그룹 업무시설, 스타필드 청라, 서울아산청라병원 등이 추진 중이다.","url":"https://www.asiatime.co.kr/article/20261029500035"},{"n":20,"title":"KT에스테이트, 춘천 남춘천 센트레빌 264가구 분양 돌입","meta":"2026.10.29 14:50 · 글로벌이코노믹","body":"KT에스테이트가 강원특별자치도 춘천시 효자동 ITX 남춘천역 인근에 짓는 주상복합단지 남춘천 센트레빌의 견본주택을 30일 열고 분양 일정에 들어간다. 지하 6층~지상 최고 39층, 총 264가구 규모로 실수요 선호도가 높은 전용 59㎡와 84㎡ 중소형으로 구성됐다. 시공은 동부건설이 맡는다. 춘천 지역에서는 처음으로 KT그룹의 AI 역량을 결합한 통합 AI 주거 플랫폼을 도입하고 바리스타 로봇과 짐 배송 로봇 등을 제공한다는 계획이다. 39층에는 스카이라운지와 피트니스 센터 등 커뮤니티 시설이 조성된다.","url":"https://www.g-enews.com/article/Real-Estate/2026/10/202610291449363822a9fc143920_1"}]},{"name":"논설/사설","articles":[{"n":21,"title":"[사설] 경기 택지와 서울 정비사업은 함께 가야 한다","meta":"2026.10.30 04:05 · 머니투데이","body":"사설은 경기 5개 시에 7만6700가구를 공급하겠다는 정부 계획을 다루면서 서울 재건축·재개발의 동시 추진이 필요하다고 주장했다. 김포 5호선 연장 같은 교통 인프라가 착공 일정에 맞춰지지 않으면 출퇴근이 가능한 입지라는 전제 자체가 흔들린다고 지적했다. 또 그린벨트 해제의 정당성 설명과 지자체 협의가 충분하지 않아 성과는 정부가 가져가고 부담은 기초지자체가 떠안는 구조가 반복된다고 비판했다. 이르면 2033년에야 입주가 시작되는 만큼 경기 신규택지만으로는 당장의 주택시장 불안을 해소할 수 없고 서울의 공급 부족은 정비사업으로 풀어야 한다는 것이 사설의 결론이다.","url":"https://mt.co.kr/opinion/2026/10/30/2026102915510224292"}]}]}],"holidays":["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-02","2026-05-01","2026-05-05","2026-05-25","2026-06-03","2026-06-06","2026-08-17","2026-09-24","2026-09-25","2026-09-26","2026-10-05","2026-10-09","2026-12-25"],"art":{"date":"2026-11-12","url":"https://claude.ai/artifact/PvEbpwQSfGxroF4CKyyK7W","items":[{"cat":"정부정책","title":"재개발 막는 알박기·버티기, 정부가 전국 실태조사","img":"art/20261112-1.png","anchor":"s1"},{"cat":"시장동향","title":"강남은 내리고 성북은 오르고, 뒤집힌 서울 집값","img":"art/20261112-2.png","anchor":"s2"},{"cat":"정비사업","title":"재초환 부담금 부과 기준, 국토부가 곧 결론 낸다","img":"art/20261112-3.png","anchor":"s3"},{"cat":"금융/세제","title":"세금 부담에 다주택 정리, 전월세 매물은 더 줄었다","img":"art/20261112-4.png","anchor":"s4"},{"cat":"임대주택","title":"전셋집 품귀에 재계약 늘었지만 갱신권은 덜 썼다","img":"art/20261112-5.png","anchor":"s5"},{"cat":"택지/도시개발","title":"비어 있던 가리봉시장 땅에 청년 공공주택 181가구","img":"art/20261112-6.png","anchor":"s6"}]}};
