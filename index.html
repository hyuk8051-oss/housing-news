<style>
/* Layout: one phone-width reading column (max 520px) centered on wide screens; magazine cover, then sticky category nav and article cards grouped by field. */
:root{
  --bg:#eef1f4;          /* page ground, slight blue bias */
  --surface:#ffffff;     /* cards, cover paper */
  --ink:#18334f;         /* PDF navy: titles, brand */
  --text:#25303b;
  --muted:#6a7581;
  --line:#dbe1e7;
  --accent:#1f74c4;      /* links, active chip (logo blue, deepened) */
  --accent-soft:#e3eef9;
  --mark:#e5484d;        /* logo red: cover kicker, "최신" badge */
  --logo-bg:transparent;
  --logo-pad:0;          /* 어두운 화면에서는 로고 뒤에 흰 바탕 */
  --shadow:0 1px 2px rgba(24,51,79,.06),0 4px 14px rgba(24,51,79,.05);
  --fs:1;                /* 글자 크기 배율 (글자 크기 버튼) */
  --f-sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-serif:"Noto Serif KR","AppleMyungjo","Batang",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151d;--surface:#16212c;--ink:#d3e3f3;--text:#dbe2e9;--muted:#93a0ad;--line:#273443;
  --accent:#6db2f2;--accent-soft:#1b3044;--mark:#ff6b6f;--logo-bg:#ffffff;--logo-pad:4px 8px;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151d;--surface:#16212c;--ink:#d3e3f3;--text:#dbe2e9;--muted:#93a0ad;--line:#273443;
  --accent:#6db2f2;--accent-soft:#1b3044;--mark:#ff6b6f;--logo-bg:#ffffff;--logo-pad:4px 8px;--shadow:none;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto;background:var(--bg);min-height:100%}
@media (min-width:560px){body{background:var(--line)}.wrap{box-shadow:0 0 0 1px var(--line)}}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;
  height:52px;padding-inline:16px;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.fs-ctl{flex:none;display:flex;align-items:center;height:40px;border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden}
.fs-ctl button{width:48px;height:100%;border:0;background:none;cursor:pointer;color:var(--ink);font-size:22px;font-weight:500;line-height:1;display:flex;align-items:center;justify-content:center}
.fs-ctl button:disabled{color:var(--line);cursor:default}
.fs-ctl span{padding:0 4px;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;min-width:62px;text-align:center}
.bar-gap{flex:1}
.btn-bar{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);
  background:var(--surface);font-size:14px;font-weight:500;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn-bar svg{width:16px;height:16px}

.notice{margin:12px 16px 0;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;
  background:var(--accent-soft);color:var(--ink);display:flex;gap:10px;align-items:center;justify-content:space-between}
.notice button{flex:none;border:0;background:var(--ink);color:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer}

/* ---------- cover (매거진형) ---------- */
.cover{background:var(--surface);min-height:min(calc(100svh - 52px - env(safe-area-inset-top,0px)),900px);display:flex;flex-direction:column;padding:22px 22px 26px;gap:22px}
.cover>*{flex-shrink:0}
.mast{display:grid;gap:8px}
.mast-top{display:flex;align-items:center}
.mast-top .logo img{height:22px}
.mast-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:3px double var(--ink);padding-bottom:11px}
.mast-row b{font-family:var(--f-serif);font-weight:900;font-size:clamp(30px,calc(17vw - 28px),44px);color:var(--ink);letter-spacing:-.5px;line-height:1;white-space:nowrap}
.mast-row span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:380px){
  .mast span{font-size:12px}
  .fs-ctl button{width:42px}
  .btn-bar{padding:0 10px}
  .bar{gap:6px}
}
.hl-cat{display:block;font-size:calc(12px * var(--fs));font-weight:700;letter-spacing:.02em;margin-bottom:2px}
.lead-cat{font-size:calc(13px * var(--fs));font-weight:700;color:var(--mark);letter-spacing:.04em}
.lead h2{margin:6px 0 10px;font-family:var(--f-serif);font-weight:900;font-size:calc(clamp(23.4px,6.84vw,28.8px) * var(--fs));line-height:1.34;color:var(--ink);text-wrap:balance;letter-spacing:-.4px}
.lead p{margin:0;font-size:calc(16px * var(--fs));line-height:1.7;color:var(--text)}
.lead a.more{display:inline-block;margin-top:10px;font-weight:700;text-decoration:none;font-size:calc(16px * var(--fs))}
.subs{display:grid;border-top:1px solid var(--line)}
.subs a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.subs .hl-cat{color:var(--muted)}
.subs b{font-family:var(--f-serif);font-weight:600;font-size:calc(18px * var(--fs));line-height:1.45;display:block}
/* 그림으로 보는 오늘: 오늘의 주택 뉴스 그림 6컷 가로 띠 (최신 날짜에만, 2026-10-06) */
.art-b h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:calc(15px * var(--fs));color:var(--ink)}
.art-b h3 a{font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.art-b .strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px 4px;scroll-snap-type:x mandatory;scroll-padding-inline:22px}
.art-b .strip::-webkit-scrollbar{display:none}
.art-b .strip a{flex:none;width:132px;text-decoration:none;color:var(--ink);scroll-snap-align:start}
.art-b .strip img{display:block;width:132px;height:129px;border-radius:10px;object-fit:cover;background:var(--line)}
.art-b .strip span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.art-b .strip b{font-size:13px;font-weight:600;line-height:1.35;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art-b .strip a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.cover .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.stats{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.logo{display:inline-block;background:var(--logo-bg);border-radius:6px;padding:var(--logo-pad)}
.logo img{display:block;width:auto}

/* ---------- category nav ---------- */
.catnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.catnav-scroll{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.catnav-scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
.chip span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.on span{color:var(--surface);opacity:.75}

/* ---------- articles ---------- */
main{padding:6px 16px 8px;display:flex;flex-direction:column;gap:30px}
.sec{display:flex;flex-direction:column;gap:12px;padding-top:18px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0;padding-inline:2px}
.sec-h b{font-size:calc(20px * var(--fs));font-weight:900;color:var(--ink);letter-spacing:-.3px}
.sec-h span{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border-radius:14px;padding:18px 18px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:calc(22.2px * var(--fs));line-height:1.45;font-weight:700;color:var(--ink);letter-spacing:-.3px;text-wrap:pretty}
.meta{font-size:calc(13.5px * var(--fs));color:var(--muted);font-variant-numeric:tabular-nums}
.card p{margin:4px 0 0;font-size:calc(16px * var(--fs));line-height:1.78;color:var(--text)}
.src{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;min-height:46px;padding:0 14px;border-radius:10px;
  background:var(--accent-soft);text-decoration:none;font-weight:700;font-size:calc(15px * var(--fs));color:var(--accent)}
.src small{font-weight:400;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.src svg{flex:none;width:16px;height:16px}
.card:target{outline:2px solid var(--accent);outline-offset:2px}

.end{padding:28px 16px calc(40px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:13px;line-height:1.7;display:flex;flex-direction:column;align-items:center;gap:14px}
.top-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;height:40px;padding:0 18px;font-weight:500;cursor:pointer}

/* ---------- past-news sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,20,30,.45)}
.sheet{position:fixed;z-index:41;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:var(--surface);
  border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:80svh;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 8px;font-size:17px;color:var(--ink);padding-inline:4px}
.sheet ul{list-style:none;margin:0;padding:0}
.sheet li button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:0 6px;border:0;
  border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left;font-size:16px;color:var(--text)}
.sheet li button span{font-size:13.5px;color:var(--muted)}
.sheet li button.cur{color:var(--accent);font-weight:700}
.sheet li button em{font-style:normal;font-size:12px;font-weight:700;color:var(--surface);background:var(--mark);border-radius:10px;padding:1px 7px;margin-left:6px}
</style>
