<script>
const DATA = {"days":[{"date":"2026-10-07","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"국토위 국감 7일 막 오른다…86주 오른 집값·공급 실적 '도마'"},{"n":3,"text":"정부 규제 비웃는 고액 자산가들…원베일리 '100억대 매물' 수두룩"},{"n":8,"text":"재건축·재개발 조합 47곳서 700건 위법…수사의뢰 83% 급증"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"국토위 국감 7일 막 오른다…86주 오른 집값·공급 실적 '도마'","meta":"2026.10.06 05:05 · 뉴스1","body":"국회 국토교통위원회가 7일 국토교통부·행정중심복합도시건설청·새만금개발청을 대상으로 국정감사를 시작한다. 서울 아파트값은 9월 넷째 주까지 86주 연속 올라 문재인 정부 때의 최장 기록(85주)을 넘어섰고, 누적 상승률은 17.6%로 종전 기록의 두 배를 웃돈다. 올해 수도권 주택 착공 실적은 8월까지 연간 목표의 32.4%에 그쳐 공급 대책의 실행력이 핵심 쟁점으로 떠올랐다. 홍지선 국토부 장관 취임 후 첫 국감으로, 토지공개념제 정책 일관성과 LH 조직 분리 방안, 건설현장 안전 문제도 도마에 오를 전망이다.","url":"https://www.news1.kr/realestate/general/6308785"},{"n":2,"title":"집값 뛰고 공급은 숙제…홍지선 첫 국감, 주거 안정 해법은","meta":"2026.10.07 07:00 · 데일리안","body":"홍지선 국토교통부 장관이 취임 후 처음 맞는 국정감사에서 주택시장 안정 방안을 집중적으로 검증받는다. 서울 아파트값은 86주 연속 상승하며 문재인 정부 당시 최장 기록을 넘어섰고 누적 상승률은 17.6%에 달한다. 정부는 수도권에 150만가구를 공급하겠다고 밝혔지만 실제 공개된 신규 공공택지는 2만7000여가구에 그쳐 격차가 지적된다. 용산공원 활용 방안과 LH 조직 분리 등 공급 대책의 실행력이 이번 국감의 핵심 검증 대상이 될 전망이다.","url":"https://www.dailian.co.kr/news/view/1698331/%EC%A7%91%EA%B0%92-%EB%9B%B0%EA%B3%A0-%EA%B3%B5%EA%B8%89-%EC%88%99%EC%A0%9C%ED%99%8D%EC%A7%80%EC%84%A0-%EC%B2%AB-%EA%B5%AD%EA%B0%90-2026"}]},{"name":"시장동향","articles":[{"n":3,"title":"정부 규제 비웃는 고액 자산가들…원베일리 '100억대 매물' 수두룩","meta":"2026.10.06 10:40 · 뉴데일리","body":"서초구 반포동 래미안 원베일리에서 초고가 거래가 잇따르고 있다. 전용 116.95㎡(46평)는 지난달 94억원에 신고가를 기록했고, 50평대는 120억원에 거래되며 호가가 110억원대까지 올라섰다. 같은 단지, 같은 평형인데도 호가가 40억원 가까이 차이 나는 기현상이 나타나 절세용 급매와 신고가 거래가 동시에 섞여 있다는 분석이다. 업계에서는 현금 거래 비중이 높아 대출 규제나 세제 영향을 적게 받는 만큼 고가 거래가 계속될 것으로 내다봤다.","url":"https://biz.newdaily.co.kr/site/data/html/2026/10/06/2026100600091.html"},{"n":4,"title":"\"내년에 터진다\"…서울 전월세 대란 속 수도권 집값 동반 상승 우려","meta":"2026.10.06 06:01 · 파이낸셜뉴스","body":"부동산 전문가 김학렬 소장은 2027년 서울의 전·월세 부족 현상이 더 심화할 것으로 전망했다. 서울의 높은 주거비를 감당하기 어려운 수요가 경기·인천으로 옮겨가면서 두 지역의 매매·전세·월세 가격이 동반 상승할 가능성이 있다는 분석이다. 보유세 부담 증가가 월세 가격을 더 끌어올릴 수 있는 요인으로도 지목됐다. 그는 무주택자에게 GTX·신분당선 등 교통망이 양호한 경기·인천 지역을 중심으로 내 집 마련을 검토할 것을 제안했다.","url":"https://www.fnnews.com/news/202610060601263719"}]},{"name":"정비사업","articles":[{"n":8,"title":"재건축·재개발 조합 47곳서 700건 위법…수사의뢰 83% 급증","meta":"2026.10.06 10:00 · 핀포인트뉴스","body":"국토교통부 자료에 따르면 2022~2025년 합동점검을 받은 정비사업 조합 47곳에서 총 700건의 법령 위반이 적발됐다. 조합당 평균 15건꼴로, 위반 유형은 조합행정(225건)·예산회계(209건)·용역계약(176건) 순이었다. 수사의뢰 건수는 2022년 30건에서 2025년 55건으로 83.3% 늘었고, 4년간 누적 129건(전체의 18.4%)이 수사당국에 넘겨졌다. 실제 사례로는 일반경쟁입찰 미실시, 총회 미의결 계약 체결, 조합 자금의 개인 변호사비 지급 등이 확인됐다.","url":"https://www.pinpointnews.co.kr/news/articleView.html?idxno=492849"}]},{"name":"금융/세제","articles":[{"n":9,"title":"세제 개편에 공공주택·부동산 기관 종부세 600억원→843억원 '쑥'","meta":"2026.10.06 19:22 · 신아일보","body":"국민의힘 김정재 의원이 분석한 자료에 따르면 정부의 세제개편으로 공공주택·부동산 관련 기관의 종합부동산세 부담이 2025년 600억6500만원에서 2028년 843억3800만원으로 40.4% 늘어날 것으로 나타났다. 기관별로는 LH가 128억6000만원, SH가 70억1000만원, GH가 43억1000만원 늘어나는 것으로 분석됐다. 주택분 공정시장가액비율을 60%에서 80%로 올리고 세율 체계를 개편한 것이 부담 증가의 주요 요인으로 지목됐다. 공공기관들이 늘어난 세 부담을 임대료나 분양가에 전가할 수 있다는 우려도 제기된다.","url":"https://www.shinailbo.co.kr/news/articleView.html?idxno=5068968"},{"n":10,"title":"종부세 영향 분석 도마…이형일 \"부동산 세제개편 소통 강화할 것\"","meta":"2026.10.06 15:19 · 데일리안","body":"이형일 경제부총리는 국회 재정경제기획위원회 국정감사에서 종합부동산세 등 부동산 세제개편과 관련해 소통을 강화하겠다고 밝혔다. 야당 의원이 세제개편안이 비거주 1주택자에 미치는 영향 분석이 부족하다고 지적하자 \"계속 설명하면서 홍보와 소통 노력을 강화하겠다\"고 답했다. 이 부총리는 서울 아파트값이 86주 연속 상승한 점에 대해 \"무겁게 생각하고 있다\"고 말했다. 그는 주택 공급 확대에 정책 역량을 집중하겠다는 방침도 강조했다.","url":"https://www.dailian.co.kr/news/view/1698296/2026-%EA%B5%AD%EA%B0%90-%EC%A2%85%EB%B6%80%EC%84%B8-%EC%98%81%ED%96%A5-%EB%B6%84%EC%84%9D-%EB%8F%84%EB%A7%88-2026"}]},{"name":"임대주택","articles":[{"n":11,"title":"대학가 주택 '공공기숙사'로…LH, 서울대와 200가구 공급","meta":"2026.10.06 17:57 · 한국경제","body":"한국토지주택공사(LH)가 대학가 인근 주택을 전세로 확보해 저렴하게 제공하는 '기숙사형 전세임대' 사업을 확대한다. 서울대와의 협약에 따라 2030년까지 200가구를 공급하며, 전국 지자체·대학을 대상으로 500가구 규모의 공모도 함께 진행한다. 학생은 본인 부담금 100만원만 내면 나머지 전세보증금은 공공이 지원받는 방식이다. 서울대는 노후 기숙사 재건축 기간의 대체 주거로 이 사업을 활용하고 있으며, 이미 역세권 신축 주택 30가구에 청년 60명이 입주했다.","url":"https://www.hankyung.com/article/2026100662751"},{"n":12,"title":"\"청년주택 없다더니\"…LH 빈집 3.8만 가구","meta":"2026.10.06 17:56 · 한국경제","body":"더불어민주당 황희 의원이 공개한 LH 자료에 따르면 2021~2025년 1년 이상 빈집으로 인한 임대료 손실액이 1670억3200만원에 달했다. 손실액은 매년 증가 추세로 2024년 405억원, 지난해 398억원을 기록했다. 유형별로는 국민임대가 775억원으로 가장 많고 청년·신혼부부용 행복주택이 443억원으로 뒤를 이었다. 8월 기준 전체 공공임대주택 97만6949가구 중 6개월 이상 빈집은 3만8681가구(공가율 4%)이며, 이 중 58.1%가 1년 이상 장기 공가 상태인 것으로 나타났다.","url":"https://www.hankyung.com/article/2026100662801"}]},{"name":"택지/도시개발","articles":[{"n":14,"title":"최현덕 남양주시장, '발로 뛴 100일'…광역교통·자족도시 조성 '물꼬'","meta":"2026.10.06 09:04 · 아시아경제","body":"최현덕 남양주시장이 취임 100일을 맞아 광역교통망 확충과 자족도시 조성에서 성과를 냈다고 밝혔다. 별내선 연장사업이 예비타당성조사 대상으로 선정됐고, 국지도 86호선 구간도 일괄예타를 통과했다. 최 시장은 신규 공공택지에 교통·산업 기반을 함께 갖추는 자족도시를 구상한다고 밝혔으며, 16개 읍면동을 순회해 시민 822명으로부터 347건의 건의사항을 수렴했다. 공공의료원 건립과 지방재정 부담 개선 등도 정부에 건의했다.","url":"https://view.asiae.co.kr/article/2026100609042657113"},{"n":15,"title":"추미애, GTX D~H 등 경기 철도 40개 노선 국가계획 반영 요청","meta":"2026.10.06 09:08 · 글로벌이코노믹","body":"추미애 경기도지사가 홍지선 국토교통부 장관을 만나 GTX D·E·F·G·H를 포함한 경기도 철도사업 40건을 국가철도망 구축계획에 반영해 달라고 요청했다. KTX 파주 연장, SRT 의정부 연장 등도 건의 사항에 포함됐다. 추 지사는 신도시 개발 시 교통망을 먼저 구축하는 '선교통·후입주' 원칙 실현을 위해 교통시설 예비타당성조사 면제를 제안했다. 국가철도망 신규사업 규모를 100조원 이상으로 확대해 달라는 요청도 함께 전달했다.","url":"https://g-enews.com/article/General-News/2026/10/2026100608530359078fbfc802b3_1"}]},{"name":"주택품질/안전","articles":[{"n":16,"title":"한국 아파트가 무너지기 쉬운 이유... 충격적인 국토부 문서","meta":"2026.10.06 12:39 · 오마이뉴스","body":"한국건설기술연구원이 국토교통부 용역으로 작성한 보고서에 따르면 한국 아파트의 수명은 20년으로 영국(77년), 미국(55년), 일본(30년)보다 크게 짧다. 보고서는 양호한 천연 골재가 고갈되면서 저품질의 바다 모래, 수입 모래, 부순 모래 등이 무분별하게 쓰여 콘크리트 품질에 부정적 영향을 미치고 있다고 지적했다. 토분이 섞인 불량 골재 사용 비율은 2004년 9.9%에서 2013년 43.7%로 급증했고 2026년에는 62.5%에 이를 것으로 추정됐다. 저자는 이 문제가 광주 화정 아이파크 붕괴, 인천 검단 아파트 붕괴와도 관련이 있다고 지적했다.","url":"https://ohmynews.com/NWS_Web/Series/series_premium_pg.aspx?CNTN_CD=A0003272773"},{"n":17,"title":"처분엔 소송, 사고는 반복… 정일영, 포스코이앤씨 대표·장인화 회장 국감 증인 요구","meta":"2026.10.07 00:48 · S저널","body":"더불어민주당 정일영 의원이 포스코이앤씨 송치영 대표와 포스코홀딩스 장인화 회장을 국정감사 증인으로 요구했다. 핵심 쟁점은 신안산선 터널 붕괴 사고로, 국토부는 지난 4월 설계 오류와 시공·감리 부실을 원인으로 결론 내리고 최대 8개월 영업정지 처분 방침을 밝혔지만 6개월이 지나도록 최종 처분이 나오지 않고 있다. 포스코이앤씨는 안전관리 체계를 근본적으로 혁신하겠다고 약속했으나 최근 5년간 589명의 재해자와 10건의 중대재해가 발생했다. 인천 송도 15개 단지 전체에서 1년 이상 미처리된 하자도 확인됐다.","url":"https://www.s-journal.co.kr/news/articleView.html?idxno=44217"}]},{"name":"분양정보","articles":[{"n":18,"title":"공급 늘고 신청 줄고… 청약 경쟁률, 1년 새 '반토막'","meta":"2026.10.07 00:20 · 서울신문","body":"올해 아파트 일반공급 물량은 지난해보다 34% 늘었지만 1순위 청약 신청은 26.6% 줄었다. 평균 청약 경쟁률은 10.2대 1에서 5.6대 1로 반토막 났다. 분양가 상승과 대출 규제 부담이 주요 원인으로, 서울 민간아파트 분양가는 1년 새 34% 올랐다. 이에 따라 서울과 수도권 주요 입지로만 수요가 몰리는 '선별 청약' 현상이 뚜렷해졌고, 공공분양 경쟁률(19대 1)이 민간분양(4.4대 1)의 약 4.3배에 달할 정도로 양극화도 심해졌다.","url":"https://www.seoul.co.kr/news/economy/estate/2026/10/07/20261007032001"}]},{"name":"논설/사설","articles":[{"n":20,"title":"집값 오르는데 정부와 서울시는 왜 서로를 탓하나 [서순탁의 파이데이아]","meta":"2026.10.06 17:30 · 서울경제","body":"서순탁 경실련 공동대표·서울시립대 명예교수는 칼럼에서 주택 공급 부족 책임을 놓고 정부와 서울시가 벌이는 공방을 비판했다. 그는 \"누가 더 많은 물량을 발표했는가가 아니라 시민이 언제 어디서 감당할 수 있는 집에 살 수 있느냐가 핵심\"이라고 지적했다. 재건축 공급 확대가 반드시 주거비 부담 완화로 이어지지는 않는다며, 정부와 서울시가 실제 입주 시점과 순증 물량, 주택 가격대를 투명하게 공개해야 한다고 주장했다. 장기 사업 지연 기간 동안 시민의 전세·임차료 부담에 대한 즉각적인 대응도 필요하다고 덧붙였다.","url":"https://www.sedaily.com/article/20098646"}]}]},{"date":"2026-10-06","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"李정부 2년차 정책 검증대… 경제 국감 6일 개막"},{"n":5,"text":"서울 아파트값 86주 연속 상승…전문가들 \"연말까지 상승세 지속\""},{"n":7,"text":"불광5구역, 21년 만에 철거 시작…2406가구 '북한산 자이' 들어선다"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"李정부 2년차 정책 검증대… 경제 국감 6일 개막","meta":"2026.10.05 19:02 · 파이낸셜뉴스","body":"국회가 6일 재정경제기획위원회의 기획재정부 국정감사를 시작으로 이재명 정부 2년차 경제정책 검증에 들어간다. 재경부 국감에서는 비거주 1주택자 기본공제를 12억원에서 9억원으로 낮추려던 계획과 종합부동산세 부담 상한을 150%에서 200%로 올리려던 계획이 여론 반발로 철회된 경위가 쟁점이 될 전망이다. 7일 국토교통부 국감에서는 서울 아파트값이 86주 연속 올라 문재인 정부 당시 최장 기록(85주)을 넘어섰고 누적 상승률도 17.6%로 그 두 배를 웃도는 점, 용산공원 내 주택 공급을 둘러싼 국토부와 서울시의 갈등이 집중 추궁될 예정이다. 8일 기획예산처 국감에서는 162조3000억원 규모 미래대응기금과 56조2000억원의 세수 재추계 오차도 다뤄진다.","url":"https://www.fnnews.com/news/202610051901312958"},{"n":2,"title":"李대통령 \"집 못 지어 미친 것처럼 대량공급…집값 반드시 안정\"","meta":"2026.10.05 16:53 · 머니투데이","body":"이재명 대통령은 5일 사회관계망서비스(SNS)를 통해 홍지선 신임 국토교통부 장관과 한국토지주택공사(LH)에 주택 조기 대량공급을 지시했다고 밝혔다. 그는 \"집을 못 지어 미친 것처럼 국가 명운을 걸고 조기 대량 공급에 매진하라\"고 주문했다며, 서울·수도권 주택 건설이 공급 확대와 건설경기 활성화라는 이중 효과를 낸다고 강조했다. 최근 주택 인허가가 전년 동기 대비 약 50% 늘었다고 전했고, 미분양 주택은 LH가 매입해 임대로 활용하도록 지시했다. 세제 정상화와 지방 이전 등을 통해서도 집값을 안정시키겠다는 방침을 덧붙였다.","url":"https://www.mt.co.kr/politics/2026/10/05/2026100516302712871"}]},{"name":"시장동향","articles":[{"n":5,"title":"서울 아파트값 86주 연속 상승…전문가들 \"연말까지 상승세 지속\"","meta":"2026.10.05 06:00 · 파이낸셜뉴스","body":"서울 아파트값이 86주 연속 올라 역대 최장 상승 기록을 세운 가운데, 집값 전문가 5인 모두 연말까지 상승세가 이어질 것으로 전망했다. 신규 공급 부족과 전세난이 상승을 이끄는 주요 요인으로 지목됐으며, 강남권은 하락세를 이어가는 반면 외곽·비강남 중저가 단지가 상승을 주도하는 양극화가 뚜렷하다. 기준금리가 인상될 경우의 영향에 대해서는 전문가 의견이 엇갈렸다. 정부의 종합부동산세·양도소득세 강화를 포함한 세제개편안도 향후 시장의 변수로 꼽힌다.","url":"https://www.fnnews.com/news/202610050600271408"},{"n":6,"title":"분당 노후계획도시 특별정비구역 선정에 호가 3억원씩 '껑충'","meta":"2026.10.04 09:00 · 비즈워치","body":"성남시가 지난달 29일 분당 노후계획도시 특별정비구역으로 이매촌1·시범단지1·파크타운·푸른마을·한솔마을2 등 5개 구역, 총 1만3429가구를 선정하자 해당 단지들의 호가가 일제히 뛰었다. 시범단지1(한양)은 최근 실거래가 21억7000만원에서 호가 24억원대로, 파크타운은 21억8000만원에서 24억7000만원으로 올랐다. 푸른마을은 19억4500만원에서 22억원으로, 이매1은 17억7000만원에서 19억8000만~21억5000만원으로 호가가 상승했다. 전문가들은 입지와 대지지분, 분담금을 종합적으로 따져 판단할 것을 조언했다.","url":"https://news.bizwatch.co.kr/article/real_estate/2026/10/02/0012"}]},{"name":"정비사업","articles":[{"n":7,"title":"불광5구역, 21년 만에 철거 시작…2406가구 '북한산 자이' 들어선다","meta":"2026.10.06 08:47 · 머니투데이","body":"서울 은평구 불광5구역 주택재개발정비사업조합이 2005년 조합설립추진위원회 구성 이후 21년 만에 철거에 들어갔다. 지난해 9월 시작된 이주가 끝나 지난 2일 철거 착공식을 열었으며, 시공사인 GS건설이 2406가구 규모의 '북한산 자이 더 프레스티지'를 짓는다. 조합은 2027년 7월까지 철거를 마치고 같은 해 10월 본공사에 착공해 2030년 준공할 계획이다.","url":"https://www.mt.co.kr/estate/2026/10/06/2026100608424553371"},{"n":8,"title":"30조 목동 재건축 '단독 입찰' 행진…4·7단지서 경쟁 성사될까","meta":"2026.10.06 04:00 · 머니투데이","body":"서울 양천구 목동 신시가지 14개 단지 재건축 사업에서 대형 건설사의 단독입찰이 잇따르고 있다. 목동7단지는 다음달 중순 시공사 입찰공고를 낼 예정으로 삼성물산·현대건설·롯데건설이 관심을 보이고 있고, 목동4단지는 현대건설·포스코이앤씨·에이치디현대산업개발·제일건설 4개사가 현장설명회에 참석해 3.3㎡당 공사비 1010만원으로 목동 사업지 중 처음 1000만원을 넘겼다. 반면 목동8단지는 2차 입찰에서 대우건설만 참여해 단독입찰에 그쳤다. 현재까지 6단지(DL이앤씨), 10단지(현대건설), 13단지(삼성물산), 12단지(GS건설)가 시공사 선정을 마쳤거나 마무리 단계다.","url":"https://www.mt.co.kr/estate/2026/10/06/2026100519544973304"}]},{"name":"금융/세제","articles":[{"n":10,"title":"HUG, 30일부터 '전세보증 사전한도심사' 도입…잔금 전 가입여부 확인","meta":"2026.10.04 17:58 · 파이낸셜뉴스","body":"주택도시보증공사(HUG)는 10월 30일부터 전세보증 사전한도심사 제도를 도입한다고 밝혔다. 기존에는 임차인이 이사와 잔금 지급을 마친 뒤에야 보증심사를 받을 수 있었지만, 새 제도는 이사 전에 주택가격과 임대인의 보증보험 가입금지 여부 등을 미리 심사받을 수 있도록 한다. HUG는 보증 3사(HUG·HF·SGI서울보증) 통합 시스템도 구축해, 한 기관에서 전세보증금을 반환하지 못한 악성 임대인의 정보를 다른 기관도 공유해 보증 가입을 제한하는 체계를 강화했다.","url":"https://www.fnnews.com/news/202610041758090827"},{"n":11,"title":"은행마다 다른 '주담대 문턱'…같은 집인데 대출한도 수천만원 차이","meta":"2026.10.05 18:24 · 한국경제","body":"금융당국이 가계대출 규제를 일부 완화하면서 은행별로 주택담보대출 제한 수준이 달라지고 있다. SC제일은행은 10월 1일부터 주담대 전체에 모기지신용보험(MCI) 가입을 허용한 반면, KB국민·신한·하나·우리은행은 여전히 모기지신용보험(MCI)·모기지신용보증(MCG) 가입을 제한하고 있다. 같은 소득으로 같은 집을 사더라도 어느 금융회사에서 어떤 상품으로 빌리는지에 따라 한도가 수천만원씩 갈릴 수 있다는 지적이 나온다. 실제로 서울 아파트 기준으로 은행을 바꾸는 것만으로 5000만원 이상 추가 대출이 가능한 경우도 있는 것으로 나타났다.","url":"https://www.hankyung.com/article/2026100537041"}]},{"name":"임대주택","articles":[{"n":12,"title":"李대통령 \"초과세수로 청년·중산층용 공공임대 조기 대량공급\"","meta":"2026.10.05 18:47 · 파이낸셜뉴스","body":"이재명 대통령은 5일 초과세수를 활용해 청년과 중산층을 겨냥한 공공장기임대주택을 조기에 대량공급하겠다고 밝혔다. 그는 2022~2025년 서울 중심의 인허가 급감으로 주택 공급물량이 줄어든 것이 단기적인 집값 불안의 가장 큰 원인이라고 지적했다. 실제로 강남·서초·송파구의 아파트 매물은 1년 새 1만62건 늘어 1만7528건에서 2만7590건으로 증가했다. 이 대통령은 수도권 집중 완화와 가계대출 조정, 세제개혁도 함께 추진하겠다는 방침을 재확인했다.","url":"https://www.fnnews.com/news/202610051846282854"},{"n":13,"title":"국토부 \"연말까지 수도권 공공주택 6만2000호 착공 총력\"","meta":"2026.10.02 16:31 · 파이낸셜뉴스","body":"김이탁 국토교통부 1차관은 2일 한국토지주택공사(LH) 등 4대 공사와 제3차 공공주택 공급점검 태스크포스(TF) 회의를 열고 연말까지 수도권 공공주택 6만2000호 착공 목표 달성에 총력을 기울이겠다고 밝혔다. 올해 3분기까지의 착공 실적은 1만7000호로 잠정 집계됐으며, 국토부는 4분기에 신축매입·민간정비 등을 포함해 공공주택 4만5000호 이상을 추가로 착공시켜 연말까지 6만호 이상 달성이 가능할 것으로 내다봤다. 내년도 착공 목표는 약 8만4000호로 제시됐다.","url":"https://www.fnnews.com/news/202610021626299741"}]},{"name":"택지/도시개발","articles":[{"n":14,"title":"인천 계양신도시, 박촌·동양 기존 생활권과 '길 하나 사이'로 공존","meta":"2026.10.05 18:16 · 파이낸셜뉴스","body":"3기 신도시인 인천 계양신도시가 박촌역을 중심으로 기존 박촌동·동양동과 길 하나를 사이에 두고 조성되고 있다. 12월 입주 예정인 A2·A3블록(1285가구)은 기존 생활권의 학교·학원·병원 등 인프라를 함께 쓸 수 있다는 것이 특징으로 꼽힌다. 교통 측면에서는 인천도시철도 1호선과 공항철도를 이용할 수 있고, 7701번 버스 신설과 광역급행버스(M버스) 노선 신설도 추진되고 있다. 반도건설은 AC3·AC4블록에 민간분양 단지 '계양신도시 카이브 유보라'(총 1110가구)를 이달 중 분양할 예정이다.","url":"https://www.fnnews.com/news/202610051815188496"},{"n":15,"title":"도심복합사업 후보지 발표 후 방배·효창공원 일대 호가 '들썩'","meta":"2026.10.03 05:02 · 파이낸셜뉴스","body":"국토교통부가 지난달 30일 발표한 도심 공공주택 복합사업 신규 후보지 11곳 중 서초구 방배동과 용산구 효창공원앞역 일대 부동산 시장이 들썩이고 있다. 현지 중개업소에 따르면 방배동의 한 투룸 빌라는 기존 16억원이던 호가가 후보지 발표 직후 20억원으로 4억원 뛰기도 했다. 효창공원앞역 북측에는 약 4040가구, 방배동 이수역 동측에는 918가구 공급이 예정돼 있으며, 정부는 내년 상반기 예정지구 지정을 거쳐 2030년 하반기 착공을 목표로 하고 있다.","url":"https://www.fnnews.com/news/202610030501530544"}]},{"name":"주택품질/안전","articles":[{"n":16,"title":"경남 하동 토목공사 현장서 굴착기 버킷에 맞아 70대 사망","meta":"2026.10.02 22:45 · 파이낸셜뉴스","body":"지난 2일 낮 1시 50분쯤 경남 하동군 하동읍의 철근·콘크리트 전문건설업체 '대국'의 토목공사 현장에서 70대 남성 A씨가 이탈한 굴착기 버킷에 머리를 부딪혀 숨졌다. 당시 현장에서는 굴착기로 철근을 인양하는 작업이 진행 중이었는데, 굴착기 앞에 장착된 버킷이 갑자기 떨어져 나오면서 A씨를 덮친 것으로 파악됐다. A씨는 사고 직후 심정지 상태로 병원에 이송됐으나 끝내 사망했다. 고용노동부 진주지청과 경찰은 작업중지 명령을 내리고 산업안전보건법·중대재해처벌법 위반 여부를 조사하고 있다.","url":"https://fnnews.com/news/202610022241196153"}]},{"name":"분양정보","articles":[{"n":17,"title":"대우건설, 청라국제업무단지에 '청라 아크원 푸르지오' 10월 분양","meta":"2026.10.02 11:13 · 한국경제","body":"대우건설은 인천 청라국제업무단지 내에 아파트 868가구와 주거형 오피스텔 987실 등 총 6개 동 규모의 '청라 아크원 푸르지오'를 10월 분양한다고 밝혔다. 주택형은 전용면적 84㎡가 620가구(71.4%)로 가장 많고, 나머지는 전용 103㎡로 구성된다. 입주는 2031년 예정이다.","url":"https://www.hankyung.com/article/202610029842i"}]},{"name":"논설/사설","articles":[{"n":19,"title":"[사설] 서울 집값 86주 연속 상승…규제보다 공급 확대를","meta":"2026.10.02 04:00 · 머니투데이","body":"머니투데이는 2일자 사설에서 서울 아파트값이 86주 연속 올라 역대 최장 기록을 세운 현상을 두고 \"청년·신혼부부 등 서민들의 주거비 부담이 커지고 있다\"고 짚었다. 사설은 강남3구가 하락세로 돌아선 가운데도 외곽 지역 집값이 급등하는 것은 공급 부족이 근본 원인이라고 진단했다. 이어 \"공급을 맡은 기관의 수장이 대출 규제로 집값을 잡자고 한 것은 난센스\"라고 비판하며, 대출규제 합리화와 재건축 규제 완화를 통한 공급 확대가 필요하다고 주장했다.","url":"https://www.mt.co.kr/opinion/2026/10/02/2026100117054574542"}]}]},{"date":"2026-10-02","count":15,"pdf_count":15,"highlights":[{"n":1,"text":"LH 사장 \"대출규제 더 강화해야\" 발언에 국토부 내부 '불편한 기류'"},{"n":4,"text":"강남 아파트값 조정 속 10억 이하 외곽 단지는 강세"},{"n":8,"text":"GS건설, 목동12단지 재건축 우선협상대상자로 선정"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"LH 사장 \"대출규제 더 강화해야\" 발언에 국토부 내부 '불편한 기류'","meta":"2026.10.01 12:00 · 머니투데이","body":"이성훈 LH 사장은 지난달 30일 용인 기자간담회에서 주택 공급에는 시차가 불가피하다며 지금은 대출규제를 더 강화해야 할 시점이라고 말했다. 그는 15억원 이하 주택에 적용되는 최대 6억원 대출 규제로는 부족하다고 지적하고, 생애최초 구매자에게 적용되는 주택담보대출비율(LTV) 70% 인정 제도가 경쟁적 매수를 부추길 수 있다고 우려했다. 이에 대해 국토교통부 내부에서는 주택공급 실행기관의 수장이 대출규제라는 정책 영역을 언급한 것이 부적절하다는 반응이 나왔다. 일부 관계자는 이 사장이 여전히 과거 청와대 국토교통비서관 시절의 역할 의식을 갖고 있는 것 같다고 비판한 것으로 전해졌다.","url":"https://mt.co.kr/estate/2026/10/01/2026093016114543578"},{"n":2,"title":"LH 조직개편안, 국감·노조 반발에 연내 발표 불투명","meta":"2026.10.01 14:21 · 뉴스핌","body":"정부가 한국토지주택공사(LH)를 개발 부문과 주거복지 부문으로 분리하는 조직 개편을 추진하고 있으나, 10월 국정감사와 노조의 반발로 연내 세부안 발표가 어려워질 전망이다. LH 노조는 충분한 협의 없이 조직 분리를 강행할 경우 총파업을 포함한 대응에 나서겠다는 입장을 밝혔다. 진주 본사 건물의 분할 사용 방안도 현실적으로 정리되지 않은 상태이며, 조직·인력 배분과 재무구조, 직원 처우 등 세부 쟁점을 정리하는 데에도 상당한 시간이 필요한 것으로 알려졌다. 2021년에도 LH 조직 분리 논의가 결론을 내지 못한 전례가 있어 이번 논의 역시 내년으로 넘어가거나 장기화할 가능성이 제기된다.","url":"https://www.newspim.com/news/view/20261001000824"},{"n":3,"title":"정부, 10월부터 2주마다 주택공급 진행상황 공개 브리핑","meta":"2026.10.01 14:36 · 아시아타임즈","body":"정부가 주택공급의 예측 가능성을 높이기 위해 10월 16일부터 2주 간격으로 차관급 이상이 참석하는 정례 브리핑을 실시하기로 했다. 국토교통부와 한국토지주택공사(LH)는 사업별 착공·분양·입주 현황을 한눈에 볼 수 있는 디지털 상황판을 구축하고, 금융·인허가 문제를 한곳에서 상담·지원할 수 있는 통합지원센터도 운영할 계획이다. 한성숙 국무총리는 사업별로 어디까지 진행됐는지 구체적으로 알려 예측 가능성을 높이는 것이 중요하다고 강조했다. 정부는 이번 조치가 정책 발표에 그치지 않고 실제 착공부터 입주까지 이어지는 실질적 공급 실적을 국민에게 보여주기 위한 것이라고 설명했다.","url":"https://www.asiatime.co.kr/article/20261001500313"}]},{"name":"시장동향","articles":[{"n":4,"title":"강남 아파트값 조정 속 10억 이하 외곽 단지는 강세","meta":"2026.10.01 04:00 · 머니투데이","body":"서울 강남·서초 등 고가 주택 밀집 지역은 조정 국면에 접어들어 9월 강남구 아파트값이 0.30% 내렸고 거래도 급매물 위주로 이뤄지고 있다. 반면 노원·중랑 등 상대적으로 저가인 10억원 이하 단지가 몰린 지역에서는 서울 평균(1.13%)을 크게 웃도는 상승률이 나타났으며, 중랑구 신내동의 한 아파트는 두 달 사이 1억원 이상 올랐다. 경기 남부에서도 반도체 산업단지 인근인 수원 영통구(4.30%), 안양 동안구(2.75%) 등이 월간 최고 상승률을 기록했다. 전문가들은 매수층이 가격 부담이 낮은 지역으로 이동하면서 향후 상승 동력이 10억원 이하 구간으로 옮겨갈 가능성을 제기했다.","url":"https://www.mt.co.kr/estate/2026/10/01/2026093019373040844"},{"n":5,"title":"건정연 \"4분기도 서울 매매·전세 동반 강세 이어질 것\"","meta":"2026.10.01 00:49 · 서울신문","body":"대한건설정책연구원(건정연)은 올해 4분기에도 서울·수도권 주택시장에서 매매와 전세가 함께 상승세를 이어갈 것으로 내다봤다. 주택 착공 실적이 2024년 30만3433건에서 지난해 27만2685건으로 줄어든 데다, 서울의 전세수급지수가 지난 7월 127.5로 약 5년 만에 최고치를 기록하는 등 공급 부족과 전세난이 겹치고 있다고 분석했다. 올해 서울 아파트 매매가격지수는 5.3% 상승한 반면 지방은 0.1% 상승에 그쳐 가격 양극화도 뚜렷하다고 설명했다. 건정연은 지난 8월 정부의 수도권 공급 확대 대책이 착공과 입주 사이의 시차로 단기적인 가격 안정 효과는 제한적이라고 평가하면서도, 반도체 메가프로젝트와 3기 신도시 추진으로 내년 후반부터는 본격적인 회복이 가능할 것으로 전망했다.","url":"https://www.seoul.co.kr/news/economy/estate/2026/10/01/20261001030001"},{"n":6,"title":"서울 아파트값 86주 연속 상승 역대 최장…강남3구·용산은 하락 전환","meta":"2026.10.02 · 서울신문","body":"한국부동산원 집계 결과 서울 아파트 매매가격이 9월 28일 기준 86주 연속 올라 2020년 6월~2022년 1월의 85주 기록을 넘어 역대 최장 상승 기록을 세웠다. 다만 직전 주 대비 상승률은 0.09%로 5주 연속 둔화하며 상승 폭 자체는 줄어드는 모습을 보였다. 강남구는 0.56% 내려 2019년 1월 이후 최대 낙폭을 기록했고 서초구는 8주, 송파구는 4주 연속 하락했으며, 22주 만에 하락 전환한 용산구(-0.01%)도 가세했다. 전문가들은 세제 개편으로 고가 주택의 보유세 부담이 커지면서 나타난 현상으로, 고가 지역의 약세가 확산하는 한편 매물이 부족한 중저가·실수요 지역은 강세를 유지할 가능성이 크다고 내다봤다.","url":"https://www.seoul.co.kr/news/economy/estate/2026/10/02/20261002032001"},{"n":7,"title":"중대형 아파트 거래 비중·가격 상승률 모두 '국민평형' 앞질러","meta":"2026.10.02 08:33 · 한국경제","body":"전용면적 85㎡를 초과하는 중대형 아파트의 거래 비중이 지난해 11.62%에 이어 올해 1~7월에도 11.28%를 유지하며 최근 5년 중 가장 높은 수준을 나타냈다. 중대형 아파트 가격은 전년 대비 8.49% 올라 전국 평균 상승률(2.71%)의 약 3.1배에 달했으며, 전용 60㎡ 이하(0.95%)나 60~85㎡(1.24%)와 비교하면 각각 8.9배, 6.8배 높은 상승률이다. 올해 중대형 아파트 공급은 1만9780가구로 2000년 이후 두 번째로 적은 물량에 그쳤다. 업계에서는 다주택 보유에 따른 금융·세제 부담이 커지면서 장기 거주할 주택 한 채를 신중히 고르려는 수요가 중대형 선호로 이어졌다는 분석이 나온다.","url":"https://www.hankyung.com/article/2026100292266"}]},{"name":"정비사업","articles":[{"n":8,"title":"GS건설, 목동12단지 재건축 우선협상대상자로 선정","meta":"2026.10.01 20:40 · 데일리안","body":"GS건설이 서울 양천구 목동12단지 재건축정비사업의 우선협상대상자로 지정돼 총회 결과에 따라 시공사로 최종 선정될 예정이다. GS건설은 단지명으로 '리플리제 자이'를 제안했으며, 사업 부지는 12만7339㎡로 지하 4층~지상 최고 43층 22개 동 2810가구 규모이고 공사비는 약 1조7888억원이다. 설계에는 건축 겐슬러, 조경 EDSA, 구조안전 Arup 등 해외 협력사가 참여한다. 이번 수주가 확정되면 GS건설의 올해 도시정비사업 누적 수주액은 7조원을 넘어설 것으로 예상된다.","url":"https://www.dailian.co.kr/news/view/1697118/GS%EA%B1%B4%EC%84%A4-%EB%AA%A9%EB%8F%9912%EB%8B%A8%EC%A7%80-%EC%9A%B0%ED%98%91-%EC%84%A0%EC%A0%95%E2%80%98%EB%A6%AC%ED%94%8C-2026"}]},{"name":"금융/세제","articles":[{"n":9,"title":"가계대출 절반 이상 금리 4.5% 넘어…예금금리는 오히려 하락","meta":"2026.10.02 08:00 · 비즈워치","body":"한국은행 집계에 따르면 8월 신규 가계대출의 53.6%가 금리 4.5% 이상으로 나타나 1년 전(10.9%)보다 5배 가까이 늘었다. 8월 가계대출 평균 금리는 4.76%로 전월 대비 0.12%포인트 올랐으며, 주택담보대출은 0.18%포인트, 신용대출은 0.36%포인트 각각 상승했다. 반면 8월 1년 만기 정기예금 금리는 3.39%로 7월(3.48%)보다 0.09%포인트 내려 4% 이상 금리 상품 비중은 0.5%에 그쳤다. 이에 따라 5대 은행의 가계 예대금리차가 더 벌어졌으며, 기준금리 반영 속도와 금리 산정 방식의 차이가 원인으로 분석된다.","url":"https://news.bizwatch.co.kr/article/finance/2026/10/01/0035"},{"n":10,"title":"서울 아파트 증여 8월에만 1036건…1년 새 두 배 이상 급증","meta":"2026.10.02 07:22 · 데일리안","body":"한국부동산원 집계 결과 지난 8월 서울 아파트 증여 거래는 1036건으로 전년 동월보다 126.7% 늘었으며, 올해 1~8월 누적으로도 5393건으로 전년 동기 대비 23.2% 증가했다. 노원구는 8월 130건으로 전년 동월 대비 441.7% 급증했고 서초구도 182.8% 늘었지만, 강남구와 송파구는 오히려 감소세를 보여 지역별 편차가 컸다. 전문가들은 대출 규제와 보유세·양도세·상속세 부담이 커진 상황에서 집값이 더 오를 것이라는 기대가 맞물려 다주택자들이 매각 대신 자녀에게 자산을 이전하는 쪽을 택하고 있다고 분석했다. 매매 시장이 주춤한 사이 증여를 통한 자산 이전이 늘어나는 흐름이 뚜렷해지고 있다.","url":"https://www.dailian.co.kr/news/view/1696908/%EB%A7%A4%EB%A7%A4-%EC%A3%BC%EC%B6%A4%EB%AC%BC%EB%A0%A4%EC%A3%BC%EA%B8%B0%EB%8A%94-%EA%B8%89%EC%A6%9D%EC%84%9C%EC%9A%B8-%EC%95%84%ED%8C%8C%ED%8A%B8-2026"}]},{"name":"임대주택","articles":[{"n":11,"title":"청년·중산층도 20년 장기임대…공공주택 패러다임 바뀐다","meta":"2026.10.01 17:07 · 파이낸셜뉴스","body":"국토교통부는 2030년까지 공공주택 119만가구를 공급하며 이 중 77%인 92만가구를 수도권에 배정하기로 했고, 서울시는 2031년까지 13만호를 추가 공급하면서 청년 대상 주택을 7만4000호까지 늘리기로 했다. 청년과 중산층까지 최장 20년 거주할 수 있도록 설계된 '보편형 임대'는 2030년까지 19만가구가 공급되며, 신축 임대는 중형 평형 비중을 늘리고 1인 가구용 발코니 확장형 평면을 도입해 실사용 면적을 넓힌다. 결혼에 따른 불이익을 줄이기 위해 신혼부부 소득 기준을 기존의 1.6배에서 2배로 높이고 결혼 후 재계약도 한 차례 허용하기로 했다. 청년 월세 지원 소득 기준은 월 154만원 이하에서 274만원 이하로 완화되고 지원 대상 연령 하한은 18세로 낮아지며, 보증금 분할납부제와 지분적립형·수익공유형 주택 등 새로운 제도도 함께 도입된다.","url":"https://fnnews.com/news/202610011707206443"}]},{"name":"택지/도시개발","articles":[{"n":12,"title":"LH 사장 \"향후 3년 신도시에서만 10만호 분양\"","meta":"2026.10.01 18:25 · 파이낸셜뉴스","body":"이성훈 LH 사장은 향후 3년간 신도시에서만 약 10만호가 분양되며 2028년에는 신도시에서만 3만호 이상이 공급될 것이라고 밝혔다. 정책 방향은 당분간 분양 물량 공급에 집중하고 보편형 임대는 이후 단계에서 본격화하는 방식으로, 그는 \"분양 물량이 먼저 많이 나오고 보편형 임대는 그 이후에 본격화될 것\"이라고 설명했다. 국토교통부의 '주거안정플랜'에 따르면 2030년까지 119만가구가 공급되며 이 중 공공분양은 24만가구, 나머지는 임대로 채워진다. LH 사장은 앞으로 2~3년간 예정된 분양 물량이 차질 없이 공급될 것이라고 강조했다.","url":"https://fnnews.com/news/202610011824351365"},{"n":13,"title":"서울시, 주거중심형 민간도심복합개발 도입 추진…구의동 등 후보지 주목","meta":"2026.10.01 15:47 · 뉴스핌","body":"민간이 주도하는 '민간도심복합개발(민도복)'은 기존 도심공공주택복합사업을 민간 주도 방식으로 확장한 정비 모델로, 토지등소유자 3분의 2 이상의 동의만 있으면 추진할 수 있어 진입 장벽이 낮다. 이 가운데 주거중심형은 간선도로에 인접한 노후 주거지의 주거환경 개선을 목표로 최대 700%의 용적률 인센티브를 받아 대규모 주택 공급이 가능하다. 광진구 구의동 70번지 일대는 아차산역 인근 주거중심형 후보지로, 최고 49층 1550가구 규모의 아파트 건설이 검토되고 있다. 관련 연합회에 가입한 사업지만 서울 30곳에 달하며 잠실·서초·석관동 등 주요 거점에서도 사업 추진 움직임이 나타나고 있다.","url":"https://newspim.com/news/view/20261001000993"}]},{"name":"주택품질/안전","articles":[{"n":14,"title":"경기도, 제11기 공동주택품질점검단 130명 출범…부실시공 예방 강화","meta":"2026.10.01 14:25 · 아주경제","body":"경기도가 신축 아파트의 부실시공을 예방하기 위해 건축·구조·조경·전기·기계·소방 등 12개 분야 민간 전문가 130명으로 구성된 제11기 공동주택품질점검단을 출범했다. 기존 84명에 46명을 새로 더했으며 특히 구조 분야 전문가는 7명에서 10명으로 확대했고, 임기는 2028년 9월까지 2년이다. 점검단은 골조공사 중과 골조 완료, 사용검사 전, 준공 이후 사후점검까지 4단계에 걸쳐 법정 기준보다 촘촘한 품질관리를 실시한다. 점검 대상도 공동주택 30세대 이상, 도시형생활주택 50세대 이상, 100세대 이상 주상복합 등으로 넓어졌다.","url":"https://www.ajunews.com/view/20261001141928478"}]},{"name":"분양정보","articles":[{"n":15,"title":"서울 집값 부담에 탈서울 수요 유입…광명 시티프라디움 에듀하임 1순위 청약","meta":"2026.10.01 13:27 · 파이낸셜뉴스","body":"경기 광명 구름산지구에 들어서는 '광명 시티프라디움 에듀하임'이 1일 1순위(기타지역) 청약을 접수했으며 2일 2순위 접수, 12일 당첨자 발표, 24~26일 정당계약 순으로 일정이 진행된다. 단지는 지하 2층~지상 22층 6개 동 426가구 규모로, 향후 구름산지구에 계획된 총 930세대 규모 시티프라디움 단지의 1차 공급 물량이다. 앞서 분양한 인근 철산역 자이가 38대 1의 경쟁률을 기록하는 등 광명 지역은 서울 거주 수요자의 유입이 두드러지며, 기타지역 청약자 수가 해당지역 대비 10배 이상 많게 나타났다. 입주는 2029년 상반기로 예정돼 있다.","url":"https://www.fnnews.com/news/202610011051417409"}]}]},{"date":"2026-10-01","count":13,"pdf_count":13,"highlights":[{"n":1,"text":"홍지선 국토부 장관·오세훈 서울시장, 첫 만남서 주택공급 협력 논의"},{"n":2,"text":"서울 아파트값 역대 최장 상승 기록 목전…정부는 '공급'으로 대응"},{"n":4,"text":"서울 재개발·재건축 65개 구역 한자리에…\"제도의 벽 허문다\""}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"홍지선 국토부 장관·오세훈 서울시장, 첫 만남서 주택공급 협력 논의","meta":"2026.09.30 18:02 · 한국경제","body":"홍지선 국토교통부 장관과 오세훈 서울시장이 9월 30일 '집코노미 박람회 2026' 현장에서 취임 후 처음 만나 주택공급 확대를 위한 협의체 구성에 뜻을 모았다. 두 사람은 용산 개발, 그린벨트 규제 완화, 수도권 광역급행철도(GTX) 등 교통망 확충을 주요 논의 과제로 꼽았다. 홍 장관은 \"할 수 있는 것부터 신속하게 처리하자\"고 말했고, 오 시장은 용산·세운지구·탄천 개발 등 현안을 제시했다. 양측은 법제 지원과 인허가 절차 간소화 등 각 기관의 권한을 활용해 공급 속도를 높이기로 했다.","url":"https://www.hankyung.com/article/2026093057141"}]},{"name":"시장동향","articles":[{"n":2,"title":"서울 아파트값 역대 최장 상승 기록 목전…정부는 '공급'으로 대응","meta":"2026.09.30 15:15 · 국민일보","body":"서울 아파트값이 85주 연속 상승을 기록해 문재인 정부 시기의 역대 최장 기록과 같아졌으며, 다음 통계에서 86주로 늘면 신기록을 세울 것으로 전망된다. 현 정부 출범 이후 누적 상승률은 15.2%에 달해 과거보다 가파른 속도라는 평가가 나온다. 올해 1~8월 전세가격지수도 5.91% 올라 2011년 이후 15년 만에 가장 높은 상승률을 보였다. 정부는 공급 확대 대책을 준비 중이지만 추가 규제 카드는 마땅치 않고, 공급 효과도 단기간에 나타나기 어렵다는 평가가 나온다.","url":"https://www.kmib.co.kr/article/view.asp?arcid=9000018607"},{"n":3,"title":"\"규제 피할 길은 경매·비아파트\"…부동산 박람회 투자강연에 인파","meta":"2026.09.30 17:51 · 한국경제","body":"'집코노미 박람회 2026' 부대 강연에서 부동산 투자 전문가들이 대출·실거주 규제를 피할 수 있는 경매와 비아파트 투자 전략을 소개해 많은 관람객이 몰렸다. 경매로 낙찰받은 아파트는 서울에서도 실거주 의무가 부과되지 않고 세입자의 전세금을 낀 투자가 가능하다는 설명이 나왔다. 올해 연간 경매 물건은 약 13만 건으로 예상돼 시세보다 낮은 가격에 매입할 가능성이 있다는 점도 소개됐다. 다만 강연에서는 다주택자 취득세 중과와 서울 지역 대출 한도 제한 등을 사전에 점검해야 한다는 점도 함께 안내됐다.","url":"https://www.hankyung.com/article/2026093056601"}]},{"name":"정비사업","articles":[{"n":4,"title":"서울 재개발·재건축 65개 구역 한자리에…\"제도의 벽 허문다\"","meta":"2026.09.30 14:42 · 디벨로퍼뉴스","body":"서울 재정비촉진사업 관련 단체가 9월 30일 서울 백범김구기념관에서 세미나를 열어 시내 65개 재개발·재건축 구역 조합 관계자 약 400명이 참석했다. 서울시 관계자들도 참석해 용적률 인센티브 등 규제 개선을 통한 민간 정비사업 수익성 개선 방안을 설명했다. 주최 측은 개별 조합이 넘기 어려운 제도적 장벽이 분명히 존재한다며 공동 대응의 필요성을 강조했다. 이번 세미나는 정비사업 현장의 공통 애로를 모아 제도 개선을 건의하는 자리로 마련됐다.","url":"https://dpnews.co.kr/news/articleView.html?idxno=2509"}]},{"name":"금융/세제","articles":[{"n":5,"title":"가계대출 금리 넉 달째 상승…주담대·신용대출 모두 올라","meta":"2026.09.30 12:00 · 데일리안","body":"한국은행 집계에 따르면 8월 은행권 가계대출 평균 금리는 연 4.76%로 전월보다 0.12%포인트 올라 4개월 연속 상승했다. 주택담보대출 금리는 4.66%, 신용대출 금리는 6.33%로 각각 전월 대비 상승했다. 신규 취급액 기준 예대금리차도 1.19%포인트로 확대됐다. 금리 상승은 금융당국의 가계부채 관리 강화 기조와 시장금리 상승이 함께 반영된 결과로 풀이된다.","url":"https://www.dailian.co.kr/news/view/1696148"}]},{"name":"임대주택","articles":[{"n":6,"title":"\"주거비 하루 1000원\"…전북, 청년·신혼부부에 '천원주택' 700호 공급","meta":"2026.09.30 10:38 · 서울신문","body":"전라북도가 2027년부터 2030년까지 4년간 청년과 신혼부부를 위한 '천원주택' 700호를 공급하기로 했다. 입주자는 월 3만원의 임대료만 부담하고 나머지 비용은 도와 시·군이 지원한다. 총사업비는 488억원이며, 자녀를 출산하면 거주 기간을 최대 10년까지 연장할 수 있다. 전북도는 이를 통해 청년층의 지역 정착과 신혼부부의 주거비 부담 완화를 기대하고 있다.","url":"https://www.seoul.co.kr/news/society/2026/09/30/20260930500064"},{"n":7,"title":"2년 넘게 빈 LH 임대주택 1만 가구…수요·공급 엇박자","meta":"2026.09.30 11:14 · 뉴시스","body":"한국토지주택공사(LH)가 관리하는 공공임대주택 가운데 2년 이상 비어 있는 주택이 9941가구에 달하는 것으로 나타났다. 6개월 이상 공실은 4만6797가구, 3년 이상 장기 공실도 4668가구로 집계됐다. 장기 공실의 73%는 전용면적 40㎡ 미만 소형 주택에 집중돼 있고, 비수도권과 행복주택에서 공실이 두드러졌다. 입주자격 제한과 지역별 수요·공급 불일치가 주요 원인으로 지목된다.","url":"https://newsis.com/view/NISX20260930_0003808379"},{"n":8,"title":"\"33만원 돌려받으려 소송까지\"…소액 전세보증금 구제 사각지대","meta":"2026.09.30 17:58 · 뉴스핌","body":"국회 국정감사에서 소액 전세보증금을 돌려받지 못한 세입자가 지급명령 절차로는 구제받지 못해 정식 민사소송까지 거쳐야 했던 사례가 지적됐다. 한 세입자는 33만원의 보증금을 받지 못해 채무자 특정 문제로 소송까지 진행해야 했던 것으로 나타났다. 법원 행정 통계에는 보증금 미반환 관련 사건이 집계되지만, 지급명령에서 소송으로 전환된 사건이나 피해 유형별 세부 통계는 별도로 관리되지 않고 있다. 해당 의원은 소액 피해자를 위한 신속하고 간편한 구제 절차 마련과 통계 관리 개선을 요구했다.","url":"https://www.newspim.com/news/view/20260930001276"}]},{"name":"택지/도시개발","articles":[{"n":9,"title":"3기 신도시, 입주는 내년인데 철도는 4년 뒤…\"선교통 약속 차질\"","meta":"2026.09.30 10:54 · 뉴데일리","body":"고양창릉·남양주왕숙·하남교산 등 3기 신도시에서 주택 입주 시기와 철도 개통 시기 사이에 2~3년의 공백이 발생할 것으로 나타났다. 고양창릉은 2027년 12월 첫 입주가 예정돼 있지만 관련 철도 노선은 2031년에야 개통하고, 왕숙은 2028년 8월 입주에 노선은 2031년, 교산은 2029년 6월 입주에 노선은 2032년 개통이 목표다. 전문가는 입주자들이 애초 계획된 교통망과 서울 접근성을 보고 신도시를 선택하는 만큼 교통 지연이 상권 형성 등에도 영향을 줄 수 있다고 지적했다. 정부가 내세운 '선교통·후입주' 원칙이 현실에서는 지켜지기 어렵다는 우려가 나온다.","url":"https://biz.newdaily.co.kr/site/data/html/2026/09/30/2026093000143.html"},{"n":10,"title":"서울 11곳에 1만8000가구…도심 공공주택 복합사업 후보지 확정","meta":"2026.09.30 15:36 · 경향신문","body":"국토교통부가 서울 11개 지역을 도심 공공주택 복합사업 신규 후보지로 선정해 약 1만8000가구를 공급하기로 했다. 용산 효창공원앞역, 서초 이수역, 마포 망원종합운동장 일대 등이 포함됐으며, 역세권 고밀복합 개발형이 6곳, 저층 주거지 정비형이 5곳이다. 이 사업은 민간 개발이 어려운 노후 지역을 공공이 주도해 절차를 간소화하고 인센티브를 제공하는 방식으로 추진된다. 내년 상반기 예정지구 지정을 거쳐 2030년 하반기 착공이 목표다.","url":"https://www.khan.co.kr/article/202609301536001"}]},{"name":"주택품질/안전","articles":[{"n":11,"title":"철근 누락·사망사고까지…국감 소환된 대형 건설사들","meta":"2026.09.30 12:27 · 머니투데이","body":"국회 국토교통위원회가 9월 30일 전체회의에서 2026년 국정감사 증인·참고인 출석요구안을 의결하며 대형 건설사 본부장급 임원들을 증인으로 채택했다. 수도권 광역급행철도 공사 구간의 철근 누락 사태와 관련해 한 건설사가, 공항 건설 현장의 공사비 문제와 관련해 다른 건설사가 지목됐고, 또 다른 건설사는 철도 공사 현장에서 2024년 10월 이후 근로자 4명이 숨진 사고로 증인 명단에 올랐다. 이번 국감에서는 예년과 달리 대표이사 대신 실무 책임자급 임원이 증인으로 채택된 점이 눈에 띈다. 여야는 추가 협의를 거쳐 나머지 건설사 관계자의 추가 증인 채택 여부를 결정할 예정이다.","url":"https://www.mt.co.kr/estate/2026/09/30/2026093012275557690"},{"n":12,"title":"공공주택 늘린다는데 품질은 뒷걸음…LH 가구당 하자 4년 새 2.3배","meta":"2026.09.30 10:59 · 아시아타임즈","body":"국정감사 자료에 따르면 한국토지주택공사(LH)가 공급한 공공주택의 가구당 하자 건수가 2022년 5.1건에서 2025년 11.5건으로 늘었다. 특히 공공분양 주택은 같은 기간 10.4건에서 21.3건으로 두 배 넘게 증가했다. 최근 5년간 발생한 하자 143만여 건 가운데 71.9%는 창호·도배·가구·바닥·타일·도장 등 6개 공종에 집중됐고, 누수·조명 불량·배관 누수 등 중대하자도 상당수 발생했다. 정부가 2030년까지 공공임대주택을 250만 가구로 확대할 계획인 만큼 공급 목표에 걸맞은 품질관리 체계가 함께 갖춰져야 한다는 지적이 나온다.","url":"https://www.asiatime.co.kr/article/20260930500124"}]},{"name":"분양정보","articles":[{"n":13,"title":"가을 분양 성수기 돌입…10월 전국 아파트 4만6000가구 분양","meta":"2026.09.30 15:18 · 파이낸셜뉴스","body":"부동산 업계 집계에 따르면 10월 전국 60개 단지에서 약 4만5691가구의 아파트가 분양될 예정으로, 전월(2만6783가구)보다 70%가량 늘어난 규모다. 수도권이 전체의 56.3%인 2만5711가구를 차지하며 경기도에서 1만5991가구로 가장 많은 물량이 공급된다. 반면 서울은 1869가구에 그쳐 희소성에 따른 청약 쏠림 현상이 더 심해질 것으로 전망된다. 지방은 1만9980가구가 분양을 앞두고 있지만 미분양 해소가 뚜렷하지 않아 신규 공급이 부담으로 작용할 수 있다는 분석이 나온다.","url":"https://www.fnnews.com/news/202609301507369054"}]}]},{"date":"2026-09-30","count":15,"pdf_count":18,"highlights":[{"n":1,"text":"李대통령 \"국토장관에 나라 운명 달려…과감한 공급 총력\""},{"n":2,"text":"서울 '10억 이하' 거래 활발…10월 공급에 실수요 숨통 트일까"},{"n":7,"text":"'은마·잠실5·한남5' 조합원 분양신청 돌입…전용 84㎡ 25억~32억원"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"李대통령 \"국토장관에 나라 운명 달려…과감한 공급 총력\"","meta":"2026.09.29 15:47 · 헤럴드경제","body":"이재명 대통령이 29일 국무회의에서 홍지선 국토교통부 장관에게 \"국토부 장관에게 나라의 운명이 달려 있다\"며 과감한 주택 공급 방안을 마련하라고 지시했다. 대통령은 최근 수도권 착공과 입주 물량이 늘어난 추이를 국민에게 상세히 전달할 것을 주문했으며, 관계 부처 장관들에게도 빠른 공급을 위해 총력을 기울일 것을 당부했다. 이 자리에서 LH와 국토부의 인력 부족 문제 해결 필요성도 함께 거론된 것으로 전해졌다.","url":"https://biz.heraldcorp.com/article/10887809"}]},{"name":"시장동향","articles":[{"n":2,"title":"서울 '10억 이하' 거래 활발…10월 공급에 실수요 숨통 트일까","meta":"2026.09.29 00:17 · 서울신문","body":"한국부동산원 통계에 따르면 서울 아파트 매매는 지난해보다 20.9% 줄었지만 10억원 이하 중저가 거래 비중은 55.9%로 늘어난 것으로 나타났다. 대출 규제가 강화된 가운데 노원·구로 등 외곽 지역과 중저가 단지에 실수요가 몰린 결과로 풀이된다. 10월에는 전국 아파트 공급이 3만8032가구로 전년 대비 61% 늘고 수도권 입주 물량도 지난해 같은 기간의 세 배 이상인 1만1000여 가구로 늘어날 예정이어서, 중저가 실수요 시장에 숨통이 트일지 주목된다.","url":"https://www.seoul.co.kr/news/economy/estate/2026/09/29/20260929030003"},{"n":3,"title":"강남 집값, 3년8개월 만에 낙폭 최대","meta":"2026.09.29 18:00 · 한국경제","body":"한국부동산원에 따르면 서울 강남구 아파트값은 지난달 둘째 주 이후 이달 셋째 주(21일 기준)까지 7주 연속 하락했으며, 지난주 하락률은 0.42%로 3년8개월 만에 최대 낙폭을 기록했다. 초고가 주택에 대한 보유세·양도소득세 부담이 커질 것이라는 전망 속에 매물이 늘면서 하락폭이 커진 것으로 분석되며, 실제로 강남구 매물은 최근 21.6% 늘어난 것으로 집계됐다. 다만 신천동 '장미1차' 등 일부 단지에서는 한 달여 만에 1억2500만원 오른 신고가 거래도 나와 지역·단지별 온도차가 뚜렷했다.","url":"https://www.hankyung.com/article/2026092928051"},{"n":4,"title":"서울 아파트 인허가 물량 급증…10년 평균 5년 만에 넘어","meta":"2026.09.30 06:00 · 뉴스핌","body":"국토교통부 주택통계에 따르면 8월 서울 지역 주택 인허가는 1만1306가구로 전년 동월 대비 604.4% 늘었으며, 이 중 아파트만 1만537가구로 약 10배 증가했다. 올해 1~8월 누적 인허가도 3만9940가구로 10년 장기평균인 3만8000가구를 넘어섰는데, 인허가 물량이 장기평균을 웃돈 것은 5년 만에 처음이다. 정부의 신축 매입임대 확대와 도시형생활주택·오피스텔에 대한 금융 지원이 공급 증가를 이끈 것으로 풀이되며, 다만 지방은 인허가가 15.8% 줄어 수도권과의 격차가 더 벌어졌다.","url":"https://www.newspim.com/news/view/20260930000009"}]},{"name":"정비사업","articles":[{"n":7,"title":"'은마·잠실5·한남5' 조합원 분양신청 돌입…전용 84㎡ 25억~32억원","meta":"2026.09.29 16:52 · 머니투데이","body":"서울 강남구 은마아파트, 송파구 잠실주공5단지, 용산구 한남뉴타운5구역 등 대형 재건축·재개발 3개 사업이 나란히 조합원 분양신청 절차에 들어갔다. 은마아파트는 10월 30일까지, 잠실주공5단지는 10월 31일까지 신청을 받으며, 한남5구역은 10월 6일부터 11월 9일까지 접수한다. 세 사업지 모두 전용 84㎡ 기준 조합원 분양가가 25억~32억원 수준으로 책정됐으며, 세대수도 크게 늘어 은마는 약 1426가구, 잠실주공5단지는 약 2481가구가 순증할 예정이다. 개인별 종전자산 평가액에 따라 추가분담금을 내야 하는 조합원과 오히려 환급받는 조합원이 갈릴 것으로 보인다.","url":"https://www.mt.co.kr/estate/2026/09/29/2026092914481837987"},{"n":8,"title":"군포 원도심 재개발 본격화…1만8000세대 신흥 주거타운 탈바꿈","meta":"2026.09.29 13:39 · 뉴스핌","body":"경기 군포시 당동·산본동·금정동 일대 원도심 재개발이 속도를 내고 있다. 지난 7월 철거에 들어간 군포10구역은 호반건설 시공으로 내년 1월 본공사 착공을 목표로 하며, 지하 6층~지상 최고 49층 규모의 주상복합단지에 공동주택 1031가구와 오피스텔 396호가 들어선다. 산본·금정동 일대에서도 정비사업 약 17곳이 함께 추진되고 있으며, GTX-C 금정역 개통 호재까지 겹치면서 군포가 수도권 남부를 대표하는 주거단지로 탈바꿈할 것이라는 기대가 나온다.","url":"https://www.newspim.com/news/view/20260929000661"}]},{"name":"금융/세제","articles":[{"n":9,"title":"SC제일은행, 내달 1일부터 주담대 MCI 전면 재개","meta":"2026.09.29 10:08 · 한국경제","body":"SC제일은행이 10월 1일부터 주택담보대출 모기지신용보험(MCI) 가입을 재개하기로 했다. 지난 7월 15일 시중은행들이 일제히 중단한 이후 사실상 첫 해제 사례로, 8월에는 아파트 잔금대출에 한해서만 허용했다가 이번에 일반 주담대까지 범위를 넓혔다. 은행권에서는 가계대출 총량 관리에 여유가 생긴 것으로 해석하고 있으며, 다른 시중은행들도 대출 규제를 단계적으로 완화하는 추세이나 일부 은행은 여전히 제한 조치를 유지하고 있다.","url":"https://www.hankyung.com/article/202609290593i"},{"n":10,"title":"조정지역 일시 2주택 특례 '3년→2년'…10월부터 시행","meta":"2026.09.29 18:28 · 파이낸셜뉴스","body":"정부가 29일 국무회의에서 소득세법·법인세법·종합부동산세법·상속세및증여세법 시행령 개정안을 심의·의결했다. 조정대상지역에서 새로 집을 사 일시적 2주택자가 된 경우 양도소득세·종부세상 1세대 1주택 특례를 인정받는 기간이 기존 3년에서 2년으로 줄어든다. 다주택자 등록임대주택에 대한 거주주택 특례는 당초 축소가 검토됐으나 세입자의 거주 이전 자유를 고려해 5년 유지로 최종 결정됐다. 이번 개정안은 지난 8월 발표된 2026년 세제개편안의 후속 조치로 10월 1일부터 공포·시행된다.","url":"https://www.fnnews.com/news/202609291827520108"}]},{"name":"임대주택","articles":[{"n":11,"title":"서울 원룸 월세 평균 2만원 내렸다더니…\"용산은 116만원\"","meta":"2026.09.29 16:25 · 파이낸셜뉴스","body":"부동산원 통계에 따르면 8월 서울 원룸(전용 33㎡ 이하)의 평균 전세보증금은 2억2228만원으로 전월 대비 1.3% 올랐고, 평균 월세는 67만원으로 2만원 내렸다. 다만 자치구별 편차가 커서 용산구는 평균 월세가 116만원으로 서울에서 가장 높았으며, 전월(87만원) 대비 32.5% 급등해 서울 평균의 173% 수준에 달했다. 신축 원룸 거래가 늘어난 영향으로 분석되며, 지역 간 임대료 격차가 뚜렷하다는 평가다.","url":"https://www.fnnews.com/news/202609291452453226"},{"n":12,"title":"전세 부족, 대학가 월세도 급등","meta":"2026.09.29 18:39 · 서울신문","body":"서울 주요 10개 대학가 원룸(전용 33㎡ 이하)의 7월 기준 월세·관리비 합계가 평균 70만9000원으로 지난해 같은 달보다 5만3000원 올랐다. 이화여대 인근이 87만원으로 가장 높았고 연세대(75만8000원), 한국외대(75만5000원)가 뒤를 이었다. 전세의 빠른 월세 전환으로 비아파트 월세 거래 비중이 78%까지 늘어난 가운데, 학생뿐 아니라 사회초년생까지 수요가 몰리며 대학가 주거비 부담이 커지고 있다.","url":"https://www.seoul.co.kr/news/economy/estate/2026/09/29/20260929500261"}]},{"name":"택지/도시개발","articles":[{"n":14,"title":"LH노조, 30일 첫 교섭 앞두고 기능개편 반대 집회…\"강행 땐 총파업\"","meta":"2026.09.29 15:34 · 이투데이","body":"한국토지주택공사(LH) 노동조합이 29일 정부세종청사 국토교통부 앞에서 조직 기능개편 반대 결의대회를 열고, 임직원과 가족 1만4334명이 참여한 반대 서명부를 국토부에 제출했다. 정부는 지난 3일 LH를 택지개발·주택건설을 맡는 '주택도시개발공사'와 주거복지·자산비축을 맡는 '주택도시자산공사'로 분리하는 개편안을 발표한 바 있다. 노조는 당사자 의견 수렴 없는 일방적 조직 분리라고 반발하며, 30일 예정된 첫 단체교섭에서도 개편이 강행될 경우 총파업을 포함한 대응에 나서겠다고 밝혔다.","url":"https://www.etoday.co.kr/news/view/2630471"}]},{"name":"주택품질/안전","articles":[{"n":15,"title":"서소문고가 붕괴사고 조사 2개월 연장…11월 말까지 원인 규명","meta":"2026.09.29 15:49 · 뉴스핌","body":"국토교통부 건설사고조사위원회가 지난 5월 서울 서대문구 서소문고가차도 철거 현장에서 발생한 상판 붕괴사고의 조사 기간을 이달 말에서 11월 30일까지 두 달 연장했다. 콘크리트·철근 품질 재검사와 철거 과정을 반영한 3차원 모델링, 추가 관계자 조사 등을 위해 구조해석이 더 필요하다는 판단에 따른 것이다. 조사위원장은 붕괴의 실제 과정과 원인을 보다 객관적이고 과학적으로 규명하기 위해 체계적인 조사를 이어가겠다고 밝혔다.","url":"https://www.newspim.com/news/view/20260929000822"},{"n":16,"title":"현대건설 서초구 건설현장 30대 노동자 사망…중대재해법 조사","meta":"2026.09.29 22:22 · 머니투데이","body":"29일 오전 9시45분쯤 서울 서초구 현대건설 아파트 건설현장 23층에서 세대 내부 청소를 위해 대기하던 30대 외국인 노동자가 무너진 천장 콘크리트에 맞아 숨지는 사고가 발생했다. 고용노동부 서울청은 사고 직후 해당 현장에 작업중지 명령을 내리고 중대재해처벌법 위반 여부를 포함한 사고 원인 조사에 착수했다. 이번 사고로 아파트 건설현장의 시공·안전관리 부실 우려가 다시 제기되고 있다.","url":"https://www.mt.co.kr/society/2026/09/29/2026092922095996587"}]},{"name":"분양정보","articles":[{"n":17,"title":"진주 판문 '레이크써밋 웰가' 1순위 35 대 1 \"기대 이상 호성적\"","meta":"2026.09.29 20:53 · 스트레이트뉴스","body":"경남 진주 판문지구 '레이크써밋 웰가'가 29일 1순위 청약에서 346가구 모집에 1만2091건이 접수돼 평균 34.95대 1의 경쟁률을 기록했다. 전용 84㎡A는 91가구 모집에 5614건이 몰려 61.69대 1로 가장 높은 경쟁률을 보였고, 펜트하우스(전용 182㎡)도 43.50대 1을 기록했다. 모든 주택형이 해당지역 접수만으로 공급물량의 5배수를 넘겨 2순위 청약 없이 마감됐으며, 인근 대비 낮은 분양가가 흥행 요인으로 꼽힌다.","url":"https://www.straightnews.co.kr/news/articleView.html?idxno=312180"},{"n":18,"title":"KT에스테이트, 청년안심주택 '리마크빌 마포' 공급…499가구 규모","meta":"2026.09.29 17:22 · 아주경제","body":"KT에스테이트가 서울 마포구 염리동에 청년·신혼부부를 위한 기업형 임대주택 '리마크빌 마포'(총 499가구)를 공급한다고 29일 밝혔다. 이 중 특별공급 86가구와 일반공급 339가구 등 425가구가 청년·신혼부부 대상으로 배정되며, 청약은 10월 1일부터 4일까지 진행된다. 주택형은 전용 30~40㎡대 1룸과 전용 53㎡대 1.5룸으로 구성되며, 대흥역과 공덕역을 도보로 이용할 수 있는 입지가 강점으로 꼽힌다.","url":"https://www.ajunews.com/view/20260929171026383"}]}]},{"date":"2026-09-29","count":15,"pdf_count":21,"highlights":[{"n":13,"text":"오세훈, 李대통령 '평탄화' 발언에 \"상향표준화가 정확한 표현\""},{"n":6,"text":"\"대학 품은 단지가 대세\"...대학 인근 아파트 신고가 행진"},{"n":11,"text":"'모아주택 1호' 입주...오세훈 \"2031년까지 4만가구 착공\""}],"categories":[{"name":"정부정책","articles":[{"n":13,"title":"오세훈, 李대통령 '평탄화' 발언에 \"상향표준화가 정확한 표현\"","meta":"2026.09.28 11:52 · 파이낸셜뉴스","body":"오세훈 서울시장이 이재명 대통령의 '평탄화' 발언에 대해 용어 수정을 제안하고 나섰다. 이 대통령은 강남권 가격 하락세가 외곽으로 확산하며 지역 간 격차가 줄어드는 현상을 \"평탄화\"로 표현했는데, 오 시장은 실제로는 외곽 지역 매매가가 계속 오르고 있다며 낮은 지역이 올라가는 \"상향표준화\"가 정확한 표현이라고 반박했다. 이는 오 시장 개인의 평가로, 정부의 공식 입장과는 다르다. 오 시장은 아울러 정부의 실거주 강요 정책이 전세 물량 감소와 월세 상승으로 이어져 서민층 부담이 커질 수 있다고 우려를 나타냈다.","url":"https://www.fnnews.com/news/202609281133562412"},{"n":14,"title":"도심복합사업·안심신탁…공공 주거모델 총출동","meta":"2026.09.28 18:09 · 한국경제","body":"국토교통부와 LH가 주최하는 '집코노미 박람회 2026'이 9월 30일~10월 1일 서울 코엑스에서 열린다. 행사에서는 19만 가구 규모 3기 신도시의 교통망·기업유치 계획과 모듈러 주택 체험관, GTX-A·B 노선 정보가 소개되며, HUG가 전세금을 보관하고 집주인에게 월세를 지급하는 '전월세 안심신탁' 등 새로운 주거모델이 제시된다. 광교신도시에서는 초기 일부 지분만 매입 후 20~30년에 걸쳐 나머지를 취득하는 지분적립형 주택이 처음 공급된다. 모듈러 공법을 활용해 입주 기간을 12~18개월 단축하는 '패스트트랙' 계획도 함께 전시된다.","url":"https://www.hankyung.com/article/2026092800401"},{"n":15,"title":"LH, 공공주택 공사비 손질…年평균 1000억원 아낀다","meta":"2026.09.28 18:14 · 한국경제","body":"LH가 공공주택 공사비(표준시장단가) 산정 기준을 개선해 연평균 1000억원의 사업비를 절감하기로 했다. 기존에는 표준품셈단가와 표준시장단가 중 낮은 금액을 설계단가로 썼지만, 앞으로는 전년도 평균 낙찰률을 반영한 '예상 계약단가'를 산출해 표준시장단가와 비교하는 방식으로 바뀐다. 올해 하반기 34개 블록, 1만9677가구에 시범 적용한 결과 451억원이 절감됐으며, 2030년까지 누적 절감액은 3977억원에 이를 것으로 추산된다. 적용 품목을 확대해 설계단가부터 비용을 낮추고 이를 입찰단가에도 반영할 계획이다.","url":"https://www.hankyung.com/article/2026092800471"}]},{"name":"시장동향","articles":[{"n":6,"title":"\"대학 품은 단지가 대세\"...대학 인근 아파트 신고가 행진","meta":"2026.09.28 10:10 · 파이낸셜뉴스","body":"대학가 배후 수요를 낀 아파트들이 잇따라 신고가를 기록하고 있다. 안산 레이크타운 푸르지오 전용 84㎡는 8월 11억원에 거래돼 지난해 11월보다 1억6000만원 올랐고, 인천 용현자이 크레스트와 주안파크자이 더 플래티넘도 각각 6억2500만원, 6억원으로 역대 최고가를 썼다. 부산 대연 힐스테이트푸르지오 역시 4월 10억7500만원에 신고가를 기록했다. 업계는 교수·교직원·학생 등 탄탄한 배후수요가 매매·임차 시장을 동시에 떠받치고 있다고 분석하며, 천안·인천·서울·부산 등에서 대학가 인프라를 갖춘 신규 분양도 이어질 예정이다.","url":"https://www.fnnews.com/news/202609280952069017"},{"n":7,"title":"국평 21억, 한달 집값 4% 폭등...실화냐? 더 싼 곳으로 '우르르'","meta":"2026.09.28 12:00 · 파이낸셜뉴스","body":"9월 서울 아파트값이 1.13% 오른 가운데 노원구(2.32%), 중랑구(2.20%) 등 외곽 지역의 상승폭이 두드러졌다. 경기에서도 수원 영통구 4.30%, 광명시 2.73%, 화성 병점구 2.71% 등 급등세가 나타났으며, 수원 영통구 광교신도시에서는 전용 84㎡(국민평형)가 21억원을 넘어섰다. 성북구 길음동 래미안길음센터피스도 20억원에 거래되며 종전 최고가 16억원대를 크게 웃돌았다. 전문가는 전월세 가격 상승이 이어지는 가운데 서울 외곽과 경기 남부권으로 풍선효과가 강해지고 있다고 진단했다.","url":"https://www.fnnews.com/news/202609281112147579"},{"n":8,"title":"건설경기 반등?...업계에서는 \"일시적 현상으로 봐야\"","meta":"2026.09.28 15:26 · 파이낸셜뉴스","body":"올해 2분기 건설공사 계약액이 80조9000억원으로 전년 동기(63조5000억원) 대비 27.3% 늘며 최근 10년 최고치였던 2022년 2분기 실적의 97.8% 수준까지 회복했다. 민간 부문에서는 반도체·에너지 등 산업설비 건설이 증가를 주도해 토목이 98.3%, 산업설비가 128.4% 늘었다. 다만 업계는 이를 반도체 시설 및 공공부문 증가에 따른 일시적 현상으로 보고 있으며, 8월 건설기업경기실사지수(CBSI)가 기준선(100)을 밑도는 72.7에 그치고 미분양 6만8217가구 등 과제가 여전하다고 지적했다. 계약액 증가가 실제 착공·분양으로 이어질지는 더 지켜봐야 한다는 것이 업계의 시각이다.","url":"https://www.fnnews.com/news/202609281514357028"}]},{"name":"정비사업","articles":[{"n":11,"title":"'모아주택 1호' 입주...오세훈 \"2031년까지 4만가구 착공\"","meta":"2026.09.28 10:30 · 파이낸셜뉴스","body":"서울시 저층주거지 정비사업인 '모아주택' 제도의 첫 준공·입주 단지가 나왔다. 광진구 한양연립 부지(9877㎡)가 통합심의 3년여 만에 재건축돼 기존 99가구에서 215가구(순증 116가구)로, 최고 15층까지 높아진 아파트로 8월 준공, 9월부터 입주가 시작됐다. 오세훈 서울시장은 현장을 방문해 \"모아주택이 없었다면 정비가 불가능했을 지역\"이라고 평가하며 2031년까지 4만 호 착공 목표를 제시했다. 현재 168곳이 조합 설립을 마쳤고 14곳이 착공 단계에 있다.","url":"https://www.fnnews.com/news/202609280936545212"},{"n":12,"title":"\"써밋보다 고급으로\"…특화브랜드 요구한 한남2","meta":"2026.09.28 18:15 · 한국경제","body":"한남2구역 재개발조합이 시공사인 대우건설에 이 단지에만 적용할 특화 브랜드를 9월 30일까지 제시해달라고 공문으로 요청했다. 조합측은 브랜드가 단지 위상과 자산가치를 좌우하는 핵심 요소라는 입장이며, 대우건설은 기존 '푸르지오'와 하이엔드 '써밋' 강화 방안, 신규 브랜드 도입을 함께 검토해 연내 방향을 정할 계획이다. 써밋 브랜드가 신길·노량진·천호 등 여러 단지에 적용되며 하이엔드 이미지가 희석됐다는 지적이 배경으로 꼽힌다. 강남구 개포주공5단지, 양천구 목동8단지 등에서도 별도 브랜드를 요구하는 등 초고가 정비사업 단지에서 건설사명 대신 단지명만 내세우는 흐름이 확산되고 있다.","url":"https://www.hankyung.com/article/2026092800481"}]},{"name":"금융/세제","articles":[{"n":21,"title":"李대통령 \"결혼하면 손해? 이젠 아니야…불합리한 대출정책 바로잡혀\"","meta":"2026.09.29 08:22 · 서울경제","body":"이재명 대통령이 9월 29일 신혼부부 보금자리론의 소득 기준 완화 방침을 밝히며 \"결혼 페널티로 꼽혔던 불합리한 대출 정책이 바로잡혔다\"고 말했다. 기존에는 부부 합산 소득이 무자녀 8500만원, 1자녀 9000만원, 2자녀 이상 1억원을 넘으면 보금자리론을 이용할 수 없었지만, 다음달 19일부터는 부부 합산 소득이 기준을 초과해도 부부 중 1명의 연 소득이 7000만원 이하라면 신청이 가능해진다. 다만 개인 소득 기준을 적용할 경우 해당 신청자의 소득·부채를 기준으로 총부채상환비율(DTI) 심사를 받는다. 대통령은 국가 정책이 결혼을 손해로 여기게 만들어서는 안 된다고 강조했다.","url":"https://www.sedaily.com/article/20095848"}]},{"name":"임대주택","articles":[{"n":17,"title":"HUG '든든전세주택' 30일부터 900호 모집...역대 최대 규모","meta":"2026.09.28 13:28 · 파이낸셜뉴스","body":"HUG(주택도시보증공사)가 9월 30일부터 10월 12일까지 제12차 든든전세주택 입주자를 모집하며, 이번 모집 규모는 한 차례 기준 역대 최대인 900호다. 서울·인천·경기 부천·부산 등에 공급되며, 나이·소득·자산과 무관하게 무주택 세대구성원이면 누구나 HUG 안심전세포털을 통해 온라인으로 신청할 수 있다. 당첨자는 12월 30일 발표되며, HUG가 전세보증금을 대신 상환한 주택을 직접 매입해 최장 8년간 시세의 약 90% 이하 가격에 임차할 수 있도록 제공한다. 올해 총 공급 물량은 3600호로, 지난해 1800호의 두 배 수준이다.","url":"https://www.fnnews.com/news/202609281323164405"},{"n":18,"title":"서울 원룸 월세 내렸다는데…용산 세입자 '울상'","meta":"2026.09.29 08:39 · 한국경제","body":"부동산 플랫폼 다방 분석에 따르면 8월 서울 연립·다세대 원룸의 평균 월세는 67만원으로 전월 대비 2만원 내렸지만, 용산구는 정반대로 7월 87만원에서 8월 116만원으로 한 달 새 29만원(32.5%) 급등해 서울 평균의 173% 수준을 기록했다. 이는 일부 고가 신축 원룸 거래가 평균값을 끌어올린 결과로 풀이된다. 한편 월세와 달리 서울 원룸 평균 전세보증금은 2억2228만원으로 전월보다 293만원(1.3%) 올라 대조적인 흐름을 보였다.","url":"https://www.hankyung.com/article/2026092908836"}]},{"name":"택지/도시개발","articles":[{"n":19,"title":"호반, 고성 화진포에 6800억원 복합리조트 조성","meta":"2026.09.28 15:15 · 한국경제","body":"호반그룹이 강원 고성군 화진포 일대 17만여㎡(약 5만평) 부지에 6800억원을 투입해 복합리조트를 조성한다. 450실 규모 숙박시설에 식음·레저·쇼핑시설을 갖춘 체류형 휴양관광지로 개발되며, 사업은 호반호텔앤리조트가 맡는다. 강원특별자치도와 고성군은 관계 법령에 따라 행정·재정적 지원에 협조하기로 했으며, 관광지 조성계획 변경 인허가는 이미 마쳤다. 착공 목표 시점은 2027년 상반기다.","url":"https://www.hankyung.com/article/202609289661i"}]},{"name":"주택품질/안전","articles":[{"n":20,"title":"삼성물산 '넥스트 홈'에 최고 내진성능","meta":"2026.09.28 18:14 · 한국경제","body":"삼성물산이 개발한 '사전제작 콘크리트(PC) 특수모멘트 보-기둥 건식 접합 공법'이 한국콘크리트학회로부터 기술 인증을 받았다. 공장에서 미리 제작한 콘크리트 부재를 철골 브래킷과 볼트 체결로 현장에서 조립하는 방식으로, 2024년 획득한 중간모멘트 골조 등급에서 한 단계 상향된 특수모멘트 골조 등급을 받아 층 높이의 3.5%까지 흔들려도 견딜 수 있는 성능을 갖췄다. 삼성물산은 이 기술을 미래 주거 모델 '넥스트홈'에 적용해 실내 기둥을 최소화하고 입주자가 공간을 자유롭게 활용할 수 있도록 할 계획이다. 회사측은 초고층 건물에 PC 공법을 적용하면 안전성과 함께 공사 기간 단축 효과도 기대할 수 있다고 설명했다.","url":"https://www.hankyung.com/article/2026092800391"}]},{"name":"분양정보","articles":[{"n":1,"title":"현대엔지니어링, '힐스테이트 성남메트로블' 다음달 분양","meta":"2026.09.28 09:18 · 파이낸셜뉴스","body":"현대엔지니어링이 경기 성남시 수정구 단대동 옛 KT 부지에 오피스텔 '힐스테이트 성남메트로블'을 다음달 분양한다. 지하 6층~지상 34층 2개 동에 주거형 오피스텔 189실과 근린생활시설로 구성되며, 전용 74~95㎡ 중 84㎡ 161가구가 주력 타입이다. 단지는 8호선 단대오거리역 역세권에 위치하고, 인근에는 수원지방법원·검찰청 성남지원·지청 이전을 골자로 한 법조타운 조성이 추진되고 있어 배후 수요가 기대된다. 견본주택은 경기 용인시 수지구 동천동에 마련된다.","url":"https://www.fnnews.com/news/202609280913362385"},{"n":2,"title":"강변역 센트럴 아이파크 '10억 줍줍 로또' 나왔다","meta":"2026.09.28 17:54 · 한국경제","body":"서울 모아주택 1호 단지인 강변역 센트럴 아이파크가 무순위 청약으로 전용 84㎡ 1가구를 분양한다. 분양가는 12억2202만원으로, 같은 면적 분양권이 지난달 22억원에 거래된 점을 고려하면 약 10억원의 시세차익이 기대된다는 것이 시장의 평가다. 청약은 10월 6일, 당첨자 발표는 10월 12일이며 서울 거주 무주택 세대주라면 청약통장 없이 신청할 수 있다. 단지는 구의역과 강변역 사이 '더블 역세권'에 자리한다.","url":"https://www.hankyung.com/article/202609280239i"}]}]},{"date":"2026-09-28","count":15,"pdf_count":21,"highlights":[{"n":4,"text":"다음 카드는 '전월세 안정'…전문가 70% \"추가 대책 필요\""},{"n":9,"text":"서울 집값 '사실상' 86주 상승, 文정부 기록 깼다…규제 풍선효과 '데자뷰'"},{"n":6,"text":"\"박원순 前시장, 정비구역 389곳 해제… 현재 공급난 부메랑\""}],"categories":[{"name":"정부정책","articles":[{"n":4,"title":"다음 카드는 '전월세 안정'…전문가 70% \"추가 대책 필요\"","meta":"2026.09.28 05:05 · 뉴스1","body":"뉴스1이 부동산 전문가 20명을 대상으로 실시한 설문에서 응답자의 70%가 전월세 시장 안정을 위한 추가 대책이 필요하다고 답했다. 전문가의 60%는 최근 세제개편에 부정적 입장을 보였고, 65%는 단기 공급 확대 가능성을 낮게 평가했다. 입주 물량 부족과 매물 감소가 연말까지 시장의 최대 변수로 꼽혔으며, 전세의 월세화 가속화에 대한 우려도 함께 제기됐다. 조사는 추석 이후 매매·임대시장과 정책 영향을 중심으로 진행됐다.","url":"https://www.news1.kr/realestate/general/6300209"},{"n":5,"title":"시동 건 홍지선號… 공급 늘려 집값 질주 잡을까","meta":"2026.09.28 03:00 · 머니투데이","body":"홍지선 신임 국토교통부 장관이 주택공급 확대를 최우선 과제로 내세우고 있다. 서울 아파트값이 85주 연속 상승하며 역대 최장 기록과 동률을 이루자, 정부는 규제 중심이던 이전 기조 대신 '공급 실행'에 집중하기로 했다. 이재명정부는 2030년까지 수도권에 135만가구 착공을 목표로 세웠으며, 공공택지 37만2000가구·정비사업 23만4000가구·도심 가용지 3만8000가구 등에 더해 수도권에 23만가구를 추가 공급할 계획이다. 국토부는 재건축·재개발 절차 간소화와 공공택지 사업 속도 제고를 통해 목표를 실현한다는 방침이다.","url":"https://www.mt.co.kr/estate/2026/09/28/2026092718572498186"}]},{"name":"시장동향","articles":[{"n":9,"title":"서울 집값 '사실상' 86주 상승, 文정부 기록 깼다…규제 풍선효과 '데자뷰'","meta":"2026.09.27 18:06 · 이데일리","body":"서울 아파트 매매가격이 지난해 2월부터 이달 셋째 주까지 86주째 연속 상승하며 문재인정부 시절 최장 기록(85주)을 넘어섰다. 이번 상승기간 누적 상승률은 17.50%로 기존 최장 기간 기록(7.71%)의 약 2.3배에 달한다. 정부의 토지거래허가구역 확대와 대출·세제 규제에도 불구하고 강남권에서 서울 외곽과 경기로 수요가 확산되며 규제 효과가 시장 전체에 미치지 못했다는 분석이다. 전세가격도 11.99% 올랐고, 평균 월세는 1년 만에 20만원 오른 164만원을 기록했다.","url":"https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=01895846645584384"},{"n":10,"title":"부동산 전문가 99% \"연말까지 서울 전셋값 더 오른다\"","meta":"2026.09.27 13:49 · 한국경제","body":"한국경제가 부동산 전문가 100명을 대상으로 실시한 설문에서 99%가 연말까지 서울 전셋값이 오를 것으로 내다봤다. 응답자의 48%는 3~4% 상승을 예상했고, 45.5%는 상승세가 내년 하반기까지 이어질 것으로 전망했다. 전문가들은 실거주 요건 강화에 따른 임대 매물 감소를 주요 원인으로 지목했으며, 전셋값 상승이 매매가 상승으로 이어지는 악순환을 우려했다. 응답자의 86%는 수도권 아파트값도 최소 1% 이상 오를 것으로 전망했고, 해법으로는 68%가 민간임대 공급 활성화를 꼽았다.","url":"https://www.hankyung.com/article/202609277380i"}]},{"name":"정비사업","articles":[{"n":6,"title":"\"박원순 前시장, 정비구역 389곳 해제… 현재 공급난 부메랑\"","meta":"2026.09.28 03:00 · 머니투데이","body":"이재명 대통령이 2022년 이후 서울 주택공급이 절반 수준으로 줄었다고 지적한 데 대해, 이를 시차를 고려해 짚어보는 분석 기사다. 박원순 전 시장 재임 기간(2012~2020년) 389곳의 정비구역이 해제되며 약 43만가구 규모 사업이 중단됐던 반면, 오세훈 시장 취임 후 2021년 신속통합기획 도입 이후 214개 구역·30만7000가구 규모의 정비사업이 추진되고 있다. 정비사업은 구역지정부터 착공까지 평균 10년 이상 걸리는 만큼, 현재의 공급 감소는 과거 정책의 영향이 뒤늦게 나타난 결과라는 분석이다.","url":"https://www.mt.co.kr/estate/2026/09/28/2026092718572261346"},{"n":7,"title":"성수 재개발 시공사 퍼즐 '사실상 완성'…대형사 4곳 나눠 맡는다","meta":"2026.09.25 06:05 · 뉴스1","body":"성수전략정비구역 재개발 사업의 시공사 구도가 사실상 확정됐다. GS건설·삼성물산·롯데건설이 각각 1·3·4지구 시공권을 확보했고, 마지막 남은 2지구는 DL이앤씨가 수주할 가능성이 높은 상황이다. 이로써 한 생활권에서 대형 건설사 4곳의 브랜드가 나란히 들어서는 구도가 형성되며, 각사는 '대장주' 자리를 두고 상품 차별화 경쟁을 펼칠 것으로 전망된다.","url":"https://www.news1.kr/realestate/general/6300471"}]},{"name":"금융/세제","articles":[{"n":15,"title":"금융당국, 서민금융·고정금리 대출 확대 고심","meta":"2026.09.27 17:47 · 파이낸셜뉴스","body":"금융당국이 고금리 시대 취약차주 부담을 줄이기 위한 정책을 추진하고 있다. 햇살론·보금자리론·디딤돌대출 등 정책서민금융 공급을 늘리고 고정금리 대출 확대를 검토 중이며, K-민생지킴대출에 재정 3000억원을 투입해 총 6000억원 규모로 공급할 계획이다. 은행권에는 10년 이상 장기 고정금리 상품 출시를 독려하고 있으며, 내년 상반기 DSR 규제는 현행 수준을 유지할 것으로 예상된다.","url":"https://www.fnnews.com/news/202609271747047628"},{"n":16,"title":"재건축 앞둔 '목동·상계' 증여 급증…서울 증여 15% 늘어","meta":"2026.09.27 04:00 · 파이낸셜뉴스(뉴시스)","body":"올해 상반기 서울 아파트 증여 등기가 3548건으로 지난해 같은 기간(3083건)보다 15% 이상 늘었다. 재건축을 앞둔 양천구 목동신시가지아파트(102건)와 노원구 상계주공아파트(95건)에서 증여가 가장 활발했다. 전문가들은 재건축 완료로 가격이 오르기 전에 자녀에게 미리 증여하려는 의도와 세금 부담 경감 목적을 주된 원인으로 분석했다.","url":"https://www.fnnews.com/news/202609270400341482"}]},{"name":"임대주택","articles":[{"n":2,"title":"전세거래 급감하는 사이 월세 3배 는 중랑구…'서울 월세화' 축소판","meta":"2026.09.28 05:08 · 이데일리","body":"서울 중랑구에서 지난 1년간 아파트 전세 거래가 64.5% 급감한 반면 월세 거래는 190.8% 급증한 것으로 나타났다. 대출 규제 강화로 전세 자금 조달이 어려워지면서 세입자들이 월세로 이동하는 현상이 중저가·실수요 지역인 중랑구에서 두드러졌다. 서울 전역에서 전세 거래가 줄고 월세가 느는 추세 속에, 중랑구 사례는 외곽 지역까지 확산되는 '전세의 월세화'를 상징적으로 보여준다는 분석이다.","url":"https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=01436646645584712"},{"n":3,"title":"월세 4000만원 시대…서울 '1000만원 이상' 계약 28% 늘었다","meta":"2026.09.26 07:05 · 뉴스1","body":"서울의 고가 월세 시장이 빠르게 확대되고 있다. 월 임대료 1000만원 이상 초고가 계약이 1년 새 28% 증가했고, 3년 연속 증가 추세를 보였다. 최고가는 용산 나인원한남으로 연간 월세만 4억8000만원에 달했으며, 초고가 계약 중 용산구가 64건으로 가장 많았다. 서울 임차시장에서 고가 구간으로의 쏠림 현상이 심화되고 있다는 평가다.","url":"https://www.news1.kr/realestate/general/6301182"}]},{"name":"택지/도시개발","articles":[{"n":18,"title":"추석 끝나자 3기 신도시 청약…계양·대장·왕숙 줄줄이 공급","meta":"2026.09.27 13:00 · 이데일리","body":"추석 연휴가 끝나면서 3기 신도시 공공분양이 본격화된다. 인천계양 A6블록은 9월 30일부터 10월 2일까지 일반공급 청약을 받으며, 총 663가구 중 전용 59㎡ 평균 분양가는 약 5억3000만원이다. 부천대장과 남양주왕숙도 10월 분양에 나서며, 고양장항·평택고덕 등 LH 공공분양 물량도 4분기에 대거 예정돼 있다. 기본형건축비 상승으로 분양가가 오른 가운데, 정부는 초기 자금 부담을 줄이기 위해 공공분양의 약 15%를 지분적립형으로 공급할 계획이다.","url":"https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=01515366645584384"}]},{"name":"주택품질/안전","articles":[{"n":1,"title":"용인특례시, 제1기 '공동주택 품질점검단' 전문가 모집","meta":"2026.09.28 06:51 · 외교저널","body":"용인특례시가 공동주택 시공 품질을 높이고 하자를 예방하기 위해 제1기 '공동주택 품질점검단'을 구성한다고 28일 밝혔다. 10월 1일부터 15일까지 건축·품질·안전·구조·기계·전기·통신·소방·토목·조경 등 10개 분야에서 기술사·건축사 등 전문가 60명 이내를 모집한다. 지난 8일 제정된 관련 조례에 따른 후속 조치로, 선발된 전문가는 골조공사 단계부터 입주 전 사용검사 단계까지 단지별로 총 5차례 현장을 점검해 결함을 조기에 발견·보완할 계획이다. 이상일 시장이 강조해온 '하자 없는 아파트' 정책의 실행 체계를 갖추는 취지다.","url":"https://www.djournal.co.kr/news/article.html?no=119422"}]},{"name":"분양정보","articles":[{"n":19,"title":"[분양캘린더] 인천 계양 3기 신도시 등 전국 3641가구 분양","meta":"2026.09.27 05:41 · 머니투데이","body":"다음 주 인천 계양 3기 신도시를 포함해 전국 8개 단지에서 총 3641가구(일반분양 1927가구)의 청약이 진행된다. LH가 추진하는 인천계양 A6블록은 663가구 중 사전청약분을 제외한 251가구가 분양되며, 경기 광명시 '광명시티프라디움에듀하임'(426가구), 경남 진주시 '진주판문지구레이크써밋웰가', 부산 강서구 '에코델타시티금강펜테리움에코리버' 등이 공급된다. 추석 연휴 이후 모델하우스 개관이 늘면서 분양시장이 본격적으로 활기를 띨 것으로 예상된다.","url":"https://www.mt.co.kr/estate/2026/09/27/2026092314153117840"},{"n":20,"title":"\"유치원~중학교까지 안심 통학권\"... '계양신도시 카이브 유보라' 1110세대 분양","meta":"2026.09.25 09:30 · 파이낸셜뉴스","body":"반도건설이 인천 계양신도시 첫 민간분양 단지인 '계양신도시 카이브 유보라'를 공급한다. AC3·AC4블록에 총 1110세대(각 614·496세대) 규모이며 전용면적은 84·92·93㎡, 지하 2층~지상 15층 16개동으로 조성된다. 유치원·초등학교·중학교 예정 부지가 단지와 함께 배치돼 약 10년간 인근에서 교육을 마칠 수 있다는 점이 강점으로 꼽힌다. 인천지하철 1호선 박촌역이 인근에 있어 서울 접근성이 좋고, 피트니스클럽·어린이집·다함께돌봄센터 등 부대시설도 갖췄다.","url":"https://www.fnnews.com/news/202609230959246136"}]},{"name":"논설/사설","articles":[{"n":17,"title":"[백광엽 칼럼] 경자유전·주자유택, 철 지난 부동산 해법","meta":"2026.09.27 16:52 · 한국경제","body":"이 칼럼은 이재명 정부의 부동산 정책을 비판적으로 짚는다. 필자는 투기 근절 자체는 환영할 일이지만 과잉 규제·과세로 흐를 것을 우려하며, 역대 정부가 모두 규제와 징벌적 과세에 매달렸음에도 결과는 집값 급등이었다고 지적한다. 필자는 현 정부 정책의 바탕에 헨리 조지의 토지공개념 사상이 있다고 분석하면서, 이 관점이 학계에서 외면받아 왔고 이론적·현실적 정당성이 부족하다고 주장한다.","url":"https://www.hankyung.com/article/2026092775511"}]}]},{"date":"2026-09-23","count":15,"pdf_count":20,"highlights":[{"n":13,"text":"\"주거안정 위해 공적주택 확충\"…기준·재원·배분방식은 과제"},{"n":1,"text":"코스피·채권시장 출렁이는데 수도권 집값은 상승세…자산시장 '온도차'"},{"n":8,"text":"공사비 수천억씩 올리는 건설사들…착공 밀리고 집값 상승 불보듯"}],"categories":[{"name":"정부정책","articles":[{"n":13,"title":"\"주거안정 위해 공적주택 확충\"…기준·재원·배분방식은 과제","meta":"2026.09.22 15:02 · 아시아경제","body":"국토교통부가 발표한 주거안정플랜에 따라 정부는 5년간 공적주택 119만가구를 공급하며, 기존 취약계층 중심에서 벗어나 소득 4분위까지 이용 가능한 '보편형 공공임대주택'을 새로 도입한다. 다만 구체적인 공급 입지, 입주자격, 임대료 수준, 재원 조달 방안은 아직 확정되지 않았다는 지적이 나온다. 일부 전문가는 이 방식이 기존 공공주택보다 가구당 재정 부담이 크다며 지속 가능한 재원·운영 구조를 명확히 해야 한다고 밝혔다. 서울 등 일부 수도권 지역의 당면한 시장 불안정에 대한 즉각적 효과에도 물음표가 남는다는 평가다.","url":"https://view.asiae.co.kr/article/2026092215022961445"},{"n":14,"title":"3기 신도시 찾은 홍지선 국토장관…\"주택공급은 계획보다 실행\"","meta":"2026.09.22 19:32 · 데일리안","body":"홍지선 국토교통부 장관이 취임 후 첫 현장행보로 3기 신도시인 부천대장지구를 찾아 \"주택공급은 계획보다 실행이 중요하다\"고 강조했다. 부천대장지구는 서울과 인접한 수도권 핵심 입지에 약 2만가구를 공급하는 직주근접형 자족도시로 조성되며, A5·A6블록 1600가구가 2027년 11월 첫 입주를 앞두고 있다. 홍 장관은 3기 신도시에 최단기 착공모델을 적용하는 등 사업 일정과 공정을 면밀히 관리하겠다고 밝혔다. 교통·일자리·생활 기능을 입주 시점에 맞춰 갖추는 동시에 부실시공과 안전사고 방지에도 주력하겠다고 당부했다.","url":"https://www.dailian.co.kr/news/view/1693776/3%EA%B8%B0-%EC%8B%A0%EB%8F%84%EC%8B%9C-%EC%B0%BE%EC%9D%80-%ED%99%8D%EC%A7%80%EC%84%A0-%EA%B5%AD%ED%86%A0%EC%9E%A5%EA%B4%80%E2%80%9C%EC%A3%BC-2026"}]},{"name":"시장동향","articles":[{"n":1,"title":"코스피·채권시장 출렁이는데 수도권 집값은 상승세…자산시장 '온도차'","meta":"2026.09.22 11:01 · 뉴데일리","body":"코스피가 9000선 근접 후 5000대 중반까지 급락하고 3년 만기 국채 금리가 9월 중순까지 4.025%로 뛰는 등 채권·주식시장이 크게 출렁였다. 반면 수도권 주택가격은 8월 기준 전월 대비 0.63% 올라 전국 평균(0.32%)을 웃돌며 중저가 주택 중심으로 상승세를 이어갔다. 부동산금융 익스포저는 4307조7000억원에 달하지만 프로젝트파이낸싱(PF) 대출은 전년 대비 8.0% 줄어든 156조원으로 집계됐다. 한국은행은 집값 상승 기대가 여전히 높은 만큼 금융불균형 누적을 면밀히 살펴야 한다고 진단했다.","url":"https://biz.newdaily.co.kr/site/data/html/2026/09/22/2026092200099.html"},{"n":2,"title":"8월 대책에도 서울 중저가 집값 오름세…한은 \"가계대출 확대될 수도\"","meta":"2026.09.22 11:03 · 파이낸셜뉴스(뉴시스)","body":"정부의 8월 부동산 대책 이후에도 서울 외곽·경기 일부 지역의 중저가 주택가격이 높은 오름세를 지속하고 있다. 반면 강남·서초 등 고가 지역은 가격이 하락해 지역별 온도차가 뚜렷했다. 한국은행은 집값 상승 기대가 높은 데다 가계대출 총량 목표가 완화된 만큼 주택담보대출을 중심으로 가계대출이 다시 확대될 가능성이 있다고 밝혔다. 임차시장에서는 전세 부족으로 월세 비중이 67.6%까지 높아졌고 서울 아파트 평균 월세는 162만원에 이르렀다.","url":"https://www.fnnews.com/news/202609221103518278"},{"n":3,"title":"서울 아파트 거래 22%가 '6억 아래'…정책대출 컷에 몰렸다 [부동산360]","meta":"2026.09.22 15:02 · 헤럴드경제","body":"올해 서울 아파트 거래의 22%가 6억원 이하에서 이뤄져 지난해(17%)보다 크게 늘었다. 디딤돌대출 등 정책대출 한도가 6억원으로 제한된 데다 전세가격 급등과 대출 규제 강화로 무주택 세대가 저가 아파트 매수에 몰린 영향으로 풀이된다. 실제 서울 신내동 대명아파트는 5월 4억원대이던 매매가가 9월 6억3000만원까지 뛰었다. 전문가들은 이런 흐름이 이어지면 저가 아파트 자체가 점차 사라질 수 있다고 우려했다.","url":"https://biz.heraldcorp.com/article/10882262"}]},{"name":"정비사업","articles":[{"n":8,"title":"공사비 수천억씩 올리는 건설사들…착공 밀리고 집값 상승 불보듯","meta":"2026.09.22 11:01 · 뉴데일리","body":"9월 들어 상장 건설사 10곳의 변경계약 12건에서 약 7144억원의 공사비 증액이 발생했다. 자재비·인건비 상승분을 계약금액에 반영하려는 건설사와 발주처 간 협상이 길어지면서 착공·준공 일정이 잇달아 지연되고 있다. 대표 사례인 GTX-C노선은 2024년 착공식 이후 2년8개월 만에야 실제 공사에 착수했고 개통 목표도 2028년에서 2031년으로 3년 미뤄졌다. 주택사업에서는 공사비 증가가 분양가와 조합원 추가분담금 상승 압력으로 이어질 수 있다는 우려가 나온다.","url":"https://biz.newdaily.co.kr/site/data/html/2026/09/22/2026092200103.html"},{"n":9,"title":"한국토지신탁 \"평촌 샘마을, 특별정비구역 지정고시 완료\"","meta":"2026.09.22 11:06 · 파이낸셜뉴스","body":"경기 안양시 호계동 '평촌 샘마을'이 노후계획도시 정비 및 지원에 관한 특별법에 따라 지난 18일 안양시로부터 특별정비구역 지정고시를 받았다고 한국토지신탁이 22일 밝혔다. 대우한양·쌍용·임광·우방 등 4개 단지, 2334가구로 구성된 이 구역은 지난 6월 특별정비구역 지정 제안서 접수 이후 약 3개월 만에 성과를 냈다. 예비사업시행자는 한국토지신탁과 KB부동산신탁이 맡고 있으며, 재건축을 통해 총 4127가구 규모의 신축 단지로 탈바꿈할 예정이다. 평촌 학원가와의 접근성이 좋아 사업성이 우수하다는 평가가 나온다.","url":"https://www.fnnews.com/news/202609221101101436"}]},{"name":"금융/세제","articles":[{"n":11,"title":"[9월 금안보고서] 집값·가계대출 지속상승 경고…한은 \"취약차주·비은행 리스크 경계\"","meta":"2026.09.22 14:41 · 글로벌이코노믹","body":"한국은행이 22일 발표한 9월 금융안정보고서에서 수도권 주택가격과 가계대출 증가세가 계속되고 있다고 진단했다. 금융불안지수(FSI)는 19.5로 '주의' 단계를 유지했고 금융취약성지수(FVI)는 46.5로 상승했다. 한은은 금융불균형 축적에 대한 경계감이 높다며 금리 인상 과정에서 취약차주와 자영업자의 채무상환능력이 약화될 가능성을 지적했다. 국내총생산(GDP) 대비 가계부채는 2분기 약 81%로 추정되며, 수도권 중저가 주택으로 매수세가 쏠리는 가운데 일부 비은행권의 유동성비율 하락도 우려 요인으로 꼽혔다.","url":"https://www.g-enews.com/article/Finance/2026/09/202609221249133348bb91c46fcd_1"},{"n":12,"title":"대출 꽉 막히자…\"대통령처럼 '집주인 대출'해 드립니다\" 고가주택 고육지책","meta":"2026.09.23 08:01 · 파이낸셜뉴스","body":"이재명 대통령의 분당 아파트 매각을 계기로 '집주인 대출' 매물이 급증하고 있다. 약 2개월 사이 관련 매물이 16건에서 265건으로 16.6배 늘었다. 집주인 대출은 매수인이 은행에서 필요 자금을 다 마련하지 못할 경우 매도인이 매매대금 일부를 나중에 받기로 하고 해당 주택에 근저당권을 설정하는 방식이다. 현재 매물 265건의 평균 호가는 29억원이며 20억원 이상이 63.4%를 차지해 대출 규제로 자금 조달이 막힌 고가주택 거래에서 집주인 대출이 편법 아닌 고육책으로 활용되고 있다. 지역별로는 서울이 187건(70.6%)으로 대부분을 차지했다.","url":"https://www.fnnews.com/news/202609230724565309"}]},{"name":"임대주택","articles":[{"n":17,"title":"전월세안심신탁사업 본격화…'현장 창구' 문 연다","meta":"2026.09.22 16:10 · 머니투데이","body":"국토교통부와 주택도시보증공사(HUG)는 22일 오후 서울 여의도에서 전·월세안심신탁센터 출범식을 열었다. 전월세 안심신탁은 HUG와 임대인·임차인이 3자 계약을 맺고 HUG가 보증금을 운용해 임대인에게 연 5%의 고정 수익을 지급하는 제도다. 새로 문을 연 센터는 사업 안내·상담부터 신청 접수, 계약 조건 심사, 약정 체결, 예치금 수납, 계약 종료 후 보증금 반환까지 전 과정을 지원하는 현장 창구 역할을 맡는다. 국토교통부 김이탁 1차관은 \"주택공급을 촉진하는 선진적인 주거 선순환 모델이 될 것\"이라고 기대감을 밝혔다.","url":"https://www.mt.co.kr/estate/2026/09/22/2026092215215237185"},{"n":18,"title":"\"5% 족쇄 풀린 등록임대 '시세대로'\"… 전세 수억씩 뛸 판 [부동산 아토즈]","meta":"2026.09.22 18:25 · 파이낸셜뉴스","body":"임대사업자 등록이 만료돼 임대료 인상률 5% 제한이 사라지면서 세입자들이 큰 폭의 보증금 인상에 직면하고 있다. 서울의 등록임대주택 41만가구 가운데 올해부터 2030년까지 19만6000여가구의 임대 의무기간이 순차적으로 끝날 예정이다. 한 세입자는 집주인으로부터 보증금 4000만원 인상을 통보받았다고 밝혔고, 다른 사례에서는 현재 5억원인 보증금이 시세인 7억원까지 2억원 넘게 오를 가능성이 제기됐다. 등록임대 말소 물량이 특히 올해와 2027~2028년에 집중돼 있어 전월세 시장 충격이 당분간 이어질 전망이다.","url":"https://www.fnnews.com/news/202609221825297948"}]},{"name":"택지/도시개발","articles":[{"n":19,"title":"\"인구는 늘고 기반시설은 후퇴\"…평택시, 고덕신도시 현안 해결 나섰다","meta":"2026.09.22 18:58 · 아시아경제","body":"평택시가 고덕국제화계획지구의 현안 해결을 위해 '민·관·공 협의체'를 구성하고 22일 첫 회의를 열었다. 시장, 국회의원, LH 관계자 등 30여명이 참석해 교통·주차, 국제학교, 체육시설, 공원·녹지 문제를 논의했다. 개발계획이 여러 차례 변경되며 계획인구는 당초보다 16% 늘었지만 입체교차로는 3곳에서 1곳으로 줄고 1인당 공원·녹지 면적은 약 29% 감소한 것이 핵심 쟁점으로 꼽혔다. 최원용 평택시장은 \"시민이 달라졌다고 체감할 때까지 끝까지 챙기겠다\"고 밝혔다.","url":"https://view.asiae.co.kr/article/2026092218581863533"}]},{"name":"분양정보","articles":[{"n":15,"title":"9월 마지막 주 전국 8개 단지, 3641가구 청약 접수","meta":"2026.09.22 15:02 · 파이낸셜뉴스","body":"9월 마지막 주 전국 8개 단지에서 총 3641가구(일반분양 1927가구) 규모의 청약이 시작된다. 주요 단지로는 경남 진주 '레이크써밋웰가', 경기 광명 '시티프라디움에듀하임', 부산 '에코델타시티 금강펜테리움' 등이 꼽힌다. 인천 계양 3기 신도시 A2·A3블록 본청약도 이 기간 포함돼 3기 신도시 중 가장 이른 2026년 12월 입주를 목표로 본격적인 공급에 나선다. 다만 추석 연휴와 개천절·한글날 등 공휴일이 이어지면서 견본주택 개관 단지는 당분간 뜸할 것으로 예상된다.","url":"https://www.fnnews.com/news/202609221454364832"},{"n":16,"title":"'7억 줍줍'에 5만명 몰렸다…철산자이 최고 경쟁률 '1만4094대 1'","meta":"2026.09.23 08:19 · 뉴스1","body":"경기 광명 '철산자이 더 헤리티지' 무순위(줍줍) 청약에 4가구 모집에 5만4626명이 몰렸다. 전용 59㎡A 3가구에는 4만2283명이 접수해 최고 1만4094.3대 1의 경쟁률을 기록했고, 전체 평균 경쟁률은 1만3656.5대 1에 달했다. 분양가 대비 시세 차익이 6억~7억원에 이를 것으로 기대되면서 22일 오전 9시부터 오후 5시30분까지 진행된 접수에 수요가 대거 몰렸다. 당첨자 발표는 오는 29~30일 이뤄질 예정이다.","url":"https://www.news1.kr/realestate/general/6299543"}]},{"name":"논설/사설","articles":[{"n":20,"title":"전세 빈자리에 쌓이는 월세 청구서 [노트북 너머]","meta":"2026.09.23 06:00 · 이투데이","body":"이 칼럼은 전세시장 축소에 따른 세입자의 주거비 부담 증가를 짚었다. 이재명 대통령이 전세가 \"사라져갈 것\"이라고 전망한 가운데 토지거래허가구역 확대와 대출 규제 강화 등의 영향으로 전세 거래량이 1년 새 약 40% 줄었다는 점을 근거로 든다. 필자는 전세와 월세가 세입자에게 같은 무게의 선택지가 아니라고 지적하며, 전세가 자연스럽게 수명을 다하는 것과 정책이 이를 인위적으로 가속화하는 것은 다른 문제라고 주장했다. 이는 기자의 개인적 견해로, 정책 속도 조절의 필요성을 촉구하는 논조다.","url":"https://www.etoday.co.kr/news/view/2628484"}]}]},{"date":"2026-09-22","count":15,"pdf_count":19,"highlights":[{"n":1,"text":"이재명 대통령 \"강남불패·부동산투기 공화국은 과거 이야기 될 것\""},{"n":6,"text":"서울 강북권 국평 전세도 10억…\"강남 피해도 전셋값 껑충\""},{"n":9,"text":"재개발·재건축 구역 거래 20% 증가…성남 수진1구역 최다"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"이재명 대통령 \"강남불패·부동산투기 공화국은 과거 이야기 될 것\"","meta":"2026.09.22 07:32 · 파이낸셜뉴스","body":"이재명 대통령은 22일 미국 뉴욕 순방 중 소셜미디어를 통해 \"강남불패, 부동산투기 공화국은 이제 과거 이야기가 될 것\"이라며 \"반드시 그래야 한다\"고 밝혔다. 앞서 지난 18일 기자회견에서는 \"잃어버린 30년을 피할 수 있도록 부동산 시장을 반드시 안정시키겠다\"고 강조한 바 있다. 대통령은 공급·규제·세제 정책을 신속하고 확고하게 집행하되 이해관계자와의 충분한 소통으로 혼란과 반발을 최소화하겠다는 방침을 재확인했다. 이는 정부의 부동산 안정화 의지를 대내외에 거듭 천명한 것으로 해석된다.","url":"https://www.fnnews.com/news/202609220727060164"},{"n":2,"title":"국토부 \"2030년까지 공적주택 119만가구 공급\"…주거안정플랜 발표","meta":"2026.09.21 14:31 · 파이낸셜뉴스","body":"김이탁 국토교통부 1차관은 21일 정부세종청사 브리핑에서 '두텁고 촘촘한 주거복지 실현을 위한 주거안정플랜'을 발표했다. 정부는 2030년까지 공적주택 119만가구를 공급하며, 이 중 77%인 92만가구를 주거 수요가 높은 수도권에 배정한다고 밝혔다. 공급 유형은 건설임대 35만호, 매입임대 31만호, 전세임대 23만호, 공공지원민간임대 5만2000호 등으로 구성된다. 국토부는 이번 계획으로 2030년 장기공공임대주택 재고가 250만호를 넘어서 전체 주택 재고 대비 비중이 10%를 돌파할 것으로 전망했다.","url":"https://www.fnnews.com/news/202609211431240100"},{"n":3,"title":"국회 국토위, 홍지선 국토부 장관 후보자 인사청문경과보고서 채택","meta":"2026.09.21 14:50 · 데일리안","body":"국회 국토교통위원회는 21일 전체회의를 열고 홍지선 국토교통부 장관 후보자에 대한 인사청문경과보고서를 여야 합의로 채택했다. 더불어민주당은 \"국토교통 분야의 높은 이해도와 현장 경험, 전문성을 바탕으로 장관 역할을 충실히 수행할 것\"이라며 적격 의견을 냈다. 반면 국민의힘은 \"자료 제출이 부실하고 대통령과의 인연을 통한 초고속 승진 인사\"라며 정책 추진력과 역량 부족을 이유로 부적격 의견을 제시했다. 여야 의견이 함께 병기된 보고서 채택으로 홍 후보자는 조만간 정식 임명될 전망이다.","url":"https://www.dailian.co.kr/news/view/1693024"}]},{"name":"시장동향","articles":[{"n":6,"title":"서울 강북권 국평 전세도 10억…\"강남 피해도 전셋값 껑충\"","meta":"2026.09.21 18:11 · 서울경제","body":"서울 성북·노원구 등 강북권 국민평형(전용 84㎡) 아파트 전세가가 잇달아 10억원을 넘어서고 있다. 한국부동산원에 따르면 올해 9월 둘째 주까지 서울 아파트 전세가격 누적 상승률은 7.79%로 지난해 같은 기간(1.66%)의 약 4.7배에 달한다. 자치구별로는 성북구가 12.84%로 가장 높았고 노원구(12.25%), 성동구(10.07%), 도봉구(9.94%), 강북구(9.88%) 순이었다. 서울 입주 물량이 지난해 3만7103가구에서 올해 2만5281가구로 31.9% 줄어든 것이 전셋값 급등의 주요 배경으로 지목된다.","url":"https://m.sedaily.com/article/20093627"},{"n":7,"title":"수도권 아파트값 19개월째 상승…거래는 줄고 미분양 부담 여전","meta":"2026.09.21 14:39 · 한국경제","body":"수도권 아파트 매매가격이 지난해 2월 이후 19개월 연속 상승세를 이어가고 있다. 8월 전국 아파트 전셋값은 0.44%, 월세는 0.42% 올랐으며 수도권은 전세 0.78%, 월세 0.68%로 전국 평균을 웃돌았다. 반면 7월 전월세 거래량은 21만975건으로 전월보다 줄었고, 월세 거래 비중이 67.6%에 달해 전세의 월세 전환이 굳어지는 모습이다. 올해 1~7월 주택 인허가는 전년 동기 대비 7.9% 감소한 반면 지방광역시 인허가는 31.6% 늘어 지역별 공급 격차도 뚜렷했다.","url":"https://www.hankyung.com/article/2026092182627"},{"n":8,"title":"건설사 폐업 1년 새 33%↑…지방 미분양에 자금난 심화","meta":"2026.09.21 11:44 · 헤럴드경제","body":"업계에 따르면 올해 9월 18일 기준 종합건설사 폐업 신고는 622곳으로 지난해 같은 기간(467곳)보다 33% 늘었다. 전문공사업까지 포함한 전체 폐업 건수는 3139곳으로 전년 동기(2465곳) 대비 27% 증가했다. 대구 3위권 건설사인 태왕이앤씨가 법정관리에 들어가는 등 지방 중소 건설사의 경영난이 두드러졌으며, 7월 말 기준 전국 준공 후 미분양 2만9152가구 중 84.5%가 지방에 몰려 있다. 업계에서는 향후 금리 인상이 현실화될 경우 자금난이 더 심화될 수 있다는 우려가 나온다.","url":"https://biz.heraldcorp.com/article/10880570"}]},{"name":"정비사업","articles":[{"n":9,"title":"재개발·재건축 구역 거래 20% 증가…성남 수진1구역 최다","meta":"2026.09.21 18:52 · 파이낸셜뉴스","body":"올해 3~8월 정비사업 구역 거래액은 2조5568억원으로 직전 6개월(2조1495억원)보다 18.9% 늘었다. 최근 1년간 거래 상위 50개 사업장의 총거래액은 4조7064억원이며 이 중 서울이 43곳(86%), 3조7676억원(80.1%)을 차지했다. 거래액이 가장 많은 곳은 경기 성남시 수진1구역(2848억원)이었고 서울 한남5구역(2601억원), 성남 신흥1구역(2452억원)이 뒤를 이었다. 조합원 지위 양도가 허용된 구역이 확대되고 자산가치 상승 기대감이 커진 점이 거래 증가의 배경으로 분석된다.","url":"https://www.fnnews.com/news/202609211851336379"},{"n":10,"title":"서울 정비사업 496곳 가동…2031년까지 31만가구 착공 목표","meta":"2026.09.21 16:20 · 글로벌이코노믹","body":"서울시는 현재 재개발·재건축 등 정비사업 496곳을 추진 중이며 2031년까지 31만가구 착공을 목표로 하고 있다고 21일 밝혔다. 이 중 신속통합기획 적용 구역은 214곳, 30만7000가구 규모이며 모아주택은 168곳, 4만3000가구 규모로 진행되고 있다. 공공재개발·재건축은 37곳(4만3000가구), 공공참여 모아타운은 23곳(1만5000가구) 규모로 확대되고 있다. 청년안심주택도 누적 3만5000가구가 공급됐으며 2030년까지 4만6000가구로 늘릴 계획이다.","url":"https://www.g-enews.com/article/Real-Estate/2026/09/202609211304533913a9fc143920_1"}]},{"name":"금융/세제","articles":[{"n":15,"title":"5대 은행 가계대출, 목표치 초과…\"신규 여력 이미 소진\"","meta":"2026.09.22 06:09 · 재경일보","body":"KB국민·신한·하나·우리·NH농협 등 5대 시중은행의 정책대출 제외 가계대출 잔액이 9월 17일 기준 652조2617억원으로 연간 목표치를 약 2000억원 초과한 것으로 나타났다. 지난달 부여된 신규 대출 여력 약 2조7800억원은 한 달도 채 되지 않아 모두 소진됐으며, 연초 이후 증가액은 7조2918억원에 달한다. 이미 목표치를 초과한 은행이 나오면서 연말까지 대출 규제 기조가 이어질 수밖에 없다는 관측이 나온다. 금융당국과 은행권은 가계부채 관리와 실수요자 대출 공급 사이의 딜레마를 풀어야 할 과제를 안고 있다.","url":"https://news.jkn.co.kr/post/992758"},{"n":16,"title":"\"9월은 종부세 절세 골든타임\"…합산배제·특례 신청 마감 임박","meta":"2026.09.22 06:00 · 이투데이","body":"국세청은 올해 종합부동산세 합산배제 및 과세특례 대상자 4만8000명에게 안내문을 발송했으며, 신청 기한은 9월 16일부터 30일까지다. 임대주택, 사원용 주택, 주택신축용 토지 등은 합산배제 신청을 통해 과세 대상에서 제외될 수 있고, 1세대 1주택자 특례 등 다양한 과세특례도 이 기간에 직접 신청해야 적용받을 수 있다. 올해부터는 부부 공동명의 1주택자의 납세의무자 선택 기준이 완화돼 지분율과 관계없이 부부가 합의해 자유롭게 납세의무자를 정할 수 있다. 국세청은 요건을 충족하지 못하면 가산세와 이자 부담이 발생할 수 있다며 홈택스의 미리채움 서비스와 모의계산 활용을 안내했다.","url":"https://www.etoday.co.kr/news/view/2628200"}]},{"name":"임대주택","articles":[{"n":14,"title":"'좁고 낡은 임대' 깬다…바닥 1등급·중형 확대한 보편형 공공임대 19만호","meta":"2026.09.21 16:24 · 세계일보","body":"정부는 21일 발표한 주거안정플랜을 통해 역세권·도심 등 선호 입지에 건설형 17만5000호와 매입형 1만8000호를 합쳐 총 19만호 규모의 '보편형 공공임대'를 신규 도입한다고 밝혔다. 보편형 공공임대는 층간소음 성능을 바닥 1등급으로 높이고 중형 평형 비중을 40%까지 확대해 기존 임대주택의 '좁고 낡다'는 인식을 개선하는 데 초점을 맞췄다. 거주 기간은 기본 6년에서 최장 20년까지 가능하며 보증금 비율도 20~100% 범위에서 자율적으로 선택할 수 있도록 했다. 노후 영구임대 1만3000호는 중대형 단지로 재건축해 품질을 높일 계획이다.","url":"https://www.segye.com/newsView/20260921513899"}]},{"name":"택지/도시개발","articles":[{"n":17,"title":"인천 용유2 도시개발구역 지정·개발계획 고시","meta":"2026.09.21 09:10 · 시사미래신문","body":"인천광역시는 21일 자로 '용유2 도시개발구역 지정 및 개발계획'을 공식 수립·고시했다. 총사업비 약 450억원 규모로 환지방식을 통해 추진되며 사업시행자로 영종구가 직접 참여한다. 계획에는 행정타운 설치와 주거시설 구성, 도로·공원 등 기반시설 확충이 담겼다. 용유 지역은 2003년 경제자유구역 지정 이후 '에잇시티', '노을빛타운' 등 개발사업이 잇달아 무산되고 2018년 경제자유구역에서 해제된 바 있어, 이번 사업은 그간의 개발 정체를 타개하기 위한 조치로 풀이된다.","url":"https://www.sisamirae.com/news/article.html?no=548775"},{"n":18,"title":"'수도권 최대 환승역' 고양 대곡역 일대 택지 지정…의왕 등 2만3000가구 공급","meta":"2026.09.21 11:00 · 뉴스핌","body":"국토교통부는 22일 경기 고양시와 의왕시 일원을 신규 공공주택지구로 지정해 총 2만3000가구를 공급한다고 21일 밝혔다. 고양대곡지식융합지구는 199만4293㎡ 규모로 2035년까지 9400가구가 조성되며, GTX-A와 3호선, 경의중앙선 등 5개 철도노선이 지나는 대곡역 일대에 들어선다. 의왕오전왕곡지구는 187만6173㎡ 규모로 2035년까지 1만4000가구가 건설되며, 과천-봉담 도시고속화도로와 2029년 개통 예정인 인덕원~동탄 복선전철 인근에 위치해 교통 접근성이 우수하다. 정부는 두 지구 모두 2029년 12월까지 주택 착공을 추진할 계획이다.","url":"https://www.newspim.com/news/view/20260921000118"}]},{"name":"분양정보","articles":[{"n":13,"title":"전국 1순위 청약 경쟁률 5.34대1…38개월 만에 최저","meta":"2026.09.21 11:02 · 서울경제","body":"8월 기준 전국 아파트 1순위 평균 청약 경쟁률(12개월 이동평균)이 5.34대1로 집계돼 2023년 6월(4.90대1) 이후 38개월 만에 최저치를 기록했다. 서울은 91.27대1로 전월(112.00대1)보다 낮아졌고, 경기는 2.36대1로 역대 최저치까지 떨어졌다. 전국 미분양 주택은 6만8217가구로 전월보다 753가구 늘었으며, 8월 서울 5개 단지에 전국 청약 신청량의 69.2%인 2만826건이 몰릴 정도로 서울 쏠림 현상이 뚜렷했다. 서울경제는 고분양가 기조와 대출 규제 여파로 분양시장 한파가 심화하고 있다고 진단했다.","url":"https://m.sedaily.com/article/20093363"}]},{"name":"논설/사설","articles":[{"n":19,"title":"[사설] 농지 정책, 현실 감안해 촘촘한 보완책 마련하길","meta":"2026.09.21 18:10 · 경향신문","body":"경향신문은 사설을 통해 정부가 농지 전수조사에 따른 농민들의 반발에 신속히 보완책을 내놓은 점을 평가하면서도 세부 기준을 더 정교하게 다듬을 필요가 있다고 지적했다. 사설은 경사지나 수리시설이 없어 사실상 경작이 불가능한 한계농지까지 일률적으로 처분을 강제하는 것은 농촌 현실과 괴리가 있다고 짚었다. 고령·질병·상속 등 불가피한 사유로 농사를 짓지 못하는 경우까지 투기로 몰아가서는 안 된다는 점도 강조했다. 사설은 농지 투기를 근절하되 실제 영농 현실을 세심하게 반영한 제도 보완이 뒤따라야 한다고 결론지었다.","url":"https://www.khan.co.kr/article/202609211810011/"}]}]},{"date":"2026-09-21","count":15,"pdf_count":30,"highlights":[{"n":1,"text":"이재명 대통령 \"부동산 시장 점차 안정될 것\"...토허제 유예로 거래 숨통도"},{"n":6,"text":"강남3구 주춤해도 서울 집값 84주째 상승…중저가 지역 상승세 확산"},{"n":13,"text":"[단독] 지방 정비사업 공사비, 부동산원 검증 후에도 46.6% 뛰었다"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"이재명 대통령 \"부동산 시장 점차 안정될 것\"...토허제 유예로 거래 숨통도","meta":"2026.09.21 07:29 · YTN","body":"이재명 대통령은 21일 방송된 인터뷰에서 부동산 시장이 점차 안정을 찾을 것이라는 전망을 밝혔다. 국토교통부가 토지거래허가구역 내 임대 중인 주택의 실거주 의무 유예 조치를 연장하면서 세입자를 낀 매물의 거래가 다소 풀릴 것이라는 기대가 나온다. 이 대통령은 언제·어디에 얼마의 물량이 공급되는지 분기·월별로 명확히 공개하는 것이 시장 신뢰 확보에 도움이 될 것이라고 말했다. 다만 대통령과 함께 출연한 전문가는 세금·대출·임대차 정책이 각각 따로 발표되는 것이 시장 혼란의 원인이라고 지적했다.","url":"https://www.ytn.co.kr/_ln/0102_202609210729476437"},{"n":2,"title":"인허가 속도 등 '닥공' 기조 그대로… 실거주 우대 큰 틀도 유지","meta":"2026.09.21 05:01 · 서울신문","body":"국토교통부 관계자는 20일 이재명 대통령이 부동산 정책의 큰 틀 변화를 언급하지 않고 '닥공'(닥치고 공급) 기조를 강조한 만큼, 이를 뒷받침하는 방안을 내부적으로 계속 논의할 것이라고 밝혔다. 정부는 인허가 절차를 줄여 공급 속도를 높이는 동시에 실거주자 우대라는 정책의 큰 틀은 그대로 유지하기로 했다. 9월 말~10월 초에는 공공택지 7만3000가구 규모의 추가 공급안을 내놓을 예정이며, 세제개편안도 원안을 그대로 유지하기로 했다. 이는 정부 방침이 잦은 보완 속에서도 기존 정책 기조는 유지된다는 점을 보여주는 사례로 풀이된다.","url":"https://www.seoul.co.kr/news/economy/2026/09/21/20260921004005?wlog_tag3=naver"}]},{"name":"시장동향","articles":[{"n":6,"title":"강남3구 주춤해도 서울 집값 84주째 상승…중저가 지역 상승세 확산","meta":"2026.09.21 07:30 · 뉴스후플러스","body":"한국부동산원이 발표한 9월 둘째 주(14일 기준) 조사에 따르면 서울 아파트값은 84주 연속 상승세를 이어갔다. 강남·서초는 6주째 하락한 반면 중랑·도봉 등 외곽 지역은 0.5% 안팎의 상승세를 보이며 중저가 지역으로 오름세가 확산되는 양상이다. 서울 전세가격도 이번 주 0.17% 올라 전주보다 상승폭이 커졌다. 국토교통부는 같은 날 토지거래허가구역 내 임대 중인 주택의 실거주 유예 신청기한을 올해 말에서 내년 말까지 연장한다고 밝혔다.","url":"https://www.newswhoplus.com/news/articleView.html?idxno=70116"},{"n":7,"title":"서울 전세 절반이 '갱신계약'…1년 새 비율 10%p 뛰었다","meta":"2026.09.21 05:05 · 뉴스1","body":"21일 국토교통부 실거래가 통계에 따르면 올해 1월부터 이달 20일까지 신고된 서울 아파트 전세 거래 중 갱신계약 비율이 1년 전보다 10%포인트 뛴 것으로 나타났다. 부동산 빅데이터 플랫폼 집계로는 19일 기준 서울 전세 물량이 총 2만3697건으로 전년 동기 대비 13.3% 줄었다. 주택 공급 부족과 서울 집값 상승세가 지속되는 데다 내년부터 실거주 중심의 세제개편이 본격 시행되는 것도 전세난을 가속화하는 요인으로 꼽힌다. 한 대학교수는 내년에는 재건축·재개발 이주 수요가 더욱 몰려 전세 시장 불안이 커질 수 있다고 내다봤다.","url":"https://www.news1.kr/realestate/general/6296583"}]},{"name":"정비사업","articles":[{"n":13,"title":"[단독] 지방 정비사업 공사비, 부동산원 검증 후에도 46.6% 뛰었다","meta":"2026.09.21 06:01 · 조선비즈","body":"21일 국회에 제출된 자료에 따르면 2021년 이후 비수도권 정비사업 76곳의 총공사비는 18조2000억원에서 24조7000억원으로, 한국부동산원의 공사비 검증을 거친 뒤에도 6조4000억원 넘게 증가한 것으로 나타났다. 이 가운데 부산 재개발 두 곳은 각각 2351억원씩 공사비가 늘었다. 정비업계에서는 지방 정비사업의 잇단 중단이 지역 주택 공급과 건설경기를 위축시킬 수 있다고 우려한다. 공사비 검증 결과의 실효성을 높이고 공사비 분쟁을 중재할 기구를 마련하는 방안이 필요하다는 지적이 나온다.","url":"https://biz.chosun.com/real_estate/real_estate_general/2026/09/21/UJFVCPXQJNBXFFMD4SIZA6LVPI/?utm_source=naver&utm_medium=original&utm_campaign=biz"},{"n":14,"title":"현대건설, 2년 연속 '정비사업 10조 클럽'…삼성물산도 추격","meta":"2026.09.21 05:22 · 서울경제","body":"현대건설이 여의도 광장아파트 38-1 재건축(공사비 5463억원), 울산 남구 B-01구역 재개발(7110억원), 대구 명륜지구 재개발(5001억원) 등 3개 사업지의 시공권을 추가로 확보하며 올해 도시정비사업 수주액 10조원을 넘어섰다. 지난해 10조5105억원을 기록했던 현대건설은 이로써 2년 연속 '10조 클럽'에 이름을 올렸다. 조합원들은 시공사 브랜드가 준공 이후 분양성과 자산가치에 영향을 미칠 수 있는 만큼 시공사 선정의 주요 기준으로 삼고 있다. 삼성물산 등 후발 건설사들도 수주액을 늘리며 뒤를 쫓고 있다.","url":"https://www.sedaily.com/article/20093199?ref=naver"}]},{"name":"금융/세제","articles":[{"n":10,"title":"'세제개편+실거주 의무 유예' 서울 아파트 매물 물꼬 터지나","meta":"2026.09.21 03:51 · 머니투데이","body":"정부가 실거주 유예 신청기한을 내년 말까지 연장하고, 기존 임대차 계약의 잔여기간뿐 아니라 갱신계약 기간까지 실거주 유예로 인정하기로 하면서 세입자가 있는 주택의 매도 부담이 줄어들 것으로 전망된다. 이에 따라 매도자는 전세 만기까지 기다리지 않고 주택을 처분할 수 있게 되고, 잠재적 매수자도 늘어나 매물이 늘어날 가능성이 있다는 분석이 나온다. 세제개편안에서 실거주 1주택자의 종합부동산세 기본공제가 14억원으로 확대되는 점도 매물 출회를 촉진하는 요인으로 꼽힌다. 다만 업계 관계자들은 실제 거래 증가 효과가 나타나기까지는 시간이 걸릴 수 있다고 보고 있다.","url":"https://www.mt.co.kr/estate/2026/09/21/2026092019502656200"},{"n":11,"title":"128억→97억…고개 숙인 압구정 아파트, 초고가 '정밀 타격' 통했나","meta":"2026.09.18 16:44 · 스트레이트뉴스","body":"강화된 대출 규제로 현금 동원 여력이 없는 매수자는 초고가 아파트 매입이 어려워지면서 압구정동 일부 단지의 신고가 대비 실거래가가 하락하는 사례가 나타나고 있다. 세금 부담도 걸림돌로 작용하는데, 정부는 당초 세제 개편안에서 9억원으로 축소하겠다고 발표했던 비거주 1주택자의 종합부동산세 기본공제를 이후 다시 완화하는 방향으로 조정했다. 전문가들은 이러한 규제 조합이 초고가 단지에 대한 '정밀 타격'으로 작용해 국지적 가격 조정을 이끈 것으로 분석한다. 다만 서울 전체 집값은 외곽 지역을 중심으로 상승세가 이어지고 있어 초고가 단지만의 국지적 현상이라는 평가도 나온다.","url":"https://www.straightnews.co.kr/news/articleView.html?idxno=311567"}]},{"name":"임대주택","articles":[{"n":20,"title":"LH, HUG와 전세임대주택 전세반환보증 협약","meta":"2026.09.21 07:54 · 위클리한국주택경제신문","body":"한국토지주택공사(LH)는 주택도시보증공사(HUG)와 전세임대주택 전세반환보증 관련 업무협약을 체결했다. 이번 협약으로 전세임대주택 보증금 보호 체계가 강화되며, 그간 여러 기관을 통해 별도로 확인해야 했던 대항력 관련 임대차 정보도 '안심전세App'을 통해 한 번에 확인할 수 있게 된다. 이성훈 LH 사장은 이번 협약을 통해 주거취약계층의 보증금을 안전하게 지키고 공공 임대주택 공급을 활성화할 수 있을 것이라고 말했다. 관련 제도는 오는 10월부터 의무화된다.","url":"https://www.arunews.com/news/articleView.html?idxno=67430"},{"n":21,"title":"HUG, '전월세 안심신탁' 안정화 정책 토론회 개최","meta":"2026.09.21 07:54 · 위클리한국주택경제신문","body":"주택도시보증공사(HUG)는 전월세 시장 안정화를 위한 정책 토론회를 열고 '전월세 안심신탁' 제도를 논의했다. 안심신탁은 전세보증금을 임대인이 아닌 공적 전월세안정화기구인 HUG에 예치·운용하는 개념으로, '전세의 월세화'라는 임대차 시장의 흐름을 반영하면서도 전세를 선호하는 임차인의 선택권도 함께 보장하는 것이 핵심이다. 최인호 HUG 사장은 안심신탁을 임차인과 임대인 모두 상생할 수 있는 제도로 만들겠다고 밝혔다. HUG는 안심신탁으로 조성된 자금이 신규 주택공급과 공공임대 확보 등 생산적인 분야로 흘러가도록 하겠다는 방침이다.","url":"https://www.arunews.com/news/articleView.html?idxno=67431"}]},{"name":"택지/도시개발","articles":[{"n":23,"title":"첫 삽 뜬 용산국제업무지구… 민간 필지 공급은 해 넘긴다","meta":"2026.09.21 06:01 · 조선비즈","body":"용산국제업무지구는 지난해 말 도로와 상하수도 등 기반시설 공사를 시작했지만, 민간 사업자에게 필지를 공급하는 절차는 사실상 멈춰 있는 상태다. 주택 공급 규모를 두고 서울시와 정부가 이견을 좁히지 못하면서 민간에 필지를 공급하는 시점과 물량이 확정되지 않고 있기 때문이다. 개발업계 관계자는 주택 수에 따라 분양수입과 사업비가 달라지는 만큼, 물량이 확정되지 않으면 민간 사업자가 사업성 검토조차 할 수 없다고 설명했다. 이에 따라 민간 필지 공급은 해를 넘겨 이뤄질 것으로 전망된다.","url":"https://biz.chosun.com/real_estate/real_estate_general/2026/09/21/3FQWDLOJ65BFPDV6FP2VGZFHIA/?utm_source=naver&utm_medium=original&utm_campaign=biz"},{"n":24,"title":"GH·SH·iH, 공공주택 평가 기준 '공급량'서 '입주 후 삶의 질'로 전환","meta":"2026.09.21 07:56 · 쿠키뉴스","body":"경기주택도시공사(GH)와 서울주택도시공사(SH), 인천도시공사(iH)는 한국주거서비스소사이어티(KHSS) 주관 세미나에서 공공주택 정책의 평가 기준을 기존 '공급량' 중심에서 '입주 후 삶의 질' 중심으로 전환해야 한다는 문제의식을 공유했다. 세미나 주제는 '공공주택 공급자를 넘어, 커뮤니티 디자이너로'였다. 참석자들은 단순한 주택 공급만으로는 사회적 고립과 돌봄 공백, 세대 단절 문제를 풀기 어렵다고 지적했다. 과거에는 택지를 확보하고 주택을 건설한 뒤 입주자를 모집하는 과정이 사업의 중심이었다면, 앞으로는 입주 이후의 생활까지 설계해야 한다는 방향이 제시됐다.","url":"https://www.kukinews.com/article/view/kuk202609210005"}]},{"name":"주택품질/안전","articles":[{"n":25,"title":"송도 럭스오션 SK뷰 피해 주민 300여 명, 인천경제청 앞 집회","meta":"2026.09.19 11:12 · 경기신문","body":"인천 송도국제도시 럭스오션SK뷰 아파트 입주민 300여 명은 18일 오전 인천경제청 앞에서 부실공사 및 하자 피해와 관련한 집회를 열었다. 앞서 이 아파트에서는 테라스 구조물이 붕괴하는 사고가 발생했으며, 입주민들은 사고가 난 테라스뿐 아니라 단지 내 유사·동일 구조물과 공용시설 전반에 대한 정밀 안전진단을 요구했다. 입주민들은 설계 변경과 감리 관련 자료의 공개도 함께 요구하며 부실 시공과 관리·감독 책임을 철저히 규명해야 한다고 주장했다. 시공사인 SK에코플랜트는 외부 전문기관의 안전진단 결과를 수용하고 개별 협상을 통해 보상하겠다는 입장을 밝힌 상태다.","url":"https://www.kgnews.co.kr/news/article.html?no=912263"}]},{"name":"분양정보","articles":[{"n":17,"title":"화성 향남 롯데캐슬 시그니처, 1500세대 대단지 분양","meta":"2026.09.21 06:12 · 소비자가 만드는 신문","body":"롯데건설은 경기 화성시 향남읍 상신리 상신3지구 일원에 '화성 향남 롯데캐슬 시그니처'를 분양한다. 단지는 지하 3층~지상 최고 29층, 17개 동, 총 1542세대 규모로 조성되며 모두 일반분양 물량이다. 전용면적별로는 84㎡ 1331세대, 102㎡ 등으로 구성돼 중형 평형 위주로 공급된다. 상신3지구는 향남읍 일대 생활 인프라와 연계된 입지로 소개되고 있다.","url":"https://www.consumernews.co.kr/news/articleView.html?idxno=764266"}]},{"name":"논설/사설","articles":[{"n":27,"title":"[사설] 부동산 이어 농지 조사도 땜질… 전면 손질이 해법","meta":"2026.09.21 00:01 · 서울경제","body":"이 사설은 국토교통부가 지난 17일 토지거래허가구역의 실거주 의무 유예 조치를 넉 달 만에 다시 손질해 내년 말까지 1년 연장한 것을 사례로 들며, 부동산 정책이 보완·수정을 반복하고 있다고 지적한다. 필자는 농지 전수조사 역시 비슷한 방식으로 땜질식 보완이 이어지고 있다고 주장한다. 사설은 잦은 정책 수정이 시장의 신뢰를 떨어뜨리고 있다며, 임기응변식 보완보다는 제도 전반의 전면적인 손질이 필요하다는 의견을 제시한다. 이는 언론사의 논평으로, 사실 확인과 별도로 필자의 주장이 담긴 글이다.","url":"https://www.sedaily.com/article/20093141?ref=naver"}]}]}],"holidays":["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-02","2026-05-01","2026-05-05","2026-05-25","2026-06-03","2026-06-06","2026-08-17","2026-09-24","2026-09-25","2026-09-26","2026-10-05","2026-10-09","2026-12-25"],"art":null};

const WD = ["일","월","화","수","목","금","토"];
const FS = [0.9, 1, 1.15, 1.3];   // 글자 크기 단계. 기본은 1(최적 크기), −로 90%, +로 115%·130%
const FS_DEFAULT = 1;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const parts = iso => { const [y,m,d] = iso.split("-").map(Number); const w = WD[new Date(y, m-1, d).getDay()]; return {y,m,d,w}; };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch(e) { return ""; } };
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const store = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} } };

let dayIdx = 0;
let fsIdx = (() => { const i = FS.indexOf(Number(store.get("dn-fs"))); return i >= 0 ? i : FS_DEFAULT; })();

function findArticle(day, n){ for (const c of day.categories) for (const a of c.articles) if (a.n === n) return {a, c}; return null; }
function firstSentence(t){ const m = t.match(/^.+?[다요]\.(?=\s|$)/); return m ? m[0] : t; }

// 그림으로 보는 오늘: 최신 날짜를 볼 때만, 그날 그림이 준비됐을 때만 보인다. 그림을 누르면 오늘의 주택 뉴스의 그 장면(#s1~#s6)으로 바로 간다.
function artStrip(day){
  const art = DATA.art;
  if (dayIdx !== 0 || !art || art.date !== day.date || !art.items || !art.items.length) return "";
  const go = it => `${esc(art.url)}#${esc(it.anchor)}`;
  return `<div class="art-b"><h3>인포그래픽 뉴스 <a href="${esc(art.url)}" target="_blank" rel="noopener">크게 보기 →</a></h3>
    <div class="strip">${art.items.map(it => `<a href="${go(it)}" target="_blank" rel="noopener"><img src="${esc(it.img)}" alt="${esc(it.cat)} 그림" loading="lazy" width="132" height="129"><span>${esc(it.cat)}</span><b>${esc(it.title)}</b></a>`).join("")}</div></div>`;
}

function cover(day, p){
  const hs = day.highlights.map(h => { const f = findArticle(day, h.n); return { text: h.text, n: h.n, cat: f ? f.c.name : "", art: f ? f.a : null }; });
  const lead = hs[0];
  const subs = hs.slice(1).map(h => `<a href="#a-${h.n}"><span class="hl-cat">${esc(h.cat)}</span><b>${esc(h.text)}</b></a>`).join("");
  return `<div class="cover">
    <div class="mast">
      <div class="mast-top"><span class="logo"><img src="${LOGO}" alt="한국주택협회 Korea Housing Association"></span></div>
      <div class="mast-row"><b>Daily News</b><span>${p.y}.${pad(p.m)}.${pad(p.d)} (${p.w})</span></div>
    </div>
    <div class="lead">
      <div class="lead-cat">오늘의 핵심 · ${esc(lead.cat)}</div>
      <h2>${esc(lead.text)}</h2>
      ${lead.art ? `<p>${esc(firstSentence(lead.art.body))}</p>` : ""}
      <a class="more" href="#a-${lead.n}">기사 전체 보기 →</a>
    </div>
    <div class="subs">${subs}</div>
    ${artStrip(day)}
    <div class="foot"><span class="stats">기사 ${day.count}건 · ${day.categories.length}개 분야</span></div>
  </div>`;
}

function applyFs(){
  document.documentElement.style.setProperty("--fs", FS[fsIdx]);
  $("#fsDown").disabled = fsIdx === 0;
  $("#fsUp").disabled = fsIdx === FS.length - 1;
  $("#fsLabel").setAttribute("aria-label", `글자 크기 ${Math.round(FS[fsIdx] * 100)}%`);
}

function render(){
  const day = DATA.days[dayIdx];
  const p = parts(day.date);
  document.title = `Daily News ${p.m}.${p.d}(${p.w}) · 주택·부동산`;

  // 안내 띠: 지난 날짜를 보는 중이거나, 오늘 자료가 아직 없을 때
  const today = new Date(); const tIso = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  const latest = DATA.days[0];
  const isWorkday = today.getDay() > 0 && today.getDay() < 6 && !(DATA.holidays || []).includes(tIso);
  let notice = "";
  if (dayIdx > 0) notice = `<div class="notice"><span>지난 뉴스를 보고 있습니다 · ${p.m}월 ${p.d}일(${p.w})</span><button type="button" data-go="0">최신 뉴스로</button></div>`;
  else if (latest.date !== tIso && isWorkday && today.getHours() >= 10) { const lp = parts(latest.date); notice = `<div class="notice"><span>오늘 뉴스가 아직 올라오지 않았습니다. 지금은 ${lp.m}월 ${lp.d}일(${lp.w}) 뉴스입니다.</span></div>`; }
  $("#notice").innerHTML = notice;

  $("#cover").innerHTML = cover(day, p);

  $("#catnav").innerHTML = day.categories.map((c, i) => `<a class="chip" href="#s-${i}" data-i="${i}">${esc(c.name)}<span>${c.articles.length}</span></a>`).join("");
  $("#list").innerHTML = day.categories.map((c, i) => `<section class="sec" id="s-${i}" data-i="${i}">
      <h2 class="sec-h"><b>${esc(c.name)}</b><span>${c.articles.length}건</span></h2>
      ${c.articles.map(a => `<article class="card" id="a-${a.n}">
        <h3>${esc(a.title)}</h3>
        <div class="meta">${esc(a.meta)}</div>
        <p>${esc(a.body)}</p>
        <a class="src" href="${esc(a.url)}" target="_blank" rel="noopener">원문 보기 <small>${esc(host(a.url))}</small>${arrow}</a>
      </article>`).join("")}
    </section>`).join("");

  watchSections();
}

let io;
function watchSections(){
  if (io) io.disconnect();
  const chips = [...document.querySelectorAll(".chip")];
  io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      const i = e.target.dataset.i;
      chips.forEach(c => c.classList.toggle("on", c.dataset.i === i));
      const on = chips[i]; if (on) on.parentElement.scrollTo({left: on.offsetLeft - 16, behavior: "smooth"});
    });
  }, {rootMargin: "-120px 0px -65% 0px"});
  document.querySelectorAll(".sec").forEach(s => io.observe(s));
}

function openSheet(){
  $("#days").innerHTML = DATA.days.map((d, i) => { const p = parts(d.date); return `<li><button type="button" data-go="${i}" class="${i === dayIdx ? "cur" : ""}">
    <div>${p.m}월 ${p.d}일 (${p.w})${i === 0 ? "<em>최신</em>" : ""}</div><span>기사 ${d.count}건</span></button></li>`; }).join("");
  $("#scrim").hidden = false; $("#sheet").hidden = false;
  const cur = $("#days .cur"); if (cur) cur.focus();
}
function closeSheet(){ $("#scrim").hidden = true; $("#sheet").hidden = true; $("#btnPast").focus(); }

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { dayIdx = +go.dataset.go; closeSheet(); render(); window.scrollTo({top: 0}); }
});
function stepFs(d){ fsIdx = Math.min(FS.length - 1, Math.max(0, fsIdx + d)); store.set("dn-fs", FS[fsIdx]); applyFs(); }
$("#fsDown").addEventListener("click", () => stepFs(-1));
$("#fsUp").addEventListener("click", () => stepFs(1));
$("#btnPast").addEventListener("click", openSheet);
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
$("#toTop").addEventListener("click", () => window.scrollTo({top: 0, behavior: "smooth"}));
applyFs();
render();
</script>

</body></html>
