<script>
const DATA = {"days":[{"date":"2026-11-26","count":15,"pdf_count":21,"highlights":[{"n":1,"text":"李 대통령 \"중산층도 사는 공적주택\"…2030년까지 年 24만가구 공급"},{"n":7,"text":"아파트 전세난, 경기 주요 지역으로 확산"},{"n":10,"text":"서울시 \"주택공급 늘리려면 정비사업 규제부터 풀어야\""}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"李 대통령 \"중산층도 사는 공적주택\"…2030년까지 年 24만가구 공급","meta":"2026.11.25 17:46 · 한국경제","body":"이재명 대통령은 25일 서울 은평구청에서 공적주택 현장간담회를 열고 공공임대주택이 위치·면적·품질 면에서 중산층도 선택할 수 있는 주거 사다리 역할을 해야 한다고 밝혔다. 정부는 2030년까지 임대와 분양을 합친 공적주택을 연평균 24만가구 공급하기로 했는데, 이는 최근 10년 평균인 16만가구보다 50% 많은 규모다. 국토교통부는 공적주택 투자 규모를 올해 21조원에서 내년 30조원으로 늘리고 부지 확보 기간을 기존 44개월에서 최장 15개월로 단축하겠다고 보고했다. 홍지선 국토부 장관은 2030년까지 공적주택 119만호를 공급해 공적임대주택 재고를 250만호 이상으로 늘리겠다는 계획도 함께 보고했다.","url":"https://www.hankyung.com/article/2026112503571"},{"n":2,"title":"LH, 2030년까지 수도권 공공주택 50만호 착공…아파트 발주 182조로 확대","meta":"2026.11.25 17:16 · 뉴스1","body":"한국토지주택공사(LH)는 2026~2030년 수도권에서 건설형 공공주택 등 약 49만7000가구를 착공하는 계획을 보고했다. 같은 기간 아파트 공사 발주 예정액은 시공 170조원과 설계 등 12조원을 더해 182조원으로, 직전 5년간 발주액 31조원의 약 6배 수준이다. 공공택지에 37만7000호, 도심에 12만호를 착공하는 구성이며 연도별 발주액은 올해 17조원, 내년 25조원, 2028~2030년 연평균 47조원으로 늘어난다. LH는 조사·감정평가·이주 절차를 개선해 부지 확보 기간을 44개월에서 15개월로 줄이겠다고 밝혔다.","url":"https://www.news1.kr/politics/president/6365753"},{"n":3,"title":"공공주택 50만채 중 38만채는 2년 뒤 착공…전월세난 해소엔 한계","meta":"2026.11.26 04:33 · 동아일보","body":"정부가 2030년까지 수도권에 공공주택 50만채를 착공하겠다고 25일 밝혔다. 다만 연도별 계획을 보면 2027년 6만9000채, 2028~2030년 38만2000채로 전체의 76% 이상이 2년 뒤부터 착공될 예정이다. 착공에서 준공까지 2년 안팎이 걸리는 점을 감안하면 당장의 수도권 전월세난을 풀기에는 한계가 있다는 지적이 나온다. 전문가들은 공급 계획을 연도별로 더 구체화하고 실제 집행 속도를 높여야 시장 신뢰를 얻을 수 있다고 지적했다.","url":"https://www.donga.com/news/Politics/article/all/20261126/135092285/2"}]},{"name":"시장동향","articles":[{"n":7,"title":"아파트 전세난, 경기 주요 지역으로 확산","meta":"2026.11.25 20:30 · 세계일보","body":"서울에서 시작된 아파트 전세난이 경기 주요 지역으로 번지고 있다. 한국부동산원에 따르면 11월 셋째 주 기준 경기 아파트 전셋값은 올해 들어 6.88% 올라 지난해 같은 기간 상승률(1.29%)의 5배를 웃돌았다. 광명(16.23%)·화성 동탄(16.06%)·용인 기흥(14.26%)·하남(12.49%)·구리(10.92%) 등이 두 자릿수 상승률을 기록했고 남양주·양주·의정부 등 경기 북부도 오름세가 뚜렷했다. 올해 1~9월 서울에서 경기로 옮긴 인구가 1년 전보다 5% 늘어난 점도 전세 수요를 키운 요인으로 꼽힌다. 전문가들은 전세 공급을 늘릴 정책이 없으면 월세 전환 압력과 주거비 부담이 더 커질 것으로 봤다.","url":"https://www.segye.com/newsView/20261125515373"},{"n":8,"title":"지방까지 번진 전세난…분양사무소 앞에 늘어선 텐트","meta":"2026.11.26 06:00 · 시대일보","body":"서울에서 시작된 전세난이 부산 등 지방 광역시로 확산되고 있다. 부산 가야역 롯데캐슬 스카이엘 분양사무소 앞에는 선착순 전세 계약을 하려는 100팀가량이 텐트를 치고 대기했다. 경기 지역 아파트 전세 매물도 1년 전보다 약 29% 줄어 수도권에서도 물량 부족이 이어지고 있다. 대출 규제 강화로 신규 임대 물량이 줄면서 세입자의 주거비 부담이 커지고 있으며, 전문가들은 월세 전환 흐름이 당분간 이어질 것으로 전망했다.","url":"https://www.sidae.com/article/2026112513072428178"}]},{"name":"정비사업","articles":[{"n":10,"title":"서울시 \"주택공급 늘리려면 정비사업 규제부터 풀어야\"","meta":"2026.11.25 20:38 · 서울신문","body":"서울시가 25일 국토교통부를 향해 금융규제와 거래 제한, 과도한 비용 부담 등 정비사업의 걸림돌부터 풀어야 한다고 촉구했다. 오세훈 서울시장은 전날 조합원 지위양도 제한 완화와 이주비 대출규제 개선, 재건축초과이익환수제 전면 재검토를 건의했다. 명노준 서울시 주택실장은 규제 완화를 발표해도 현장에서 작동하지 않으면 개선이 아니라며 착공과 입주를 막는 규제의 과감한 손질을 요구했다. 서울시는 재건축초과이익환수제가 제정 취지와 달리 집값 상승과 사업 여건 악화로 주택공급을 위축시키는 부작용이 크다는 입장이다.","url":"https://www.seoul.co.kr/news/politics/2026/11/25/20261125500334"},{"n":11,"title":"국토부 \"조합원 지위양도 완화는 신중히\"…서울시 요구에 선 긋기","meta":"2026.11.25 15:39 · 아시아경제","body":"국토교통부는 25일 보도설명자료를 내고 오세훈 서울시장이 요청한 조합원 지위양도 규제 완화에 신중해야 한다는 입장을 밝혔다. 국토부는 이 규제가 정비사업 투기 수요 유입을 억제하고 정비구역 내 집값이 지나치게 과열되지 않도록 하는 데 기여한다고 설명했다. 1세대 1주택자로 10년 보유·5년 거주한 조합원과 불가피하게 주거를 옮겨야 하는 조합원 등에 대해서는 이미 예외를 인정하고 있어 추가 완화는 어렵다고 했다. 재건축초과이익환수제도 사회적 형평을 고려해 현행 제도를 유지하되, 이주비 대출규제는 금융위원회와 협의해 일부 개선하기로 했다.","url":"https://view.asiae.co.kr/article/2026112515395539099"}]},{"name":"금융/세제","articles":[{"n":13,"title":"가계대출 평균금리 5% 돌파…주담대 4.98%로 14년 7개월 만에 최고","meta":"2026.11.25 12:00 · 파이낸셜뉴스","body":"한국은행이 발표한 10월 금융기관 가중평균금리에 따르면 은행 가계대출 평균금리가 연 5.02%로 올라 2023년 11월 이후 2년 11개월 만에 5%를 넘어섰다. 주택담보대출 금리는 연 4.98%로 전월보다 0.10%포인트 올라 6개월 연속 상승했고, 이는 2012년 3월(5.00%) 이후 가장 높은 수준이다. 고정형 주담대 금리는 연 5.13%로 13개월 연속 올라 통계 작성 이후 가장 긴 상승 기록을 이어갔다. 신규 주담대 가운데 고정금리 비중은 38.1%로 전월(34.2%)보다 3.9%포인트 확대됐다. 한국은행은 단기 시장금리 상승이 가계대출과 기업대출 금리를 함께 밀어올렸다고 설명했다.","url":"https://www.fnnews.com/news/202611251011333132"}]},{"name":"임대주택","articles":[{"n":14,"title":"GH, 전세임대 전세사기 피해 공식 사과…\"피해자 구제 최우선\"","meta":"2026.11.25 23:31 · 아주경제","body":"경기주택도시공사(GH)가 기존주택 전세임대 사업에서 발생한 전세사기 피해에 대해 25일 공식 사과했다. GH는 지난 6월 임대인과 2억원 규모의 전세계약을 맺고 10월에 잔금 1억6000만원을 지급했으나 임대인이 그날로 연락을 끊었다. 기존 세입자도 보증금을 돌려받지 못해 입주 예정자가 계약한 집에 들어가지 못하는 피해가 발생했다. GH는 대체 주거지 신속 제공과 보증금 회수 지원을 약속하면서 내부 관리체계와 업무처리 절차를 전반적으로 점검·개선하겠다고 밝혔다.","url":"https://www.ajunews.com/view/20261125232208757"},{"n":15,"title":"추미애 경기지사, GH 전세사기에 긴급 조사 지시","meta":"2026.11.25 18:35 · 한국경제","body":"추미애 경기도지사가 25일 경기주택도시공사(GH) 전세임대 사업에서 발생한 전세사기 피해에 대해 긴급 조사를 지시했다. GH는 입주 가능 여부를 미리 확인하지 않은 채 전세보증금 잔금 1억6000만원을 지급했고, 임대인은 잔금을 받은 뒤 연락이 끊겼다. 기존 세입자와 입주 예정자 모두 보증금을 돌려받지 못한 상태다. 추 지사는 주택 전문 공기업에서 발생한 전세사기는 중대한 사안이라며 원인 조사와 피해자 구제, 유사 사례 전수조사 등 5개 항목의 대응을 주문했다.","url":"https://www.hankyung.com/article/2026112501771"}]},{"name":"택지/도시개발","articles":[{"n":17,"title":"LH 미분양 매입확약, 도입 2년여간 착공률 42% 그쳐","meta":"2026.11.25 11:02 · 뉴스토마토","body":"LH가 2024년 8월 미분양 매입확약 제도를 도입한 뒤 53개 필지 3만1000가구에 매입확약을 맺었지만 실제 착공은 25개 필지 1만3000가구로 42%에 그쳤다. 주택도시보증공사(HUG)의 '안심 환매'도 9월까지 목표 6000가구 중 972가구만 승인돼 16% 수준에 머물렀다. 이재명 대통령이 제도 확대를 주문했지만 업계에서는 자재비 상승과 시장 불확실성 탓에 착공 결정을 미루는 곳이 많다고 보고 있다. LH는 요건을 갖춘 사업장에 대해 매입가를 분양가의 최대 92%까지 올렸다.","url":"https://www.newstomato.com/ReadNews.aspx?no=1321777"},{"n":18,"title":"공공택지 보상금 최대 30% 더 준다지만…공급 기간 단축 효과는 미지수","meta":"2026.11.26 06:00 · 뉴스핌","body":"정부가 공공주택지구 사업 속도를 높이기 위해 보상에 협조한 주민에게 장려금을 주기로 했다. 사업시행자의 지장물 조사에 응하고 보상계약을 맺은 뒤 4개월 안에 건물이나 시설을 넘기면 지장물 보상액의 최대 30%를 추가로 받는다. 이 제도는 내년 3월 9일 이후 처음 보상 협의를 요청하는 공공주택지구 조성사업부터 적용된다. 다만 토지 보상은 대상에서 빠져 있고 협의가 결렬되면 수용재결과 행정소송까지 2년 이상 걸릴 수 있어 공급 기간 단축 효과는 제한적이라는 지적이 나온다.","url":"https://www.newspim.com/news/view/20261125001128"}]},{"name":"분양정보","articles":[{"n":19,"title":"'해링턴 플레이스 문래' 1순위 마감…101가구에 1086명 몰려","meta":"2026.11.25 14:55 · EBN","body":"효성중공업이 서울 영등포구 문래동에 짓는 '해링턴 플레이스 문래'가 1순위 청약에서 일반공급 101가구에 1086건이 접수돼 평균 10.75대 1의 경쟁률을 기록했다. 전용 84㎡A형은 51가구 모집에 707건이 몰려 13.86대 1로 가장 높았고 B·C형도 7.4대 1 안팎을 나타냈다. 당첨자 발표는 12월 2일, 계약은 12월 14~16일에 진행된다. 이 단지는 지상 29층 218가구 규모로 2030년 3월 준공 예정이며 지하철 4개 역을 걸어서 이용할 수 있는 입지다.","url":"https://www.ebn.co.kr/news/articleView.html?idxno=1732983"}]},{"name":"논설/사설","articles":[{"n":20,"title":"[사설] 강남 누르자 뛴 빌라, 주거 사다리의 붕괴","meta":"2026.11.26 04:00 · 머니투데이","body":"머니투데이는 강남 고가 아파트 가격 하락이 거래 부진에 따른 착시일 수 있다고 지적했다. 강남 진입 규제로 밀려난 수요가 외곽 아파트를 거쳐 빌라 시장으로 흘러가는 풍선효과가 나타나고 있다는 것이다. 빌라 매매가와 전·월세가 함께 뛰면서 무주택 서민의 주거 사다리가 무너지고 있다고 비판했다. 사설은 수요 억제책 대신 주택 공급 확대와 임대시장 활성화, 실수요자 지원으로 정책 무게중심을 옮겨야 한다고 주문했다.","url":"https://www.mt.co.kr/opinion/2026/11/26/2026112513561795632"},{"n":21,"title":"[사설] 아파트 공급 절벽까지…지역 부동산시장 회생 대책 없나","meta":"2026.11.26 05:10 · 부산일보","body":"부산일보는 부산 부동산시장이 주거용 공급 절벽과 상업용 장기 침체라는 이중고를 겪고 있다고 지적했다. 2028년 부산 아파트 입주 물량이 19년 만에 최저 수준으로 떨어질 것으로 전망된다는 점을 근거로 들었다. 정부가 수도권 집값 억제에만 집중하면서 지역 부동산시장이 무너진다는 경고음을 외면했다고 비판했다. 사설은 지방 특성을 반영한 맞춤형 부동산 정책과 금융·세제 지원이 시급하다고 주장했다.","url":"https://www.busan.com/view/busan/view.php?code=2026112518062593596"}]}]},{"date":"2026-11-25","count":15,"pdf_count":22,"highlights":[{"n":1,"text":"李 대통령 \"사줄 테니 분양 걱정 말고 지어라\"…미분양 매입확약 속도전 지시"},{"n":4,"text":"서울 아파트 매물 8만건 넘었는데 거래는 9개월 만에 최저"},{"n":9,"text":"3년 6개월 걸리던 조합설립, 4개월로…서울시 공정촉진 성과 공개"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"李 대통령 \"사줄 테니 분양 걱정 말고 지어라\"…미분양 매입확약 속도전 지시","meta":"2026.11.24 10:55 · 아시아경제","body":"이재명 대통령이 24일 국무회의에서 수도권 주택 공급 공백을 줄이기 위해 미분양 주택에 대한 공공기관 매입확약 제도를 신속히 추진하라고 지시했다. 이 대통령은 현재 부동산 시장을 거래량은 줄고 매물은 늘어나는 국면으로 진단하면서 강남·서초·송파 등 핵심지역의 가격 조정이 상당히 진행됐다고 언급했다. 인허가를 받고도 집값 하락 우려와 프로젝트파이낸싱(PF) 어려움으로 착공에 들어가지 못한 물량이 약 21만9000가구에 이른다는 점도 지적했다. 홍지선 국토교통부 장관은 LH와 협의해 미분양 주택 매입 확약을 확정하고 있다고 보고했다. 정부는 내년 상반기 착공 사업장에 매입가를 높여주는 인센티브도 검토 중이다.","url":"https://view.asiae.co.kr/article/2026112410501298560"},{"n":2,"title":"오세훈 시장 \"집 지으라면서 짓는 길 막아\"…정비사업 규제 완화 서면 건의","meta":"2026.11.24 14:39 · 이데일리","body":"오세훈 서울시장이 24일 국무회의 참석 후 브리핑을 열고 주택 공급 확대를 위한 규제 완화를 정부에 요구했다. 오 시장은 이주비 대출 규제와 조합원 지위 양도 제한, 재건축초과이익환수제 전면 재검토 등을 담은 서면 건의안을 전달했다고 밝혔다. 서울 시내 재건축 사업장 53곳의 재건축부담금이 총 4조4000억원으로 조합원 1인당 평균 1억7000만원을 웃돈다는 점을 근거로 들었다. 남산 곤돌라와 세운4구역 재개발처럼 장기간 멈춰 선 사업장의 금융비용 문제도 함께 거론했다. 오 시장은 홍지선 국토교통부 장관에게 조속한 면담을 요청했고, 홍 장관은 검토하겠다고 답했다.","url":"https://www.edaily.co.kr/News/Read?mediaCodeNo=257&newsId=03227526645649000"},{"n":3,"title":"내년 3월부터 주택조합·리모델링도 조합원 20% 요구 시 공사비 검증 의무","meta":"2026.11.24 09:09 · 아시아경제","body":"국토교통부가 주택조합사업 등 공사비 검증 기준 제정안을 행정예고하면서 내년 3월 9일부터 주택조합과 공동주택 리모델링 사업에도 공사비 검증이 의무화된다. 조합원 또는 공동주택 소유자 20% 이상이 요구하면 조합은 한국부동산원 등 전문기관에 검증을 의뢰해야 한다. 사업계획승인 전 시공사를 선정한 경우 공사비가 10% 이상, 승인 이후 선정한 경우 5% 이상 증액되면 자동으로 검증 대상이 되고, 검증을 마친 뒤 3% 이상 추가 인상돼도 다시 검증을 받아야 한다. 조합은 요건 충족 후 30일 이내에 신청해야 하며 검증기관은 60~75일 안에 결과를 통보해야 한다. 제도 시행 전 공사비 계약을 체결한 기존 사업장도 요건에 해당하면 적용을 받는다.","url":"https://view.asiae.co.kr/article/2026112409091903406"}]},{"name":"시장동향","articles":[{"n":4,"title":"서울 아파트 매물 8만건 넘었는데 거래는 9개월 만에 최저","meta":"2026.11.24 16:21 · 뉴스토마토","body":"부동산 빅데이터 업체 아실에 따르면 24일 기준 서울 아파트 매매 매물은 8만1932건으로 연초 5만7001건보다 43.7% 늘었다. 반면 9월 서울 아파트 매매 거래량은 3431건에 그쳐 9개월 만에 가장 적은 수준으로 떨어졌다. 가격도 강남·서초가 15주째, 송파가 11주째 하락하며 약세가 한강 벨트로 번지고 있다. 현장에서는 집주인들이 호가를 1억~2억원씩 낮춰 내놓지만 대출 규제로 매수 문의가 예전의 절반에도 못 미친다는 반응이 나온다. 같은 기간 전세 매물은 2만2082건으로 연초보다 적고 전셋값은 11월 셋째 주 0.14% 올라 매매·전세 시장이 엇갈리고 있다.","url":"https://www.newstomato.com/ReadNews.aspx?no=1321682"},{"n":5,"title":"집값 오를 것이란 기대, 8개월 만에 가장 큰 폭으로 꺾였다","meta":"2026.11.24 18:21 · 세계일보","body":"한국은행이 24일 발표한 11월 소비자동향조사에서 주택가격전망지수는 118로 전월 124보다 6포인트 떨어졌다. 이는 올해 3월 12포인트 하락 이후 8개월 만의 최대 낙폭으로, 지난 5월 이후 가장 낮은 수준이다. 한국은행 관계자는 강남·서초 등 서울 일부 지역의 가격 하락 인식과 정부 공급 대책·규제, 금리 상승이 복합적으로 작용했다고 설명했다. 소비자심리지수(CCSI)도 103.1로 전월 대비 2.3포인트 내리며 두 달 연속 하락했다. 현재경기판단 지수가 4포인트 떨어져 가장 큰 낙폭을 기록했다.","url":"https://www.segye.com/newsView/20261124516149"}]},{"name":"정비사업","articles":[{"n":9,"title":"3년 6개월 걸리던 조합설립, 4개월로…서울시 공정촉진 성과 공개","meta":"2026.11.24 11:22 · 한국경제","body":"서울시가 정비사업 공정촉진 방식을 적용한 4개 구역(6132가구)에서 구역 지정 후 평균 172일 만에 조합설립 인가가 났다고 24일 밝혔다. 기존에는 평균 3년 6개월이 걸리던 절차로, 송파 한양1차가 112일로 가장 짧았고 금천 독산2구역 141일, 동작 사당17구역 211일, 관악 신림8구역 223일이 뒤를 이었다. 구역 지정 전에 추진위원회 구성과 정관 준비, 정비업체 선정 등을 미리 진행할 수 있게 규제를 풀고 행정 절차를 병행 처리한 결과다. 송파 한양1차는 착공 목표 시점이 2032년 4월에서 2031년 11월로 5개월 앞당겨졌다. 서울시는 현재 명일10구역, 미아동 130 일대 등 11개 구역 약 2만1000가구가 조합설립을 준비 중이라고 설명했다.","url":"https://www.hankyung.com/article/202611246535i"},{"n":10,"title":"목동 첫 3조원대 시공권…목동7단지 25일 입찰공고","meta":"2026.11.24 14:28 · 머니투데이방송","body":"서울 양천구 목동신시가지 7단지 재건축 조합이 25일 시공사 선정 입찰공고를 내기로 했다. 총 공사비는 3조553억원, 3.3㎡당 1020만원 수준으로 목동 재건축 단지 가운데 처음으로 3조원대 시공권이 걸렸다. 현장설명회는 12월 3일, 입찰 마감은 2027년 1월 18일이며 컨소시엄 구성은 금지된다. 현재 최고 15층 2550가구를 최고 49층 4341가구로 다시 짓는 계획이다. 업계에서는 목동 여러 단지의 입찰 일정이 겹쳐 현대건설의 단독 입찰 가능성도 거론된다.","url":"https://news.mtn.co.kr/article/2026112414264797951"}]},{"name":"금융/세제","articles":[{"n":14,"title":"분당 선도지구 8곳 대표, 재초환 폐지 공동성명 낸다","meta":"2026.11.24 16:16 · 파이낸셜뉴스","body":"경기 성남 분당 재건축 1·2차 선도지구 8곳(총 2만2459가구) 대표들이 오는 28일 재건축초과이익환수제 폐지를 요구하는 공동성명을 발표하기로 했다. 서울 이외 지역에서 선도지구 단위의 공동성명이 나오는 것은 처음이다. 성명에는 미실현 이익에 기반한 징벌적 부담금 부과와 그로 인한 주민 불안, 재건축 지연 우려를 담을 예정이며 재초환 폐지법을 발의한 국민의힘 김은혜 의원도 참석한다. 수원 영통2구역과 과천 주공4·5·8·9단지, 광명 철산주공8·9단지 등도 이미 억대의 부담금 예정액을 통보받았다. 양지마을 등 분당 단지들은 부담금 규모가 확정되지 않은 불확실성이 성명의 배경이라고 설명했다.","url":"https://www.fnnews.com/news/202611241552460296"}]},{"name":"임대주택","articles":[{"n":15,"title":"전세 가구 5년 새 25만 줄어 300만 밑으로…월세는 100만 가구 늘었다","meta":"2026.11.24 12:00 · 한국경제","body":"국가데이터처 인구주택총조사에 따르면 지난해 전세로 사는 가구는 약 299만8000가구로 2020년 325만2000가구보다 25만4000가구 줄어 300만 가구 아래로 내려갔다. 같은 기간 월세 가구는 490만5000가구에서 584만9000가구로 100만 가구 가까이 늘었다. 전체 가구에서 차지하는 비중은 월세 26%, 전세 13.3%로 네 가구 중 한 가구가 월세에 살고 있는 셈이다. 정부 관계자는 목돈 마련 부담과 전세보증금을 돌려받지 못할 수 있다는 불안이 전세 감소의 배경이라고 설명했다. 서울은 월세 비중이 33.7%로 전국에서 가장 높고 자가 비중은 42%로 가장 낮았다.","url":"https://www.hankyung.com/article/202611246552i"},{"n":16,"title":"LH 공공전세, 든든전세로 편입…최장 8년 거주에 분양전환 기회도","meta":"2026.11.25 06:00 · 뉴스핌","body":"한국토지주택공사(LH)가 2021~2022년 한시 사업으로 공급한 공공전세주택에 든든전세 규정을 적용하기로 했다. 이에 따라 입주자는 거주 기간을 기존 6년에서 최장 8년까지 늘릴 수 있고, 자격을 충족하면 살고 있는 주택을 매입할 기회도 얻는다. 분양전환 가격은 최초 입주자 모집 당시와 분양전환 당시의 감정평가금액을 산술평균해 정한다. 분양전환 자격이 확정된 뒤에는 소득·자산 기준을 넘더라도 매입이 가능하다. LH 관계자는 공공전세와 든든전세 모두 전세형 매입임대주택에 포함돼 전환 규모를 따로 집계하기는 어렵다고 설명했다.","url":"https://www.newspim.com/news/view/20261124000876"}]},{"name":"택지/도시개발","articles":[{"n":18,"title":"공공택지 건물 4개월 안에 넘기면 보상금 30% 더 받는다","meta":"2026.11.24 17:15 · 한국경제","body":"국토교통부가 공공주택 특별법 시행령·시행규칙 개정안을 24일부터 2027년 1월 4일까지 입법예고했다. 기본조사에 협조하고 보상 협의계약을 맺은 뒤 4개월 안에 지장물 인도·이전을 마친 주민에게 보상액의 최대 30%를 현금으로 더 주는 협조장려금이 신설된다. 중앙도시계획위원회 심의 없이 도심복합지구를 지정할 수 있는 면적 기준은 5만㎡에서 10만㎡로 늘리고, 사업성이 부족한 복합지구는 건축물 높이 제한을 최대 2배까지 완화한다. 한국자산관리공사가 공공주택사업을 시행할 때 적용되던 면적 제한 규정도 삭제한다. 공공재개발 원주민이 인근 공공임대주택에 우선 입주할 수 있는 물량 한도는 30%를 넘겨 적용할 수 있게 된다.","url":"https://www.hankyung.com/article/2026112476061"}]},{"name":"주택품질/안전","articles":[{"n":19,"title":"정부는 공사비 검증 강화, 서울시는 완화…엇갈린 신호에 조합 피해 우려","meta":"2026.11.25 06:00 · 아시아투데이","body":"서울시가 지난 12일부터 시행한 개정 공공지원 정비사업 시공자 선정기준에서 공사비 검증 의무를 임의 규정으로 바꿨다. 기존에는 사업시행계획인가 이후 증빙서류를 갖춰 검증을 요청해야 했지만, 이제는 대의원회 의결로 검증 여부를 정할 수 있다. 2031년까지 31만 가구 착공 목표를 달성하기 위해 절차를 줄이겠다는 취지다. 반면 정부는 지난 9월 주택법 개정으로 공사비 의무검증을 강화하는 방향으로 움직여 왔다. 전문가들은 건설사가 법정 의무검증 기준 아래에서 편법으로 공사비를 올릴 여지가 생겨 조합원 피해로 이어질 수 있다고 지적했다.","url":"https://www.asiatoday.co.kr/kn/view.php?key=20261124010009310"}]},{"name":"분양정보","articles":[{"n":20,"title":"잠실 래미안아이파크 재공급 3가구에 6만3950명…평균 2만 대 1","meta":"2026.11.25 06:30 · 한국경제","body":"서울 송파구 잠실 래미안아이파크의 계약 취소 주택 3가구 재공급 청약에 6만3950명이 몰려 평균 2만 대 1이 넘는 경쟁률을 기록했다. 일반공급 2가구에 5만3447명이 신청했고 전용 59㎡A는 3만3125대 1, 전용 43㎡는 2만322대 1이었다. 전용 84㎡ 1가구를 배정한 신혼부부 특별공급에도 1만503명이 접수했다. 전용 84㎡D 분양가는 18억5607만원으로, 지난 7월 43억원에 거래된 같은 면적 입주권과 비교하면 차이가 크다. 당첨자는 27일 발표되며 계약금 30%와 잔금 70%를 30일 안에 내야 해 자금 조달 부담이 크다.","url":"https://www.hankyung.com/article/2026112461756"},{"n":21,"title":"광화문 옆 경희궁 에피트, 국민평형 분양가 25억원대","meta":"2026.11.25 06:00 · 머니투데이방송","body":"HL디앤아이한라가 서울 종로구 교남동 돈의문2재정비촉진구역에 짓는 경희궁 에피트가 25일 특별공급을 시작으로 청약에 들어간다. 총 228가구 가운데 134가구를 일반분양하며 전용 84㎡ 최고 분양가는 25억7484만원, 59㎡는 18억9843만원, 39㎡는 11억8241만원이다. 인근 경희궁자이 2단지 시세가 27억원 수준이어서 차이가 1억~2억원에 그친다는 점이 부담으로 꼽힌다. KB국민은행 전문가는 도심·여의도·강남 접근성이 좋아 청약 수요는 있을 것으로 봤다. 다만 대출 규제로 자금 조달이 쉽지 않고 입주까지 3~4년이 걸리는 만큼 장기 전망을 따져봐야 한다는 조언이 나왔다.","url":"https://news.mtn.co.kr/article/2026112415305085868"}]},{"name":"논설/사설","articles":[{"n":22,"title":"[사설] 재초환 부담금, 도심 주택공급 걸림돌 돼선 곤란","meta":"2026.11.25 04:00 · 대한경제","body":"재건축초과이익환수제에 따른 부담금 예정액이 조합원 1인당 수억원대로 통보되면서 논란이 커지고 있다는 사설이다. 서초구 반포현대는 1인당 2억2000만원, 강남구 은마아파트는 4억7000만원 수준이 예상된다. 사설은 집을 팔지 않은 상태에서 집값 상승분을 미리 환수하는 것은 조세 형평성과 재산권 측면에서 재검토가 필요하다고 주장했다. 제도의 취지는 인정하되 부담금 산정 기준과 부과율을 현실에 맞게 조정하고 장기 보유자·고령층의 부담을 덜어줘야 한다고 제언했다. 재건축을 통한 도심 주택 공급 확대가 절실한 만큼 재초환이 걸림돌이 돼서는 안 된다는 것이 결론이다.","url":"https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611241451140420404"}]}]},{"date":"2026-11-24","count":15,"pdf_count":26,"highlights":[{"n":1,"text":"묻지마 지역주택조합 투자 차단…토지 매매계약서 있어야 조합 설립 허가"},{"n":6,"text":"주택가격전망 6p 급락…강남 약세에 집값 상승 기대 꺾였다"},{"n":11,"text":"대우건설, 목동 8단지에 '분담금 6년 유예' 제안…홍보관까지 열어"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"묻지마 지역주택조합 투자 차단…토지 매매계약서 있어야 조합 설립 허가","meta":"2026.11.23 18:24 · 파이낸셜뉴스","body":"국토교통부가 지역주택조합의 설립인가 요건을 강화하는 제도 개선안을 내놨다. 지금까지는 토지 사용권원 80%와 소유권 15%만 확보하면 조합 설립인가를 받을 수 있었으나, 앞으로는 계약금 10% 이상을 치른 실제 토지 매매계약서나 소유권 등기를 갖춰야 한다. 반대로 시공자가 참여한 사업은 토지 소유권 요건을 95%에서 80%로 낮춰 일반 주택사업과 같은 기준을 적용한다. 국토부는 구체적인 사업계획을 갖춘 조합만 진입하도록 문턱을 높여 설립 이후 사업 속도를 높이겠다는 취지라고 설명했다. 2024년 말 기준 전국 지역주택조합 사업지 618곳 가운데 316곳이 조합원 모집 단계에 머물러 있다.","url":"https://www.fnnews.com/news/202611231824172931"},{"n":2,"title":"서울시의회, 준공업지역 재건축 임대주택 의무비율 50%→30% 추진","meta":"2026.11.23 17:20 · 한국경제","body":"서울시의회가 준공업지역 재건축 사업의 초과용적률에 적용하는 임대주택 의무 공급 비율을 현행 50%에서 30%로 낮추는 조례 개정에 나섰다. 시의회 관계자는 인건비와 자재비가 급격히 올라 재건축 공사비 부담이 커졌다며 사업성 악화를 개정 배경으로 들었다. 서울시는 준공업지역뿐 아니라 일반 주거지역 재개발까지 완화 대상을 넓히는 방안을 선호하고 있으며, 같은 취지의 제도 개선을 국토교통부에 건의한 상태다. 개정이 이뤄지면 준공업지역 재건축 단지의 분양 물량이 늘어나는 효과가 예상된다.","url":"https://www.hankyung.com/article/2026112349041"},{"n":3,"title":"주민 반대에 '한양도성 세계유산 등재' 재검토…정비사업 19곳 영향권","meta":"2026.11.23 17:23 · 한국경제","body":"서울시가 올해 1월 신청한 한양도성의 유네스코 세계유산 등재를 재검토하기로 했다. 등재에 따른 개발 규제를 우려한 주민 반발이 이어졌기 때문이다. 서울 6개 자치구에서 최대 19곳의 정비사업이 영향을 받을 수 있는데, 완충구역에 포함된 12곳이 직접 영향권이고 경계에서 30~40m 안에 있는 7곳도 영향을 받을 수 있다. 지난달 중구 주민 3500여 명이 국가유산청에 반대 의견서를 냈고, 후암동 주민 1300여 명도 서울시에 이의를 제기했다. 등재 여부는 2027년 6월 제49차 세계유산위원회에서 결정된다.","url":"https://www.hankyung.com/article/2026112349011"}]},{"name":"시장동향","articles":[{"n":6,"title":"주택가격전망 6p 급락…강남 약세에 집값 상승 기대 꺾였다","meta":"2026.11.24 06:00 · 디지털타임스","body":"한국은행의 11월 소비자동향조사에서 주택가격전망 소비자동향지수(CSI)가 전월 124에서 118로 6포인트 내렸다. 넉 달째 약해진 흐름이지만 장기평균(107)은 여전히 웃돌아 집값이 오를 것이라는 응답이 우세했다. 서울은 130에서 122로 8포인트 떨어져 지방보다 낙폭이 컸다. 서초·강남구가 15주째, 송파구가 11주 연속 하락세를 이어간 점이 심리에 반영된 것으로 풀이된다. 한국은행은 고가 지역의 실제 가격 하락과 정부 규제, 대출금리 상승, 증시 변동성을 배경으로 꼽았으며 같은 달 소비자심리지수도 103.1로 두 달 연속 내렸다.","url":"https://www.dt.co.kr/article/12096805"},{"n":7,"title":"서울 신규 전세 중간값 6억원 돌파…6억 이하 계약 43% 급감","meta":"2026.11.24 05:05 · 뉴스1","body":"올해 1월 1일부터 11월 23일까지 서울 아파트 신규 전세 보증금 중간값이 6억500만원으로 집계돼 처음 6억원을 넘어섰다. 지난해 같은 기간 5억6000만원보다 4500만원 오른 값이다. 보증금 6억원 이하 전세 계약은 1년 새 43.3% 줄어 중저가 전세가 빠르게 사라지고 있다. 성북구에서는 6억원 이하 매물 비중이 83%에서 55%로 떨어졌고, 래미안장위 전용 59㎡는 갱신계약 5억2500만원과 신규계약 6억5000만원으로 격차가 벌어졌다. 전문가들은 중저가 전세 부족이 내년까지 이어질 수 있다고 내다봤다.","url":"https://www.news1.kr/realestate/general/6363089"},{"n":8,"title":"강남3구 이어 한강벨트도 하락 전환…동작구 8개월 만에 약세","meta":"2026.11.24 07:00 · 파이낸셜뉴스","body":"서울 아파트값이 93주 연속 올랐지만 강남3구에 이어 한강벨트도 하락으로 돌아섰다. 동대문구와 성동구, 용산구, 동작구에서 가격이 떨어졌고 동작구는 8개월 만에 하락 전환했다. 동작구 현대아파트는 3주 만에 호가가 3500만원 내렸고 성동구는 1억원(5.6%), 용산구는 1억5000만원 낮아진 거래가 나왔다. 한 연구위원은 강남권과 가격 격차가 좁혀지면서 매수자의 관망세가 짙어져 호가에 하방 압력이 생겼다고 분석했다. 다만 일시적 피로감이라는 반론도 있으며, 대출 규제로 실수요가 몰리는 서울 외곽은 상대적으로 버틸 것이라는 전망이 나온다.","url":"https://www.fnnews.com/news/202611221225554137"}]},{"name":"정비사업","articles":[{"n":11,"title":"대우건설, 목동 8단지에 '분담금 6년 유예' 제안…홍보관까지 열어","meta":"2026.11.24 06:30 · 한국경제","body":"목동 8단지 재건축 우선협상대상자로 선정된 대우건설이 단지 안에 홍보관을 열고 12월 12일 시공사 선정 총회를 앞두고 조합원 접촉을 강화하고 있다. 제안 단지명은 '써밋 디아보 목동'으로 최고 49층(높이 180m) 10개 동 1881가구 규모다. 기본 천장고를 2.7m로 잡고 우물천장 적용 시 2.82m까지 높였으며, 분담금은 2년 단위로 최대 6년까지 미룰 수 있게 했다. 경쟁 단지들이 4년 유예를 제시한 것보다 유리한 조건이다. 업계에서는 대우건설이 목동 11·14단지 수주까지 염두에 둔 행보로 보고 있다.","url":"https://www.hankyung.com/article/2026112343166"},{"n":12,"title":"GS건설, 1조7887억원 목동 12단지 재건축 수주","meta":"2026.11.23 18:51 · 파이낸셜뉴스","body":"GS건설이 서울 양천구 목동 12단지 재건축 사업의 시공사로 최종 선정됐다. 공사비는 약 1조7887억원 규모다. 신정동 326번지 일대를 지하 3층~지상 41층, 19개 동, 2810가구와 부대복리시설로 다시 짓는 사업이다. GS건설은 잔물결을 뜻하는 '리플'과 빛을 의미하는 '러즈', 변화를 뜻하는 '-ize'를 합쳐 '리플리제 자이'를 단지명으로 제안했다. 설계는 '목동에 숲을 짓다'를 주제로 중앙광장을 넓히고 전 가구 특화 평면을 적용하기로 했다.","url":"https://www.fnnews.com/news/202611231827168885"}]},{"name":"금융/세제","articles":[{"n":16,"title":"179억원 vs 시효 만료…'복불복' 돼버린 재건축 부담금","meta":"2026.11.23 11:32 · 헤럴드경제","body":"재건축초과이익환수제 부담금이 단지별로 크게 갈리면서 형평성 논란이 커지고 있다. 연희빌라는 부담금 예정액이 5억6000만원이었지만 2021년 5월 준공으로 제척기간이 지나 부과가 불가능해졌다. 반면 반포현대는 179억원을 사전 통지받아 조합원 80명 기준 1인당 약 2억2375만원을 내야 한다. 두산연립은 초기 4억3117만원이던 부담금이 10년 소송 끝에 2억827만원으로 줄었고, 송파구 문정동 136번지는 구청 통지액 505억원과 조합 추산액이 1700억원가량 차이가 났다. 서진형 광운대 교수는 평가 방식과 행정기관 판단에 따라 부담금이 수억원씩 달라지면 제도의 형평성을 담보하기 어렵다고 지적했다.","url":"https://biz.heraldcorp.com/article/10946034"},{"n":17,"title":"세제 강화·재초환 '겹악재'…개포주공에 10억 낮춘 매물 등장","meta":"2026.11.23 11:34 · 헤럴드경제","body":"보유세 강화와 재건축초과이익환수제 부담이 겹치면서 강남 재건축 단지에서 호가를 크게 낮춘 매물이 나오고 있다. 개포주공 7단지 전용 73㎡는 4월 37억5000만원에서 27억원으로 10억5000만원 내린 매물이 등장했다. 6단지 전용 60㎡ 호가는 28억5000만원까지 떨어져 10월 실거래가 30억2000만원보다 낮고, 1월 고점 33억7000만원과 비교하면 4억원 넘게 빠졌다. 현지 중개업소는 부담금 우려와 재초환 부과가 맞물려 고령 조합원 중심으로 매도에 나서고 있다고 전했다.","url":"https://biz.heraldcorp.com/article/10946048"}]},{"name":"임대주택","articles":[{"n":21,"title":"LH, 공공주택 4232가구 민간참여 공모 일주일 만에 연기","meta":"2026.11.23 19:36 · 헤럴드경제","body":"LH가 남양주 왕숙2와 고양 창릉의 공공주택 4232가구에 대한 민간참여 공모를 공고 일주일 만에 연기했다. 전체 공모 물량 5782가구 가운데 6개 블록 중 4개 블록, 비중으로는 73.2%가 대상이며 추정 민간 투자비는 약 1조1270억원이다. LH는 모듈러 주택이 포함된 사업인 만큼 국내 업계의 생산 역량을 반영해 기준과 세부 조건을 다듬을 필요가 있다고 설명했다. 정부는 연내 민간 사업자 선정을 마치고 2027년 착공한다는 계획이었으나 일정이 불투명해졌다. 일부 블록은 2027년 중반, 나머지는 2027년 말 준공을 목표로 해 공급 차질 우려가 나온다.","url":"https://biz.heraldcorp.com/article/10946611"}]},{"name":"택지/도시개발","articles":[{"n":22,"title":"3기 신도시 첫 집들이…인천 계양서 다음 달 1285가구 입주","meta":"2026.11.23 11:33 · 헤럴드경제","body":"3기 신도시 가운데 처음으로 인천 계양에서 다음 달 입주가 시작된다. 계양 루센트 747가구와 계양 리프포레 359가구 등 공공분양 물량에 행복주택 179가구를 더해 모두 1285가구가 집들이를 한다. 12월 전국 입주 물량은 22개 단지 1만6486가구로 1년 전보다 49% 줄어드는데, 인천은 3812가구로 전국에서 가장 많다. 부천 대장과 고양 창릉, 남양주 왕숙, 하남 교산 등 나머지 3기 신도시는 2027년부터 2029년 사이 준공이 예정돼 있다.","url":"https://biz.heraldcorp.com/article/10946041"},{"n":23,"title":"계양신도시 첫 민간분양 '카이브 유보라' 1110가구 정당계약 시작","meta":"2026.11.23 13:33 · 한국경제","body":"인천 계양신도시의 첫 민간분양 단지인 '카이브 유보라'가 11월 23일부터 25일까지 정당계약을 받는다. AC3블록 614가구와 AC4블록 496가구를 합쳐 1110가구이며 전 가구가 전용 84㎡ 이상 중대형으로 구성됐다. 전용 84㎡ 분양가는 7억원 중반에서 8억원 초반으로 서울 아파트 평균 전셋값과 비슷한 수준이다. 계약금은 분양가의 5%이고 실거주 의무가 없다. 입주는 2029년 8월 예정이며 반도건설이 프리미엄 브랜드 '카이브 유보라'를 적용했다.","url":"https://www.hankyung.com/article/202611234120i"}]},{"name":"분양정보","articles":[{"n":24,"title":"남양주 '왕숙 한신더휴 센텀' 379가구, 30일 특별공급 시작","meta":"2026.11.23 09:41 · 아시아경제","body":"한신공영이 짓는 '왕숙 한신더휴 센텀'이 11월 30일 특별공급을 시작으로 청약에 들어간다. 1순위는 12월 1일, 2순위는 12월 2일에 접수하며 당첨자는 12월 8일 발표된다. 왕숙2지구 A17블록에 들어서는 379가구 전체가 전용 59㎡ 단일 면적이고 분양가는 약 5억6923만~6억750만원이다. 당초 이익공유형 '뉴홈 나눔형'으로 계획됐다가 일반 공공분양으로 전환됐다. 인근 왕숙2지구 단지들이 126.8대 1, 105.5대 1의 세 자릿수 경쟁률을 기록해 이번 단지에도 관심이 쏠린다.","url":"https://www.asiae.co.kr/article/real-estate-dev-sales/2026112309414130770"},{"n":25,"title":"강남 집값 주춤해도 청약은 뜨겁다…신반포 잔여 5가구에 1411명","meta":"2026.11.23 13:36 · 세계일보","body":"서초구 'DH신반포 에스텔라' 잔여 5가구 무순위 청약에 1411명이 몰려 282.2대 1의 경쟁률을 기록했다. 같은 기간 강남권 아파트값은 송파구 -0.42%, 서초구 -0.31%, 강남구 -0.30%로 하락폭이 커졌다. 신축 희소성이 청약 열기의 배경으로 꼽히는데, 서울 아파트 입주 물량은 올해 2만4362가구에서 내년 2만2376가구, 2028년 1만4615가구로 줄어든다. 여기에 서초구가 재건축 단지에 179억원 규모 부담금을 통지하는 등 재초환 부담이 커지면서, 부담금을 피할 수 있는 신축으로 수요가 몰리고 있다는 분석이 나온다.","url":"https://www.segye.com/newsView/20261123508919"}]}]},{"date":"2026-11-23","count":15,"pdf_count":22,"highlights":[{"n":1,"text":"국토부 재초환 부과기한 확정에 조합 집단행동…국회선 폐지법안 재등장"},{"n":3,"text":"봄 이사철 전세 가뭄 우려…치솟는 전셋값이 꺾이는 집값 흔든다"},{"n":11,"text":"DL이앤씨, 2조원 규모 성수2지구 재개발 수주…아크로 성수 조성"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"국토부 재초환 부과기한 확정에 조합 집단행동…국회선 폐지법안 재등장","meta":"2026.11.21 09:00 · 이투데이","body":"국토교통부가 재건축초과이익환수제 부담금 부과기한을 연장할 수 없다는 법률 해석을 확정하면서 서초구 반포현대는 12월 30일까지 총 179억원의 부담금을 부과받게 됐다. 전국 82개 재건축 조합이 소속된 전국재건축정비사업조합연대는 12월 16일 청와대 앞에서 재초환 폐지를 촉구하는 집회를 열기로 하고, 부담금 산정 이의신청과 행정소송 등 법적 대응을 검토하고 있다. 강남구 은마아파트는 조합원 1인당 평균 약 4억6000만원의 부담금 예정액이 산정됐고, 전국 79개 사업장에 통지된 부담금은 5조3000억원대 규모다. 국회에서는 고동진 의원이 재초환 폐지법안을 대표발의했고 김은혜 의원의 전면 폐지안도 계류 중이다. 업계에서는 소송이 본격화되면 초과이익과 개발비용 산정 방식이 핵심 쟁점이 될 것으로 보고 있으며, 주요 로펌들이 전담팀을 꾸려 대비하고 있다.","url":"https://www.etoday.co.kr/news/view/2651068"},{"n":2,"title":"서초구, 내달 반포현대에 첫 재초환 부과…서울 52곳 조합원 평균 1억1000만원","meta":"2026.11.22 09:47 · 파이낸셜뉴스","body":"서울 서초구가 다음 달 반포현대(반포센트레빌아스테리움)에 재건축초과이익환수 부담금을 실제로 부과할 전망이어서 다른 재건축 단지의 부과 일정에도 관심이 쏠리고 있다. 올해 8월 기준 서울에서 부담금 예정액을 통보받은 52개 단지의 부담금 총액은 2조3552억원으로, 조합원 1인당 평균 약 1억1000만원 수준이다. 단지별로는 서초 반포3주구가 5149억원으로 가장 많고 용산 한강맨션이 4723억원으로 뒤를 이었으며, 한강맨션은 조합원 1인당 7억2000만원으로 개인 부담이 가장 크다. 다만 부담금이 확정되더라도 소송과 체납 등으로 실제 징수까지는 상당한 시간이 걸릴 수 있다는 것이 업계의 시각이다. 국회에서는 재초환 폐지 논의가 이어지고 있고 전국 82개 재건축 조합이 참여하는 연대 조직도 대응 방안을 찾고 있다.","url":"https://www.fnnews.com/news/202611220927143242"}]},{"name":"시장동향","articles":[{"n":3,"title":"봄 이사철 전세 가뭄 우려…치솟는 전셋값이 꺾이는 집값 흔든다","meta":"2026.11.20 08:00 · 머니투데이","body":"서울 아파트 매매가격은 93주 연속 올랐지만 상승폭은 0.03%로 91주 만에 가장 낮은 수준으로 둔화됐다. 강남·서초·송파 등 강남3구는 11주 연속 하락세를 이어가며 약세가 한강벨트 지역으로 확산되고 있다. 반면 서울 아파트 전셋값은 올해 들어 9.43% 올라 지난해 같은 기간의 3배가 넘는 속도로 상승했고, 경기도 전셋값도 1.29%에서 6.88%로 오름폭이 가팔라졌다. 전월세 매물 부족이 이어지는 가운데 내년 봄 이사철에 임차 수요가 몰리면 전세가와 매매가가 함께 상승 압력을 받을 수 있다는 전망이 나온다.","url":"https://www.mt.co.kr/estate/2026/11/20/2026111923093133290"},{"n":4,"title":"상승률은 꺾였지만…집값 여전히 높고 전월세는 고공행진","meta":"2026.11.20 16:19 · 머니투데이방송","body":"서울 아파트값 주간 상승률이 0.03%로 21개월 만의 최저 수준까지 내려앉으며 사실상 보합에 근접했다. 가격 둔화는 강남권에서 용산·동작 등 한강변 자치구로 번졌고, 송파구는 0.42% 내려 하락폭이 가장 컸다. 8·3 세제개편 발표 이후 서울 아파트 매물이 36% 늘었지만 전문가들은 아직 급격한 하락 국면으로 보기는 이르다고 평가한다. 전세시장은 주간 0.14%, 올해 누적 9.43% 상승했고 평균 월세는 168만원으로 1년 전보다 20만원 올랐다. 시장에서는 빨리 사야 한다는 분위기가 서두를 필요 없다는 쪽으로 바뀌었다는 현장 진단이 나온다.","url":"https://news.mtn.co.kr/article/2026112016191353812"},{"n":5,"title":"서울 아파트 매물 8만2000건…거래는 18% 줄며 상급지 갈아타기 고민","meta":"2026.11.22 18:22 · 한국경제","body":"서울 아파트 매물이 올해 초 5만7001건에서 8만2097건으로 44% 늘어난 반면 1~10월 거래량은 5만6669건으로 지난해 같은 기간보다 18.1% 감소했다. 송파·동작·용산 등 상급지에서는 매물이 쌓였는데도 거래가 멈춰 있고, 외곽 중저가 지역은 오름세를 이어가며 지역별 온도차가 벌어지고 있다. 대출 규제 속에서 매도·매수 희망 가격 차이가 좁혀지지 않는 것이 거래 공백의 배경으로 지목된다. 전문가들은 상급지로 갈아타려는 수요자라면 대출 부담과 전월세 시장 상황을 함께 따져 매수 시점을 신중히 정할 것을 권한다.","url":"https://www.hankyung.com/article/2026112223961"}]},{"name":"정비사업","articles":[{"n":11,"title":"DL이앤씨, 2조원 규모 성수2지구 재개발 수주…아크로 성수 조성","meta":"2026.11.22 15:28 · 파이낸셜뉴스","body":"DL이앤씨가 총공사비 약 2조137억원 규모의 서울 성동구 성수전략정비구역 제2지구 재개발 시공권을 확보했다. 21일 열린 시공사 선정 총회에서 투표에 참여한 조합원 757명 중 688명(90.9%)이 DL이앤씨를 선택했다. 한강변에 최고 62층, 2350가구 규모 단지를 조성하고 하이엔드 브랜드 아크로를 적용할 계획이며, 한강 조망을 위해 주동 배치를 조정하고 건물 하부를 개방하는 하이필로티 설계를 제안했다. 조합 사업비는 CD금리에 가산금리 0%를 적용해 조달하고 조합원 분담금 납부는 최대 4년 유예하기로 했다. 이로써 성수전략정비구역 1~4지구의 시공사 선정이 모두 마무리됐다.","url":"https://www.fnnews.com/news/202611221436005180"},{"n":12,"title":"광명 하안주공6·7단지, IPARK현대산업개발 시공자 확정…통합심의 준비","meta":"2026.11.22 11:15 · 하우징워치","body":"경기 광명 하안주공6·7단지 통합재건축이 21일 토지등소유자 전체회의를 열고 IPARK현대산업개발을 시공자로 최종 확정했다. 1990년 준공된 2602가구를 헐고 지하 3층부터 지상 최고 44층, 20개 동 규모 단지를 새로 짓는 사업으로 예정 공사비는 1조1549억원이다. IPARK현대산업개발은 3.3㎡당 780만원의 고정 공사비를 제시하고 200억원 규모의 무이자 사업비 지원 조건을 내걸었다. 두 단지의 경계를 허무는 원 메가블록 대안설계로 중앙 통합 광장과 단일 지하주차장, 대형 커뮤니티를 계획했다. 사업 주체는 광명시 정비사업 가운데 처음으로 통합심의 준비에 들어갔다.","url":"https://www.housingwatch.co.kr/news/article.html?no=27545"},{"n":13,"title":"수억대 부담금에 술렁이는 조합들…소송 준비하고 절감책 찾기 분주","meta":"2026.11.21 12:00 · 파이낸셜뉴스","body":"재건축초과이익환수 부담금이 연말부터 본격 부과되면서 조합원들의 반발이 커지고 있다. 반포현대 재건축조합은 조합원 1인당 평균 2억2000만원 상당의 부담금 부과를 앞두고 장기전도 불사하겠다며 소송 방침을 밝혔다. 전국재건축정비사업조합연대는 12월 16일 청와대 앞에서 재초환 폐지를 요구하는 기자회견을 열기로 했다. 일부 단지는 공사비 증액, 조합설립 시기 조절, 일반분양 물량 축소 등 부담금을 줄이는 방안을 내부적으로 검토하고 있다. 전국 79곳의 예상 부담금은 약 5조3000억원이며 이 가운데 서울이 52곳으로 44.4%를 차지한다.","url":"https://www.fnnews.com/news/202611211200389428"}]},{"name":"금융/세제","articles":[{"n":16,"title":"금융당국, 은행 우대금리 축소 점검…10년 이상 고정금리 주담대 TF 재가동","meta":"2026.11.22 19:34 · 세계일보","body":"금융당국이 시중은행의 우대금리 축소 실태를 점검하고 이달 안에 대응책을 마련하기로 했다. 지난 7월 개정 은행법 시행으로 가산금리를 낮추도록 했지만, 은행들이 가산금리 인하폭보다 우대금리를 더 크게 줄이면서 차주가 체감하는 금리 인하 효과가 크지 않다는 지적이 나왔기 때문이다. 당국은 은행별 금리 결정 구조를 공개해 소비자의 선택권을 강화하겠다는 방침도 내놨다. 다음 달에는 10년 이상 장기 고정금리 주택담보대출 활성화를 위한 태스크포스를 다시 가동한다. 커버드본드 발행으로 조달비용을 낮추고 가계부채 관리 인센티브를 주는 방안 등이 검토되고 있다.","url":"https://www.segye.com/newsView/20261122508687"}]},{"name":"임대주택","articles":[{"n":17,"title":"전세사기 2차 피해 커진다…부산시의회, 공공위탁관리 조례 추진 요구","meta":"2026.11.22 18:20 · 부산일보","body":"부산시의회 최은영 의원이 주택건축국 행정사무감사에서 전세사기 피해의 장기화로 2차 피해가 심각해지고 있다고 지적했다. 토지 매입부터 건축·임대·담보대출까지 한 사업자가 주도하는 개발형 임대 구조가 한 건물에 피해를 집중시켰다는 분석이다. 관리비 갈등으로 출입이 제한되거나 임대인 사망 뒤 점유 분쟁이 벌어지는 등 예상 밖의 피해가 이어지고 있다. 건물당 2000만원 수준인 시설개선 지원으로는 한계가 있고, 주거·금융 지원이 끝난 뒤에도 경매가 마무리되지 않은 피해자를 위한 별도 대책이 필요하다는 요구가 나왔다. 부산시는 기존 24회 지원을 36회까지 연장하는 방안을 검토하고 공공위탁관리 조례 제정을 추진하겠다고 밝혔다.","url":"https://www.busan.com/view/busan/view.php?code=2026112218175546356"}]},{"name":"주택품질/안전","articles":[{"n":18,"title":"거제 4층 다가구주택서 새벽 화재…주민 21명 대피·8명 부상","meta":"2026.11.22 14:59 · SBS","body":"22일 오전 5시 30분쯤 경남 거제시의 4층짜리 다가구주택 1층에서 불이 나 약 1시간 10분 만에 꺼졌다. 소방당국은 인력 75명과 장비 27대를 투입해 오전 6시 40분쯤 불을 완전히 껐다. 이 과정에서 건물 안에 있던 주민 21명이 대피했고, 1도 화상을 입은 1명과 연기를 마신 7명 등 8명이 병원으로 옮겨졌다. 경찰과 소방당국은 정확한 화재 원인을 조사하고 있다.","url":"https://news.sbs.co.kr/news/endPage.do?news_id=N1008857731"}]},{"name":"분양정보","articles":[{"n":19,"title":"11월 넷째 주 전국 15개 단지 6295가구 청약…물량 3.7배로","meta":"2026.11.21 06:00 · 이투데이","body":"11월 넷째 주에 전국 15개 단지에서 모두 6295가구가 청약을 받는다. 직전 주 1681가구와 비교하면 약 3.7배 늘어난 물량으로, 수도권 2904가구와 지방 3391가구로 나뉜다. 24일에는 서울 영등포구 해링턴 플레이스 문래를 비롯해 수도권 5개 단지와 지방 7개 단지가 청약을 시작한다. 26일에는 서울 종로구 경희궁 에피트가 1순위 청약에 나선다. 27일에는 서울 상봉동 더샵 퍼스트월드 서울 등 전국 6곳에서 견본주택이 문을 연다.","url":"https://www.etoday.co.kr/news/view/2651101"},{"n":20,"title":"서울 4대문 안 올해 첫 분양 경희궁 에피트…국민평형 25억 통할까","meta":"2026.11.21 06:00 · 뉴스핌","body":"HL디앤아이한라가 공급하는 서울 종로구 교남동 경희궁 에피트 견본주택이 문을 열었다. 2017년 경희궁자이 이후 서울 도심에서 나오는 첫 대규모 분양으로, 지하철 5호선 서대문역과 지하통로로 연결되고 광화문 업무지구까지 한 정거장 거리다. 전용 84㎡ 분양가는 23억~25억원대로 책정돼 현장을 찾은 수요자들 사이에서는 자금 조달 부담이 크다는 반응이 나왔다. 단지 주변에는 강북삼성병원과 서울적십자병원이 있고 덕수초 셔틀버스도 운행된다. 25일 특별공급을 시작으로 청약을 진행하며 입주는 2030년 8월 예정이다.","url":"https://www.newspim.com/news/view/20261120000729"},{"n":21,"title":"용인·평택 등 전국 청약 단지 연말 공급…거주지 제한 낮춰 수요 확보","meta":"2026.11.20 10:16 · 마이데일리","body":"용인 반도체 클러스터와 평택 고덕국제신도시, 충남 내포신도시 등에서 거주지 제한 없이 청약할 수 있는 아파트가 연말에 공급된다. 전국 청약은 해당 주택건설지역에 살지 않는 사람도 공급 대상에 넣는 방식이지만 청약통장 가입기간 등 다른 자격 요건은 그대로 적용된다. 용인에서는 동일토건이 661가구, 평택에서는 계룡·중흥·호반 컨소시엄이 996가구 규모 단지를 준비 중이다. 과거 비슷한 조건으로 공급된 단지들은 100대 1을 넘는 경쟁률을 기록하기도 했다. 최종 공급 조건은 입주자모집공고로 확정되므로 지역 우선공급 비율과 소득·자산 요건을 미리 확인해야 한다.","url":"https://www.mydaily.co.kr/page/view/2026112010160092872"}]},{"name":"논설/사설","articles":[{"n":22,"title":"[사설] 공시가 현실화율 동결에도 뛰는 보유세…과세 틀 다시 짜라","meta":"2026.11.21 06:04 · 서울경제","body":"정부가 2027년 공시가격 현실화율을 69%로 5년 연속 동결했지만 보유세 부담은 계속 늘고 있다. 시세가 오르면 공시가격도 함께 오르기 때문으로, 지난해에도 현실화율을 묶어둔 상태에서 공시가격이 9.13% 뛰었다. 사설은 정부가 여론을 자극하지 않고도 증세 효과를 누리는 구조라고 비판했다. 공시가격은 재산세뿐 아니라 건강보험료와 기초연금 등 67개 행정제도의 기준으로 쓰여 파급력이 크다. 정권과 시장 상황에 따라 흔들리는 기준 대신 완충 장치를 갖춘 예측 가능한 과세 체계를 다시 설계해야 한다고 주장했다.","url":"https://www.sedaily.com/article/20117140"}]}]},{"date":"2026-11-20","count":15,"pdf_count":24,"highlights":[{"n":1,"text":"국토부, 재초환 부과기한 '준공일 기준' 유권해석…반포현대 179억 연내 부과"},{"n":4,"text":"서울 아파트값 93주 연속 올랐지만…상승폭은 91주 만에 최저"},{"n":9,"text":"전국 25개 재건축 조합장 회동…\"행정소송 불사\" 재초환 공동대응 예고"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"국토부, 재초환 부과기한 '준공일 기준' 유권해석…반포현대 179억 연내 부과","meta":"2026.11.19 15:27 · 뉴스핌","body":"국토교통부가 재건축초과이익환수 부담금의 부과 기한을 준공일을 기준으로 판단한다는 유권해석을 내놨다. 2023년 개정법 부칙이 부과 기간을 새로 계산하도록 한 것은 아니라는 판단으로, 준공 5개월 뒤부터 5년 안에 부과해야 한다는 해석이다. 이에 따라 2021년 준공된 서초구 반포현대(반포센트레빌아스테리움)의 부과 기한은 올해 12월 30일로 확정됐고, 사전 통지된 부담금은 179억원이다. 전국 79개 재건축 단지의 예상 부담금은 5조3336억원 규모로, 용산구 한강맨션이 4723억원, 강남구 은마아파트가 조합원 1인당 평균 4억6334만원으로 통지됐다. 업계에서는 부담금 부과가 현실화되면서 민간 재건축이 위축될 수 있다는 우려가 제기된다.","url":"https://www.newspim.com/news/view/20261119001074"},{"n":2,"title":"주택공급 3법 본회의 상정 불발…여당 \"초당적 결단 필요\"","meta":"2026.11.19 11:16 · 파이낸셜뉴스","body":"더불어민주당이 본회의 상정이 무산된 주택공급 3법 처리를 위해 국민의힘에 협조를 요청했다. 주택공급 3법은 도시정비법·도시재정비촉진법·용산공원법 개정안으로, 기본계획·정비구역 지정과 사업시행·관리처분 인가를 병행할 수 있게 해 재개발·재건축 기간을 2~3년 줄이는 것이 핵심이다. 국민의힘이 미합의 법안 전체에 필리버스터로 대응하겠다고 예고하면서 법안 처리가 또다시 미뤄지게 됐다. 오기형 민주당 의원은 국민의힘이나 오세훈 서울시장도 상당 부분 공감할 법안이라며 다른 정치적 쟁점 때문에 발목을 잡아서는 안 된다고 주장했다. 이는 여당 측 주장으로, 야당의 공식 입장과는 구분해 볼 필요가 있다.","url":"https://www.fnnews.com/news/202611191102365666"}]},{"name":"시장동향","articles":[{"n":4,"title":"서울 아파트값 93주 연속 올랐지만…상승폭은 91주 만에 최저","meta":"2026.11.19 10:08 · 머니투데이","body":"한국부동산원 집계에서 11월 셋째 주(16일 기준) 서울 아파트 매매가격지수가 전주보다 0.03% 올라 93주 연속 상승을 이어갔다. 다만 상승폭은 전주 0.07%의 절반 수준으로 떨어져 지난해 2월 둘째 주 이후 91주 만에 가장 낮았다. 강남·서초·송파구는 11주 연속 하락했고 용산구와 동작구도 하락으로 돌아섰다. 반면 성북구 0.34%, 중랑구 0.32%, 금천구 0.29% 등 중저가 지역은 오름세를 유지했다. 경기도는 수원·안양·용인 등 반도체 산업 배후지역을 중심으로 상승세가 이어졌다.","url":"https://www.mt.co.kr/estate/2026/11/19/2026111910082935165"},{"n":5,"title":"강남 넘어 한강벨트로 번진 하락세…서울 매물 8만2000건 쌓였다","meta":"2026.11.19 17:51 · 한국경제","body":"서울 아파트값 하락이 강남 3구에서 한강벨트로 확산되고 있다. 용산구와 동작구가 각각 6주, 34주 만에 하락 전환했고 성동구와 강동구도 내림세를 보였다. 서울 아파트 매물은 8만2097건으로 연초 5만7001건보다 44% 늘었고, 강남 3구와 한강벨트 거래는 54.8% 급감했다. 10월 기준 은행 주택담보대출 금리가 연 3.62%로 2년 8개월 만에 가장 높아진 점도 매수심리를 위축시키고 있다. 세금 부담에 따른 매물 적체와 대출 규제가 겹치면서 거래 공백이 길어지고 있다는 분석이 나온다.","url":"https://www.hankyung.com/article/2026111982811"}]},{"name":"정비사업","articles":[{"n":9,"title":"전국 25개 재건축 조합장 회동…\"행정소송 불사\" 재초환 공동대응 예고","meta":"2026.11.19 13:15 · 아시아경제","body":"전국 25개 재건축 단지 조합장이 19일 서울 서초구에서 모여 재건축초과이익환수 부담금 부과에 대한 공동대응 방안을 논의했다. 대구 범어우방1차, 대전 용문동 구역, 역삼 은하수, 성수 장미아파트, 신반포21차 등이 참석했다. 조합들은 부담금 부과가 현실화되면 행정처분 취소소송까지 불사하겠다며 태평양·율촌·화우·지평 등 대형 로펌과 접촉 중이라고 밝혔다. 성수 장미아파트는 예상 부담금이 가구당 4억7000만원에서 8000만원으로 줄었고 역삼 은하수는 가구당 약 4억원 수준으로 알려졌다. 조합 대표들은 다음 달 청와대 앞 기자회견도 추진할 계획이며, 국토부는 이번 주 중 법률 검토 결과를 서초구청에 전달한다.","url":"https://view.asiae.co.kr/article/2026111912552499001"},{"n":10,"title":"서울 46개 단지 재초환 예상 부담금 2조원 돌파…사용처 논의 부상","meta":"2026.11.19 19:24 · 아주경제","body":"서울 46개 재건축 단지의 재건축초과이익환수 예상 부담금이 2조원을 넘어설 것으로 추산됐다. 서초구는 2021년 준공된 반포현대에 대해 연내 부과 절차를 진행해야 하며 사전 통지된 부담금은 총 179억원, 조합원 1인당 평균 약 2억2400만원이다. 제도 도입 20년 만에 첫 부과가 이뤄지면서 거둬들인 부담금을 어디에 쓸지에 대한 논의도 함께 제기되고 있다. 전국 25개 재건축 조합은 공동 법적 대응을 예고한 상태다. 한편 송파구 마천1구역 재개발사업의 시공사 선정 2차 입찰은 응찰자가 없어 유찰됐다.","url":"https://www.ajunews.com/view/20261119191007472"}]},{"name":"금융/세제","articles":[{"n":15,"title":"전세대출 속 주택도시기금 비중 4년새 2배…\"이차보전 전략적 활용 필요\"","meta":"2026.11.19 12:00 · 아시아경제","body":"주택도시기금을 활용한 정책자금이 전체 주택 관련 가계대출에서 차지하는 비중이 28.6%로 커진 것으로 나타났다. 10년 전 19.0%에서 크게 높아진 수치다. 특히 전세대출 가운데 주택도시기금 비중은 2021년 21.3%에서 2025년 39.6%로 4년 만에 약 2배가 됐다. 디딤돌 대출잔액은 같은 기간 44조원에서 104조원으로 136% 늘었고 버팀목 대출도 40조원에서 74조원으로 증가했다. 정책대출의 70~80%를 차지하는 이차보전 방식이 금리 인상기에 정부 재정 부담을 키울 수 있다는 지적과 함께, 저렴한 공적임대주택을 보편적으로 공급해야 한다는 주장이 제기됐다.","url":"https://view.asiae.co.kr/article/2026111911575509051"}]},{"name":"임대주택","articles":[{"n":16,"title":"최저주거기준 15년 만에 손질…보편형 공공임대 설계 공개 토론","meta":"2026.11.19 18:11 · 한국경제","body":"국토교통부가 20일 서울에서 전문가와 청년·시민단체가 참석하는 주거복지정책 토론회를 연다. 1부에서는 2011년 이후 15년 만에 추진되는 최저주거기준 개정을 다루며, 최소 주거면적뿐 아니라 필수설비와 주택 구조·성능, 주거환경 기준까지 폭넓게 검토한다. 기후재난과 안전에 대응하는 기준도 함께 논의 대상에 올랐다. 2부에서는 9월 발표된 주거안정플랜의 보편형 공공임대 도입 방안을 다루며 입주 자격, 임대료 산정 방식, 거주 기간이 주요 의제다. 김이탁 국토부 1차관은 의견 수렴을 거쳐 구체적인 정책 대안을 마련하겠다고 밝혔다.","url":"https://www.hankyung.com/article/2026111981051"}]},{"name":"택지/도시개발","articles":[{"n":17,"title":"이천 신둔도예촌역세권 개발, 두 차례 보류 끝에 조건부 통과","meta":"2026.11.19 16:53 · 아시아경제","body":"경기 이천시의 신둔도예촌역세권 도시개발사업이 국토교통부 수도권정비실무위원회 심의를 조건부로 통과했다. 경강선 신둔도예촌역 일대 22만3881㎡ 부지에 공동주택 2585세대와 상업시설, 공원이 들어서는 사업이다. 국토부는 공동주택 미분양 대책과 공공기여 토지분 활용 방안 마련을 통과 조건으로 제시했다. 이천시는 심의 과정에서 제시된 조건과 보완사항을 충실히 이행하는 것이 중요하다며 관계기관과 협의해 후속 행정절차를 진행하겠다고 밝혔다. 성수석 이천시장은 부발역세권 개발사업을 포함한 주요 역세권 사업도 계획대로 추진하겠다고 말했다.","url":"https://view.asiae.co.kr/article/2026111916535396609"},{"n":18,"title":"시흥 월곶역세권 개발 15년 만에 첫삽…2300세대 주택 공급","meta":"2026.11.19 11:15 · 아시아투데이","body":"경기 시흥시가 월곶동 일원에서 월곶역세권 도시개발사업 기공식을 열고 공사에 들어갔다. 총사업비 3472억원을 투입해 23만5780㎡ 부지를 개발하며 2031년 준공이 목표다. 분양주택 1150세대와 임대주택 1150세대 등 모두 2300세대가 들어서고, 전체 면적의 30% 이상이 공원과 녹지로 조성된다. 첨단 바이오·AI 산업 시설도 함께 집적돼 바이오 트리플렉스 시흥 구상의 핵심 사업으로 꼽힌다. 2029년 월곶판교선이 개통되면 판교 테크노밸리 등 수도권 남부 산업거점과의 접근성이 개선될 전망이다.","url":"https://www.asiatoday.co.kr/kn/view.php?key=20261119010007413"}]},{"name":"주택품질/안전","articles":[{"n":19,"title":"익산시, 겨울철 공동주택 건설현장 합동 안전점검","meta":"2026.11.19 17:49 · 익산시민뉴스","body":"전북 익산시가 동절기를 앞두고 공동주택 건설현장의 위험요인을 점검했다. 주택도시보증공사(HUG)와 민간 전문가가 함께 남중동의 한 공동주택 건설현장을 살폈으며, 이 현장은 2023년 공사가 중단된 뒤 HUG가 관리하고 있다. 지난 우기 점검에서 지하층 배수의 필요성이 제기돼 이달 배수 작업이 완료됐다. 이번 점검에서는 지하층 구조물의 균열과 손상 여부, 노출 철근의 부식 상태, 배수 상태 등을 중점적으로 확인했다. 조용섭 주택과장은 시민 안전이 무엇보다 우선해야 할 가치라며 관계기관과의 협력을 강조했다.","url":"https://www.iscmnews.com/news/articleView.html?idxno=504145"}]},{"name":"분양정보","articles":[{"n":20,"title":"두산건설 '두산위브 트레지움 익산' 591가구…20일 견본주택 개관","meta":"2026.11.19 18:11 · 한국경제","body":"두산건설이 전북 익산시 동산동 세경1차아파트를 재건축해 지하 2층~지상 27층, 6개 동, 591가구를 공급한다. 이 가운데 전용 59.84㎡ 251가구가 일반분양 물량이다. 전용 84㎡ 중층 기준 분양가는 4억5655만~4억6116만원으로 책정됐다. 견본주택은 20일 문을 열고 청약은 23일 특별공급부터 시작된다. 조경면적을 법정 기준의 약 두 배인 30% 수준으로 확보하고 피트니스센터와 골프연습장 등 커뮤니티 시설을 넣었다.","url":"https://www.hankyung.com/article/2026111981041"},{"n":21,"title":"호반건설 '호반써밋 초량' 432가구…부산 초량3구역 재개발","meta":"2026.11.19 15:28 · 서울경제","body":"호반건설이 부산 동구 초량3동에 공급하는 호반써밋 초량의 견본주택을 20일 개관한다. 초량3구역 주택재개발정비사업으로 지하 3층~지상 24층 5개 동, 총 432가구가 들어서며 이 가운데 236가구가 일반분양이다. 전용면적은 59·70·84㎡로 구성되고 분양가는 3.3㎡당 약 2170만원이다. 청약은 23일 특별공급, 24일 1순위, 25일 2순위 순으로 진행되며 당첨자 발표는 12월 1일이다. 부산도시철도 1호선 초량역과 부산역 인근에 위치하며 입주는 2029년 8월 예정이다.","url":"https://m.sedaily.com/article/20116486"}]},{"name":"논설/사설","articles":[{"n":22,"title":"[사설] 집값 상승 둔화보다 더 시급한 건 전월세 안정","meta":"2026.11.20 04:05 · 머니투데이","body":"서울 아파트 매매가격 상승폭이 91주 만에 가장 낮은 수준으로 둔화됐지만 이를 긍정적 신호로만 보기 어렵다는 지적이다. 사설은 전셋값이 여전히 오르고 월세 부담도 커지면서 세입자의 주거비 부담이 계속 늘고 있다는 점을 짚었다. 세제와 금융 규제를 보완해 임대 공급을 늘리되 신규 주택 공급도 함께 추진해야 한다고 촉구했다. 전월세 안정은 단순한 민생 대책을 넘어 집값 상승을 억제하는 근본적인 토대라는 것이 사설의 결론이다. 이는 해당 언론사의 의견으로, 정부의 공식 입장과는 구분해 볼 필요가 있다.","url":"https://www.mt.co.kr/opinion/2026/11/20/2026111916151078333"},{"n":23,"title":"[부동산 인사이트] 형평성·공정성 논란까지 나온 재초환, 이대로 괜찮나","meta":"2026.11.20 05:36 · 이데일리","body":"재건축초과이익환수 부담금이 같은 단지 안에서도 불공평하게 부과되는 문제가 거론되고 있다. 반포주공1단지의 경우 관리처분계획인가 신청 시점에 따라 어떤 구역은 조합원 1인당 수억원의 부담금을 내야 하지만 다른 구역은 면제되는 상황이 벌어졌다. 제도 도입 20년 만에 첫 부담금이 부과되면서 형평성·공정성 문제와 함께 산정 방식의 현실성 부족, 부과 시점 기준 불일치 등의 쟁점이 제기됐다. 필자는 가상자산 과세 유예 사례처럼 정부의 과감한 결단이 필요하다고 주장했다. 이는 필자 개인의 견해다.","url":"https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=01298886645647688"}]}]},{"date":"2026-11-19","count":15,"pdf_count":29,"highlights":[{"n":1,"text":"국토부·서울시 사전기획협의체 5개월 만에 재가동…도심복합사업 1만5993가구 숨통"},{"n":5,"text":"'강남·대형'은 내리고 '강북·소형'은 올라…서울 아파트값 온도차"},{"n":10,"text":"세금·분담금·재초환 삼중고…강남 재건축 호가 수억원씩 내렸다"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"국토부·서울시 사전기획협의체 5개월 만에 재가동…도심복합사업 1만5993가구 숨통","meta":"2026.11.19 06:05 · 서울경제","body":"국토교통부와 서울시가 용적률 인센티브를 둘러싼 이견으로 중단됐던 도심공공주택복합사업 사전기획협의체를 18일 5개월 만에 다시 열었다. 협의 대상은 불광근린공원, 약수역 인근, 장위12구역 등 서울 시내 8개 사업지로 모두 1만5993가구가 예정돼 있다. 정부는 용적률 인센티브를 1.2배에서 1.4배로 확대했지만 서울시는 일조권 침해 등을 충분히 검토해야 한다는 입장을 유지해 왔다. 이날 회의에서는 구체적인 용적률 수치보다 향후 통합심의위원회의 심의 방향과 환경영향 평가 등을 논의했다. 사전기획 단계에 묶여 있는 물량은 약 1만 가구이며, 대기 중인 사업까지 더하면 3만1310가구가 영향을 받는다는 것이 서울시 설명이다.","url":"https://www.sedaily.com/article/20116138"},{"n":2,"title":"국토부, '부정청약' 이혜훈 부부 래미안 원펜타스 분양계약 취소 요청","meta":"2026.11.18 15:34 · 파이낸셜뉴스","body":"국토교통부가 이혜훈 전 기획예산처 장관 후보자 부부의 서울 서초구 래미안 원펜타스 분양계약을 취소해 달라고 사업주체에 요청했다. 이 부부는 2024년 8월 36억7840만원에 계약했으나, 청약 당시 이미 혼인해 배우자의 서울 용산구 신혼집에서 생활하던 장남을 부양가족에 포함시킨 점이 문제가 됐다. 국토부는 장남을 제외하면 청약 가점이 69점으로 떨어져 당첨선에 미치지 못했을 것으로 판단했다. 주택법 65조는 거짓이나 부정한 방법으로 주택을 공급받은 경우 공급계약을 취소할 수 있도록 하고 있다. 고위 공직 후보자의 청약 과정이 실제 계약 취소 요청으로 이어진 사례라는 점에서 청약 질서 관리에 미칠 영향이 주목된다.","url":"https://www.fnnews.com/news/202611181533501917"}]},{"name":"시장동향","articles":[{"n":5,"title":"'강남·대형'은 내리고 '강북·소형'은 올라…서울 아파트값 온도차","meta":"2026.11.19 06:00 · 아시아경제","body":"한국부동산원 집계에서 서울 아파트 실거래가지수가 전월 대비 0.57% 올랐지만 권역별·규모별로 흐름이 엇갈렸다. 강북·동북권은 오름세를 이어간 반면 강남권은 큰 폭으로 떨어졌다. 규모별로는 소형과 초소형이 각각 1.36%, 1.33% 오른 반면 중대형은 2.01%, 대형은 1.21% 하락했다. 업계는 금리 인상과 대출 규제로 매입 부담이 상대적으로 낮은 지역과 규모로 수요가 쏠린 결과로 본다. 지난달 전세 거래량은 18.3% 늘고 월세 거래량은 6.0% 줄어 전세 비중이 50.3%로 다시 확대됐다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026111821315670589"},{"n":6,"title":"한강벨트는 급랭, 반도체벨트는 후끈…동탄 거래 절반이 신고가","meta":"2026.11.19 06:00 · 서울경제","body":"10월 서울 아파트 거래량이 전년 동월 대비 54% 줄었고, 마포·용산·성동 등 한강벨트 7개 구는 73.1% 급감했다. 대출 규제로 20억~25억원대 아파트를 살 수 있는 수요가 많지 않아 고가 단지 위주로 가격 조정이 나타나고 있다. 반면 경기 화성 동탄은 11월 거래의 44.5%가 신고가로 체결됐고 한 달 사이 1억원 이상 오른 사례도 나왔다. 7월 이후 누적 상승률은 한강벨트가 2.5~4.5%인 데 비해 반도체벨트는 8.5~11.3%에 달한다. 현지에서는 반도체 기업의 고소득 맞벌이 가구가 성과급과 사내대출을 활용해 매수에 나서는 것이 상승을 떠받친다는 분석이 나온다.","url":"https://www.sedaily.com/article/20116135"}]},{"name":"정비사업","articles":[{"n":10,"title":"세금·분담금·재초환 삼중고…강남 재건축 호가 수억원씩 내렸다","meta":"2026.11.19 05:20 · 이데일리","body":"서울 강남권 재건축 단지에서 호가를 1억5000만~2억5000만원씩 낮춘 매물이 나오고 있다. 대치동 은마아파트와 잠실주공5단지 등이 대표적으로, 세금 부담과 공사비 추가분담금, 재건축초과이익환수제 부담금이 겹치며 매도자와 매수자 모두 결정을 미루는 분위기다. 강남3구 아파트 매물은 1년 전보다 84% 늘었고 은마아파트는 258% 급증했다. 관리처분계획 인가 전후로 세금 계산 방식이 달라져 거래 조건의 불확실성도 커졌다. 업계에서는 부담금 규모가 확정되기 전까지 거래 위축이 이어질 것으로 보고 있다.","url":"https://www.edaily.co.kr/News/Read?newsId=01269366645647360"},{"n":11,"title":"재초환 부담금이 가른 아파트값…반포 같은 단지서 호가 10억 차이","meta":"2026.11.18 11:23 · 헤럴드경제","body":"서울 서초구 반포동 래미안트리니원에서 같은 면적의 매물이 부담금 납부 주체에 따라 50억~70억원대로 10억원 가까이 벌어진 것으로 나타났다. 조합원 1인당 최대 7억원에 이를 수 있는 재건축초과이익환수 부담금이 수도권 중저가 아파트 한 채 값에 맞먹는 수준이기 때문이다. 2024년 개정법으로 면제 기준이 높아졌지만 강남권 재건축 단지는 여전히 억대 부담금을 피하기 어렵다. 부담금이 확정되기 전 소유권이 넘어가면 누가 낼지를 두고 분쟁 가능성이 커져 중개 현장에서도 혼선이 빚어지고 있다. 제도의 적절성을 놓고는 정부와 지방자치단체가 서로 다른 입장을 보이고 있다.","url":"https://biz.heraldcorp.com/article/10941095"}]},{"name":"금융/세제","articles":[{"n":15,"title":"가계빚 2030조원 돌파…은행 주택관련대출 증가폭은 되레 확대","meta":"2026.11.18 12:00 · 뉴스웨이","body":"한국은행 집계에서 올해 3분기 말 가계신용 잔액이 2030조5000억원으로 사상 최대를 기록했다. 분기 증가액은 2분기보다 줄었는데, 증시 조정 영향으로 신용대출 등 기타대출이 감소한 것이 주된 이유다. 반면 예금은행의 주택관련대출 증가폭은 6조8000억원에서 9조원으로 오히려 커졌다. 판매신용도 환급행사와 장기할부 혜택 등의 영향으로 5조원 늘었다. 한국은행은 명목 국내총생산이 가계부채보다 빠르게 늘고 있어 가계부채 비율은 점차 개선될 것으로 전망했다.","url":"https://www.newsway.co.kr/news/view?ud=2026111810474105247"},{"n":16,"title":"넓은 평형 신청했다 수억원 분담금…강동 재건축 조합원들의 한숨","meta":"2026.11.19 06:30 · 한국경제","body":"서울 강동구 명일·길동 일대 재건축 단지에서 기존보다 넓은 주택형을 신청한 조합원들이 수억원대 추가분담금을 마주하고 있다. 삼익그린2차는 기존 전용 84㎡ 소유주가 신축 84㎡를 받으려 해도 약 2억6000만원의 분담금이 필요한 것으로 추산된다. 삼익파크에서는 2주택 이상 보유자의 납부 조건이 바뀌어 입주 시점까지 미루던 자금을 앞당겨 마련해야 하는 상황이 생겼다. 분담금은 기존 주택 평가액과 사업 수익성, 새 주택 분양가에 따라 정해지며 공사비가 오르면 더 늘어날 수 있다. 여기에 재건축초과이익환수 부담금이 별도로 부과될 수 있어 두 비용을 구분해 자금 계획을 세워야 한다는 조언이 나온다.","url":"https://www.hankyung.com/article/2026111838246"}]},{"name":"임대주택","articles":[{"n":17,"title":"LH, 대학가 빈 상가도 임대주택으로…청년 주거 안전망 넓힌다","meta":"2026.11.18 18:29 · 파이낸셜뉴스","body":"서울의 청년 매입임대주택 청약 경쟁률이 평균 130대 1로 전국 평균의 2.6배에 달할 만큼 수요가 몰리고 있다. 한국토지주택공사(LH)는 올해 전국 3만8224가구 매입을 목표로 잡고, 대학가 공실 상가를 주거용으로 바꾸는 방식까지 활용하기로 했다. LH는 신축매입임대주택은 후보지 발굴부터 입주까지 1~2년이면 가능하다고 설명했다. 정부는 공사비 상승에 대응해 수도권 규제지역 매입가격에 최대 15%까지 반영하는 원가법을 도입했고, 토지소유권 동의 요건을 100%에서 75%로, 서류심사 통과점수를 70점에서 65점으로 낮췄다. 앞으로 3년간 서울 25개 자치구에서 2만528가구를 모집하며 이 가운데 청년 몫이 1만4558가구다.","url":"https://www.fnnews.com/news/202611181830029550"},{"n":18,"title":"보증금 1억2400만원에 월 49만원…용산 청년안심주택 청년형 472대 1","meta":"2026.11.19 07:00 · 헤럴드경제","body":"서울 용산의 청년안심주택 청약에 약 2만8358명이 신청해 평균 경쟁률 44.7대 1을 기록했다. 635가구 모집 가운데 청년형 103가구에 2만2442명이 몰려 472대 1까지 치솟은 반면, 물량의 84%를 차지한 신혼부부형은 11.1대 1에 그쳤다. 보증금 1억2400만원에 월 임대료 49만원 수준으로 책정돼 입지 대비 부담이 작다는 점이 수요를 끌어모았다. 공공지원 민간임대주택은 임대료 인상률이 연 5% 이내로 제한되고 최장 10년 거주가 가능하다. 전문가들은 1인 청년 가구의 주거 선택지가 부족한 만큼 공공 물량에서 청년 신청자격을 넓힐 필요가 있다고 지적했다.","url":"https://biz.heraldcorp.com/article/10941610"}]},{"name":"택지/도시개발","articles":[{"n":21,"title":"[단독] 수도권 그린벨트 거래 10건 중 8건이 '지분 쪼개기'","meta":"2026.11.18 18:33 · 파이낸셜뉴스","body":"그린벨트 해제 후보지로 거론되는 서초·강남·과천·의왕 4곳의 개발제한구역 거래 가운데 74.8%가 투기성으로 의심되는 지분 거래인 것으로 나타났다. 2024년부터 올해 11월 중순까지 이 지역 거래 1027건 중 768건이 지분거래였고, 과천 서초 연접·선바위역 일대는 524건 중 436건(83.2%)에 달했다. 과천의 한 임야에서는 2024년 10월 한 달 동안 초소형 지분 직거래 87건이 집중되기도 했다. 고준석 연세대 상남경영원 교수는 최근에는 개인이 표시가 나지 않게 직거래로 지분을 쪼개고 있다며 해제 발표 전 선점을 노린 거래가 기승을 부린다고 설명했다. 이런 지분거래는 사업 추진 때 알박기 수단으로 악용될 수 있다는 지적도 나온다.","url":"https://www.fnnews.com/news/202611181833518648"},{"n":22,"title":"3기 신도시 입주 1~3년 밀리자…인프라 갖춘 기존 신도시로 눈길","meta":"2026.11.18 14:42 · 파이낸셜뉴스","body":"남양주 왕숙, 하남 교산, 고양 창릉, 부천 대장 등 3기 신도시의 본청약과 입주 일정이 당초 계획보다 1~3년씩 미뤄지고 있다. 토지 보상과 거주자 이주, 환경 관련 절차 등이 겹치면서 사업 추진이 지연된 결과다. 입주 시점과 교통망·학교·상업시설 조성 시점이 어긋나면 초기 인프라 공백이 생길 수 있다는 우려가 나온다. 이에 따라 광교·일산·검단·고덕 등 기반시설이 이미 갖춰진 기존 신도시의 신규 단지로 실수요자의 관심이 옮겨가는 분위기다. 분양 업계는 생활 인프라가 완성된 지역의 신규 공급에 청약 수요가 몰릴 것으로 보고 있다.","url":"https://www.fnnews.com/news/202611181349474785"}]},{"name":"주택품질/안전","articles":[{"n":25,"title":"경기도, 노후 공동주택 전기·소방 합동점검…1622세대 겨울철 화재 예방","meta":"2026.11.18 21:42 · 국토교통뉴스","body":"경기도가 한국전기안전공사 경기본부, 수원·오산소방서, 주택관리공단과 함께 노후 공동주택 전기·소방 합동점검에 나섰다. 점검 대상은 수원 매탄6단지 주공아파트를 시작으로 오산 운암6단지, 수원 백설마을 주공아파트 등 3개 단지 1622세대이며 11월 18일부터 25일까지 진행된다. 한국전기안전공사는 점검인력 20여 명을 투입해 누전차단기 작동 여부와 옥내 배선 상태를 확인하고 필요하면 차단기·스위치 교체 등 경미한 시설 개선을 지원한다. 관할 소방서는 소화기와 화재감지기 등 세대 내 소방시설을 점검하고 초기 대응 요령을 교육한다. 경기도는 이번 점검 결과를 토대로 2027~2029년 관계기관이 참여하는 정기 합동점검 체계를 구축할 방침이다.","url":"https://www.guktonews.co.kr/10153"}]},{"name":"분양정보","articles":[{"n":26,"title":"'디에이치 반포124' 분양가 심의 보류…청약 일정 12월로 밀려","meta":"2026.11.18 18:42 · 한국경제","body":"서울 서초구 반포주공1단지를 재건축하는 디에이치 반포124의 분양가 심의위원회가 추가 검토가 필요하다며 결정을 보류했다. 재심의는 12월 4일 오후 2시에 열릴 예정이어서 당초 11월 27일 모집공고, 12월 7~8일 청약으로 잡혔던 일정이 미뤄질 전망이다. 현대건설이 시공하는 이 단지는 5007가구 규모로 약 1801가구가 일반분양된다. 분양가상한제가 적용돼 인근 고가 아파트와의 가격 차이가 크게 벌어질 것으로 예상되면서 30억 로또로 불린다. 조합은 재심의 결과에 따라 연내 분양 가능 여부를 다시 판단할 계획이다.","url":"https://www.hankyung.com/article/2026111857156"}]},{"name":"논설/사설","articles":[{"n":29,"title":"[취재수첩] 청년 두 번 울리는 청년안심주택","meta":"2026.11.18 17:37 · 한국경제","body":"서울시 청년안심주택에서 입주자 모집과 보증금 관리의 허점이 잇따라 드러났다. 해링턴 플레이스 용산 리버뷰에서는 당첨자 635명뿐 아니라 예비당첨자 수백 명에게도 당첨 문자가 잘못 발송됐고, 강변스카이타워에서는 민간 사업자가 자격을 제대로 확인하지 않아 당첨자 85명 중 19명이 부적격자로 밝혀졌다. 도림브라보 입주자 4명은 계약 만기가 지나도 보증금을 돌려받지 못하고 있으며, 전체 81가구 중 43가구가 보증보험을 갱신하지 않아 위험에 노출됐다. 지난해에만 4개 사업장에서 296명이 보증금 미반환 피해를 봤다. 서울시가 2030년까지 1만7500가구를 공급하겠다고 밝힌 만큼 물량 확대에 앞서 모집·계약·보증금 반환 전 과정의 신뢰 회복이 필요하다는 지적이다.","url":"https://www.hankyung.com/article/2026111855271"}]}]},{"date":"2026-11-18","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"아파트 리모델링 동의율 75%→70%로 완화…주택법 시행령 국무회의 의결"},{"n":3,"text":"자가보유율 62.0% 역대 최고…\"내 집 필요\" 응답은 3년째 하락"},{"n":7,"text":"1.7조 광명 철산주공13단지 재건축, 현대건설 단독 응찰로 유찰"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"아파트 리모델링 동의율 75%→70%로 완화…주택법 시행령 국무회의 의결","meta":"2026.11.17 17:19 · 한국경제","body":"국토교통부는 17일 리모델링 동의 요건을 낮추는 내용의 주택법 시행령 개정안이 국무회의에서 의결됐다고 밝혔다. 주택단지 전체와 개별 동을 리모델링할 때 필요한 구분소유자·의결권 동의율이 각각 75% 이상에서 70% 이상으로 완화되며, 동별 50% 이상 동의 요건은 현행대로 유지된다. 수직증축 리모델링의 안전성 검토 전문기관에는 기존 한국건설기술연구원·국토안전관리원에 더해 한국부동산원이 추가돼 세 곳으로 늘어난다. 장기 복무 군인의 분양가상한제 주택 거주의무 예외 확대, 지역주택조합 조합원 간 혼인 시 자격 특례도 함께 담겼다. 리모델링 관련 두 규정은 2027년 1월 1일부터 시행된다.","url":"https://www.hankyung.com/article/2026111726131"},{"n":2,"title":"오세훈 서울시장 \"재초환은 제2의 종부세…전면 재검토해야\"","meta":"2026.11.17 19:01 · 파이낸셜뉴스","body":"오세훈 서울시장은 17일 서울시의회 시정질문에서 재건축초과이익환수제에 대해 부작용이 심각해 전면 재검토해야 한다는 것이 서울시의 일관된 입장이라고 밝혔다. 오 시장은 양도소득세와의 이중과세 논란이 있고 부담금이 집값에 반영돼 상승 요인이 될 수 있다고 주장했으며, 제2의 종합부동산세 논란을 야기할 수 있다고 말했다. 재건축 분담금에 재초환 부담금까지 더해지면 일반 급여소득자나 은퇴한 고령 소유주가 집을 떠날 수밖에 없다는 우려도 내놨다. 서초구 반포현대에 179억원, 강남구 은마아파트에 1인당 평균 4억6000만원의 재건축부담금 예정액이 통지된 상태다. 주택 공급 부족 책임 논쟁에 대해서는 박원순 시정에서 정비구역 389곳이 해제돼 약 43만호의 공급 기회가 사라졌다고 반박했다.","url":"https://www.fnnews.com/news/202611171901339848"}]},{"name":"시장동향","articles":[{"n":3,"title":"자가보유율 62.0% 역대 최고…\"내 집 필요\" 응답은 3년째 하락","meta":"2026.11.17 16:56 · 뉴스1","body":"국토교통부가 17일 발표한 2025년도 주거실태조사에서 전체 가구 자가보유율은 62.0%로 2006년 조사 시작 이후 가장 높았다. 자가점유율도 59.1%로 전년보다 0.7%포인트 올랐고, 수도권 자가보유율은 55.6%에서 56.0%로 소폭 상승했다. 반면 내 집을 반드시 보유해야 한다는 응답은 85.6%로 3년 연속 낮아졌다. 주거이동률은 31.2%로 반등했고 평균 거주기간은 8.4년으로 집계됐다. 이번 조사는 전국 6만1000가구를 대상으로 이뤄졌다.","url":"https://www.news1.kr/realestate/general/6356442"},{"n":4,"title":"서울 PIR 11.7배…소득 한 푼 안 쓰고 12년 모아야 내 집 마련","meta":"2026.11.17 17:20 · 한국경제","body":"2025년도 주거실태조사에서 서울의 연소득 대비 주택가격 비율(PIR)은 11.7배로 나타났다. 소득을 전혀 쓰지 않고 약 12년을 모아야 서울에서 집을 살 수 있다는 의미다. 가구주가 된 뒤 생애 최초로 주택을 마련하기까지 걸린 기간은 7.9년에서 8.0년으로 늘어 조사 시작 이후 가장 길었다. 수도권 임차가구는 월소득의 약 20%를 임대료로 지출했고, 경기 지역 임차가구의 월소득 대비 임대료 비율은 15.2%에서 17.4%로 2.2%포인트 상승했다. 전국 자가보유율은 62.0%로 역대 최고를 기록했다.","url":"https://www.hankyung.com/article/2026111726121"}]},{"name":"정비사업","articles":[{"n":7,"title":"1.7조 광명 철산주공13단지 재건축, 현대건설 단독 응찰로 유찰","meta":"2026.11.17 17:04 · 데일리한국","body":"경기 광명 철산주공13단지 재건축조합이 17일 시공사 선정 입찰을 마감한 결과 현대건설만 입찰서를 제출해 유찰됐다. 현장설명회에는 건설사 세 곳이 참석했지만 실제 입찰에는 한 곳만 참여했다. 이 단지는 지상 49층, 3719가구로 재건축되며 공사비는 약 1조7160억원 규모다. 입찰보증금은 4000억원으로 책정됐고 컨소시엄 참여는 허용되지 않았다. 조합은 다음 주 2차 현장설명회를 열 예정이며, 다시 단독 응찰이 나오면 수의계약 전환 여부를 논의할 계획이다.","url":"https://daily.hankooki.com/news/articleView.html?idxno=1426131"},{"n":8,"title":"사당17구역 재개발 현장설명회에 대우·롯데 등 4개사 참여","meta":"2026.11.17 12:30 · 시사오늘","body":"서울 동작구 사당17구역 재개발조합이 17일 연 1차 현장설명회에 대우건설·롯데건설·제일건설·진흥기업 등 4개사가 참여했다. 이 구역은 지상 23층, 856가구 규모로 조성되며 공사비는 3.3㎡당 955만원, 총 4430억원 수준으로 추산된다. 입찰 마감은 2027년 1월 4일이며, 조합은 입찰 결과에 따라 2027년 2~3월 시공사 선정 총회를 열 계획이다. 다만 건설사들이 사업 조건과 입찰 지침을 검토 중이어서 실제 입찰 참여는 유동적이다. 사당17구역은 신속통합기획으로 2026년 1월 구역 지정, 8월 조합 설립 인가를 받아 사업 속도가 빠른 편이다.","url":"https://www.sisaon.co.kr/news/articleView.html?idxno=206135"}]},{"name":"금융/세제","articles":[{"n":9,"title":"주담대 변동금리가 고정금리 추월…차주 선택 셈법 복잡해져","meta":"2026.11.17 19:14 · 세계일보","body":"17일 기준 5대 시중은행의 6개월 변동형 주택담보대출 금리 상단이 연 6.51%로, 5년 고정형 상단 6.40%보다 0.11%포인트 높아지는 역전 현상이 나타났다. 10월 신규취급액 기준 코픽스가 연 3.62%로 2년 8개월 만에 최고치를 기록하면서 변동형 금리가 오른 반면, 고정형 기준인 5년물 은행채 금리는 4.514%에서 4.057%로 내렸기 때문이다. 한국은행의 추가 인상 가능성이 남아 있어 코픽스와 단기 은행채 금리는 더 오를 수 있다는 관측이 나온다. 반면 장기 은행채 금리는 경기 전망에 따라 방향이 불확실하다. 전문가들은 급하지 않은 주택 구입이라면 내년 초까지 관망할 것을 권했다.","url":"https://www.segye.com/newsView/20261117515501"},{"n":10,"title":"리츠협회 \"미분양 빌라·주거용 오피스텔도 CR리츠 세제 혜택 줘야\"","meta":"2026.11.17 16:03 · 한국경제","body":"한국리츠협회는 기업구조조정(CR)리츠의 취득세 감면 대상을 아파트뿐 아니라 연립·다세대주택과 주거용 오피스텔까지 넓혀 달라고 17일 건의했다. 현재는 수도권 밖에서 매입한 아파트에만 세제 혜택이 적용돼 빌라를 매입하면 취득세를 60% 더 내야 하는 등 주택 유형별로 과세가 엇갈린다는 지적이다. 협회는 지방 미분양 주택이 3만 가구에 육박하고 이 가운데 85%가 광역시 밖에 몰려 있다는 점을 근거로 들었다. 리츠가 수익의 90% 이상을 투자자에게 배당해야 하는 구조여서 재정 부담 없이 미분양을 해소할 수 있다는 주장도 폈다. 세제 지원 확대 여부는 정부 판단에 달려 있다.","url":"https://www.hankyung.com/article/202611172329i"}]},{"name":"임대주택","articles":[{"n":11,"title":"세입자 임대료 부담 8년 만에 최고…월소득의 17%를 임대료로","meta":"2026.11.18 01:10 · 서울신문","body":"국토교통부 2025년도 주거실태조사에서 전국 임차가구의 월소득 대비 월임대료 비율(RIR)은 17.0%로 전년 15.8%보다 1.2%포인트 올랐다. 조사를 매년 실시로 바꾼 2017년 이후 8년 만에 가장 높은 수치이며 1년 새 상승 폭도 2017년 이후 최대다. 서울은 21.5%로 전국에서 가장 높았고 세종 18.2%, 경기 17.4% 순이었다. 청년 임차가구는 17.4%, 신혼부부는 20.2%로 전체 평균을 크게 웃돌았다. 전세의 월세 전환이 이어지면서 임차가구의 주거비 부담이 구조적으로 커지고 있다는 분석이 나온다.","url":"https://www.seoul.co.kr/news/economy/2026/11/18/20261118032001"},{"n":12,"title":"올해 서울 아파트 전셋값 상승률 작년의 3.7배…평균 6억4538만원","meta":"2026.11.18 05:45 · 뉴스1","body":"한국부동산원 집계 결과 올해 1~10월 서울 아파트 전세가격지수 누적 상승률은 9.03%로 지난해 같은 기간 2.42%의 약 3.7배에 달했다. 지난달 서울 아파트 평균 전셋값은 6억4538만원으로 1년 전 5억8298만원보다 6240만원(10.7%) 올랐다. 대출 규제로 매수 자금을 마련하지 못한 수요가 계약 갱신 등으로 전세시장에 남으면서 수요가 누적된 영향이다. 갭투자가 사라져 임대 목적의 주택 공급이 줄어든 점도 전세 매물 부족을 키웠다. 입주 물량 감소까지 겹쳐 전셋값 상승 압력이 당분간 이어질 것이라는 전망이 나온다.","url":"https://www.news1.kr/realestate/general/6356698"}]},{"name":"택지/도시개발","articles":[{"n":14,"title":"서울시, 18일 도심복합사업 사전기획협의체 개최…국토부와 갈등 봉합","meta":"2026.11.17 16:58 · 아시아경제","body":"도심공공주택복합사업 지연 책임을 두고 국토교통부와 충돌했던 서울시가 18일 8개 사업지에 대한 사전기획협의체를 열기로 했다. LH는 17일 서울시와 국토부, 관할 자치구에 협의체 개최 요청 공문을 전달했다. 서울시와 국토부는 쟁점이었던 용적률 완화 범위에 대해 상당 부분 이견을 좁힌 것으로 알려졌다. 협의가 지연된 8개 지구의 주택 공급 규모는 모두 1만5993가구다. 협의체 개최로 도시계획 절차가 재개되면 해당 물량의 공급에 속도가 붙을 전망이다.","url":"https://view.asiae.co.kr/article/2026111716445817500"}]},{"name":"주택품질/안전","articles":[{"n":15,"title":"안성 아파트 공사현장 18층에서 불…작업자 12명 자력 대피","meta":"2026.11.17 11:11 · 인천일보","body":"17일 오전 9시 59분쯤 경기 안성시 옥산동 아파트 공사현장 18층에서 불이 났다. 현장에 있던 12명이 스스로 대피했으며, 소방당국은 장비 28대와 인력 57명을 투입해 오전 10시 45분 불을 완전히 껐다. 화재 발생 46분 만의 진화였다. 소방당국은 인명피해 여부를 확인하고 있다고 밝혔다. 정확한 화재 원인과 피해 규모는 조사가 진행되고 있다.","url":"https://www.incheonilbo.com/news/articleView.html?idxno=1336991"},{"n":16,"title":"거실을 침실로 바꾸고 AI가 냉난방 조절…건설사 미래 아파트 경쟁","meta":"2026.11.17 17:22 · 한국경제","body":"GS건설이 인공지능과 가변형 공간 기술을 결합한 미래 주거상품 비욘드 리빙을 공개했다. LG전자와 함께 개발한 AI 홈은 거주자 상황을 인식해 조명과 냉난방, 환기를 자동 제어하며 2027년 하반기부터 단계적으로 적용될 예정이다. 삼성물산과 현대건설, 대우건설도 가변형 구조와 AI 기술 개발에 나서고 있다. 인구구조와 생활방식 변화로 주거 편의성과 서비스가 아파트 브랜드 경쟁력을 가르는 요소로 떠올랐다는 평가가 나온다. 건설사들은 기후 대응 기술까지 포함한 주거 솔루션 개발 경쟁을 벌이고 있다.","url":"https://www.hankyung.com/article/2026111726101"}]},{"name":"분양정보","articles":[{"n":17,"title":"연말까지 영·호남에 1.9만가구 분양…호남 물량 6배로 급증","meta":"2026.11.17 17:21 · 한국경제","body":"이달과 다음 달 영남·호남에서 분양 예정인 민간 아파트는 1만8992가구로 집계됐다. 영남이 1만2011가구로 지난해 같은 기간보다 29.7% 늘었고, 부산이 4461가구로 가장 많다. 호남은 6981가구로 지난해 같은 기간의 6배를 웃도는 수준이다. 호반건설은 부산 동구에 호반써밋 초량을 공급하고, 대우건설은 경북도청 신도시 인근에 푸르지오 단지를 선보인다. 두산건설과 현대엔지니어링 등도 연말 분양을 준비하고 있다.","url":"https://www.hankyung.com/article/2026111726171"}]},{"name":"논설/사설","articles":[{"n":20,"title":"[톡톡! 부동산] 월급의 5분의 1이 집세…결혼도 출산도 가로막는 월세의 덫","meta":"2026.11.17 16:32 · 핀포인트뉴스","body":"2025년도 주거실태조사를 근거로 월세 부담이 청년과 신혼부부의 생애 설계를 가로막고 있다고 지적한 칼럼이다. 신혼부부 임차가구의 월소득 대비 임대료 비율은 20.2%로 1년 새 2.5%포인트 올랐고, 청년 임차가구도 17.4%, 서울은 21.5%에 이른다고 짚었다. 임차가구의 평균 거주기간은 3.7년으로 자가가구 11.5년에 크게 못 미쳐 주거 불안정도 함께 커졌다고 봤다. 필자는 청년들이 결혼을 미루는 이유로 경제적 여건에 이어 보증금을 포함한 주택 마련의 어려움을 꼽았다는 조사 결과를 들어 주거비가 인구 문제와 직결된다고 주장했다. 생애 최초 주택 마련 기간이 8.0년으로 역대 최장이고 서울 PIR이 11.7배라는 점도 근거로 제시했다.","url":"https://www.pinpointnews.co.kr/news/articleView.html?idxno=505127"}]}]},{"date":"2026-11-17","count":15,"pdf_count":22,"highlights":[{"n":1,"text":"홍지선 국토부 장관, 국내 최대 모듈러 공공주택 현장 점검…2030년까지 2만 가구 발주"},{"n":4,"text":"서울 집값 석 달째 상승폭 둔화…경기 상승률이 서울 추월"},{"n":10,"text":"목동4단지도 현대건설 단독 응찰로 유찰…목동 6개 단지 모두 무경쟁"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"홍지선 국토부 장관, 국내 최대 모듈러 공공주택 현장 점검…2030년까지 2만 가구 발주","meta":"2026.11.16 16:38 · 이투데이","body":"홍지선 국토교통부 장관이 16일 세종시 5-1 생활권 L5블록 통합공공임대주택 건설현장을 찾아 모듈러 공법 시공 과정을 점검했다. 이 사업은 전체 1327가구 가운데 450가구를 모듈러 공법으로 짓는 국내 최대 규모로, 공동주택에 스마트 턴키 방식이 처음 적용됐다. 국토부는 2027년부터 2030년까지 공공주택 모듈러 발주 물량을 2만 가구로 확대하고, 일반 공법보다 비싼 공사비를 호당 3500만원씩 지원하겠다고 밝혔다. 홍 장관은 모듈러 공법이 건설산업을 노동 중심에서 기술 중심으로 바꾸고 공사기간도 크게 줄일 수 있는 핵심 대안이라고 평가했다. 정부는 모듈러 특별법 제정도 함께 추진하고 있다.","url":"https://www.etoday.co.kr/news/view/2648835"},{"n":2,"title":"재초환 부과 시한 해석 놓고 국토부 고심…이달 중 법령해석 내놓기로","meta":"2026.11.16 17:40 · 머니투데이방송","body":"서초구청이 반포현대 재건축조합에 재건축초과이익환수 부담금 예정액 179억원을 통보하면서 부과 시한을 둘러싼 법 해석 논란이 커지고 있다. 조합원 80명 기준으로 1인당 평균 2억2000만원이 넘는 금액이다. 준공 후 5개월이 지난 시점부터 5년이 지나면 부과할 수 없다는 규정을 적용하면 올해 12월까지 부과해야 하지만, 2년 전 개정법의 특례를 적용하면 2029년 8월까지 가능하다는 해석도 나온다. 적용 방식에 따라 부과 시한이 최대 2년 8개월가량 달라진다. 국토교통부 장관은 재초환이 주택가격 안정과 과도한 재산권 침해 사이의 균형 문제라고 언급했고, 국토부는 이달 안에 법령 해석을 발표하기로 했다.","url":"https://news.mtn.co.kr/article/2026111616105037897"}]},{"name":"시장동향","articles":[{"n":4,"title":"서울 집값 석 달째 상승폭 둔화…경기 상승률이 서울 추월","meta":"2026.11.16 14:00 · 이투데이","body":"한국부동산원이 16일 발표한 10월 전국주택가격동향조사에 따르면 서울 주택 매매가격은 0.65% 올라 7월 1.09%, 8월 0.97%, 9월 0.84%에 이어 석 달 연속 오름폭이 줄었다. 강남구(-1.24%)와 서초구(-0.75%)는 석 달 연속 하락한 반면 서대문구(1.35%)와 노원구(1.34%)는 1% 넘게 올라 지역별 온도차가 뚜렷했다. 부동산원은 일부 지역에서 하락 매물이 나오며 조정 거래가 발생한 반면 선호 지역에서는 상승 계약이 체결돼 상승과 하락이 혼재했다고 설명했다. 경기는 0.66% 올라 전월(0.63%)보다 오름폭이 커지며 서울을 앞질렀고, 아파트만 보면 경기(0.87%)가 서울(0.54%)을 크게 웃돌았다. 전·월세도 화성 동탄과 수원 영통구 등 주거 선호지역을 중심으로 상승세가 이어졌다.","url":"https://www.etoday.co.kr/news/view/2648598"},{"n":5,"title":"서울 연립·다세대 상승률, 아파트 웃돌았다…올해 누적 격차도 좁혀","meta":"2026.11.16 14:21 · 파이낸셜뉴스","body":"10월 서울 연립·다세대주택 매매가격은 0.85% 올라 아파트(0.54%)와 단독·다가구(0.49%)를 모두 앞질렀다. 올해 누적 상승률은 아파트 8.90%, 연립·다세대 8.25%로 격차가 0.65%p까지 좁혀졌다. 지난해 같은 기간과 비교하면 연립·다세대의 상승폭 확대(4.82%p)가 아파트(1.73%p)보다 훨씬 컸다. 아파트값 부담과 대출 규제로 밀려난 수요가 상대적으로 저렴한 빌라로 옮겨간 영향으로 풀이된다. 전세와 월세는 역세권·대단지를 중심으로 아파트 상승률이 가장 높게 나타났다.","url":"https://www.fnnews.com/news/202611161049080983"}]},{"name":"정비사업","articles":[{"n":10,"title":"목동4단지도 현대건설 단독 응찰로 유찰…목동 6개 단지 모두 무경쟁","meta":"2026.11.16 15:53 · 아주경제","body":"목동신시가지 4단지 재건축 시공사 선정 1차 입찰이 16일 마감됐으나 현대건설만 단독 응찰해 유찰됐다. 4단지 예정 공사비는 1조6389억원으로 3.3㎡당 1010만원인데, 목동 재건축 단지 가운데 처음으로 1000만원을 넘겼다. 그럼에도 목동 6개 단지가 모두 첫 입찰에서 단독 응찰로 유찰되면서 조합이 여러 건설사의 공사비와 설계 조건을 비교하기 어려워졌다. 무경쟁 입찰이 반복되면 조합의 협상력이 약해지고 공사비 인상 시 주민 부담이 커질 수 있다는 우려가 나온다. 조합은 재입찰을 거쳐 내년 2월 안에 시공사 선정 총회를 여는 것을 목표로 하고 있다.","url":"https://www.ajunews.com/view/20261116152022576"},{"n":11,"title":"대우건설, 여의도 화랑아파트 재건축 수주…여의도 두 번째 사업지","meta":"2026.11.16 16:09 · 조세금융신문","body":"대우건설이 서울 영등포구 여의도동 화랑아파트 소규모재건축사업 시공사로 선정됐다. 공작아파트에 이은 두 번째 여의도 정비사업 수주로, 총공사비는 2749억원 규모다. 지하 4층~지상 최고 49층, 1개 동, 268가구로 지어지며 단지명으로 '써밋 더 한강'을 제안했다. 네덜란드 건축설계그룹 UN스튜디오가 설계에 참여했고 모든 가구에서 한강을 볼 수 있도록 배치했으며, 천장고는 일반 아파트보다 높은 2.7~3.7m를 적용한다. 대우건설은 여의도 장미아파트 재건축 수주에도 적극 나설 계획이라고 밝혔다.","url":"https://www.tfmedia.co.kr/news/article.html?no=208932"}]},{"name":"금융/세제","articles":[{"n":13,"title":"코픽스 2년 8개월 만에 최고…17일부터 변동형 주담대 금리 인상","meta":"2026.11.16 15:56 · 한국일보","body":"10월 신규취급액 기준 코픽스가 연 3.62%로 전월보다 0.19%포인트 올라 7개월 연속 상승하며 2년 8개월 만에 최고 수준을 기록했다. 이에 따라 KB국민은행은 17일부터 코픽스 연동 주택담보대출 변동금리(6개월)를 연 4.66~6.06%에서 4.85~6.25%로 올린다. 우리은행도 같은 기준 금리를 연 4.85~6.05%에서 5.04~6.24%로 인상한다. 우리은행의 경우 변동형 금리가 5년 고정형(4.94~6.14%)을 웃도는 이례적인 역전 현상이 나타났다. 변동형 주담대는 통상 6개월마다 금리가 재산정돼 재산정 시점을 맞은 차주들의 이자 부담이 커질 전망이다.","url":"https://www.hankookilbo.com/news/article/A2026111615170000104"},{"n":14,"title":"은행권, 새해 주담대 수요 선점 나서…신용대출 빗장은 더 조여","meta":"2026.11.16 16:49 · 머니투데이","body":"KB국민은행을 제외한 NH농협·하나·우리·신한 등 4대 시중은행이 모기지보험 가입 제한을 풀면서 주택담보대출 취급을 다시 늘리고 있다. 내년 1월 새 가계대출 총량이 배정되는 것을 앞두고 선제적으로 주담대 수요를 확보하려는 전략으로 풀이된다. 반면 신용대출은 규제를 강화해 우리은행은 개인 신용대출 한도 증액을 전면 중단했다. 증시 조정 이후 반등을 노린 이른바 '빚투' 수요가 신용대출 증가를 부추긴다는 우려 때문이다. 11월 13일 기준 5대 은행 신용대출은 6832억원 늘어 주담대 증가액(4358억원)을 크게 웃돌았다.","url":"https://www.mt.co.kr/finance/2026/11/16/2026111616072335425"}]},{"name":"임대주택","articles":[{"n":16,"title":"같은 단지인데 신규·갱신 전셋값 6.6억 격차…전세 매물 줄자 부담 확대","meta":"2026.11.16 13:20 · 뉴스1","body":"서울 강동구 올림픽파크포레온에서 신규 전세보증금과 갱신 전세보증금의 차이가 6억5500만원까지 벌어졌다. 같은 단지에서 신규 계약은 16억원대, 갱신 계약은 9억4500만원대에 체결되고 있다. 전세 매물이 계속 줄면서 서울 전세수급지수는 120.2를 기록해 수요가 공급을 크게 웃돌고 있다. 갱신권 사용과 월세화가 겹치며 신규로 집을 구해야 하는 세입자의 부담이 커지는 구조다. 업계에서는 반포 등 분양 대기 수요가 매수로 전환할 가능성도 제기된다.","url":"https://www.news1.kr/realestate/general/6355277"},{"n":17,"title":"오피스텔 월세는 뛰는데 분양은 미달…시장 온도차 뚜렷","meta":"2026.11.16 15:51 · 이투데이","body":"오피스텔 월세가격은 오르고 있지만 신규 분양시장에서는 청약 미달이 잇따르고 있다. 서울 영등포구 'GD 메트로 타워'는 770실 모집에 99건만 접수돼 평균 경쟁률이 0.13대 1에 그쳤다. 아파트 대출 규제에 따른 대체 수요가 입지와 분양가, 상품성을 따져 선별적으로 움직이고 있다는 분석이다. 서울 오피스텔 월세가격은 1.02% 올랐지만 매매가격 상승률은 0.07%로 둔화했다. 전문가들은 모든 오피스텔이 아니라 방 2~3개를 갖춘 아파트 대체형 중심으로 가격이 오르고 있다고 설명했다.","url":"https://www.etoday.co.kr/news/view/2648662"}]},{"name":"택지/도시개발","articles":[{"n":18,"title":"LH 흑자 전환했지만 부채 185조…공급 확대와 조직 개혁 동시 과제","meta":"2026.11.17 06:00 · 뉴스핌","body":"한국토지주택공사(LH)는 상반기 매출 9조3626억원으로 전년 대비 37% 늘고 영업이익 3955억원을 거두며 흑자로 돌아섰다. 그러나 부채는 185조7048억원으로 12조원 늘었고 부채비율도 230.8%에서 237.5%로 높아졌다. 직접 주택 건설과 임대주택 공급이 늘면서 초기 사업비 부담이 커졌고, 임대주택 사업에서는 수입보다 1조4652억원 많은 원가 부담이 이어지고 있다. 2030년까지 부채가 372조원대로 늘고 연간 지급이자도 3조원에서 7조원으로 두 배 이상 불어날 것으로 전망된다. 이성훈 사장은 공급 확대를 위한 자금 조달과 조직 분리 개혁 완수라는 이중 과제를 안게 됐다.","url":"https://www.newspim.com/news/view/20261116001117"}]},{"name":"주택품질/안전","articles":[{"n":19,"title":"경산·포항 아파트에서 밤사이 화재 잇따라…주민 8명 부상","meta":"2026.11.16 08:38 · 경향신문","body":"경북 지역에서 밤사이 아파트 화재가 두 건 발생해 모두 8명이 다쳤다. 경산시 백천동 15층 아파트 10층에서 불이 나 허벅지에 2도 화상을 입은 1명과 연기를 마신 7명이 병원으로 옮겨졌다. 이 불로 주민 138명이 대피했으며 소방관들이 거동이 불편한 주민 38명을 직접 업어 구조했다. 포항시 북구 45층 아파트 42층에서도 보조배터리 발화로 추정되는 불이 났으나 25명이 안전하게 대피해 인명피해는 없었다. 경찰과 소방당국이 두 화재의 정확한 원인을 조사하고 있다.","url":"https://www.khan.co.kr/article/202611160838001/"}]},{"name":"분양정보","articles":[{"n":20,"title":"쇼핑시설 낀 '몰세권' 단지 몸값 급등…연말 분양도 잇따라","meta":"2026.11.16 09:48 · 파이낸셜뉴스","body":"백화점·복합쇼핑몰·아웃렛을 끼고 있는 아파트값이 분양가의 3~4배 이상으로 뛰며 신고가를 경신하고 있다. 동탄역 롯데캐슬 전용 84㎡는 2017년 4억7200만원에서 현재 22억원대에 거래되고 있고, 광명역파크자이도 약 3.3배 올랐다. 영등포와 대구의 이른바 몰세권 단지들은 청약에서 60~100대 1의 높은 경쟁률을 기록했다. 백화점과 쇼핑몰이 단순 구매 공간을 넘어 문화·여가를 함께 즐기는 생활 거점으로 바뀌면서 선호도가 높아졌다는 분석이다. 연말까지 영등포, 안산, 평택 등에서 쇼핑시설 인근 단지 분양이 예정돼 있다.","url":"https://www.fnnews.com/news/202611160944143340"}]},{"name":"논설/사설","articles":[{"n":21,"title":"[사설] 지방 재건축 '재초환' 손질 필요하다","meta":"2026.11.16 17:06 · 중도일보","body":"사설은 재건축초과이익환수제가 수도권 투기 억제를 위해 도입된 제도인 만큼 지방 재건축에 그대로 적용하는 것은 부적절하다고 주장했다. 미실현 이익에 부담금을 매기는 것은 과잉금지 원칙에 어긋난다며 비수도권 재건축은 대상에서 제외해야 한다고 했다. 지방은 주택가격 상승폭이 작아 정상주택가격상승분 공제액도 적어 부담금이 상대적으로 과도해진다는 점을 근거로 들었다. 사업성 악화로 재건축이 지연되거나 중단되면 도시 내 주택 공급이 위축될 수 있다고 지적했다. 수도권과 지방의 사업 수익 구조 차이가 큰 만큼 동일 기준 적용은 불합리하다며 제도 개선을 촉구했다.","url":"https://www.joongdo.co.kr/web/view.php?key=20261116010005519"},{"n":22,"title":"[편집국에서] 집은 남아도는데 집값은 계속 오른다","meta":"2026.11.16 17:02 · 중도일보","body":"칼럼은 대전 선호 지역 아파트 호가가 30억원대까지 오르며 서울 수준의 가격대를 형성하고 있다고 지적했다. 집은 넘쳐나는데 일부 지역의 집값만 오르는 역설적 현상이 벌어지고 있다는 진단이다. 지역별 주거 선호도 차이가 뚜렷해지면서 선호 지역은 진입 장벽이 높아지고 비선호 지역에는 미분양이 쌓이는 악순환이 나타난다고 봤다. 필자는 지역별 수급 상황을 세밀하게 분석해 미분양 집중 지역과 수요 지역에 맞는 차별화된 공급 정책이 필요하다고 주장했다. 아울러 원도심의 기반시설과 교육 인프라를 확충해 주거 경쟁력을 높여야 한다고 제언했다.","url":"https://www.joongdo.co.kr/web/view.php?key=20261116010005347"}]}]},{"date":"2026-11-16","count":15,"pdf_count":24,"highlights":[{"n":1,"text":"국토부 \"토허제·규제지역 연장 12월 결론…재초환 부과시기는 이달 중 정리\""},{"n":4,"text":"'성동·강동구 하락' 한강벨트까지 냉기 번졌다"},{"n":7,"text":"재초환 '날벼락'에…재건축 조합장들 한자리에 모인다"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"국토부 \"토허제·규제지역 연장 12월 결론…재초환 부과시기는 이달 중 정리\"","meta":"2026.11.13 15:53 · 뉴스핌","body":"국토교통부는 11월 13일 정부서울청사에서 제3차 주택공급 정례브리핑을 열고 서울 전역과 경기 12개 시·군·구에 지정된 토지거래허가구역, 투기과열지구, 조정대상지역의 연장 여부를 12월 중 결론 내겠다고 밝혔다. 김영국 주택토지실장은 토허제 지정 이후 시장과 국민에게 미친 영향을 종합 분석 중이라고 설명했다. 정우진 주택공급추진본부장은 재건축초과이익환수제 부담금 부과기한 논란에 대해 법제처 유권해석을 거쳐 이달 안에 결론을 내겠다며 현장 혼란이 심해 조속히 정리할 필요가 있다고 말했다. 국토부는 재개발·재건축 알박기 대응책으로 보상 후 미퇴거 시 이행강제금을 물리고 협조 주민에게는 장려금을 주는 방안도 검토 중이라고 덧붙였다.","url":"https://www.newspim.com/news/view/20261113001166"},{"n":2,"title":"정부 \"서울 집값 하향 안정 중\"…수도권 내년 3월까지 4만4000가구 입주","meta":"2026.11.13 17:43 · 경향신문","body":"정부는 11월 13일 주택공급 정례브리핑에서 서울 주택시장에 하향 안정 신호가 늘고 있다고 진단했다. 근거로 강남·서초구 아파트값이 14주 연속 하락한 점과 11월 11일 기준 서울 아파트 매매 매물이 8만 건을 넘어 연초보다 40% 이상 늘어난 점을 제시했다. 정부는 서울을 포함한 수도권에서 이달부터 내년 1분기까지 아파트 4만4000가구가 입주한다고 밝혔다. 연말까지 1만6000가구, 내년 1분기 2만8000가구가 집들이에 나서며 이 가운데 서울 물량은 내년 1분기 약 6000가구다.","url":"https://khan.co.kr/article/202611131743001"}]},{"name":"시장동향","articles":[{"n":4,"title":"'성동·강동구 하락' 한강벨트까지 냉기 번졌다","meta":"2026.11.14 08:00 · 비즈워치","body":"서울 집값 조정이 강남3구를 넘어 한강벨트로 번지고 있다. 한국부동산원 주간 통계에서 성동구는 32주 만에 0.02% 하락하며 마이너스로 돌아섰고 강동구도 33주 만에 0.01% 내렸다. 송파구는 하락폭이 0.35%로 커졌다. 반면 경기 남부는 반도체 호재를 등에 업고 수원 영통구 0.60%, 군포 0.56%, 화성 동탄구 0.56% 등 강세를 이어갔다. 업계에서는 매수세 위축에 따른 조정이라는 해석과 수도권 하방 경직성이 유지될 것이라는 전망이 엇갈린다.","url":"https://news.bizwatch.co.kr/article/real_estate/2026/11/13/0054"},{"n":5,"title":"\"한 달 새 4억 내렸는데도 안 팔려\"…강남벨트 거래 절벽","meta":"2026.11.14 12:22 · 서울경제","body":"강남권 일부 단지에서 호가를 크게 낮춘 매물이 나오고 있지만 거래가 좀처럼 성사되지 않고 있다. 10월 서울 아파트 거래량은 3724건으로 1년 전 8533건보다 56.3% 줄었다. 성동구는 59건으로 84%, 강동구는 169건으로 69% 급감했다. 성동구와 강동구 아파트값이 각각 32주·33주 만에 하락 전환한 것도 거래 급감에 따른 조정이라는 분석이 많다. 반면 서울 외곽에서는 15억원 이하 단지를 중심으로 매수세가 이어지며 상승세가 계속되고 있다.","url":"https://www.sedaily.com/NewsView/20114310"}]},{"name":"정비사업","articles":[{"n":7,"title":"재초환 '날벼락'에…재건축 조합장들 한자리에 모인다","meta":"2026.11.13 15:24 · 파이낸셜뉴스","body":"재건축초과이익환수제 부담금 통지가 본격화되면서 전국 재건축 조합장들이 공동 대응에 나선다. 전국 20여 개 단지 조합장들은 11월 19일 서울 서초구에 모여 재초환 폐지를 위한 법적 대응 방안을 논의하기로 했다. 서울뿐 아니라 경기·대전·대구·부산 조합장들이 참여하며 반포 현대, 신반포 시리즈, 철산주공, 대구 범어우방 등이 포함됐다. 서초구는 이미 국토교통부에 재초환 폐지 탄원서를 전달했고, 서울에서만 46개 단지가 부담금 부과 예상 대상으로 꼽힌다.","url":"https://www.fnnews.com/news/202611131524554357"},{"n":8,"title":"\"집 팔고 나가라는 거냐\"…은마 '4억6334만원 청구서'에 반발","meta":"2026.11.14 10:30 · 한국경제","body":"서울 강남구 대치동 은마아파트 재건축 조합원들이 가구당 평균 4억6334만원의 재초환 부담금 예정액을 통보받았다. 논란의 핵심은 부담금 산정에 쓰인 종료시점 주택가액이다. 현재 32억원으로 평가된 주택이 완공 시점인 2035년 81억원이 될 것으로 가정됐는데, 이는 연평균 9.67% 상승을 전제한 수치다. 조합원들은 정부가 집값 안정을 말하면서 부담금 산정에는 높은 상승률을 적용했다고 반발하고 있다. 실거주 고령층이 미실현 이익에 대한 현금 납부 탓에 매도로 내몰린다는 지적도 나온다.","url":"https://www.hankyung.com/article/2026111348856"}]},{"name":"금융/세제","articles":[{"n":12,"title":"금융위, 주택 PF 밀착관리 2028년 착공 사업장까지 확대","meta":"2026.11.13 10:51 · 이투데이","body":"금융위원회는 주택공급 정례브리핑에서 부동산 PF 밀착관리 대상을 내년 착공·준공 예정 사업장에서 2028년 예정 사업장까지 넓히겠다고 밝혔다. 9월 말 기준 밀착관리 대상 주거용 PF 사업장은 279곳, 16만8000가구 규모다. 지원을 희망한 64곳 가운데 8곳의 자금 애로를 해소했으며 이들 물량은 약 6000가구다. 서울 신촌 사업장은 한국자산관리공사 펀드에서 760억원을 투자받았고, PF 공동대출 1조원도 추가 조성됐다. 금융위는 사업장마다 금융감독원·금융기관 담당자를 1명씩 지정해 인허가와 자금 조달을 함께 챙기기로 했다.","url":"https://www.etoday.co.kr/news/view/2647825"},{"n":13,"title":"가계대출 다시 증가…10월 주택담보대출 4조원 늘어","meta":"2026.11.15 12:00 · 비즈워치","body":"10월 전 금융권 가계대출이 6조4000억원 늘며 한 달 만에 증가세로 돌아섰다. 9월에는 2조2000억원 감소했으나 10월 들어 반등했다. 주택담보대출 증가폭이 3조2000억원에서 4조원으로 커진 것이 주된 요인이고, 신용대출도 9월 2조9000억원 감소에서 10월 1조2000억원 증가로 전환했다. 5대 은행의 10월 말 가계대출 잔액은 783조6000억원으로 한 달 새 2조8000억원 늘었다. 은행들이 내년 1월 실행분부터 모기지보험 가입 제한을 푸는 등 대출 빗장을 단계적으로 풀고 있어 증가세가 이어질지 주목된다.","url":"https://news.bizwatch.co.kr/article/finance/2026/11/13/0028"}]},{"name":"임대주택","articles":[{"n":15,"title":"정부 안정 진단에도…수도권 전세 수급 불균형은 여전","meta":"2026.11.15 16:51 · 아시아투데이","body":"정부는 서울 전월세 매물 증가를 시장 안정 신호로 평가했지만 수도권 전세 수급 불균형은 계속되고 있다. 11월 2주 기준 경기 전세수급지수는 110.7로 5년여 만에 최고 수준이고 서울은 120.2, 인천은 110.4를 기록했다. 모두 기준선 100을 웃돌아 전세를 구하려는 수요가 매물보다 많다는 뜻이다. 경기에서는 서해안권 117.0, 경부1권 116.2 등 수요 우위가 두드러졌다. 정부는 내년 1분기까지 수도권 4만4000가구 입주와 공공분양·임대 10만가구 공급으로 시장을 달래겠다는 방침이다.","url":"https://www.asiatoday.co.kr/kn/view.php?key=20261115010005486"},{"n":16,"title":"전월세 물가 1.4% 상승…3년10개월 만에 최대폭","meta":"2026.11.16 00:19 · 국민일보","body":"지난달 전월세 소비자물가가 1년 전보다 1.4% 올라 3년 10개월 만에 가장 큰 폭으로 상승했다. 월세는 1.5% 올라 12년 10개월 만에 최고치를 기록했고 전세도 1.4% 상승했다. 지역별로는 울산 2.4%, 서울 2.1%, 세종 1.6% 순으로 오름폭이 컸다. 신규 입주물량 감소와 전세 매물 부족이 원인으로 꼽힌다. 9월 신규 전세자금대출 금리도 연 4.57%로 전월보다 0.22%포인트 올라 세입자 부담이 가중되고 있다.","url":"https://www.kmib.co.kr/article/20261115501358"}]},{"name":"택지/도시개발","articles":[{"n":17,"title":"LH, 하반기 1.6조 민간참여 공공주택 공모…모듈러 대단지 2곳 포함","meta":"2026.11.16 06:00 · 대한경제","body":"한국토지주택공사가 11월 13일 제5차 민간참여 공공주택사업 공모를 공고했다. 남양주왕숙2, 수원당수, 고양창릉, 시흥거모 일대 6개 블록 5782가구로 사업비는 1조6118억원 규모다. 3개 패키지로 나뉘며 남양주왕숙2 555가구와 고양창릉 668가구에는 모듈러 공법 적용이 의무화됐다. LH는 다음 달까지 4개 블록 약 3000가구(9000억원)를 추가 공모해 하반기 총 10개 블록 9000여 가구를 발주할 계획이다. 연내 사업자를 뽑아 2027년 착공하는 것이 목표다.","url":"https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611131505332890963"},{"n":18,"title":"3기 신도시 공급 가시화…사업 지연·인프라 부족은 '변수'","meta":"2026.11.15 13:56 · 아이뉴스24","body":"3기 신도시 가운데 인천 계양이 12월 1285가구로 첫 입주를 시작한다. 공공분양 747가구와 신혼희망타운 538가구로 구성된다. 이어 부천 대장이 내년 11월 1640가구, 고양 창릉이 내년 12월 2089가구, 하남 교산이 2029년 6월 입주할 예정이다. 다만 남양주 왕숙2는 A-6블록 21개월, A-7블록 16개월 등 총 1063가구 규모의 건설 일정이 밀렸다. 계양은 12월 입주가 시작되지만 첫 초등학교 개교는 2029년 3월이어서 기반시설 공백 문제가 과제로 남는다.","url":"https://www.inews24.com/view/2026063"}]},{"name":"주택품질/안전","articles":[{"n":19,"title":"국토부, 겨울철 건설현장 2946곳 안전점검…아파트 현장이 32%","meta":"2026.11.16 06:00 · 노컷뉴스","body":"국토교통부가 11월 16일부터 12월 24일까지 전국 건설현장 2946곳을 대상으로 동절기 안전점검에 나선다. 국토부와 5개 지방국토관리청, LH, 국토안전관리원 등 12개 기관이 참여한다. 점검 대상은 SOC 42%, 아파트 32%, 일반 건축물 26%로 구성돼 주거용 현장이 3분의 1을 차지한다. 가설비계·안전난간 등 임시시설물 관리, 한중콘크리트 보온 양생, 흙막이 가시설 동결 변형, 추락방지 시설 등을 집중 확인한다. 국토부는 안전·품질관리 미흡이나 부실시공이 확인되면 벌점과 과태료를 예외 없이 부과하겠다고 밝혔다.","url":"https://www.nocutnews.co.kr/news/6606747"}]},{"name":"분양정보","articles":[{"n":21,"title":"씨 마른 강남권 분양…서울 1순위 청약자 4년 만에 최저","meta":"2026.11.15 10:05 · 헤럴드경제","body":"올해 서울 아파트 1순위 청약 신청자가 11월 11일 기준 15만5890명으로 지난해 같은 기간 30만3218명보다 48.6% 줄었다. 2022년 이후 4년 만의 최저치다. 청약 수요가 몰리는 강남3구 일반분양이 서초구 잠원동 오티에르 반포 43가구와 서초동 아크로드서초 30가구 등 2개 단지 73가구에 그쳐 전년 652가구 대비 88.8% 급감한 영향이 컸다. 공급이 줄면서 경쟁은 오히려 치열해져 강남3구 1순위 평균 경쟁률은 870.0대 1로 전년 285.5대 1의 3배가 됐다. 아크로드서초는 30가구 모집에 3만2973명이 몰려 1099.1대 1을 기록했다.","url":"https://biz.heraldcorp.com/article/10937347"}]},{"name":"논설/사설","articles":[{"n":23,"title":"[사설] 집값은 하락 조짐, 전·월세는 급등…엇갈린 주택시장","meta":"2026.11.13 11:00 · 아시아경제","body":"사설은 강남 하락세와 서울 외곽 상승폭 둔화에도 서울 아파트값이 92주 연속 올랐다는 점에서 하락기 진입을 말하기는 이르다고 짚었다. 반면 올해 1~9월 서울 아파트 전셋값이 8.21% 올랐고 성북구 13.58%, 노원구 12.96% 등 비강남권 상승폭이 컸다는 점을 문제로 지목했다. 갱신계약 비중이 늘어난 것도 세입자의 선택권이 넓어져서가 아니라 이사할 대체 물량이 없기 때문일 수 있다고 봤다. 중장기 임대주택 공급 계획만으로는 당장의 전·월세 부담을 덜기 어려운 만큼 입주가 부족한 지역부터 임대 물량을 확보하고 실거주 의무·대출 규제의 부작용을 점검해야 한다고 주장했다.","url":"https://view.asiae.co.kr/article/2026111309440783536"}]}]},{"date":"2026-11-13","count":15,"pdf_count":27,"highlights":[{"n":1,"text":"홍지선 국토부 장관 \"재초환, 집값 안정 효과와 재산권 침해 함께 검토\""},{"n":6,"text":"한강벨트도 꺾였다…성동·강동 8개월 만에 하락 전환"},{"n":12,"text":"억대 재초환 부담금 통지 본격화…\"산정 방식부터 손봐야\""}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"홍지선 국토부 장관 \"재초환, 집값 안정 효과와 재산권 침해 함께 검토\"","meta":"2026.11.12 17:11 · 파이낸셜뉴스","body":"홍지선 국토교통부 장관은 11월 12일 국회 국토교통위원회 전체회의에서 재건축초과이익환수제(재초환) 폐지론에 대해 \"재초환 자체가 무조건 옳다, 그르다 판단할 사항은 아니다\"라며 신중한 입장을 밝혔다. 홍 장관은 재초환이 주택시장 가격 안정화 효과가 분명히 있지만 개인 재산권 침해 소지도 있는 만큼 종합적으로 검토할 필요가 있다고 말했다. 현재 폐지안이 국회에 계류 중인 상태로, 논의가 진행되면 국토부도 의견을 제시하겠다고 덧붙였다. 시장 진단과 관련해서는 매물이 쌓이고 거래가 줄어드는 현상을 하락기 진입 신호로 볼 수 있다고 설명했으며, 강남 3구는 이미 하락세라고 했다. 전월세 안정책으로는 충분한 주택공급이 근본 대책이라며 수도권 임대주택 공급을 지속 확충하겠다고 밝혔다.","url":"https://www.fnnews.com/news/202611121703534064"},{"n":2,"title":"'주거중심형' 도심복합 운영기준 이달 발표 전망…대로변 50% 동의 검토","meta":"2026.11.13 06:05 · 뉴스1","body":"서울시가 주거중심형 도심공공주택복합사업의 운영기준을 이르면 11월 말 공개할 것으로 전해졌다. 검토안에는 사업구역 둘레의 8분의 1 이상이 간선도로 등 대로에 접해야 한다는 요건이 담긴 것으로 알려졌다. 대로변에 접한 토지·건물 소유자에 대해서는 별도로 50% 이상의 동의를 받도록 하는 방안도 함께 논의되고 있다. 업계에서는 대로변 건물주 설득이 사업 성패를 가르는 변수가 될 수 있다며 동의 요건이 높으면 사업 추진이 제약될 수 있다고 우려한다. 서울시는 아직 확정된 내용은 없다며 기준이 검토 단계에 있다고 설명했다.","url":"https://www.news1.kr/realestate/general/6352284"}]},{"name":"시장동향","articles":[{"n":6,"title":"한강벨트도 꺾였다…성동·강동 8개월 만에 하락 전환","meta":"2026.11.12 17:32 · 한국경제","body":"서울 아파트값 하락세가 강남 3구를 넘어 성동구와 강동구까지 번졌다. 성동구는 32주, 강동구는 33주 만에 각각 하락 전환했다. 두 지역의 아파트 매물은 1년 전보다 각각 143%, 49.6% 늘어난 것으로 나타났다. 강남권과의 가격 격차가 줄면서 관망세가 짙어졌고, 대출 규제가 겹쳐 추가 조정 가능성도 거론된다. 반면 서울 중저가 지역과 경기 남부, 전세 시장은 여전히 강세를 보이고 있다.","url":"https://www.hankyung.com/article/2026111235101"},{"n":7,"title":"3분기 서울 아파트 거래액 반토막…매수심리 올해 최저","meta":"2026.11.13 04:30 · 머니투데이","body":"올해 3분기 서울 아파트 매매거래액은 14조5930억원으로 직전 분기보다 49% 줄었고 거래량도 43.9% 감소했다. 전국 아파트 거래액 감소분의 51.7%를 서울이 차지했다. 건당 평균 거래액도 12억4600만원에서 11억3200만원으로 9.2% 내려갔다. 4분기 들어 서울 매수우위지수는 5주 연속 낮아져 올해 최저 수준으로 떨어졌고, 한강 이남 지수는 지난해 2월 수준까지 내려갔다. 시장에서는 대출 규제와 금융비용 부담에 경기 불확실성이 겹쳐 매수자 관망세가 이어지는 것으로 보고 있다.","url":"https://www.mt.co.kr/estate/2026/11/13/2026111215182422352"}]},{"name":"정비사업","articles":[{"n":12,"title":"억대 재초환 부담금 통지 본격화…\"산정 방식부터 손봐야\"","meta":"2026.11.13 07:01 · 서울경제","body":"강남권 재건축 단지들이 조합원 1인당 수억원대의 재건축초과이익환수 부담금 예정액을 잇따라 통지하고 있다. 대치동 은마아파트는 1인당 평균 4억6334만원, 반포현대는 2억2375만원을 통보했다. 관리처분계획인가에서 준공까지 8~10년이 걸리면서 예정액과 실제 확정액의 격차가 커지는 점이 문제로 지적된다. 세종대 교수는 취득 시점별 안분과 예정액·확정액 괴리에 상한을 두는 방안을 제안했다. 국토교통부 장관이 제도의 재산권 침해 소지를 언급하며 검토 의사를 밝힌 가운데 업계에서는 산정 방식 개편 요구가 커지고 있다.","url":"https://www.sedaily.com/article/20113742"},{"n":13,"title":"노원 태릉우성, 최고 33층 704가구 재건축…한국자산신탁이 시행","meta":"2026.11.12 17:31 · 머니투데이","body":"서울 노원구가 태릉우성아파트 재건축 사업시행자로 한국자산신탁을 지정했다. 2만9178.8㎡ 부지에 기존 432가구를 최고 33층 704가구로 다시 짓는 사업으로, 이 중 87가구는 공공주택으로 공급된다. 올해 5월 정비구역으로 지정된 뒤 신청 23일 만에 사업시행자가 정해졌으며 2034년 11월 준공이 목표다. 사업성 보정계수 1.68을 적용해 용적률은 299.46%까지 허용됐다. 노원로1가길과 이어지는 폭 6m 공공보행통로와 노인·보육시설도 함께 조성된다.","url":"https://www.mt.co.kr/estate/2026/11/12/2026111217281121743"}]},{"name":"금융/세제","articles":[{"n":15,"title":"서울 근저당 설정 1년 새 46% 급증…'집주인 대출' 확산","meta":"2026.11.12 18:34 · 파이낸셜뉴스","body":"대출 규제가 강남권을 넘어 서울 전역으로 확대되면서 매도인이 매수인에게 자금을 빌려주고 근저당권을 설정하는 이른바 셀러 파이낸싱이 늘고 있다. 지난 10월 서울의 근저당권 설정등기 신청은 2만884건으로 전년 동월 1만4243건보다 46.6% 증가했다. 광진구는 351건에서 3070건으로 급증했고 서초구도 91.7% 늘었다. 중개업소들은 거래를 성사시키려면 집주인 대출이 사실상 필수가 됐다고 설명한다. 전문가는 이런 방식이 대출 규제의 가격 조정 효과를 약화시킬 수 있다고 우려했다.","url":"https://www.fnnews.com/news/202611121835081726"},{"n":16,"title":"2금융권에 인터넷은행까지…집단대출 경쟁 과열","meta":"2026.11.13 07:00 · 이데일리","body":"정부가 지난 8월 집단대출을 가계대출 관리 대상에서 분리한 뒤 금융권 경쟁이 거세지고 있다. 지난달 집단대출 잔액은 2조4000억원 늘어 4월 이후 반년 만에 월간 증가폭이 2조원을 넘어섰다. 시중은행뿐 아니라 상호금융과 카카오뱅크까지 뛰어들어 연 4.2~4.4%대 금리로 고객을 끌어모으고 있다. 상호금융권 관계자는 금융당국이 실수요자를 위해 규제를 완화한 기조에 맞춰 관리하고 있다고 설명했다. 카카오뱅크는 비대면 방식으로 틈새시장을 공략하고 있다.","url":"https://www.edaily.co.kr/News/Read?newsId=02020486645645392&mediaCodeNo=257"}]},{"name":"임대주택","articles":[{"n":17,"title":"전세사기 피해자 480명 추가 인정…누적 4만2039명","meta":"2026.11.12 13:48 · 서울경제","body":"국토교통부가 전세사기 피해자 480명을 추가로 인정하면서 누적 피해자가 4만2039명으로 늘었다. 피해자의 약 76%는 40세 미만 청년층이며 임차보증금은 대부분 3억원 이하다. 지역별로는 수도권이 전체의 60.7%를 차지했다. 한국토지주택공사(LH)의 피해주택 매입 실적은 1만1542가구로 집계됐다. 정부는 피해주택 매입 절차를 일원화하고 안전계약 컨설팅 사업도 함께 추진하고 있다.","url":"https://www.sedaily.com/article/20113453"},{"n":18,"title":"서울시, 청년 월세 이어 관리비도 지원…내년 하반기 시행 목표","meta":"2026.11.13 07:09 · 서울경제","body":"서울시가 월세 외에 관리비까지 부담이 커진 청년 주거비를 덜기 위해 관리비 지원을 추진한다. 오세훈 서울시장은 11월 12일 대학생·임대인·전문가와 간담회를 열고 지원 방안을 논의했다. 한 동국대 학생은 보증금 1000만원에 월세 50만원인데 관리비가 10만~20만원 더 붙는다며, 임대료 인상 제한을 피해 관리비를 올리는 사례를 전했다. 서울시는 조례를 개정해 내년 하반기부터 관리비를 지원한다는 계획이다. 아울러 2030년까지 맞춤형 청년주택 7만4000가구와 공유주택 6000가구를 공급할 방침으로, 9월까지 1만1000가구를 공급해 연간 목표의 84%를 달성했다.","url":"https://www.sedaily.com/article/20113741"}]},{"name":"택지/도시개발","articles":[{"n":19,"title":"노들역 인근 저층주거지에 42층 938가구…224가구는 장기전세","meta":"2026.11.12 17:31 · 한국경제","body":"서울 동작구 지하철 9호선 노들역 인근 노후 저층주거지가 대규모 아파트 단지로 바뀐다. 최고 42층 4개 동에 938가구가 들어서며 이 가운데 224가구는 장기전세주택으로 공급된다. 여의도 업무지구와 가까워 직주근접 수요를 흡수할 것으로 기대된다. 서울시는 11월 11일 도시·건축공동위원회에서 이 지구단위계획 변경안을 통과시켰다. 같은 회의에서 목동 CBS 방송국 부지는 지식산업센터 계획을 바꿔 시니어 대상 장기임차주택으로 개발하기로 했다.","url":"https://www.hankyung.com/article/2026111235041"},{"n":20,"title":"옛 국립보건원 부지 연내 매각 무산…면적 줄여 재매각 검토","meta":"2026.11.13 06:10 · 뉴스1","body":"서울시가 추진한 은평구 옛 국립보건원 부지의 연내 매각이 무산됐다. 4만8000㎡ 규모를 4545억원에 내놓은 공개매각에 응찰자가 없어 유찰됐다. 서울시는 내년 상반기 매각 면적을 2만1000㎡ 수준으로 줄여 다시 내놓는 방안을 검토하고 있다. 이 부지는 청년 미래타운 조성 계획의 일부였으나 사업이 지연되고 있다. 지역에서는 공공시설 조성을 요구하는 목소리가 나오고 있다.","url":"https://www.news1.kr/realestate/general/6352362"}]},{"name":"주택품질/안전","articles":[{"n":21,"title":"서울 공동주택 절반이 주차장 기준 미달…민원 3건 중 1건이 주차","meta":"2026.11.12 15:37 · 아시아경제","body":"서울 공동주택 3047개 단지를 분석한 결과 49.4%인 1506곳이 가구당 주차대수 1.08대에 못 미치는 것으로 나타났다. 아파트 민원 약 10만건 가운데 주차 관련이 33%로 가장 많아 층간소음 20%와 흡연 19%를 앞섰다. 자치구별로는 노원구 67.6%, 금천구 64.6%, 도봉구 62.3% 순으로 주차 여건이 열악했다. 택배·배달 차량의 상시 주차와 지정 구역 침범도 이웃 간 갈등 요인으로 지목됐다. 입주민들은 낮과 밤을 가리지 않고 주차 공간을 찾아 단지를 돌아야 하는 상황이다.","url":"https://asiae.co.kr/visual-news/article/2026111215372201685"}]},{"name":"분양정보","articles":[{"n":23,"title":"반포 디에이치 반포124, 다음 달 1801가구 일반분양","meta":"2026.11.12 17:29 · 한국경제","body":"서울 서초구 반포주공1단지 1·2·4주구를 재건축한 디에이치 반포124가 다음 달 일반분양에 나선다. 일반분양 물량은 1801가구이며 단지 전체는 최고 35층 50개 동 5700가구 규모다. 강남 3구에서 39년 만에 나오는 최대 공급 물량으로 꼽힌다. 전용 59~130㎡로 구성되며 입주는 내년 하반기 예정이다. 7만7550㎡ 규모 커뮤니티에는 아이스링크와 수영장, 실내 골프연습장, 영화관이 들어서고 9호선 구반포역과 4·9호선 동작역을 이용할 수 있다.","url":"https://www.hankyung.com/article/2026111235111"}]},{"name":"논설/사설","articles":[{"n":26,"title":"[기고] 주택 공급의 속도, 주민 협력이 완성한다","meta":"2026.11.13 05:00 · 머니투데이","body":"김이탁 국토교통부 제1차관은 기고에서 주택 공급 속도를 높이기 위한 정부의 제도 개편을 설명했다. 국토부는 지난 8월 공공택지 최단기 착공모델을 도입해 기존 68개월 걸리던 절차를 37개월로 줄였고, 이를 통해 향후 5년간 약 8만9000호를 앞당겨 공급할 계획이라고 밝혔다. 다만 부지 확보에는 토지 소유자와 주민의 협조가 필수적이라며 조기 이주 시 추가 보상금을 지급하는 한편 정당한 사유 없이 퇴거를 미루면 원칙대로 대응하겠다고 했다. 지난 9월 공공주택 특별법 개정으로 협조 장려금 지급 근거가 마련됐고 내년 3월 시행이 목표라고 덧붙였다. 신속한 주택공급은 정부의 실행력과 국민의 신뢰가 함께할 때 가능하다는 것이 글의 요지다.","url":"https://www.mt.co.kr/estate/2026/11/13/2026111208063655180"}]}]}],"holidays":["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-02","2026-05-01","2026-05-05","2026-05-25","2026-06-03","2026-06-06","2026-08-17","2026-09-24","2026-09-25","2026-09-26","2026-10-05","2026-10-09","2026-12-25"],"art":null};
