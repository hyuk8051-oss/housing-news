<script>
const DATA = {"days":[{"date":"2026-10-30","count":15,"pdf_count":22,"highlights":[{"n":1,"text":"김포·하남 등 수도권 신규택지 6곳 확정…7만6700가구 2030년 착공"},{"n":5,"text":"서울 새 아파트 입주 물량 13년 만에 최저…분양가는 5년 새 두 배"},{"n":9,"text":"서울 세운지구 용적률 880%로…비주거 비율 20%까지 낮춘다"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"김포·하남 등 수도권 신규택지 6곳 확정…7만6700가구 2030년 착공","meta":"2026.10.29 17:44 · 한국경제","body":"국토교통부가 8·13 주택 신속공급방안의 후속으로 서울 경계에서 5㎞ 이내인 경기 김포·구리·하남·의정부·고양 등 6곳을 신규 공공주택지구 후보지로 지정하고 총 7만6700가구를 공급한다고 29일 발표했다. 김포아라지구가 3만7000가구로 가장 크고 구리건원 1만4600가구, 하남미사 K-컬처 1만2000가구, 하남감일2 6500가구, 고양대곡 4000가구, 의정부다락원 2600가구가 뒤를 이었다. 정부는 공공택지 최단기 착공모델을 처음 적용해 지구 지정부터 착공까지 기간을 단축하고 2030년까지 착공, 이르면 2033년 입주를 목표로 제시했다. 정우진 국토부 주택공급추진본부장은 최단기 모델을 통해 2030년 안에 착공할 수 있을 것이라고 밝혔다. 다만 교통망 확충 지연과 기존 주민 반발이 과제로 지적된다.","url":"https://www.hankyung.com/article/2026102943641"},{"n":2,"title":"서울 그린벨트는 또 빠졌다…국토부 “서울시 회신 기다리는 중”","meta":"2026.10.29 17:13 · 뉴스핌","body":"이번 신규택지 후보지 6곳이 모두 경기도에 집중되면서 정작 수요가 가장 많은 서울은 제외됐다. 국토부는 지방자치단체와 협의가 끝난 곳부터 후보지로 발표했다고 설명했으며, 서울시와는 그린벨트 해제 범위와 용산공원 주택 활용을 놓고 이견이 이어지고 있다. 홍지선 국토부 장관은 서울시의 회신을 기다리고 있다고 밝혔고, 조만간 오세훈 서울시장과의 면담이 예상된다. 서울시는 환경 훼손 우려와 신속 공급 일정의 실현 가능성에 의문을 제기하고 있어 협의 타결까지 시간이 걸릴 전망이다.","url":"https://www.newspim.com/news/view/20261029001278"}]},{"name":"시장동향","articles":[{"n":5,"title":"서울 새 아파트 입주 물량 13년 만에 최저…분양가는 5년 새 두 배","meta":"2026.10.29 08:43 · 한국경제","body":"올해 서울 아파트 입주 물량은 1만7698가구로 2013년 1만6321가구 이후 13년 만에 가장 적은 수준으로 집계됐다. 지난해 3만2370가구와 비교하면 45% 줄어든 규모다. 내년 예정 물량은 1만8329가구지만 2028년에는 1만3212가구로 다시 급감할 것으로 전망됐다. 반면 서울 아파트 평균 분양가는 2021년 3.3㎡당 2799만원에서 올해 5401만원으로 5년 새 약 두 배로 올랐다. 업계에서는 입주 물량 감소와 가격 상승이 겹치며 실수요자의 진입 문턱이 계속 높아지고 있다고 지적했다.","url":"https://www.hankyung.com/article/2026102921906"},{"n":6,"title":"서울 아파트값 90주 연속 상승…오름세는 수원·군포 등 경기 남부로","meta":"2026.10.29 14:00 · 한국경제","body":"한국부동산원 집계에서 서울 아파트값은 90주 연속 올라 역대 최장 상승 기록을 이어갔으나 주간 상승률은 0.09%로 둔화됐다. 반면 경기는 전주 대비 0.20% 올랐고 수원 영통구와 군포시가 각각 0.58% 상승해 수도권에서 가장 높은 상승률을 기록했다. 수원발 상승세가 의왕, 용인 기흥 등 인접 지역으로 번지는 모습이다. 전세 매물 부족으로 구매력이 낮아진 세입자들이 인근 지역으로 이동하면서 비규제지역의 6억원 안팎 주택이 특히 강세를 보이고 있다는 분석이 나왔다.","url":"https://www.hankyung.com/article/2026102930826"}]},{"name":"정비사업","articles":[{"n":9,"title":"서울 세운지구 용적률 880%로…비주거 비율 20%까지 낮춘다","meta":"2026.10.29 17:28 · 한국경제","body":"서울시가 세운재정비촉진지구의 재정비촉진계획 변경안을 마련해 29일부터 11월 12일까지 주민공람에 들어갔다. 일반상업지역 허용용적률을 800%에서 880%로 높이고, 업무·상업 등 비주거용도 비율은 50% 이상에서 20% 이상으로 완화한다. 건폐율 기준도 50% 이하에서 60% 이하로 풀었고, 사업이 장기간 지연된 존치정비구역 12곳은 재정비촉진구역으로 전환해 전체 정비구역이 44곳에서 46곳으로 늘어난다. 서울시는 오래 멈춰 있던 구역의 사업성을 높이고 생활편의시설을 확충하려는 조치라고 설명했다.","url":"https://www.hankyung.com/article/2026102941791"},{"n":10,"title":"도시정비 수주액은 늘고 경쟁은 줄고…상위 3사가 62% 차지","meta":"2026.10.30 07:51 · 아시아타임즈","body":"올해 건설사들의 도시정비사업 누적 수주액은 46조2067억원으로 집계됐다. 현대건설이 12조7315억원으로 1위, 삼성물산이 10조4686억원, GS건설이 5조5477억원으로 뒤를 이었으며 상위 3개사 점유율이 62.2%에 달했다. 대형사들이 수주 가능성이 높은 사업장에 집중하면서 경쟁입찰이 성립하지 않고 단독 응찰로 끝나는 사례가 늘고 있다는 것이 업계의 분석이다. 목동 5개 단지는 예정공사비만 9조원을 넘어 연말 수주 경쟁의 분수령으로 꼽힌다.","url":"https://www.asiatime.co.kr/article/20261029500351"}]},{"name":"금융/세제","articles":[{"n":12,"title":"주담대 금리 연 4.88%…고정형은 사상 처음 5% 넘어섰다","meta":"2026.10.29 13:17 · 한국일보","body":"한국은행이 29일 발표한 9월 금융기관 가중평균금리에 따르면 예금은행의 신규취급액 기준 주택담보대출 금리는 연 4.88%로 전월보다 0.22%포인트 올랐다. 2012년 4월 4.94% 이후 14년 5개월 만의 최고 수준으로, 지난 5월 4.32%부터 5개월 연속 상승했다. 고정형 주담대 금리는 5.11%로 전월 대비 0.23%포인트 올라 한은이 고정형과 변동형을 구분해 통계를 작성하기 시작한 2013년 1월 이후 처음으로 5%를 넘어섰다. 9월 가계대출 금리 전체도 4.96%로 0.20%포인트 상승했다. 금리 부담이 커지면서 대출을 끼고 집을 산 수요자의 이자 부담이 가중될 것으로 보인다.","url":"https://www.hankookilbo.com/news/article/A2026102913170005148"}]},{"name":"임대주택","articles":[{"n":13,"title":"서울시, 내년 공공임대 2만7200가구…청년월세 지원 9000명 확대","meta":"2026.10.29 16:39 · 뉴스핌","body":"서울시가 29일 발표한 2027년도 예산안에 공공임대주택 공급 예산 1조1228억원이 담겼다. 매입형 2만736가구, 임차형 3100가구, 건설형 3364가구 등 모두 2만7200가구를 공급할 계획이다. 청년월세 지원 대상은 2만3000명에서 3만2000명으로 9000명 늘리고, 청년·신혼부부 주거비 지원에 2054억원을 반영했다. 역세권 청년주택 등으로 청년·신혼부부용 3027가구를 공급하고 대학가 인근에 서울형 시작주택 500호를 새로 조성한다. 기준중위소득 48% 이하 가구에 지급하는 주거급여에는 1조337억원이 배정됐다.","url":"https://www.newspim.com/news/view/20261029001240"}]},{"name":"택지/도시개발","articles":[{"n":14,"title":"김포 아라지구에만 3만7000가구…서울 서부권 주거거점으로","meta":"2026.10.29 10:00 · 뉴스핌","body":"이번 신규택지 중 최대 규모인 김포 아라지구는 365만㎡ 부지에 3만7000가구가 들어선다. 전체 신규 공급 물량 7만6700가구의 약 48%가 이 한 곳에 집중된 셈이다. 서울 강서구와 맞닿은 한강변 입지로, 정부는 지하철 5호선 연장사업과 한강시네폴리스 산업단지, 고촌 물류단지 등과 연계해 직주근접이 가능한 자족형 주거단지로 개발하겠다고 밝혔다. 다만 물량이 한 지역에 쏠려 서울 중저가 주택 수요를 흡수하는 효과는 제한적일 수 있다는 지적도 함께 나온다.","url":"https://www.newspim.com/news/view/20261029000263"},{"n":15,"title":"김포·하남에 물량 72% 쏠려…“교통 없는 공급은 베드타운”","meta":"2026.10.29 14:15 · 국민일보","body":"이번에 발표된 7만6700가구 가운데 김포와 하남 물량이 약 72.3%를 차지했다. 김포시는 지하철 5호선과 9호선 연장 등 광역교통망 확충과 지방세 손실 보전을 요구하고 나섰다. 이기형 김포시장은 철저한 대책 없는 일방적 주택 공급은 도시를 단순 소비형 베드타운으로 전락시킬 것이라고 밝혔다. 정부는 지구 지정부터 착공까지 걸리는 기간을 기존 68개월에서 37개월로 단축해 2030년까지 착공하겠다는 계획이다.","url":"https://www.kmib.co.kr/article/20261029501057"}]},{"name":"주택품질/안전","articles":[{"n":17,"title":"SH, 마곡 공공주택 등 건설현장 6곳 안전점검","meta":"2026.10.29 16:01 · 헤럴드경제","body":"황상하 서울주택도시개발공사 사장이 10월 27~28일 이틀간 공공주택과 기반시설 건설현장 6곳을 직접 찾아 안전관리 실태를 점검했다. 점검 대상은 마곡 16단지와 마곡동 1410 공공주택, 사천빗물펌프장, 송파 창의혁신 개발사업, 홍릉R&D지원센터, 고덕강일 체육공원 등이다. 기온 하강과 강풍 등 계절적 위험요인을 확인하고 지능형 영상분석 CCTV와 스마트 안전장비를 묶은 SH의 스마트 안전관리 체계도 함께 살폈다. 황 사장은 건설현장 안전은 기본 수칙을 지키고 위험요인을 미리 찾아 개선하는 데서 시작된다며 현장 관계자와 근로자의 자율적 안전관리 실천을 당부했다.","url":"https://biz.heraldcorp.com/article/10919446"},{"n":18,"title":"고양시, 노후 공동주택 44곳 승강기·급수관 교체 지원","meta":"2026.10.29 09:36 · 서울경제","body":"고양시가 올해 26억여 원을 들여 사용검사 후 15년이 지난 관내 노후 공동주택 44곳을 대상으로 공동주택 유지관리 지원사업을 진행하고 있다. 승강기와 급수관 교체, 옥상 방수 등이 지원 대상이며 전체 사업의 80% 이상이 마무리됐다. 여기에 1억2000만 원을 별도로 마련해 자동 화재감지 설비와 전기차 충전시설 지상 이전, 화재감지 CCTV 설치 비용의 50%를 단지당 최대 2500만 원까지 보조하고 있다. 노후 주택 14가구에는 고효율 창호 교체와 단열 개선을 가구당 최대 1000만 원까지 지원했다. 민경선 고양시장은 시민의 생명과 직결된 안전 확보가 최우선 과제라고 밝혔다.","url":"https://m.sedaily.com/article/20107548"}]},{"name":"분양정보","articles":[{"n":19,"title":"인천 청라 아크원 푸르지오, 30일 견본주택 열고 868가구 분양","meta":"2026.10.29 09:09 · 아시아타임즈","body":"청라스마트시티가 시행하고 대우건설이 시공하는 청라 아크원 푸르지오가 10월 30일 견본주택을 열고 분양에 들어간다. 지하 5층~지상 최고 49층, 6개 동에 아파트 868가구와 주거형 오피스텔 987실 등 총 1855가구 규모로, 전용 84~103㎡ 아파트가 분양가상한제를 적용받아 공급된다. 청약은 11월 2일 특별공급, 3일 1순위, 4일 2순위 순으로 진행된다. 계약금은 분양대금의 5%로 책정됐다. 인근에는 서울 지하철 7호선 청라 연장과 하나금융그룹 업무시설, 스타필드 청라, 서울아산청라병원 등이 추진 중이다.","url":"https://www.asiatime.co.kr/article/20261029500035"},{"n":20,"title":"KT에스테이트, 춘천 남춘천 센트레빌 264가구 분양 돌입","meta":"2026.10.29 14:50 · 글로벌이코노믹","body":"KT에스테이트가 강원특별자치도 춘천시 효자동 ITX 남춘천역 인근에 짓는 주상복합단지 남춘천 센트레빌의 견본주택을 30일 열고 분양 일정에 들어간다. 지하 6층~지상 최고 39층, 총 264가구 규모로 실수요 선호도가 높은 전용 59㎡와 84㎡ 중소형으로 구성됐다. 시공은 동부건설이 맡는다. 춘천 지역에서는 처음으로 KT그룹의 AI 역량을 결합한 통합 AI 주거 플랫폼을 도입하고 바리스타 로봇과 짐 배송 로봇 등을 제공한다는 계획이다. 39층에는 스카이라운지와 피트니스 센터 등 커뮤니티 시설이 조성된다.","url":"https://www.g-enews.com/article/Real-Estate/2026/10/202610291449363822a9fc143920_1"}]},{"name":"논설/사설","articles":[{"n":21,"title":"[사설] 경기 택지와 서울 정비사업은 함께 가야 한다","meta":"2026.10.30 04:05 · 머니투데이","body":"사설은 경기 5개 시에 7만6700가구를 공급하겠다는 정부 계획을 다루면서 서울 재건축·재개발의 동시 추진이 필요하다고 주장했다. 김포 5호선 연장 같은 교통 인프라가 착공 일정에 맞춰지지 않으면 출퇴근이 가능한 입지라는 전제 자체가 흔들린다고 지적했다. 또 그린벨트 해제의 정당성 설명과 지자체 협의가 충분하지 않아 성과는 정부가 가져가고 부담은 기초지자체가 떠안는 구조가 반복된다고 비판했다. 이르면 2033년에야 입주가 시작되는 만큼 경기 신규택지만으로는 당장의 주택시장 불안을 해소할 수 없고 서울의 공급 부족은 정비사업으로 풀어야 한다는 것이 사설의 결론이다.","url":"https://mt.co.kr/opinion/2026/10/30/2026102915510224292"}]}]},{"date":"2026-10-29","count":15,"pdf_count":28,"highlights":[{"n":1,"text":"\"첫 입주 코앞인데 광역교통망은 3~4년 뒤\"…정부, 3기 신도시 전수점검"},{"n":5,"text":"서울 아파트 전셋값 39개월째 상승…강북 평균 첫 6억 돌파"},{"n":9,"text":"3평 줄여 가는데 6억 더…대치미도 재건축 분담금 '충격'"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"\"첫 입주 코앞인데 광역교통망은 3~4년 뒤\"…정부, 3기 신도시 전수점검","meta":"2026.10.28 14:00 · 머니투데이","body":"올해 12월 인천계양을 시작으로 3기 신도시 첫 입주가 시작되지만 광역교통 대책 상당수가 입주 시점보다 3~4년 늦게 완료되는 것으로 나타났다. 인천계양 국도39호선 확장은 2026년에서 2031년으로, 남양주왕숙 한강교량·올림픽대로 확장은 2028년에서 2032년으로, 고양창릉 중앙로 연결도로는 2025년에서 2031년으로 각각 미뤄졌다. 남양주·하남 철도 노선도 2032년 준공 목표여서 입주 초기 교통 공백이 불가피하다는 지적이 나온다. 정부는 김포공항·서울 도심을 잇는 임시 버스 노선 등 대체 수단을 우선 투입하기로 했으나 수년간의 공백을 메우기는 어렵다는 입장이다. 한성숙 국무총리는 '선 교통 후 입주' 원칙을 강조했고, 대도시권광역교통위원회는 현장 점검을 통해 병목 구간을 찾아 공기 단축 방안을 마련할 계획이다.","url":"https://www.mt.co.kr/estate/2026/10/28/2026102811575444222"},{"n":2,"title":"구룡마을 화재 이재민에 LH 임대주택 2년 무상 지원…모듈러도 활용","meta":"2026.10.28 15:41 · 머니투데이","body":"국토교통부는 10월 27일 발생한 서울 강남구 구룡마을 화재 이재민에게 LH 임대주택을 2년간 무상으로 제공하기로 했다. 임대료 등 비용은 LH와 지방자치단체가 절반씩 부담하는 방식이다. LH가 보유한 모듈러 주택 100호도 대체 수단으로 활용할 수 있으나, 지자체의 부지 제공과 협의 절차가 선행돼야 한다. 국토부 관계자는 서울시·관계기관과 협력해 이재민이 빠르게 일상으로 복귀할 수 있도록 주거지원 방안을 적극 강구하겠다고 밝혔다.","url":"https://www.mt.co.kr/estate/2026/10/28/2026102814074242126"}]},{"name":"시장동향","articles":[{"n":5,"title":"서울 아파트 전셋값 39개월째 상승…강북 평균 첫 6억 돌파","meta":"2026.10.28 11:16 · 헤럴드경제","body":"KB부동산 조사 결과 10월 서울 아파트 평균 전셋값은 7억2898만원으로 2025년 12월 6억6598만원 대비 9.5% 올랐다. 강북 14개 구 평균은 6억281만원으로 처음 6억원을 넘었고, 강남 11개 구는 8억4178만원, 전국 평균은 3억3891만원으로 집계됐다. 상승 기간은 39개월 연속으로 2019년 5월~2022년 6월의 38개월 기록을 넘어섰으며, 노원구가 1.52%로 가장 많이 올랐다. 전세의 월세 전환율은 4.31%로 2017년 10월 이후 가장 높았다. KB국민은행 전문가는 매물 부족이 가격 상승으로 직결되고 있으며 내년 집주인 실입주가 늘면 수급이 더 빠듯해질 수 있다고 설명했다.","url":"https://biz.heraldcorp.com/article/10917445"},{"n":6,"title":"\"여길 누가 사냐더니\"…서울 나홀로아파트 거래 21% 늘었다","meta":"2026.10.28 18:26 · 파이낸셜뉴스","body":"올해 1~9월 서울 나홀로아파트(3개 동 이하·300가구 미만) 거래는 8083건으로 작년 같은 기간보다 21% 늘었다. 같은 기간 서울 아파트 전체 거래가 13.5% 줄어든 것과 대조적이며, 나홀로아파트 비중은 11%에서 15.4%로 확대됐다. 증가분의 88%가 외곽 지역에서 나왔고 외곽 거래는 3261건에서 4490건으로 37.7% 늘었다. 평균 가격도 8.6% 오른 8억6200만원을 기록했으며 강남 3구는 11.9% 오른 15억원, 용산·종로는 12.2% 오른 20억원 안팎이었다. 전문가들은 고가 주택 대출 규제 강화와 전세 매물 부족이 실수요자를 그동안 외면받던 소규모 단지로 이동시킨 것으로 분석했다.","url":"https://www.fnnews.com/news/202610281825288528"}]},{"name":"정비사업","articles":[{"n":9,"title":"3평 줄여 가는데 6억 더…대치미도 재건축 분담금 '충격'","meta":"2026.10.28 17:30 · 헤럴드경제","body":"서울 강남구 대치미도아파트 재건축 조합이 제시한 변경 계획에서 비례율이 100.52%에서 73.05%로 떨어졌다. 전용 84㎡ 조합원이 97㎡를 선택하면 약 7억9296만원을, 기존 128㎡ 조합원이 117㎡로 면적을 30㎡ 넘게 줄여도 6억1313만원을 추가 부담해야 한다. 비례율 하락은 종전자산 총액이 59% 늘고 일반분양 물량이 722가구에서 587가구로 135가구 줄어든 영향이 컸다. 여기에 가구당 평균 1억3100만원으로 추산되는 재건축초과이익부담금도 더해진다. 김제경 소장은 유사 단지에서도 평균 분담금이 10억원에 이를 수 있다고 전망했다.","url":"https://biz.heraldcorp.com/article/10918020"},{"n":10,"title":"목동 재건축 선두 6단지, 비례율 90%대로 뚝…조합 내 잡음","meta":"2026.10.29 05:30 · 파이낸셜뉴스","body":"서울 양천구 목동 6단지 재건축 추정 비례율이 100.92%에서 90.67%로 낮아지면서 조합원 분담금 우려가 커지고 있다. 총 수입 추산액은 약 3조6000억원에서 5조6700억원으로 늘었지만 공사비가 9395억원에서 1조4842억원으로 58% 급증했고 종전자산 평가액도 2조2900억원에서 3조9400억원으로 상향됐다. 기존 1362가구를 2170가구로 늘리고 공공임대 273가구를 포함하는 계획이며, 시공사는 2026년 6월 선정된 DL이앤씨, 새 단지명은 '아크로 목동 리젠시'다. 이주는 2028년 초·중반으로 예상된다. 일부 조합원 모임인 목동6단지 재건축발전모임은 감정평가에서 투기 가격을 배제하라는 현수막을 내걸며 평가 방식을 문제 삼고 있다.","url":"https://www.fnnews.com/news/202610290530264915"}]},{"name":"금융/세제","articles":[{"n":15,"title":"재초환 첫 부과 앞둔 반포현대…부담금 산정·부과 시한 모두 논란","meta":"2026.10.29 06:05 · 서울경제","body":"서울 서초구 반포현대가 강남권 첫 재건축초과이익부담금 부과 대상이 될 전망이다. 서초구는 10월 22일 종전자산 평가액을 652억6000만원으로 공시했고, 조합은 682억원을 주장해 약 30억원 차이가 난다. 조합은 비교 대상이 59㎡ 위주로 선정됐다며, 재건축을 하지 않은 인근 반포리체가 5년간 116% 오른 반면 현행 기준상 반포현대는 22% 상승에 그친 것으로 계산된다고 반박했다. 가구당 평균 부담금은 약 1억2000만원이며 산정 방식에 따라 1인당 최대 1800만원이 더 늘어날 수 있다. 서초구는 연내 부과를 목표로 하지만 국토교통부는 2024년 3월 법 개정 이전 준공 단지는 2029년까지 부과가 가능하다는 입장이어서 시한을 둘러싼 이견도 있다.","url":"https://www.sedaily.com/article/20107443"},{"n":16,"title":"\"돈 대줄 테니 차익 나누자\"…대출 장벽이 부른 '사금융 복마전'","meta":"2026.10.29 06:20 · 서울경제","body":"서초구 5007가구 규모 재건축 '디에이치 반포 124' 청약을 앞두고 불법 자금 알선이 확산되고 있다. 전용 84㎡ 분양가는 분양가상한제 적용으로 약 30억원 수준인 반면 인근 비슷한 면적은 57억~62억원에 거래돼 시세차익이 30억원 안팎으로 추산된다. 그러나 25억원 초과 주택의 주택담보대출 한도가 2억원으로 제한돼 당첨자는 20억원 이상을 현금으로 마련해야 한다. 이 틈을 노려 컨설팅 업체들이 가점이 높은 청약 대상자와 자금을 댈 투자자를 모아 차익을 나누는 거래를 공공연히 알선하고 있다. 주택법 제65조는 분양권 양도·알선을 금지하고 있어, 전문가들은 계약 형식과 관계없이 계약 무효와 형사처벌 대상이 될 수 있다고 경고했다.","url":"https://www.sedaily.com/article/20107437"}]},{"name":"임대주택","articles":[{"n":17,"title":"[단독] 전월세난에 분쟁·상담 늘었다…계약갱신요구권 문의 41%","meta":"2026.10.28 18:22 · 파이낸셜뉴스","body":"대한법률구조공단이 2023년 1월부터 2026년 9월까지 임대차 상담 약 2만9000건을 분석한 결과 상위 3개 항목이 전체의 60~70%를 차지했다. 계약갱신요구권 관련 문의가 1만2200건으로 41%를 차지했고 올해만 3607건으로 2년 전 같은 기간보다 43%, 1년 전보다 35% 늘었다. 묵시적 갱신 문의는 16.1%로 2023년 910건에서 올해 1418건으로 55.8% 증가했다. 계약 해지·중도 퇴거 상담은 13.8%였지만 증가율이 85%로 가장 가팔랐다. 전월세 가격 상승과 공급 위축, 등록임대사업자 규제 강화, 제도 복잡화가 분쟁을 키운 배경으로 지목된다.","url":"https://www.fnnews.com/news/202610281821359463"},{"n":18,"title":"\"반포자이도 7점이면 당첨\"…10억 보증금에 장기전세 '부담'","meta":"2026.10.29 06:30 · 뉴스1","body":"서울주택도시공사(SH)가 공개한 장기전세주택 당첨 결과에서 반포자이 전용 59㎡의 당첨 가점은 25점 만점에 7점으로 비교 단지 가운데 가장 낮았다. 이 주택의 보증금은 9억5494만원에 달한다. 다른 단지에서는 당첨 가점이 25점까지 올라가 단지별 편차가 크게 벌어졌다. 1유형은 보증금 분할 납부가 허용되지 않아 전액을 한 번에 마련해야 해 신청자 부담이 더 크다는 지적이 나온다.","url":"https://www.news1.kr/realestate/general/6335404"}]},{"name":"택지/도시개발","articles":[{"n":21,"title":"한국토지신탁-간삼건축, 도심복합개발 신규 사업지 발굴 맞손","meta":"2026.10.28 16:30 · 머니투데이","body":"한국토지신탁이 간삼건축과 도심복합개발 신규 사업지를 함께 발굴하는 업무협약을 맺었다. 2025년 2월 시행된 도심복합개발 지원법에 따른 새 개발 모델을 활용해, 민간 개발이 어려웠던 노후·저이용 지역을 대상으로 한다. 두 회사는 사업 초기 단계부터 후보지를 확보하고 개발 전략을 체계화해 인허가 리스크를 줄이고 준공 품질을 높인다는 계획이다. 한국토지신탁은 2026년 2분기 기준 전국 약 40개 사업장에서 약 4만5000가구 규모의 사업을 시행·관리하고 있다. 간삼건축은 인천 파라다이스시티, LG사이언스파크, 신내 콤팩트시티 등을 설계한 경험이 있다.","url":"https://www.mt.co.kr/estate/2026/10/28/2026102810550475756"}]},{"name":"주택품질/안전","articles":[{"n":22,"title":"현대건설, 영하 2도에도 강도 확보…'간절기 특수 콘크리트' 개발","meta":"2026.10.28 16:36 · 머니투데이","body":"현대건설과 현대엔지니어링 공동연구팀이 일교차가 큰 간절기용 특수 콘크리트를 개발해 기술 인증을 받았다. 일 최저기온 영하 2도, 일교차 최대 20도 조건에서도 48시간 안에 압축강도 5MPa 이상을 확보하도록 조강형 슬래그 시멘트와 개선된 혼화제를 적용했다. 별도의 보온양생이나 설계기준보다 높은 강도의 콘크리트를 쓰지 않아도 돼 공사비와 현장 관리 부담을 줄일 수 있다. 2026년 3월 '더 파크사이드 서울'과 서울 서초구 반포대치1지구 재건축 현장에 적용해 48시간 내 거푸집 해체 기준을 충족했고 이후 압축강도도 품질 기준을 넘었다.","url":"https://www.mt.co.kr/estate/2026/10/28/2026102813473036598"}]},{"name":"분양정보","articles":[{"n":23,"title":"\"가을 분양 막차\"…11월 전국 5만6533가구 분양","meta":"2026.10.28 18:08 · 서울경제","body":"11월 전국에서 아파트 약 5만6533가구가 분양에 나선다. 2025년 11월 2만9895가구보다 89.1% 많은 물량이다. 수도권이 3만2017가구로 전체의 56.6%를 차지하며 경기 2만278가구, 서울 7240가구(전년 대비 146% 증가), 인천 4499가구(226% 증가) 순이다. 지방은 2만4516가구로 작년 11월 6647가구보다 270% 늘었고 경북 5723가구, 세종 3547가구, 대전 3404가구가 뒤를 이었다. 서울에서는 '디에이치 반포 124'(5007가구)와 '더샵 퍼스트월드 서울'(999가구)이, 지방에서는 '세종 스마트시티 엘 수자인'(2191가구), '구미 파크원 디자인'(2548가구) 등이 공급된다.","url":"https://www.sedaily.com/article/20107384"},{"n":24,"title":"지방 시·군·구 10곳 중 7곳, 2년간 공급 500가구도 안 됐다","meta":"2026.10.28 17:31 · 한국경제","body":"부동산 분석업체 리얼투데이가 2025년 1월부터 2026년 9월까지 지방 163개 기초지자체의 아파트 공급을 조사한 결과 113곳(69.3%)이 500가구 미만을 공급한 것으로 나타났다. 울산 동구·북구를 포함한 70곳은 21개월간 신규 분양이 아예 없었고, 13곳은 100가구 미만, 7곳은 100~200가구에 그쳤다. 건설사들은 이런 공급 공백 지역을 겨냥한 신규 단지를 준비하고 있다. 전북 고창에서는 태영건설 컨소시엄이 '고창 데시앙'(888가구)을, 충남 논산에서는 계룡건설이 '엘리프 논산 디에디션'(499가구)을 공급한다. 부산 동구 '호반써밋 초량'(432가구·일반분양 236가구), 광주 동구 'IPARK 무등산 스카이포레스트'(2299가구·일반분양 1387가구)도 분양을 앞두고 있다.","url":"https://www.hankyung.com/article/2026102813421"}]},{"name":"논설/사설","articles":[{"n":27,"title":"[사설] 인구이동 53년 만에 최저…고령화·주택 정책 재점검할 때","meta":"2026.10.28 17:52 · 한국경제","body":"9월 국내 인구이동이 시·도 경계를 넘은 기준 44만4000명으로 1년 전보다 10.1% 줄어 53년 만에 최저를 기록했다. 사설은 고령화로 이주 수요가 줄어든 데다 주택 거래 부진과 아파트 공급 부족이 겹친 결과로 진단했다. 서울은 1만1368명 순유출을 보인 반면 경기·인천은 인구가 늘어 서울의 높은 집값과 생활비 부담이 드러났다고 평가했다. 사설은 사람이 활발히 움직이고 새로운 기회가 생기는 사회가 활력 있는 사회라며 인구이동 감소를 정체의 경고로 봤다. 저출생 대응과 일자리 창출, 수요에 맞춘 주택 공급, 주거 이동을 제약하는 거래 규제 정비를 함께 주문했다.","url":"https://www.hankyung.com/article/2026102814691"}]}]},{"date":"2026-10-28","count":15,"pdf_count":26,"highlights":[{"n":1,"text":"이재명 대통령 \"주택 착공 실적 최대한 높여야…신용·재정지원도 고려\""},{"n":6,"text":"경기 아파트값 양극화 6.3배 '역대 최고'…서울 추월"},{"n":12,"text":"\"정비사업 속도 높여라\"…서울시, 인허가 업무기준 표준화"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"이재명 대통령 \"주택 착공 실적 최대한 높여야…신용·재정지원도 고려\"","meta":"2026.10.27 11:18 · 뉴스핌","body":"이재명 대통령은 27일 제46회 국무회의를 주재하면서 집행이 부진한 공공사업에 속도를 내고 주택 착공 실적도 최대한 높이라고 관계 부처에 지시했다. 이 대통령은 주택 부문은 공급 자체도 의미가 있지만 부진한 건설 경기를 활성화하는 측면도 있다고 강조했다. 필요하다면 국가 신용을 활용한 지원과 재정 지원까지 함께 검토하라고 주문했다. 아울러 소비 여력을 키우는 비용 절감 정책과 내수 활성화 노력을 병행해 국민이 체감할 수 있는 변화를 만들라고 당부했다.","url":"https://www.newspim.com/news/view/20261027000584"},{"n":2,"title":"\"대통령도 콕 짚어 강조했는데\"…수도권 신혼희망타운 912가구 공급 2년 밀렸다","meta":"2026.10.27 16:10 · 머니투데이","body":"국토교통부가 경기 안산신길2지구 A-1블록과 A-6블록 공공주택 사업의 준공 시점을 약 2년씩 늦추는 내용의 사업계획 변경을 고시했다. 두 블록을 합쳐 912가구 규모이며, 토지 보상 절차 지연과 연약지반 처리가 지연 사유로 제시됐다. 이재명 대통령이 최근 건설 현장을 찾아 토지 보상 기간 단축을 강조한 직후라 공급 일정 관리 문제가 다시 부각됐다. 정부와 한국토지주택공사(LH)는 절차 간소화와 인력 보강을 통해 표준 보상 기간을 44개월에서 24개월로 줄이겠다는 계획을 밝혔다.","url":"https://www.mt.co.kr/estate/2026/10/27/2026102715175824349"}]},{"name":"시장동향","articles":[{"n":6,"title":"경기 아파트값 양극화 6.3배 '역대 최고'…서울 추월","meta":"2026.10.27 14:38 · 뉴스1","body":"10월 경기 아파트 5분위 배율이 6.3배로 2013년 통계 작성 이후 가장 높은 수준을 기록했다. 같은 기간 서울의 5분위 배율 6.2배를 넘어서면서 경기 내부 가격 격차가 서울보다 커지는 역전 현상이 나타났다. 반도체 산업 기대가 반영된 화성 동탄 등 경기 남부는 가격이 강세를 보인 반면, 김포·파주 등 서북부는 상승 폭이 더뎠다. 보도는 같은 경기도 안에서도 지역별 자산 격차가 빠르게 벌어지고 있다는 점을 지적했다.","url":"https://www.news1.kr/realestate/general/6333220"},{"n":7,"title":"'유령 아파트' 속출…건설업 폐업신고 17년 만에 최다","meta":"2026.10.27 11:34 · 헤럴드경제","body":"올해 건설업 폐업신고가 전년 같은 기간보다 27.4% 늘며 17년 만에 가장 많은 수준으로 치솟았다. 폐업한 업체의 63%가 비수도권에 몰려 있어 지방 주택시장 침체가 직접적인 배경으로 지목된다. 광주 신창 우투피유블레스 리버사이드시티처럼 시공사 부도로 공사가 멈춘 '유령 아파트' 현장은 대체 시공사를 구하기 어려워 장기간 방치되고 있다. 준공된 단지도 수분양자가 잔금 대출을 받지 못해 입주를 포기하는 사례가 이어지면서, 주요 건설사의 준공 후 미수금은 7조6000억원 규모로 집계됐다.","url":"https://biz.heraldcorp.com/article/10916107"}]},{"name":"정비사업","articles":[{"n":12,"title":"\"정비사업 속도 높여라\"…서울시, 인허가 업무기준 표준화","meta":"2026.10.27 17:13 · 한국경제","body":"서울시가 재건축·재개발 속도를 높이기 위해 자치구별로 제각각이던 정비사업 행정 절차를 표준화하기로 했다. 사업시행자 지정은 30일 이내, 관계기관 협의는 10일 이내에 마치도록 하고 보완 요구는 최대 두 차례로 제한한다. 그동안 자치구마다 기준이 달라 인허가가 늦어진다는 지적이 이어졌다. 서울시는 우선 표준 기준을 적용하면서, 회신이 없으면 동의한 것으로 보는 '협의 간주제' 도입 등 관련 법령 개정도 함께 추진할 방침이다.","url":"https://www.hankyung.com/article/2026102785631"},{"n":13,"title":"재초환 부담금 '강남 1호' 나오나…정비업계 긴장","meta":"2026.10.28 05:30 · 뉴시스","body":"서울 서초구가 반포현대아파트 재건축 단지에 연내 재건축초과이익 부담금을 부과할 방침을 밝히면서 강남권 첫 사례가 나올지 주목된다. 재초환은 조합원 1인당 재건축 이익이 8000만원을 넘으면 초과분의 최대 50%를 환수하는 제도다. 서울에서 부과가 예상되는 단지는 46곳, 예상 부담금은 약 2조원 규모로 추산된다. 업계에서는 부과 시점과 산정 방식, 양도세와의 이중과세 논란을 두고 소송 가능성까지 거론되고 있다.","url":"https://www.newsis.com/view/?id=NISX20261027_0003843621"}]},{"name":"금융/세제","articles":[{"n":17,"title":"금리 오르면 서울 외곽부터 직격…금천·성북 대출의존도 최고","meta":"2026.10.28 06:00 · 파이낸셜뉴스","body":"주택담보대출 금리가 오르면 대출 의존도가 높은 서울 외곽 지역이 먼저 타격을 받을 수 있다는 분석이 나왔다. 지역별 대출의존도 지수는 금천구 58.13, 성북구 55.46으로 높은 반면 강남구는 24.69에 그쳤다. 대출 규제 강화 이후 생애 첫 주택 구입자와 30대가 상대적으로 값이 싼 외곽으로 이동했고, 9월 서울 아파트 거래의 51.4%를 이들이 차지했다. 현재 주담대 금리는 고정형 6.6%, 변동형 6.51% 수준까지 올라 추가 상승 가능성도 거론된다.","url":"https://www.fnnews.com/news/202610221524274355"},{"n":18,"title":"수도권 40대 1인당 가계대출 1억4000만원 육박…30·40대 빚 역대 최대","meta":"2026.10.28 06:00 · 뉴시스","body":"한국은행 자료를 문진석 더불어민주당 의원이 분석한 결과, 올해 2분기 수도권 40대의 1인당 가계대출 잔액은 약 1억3977만원으로 2013년 통계 작성 이후 가장 높았다. 같은 기간 30대 평균 대출은 1억2317만원으로 2.25배 늘었다. 증가세는 주택담보대출이 주도했으며, 주담대 보유자의 부채 부담이 특히 크게 늘어난 것으로 나타났다. 소비 주력 연령대에 가계부채가 몰리면 내수 회복에 부담이 될 수 있다는 지적이 제기됐다.","url":"https://www.newsis.com/view/?id=NISX20261027_0003843477"}]},{"name":"임대주택","articles":[{"n":19,"title":"LH, 연내 과천·구리 등 16개 단지 임대주택 4663가구 공급","meta":"2026.10.27 17:14 · 한국경제","body":"한국토지주택공사(LH)가 연말까지 16개 단지 4663가구의 임대주택 입주자를 모집한다. 이 가운데 수도권 물량이 3554가구이며, 과천지식정보타운 S-12블록이 행복주택 1424가구로 단일 단지 최대 규모다. 전체 물량은 행복주택 6개 단지 3173가구, 통합공공임대 1490가구로 구성된다. 구리갈매역세권 609가구, 인천부천 350가구 등이 포함되며 대부분 2028년 준공을 목표로 한다.","url":"https://www.hankyung.com/article/2026102785611"},{"n":20,"title":"[단독] 옛 성동구치소 임대 620가구 조정 여지…주민 반발에 공급비율 재검토","meta":"2026.10.27 15:48 · 파이낸셜뉴스","body":"서울시와 서울주택도시개발공사가 송파구 옛 성동구치소 부지의 공공주택 공급 비율을 다시 들여다보고 있다. 현재 계획은 공공분양과 임대를 각각 620가구씩 배정하는 내용이지만, 주민들은 임대 100가구 수준이던 당초 계획으로 되돌리라고 요구하고 있다. 서울시 관계자는 비율 조정을 검토하고 있으나 원안 복귀는 어렵다는 입장을 밝혔다. 부지 내 시니어 레지던스 조성과 공공기여금 산정을 둘러싼 갈등도 함께 이어지고 있다.","url":"https://www.fnnews.com/news/202610260906276285"}]},{"name":"주택품질/안전","articles":[{"n":21,"title":"\"창문 닫으니 비행기 소음 뚝\"…목동11단지에 방음 특화 체험관","meta":"2026.10.27 17:40 · 머니투데이","body":"IPARK현대산업개발이 서울 목동11단지 재건축 수주를 위해 맞춤형 주거 성능을 보여주는 체험 라운지를 열었다. 김포공항 항공기 소음을 줄이기 위한 삼중창 시스템을 전면에 내세운 것이 특징이다. 체험관에서는 마감재를 3D로 확인하고 인공지능으로 구현한 41층 단지 조망을 미리 볼 수 있도록 했다. 이 단지 시공사 선정 입찰에는 GS건설, 대우건설, 포스코이앤씨도 참여할 것으로 예상되며 입찰은 2027년 2분기로 전망된다.","url":"https://www.mt.co.kr/estate/2026/10/27/2026102717085624468"}]},{"name":"분양정보","articles":[{"n":22,"title":"아크메르 동탄 1순위 평균 1.02대 1…84㎡C만 순위 내 마감","meta":"2026.10.28 01:17 · 스트레이트뉴스","body":"포스코이앤씨가 경기 화성 동탄1신도시에 공급하는 '아크메르 동탄' 95·99블록의 1순위 청약에서 1559가구 모집에 1583건이 접수돼 평균 1.02대 1을 기록했다. 17개 주택형 가운데 84㎡C형만 82가구 모집에 644건이 몰려 7.85대 1로 순위 내 마감했다. 반면 129㎡B형은 174가구 모집에 14건만 접수되는 등 대형 평형은 부진했다. 95블록 물량의 58.6%가 미달로 남아 2순위 접수로 넘어갔다.","url":"https://www.straightnews.co.kr/news/articleView.html?idxno=314078"},{"n":23,"title":"\"10억 집을 2억5000만원 내고 입주\"…광교에 지분적립형 '할부 아파트'","meta":"2026.10.28 06:30 · 한국경제","body":"경기 광교신도시에서 처음 지분의 25%만 사고 나머지를 20년에 걸쳐 나눠 취득하는 지분적립형 분양주택이 공급된다. '광교 네이처웰 센트레빌'은 전용 59㎡ 240가구로 구성되며, 10억원대 주택을 2억5000만원가량의 초기 부담으로 입주할 수 있다. 입주자는 초기 부담금 외에 공공기관이 보유한 지분에 대한 사용료를 내고, 이후 예금금리를 반영한 이자를 더해 잔여 지분을 취득한다. 5년 거주 의무와 10년 전매 제한이 적용된다.","url":"https://www.hankyung.com/article/2026102768896"}]},{"name":"논설/사설","articles":[{"n":25,"title":"[데스크칼럼] '닥공' 막는 대못부터 뽑아야","meta":"2026.10.27 17:42 · 한국경제","body":"건설·부동산 담당 데스크가 정부의 공급 드라이브에도 실제 성과가 더딘 이유를 짚었다. 칼럼은 서울 주택 착공이 전년 대비 45% 늘었지만 전국 목표 대비 달성률은 36.9%에 그친다고 지적했다. 오피스텔 거래 규제, 계약 해제 분쟁, 재건축 입주권 양도 제한 등 민간 공급을 막는 규제를 먼저 풀어야 한다는 것이 필자의 주장이다. 공공 공급만으로는 한계가 있는 만큼 수요 억제 규제를 함께 완화해야 2027년까지 이어질 전월세난을 막을 수 있다고 제언했다.","url":"https://www.hankyung.com/article/2026102786391"},{"n":26,"title":"[사설] 서울 집값만 보는 정부, 지방 부동산 위기는 눈 감아","meta":"2026.10.28 05:10 · 부산일보","body":"사설은 부산 주택시장에 미분양 통계로는 잡히지 않는 부실이 쌓이고 있다고 진단했다. 수분양자가 잔금을 마련하지 못해 입주가 미뤄지는 사례가 늘면서 건설사 자금난과 부도설까지 번지고 있다는 것이다. 정부가 다섯 차례 대책을 내놓는 동안 모두 서울을 겨냥했을 뿐 지방을 위한 대책은 없었고, 같은 규제를 일률 적용해 지방 사업자가 더 큰 타격을 받았다고 비판했다. 사설은 침체가 심한 지역을 따로 진단해 수요자 여력과 지역 여건을 고려한 금융 지원 등 맞춤형 대책을 정부와 부산시가 즉시 마련해야 한다고 촉구했다.","url":"https://www.busan.com/view/busan/view.php?code=2026102718021105345"}]}]},{"date":"2026-10-27","count":15,"pdf_count":24,"highlights":[{"n":1,"text":"국감 끝나자 재개된 정부·서울시 주택공급 협상…용산공원 vs 탄천 부지 쟁점"},{"n":4,"text":"서울 아파트 매물 7만8000건 돌파…강남·서초는 11주 연속 하락"},{"n":12,"text":"HDC현대산업개발, 4482억 군포 금정역세권1구역 수주"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"국감 끝나자 재개된 정부·서울시 주택공급 협상…용산공원 vs 탄천 부지 쟁점","meta":"2026.10.27 04:10 · 머니투데이","body":"국토교통부 국정감사가 10월 23일 종료되고 같은 날 서울고법 형사7부가 오세훈 서울시장의 정치자금법 위반 혐의 항소심에서 무죄를 선고하면서, 서울 주택공급을 둘러싼 정부와 서울시의 물밑 협상이 다시 열릴 것이라는 관측이 나온다. 정부는 용산공원 내 훼손지를 활용한 주택공급을 제시하고 있으나 서울시는 이에 반대하며 탄천물재생센터 부지를 대안으로 내세우고 있어 양측은 평행선을 달리고 있다. 서울시는 정비사업 용적률을 1.2배로 높여 달라고 요청했으며, 정부가 수용하면 약 4만3000가구 공급이 가능하다는 것이 시의 설명이다. 더불어민주당 박민규 의원 등은 10월 15일 용산공원 본체 부지를 활용한 주택공급이 가능하도록 용산공원 조성 특별법 개정안을 발의했다. 취임 한 달가량 된 홍지선 국토부 장관과 오세훈 시장이 접점을 찾을지가 관건이다.","url":"https://www.mt.co.kr/estate/2026/10/27/2026102620025543881"},{"n":2,"title":"\"실거주 의무 1년 만에 서울 아파트 전세 물량 11.9% 감소\"","meta":"2026.10.26 17:21 · 한국경제","body":"국회에서 열린 토론회에서 전문가들이 정부의 실거주 의무 규제가 전·월세난을 키웠다고 지적했다. 배관표 충남대 교수는 2025년 10월 서울 전역과 경기 일부에 토지거래허가제가 시행된 이후 1년간 서울 아파트 전세 물건이 11.9% 줄고 전셋값은 9.96% 올랐다고 밝혔다. 현행 규제는 허가구역 내 매수자가 지방자치단체 허가를 받고 4개월 내 입주해 2년간 거주하도록 하고 있다. 참석자들은 규제지역 집값은 내려가도 인근 지역 값이 오르는 풍선효과가 나타나고 전세의 월세화가 빨라져 저소득층과 청년의 부담이 커진다고 주장했다. 정수연 제주대 교수는 \"인센티브 없이 실거주를 의무화하는 나라는 OECD 중 한국뿐\"이라며 미국·프랑스처럼 정책자금 혜택과 연계하는 방식을 제안했다.","url":"https://www.hankyung.com/article/2026102658921"}]},{"name":"시장동향","articles":[{"n":4,"title":"서울 아파트 매물 7만8000건 돌파…강남·서초는 11주 연속 하락","meta":"2026.10.27 05:00 · 세계일보","body":"10월 25일 기준 서울 아파트 매매 매물은 7만8323건으로 3월 29일 이후 약 7개월 만에 가장 많은 수준을 기록했다. 세제개편안이 발표된 8월 3일 이후 석 달이 채 안 돼 29.7% 늘었으며, 성북구가 1474건에서 2297건으로 55.8% 증가해 가장 큰 폭으로 늘었다. 서울 아파트값은 89주 연속 올랐지만 주간 상승률은 0.13%로 축소됐고, 강남·서초구는 11주 연속 하락했다. 성북구는 매물이 늘었는데도 가격이 0.36% 오르는 등 지역별 흐름이 갈렸다. 9월 신규 취급액 코픽스가 3.43%로 오르며 대출 이자 부담도 커지고 있다.","url":"https://www.segye.com/newsView/20261027501062"},{"n":5,"title":"경기 아파트값 상승률, 30개월 만에 서울 추월","meta":"2026.10.27 04:10 · 머니투데이","body":"10월 경기도 아파트 매매가격은 전월 대비 0.74% 올라 서울(0.61%)을 앞질렀다. 상승장에서 경기가 서울을 추월한 것은 30개월 만이다. 최근 석 달 누적 상승률은 수원 영통구 9.5%, 화성 동탄 7.8%, 화성 병점 7.5%, 군포 6.1% 등 경기 남부가 주도했다. 2025년 말과 비교하면 용인 수지구가 22.0%, 안양 동안구 19.6%, 수원 영통구 18.8% 올라 경기 전체(6.7%)와 서울(11.0%) 상승률을 크게 웃돌았다. 업계에서는 반도체 업황 호조에 따른 구매력 확대와 전세 매물 부족으로 직장 인근 수요가 몰린 결과로 보고 있다.","url":"https://www.mt.co.kr/estate/2026/10/27/2026102620003170014"}]},{"name":"정비사업","articles":[{"n":12,"title":"HDC현대산업개발, 4482억 군포 금정역세권1구역 수주","meta":"2026.10.26 13:38 · 머니투데이","body":"HDC현대산업개발이 경기 군포 금정역세권1구역 재개발 시공사로 선정됐다. 10월 24일 열린 시공사 선정 총회에서 참석 조합원 381명 중 333명(87.4%)의 동의를 얻었다. 사업은 지하 4층~지상 최고 35층 10개 동, 전용 39~135㎡ 1137가구 규모로 공사비는 4482억원이며 이는 전년도 연결 매출의 10.8%에 해당한다. 단지는 지하철 1·4호선 금정역과 가깝고 상업시설·의료시설·학교가 인접해 있으며, 조경 정원과 1.4㎞ 산책로, 스카이 커뮤니티가 계획됐다. 이번 수주로 HDC현대산업개발의 올해 도시정비사업 누적 수주액은 2조2140억원이 됐다.","url":"https://www.mt.co.kr/estate/2026/10/26/2026102613310557271"},{"n":13,"title":"노원 하계한신·대성 재건축 추진위 승인…최고 41층 942가구","meta":"2026.10.26 14:51 · 머니투데이","body":"서울 노원구 하계한신·대성 아파트가 10월 23일 재건축 추진위원회 설립 승인을 받았다. 현재 최고 15층 498가구를 최고 41층 10개 동 942가구로 다시 짓는 사업이다. 주민 동의율은 77.45%로 최근 노원구에서 승인된 추진위 가운데 가장 높았으며, 2026년 7월 공공지원 정비계획 수립에 착수한 뒤 약 3개월 만에 추진위가 꾸려졌다. 2027년 하반기 개통 예정인 동북선 113정거장 신설에 따른 용적률 인센티브도 사업성에 반영됐다. 서울시 도시계획위원회가 다음 달 심의할 예정이며 2027년 상반기 정비구역 지정을 목표로 하고 있다. 노원구에서 2026년 8월 이후 승인된 여섯 번째 추진위다.","url":"https://www.mt.co.kr/estate/2026/10/26/2026102614482358719"}]},{"name":"금융/세제","articles":[{"n":15,"title":"8·13 대책에도 주담대 문턱 그대로…4분기 대출태도지수 0","meta":"2026.10.26 12:15 · 비즈워치","body":"한국은행이 국내 금융기관 203곳을 상대로 실시한 금융기관 대출행태 서베이에서 4분기 가계 주택대출 태도지수 전망치가 0으로 집계됐다. 3분기 -17에서 올라왔지만 중립 수준으로, 한은 관계자는 \"주택 관련 대출은 3분기에 강화된 심사 수준을 4분기에도 유지한다는 의미\"라고 설명했다. 가계 일반대출 태도지수는 -28에서 -8로 개선됐고, 중소기업 대출은 -19, 대기업 대출은 0에서 -8로 낮아졌다. 기업 대출 연체율은 6월 0.68%에서 8월 0.86%로, 중소기업은 0.82%에서 1.00%로 올랐다. 은행들은 금리 상승과 경기 불확실성에 따른 신용위험 확대를 이유로 대출 한도를 늘리면서도 심사 기준은 유지하고 있다.","url":"https://news.bizwatch.co.kr/article/finance/2026/10/26/0011"},{"n":16,"title":"은행 대신 집주인에게 빌린다…강남 매매에 7억 근저당","meta":"2026.10.26 16:29 · 헤럴드경제","body":"대출 규제가 강해지면서 서울 강남권 고가 아파트 거래에서 매도인이 매수인에게 매매대금 일부를 빌려주고 근저당을 설정하는 사례가 늘고 있다. 반포동의 한 아파트는 9월 31억5000만원에 팔리면서 매도인 명의의 7억2000만원 근저당이 설정됐다. 중개업소에서는 열 건 중 한두 건이 이런 방식이라고 전하며, 통상 5억~10억원을 연 5% 안팎 금리에 6개월 만기로 빌려주는 조건이라고 설명했다. 매도인은 최근 소득금액증명원 등으로 매수인의 상환 능력을 확인하지만 상환 지연 시 분쟁 위험이 있다. 박원갑 전문위원은 자금력 있는 수요자만 유리한 조건을 얻게 돼 자산 격차가 커질 수 있다고 지적했다.","url":"https://biz.heraldcorp.com/article/10915210"}]},{"name":"임대주택","articles":[{"n":17,"title":"보증금 10억 넘는 신혼부부 장기전세…자산 기준 논쟁","meta":"2026.10.27 05:06 · 이데일리","body":"서울시 신혼부부 장기전세주택 '미리내집'의 보증금이 강남권을 중심으로 10억원을 넘어섰지만 입주 자산 기준은 6억6200만원대에 묶여 있어 괴리가 커지고 있다. 최근 공급된 반포자이는 보증금 12억6400만원, 래미안대치팰리스는 11억7000만원에 책정됐다. 2024년부터 2026년까지 자산 기준은 1.08% 오르는 데 그친 반면 서울 아파트 전셋값은 10.9% 상승했다. 보증금이 높은 주택은 신청자가 2명에 그친 반면 보증금이 낮은 주택은 408대 1의 경쟁률을 기록하는 등 쏠림도 나타났다. 자산 기준을 시장에 맞춰 올려야 한다는 의견과 공공성을 지켜야 한다는 의견이 맞서는 가운데, 서울시는 소득별 보증금 차등 적용 방안을 연내 마련할 계획이다.","url":"https://www.edaily.co.kr/News/Read?newsId=01712166645617184"},{"n":18,"title":"LH, 매입임대 제3자 문의 2회 땐 매입 중단","meta":"2026.10.26 13:57 · 파이낸셜뉴스","body":"한국토지주택공사(LH)가 매입임대주택 사업의 공정성을 높이기 위해 '제3자 상담내역 등록제'를 도입했다. 중개업자, 외부기관 관계자, 퇴직 직원 등 직접 이해관계가 없는 제3자가 특정 매물을 문의하면 직원이 이를 등록하도록 했다. 1회 문의 시 매도인에게 안내 문자를 보내고, 같은 매물에 대한 문의가 2회 이상이면 감사 의뢰와 함께 조사 결과가 나올 때까지 매입 절차를 중단한다. 신축매입약정 물량은 2023년 9253가구에서 2025년 5만3771가구로 늘었고 2026~2027년 수도권 7만가구 공급이 목표다. 과거 LH 인천지역 직원이 감정평가 자료를 16차례 이상 공유하고 금품을 받아 유죄 판결을 받았으며, 해당 중개인은 29건 거래로 약 99억원의 수수료를 챙긴 것으로 조사됐다.","url":"https://www.fnnews.com/news/202610261353571297"}]},{"name":"택지/도시개발","articles":[{"n":19,"title":"LH, 쌍문역 서측·연신내역 보상 착수…1796가구 공급","meta":"2026.10.26 10:49 · 머니투데이","body":"한국토지주택공사(LH)가 10월 23일부터 서울 도봉구 쌍문역 서측과 은평구 연신내역 도심 공공주택 복합사업의 협의보상 절차를 시작했다. 공급 예정 물량은 쌍문역 서측 1404가구, 연신내역 392가구 등 모두 1796가구다. 쌍문역 서측은 지하철 4호선, 연신내역은 3·6호선과 GTX-A 노선을 이용할 수 있다. 보상과 이주 절차를 마친 뒤 2028년 착공을 목표로 한다. LH는 다음 달 신길2지구와 증산4지구에서도 보상 절차에 들어가며 두 지구의 공급 규모는 4900가구다. 서울 도심복합사업은 6개 지구 7755가구 규모로 추진되고 있으며 2026년 9월 후보지 11곳이 추가 선정됐다.","url":"https://www.mt.co.kr/estate/2026/10/26/2026102610162982501"}]},{"name":"주택품질/안전","articles":[{"n":20,"title":"현대건설, 실내 부유세균 99% 줄이는 환기 기술 개발","meta":"2026.10.26 17:00 · 헤럴드경제","body":"현대건설이 고성능 열교환기와 실별 환기 제어를 결합한 실내 공기질 통합관리 기술 '알러지 케어 솔루션'을 개발했다고 밝혔다. 정전 분무 방식으로 부유세균을 최대 99% 줄이고, 광이온화 기술로 유해가스를 최대 96% 저감한다는 것이 회사 설명이다. 시간당 환기 횟수는 법적 기준인 0.5회를 크게 웃도는 6회 이상이며, 성능은 KTL과 KCL의 시험으로 검증했다고 덧붙였다. 입주민이 모바일 앱 '마이힐스'와 '마이디에이치'로 실시간 공기질을 확인하고 주방·자녀방 등 공간별로 환기를 제어할 수 있게 할 계획이다.","url":"https://biz.heraldcorp.com/article/10915257"}]},{"name":"분양정보","articles":[{"n":21,"title":"서초 롯데캐슬 아트팰리스 다음 달 공급…일반분양 146가구 모두 소형","meta":"2026.10.26 08:33 · 아시아경제","body":"롯데건설이 서울 서초동 '서초 롯데캐슬 아트팰리스' 146가구를 다음 달 공급한다. 일반분양 물량은 전용 35~46㎡ 소형으로 1~3인 가구를 겨냥했으며, 단지는 지하 5층~지상 36층 2개 동 835가구 규모다. 서울시 청년안심주택 사업으로 추진돼 시세보다 낮은 가격에 공급되며, 공사가 끝나 계약 후 바로 입주가 가능하고 입주 시기는 2027년 2월이다. 일반공급 물량의 60%가 추첨제로 배정돼 가점이 낮은 수요자도 노려볼 수 있다는 점이 특징으로, 최근 강남권 단지의 당첨 가점이 70점 안팎에 형성된 것과 대비된다. 지하철 3호선 남부터미널역 생활권으로 업무지구와 문화시설이 가깝다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026102608332581709"},{"n":22,"title":"'GTX 운정중앙역 시티프라디움' 견본주택 3일간 1만5000명 방문","meta":"2026.10.26 16:17 · 헤럴드경제","body":"시티건설이 10월 23일 경기 파주에 문을 연 'GTX 운정중앙역 시티프라디움' 견본주택에 25일까지 사흘간 약 1만5000명이 다녀갔다. 단지는 3블록 48층, 4블록 45층으로 아파트 944가구와 상업시설 171실로 구성된다. GTX-A 운정중앙역까지 도보 2분 거리로 서울역까지 약 22분이 걸리는 교통 여건이 관심을 끈 요인으로 꼽힌다. 청약은 11월 2~4일 진행되며 당첨자 발표는 11월 10~11일, 계약은 11월 25~29일이고 준공은 2030년 7월 예정이다. 비규제지역이어서 파주와 수도권 거주 만 19세 이상이면 청약할 수 있고 실거주 의무가 없는 대신 전매제한 3년이 적용된다.","url":"https://biz.heraldcorp.com/article/10915191"}]},{"name":"논설/사설","articles":[{"n":23,"title":"[사설] 집값 89주 연속 상승인데 연말 안정 전망한 국토부 장관","meta":"2026.10.26 18:15 · 디지털타임스","body":"서울 아파트 매매가와 전셋값이 89주 연속 오르고 오피스텔 월세도 2024년 1월 이후 33개월째 상승하는 상황을 짚으며 정부의 현실 인식을 비판한 사설이다. 홍지선 국토교통부 장관이 연말 금리 상승 등을 근거로 주택시장이 안정될 것이라고 밝히고 LH 사장은 3년 뒤 집값 폭락을 예상했지만, 사설은 이런 전망이 시장 현실과 동떨어져 있다고 지적했다. 올해 주택 착공 실적은 목표 26만8000가구 중 9만9000가구로 37%에 그쳤고 공공주택은 5만1783가구 중 1만3293가구로 25.7% 수준이라고 제시했다. 실거주 의무 같은 규제가 전세 물량을 더 줄였다는 점도 함께 거론했다. 사설은 정부가 공급 확대보다 규제에 기대면서 정책 신뢰를 잃었다고 주장했다.","url":"https://www.dt.co.kr/article/12091366"}]}]},{"date":"2026-10-26","count":15,"pdf_count":22,"highlights":[{"n":1,"text":"홍지선 국토부 장관 \"주택 인허가·착공 감소가 전세난 원인\""},{"n":4,"text":"서울 전셋값 고점 눈앞…25개 구 중 22개 구가 2년 새 10% 넘게 올라"},{"n":12,"text":"사업시행인가 넘은 재건축 5만가구…서울 전월세 이주 주의보"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"홍지선 국토부 장관 \"주택 인허가·착공 감소가 전세난 원인\"","meta":"2026.10.23 17:13 · 한국경제","body":"홍지선 국토교통부 장관은 10월 23일 국회 국토교통위원회 종합 국정감사에서 전월세 시장 불안의 원인으로 과거 주택 인허가와 착공 물량 감소를 지목했다. 임대인 관련 규제도 일부 작용한 측면이 있다고 인정했으나, 누적된 공급 부족이 지금 효과를 드러내고 있다는 설명이다. 서울 주택 착공은 2022년 6만2585가구에서 2023년 2만7812가구, 2024년 3만2119가구로 줄었고, 올해 수도권 착공은 21만8000~23만5000가구로 정부 목표에 미치지 못할 전망이다. 국토부는 토지거래허가구역 조정과 정비사업 조합원 지위 승계 요건 완화 등을 검토하겠다고 밝혔다.","url":"https://www.hankyung.com/article/2026102316861"},{"n":2,"title":"[2026 국감] 국토부 컨트롤타워 역할 도마…공급·전월세 대책 촉구","meta":"2026.10.23 20:16 · 뉴스핌","body":"국회 국토교통위원회는 10월 23일 종합 국정감사에서 국토교통부의 정책 조율 기능이 약하다고 집중 질타했다. 유의동 위원장은 국민이 금융당국을 컨트롤타워로 인식한다며 금융·세제와 연계한 주택공급 조율을 주문했다. 올해 1~9월 서울 아파트 전월세 거래 17만2000여 건 가운데 월세가 50.5%를 차지했고, 평균 월세는 전년보다 21만원 오른 166만1000원으로 집계됐다. 이 밖에 GTX-A 삼성역 철근 부족에 따른 안전성 검증, LH 자산·부채 분할 계획 미비도 쟁점이 됐다. 홍지선 장관은 규제의 부작용을 일부 인정하면서도 수도권 주택 재고 부족이 근본 원인이라고 답변했다.","url":"https://www.newspim.com/news/view/20261023001243"},{"n":3,"title":"국토부, 청년월세 소득기준 내년 완화…전월세 안심신탁 연내 공모","meta":"2026.10.22 09:16 · 한국경제","body":"국토교통부는 월세 부담 완화를 위해 청년월세 지원 대상을 9만3000명에서 24만명으로 늘리고, 내년 상반기 모집부터 소득 기준을 완화하기로 했다. 올해 1~9월 서울 아파트 전월세 거래에서 월세 비중은 51%로 2011년 통계 집계 이후 처음 50%를 넘었고, 평균 월세는 166만1000원으로 1년 전보다 21만8000원(15.1%) 올랐다. 정부는 임차인이 전세대출로 월세보다 낮은 비용에 거주하고 임대인은 연체·공실 부담을 더는 전월세 안심신탁을 연내 공모한다. 월세 세액공제는 총급여 8000만원 이하 무주택 근로자에게 월세액의 15~17%를 돌려준다. 홍지선 장관은 월세화의 배경으로 1인 가구 증가와 전세사기 여파, 공급 감소를 들었다.","url":"https://www.hankyung.com/article/202610227719i"}]},{"name":"시장동향","articles":[{"n":4,"title":"서울 전셋값 고점 눈앞…25개 구 중 22개 구가 2년 새 10% 넘게 올라","meta":"2026.10.23 04:30 · 머니투데이","body":"서울 아파트 전셋값이 89주 연속 오르며 2022년 1월 고점에 바짝 다가섰다. 10월 19일 기준 전셋값은 직전 최고점보다 0.67% 낮은 수준이며, 성동·송파·노원 등 9개 구는 이미 종전 기록을 넘어섰고 성동구는 고점 대비 10.62% 높다. 2024년 10월부터 2026년 10월까지 2년간 서울 전셋값은 13.04% 올랐고 송파 19.39%, 노원 18.27%, 성북 17.90% 순으로 상승폭이 컸으며 25개 구 가운데 22개 구가 10%를 넘겼다. 신규 입주 감소와 전세의 월세 전환, 정비사업 이주 수요가 겹쳐 상승 압력이 이어질 것이라는 분석이 나온다. 계약 갱신으로 미뤄 둔 인상분이 만기에 한꺼번에 반영되면서 세입자 부담이 커지고 있다.","url":"https://www.mt.co.kr/estate/2026/10/23/2026102015340229089"},{"n":5,"title":"집값 상승 기대 4개월 연속 하락…KB \"서울 상승률 연내 최저\"","meta":"2026.10.25 16:43 · 파이낸셜뉴스","body":"KB국민은행 10월 주택가격동향에서 서울 아파트 매매가격은 0.61% 올라 올해 들어 가장 낮은 상승률을 기록했고, 경기(0.74%)가 서울을 앞질렀다. 노원구(1.52%)와 종로구(1.32%)가 상승을 이끈 반면 강남구(-0.33%)와 서초구(-0.04%)는 하락으로 돌아섰다. 고가 단지 흐름을 보여주는 KB선도아파트 50지수는 0.39% 내린 98.8로 두 달 연속 하락했다. 전국 전셋값 상승률도 전월 0.49%에서 0.32%로 둔화했다. 매매가격 전망지수는 4개월 연속 떨어져 시장 기대심리가 식고 있음을 보여준다.","url":"https://www.fnnews.com/news/202610251630302242"}]},{"name":"정비사업","articles":[{"n":12,"title":"사업시행인가 넘은 재건축 5만가구…서울 전월세 이주 주의보","meta":"2026.10.23 18:11 · 뉴스핌","body":"우리은행 부동산리서치랩 분석 결과 서울에서 사업시행인가를 받은 정비구역은 66곳, 기존 주택은 4만8249가구로 집계됐다. 이들 구역이 관리처분인가와 이주 단계로 넘어가면 5만가구가 넘는 이주 수요가 발생한다. 새로 공급되는 물량은 6만3072가구지만 임대주택은 9508가구(15%)에 그친다. 용산·관악·영등포구가 멸실 물량의 43.9%, 상위 5개 구가 65.8%를 차지해 지역 쏠림이 크고, 관악 신림1구역(4410가구)과 용산 한남4·5구역(합계 6058가구) 등 대형 사업장이 포함된다. 정비구역에 몰려 있던 저렴한 다세대 임대 물량이 사라지면서 주변 전월세 가격이 흔들릴 수 있다는 우려가 제기된다.","url":"https://www.newspim.com/news/view/20261023001216"},{"n":13,"title":"30조 목동 재건축 수주전 점화…대형 건설사 하이엔드 브랜드 총출동","meta":"2026.10.25 17:30 · 문화일보","body":"서울 양천구 목동신시가지 재건축 사업비가 30조원 규모로 추산되면서 대형 건설사들의 수주 경쟁이 달아오르고 있다. 6단지는 DL이앤씨, 10단지는 현대건설이 시공권을 확보했고 8·12·13단지는 각각 대우건설, GS건설, 삼성물산이 우선협상대상자로 선정됐다. 현대건설은 10단지(4248가구·약 2조6100억원)에 하이엔드 브랜드 디에이치 목동 에세르를, DL이앤씨는 6단지(약 1조2900억원)에 아크로 목동 리젠시를 제안했다. 5123가구로 가장 큰 14단지에도 건설사들의 관심이 쏠려 있다. 다만 지금까지 다섯 차례 입찰이 모두 단독 응찰로 끝나 경쟁입찰이 성립하지 않았다는 점이 과제로 남았다.","url":"https://www.munhwa.com/article/11626060"}]},{"name":"금융/세제","articles":[{"n":14,"title":"외곽 집값 뛰자 가계대출 다시 들썩…5대 은행 이달 2.6조 증가","meta":"2026.10.25 09:40 · 디지털타임스","body":"KB국민·신한·하나·우리·NH농협 등 5대 은행의 가계대출 잔액은 10월 22일 기준 783조4000억원으로 전달보다 2조6000억원 늘었다. 주택담보대출이 약 1조원 증가해 9월 증가분과 큰 차이를 보였고, 신용대출도 석 달 만에 1조원 넘게 늘었다. 집단대출은 4조8000억원 증가한 반면 전세자금대출은 3조7000억원 줄었다. 서울 외곽과 경기 남부 아파트값 상승, 증시 조정에 따른 신용거래 수요가 겹친 결과로 풀이된다. 5대 은행 주담대 변동금리는 연 4.42~6.795%로 9월 말보다 하단이 0.07%포인트 올랐다.","url":"https://www.dt.co.kr/article/12091015"},{"n":15,"title":"15억 초과 주담대 금지 소문 확산…금융당국 \"사실무근\"","meta":"2026.10.25 16:00 · 한국경제","body":"정부가 15억원 초과 주택에 주택담보대출을 전면 금지한다는 내용의 소문이 사회관계망서비스(SNS)에서 퍼지자 금융당국이 전면 부인했다. 이억원 금융위원장은 사실무근이라며 수사 의뢰를 포함한 엄정 대응을 예고했다. 현행 규제지역에서는 15억원 이하 주택의 주담대 한도가 6억원으로 묶여 있다. 한편 서울 아파트값은 89주 연속 올라 최장 상승 기록을 다시 썼고, 상승세는 강남권에서 서울 외곽과 경기 남부로 옮겨갔다. 4분기 전국 입주 물량이 약 4만4300가구로 1년 전보다 39% 줄어 전월세 불안이 이어질 것이라는 전망도 함께 제기됐다.","url":"https://www.hankyung.com/article/2026102302356"}]},{"name":"임대주택","articles":[{"n":17,"title":"[단독] 신청자 30만명 몰렸는데 LH 매입임대는 빈집","meta":"2026.10.23 00:51 · 국민일보","body":"한국토지주택공사(LH)가 올해 8월까지 내놓은 매입임대주택 1만3758가구 가운데 계약은 8862가구에 그쳐 계약률이 64.4%에 머물렀다. 신청자는 29만6296명에 달했지만 실제 계약으로 이어지지 않은 것이다. 계약률은 2022년 92.4%, 2023년 80.3%, 2024년 87.8%, 2025년 87.3%로 매년 100%를 밑돌았으나 LH는 미계약 사유를 따로 집계하지 않고 있다. 6개월 이상 비어 있는 장기 공가는 2024년 말 5154가구에서 올해 8월 7609가구로 늘었고, 공가관리비도 12억2000만원에서 14억8000만원으로 증가했다. 정부는 2030년까지 매입임대 31만3000가구를 공급하겠다고 밝힌 상태다.","url":"https://www.kmib.co.kr/article/20261022502095"},{"n":18,"title":"가족돌봄청년 86% 공공임대 원하지만 거주 경험은 11%","meta":"2026.10.25 14:11 · 머니투데이","body":"국토연구원이 2024년 자료를 분석한 결과 가족을 돌보는 19~34세 청년의 86.3%가 공공임대주택 입주를 희망했지만 실제 거주 경험은 10.9%에 그쳤다. 전체 청년의 공공임대 희망 비율(71.6%)보다 높은 수치다. 1인당 주거면적은 26.2㎡로 일반 청년(32.2㎡)보다 6㎡ 좁았고, 독립된 침실이 없는 비율은 10.5%로 전체 청년(4.7%)의 두 배였다. 보증금 부족을 겪은 비율도 16%로 전체 청년(5.7%)의 세 배 가까웠다. 보고서는 가족돌봄청년을 공공임대 우선 공급 대상에 포함하고 대출 중심 지원을 직접 지원으로 보완할 것을 제안했다.","url":"https://www.mt.co.kr/estate/2026/10/25/2026102309394098807"}]},{"name":"택지/도시개발","articles":[{"n":19,"title":"3기 신도시 교통망도 속도전…국토부 직접 인허가 사업 확대","meta":"2026.10.25 14:27 · 머니투데이","body":"국토교통부가 3기 신도시 교통망 구축을 앞당기기 위해 직접 인허가 대상 사업을 5건에서 7건으로 늘린다. 새로 포함된 사업은 인천 계양지구의 고촌IC 개선과 상야마을 도로 등 2건이다. 직접 인허가는 2025년 10월 대도시권 광역교통관리에 관한 특별법 개정으로 도입됐으며, 여러 지방자치단체 인허가 절차를 생략해 기간을 단축할 수 있다. 계양지구는 올해 12월 첫 입주가 시작되지만 주요 도로 완공은 2031년으로 예정돼 있다. 국토부는 입주와 기반시설 완공 사이의 시차를 최소화하겠다는 방침이다.","url":"https://www.mt.co.kr/estate/2026/10/25/2026102511300110238"}]},{"name":"주택품질/안전","articles":[{"n":20,"title":"국토부 \"하자보수 안 한 시공사에 시정명령·과태료\"","meta":"2026.10.23 10:46 · 뉴스핌","body":"홍지선 국토교통부 장관은 10월 23일 국정감사에서 아파트 하자보수를 이행하지 않는 시공사에 대한 제재를 강화하겠다고 밝혔다. 홍 장관은 지방자치단체가 시정명령과 과태료 처분을 강하게 집행하도록 하겠다고 말했다. 정일영 더불어민주당 의원은 SK에코플랜트가 지은 아파트에서 테라스 붕괴와 누수, 전기 설비 고장 등 하자가 발생한 사례를 제시했다. 정 의원은 건설사별 하자 이력을 순위로 공개해 소비자가 품질을 확인할 수 있게 하자고 제안했다. 국토부는 이 제안을 검토하고 아파트 하자·부실시공 관련 추가 제도개선 방안을 마련하기로 했다.","url":"https://www.newspim.com/news/view/20261023000386"}]},{"name":"분양정보","articles":[{"n":21,"title":"10월 마지막 주 전국 8곳 5555가구 청약…동탄·해운대 대단지","meta":"2026.10.25 09:24 · 머니투데이","body":"리얼투데이 집계에 따르면 10월 마지막 주 전국 8개 사업장에서 5555가구가 청약을 받는다. 경기 화성시에서는 포스코이앤씨가 아크메르 동탄 95·99(1808가구)를 7개 동, 전용 54~162㎡로 공급한다. 부산 해운대구에서는 두산에너빌리티의 트리븐센텀 1·2단지(1644가구)가 9개 동, 전용 75~114㎡ 규모로 나온다. 충북 청주 신분평 에피트 더웨이시티(992가구)와 서울 영등포 오피스텔 GD메트로타워(770실)도 포함됐다. 1순위 청약은 10월 27일부터 시작된다.","url":"https://www.mt.co.kr/estate/2026/10/25/2026102316122187659"}]},{"name":"논설/사설","articles":[{"n":22,"title":"[취재수첩] DSR은 관대한데 대출 문턱은 높은 나라","meta":"2026.10.25 17:36 · 한국경제","body":"이찬진 금융감독원장은 국정감사에서 한국만큼 총부채원리금상환비율(DSR) 규제를 관대하게 적용하는 나라가 없다고 말했다. 2018년 도입된 DSR은 연간 원리금 상환액을 소득의 40% 이내로 묶는 규제다. 그러나 올해 2분기 가계대출 신규 취급액의 70.5%가 DSR 규제를 받지 않았고, 정작 소득이 충분하고 기존 부채가 적은 차주조차 한도가 줄어 대출을 받기 어려워졌다. 글은 예외가 많은 제도와 총량 규제가 겹치면서 개인의 상환능력 평가보다 대출 목표 관리가 앞서게 됐다고 지적한다. 당국이 총량 규제의 적용 기간과 기준을 명확히 하고 DSR의 구멍부터 메워야 한다는 의견을 제시했다.","url":"https://www.hankyung.com/article/2026102534621"}]}]},{"date":"2026-10-22","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"한승구 건설협회장 \"산안법 개정안, 주택공급 위축 부를 것\""},{"n":3,"text":"월세가 점령한 서울…'전세의 월세화' 외곽까지 확산"},{"n":8,"text":"부진한 일산 1기 신도시 재건축…홍지선 장관 \"제도·행정 지원\""}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"한승구 건설협회장 \"산안법 개정안, 주택공급 위축 부를 것\"","meta":"2026.10.21 16:00 · 머니투데이방송(MTN)","body":"한승구 대한건설협회 회장이 21일 출입기자단 간담회에서 국회를 통과한 산업안전보건법 개정안과 철도 건설 부가세 영세율 폐지 등 규제 강화 움직임에 우려를 나타냈다. 그는 도시철도 공사의 부가세 영세율이 폐지되면 공사비가 8~10% 오를 수 있어 사업 자금조달에도 부담이 될 것이라고 지적했다. 중대재해가 연 3건 이상 발생한 기업에 영업이익의 최대 5%를 과징금으로 물리는 산안법 개정안에 대해서도 정부의 주택공급 확대 정책과 배치되고 중소 건설사의 존립을 위협할 수 있다고 비판했다. 한 회장은 \"건설산업을 둘러싼 여건이 녹록지 않은데 규제가 첩첩이 더해지고 있다\"며 정부의 규제 완화 검토를 촉구했다.","url":"https://news.mtn.co.kr/news-detail/2026102115581299482"},{"n":2,"title":"李 주택 공급 전격전에… 與 '모듈러 특별법' 드라이브","meta":"2026.10.22 00:39 · 서울신문","body":"이재명 대통령이 주택 공급 속도를 높이기 위해 모듈러 공법 전면 검토를 지시한 데 따라 더불어민주당이 '모듈러 특별법'을 하반기 핵심 입법 과제로 정했다. 국회 국토교통위원회는 다음 달 중 서너 차례 소위원회를 열어 법안을 논의할 계획이며, 신속한 공급이 필요한 공공임대주택 등에 모듈러 기술 적용을 확대하는 내용이 핵심이다. 모듈러 공법은 기존 공법보다 공사 기간을 20~30% 단축할 수 있는 것으로 평가되지만, 대량 입찰과 통합 조달 조항을 둘러싼 업계 조율이 더 필요한 상황이다.","url":"https://seoul.co.kr/news/politics/2026/10/22/20261022004006"}]},{"name":"시장동향","articles":[{"n":3,"title":"월세가 점령한 서울…'전세의 월세화' 외곽까지 확산","meta":"2026.10.21 23:25 · 서울신문","body":"올해 1~9월 서울 아파트 전월세 거래 중 월세 비중이 51.0%를 기록해 2011년 관련 통계 집계 이후 처음으로 전세를 넘어섰다. 같은 기간 전세 거래량은 27.4% 급감한 반면 월세 거래는 2.8% 감소에 그쳤고, 평균 월세는 166만1000원으로 1년 전보다 21만8000원 올랐다. 전세의 월세 전환 현상은 노원·도봉·강북 등 이른바 '노도강' 외곽 지역까지 번져 일부 전용 84㎡ 단지는 보증금 5000만원에 월세 315만원 수준까지 치솟았다. 대출 규제와 전세 매물 부족이 겹치며 세입자의 주거비 부담이 커지고 있다는 평가다.","url":"https://www.seoul.co.kr/news/economy/2026/10/21/20261021001005"},{"n":4,"title":"\"경기도 전세라도…\" 서울 전셋집 포기하려던 30대 '한숨'","meta":"2026.10.21 17:55 · 한국경제","body":"서울 아파트 평균 전셋값이 6억4100만원으로 4년 만에 최고치를 다시 썼고, 25개 자치구 중 13곳이 기존 최고가를 넘어섰다. 전·월세 매물이 1년 전보다 15.3% 줄면서 수급지수가 2021년 이후 최고 수준까지 치솟았고, 20·30대의 전·월세대출 잔액은 75조원으로 사상 최대를 기록했다. 내년 서울 아파트 입주물량이 올해보다 8% 줄어들 것으로 예상되면서 전세난이 당분간 이어질 것이라는 우려가 나온다. 서울 전셋값 급등 여파로 경기 광명·하남 등 일부 단지 전세가도 10억원을 넘어서고 있다.","url":"https://www.hankyung.com/article/2026102167471"}]},{"name":"정비사업","articles":[{"n":8,"title":"부진한 일산 1기 신도시 재건축…홍지선 장관 \"제도·행정 지원\"","meta":"2026.10.21 15:52 · 한국경제","body":"홍지선 국토교통부 장관이 21일 경기 고양 일산신도시를 찾아 노후계획도시 정비사업 추진 현황을 점검했다. 홍 장관은 일산의 선도지구 사업 추진 속도가 다른 1기 신도시보다 더디다고 지적하며 특별정비구역 지정 등 후속 절차에 속도를 내 달라고 당부했다. 정부는 기준 용적률 상향 등 제도 개선을 서두르는 한편, 1995년 준공된 영구임대주택인 흰돌마을4단지의 특별정비구역 지정도 내년 상반기 목표로 추진하기로 했다. 국토부는 고양특례시·LH와 협력해 제도적·행정적 지원을 강화하겠다고 밝혔다.","url":"https://www.hankyung.com/article/202610216318i"},{"n":9,"title":"연말 재건축 12조 '큰 장'…건설사 도시정비 수주 역대 최대 전망","meta":"2026.10.21 10:34 · 글로벌이코노믹","body":"연말까지 서울 목동·성수, 경기 광명 등 수도권 주요 재건축·재개발 사업장 11곳에서 총 12조6922억원 규모의 시공사 선정이 예정돼 있다. 현대건설과 삼성물산이 올해 누적 수주액에서 이미 지난해 연간 실적을 넘어섰으며, 추가 수주가 이어지면 주요 건설사의 누적 수주액 합계가 50조원을 돌파할 수 있다는 전망도 나온다. 다만 대형 건설사들의 선별 수주 전략으로 단독 입찰이 늘면서 조합의 공사비 협상력이 약화될 수 있다는 우려도 제기된다.","url":"https://www.g-enews.com/article/Real-Estate/2026/10/2026102110063695892aa6f4cdad_1"}]},{"name":"금융/세제","articles":[{"n":11,"title":"HUG, 공적보증 연 100조로 확대…주택공급 지원 강화","meta":"2026.10.21 08:13 · 서울경제","body":"주택도시보증공사(HUG)가 제4회 한국건설부동산산업대상 주택 부문에서 수상하며 주택 공적보증을 연간 100조원 규모로 확대하겠다고 밝혔다. HUG는 지방 시장 침체로 어려움을 겪는 중소·중견 건설사를 위한 임대보증 제도를 개선하고, 내년 5월까지 분양보증료를 30%, PF 연계 사업은 최대 60%까지 한시 할인하기로 했다. 서울 청년주택 사업 10곳, 약 2000가구에 대해서는 절차를 간소화해 공급 속도를 높이고, LH와 협력해 공공주택 공급의 금융 비용도 낮추기로 했다.","url":"https://www.sedaily.com/article/20104086"},{"n":12,"title":"청년층 주담대 충분히 못 받아…LTV 하락","meta":"2026.10.21 18:00 · 서울경제","body":"올해 8월까지 19~39세 청년층의 평균 주택담보대출 승인액은 1년 전보다 약 7% 늘었지만, 주택 가격 대비 대출 비율(LTV)은 58.7%에서 56.2%로 2.5%포인트 떨어져 2022년 이후 처음으로 하락했다. 은행권 관계자는 LTV 하락이 청년층이 주택 구입에 충분한 대출을 받지 못하고 있다는 신호라며 자금 부담이 커지고 있다고 설명했다. 집값 상승과 대출 규제 강화, 청년층 내 소득 양극화가 겹치며 고소득 청년은 큰 대출을 받는 반면 저소득 청년은 대출 문턱에 막히는 현상이 뚜렷해지고 있다.","url":"https://www.sedaily.com/article/20104492"}]},{"name":"임대주택","articles":[{"n":13,"title":"김이탁 국토교통부 제1차관, \"행복기숙사 지속 공급 확대\" 강조","meta":"2026.10.21 17:32 · 중부뉴스통신","body":"김이탁 국토교통부 제1차관이 인천 계양구 경인여대에서 열린 행복기숙사 '루디아 하우스' 개관식에 참석해 청년 주거비 부담 완화 의지를 밝혔다. 행복기숙사 사업은 통학이 어려운 대학생을 위해 주택도시기금을 연 1.5% 저리로 한국사학진흥재단에 융자해 저렴한 기숙사를 짓는 사업이다. 2012년 이후 80개 사업에 1조614억원이 지원돼 5만명 이상의 대학생에게 거처를 제공했으며, 국토부는 행복기숙사와 함께 공유형 청년주택도 확대 공급할 계획이다.","url":"https://www.jungbunews.com/news/articleView.html?idxno=2769438"}]},{"name":"택지/도시개발","articles":[{"n":14,"title":"대통령이 주문한 3기 신도시 고밀화…공급 확대 기대 속 '인프라' 숙제","meta":"2026.10.21 15:38 · 데일리안","body":"정부가 3기 신도시 평균 용적률을 기존 206%에서 250% 이상으로 높여 주택 공급 물량을 늘리는 방안을 추진 중이다. 이재명 대통령은 인천 계양 3기 신도시를 찾아 공급 확대와 사업 속도 개선을 지시했다. 전문가들은 공급 증가가 시장 안정에 도움이 될 것으로 평가하면서도 GTX·지하철 등 광역교통망 조기 완성과 상하수도·학교 등 생활 인프라 재계획이 함께 이뤄져야 한다고 지적한다.","url":"https://www.dailian.co.kr/news/view/1704213/%EB%8C%80%ED%86%B5%EB%A0%B9-%EC%A3%BC%EB%AC%B8%ED%95%9C-3%EA%B8%B0-%EC%8B%A0%EB%8F%84%EC%8B%9C-%EA%B3%A0%EB%B0%80%ED%99%94%EA%B3%B5%EA%B8%89-2026"},{"n":15,"title":"모듈러주택 활성화…LH, 2030년까지 1.6만가구 발주","meta":"2026.10.21 17:21 · 데일리안","body":"한국토지주택공사(LH)가 2030년까지 모듈러주택 1만6000가구를 발주하겠다고 밝혔다. 올해는 애초 목표(2000가구)를 넘어선 2100가구를 발주할 예정이며, 고양창릉·남양주왕숙2·포천송우 등에서 모듈러 공법을 적용한 사업을 추진한다. 2027~2030년에는 매년 3000가구 이상, 총 1만4000가구를 단계적으로 발주할 계획이다. LH는 이날 모듈러 제조사와 삼성전자·LG전자 등 가전기업, 학계 전문가와 간담회를 열어 'AI 모듈러 홈' 구현 방안도 논의했다.","url":"https://www.dailian.co.kr/news/view/1704289"}]},{"name":"주택품질/안전","articles":[{"n":16,"title":"리모델링 150곳서 활발… 직권조사 도입해 조합 감시 강화","meta":"2026.10.21 18:25 · 파이낸셜뉴스","body":"개정된 주택법에 따라 내년 3월 9일부터 아파트 리모델링 조합도 국토교통부와 지방자치단체의 직권조사 대상에 포함된다. 그동안 재개발·재건축 조합만 직권조사 대상이었으나, 법 개정으로 공무원과 전문가로 구성된 점검반이 현장조사를 벌여 위법사항 시정요구나 수사기관 고발 등의 조치를 할 수 있는 법적 근거가 마련됐다. 현재 전국 150개 단지, 약 12만가구에서 리모델링이 추진되고 있으며 이 가운데 서울이 82개 단지로 절반 이상을 차지해 조합 운영 투명성 강화가 시급하다는 지적이 나온다.","url":"https://www.fnnews.com/news/202610211825255967"}]},{"name":"분양정보","articles":[{"n":17,"title":"\"분양가 지금이 가장 싸다\"…청약·정책대출 문 두드려라","meta":"2026.10.21 15:58 · 한국경제","body":"서울 아파트값이 88주 연속 오르는 가운데 전세가격도 함께 뛰면서 내 집 마련을 미루던 실수요자들이 매수로 돌아서고 있다. 경기권도 최근 5년 내 가장 가파른 주간 상승률(0.26%)을 나타냈으며 분당구 등 남부권 상승세가 두드러졌다. 전문가들은 신규 아파트 청약과 정부 정책대출, 공공분양 등을 자금 여력과 시기에 맞춰 전략적으로 조합할 것을 권하며, 디딤돌대출 등 연 2%대 저리 정책대출 활용을 강조했다.","url":"https://hankyung.com/article/2026102152621"},{"n":18,"title":"반도건설, 3기 신도시 '계양신도시 카이브 유보라·시간' 23일 견본주택 개관","meta":"2026.10.21 10:48 · 파이낸셜뉴스","body":"반도건설이 10월 23일 경기 부천시에서 계양신도시 첫 민간분양 단지인 '카이브 유보라'와 상업시설 '시간'의 견본주택을 개관한다. 이 단지는 AC3·AC4블록에 걸쳐 전용 84~93㎡, 총 1110가구 규모로 공급되며 지하철 박촌역과 인접하고 김포공항역까지 3정거장 거리라는 입지를 강조하고 있다. 입주는 2029년 8월로 예정돼 있으며 청약은 11월 2~4일 진행된다.","url":"https://www.fnnews.com/news/202610211014122391"}]},{"name":"논설/사설","articles":[{"n":20,"title":"[사설] 李 \"주택 공급 전격전\"…병목 풀어낼 실행력이 관건","meta":"2026.10.21 11:07 · 헤럴드경제","body":"이재명 대통령이 주택 공급 확대를 정권의 핵심 과제로 내세우며 기존 관행과 절차에 얽매이지 말고 인허가·착공 기간을 대폭 단축하라고 주문했다. 사설은 과거 3기 신도시가 계획 발표 후 첫 입주까지 8년이 걸렸던 점을 지적하며, 절차적 병목 해소와 건설사 참여를 이끌 유인책 마련이 필수적이라고 짚는다. 말이 아닌 실제 성공 사례로 시장의 신뢰를 얻어야 한다고 평가한다.","url":"https://biz.heraldcorp.com/article/10909779"}]}]},{"date":"2026-10-21","count":15,"pdf_count":15,"highlights":[{"n":1,"text":"李대통령 \"관행·절차 얽매이지 말고 주택공급 전격전 펼치길\""},{"n":2,"text":"수도권 주택사업경기 전망, 3개월 만에 기준선 회복"},{"n":4,"text":"삼성물산, 여의도 시범 재건축 수주…정비사업 누적 10조 고지"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"李대통령 \"관행·절차 얽매이지 말고 주택공급 전격전 펼치길\"","meta":"2026.10.20 10:10 · 한국경제","body":"이재명 대통령이 20일 청와대 국무회의에서 주택 공급 정책과 관련해 기존의 관행과 절차에 얽매이지 말라고 지시했다. 이 대통령은 단순히 공급 계획을 발표하는 데 그치지 않고 실제 착공과 입주로 이어지는 성과를 내야 한다고 말했다. 택지 조성부터 인허가, 착공까지 걸리는 기간을 최대한 단축해 \"주택공급 전격전\"을 펼쳐달라고 주문했다. 국민이 체감할 수 있는 주거 안정이 국정 성패를 좌우한다는 점도 강조했다.","url":"https://www.hankyung.com/article/2026102026667"}]},{"name":"시장동향","articles":[{"n":2,"title":"수도권 주택사업경기 전망, 3개월 만에 기준선 회복","meta":"2026.10.20 17:26 · 센머니","body":"주택산업연구원 조사 결과 10월 수도권 주택사업경기전망지수가 100.2로 집계돼 전월(89.2)보다 11.0포인트 올랐다. 기준선인 100을 넘은 것은 지난 7월(101.6) 이후 3개월 만으로, 100을 넘으면 경기를 긍정적으로 보는 응답이 더 많다는 의미다. 서울이 97.2에서 110.0으로 12.8포인트 급등하며 상승을 주도했고 인천과 경기도 각각 오름세를 보였다. 서울 외곽과 경기 일부 지역의 집값 상승세가 주택사업자들의 기대감을 끌어올린 것으로 분석된다.","url":"https://www.senmoney.co.kr/news/articleView.html?idxno=38030"},{"n":3,"title":"서울 중저가 아파트 거래 비중 22%…1년새 5%P↑","meta":"2026.10.20 17:36 · 머니투데이방송(MTN)","body":"올해 1~3분기 서울에서 6억원 미만 아파트 매매 거래 비중이 21.9%로 지난해 같은 기간보다 5.0%포인트 높아진 것으로 나타났다. 분기별로도 1분기 21.3%, 2분기 20.5%, 3분기 25.4%로 비중이 꾸준히 확대됐다. 서울 전역이 규제지역으로 묶이고 주택담보대출 한도가 차등 적용되면서 생애최초 매수자 등 정책대출을 활용한 실수요층이 저가 주택으로 몰린 영향으로 풀이된다. 반면 올해 남부권 중심으로 집값이 크게 오른 경기도는 같은 기간 6억원 미만 거래 비중이 1.3%포인트 줄어든 60.0%를 기록해 대조를 이뤘다.","url":"https://news.mtn.co.kr/article/2026102017043717116"}]},{"name":"정비사업","articles":[{"n":4,"title":"삼성물산, 여의도 시범 재건축 수주…정비사업 누적 10조 고지","meta":"2026.10.20 11:05 · 한국금융신문","body":"삼성물산 건설부문이 서울 영등포구 여의도 시범아파트 재건축 사업의 시공사로 선정됐다. 공사 예정금액은 약 2조2685억원으로, 이번 수주로 삼성물산의 올해 도시정비사업 누적 수주액은 9조6055억원에 달해 지난해 연간 수주액(9조2388억원)을 이미 넘어섰다. 삼성물산은 여의도에서만 세 곳의 재건축 사업장을 확보해 래미안 브랜드로 한강 조망 세대를 늘릴 계획이다. 목동13단지, 창원 용호1구역 등을 추가 수주하면 누적액이 12조원을 넘어설 수 있어 연간 목표인 13조원 달성 여부에 업계 관심이 쏠린다.","url":"https://www.fntimes.com/html/view.php?ud=202610201053468566b372994c95_18"},{"n":5,"title":"서울 아파트 착공 10가구 중 8가구는 재개발·재건축","meta":"2026.10.20 18:31 · 파이낸셜뉴스","body":"올해 1~8월 서울 아파트 착공 물량 1만5654가구 중 1만2445가구(79.5%)가 재개발·재건축 등 정비사업으로 이뤄진 것으로 나타났다. 서울 내 신규 가용 부지가 부족한 상태에서 정비사업 외에는 실질적인 공급 대안이 마땅치 않다는 게 전문가들의 지적이다. 갈현1구역(4467가구), 한남3구역(5970가구) 등 대규모 사업이 착공 물량을 주도하고 있다. 정부가 추진하는 공급 확대 정책의 실효성에 대해서도 의문이 제기된다.","url":"https://fnnews.com/news/202610201831102627"},{"n":6,"title":"목동·성수·광명서 연내 12조 규모 재건축 시공사 선정 줄줄이","meta":"2026.10.20 18:01 · 한국경제","body":"서울 목동과 성수, 경기 광명 등에서 연내 시공사 선정이 예상되는 주요 정비사업이 11곳, 총 12조6922억원 규모에 달하는 것으로 집계됐다. 이 가운데 목동 일대가 5조2000억원으로 전체의 42%를 차지하며, 목동13단지(삼성물산), 목동12단지(GS건설), 목동8단지(대우건설) 등이 각각 사업을 추진 중이다. 성수2지구와 광명 지역 사업장도 대형 건설사들의 수주 경쟁 대상으로 꼽힌다. 이번 시공사 선정 결과에 따라 국내 10대 건설사의 올해 도시정비사업 수주 순위도 요동칠 전망이다.","url":"https://www.hankyung.com/article/2026102039611"}]},{"name":"금융/세제","articles":[{"n":7,"title":"\"거주도 못 하는데 재산세까지?\"…서울시의회, 리모델링 세제 개선 촉구","meta":"2026.10.20 09:36 · 글로벌이코노믹","body":"서울시의회 김지훈 의원이 노후 공동주택 리모델링 공사 기간에 재산세를 면제해달라는 내용의 건의안을 발의했다. 현행 제도에서는 재건축·재개발은 철거가 완료돼 건축물이 사실상 사라진 것으로 인정되면 주택분 재산세가 면제되지만, 리모델링은 골조를 유지한다는 이유로 조합원 전원이 이주해 실거주가 불가능한 기간에도 재산세가 그대로 부과된다. 현재 서울 내 리모델링 추진 단지는 약 78곳, 4만7000호 규모로 공사비와 금리 인상까지 겹쳐 주민 부담이 커지고 있다. 건의안은 정부를 향해 지방세법 시행령을 개정해 이주 완료 후 공사 기간을 재산세 비과세 대상에 포함할 것을 촉구하는 내용을 담았다.","url":"https://www.g-enews.com/article/General-News/2026/10/20261020093202841720ae620e86_1"},{"n":8,"title":"재건축 조합장이 제안한 재초환 부담금 산정 개선안 눈길","meta":"2026.10.20 09:19 · 위클리한국주택경제신문","body":"대구 범어우방1차 재건축조합의 박선용 조합장이 재건축초과이익환수제(재초환) 부담금 산정방식 개선안을 국토교통부와 국회에 제출했다. 조합이 전국 5개 재건축 사업장 자료를 분석한 결과 행정구역 전체 평균값을 쓰는 현행 방식이 개별 사업장의 주택시장 변화를 제대로 반영하지 못하는 것으로 나타났다. 실제로 서울 반포현대의 경우 현행 적용 상승률은 22.148%인데 실거래가격지수 상승률은 88.983%로 큰 차이를 보였다. 조합은 공동주택 실거래가격지수나 인근 유사단지 가격 변화 등을 보완지표로 도입해 시행령과 업무지침을 개선해달라고 요청했다.","url":"https://www.arunews.com/news/articleView.html?idxno=68292"}]},{"name":"임대주택","articles":[{"n":9,"title":"민간임대주택 관리비 신고 의무화…임대 조건 공개 확대","meta":"2026.10.20 16:16 · 이투데이","body":"국토교통부는 20일 국무회의에서 민간임대주택에 관한 특별법 시행령 개정안이 의결됐다고 밝혔다. 앞으로 임대사업자는 임대차계약을 신고할 때 임대료뿐 아니라 관리비와 사용료도 함께 신고해야 하며, 지자체는 이 같은 임대 조건을 공보와 누리집에 공고한다. 시도는 100가구 이상 민간임대주택단지의 임대료 증액 비율을 조례로 별도 규정할 수 있게 된다. 신고 누락 등 경미한 의무 위반에 대한 과태료는 완화되며, 개정안은 공포 후 6개월 뒤부터 시행된다.","url":"https://www.etoday.co.kr/news/view/2637767"}]},{"name":"택지/도시개발","articles":[{"n":10,"title":"李 \"3기 신도시 하루라도 당겨야\"…인천 계양 현장서 속도전 지시","meta":"2026.10.20 17:43 · 한국경제","body":"이재명 대통령이 20일 3기 신도시 가운데 처음으로 입주를 앞둔 인천 계양 공공주택지구를 찾아 택지 조성부터 인허가, 착공까지의 기간을 최대한 단축하라고 지시했다. 이 대통령은 \"3기 신도시의 신속한 주택 공급이 부동산 정책의 성패를 가르는 분기점\"이라며 중요한 것은 속도라고 강조했다. 보상 절차를 끝낸 뒤에도 버티는 토지주로 인해 사업이 지연되는 상황을 막기 위한 법 정비 필요성도 거론했다. 정부와 LH는 2030년까지 3기 신도시 공공주택 물량의 90%를 착공한다는 목표이며, 인천 계양에서는 오는 12월 공공분양과 신혼희망타운 등 1285가구가 3기 신도시 중 처음으로 입주한다.","url":"https://www.hankyung.com/article/2026102041041"}]},{"name":"주택품질/안전","articles":[{"n":11,"title":"송도 신축 아파트, 테라스 붕괴 이어 100여 세대 침수 피해","meta":"2026.10.20 16:06 · 더퍼블릭","body":"인천 송도 럭스오션SK뷰 아파트에서 지난 18일 내린 비로 100여 가구가 침수 피해를 입었다. 이 단지는 SK에코플랜트가 시공한 1114가구 규모로, 지난 8월에는 한 세대의 테라스 구조물과 외장재가 붕괴해 떨어지는 사고도 있었다. 입주민들은 창호 설계·시공 불량을 지적하며 2년 가까이 보수를 거듭해도 누수 문제가 해결되지 않았다고 주장했다. 사용승인 후 1년여 만에 접수된 하자만 5만7000건이 넘는 것으로 나타났으며, 국토교통부와 인천시는 공동 사고조사위원회를 꾸려 다음 달 20일까지 원인 규명에 나섰다.","url":"https://www.thepublic.kr/news/articleView.html?idxno=322914"},{"n":12,"title":"DL이앤씨, 4년 연속 아파트 하자판정 '제로' 달성","meta":"2026.10.20 17:48 · 서울경제","body":"DL이앤씨가 2026 건설부동산산업대상 건축 부문 대상을 받았다. 국토교통부 하자심사분쟁조정위원회 기준으로 2023년부터 2026년 2월까지 4년 연속 하자판정 '제로'를 달성했다. 회사는 시공 전 교육, 30개 필수 점검항목, 24개 핵심 품질점검, 데이터 분석으로 이어지는 4단계 품질관리 체계를 운영하며, 2022년 국내 건설사 최초로 데이터 플랫폼 팔란티어를 도입해 기획·설계·시공·유지관리 전 단계에 AI 분석을 적용하고 있다. 고급 주거 브랜드 '아크로'는 1만6048명을 대상으로 한 설문에서 46.1%의 선택을 받아 6년 연속 고급 아파트 선호도 1위에 올랐다.","url":"https://sedaily.com/article/20103937"}]},{"name":"분양정보","articles":[{"n":13,"title":"부산·평택·인천, 수십조 개발사업 배후로 아파트 분양 쏟아진다","meta":"2026.10.20 18:33 · 파이낸셜뉴스","body":"부산 북항, 평택 삼성전자 반도체 캠퍼스, 인천 계양신도시 등 수십조 원 규모 개발사업이 진행 중인 지역 인근에서 신규 아파트 분양이 잇따르고 있다. 20조원 규모로 복합도심 전환이 추진되는 부산 북항 인근에서는 호반건설이 11월 '호반써밋 초량'(432가구) 분양을 앞두고 있다. 60조원 규모 반도체 시설 확충이 진행 중인 평택에서는 한화건설이 '한화포레나 지제역'(1098가구) 공급을 계획하고 있으며, 약 1만8000가구 규모로 조성되는 인천 계양신도시에서는 반도건설이 '계양신도시 카이브 유보라'(1110가구) 분양을 추진한다.","url":"https://www.fnnews.com/news/202610201833207719"},{"n":14,"title":"'용인반도체 라온프라이빗' 564가구 분양","meta":"2026.10.20 18:00 · 한국경제","body":"라온이 경기 용인시에 지상 20층, 7개동, 564가구 규모의 '용인반도체 라온프라이빗'을 선보인다. 단지는 보행자 중심 설계와 중앙 잔디광장을 갖췄으며, 분양가 상한제 적용 대상으로 SK하이닉스 반도체 생산시설과 가깝다는 입지가 강점으로 꼽힌다. 라온은 같은 시기 서울 중랑구에서도 아파트 176가구와 오피스텔 74실로 구성된 별도 단지를 선보이며, 지하철과 향후 개통 예정인 GTX-B 노선 접근성을 내세우고 있다.","url":"https://hankyung.com/article/2026102039531"}]},{"name":"논설/사설","articles":[{"n":15,"title":"[사설] 李 \"공급 전격전\"…전월세난 키운 '토허제'도 손볼 때다","meta":"2026.10.21 00:07 · 서울경제","body":"이재명 대통령이 국무회의에서 기존의 관행과 절차에 얽매이지 말라며 주택 공급 가속화를 지시한 데 대해, 사설은 정부가 2030년까지 수도권에 150만 가구 착공을 목표로 하면서도 최근 5년간 인허가를 받은 공공분양의 66%가 아직 착공하지 못한 현실을 지적했다. 공급 확대 의지만으로는 부족하며 토지거래허가제(토허제) 재검토가 함께 이뤄져야 한다고 주장한다. 현재 서울 전역과 경기 15곳이 토허구역으로 지정돼 있는데, 이것이 임대 매물 공급을 제약해 전월세난을 악화시키고 있다는 것이다. 서울시장과 경기도지사도 토허제 해제를 촉구한 만큼 정부가 이제는 응답할 때라고 강조했다.","url":"https://m.sedaily.com/article/20104010"}]}]},{"date":"2026-10-20","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"李대통령 \"부동산, 2028년 넘어서부터 공급 정상화될 것\""},{"n":4,"text":"정부는 '안정론', 시장은 '상승세'...서울 집값 어디로"},{"n":8,"text":"현대건설, 목동10단지 재건축 수주...목동 첫 '디에이치'"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"李대통령 \"부동산, 2028년 넘어서부터 공급 정상화될 것\"","meta":"2026.10.19 17:53 · 머니투데이","body":"이재명 대통령은 19일 부동산 공급이 2028년 이후부터 정상화될 것이라고 밝혔다. 그는 \"부동산을 방치하면 언젠가는 사고가 난다\"며 공급 감소에 따른 시장 충격에 대비해야 한다고 말했다. 집값을 잡으려고 세금을 올렸다거나 세수 확보를 노린 것이라는 주장은 사실이 아니라고 선을 그었다. 공급이 줄며 시장이 이를 감당하지 못하는 상황이 전월세 불안의 근본 원인이라는 설명이다.","url":"https://www.mt.co.kr/politics/2026/10/19/2026101917525542249"},{"n":2,"title":"김은혜 \"10·15 대책에 경기 집값 최대 20% 급등\"...추미애 \"해제 건의\"","meta":"2026.10.19 19:07 · 뉴스1","body":"국회 국토교통위원회의 경기도 국정감사에서 국민의힘 김은혜 의원이 10·15 부동산 대책 시행 1년 만에 경기도 아파트값이 평균 6.6%, 규제지역 12곳 중 11곳은 최대 20% 넘게 올랐다고 지적했다. 전세 매물도 지난해 2만853건에서 올해 1만2328건으로 반토막 났다며 규제 해제를 건의해야 한다고 주장했다. 추미애 경기도지사는 토지거래허가제가 투기 수요 억제에는 도움이 되지만 가격 상승을 누르는 효과는 제한적이라며, 남양주·광주 등 일부 지역은 연말 이후 해제를 정부에 건의하고 있다고 답했다.","url":"https://www.news1.kr/local/gyeonggi/6324901"}]},{"name":"시장동향","articles":[{"n":4,"title":"정부는 '안정론', 시장은 '상승세'...서울 집값 어디로","meta":"2026.10.19 14:18 · 핀포인트뉴스","body":"서울 아파트값은 지난해 2월부터 88주 연속 상승을 이어가고 있지만 지역별 온도차는 더 커지고 있다. 강남·서초·송파 등 강남3구는 하락세를 이어가는 반면, 중랑구(0.42%)와 성북구(0.41%) 등 외곽 지역은 오히려 상승폭이 확대됐다. 정부는 3~8월 주택 인허가 물량이 전년 대비 74% 늘었고 매물도 30% 증가했다며 시장 안정을 전망했다. 하지만 실제로는 강남권의 하락세가 서울 전역으로 확산되지 않고 있어 정부 진단과 시장 체감 사이의 온도차가 이어지고 있다.","url":"https://www.pinpointnews.co.kr/news/articleView.html?idxno=496506"},{"n":5,"title":"3개월 만에 규제 약발 '뚝'...동탄·기흥·구리 집값 다시 들썩","meta":"2026.10.20 07:17 · 데일리안","body":"정부가 지난 6월 경기 구리, 화성 동탄, 용인 기흥을 규제지역으로 지정한 지 3개월여 만에 세 지역 모두 아파트값 상승폭이 다시 확대되고 있다. 10월 둘째 주 기준 구리 아파트값은 전주 대비 0.43% 올라 토지거래허가구역 지정 이후 14주 만에 최고 상승률을 기록했고, 화성 동탄구도 0.66% 올라 7월 둘째 주 이후 가장 높은 상승률을 보였다. 거래량은 급감했지만 가격은 계속 오르는 상황으로, 전세 매물 부족에 따른 매수 전환 수요와 인접 지역으로의 풍선효과가 원인으로 지목된다.","url":"https://www.dailian.co.kr/news/view/1703156/3%EA%B0%9C%EC%9B%94-%EB%A7%8C%EC%97%90-%EA%B7%9C%EC%A0%9C-%EC%95%BD%EB%B0%9C-%E2%80%98%EB%9A%9D%E2%80%99%EB%8F%99%ED%83%84%EA%B8%B0%ED%9D%A5-2026"}]},{"name":"정비사업","articles":[{"n":8,"title":"현대건설, 목동10단지 재건축 수주...목동 첫 '디에이치'","meta":"2026.10.19 12:32 · 한국경제","body":"현대건설이 목동10단지 재건축 시공사로 최종 선정됐다. 기존 2160가구를 최고 40층, 총 4248가구 규모로 재건축하는 사업으로 공사비는 약 2조6136억원이다. 현대건설은 하이엔드 주거 브랜드 '디에이치'를 목동에 처음 적용해 '디에이치 목동 에세르'로 이름 짓기로 했으며, 이번 수주로 목동신시가지 14개 단지 중 처음으로 재건축 시공권을 확보했다. 현대건설의 올해 도시정비 누적 수주액은 12조7315억원을 기록했다.","url":"https://www.hankyung.com/article/2026101905136"},{"n":9,"title":"삼성물산, 여의도 시범아파트 재건축 수주...'래미안 소넬리'로","meta":"2026.10.19 17:29 · 한국경제","body":"삼성물산이 여의도 시범아파트 재건축 시공사로 선정돼 2조2685억원 규모 사업을 수주했다. 한국자산신탁이 사업시행자인 이 사업은 지하 6층~지상 최고 59층, 18개동, 총 2480가구 규모로 조성되며, 삼성물산은 새 단지명으로 '래미안 소넬리'를 제안했다. 글로벌 건축설계사 OMA와 협업해 기존 21개동의 격자형 배치를 18개동으로 줄이고, 한강 조망 세대를 기존 1616세대에서 2032세대로 늘렸다. 1971년 준공돼 국내 고층 주거문화의 효시로 꼽히는 여의도 시범아파트가 반세기 만에 새로운 랜드마크로 탈바꿈하게 됐다.","url":"https://www.hankyung.com/article/2026101913681"}]},{"name":"금융/세제","articles":[{"n":11,"title":"이찬진 금감원장 \"가계대출 총량규제, 직접적 규제 조항 없다\"","meta":"2026.10.19 17:34 · 뉴스핌","body":"19일 국정감사에서 국민의힘 조정훈 의원은 금융감독원의 가계대출 총량규제가 법적 근거 없는 월권행위라고 지적했다. 이찬진 금융감독원장은 \"직접적인 규제 조항은 없는 것 같다\"고 답했다. 금융위원회도 법적 근거가 없으며 은행이 자율적으로 설정하는 것이라고 답변했으나, 조 의원은 당국이 사실상 은행에 지시를 내리는 것 아니냐며 강하게 문제를 제기했다.","url":"https://www.newspim.com/news/view/20261019001404"},{"n":12,"title":"해킹 사태에 가계부채까지...국감 출석한 5대 은행장 '진땀'","meta":"2026.10.19 17:50 · 데일리안","body":"KB국민·신한·하나·우리·NH농협 등 5대 은행장이 19일 국회 정무위원회 국정감사에 출석해 최근 발생한 해킹 보안 사고에 대해 사과했다. 여야 의원들은 \"첫 침입 후 최종 확인까지 80시간\"이 걸린 늑장 대응을 질타했고, 가산금리 인하 경쟁에 따른 풍선효과와 구두 지시로 이뤄지는 비공식적 가계대출 총량 규제도 도마에 올랐다. 금융지주의 폐쇄적 지배구조와 경영진의 '셀프 정년 연장' 의혹도 집중 추궁됐다.","url":"https://dailian.co.kr/news/view/1703342/2026-%EA%B5%AD%EA%B0%90-%EB%B3%B4%EC%95%88-%EA%B5%AC%EB%A9%8D-%EA%B0%80%EA%B3%84%EB%B6%80%EC%B1%84%EA%B9%8C%EC%A7%80-2026"}]},{"name":"임대주택","articles":[{"n":13,"title":"전월세 불안에 '양도세 카드'...이형일 \"임대아파트 공공 매각 땐 추가 감면 검토\"","meta":"2026.10.19 10:00 · 뉴스핌","body":"이형일 부총리 겸 기획재정부 장관은 조정대상지역 매입임대아파트를 한국토지주택공사 등 공공부문에 매각할 경우 양도소득세를 추가 감면하는 방안을 검토 중이라고 밝혔다. 임대사업자의 매각 어려움과 세입자의 전월세 불안을 동시에 해소하려는 취지다. 임대 등록이 자동으로 말소되는 물량은 6만3000호에 달하며, 구체적인 감면 폭과 매입 대상 기관은 추후 결정될 예정이다.","url":"https://www.newspim.com/news/view/20261019000219"},{"n":14,"title":"경기 GH, 전세사기 피해자 예방 교육...보증금 회수 절차 안내","meta":"2026.10.19 13:38 · 중도일보","body":"경기주택도시공사(GH)가 운영하는 경기도 전세피해 및 예방지원센터가 19일 안산문화재단에서 올해 마지막 순회 전세사기 피해 예방 교육을 열었다. 센터는 올해 네 차례에 걸쳐 전세사기 피해자 500여 명을 대상으로 법률교육을 진행했으며, 이번 교육에서는 소송·강제집행부터 경·공매 절차, 배당표 분석까지 보증금 회수에 필요한 법률 지식을 안내했다. 다만 교육 참여 인원만으로 실제 피해 회복 정도를 판단하기는 어려우며, 계약 단계의 위험 감소와 사후 지원 연계까지 종합적으로 이뤄져야 한다는 지적도 나온다.","url":"https://www.joongdo.co.kr/web/view.php?key=20261019010005120"}]},{"name":"택지/도시개발","articles":[{"n":15,"title":"용산공원 빗장 풀리나...여권發 '주택용지 활용' 입법 봇물","meta":"2026.10.19 18:27 · 파이낸셜뉴스","body":"국토교통부와 서울시의 협의가 교착 상태에 빠진 가운데, 여당 의원들이 용산공원 본체 부지 일부를 주택용지로 활용하는 법안을 잇따라 발의하고 있다. 김남근·박민규 의원은 공원 조성 대상에서 일부 부지를 제외하거나 택지로 활용하는 용산공원 특별법 개정안을 각각 대표 발의했고, 차규근 의원도 지난 8월 비슷한 안을 내놓았다. 그러나 오세훈 서울시장은 토양 오염 정화에만 최소 3~7년이 걸린다며 반대 입장을 유지하고 있어, 2007년 제정된 특별법의 '공원 외 용도 금지' 원칙이 실제로 깨질지는 미지수다.","url":"https://www.fnnews.com/news/202610191827531737"},{"n":16,"title":"하남시의장 \"교산신도시 입주 전 교통대책 마련해야\"","meta":"2026.10.19 16:48 · 아시아투데이","body":"하남시의회 정병용 의장이 19일 하남 교산신도시 A2블록 입주예정자들과 간담회를 열었다. 이 자리에서는 교통 혼잡, 대중교통 접근성, 자녀 전학 문제 등이 주요 논의 사항으로 다뤄졌다. 정 의장은 주택 공급과 교통 인프라 조성이 균형 있게 추진돼야 한다며 입주 전 교통대책 마련의 필요성을 강조했다.","url":"https://www.asiatoday.co.kr/kn/view.php?key=20261019010006089"}]},{"name":"주택품질/안전","articles":[{"n":17,"title":"\"10억짜리 집 맞아?\"...발코니 붕괴 아파트, 이번엔 물난리","meta":"2026.10.20 05:42 · 이데일리","body":"지난 8월 발코니 구조물 붕괴 사고가 있었던 인천 송도국제도시 럭스오션SK뷰 아파트에서 폭우로 100여 가구가 침수 피해를 입었다. 입주민들은 창문을 닫아도 빗물이 유입됐다며 창호 설계나 시공 과정의 문제를 의심하고 있다. 2025년 3월 입주를 시작한 이 신축 아파트는 SK에코플랜트가 시공했으며, 누수 문제가 수차례 보수에도 해결되지 않아 왔다고 입주민들은 주장한다. 국토교통부와 인천시는 발코니 붕괴 사고 원인 규명을 위한 합동 사고조사위원회를 구성해 조사를 진행 중이다.","url":"https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=01935206645614888"}]},{"name":"분양정보","articles":[{"n":18,"title":"'산곡역자이힐스테이트&하늘채', 19일 특별공급 시작으로 청약 돌입","meta":"2026.10.19 15:11 · 헤럴드경제","body":"GS건설·현대건설·코오롱글로벌 컨소시엄이 공급하는 인천 부평구 산곡동의 '산곡역자이힐스테이트&하늘채'가 19일 특별공급을 시작으로 청약 일정에 들어갔다. 지하 3층~지상 최고 33층, 20개동, 총 2706가구 규모의 대단지로 지하철 7호선 산곡역 인근 역세권 입지를 갖췄다. 계약자에게는 인덕션, 시스템에어컨, 식기세척기 등을 무상 제공하며, 입주는 2029년 12월 예정이다. 견본주택은 개관 나흘 만에 약 2만7000명이 방문할 정도로 수요자 관심이 높았다.","url":"https://biz.heraldcorp.com/article/10907420"}]},{"name":"논설/사설","articles":[{"n":20,"title":"[사설] '전국적인 전세난?' 국토부의 이상한 진단","meta":"2026.10.20 04:01 · 머니투데이","body":"국토교통부가 최근 전·월세난을 공급 부족에 따른 전국적 현상이라고 진단한 데 대해, 이 사설은 10·15 부동산 대책의 부작용을 외면하는 처사라고 지적한다. 국토부는 지방 4대 광역시 아파트 전월세 매물이 1년 전보다 33% 감소한 점을 근거로 들었지만, 실제로는 규제지역 내 임대사업자들이 세입자를 내보내고 보유 주택을 매물로 내놓은 것이 더 근본적인 원인이라고 반박한다. 서울 아파트 전셋값은 10·15 대책 이후 1년간 가파르게 올랐고 전세 매물도 크게 줄어든 상태다. 사설은 신규 주택 공급 확대와 함께 규제 완화 등 명확한 해법을 제시하는 것이 시급하다고 주문한다.","url":"https://www.mt.co.kr/opinion/2026/10/20/2026101915295542020"}]}]},{"date":"2026-10-19","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"국토부, 月 2회 주택 공급 브리핑 하기로…올해 23만호 첫 삽 뜬다"},{"n":3,"text":"국토부 \"강남 집값 떨어지고 매물 쌓여…시장 하향 안정 신호\""},{"n":7,"text":"[단독] 여의도 '래미안 벨트' 윤곽…삼성물산, 2.2조 시범아파트 재건축 시공사 선정"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"국토부, 月 2회 주택 공급 브리핑 하기로…올해 23만호 첫 삽 뜬다","meta":"2026.10.16 16:00 · 뉴데일리","body":"국토교통부가 이달부터 매월 2회 주택 공급 정례 브리핑을 실시하기로 했다. 10월 둘째 주 기준 수도권에서 3기 신도시 7300호를 포함해 총 9만9000호가 착공했으며, 연말까지 21만8000~23만5000호 착공을 목표로 한다. 공공분양은 3기 신도시 2000호를 포함해 1만호, 공공임대는 5000호 이상 입주자를 모집할 계획이다. 국토부는 매월 브리핑을 통해 착공·분양·입주 실적과 향후 공급 계획을 공개해 시장 예측 가능성을 높이겠다고 밝혔다.","url":"https://biz.newdaily.co.kr/site/data/html/2026/10/16/2026101600185.html"},{"n":2,"title":"김이탁 국토차관·김성보 서울시 부시장부터 회동…정비사업 완화·주택공급 협의 재개","meta":"2026.10.16 11:22 · 헤럴드경제","body":"국토교통부와 서울시가 국정감사 종료 후 김이탁 국토1차관과 김성보 서울시 부시장 간 회동을 시작으로 정비사업 규제완화·주택공급 협의를 재개했다. 서울시는 민간 정비사업 용적률 완화, 조합원 지위 양도 제한 완화, 임대주택 의무비율 완화 등을 국토부에 요구할 방침이다. 다만 용산공원 부지를 주택공급 후보지로 활용하는 방안을 두고는 입장이 엇갈린다. 국토부는 미군 반환 부지 활용을 검토 중이나 서울시는 용산공원특별법 취지에 어긋난다며 반대하고 있고, 환경오염 정화에만 최소 3~7년이 걸린다는 점도 걸림돌로 꼽힌다.","url":"https://biz.heraldcorp.com/article/10904917"}]},{"name":"시장동향","articles":[{"n":3,"title":"국토부 \"강남 집값 떨어지고 매물 쌓여…시장 하향 안정 신호\"","meta":"2026.10.18 16:10 · 파이낸셜뉴스","body":"국토교통부는 서울 강남구·서초구 아파트값이 10주 연속 하락하고 매물이 쌓이는 등 시장에 하향 안정 신호가 나타나고 있다고 평가했다. 9월 아파트 매매가격은 강남 -1.65%, 서초 -1.25%, 송파 -0.45%를 기록했고, 서울 아파트 매매거래량은 5월 8900건에서 8월 4600건으로 줄었다. 매매 매물은 10월 둘째 주 기준 약 7만4000건으로 연초 대비 30% 늘었고, 갭투자 거래 비중은 지난해 10월 37.9%에서 올해 8월 6.1%로 급감했다. 정부는 2028년부터 3기 신도시 입주가 본격화하면 중장기적으로 주택 수급 여건이 개선될 것으로 내다봤다.","url":"https://www.fnnews.com/news/202610181610353388"},{"n":4,"title":"경기 상급지 이동 수요에…분당 상승률 1위","meta":"2026.10.18 16:55 · 한국경제","body":"한국부동산원 집계에 따르면 10월 둘째 주 경기 성남 분당구가 전국 시·군·구 중 아파트 매매가격 상승률 1위(0.79%)를 기록했다. 1기 신도시 재건축 기대감에 수원·동탄 등에서 분당으로 옮기려는 '상급지 이동' 수요가 겹친 영향으로 풀이된다. 뒤이어 군포(0.72%), 수원 영통(0.69%), 화성 동탄(0.66%), 광명(0.62%) 순으로 상승폭이 컸고, 경기 전체 아파트값은 0.26% 올라 약 4년 11개월 만에 최대 상승폭을 기록했다. 서울에서는 재건축 추진 단지인 신현대12차가 88억원에 거래되며 최고가를 경신했다.","url":"https://www.hankyung.com/article/2026101887721"}]},{"name":"정비사업","articles":[{"n":7,"title":"[단독] 여의도 '래미안 벨트' 윤곽…삼성물산, 2.2조 시범아파트 재건축 시공사 선정","meta":"2026.10.16 23:25 · 청년일보","body":"삼성물산이 공사비 약 2조1616억원 규모의 서울 영등포구 여의도 시범아파트 재건축사업 시공사로 선정됐다. 영등포구의 사업시행계획 인가가 난 지 사흘 만에 시공사가 결정됐으며, 지하 6층~지상 최고 59층, 21개 동, 2491가구 규모로 지어질 예정이다. 삼성물산은 앞서 수주한 대교·목화아파트에 이어 여의도에서 세 번째 사업을 확보하며 올해 도시정비 누적 수주액이 9조5000억원에 육박하게 됐다.","url":"https://youthdaily.co.kr/news/article.html?no=228480"},{"n":8,"title":"'압구정 터줏대감' 갤러리아명품관, 40여 년 만에 새 옷 입는다…재건축 허가","meta":"2026.10.16 16:01 · 이투데이","body":"서울 강남구는 10월 15일 압구정동 갤러리아명품관 서관(WEST) 재건축사업에 건축허가를 내줬다. 1979년 준공된 서관(47년 경과)과 1985년 준공된 동관(41년 경과)을 포함해 영업면적을 기존 약 2만9091㎡에서 5만9504㎡ 이상으로 두 배 넘게 확대하는 계획이다. 설계에는 세계적 건축설계사무소 헤더윅 스튜디오의 곡선형 파사드가 적용돼 모래시계를 연상시키는 외관으로 조성된다. 다만 이번 건축허가가 곧바로 착공을 뜻하는 것은 아니며, 실시설계와 환경영향평가·재해영향평가 등 후속 인허가 절차를 거쳐야 한다.","url":"https://www.etoday.co.kr/news/view/2636772"}]},{"name":"금융/세제","articles":[{"n":10,"title":"\"집값 따라가기 벅차\"…10명 중 3명, 주담대 2억 이상 빌렸다 '역대 최고'","meta":"2026.10.18 07:01 · 파이낸셜뉴스","body":"한국은행이 국회에 제출한 자료에 따르면 올해 2분기 말 기준 은행·비은행권 주택담보대출 차주 가운데 대출 잔액이 2억원 이상인 비중이 30.2%로 역대 최고치를 기록했다. 서울과 수도권을 중심으로 집값이 오르면서 주택 구입에 필요한 자금 규모가 커져 '주담대 고액화' 현상이 뚜렷해지고 있다는 분석이다. 금융당국은 은행권 주담대 위험가중치 추가 인상 여부도 시장 상황을 지켜보며 검토하겠다는 입장이다. 현재 수도권·규제지역 주택구입 목적 주담대 한도는 시가 15억원 이하 최대 6억원, 15억원 초과~25억원 이하 4억원, 25억원 초과 2억원이다.","url":"https://www.fnnews.com/news/202610180701302749"},{"n":11,"title":"고금리에 얼어붙은 내 집 마련…정책대출로 살 수 있는 아파트는","meta":"2026.10.18 16:07 · 한국경제","body":"서울 아파트값이 88주 연속 오르는 가운데 고금리로 내 집 마련 부담이 커지면서 실수요자들이 저금리 정책대출로 눈을 돌리고 있다. 올해 1~9월 서울 아파트 거래 중 9억원 이하 거래 비중은 지난해 같은 기간 40.47%에서 49.0%로 8.53%포인트 상승했다. 전체 거래량은 5만3611건으로 전년 동기 대비 19.2% 줄었지만, 6억원 이하 거래는 1만2306건으로 5.4% 늘며 비중이 17.59%에서 22.95%로 커졌다. 시중은행보다 낮은 금리의 버팀목 전세자금대출 등 정책대출이 신혼부부와 20·30대 실수요자의 주요 대안으로 떠오르고 있다.","url":"https://www.hankyung.com/article/202610188720i"}]},{"name":"임대주택","articles":[{"n":12,"title":"전월세난 대응…내년 말까지 수도권 공적주택 10만가구 입주 추진","meta":"2026.10.16 16:00 · 뉴스1","body":"국토교통부는 전월세난에 대응해 올해 4분기부터 내년 말까지 수도권에 공적주택 10만가구를 입주시키겠다고 밝혔다. 유형별로는 공공분양 9000가구, 건설임대 8000가구, 매입임대 2만9000가구, 전세임대 4만5000가구, 공공지원 민간임대 5000가구 등으로 구성된다. 오는 12월 인천 계양을 시작으로 3기 신도시 입주도 본격화한다. 김이탁 국토1차관은 \"주택시장 수급 불안을 완화해 시장 안정을 기대한다\"고 말했다.","url":"https://www.news1.kr/realestate/general/6322455"},{"n":13,"title":"월세 거래 비중 '70%' 선 뚫었다","meta":"2026.10.18 17:00 · 비즈워치","body":"KB금융지주 경영연구소의 'KB주택시장리뷰-2026년 10월호'에 따르면 8월 전국 주택 월세 거래 비중이 70%까지 상승했다. 전체 전월세 거래 19만9204건 중 13만9455건이 월세로, 전월 대비 전체 거래량은 5.6% 줄었지만 전세 거래량만 12.7% 급감한 영향이 컸다. KB경영연구소는 \"임대물량 부족과 보증금 마련 부담으로 초기 목돈이 적게 드는 월세를 선택하는 경향이 지속되고 있다\"고 설명했다. 서울의 매수우위지수는 69.5로 전주보다 3.8포인트 하락해 매수심리도 위축되는 모습이다.","url":"https://news.bizwatch.co.kr/article/real_estate/2026/10/16/0028"}]},{"name":"택지/도시개발","articles":[{"n":14,"title":"'3억대' 내 집 마련…'3기신도시 첫 입주' 계양신도시 미래가치는","meta":"2026.10.18 13:11 · 머니투데이","body":"한국토지주택공사(LH)는 3기 신도시 중 처음으로 입주를 앞둔 인천 계양신도시 A2·A3블록 입주자 모집에 나섰다. A2블록은 10월 17일부터 특별공급·일반공급 순으로 18일까지 청약을 접수하며, 평균 공급가격은 59형 호당 4억1000만원, 74형 5억1000만원, 84형 5억7000만원 수준이다. 입주 예정 시기는 3기 신도시 중 가장 빠른 2026년 12월로, 계양신도시는 인천 계양구 일원 약 335만㎡에 약 1만8000가구 규모로 조성된다. 당첨자는 10월 31일 발표될 예정이다.","url":"https://www.mt.co.kr/estate/2026/10/18/2026101613110380031"}]},{"name":"주택품질/안전","articles":[{"n":15,"title":"목포 아파트 11층서 창호 교체하던 50대…사다리차서 추락해 숨져","meta":"2026.10.16 16:23 · 서울신문","body":"10월 16일 낮 12시 56분쯤 전남 목포시 상동의 한 아파트 11층에서 창호 교체 작업을 하던 50대 남성이 사다리차에서 추락해 숨졌다. 경찰은 사다리차 지지대가 지면에 제대로 고정되지 않아 작업대가 흔들리면서 사고가 난 것으로 보고 조사 중이다. 숨진 남성은 응급대원이 현장에 도착했을 당시 이미 심정지 상태였으며, 해당 창호 교체 업체의 사업주였던 것으로 확인됐다.","url":"https://seoul.co.kr/news/society/2026/10/16/20261016500233"}]},{"name":"분양정보","articles":[{"n":16,"title":"서울 아파트 일반분양 1만가구 돌파…작년 3배 수준","meta":"2026.10.18 11:19 · 머니투데이","body":"부동산 플랫폼 직방 조사에 따르면 올해 서울 아파트 일반분양 예상 물량은 1만887가구로 지난해(3979가구)보다 약 2.7배 늘었다. 서울 아파트 일반분양 물량은 2021년 2902가구에서 2024년 1만120가구까지 늘었다가 지난해 급감했는데, 올해는 미뤄졌던 물량이 풀리고 주요 재건축 단지들이 분양에 나서며 다시 늘었다. 지난 4월 분양한 아크로 서초는 평균 1099.1대 1의 청약 경쟁률을 기록해 2015년 이후 서울 민간 아파트 단지 중 최고 수준을 보였다. 다만 전문가들은 물량이 늘었어도 여전히 공급 갈증이 해소되기에는 부족하다고 평가한다.","url":"https://news.mtn.co.kr/article/2026101811191935331"},{"n":17,"title":"[분양캘린더] 10월 넷째 주 13개 단지 청약…6734가구 공급","meta":"2026.10.17 08:00 · 뉴스1","body":"10월 넷째 주(17~24일) 전국 13개 단지에서 오피스텔·공공지원 민간임대·조합원 취소분을 포함해 총 6734가구가 청약을 받는다. 수도권에서는 인천 부평구 '산곡역자이힐스테이트&하늘채' 1289가구, 경기 성남시 '힐스테이트 성남메트로블' 189실 등이 공급된다. 지방에서는 충남 아산시 '아산 그랑시티필하우스' 1380가구, 충북 청주시 '청주 가경 아이파크 7·8단지' 1671가구 등이 분양에 나선다. 이번 주 인천에서는 견본주택 1곳이 새로 문을 연다.","url":"https://www.news1.kr/realestate/general/6322702"}]},{"name":"논설/사설","articles":[{"n":19,"title":"[사설] 서울 집값 상승, 획기적 공급 대책 나오지 않으면 멈추지 않을 것","meta":"2026.10.16 16:30 · 파이낸셜뉴스","body":"올해 주택 착공 목표(26만8000가구) 대비 실적은 37%(9만9000가구)에 그쳤고, 공공주택 진도율은 26%, 민간 정비사업은 목표의 24%에 머물렀다고 지적했다. 그 사이 서울 아파트값은 88주 연속 올랐다며, 수요억제책만으로는 시장 안정에 한계가 있다고 평가했다. 신규 공급 확대와 인허가 절차 간소화 등 획기적인 대책이 뒤따르지 않으면 집값 상승세가 쉽게 꺾이지 않을 것이라고 주장했다.","url":"https://fnnews.com/news/202610161329255322"}]}]},{"date":"2026-10-16","count":15,"pdf_count":18,"highlights":[{"n":1,"text":"수도권 공공주택 착공 27%에 그쳐…총리·국토장관·LH사장까지 현장 점검"},{"n":3,"text":"숨 고르던 서울 아파트값 다시 상승폭 확대…분당·군포 등 경기 남부 강세"},{"n":7,"text":"오세훈, 국감서 \"조합원 지위 양도 제한 3년 풀어야\"…용산공원 주택공급엔 반대"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"수도권 공공주택 착공 27%에 그쳐…총리·국토장관·LH사장까지 현장 점검","meta":"2026.10.15 10:43 · 글로벌이코노믹","body":"올해 3분기까지 수도권 공공주택 착공 물량이 약 1만7000가구로 연간 목표 6만2000가구의 27.4%에 그친 것으로 나타났다. 목표 달성을 위해서는 4분기에만 약 4만5000가구를 착공해야 하는 상황이다. 이에 홍지선 국토교통부 장관은 서울 마포구 신축 매입임대주택 현장을 찾아 \"인허가가 착공으로, 착공이 입주로 이어지도록 속도를 더 높이겠다\"고 말했다. 한성숙 국무총리도 수원 재개발 현장을 점검하며 이해관계자 간 협력을 강조했고, 이성훈 LH 사장은 고양창릉 신도시를 찾아 공급 속도 확대를 주문했다.","url":"https://www.g-enews.com/article/Real-Estate/2026/10/2026101510050066802aa6f4cdad_1"},{"n":2,"title":"조정훈 의원 \"10·15대책 1년, 서울 집값 88주 연속 상승…규제만으로 못 잡아\"","meta":"2026.10.15 16:23 · 뉴스핌","body":"국민의힘 조정훈 의원은 정부의 10·15 부동산 대책 발표 1년을 맞아 서울 아파트값이 88주 연속 상승했다며 정책 실효성을 지적했다. 그는 올해 8월까지 서울 주택 준공이 지난해보다 19% 줄었고, 8월 착공 물량은 80% 이상 급감했다는 수치를 근거로 들었다. 조 의원은 \"거래를 묶어두고 공급까지 막히니 가격이 내려갈 이유가 없다\"며 \"규제만으로는 집값을 잡을 수 없다\"고 주장했다. 그는 정부에 정책 기조 전환을 촉구했다.","url":"https://www.newspim.com/news/view/20261015001121"}]},{"name":"시장동향","articles":[{"n":3,"title":"숨 고르던 서울 아파트값 다시 상승폭 확대…분당·군포 등 경기 남부 강세","meta":"2026.10.15 16:11 · 서울신문","body":"한국부동산원 조사 결과 서울 아파트 매매가격이 전주보다 0.16% 올라 지난해 2월부터 88주째 상승세를 이어갔다. 강남3구는 약세를 지속했지만 용산구와 한강벨트 지역의 상승폭이 확대됐다. 경기 남부 지역은 특히 강세를 보여 성남 분당구가 0.79%, 군포시가 0.72%, 화성 동탄이 0.66% 올랐고, 동탄은 올해 누적 상승률이 20%를 넘었다. 전문가는 수원을 중심으로 한 경기 남부 가격 과열이 인근 지역으로 연쇄 확산되고 있다고 분석했다.","url":"https://www.seoul.co.kr/news/economy/estate/2026/10/15/20261015500229"},{"n":4,"title":"경기 집값 5년 만에 최대폭 상승…영통 찍고 군포·의왕까지 번졌다","meta":"2026.10.15 17:36 · 한국경제","body":"지난주(10월 12일 기준) 경기 아파트 매매가격이 0.26% 올라 2021년 11월 둘째 주(0.27%) 이후 가장 높은 상승률을 기록했다. 수원 영통에서 시작된 상승세가 군포, 의왕 등 인접 지역으로 확산되는 모습이다. 성남 분당(0.79%), 군포(0.72%), 의왕(0.60%) 등이 강한 오름세를 보였다. 전문가들은 삼성전자 관련 자금 유입과 구매력이 낮은 실수요자들이 수원 인근 지역으로 이동한 영향으로 분석했다.","url":"https://www.hankyung.com/article/2026101546451"}]},{"name":"정비사업","articles":[{"n":7,"title":"오세훈, 국감서 \"조합원 지위 양도 제한 3년 풀어야\"…용산공원 주택공급엔 반대","meta":"2026.10.15 18:11 · 한국경제","body":"오세훈 서울시장은 국회 행정안전위원회의 서울시 국정감사에서 주택 공급 확대 방안으로 \"조합원 지위 양도 제한을 한시적으로 3년만 해제해주면 조합 내 갈등 요소가 현저히 줄어든다\"고 제안했다. 분담금이나 이주비 부담이 큰 소유자가 부동산을 매각하고 매수자가 조합원 지위를 이어받도록 해 정비사업 속도를 높이려는 취지다. 아울러 서울 아파트값이 88주 연속 상승하는 가운데 민간임대사업자 지원 확대와 이주비 대출 규제 완화도 요청했다. 반면 정부가 검토 중인 용산공원 부지 내 주택공급 방안에 대해서는 \"용산공원특별법을 정면으로 거스르는 조치\"라며 반대 입장을 재확인했다.","url":"https://www.hankyung.com/article/2026101548131"},{"n":8,"title":"IPARK현산, 군포 금정역세권1구역 재개발 우선협상자 선정","meta":"2026.10.15 17:33 · 한국경제","body":"HDC현대산업개발이 경기 군포 금정역세권1구역 재개발사업의 우선협상 대상자로 선정됐다. HDC현대산업개발은 단지명으로 '아이파크 원 어센트'를 제안했으며, 재개발조합은 10월 24일 총회를 열어 시공사 선정을 의결할 예정이다. 이 단지는 지하 4층~지상 35층, 10개 동, 총 1137가구 규모로 조성되며 모든 가구를 남향으로 배치하는 판상형 설계가 적용된다. 최고층에는 수리산과 도심을 조망하는 스카이 커뮤니티가, 단지 중앙부에는 7200㎡ 규모의 광장이 들어설 예정이다.","url":"https://www.hankyung.com/article/2026101546521"}]},{"name":"금융/세제","articles":[{"n":10,"title":"9월 은행 가계대출 6000억원 증가 그쳐…주담대 증가폭도 둔화","meta":"2026.10.15 12:00 · 뉴스핌","body":"한국은행이 발표한 '2026년 9월 금융시장 동향'에 따르면 9월 은행 가계대출은 전월 대비 6000억원 증가해 1198조9000억원으로 집계됐다. 증가폭은 7월 5조5000억원, 8월 3조5000억원에서 9월 6000억원으로 계속 줄었고 전년 동월보다도 작은 수준이다. 주택담보대출은 전세거래 둔화와 입주물량 감소 등의 영향으로 2조9000억원 증가에 그쳤고, 전세자금대출은 9000억원 줄어 3개월 연속 감소했다. 반면 기업대출은 10조7000억원 늘었으며 대기업대출은 2022년 10월 이후 최대폭인 7조5000억원 증가했다.","url":"https://www.newspim.com/news/view/20261015000426"},{"n":11,"title":"9월 전 금융권 가계대출 2.2조 감소…작년 12월 이후 첫 순감","meta":"2026.10.15 13:41 · 한국경제TV","body":"금융위원회와 금융감독원에 따르면 9월 전 금융권 가계대출이 2조2000억원 감소해 지난해 12월 이후 처음으로 순감소를 기록했다. 국내 증시 하락에 따른 이른바 '빚투' 축소가 주요 요인으로, 신용대출 등 기타대출 증가폭이 전월 4000억원에서 3조원 감소로 돌아섰다. 은행권 가계대출은 6000억원 증가에 그쳤고 제2금융권은 2조8000억원 감소했다. 주택담보대출 증가폭도 함께 둔화된 것으로 나타났다.","url":"https://www.wowtv.co.kr/NewsCenter/News/Read?articleId=A202610150089"}]},{"name":"임대주택","articles":[{"n":12,"title":"[2026 국감] LH 매입임대주택 실적 '목표의 13.8%'…\"평가체제 손봐야\"","meta":"2026.10.15 15:41 · FETV","body":"국회 국토교통위원회 김남근 더불어민주당 의원이 LH로부터 제출받은 국정감사 자료를 분석한 결과, LH의 올해 매입임대주택 실적이 연간 목표 1만8340호 중 8월 말까지 2539호에 그쳐 목표의 13.8%에 불과한 것으로 나타났다. 호당 정부 지원단가가 2025년 기준 1억7000만원인 반면 실제 매입비는 3억2700만원에 달해 LH가 차액을 떠안고 있는 구조가 지적됐다. 매입심의 통과율도 33% 수준에 머물러 절차 지연 문제도 제기됐다. 김 의원은 지원기준 현실화와 평가체계 개선이 필요하다고 강조했다.","url":"https://www.fetv.co.kr/news/articleView.html?idxno=311830"}]},{"name":"택지/도시개발","articles":[{"n":13,"title":"공급대책 쏟아냈는데…수도권 착공·준공은 지지부진","meta":"2026.10.15 05:01 · 파이낸셜뉴스","body":"정부가 주택공급 대책을 잇따라 내놓고 있지만 수도권의 실제 착공·준공 실적은 좀처럼 살아나지 않고 있다. 올해 1~8월 수도권 착공은 8만6739가구로 전년 동기 대비 1.5% 늘어나는 데 그쳤고, 8월 한 달은 전월보다 30.3% 급감했다. 같은 기간 서울 준공량은 19.1%, 수도권 전체는 21.6% 줄었다. 올해 예상 입주량은 10만5000가구로 과거 10년 평균(18만3000가구)보다 42.6% 적은 수준이며, 전문가들은 신규 택지 조성뿐 아니라 기존 주택 거래 활성화와 민간 정비사업 지원 등 단기 대책이 필요하다고 지적했다.","url":"https://www.fnnews.com/news/202610150501417622"}]},{"name":"주택품질/안전","articles":[{"n":14,"title":"여수 아파트 5층서 화재…주민 8명 부상","meta":"2026.10.15 11:33 · 뉴스1","body":"전남소방본부에 따르면 10월 15일 오전 5시 52분쯤 전남 여수시 신기동의 한 아파트 5층에서 화재가 발생했다. 이 불로 주민 8명이 연기를 흡입하거나 대피 중 경상을 입은 것으로 파악됐다. 화재는 신고 약 30분 만인 오전 6시 20분쯤 완전히 진압됐다. 소방 당국은 정확한 화재 원인과 피해 규모를 조사하고 있다.","url":"https://www.news1.kr/local/gwangju-jeonnam/6321024"}]},{"name":"분양정보","articles":[{"n":15,"title":"'힐스테이트 거제' 1963가구 분양…19일 특별공급","meta":"2026.10.15 17:34 · 한국경제","body":"현대엔지니어링이 경남 거제시 옥포동에 짓는 '힐스테이트 거제'가 지하 7층~지상 최고 36층, 1963가구(전용 84~165㎡) 규모로 분양에 나선다. 옥포항 오션뷰와 실내 수영장·사우나·인도어 골프연습장 등 커뮤니티 시설을 갖췄고 초등학교·외국인학교가 인근에 있다. 청약은 19일 특별공급, 20일 1순위, 21일 2순위 순으로 진행되며 계약금을 5%로 낮추고 1차 계약금을 500만원 정액제로 적용한다. 전매 제한이 없다는 점도 특징이다.","url":"https://www.hankyung.com/article/2026101546461"},{"n":16,"title":"청주 가경 아이파크 7·8단지 등 전국 3곳 오늘 견본주택 개관","meta":"2026.10.16 06:00 · 이투데이","body":"리얼투데이에 따르면 10월 16일 전국 3곳에서 견본주택이 문을 열고 본격적인 분양에 들어간다. 부산 연제구 '연산센텀 월드메르디앙', 충남 아산시 '아산 그랑시티필하우스'와 함께 충북 청주시 흥덕구 가경동의 'HDC현대산업개발 청주 가경 아이파크 7·8단지'가 견본주택을 연다. 7단지 543가구, 8단지 1128가구 등 총 1671가구 규모이며 3.3㎡당 평균 분양가는 1578만원이다. 전용면적은 84㎡A·B형부터 102㎡, 116㎡형까지 구성돼 있다.","url":"https://supple.kr/news/cmva10ex90018cla6iijukczb"}]},{"name":"논설/사설","articles":[{"n":17,"title":"[사설] 집값 못잡고 시장 왜곡한 토허제 1년…원점서 재검토할 때","meta":"2026.10.15 17:38 · 한국경제","body":"한국경제는 사설에서 토지거래허가구역 확대와 투기과열지구 지정을 뼈대로 한 10·15 대책 시행 1년을 평가하며, 정부 의도와 달리 서울 아파트값이 역대 최장인 88주 연속 오르는 등 집값을 잡지 못했다고 지적했다. 정책 시행 후 서울 아파트 매매가는 10.6% 올랐고 성북·강서·구로 등 외곽 지역의 상승률이 더 가팔랐다는 점을 근거로 들었다. 2년 실거주 의무화로 전세 물건이 급감하며 전셋값이 오르고 서민 주거난이 심화됐다고 평가했다. 사설은 강남 일부 지역의 집값 억제에는 성공했지만 사유재산권 침해와 거주 이전의 자유 제한, 시장 왜곡 등 부작용이 크다며 정책의 단계적 완화를 주장했다.","url":"https://www.hankyung.com/article/2026101547691"},{"n":18,"title":"[사설] 10·15대책 1년, 이제 실패에서 배워야","meta":"2026.10.15 04:00 · 머니투데이","body":"머니투데이는 사설에서 정부의 10·15 부동산 대책이 시행 1년을 맞았지만 정책 목표 달성에 실패했다고 평가했다. 투기 수요 차단과 시장 안정이라는 당초 의도와 달리 서울 아파트 가격은 87주 연속 상승했고 전월세난은 더욱 심화됐다고 지적했다. 아파트 매물 부족 심화, 주택 준공 실적 20% 감소, 공공주택 착공 실적 저조, 대출 규제로 인한 외곽 아파트 가격 상승 등을 문제점으로 꼽았다. 사설은 막연한 기대보다 정책 결과를 재검토하고 출구 전략을 마련해 세입자 고통을 완화하고 규제를 완화할 필요가 있다고 제언했다.","url":"https://www.mt.co.kr/amp/opinion/2026/10/15/2026101415224878073"}]}]}],"holidays":["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-02","2026-05-01","2026-05-05","2026-05-25","2026-06-03","2026-06-06","2026-08-17","2026-09-24","2026-09-25","2026-09-26","2026-10-05","2026-10-09","2026-12-25"],"art":{"date":"2026-10-30","url":"https://claude.ai/artifact/PvEbpwQSfGxroF4CKyyK7W","items":[{"cat":"정부정책","title":"서울 코앞 경기 6곳에 새 택지…7만6700가구 짓는다","img":"art/20261030-1.png","anchor":"s1"},{"cat":"시장동향","title":"서울 아파트값 90주째 상승…이번엔 경기 남부가 더 뜨겁다","img":"art/20261030-2.png","anchor":"s2"},{"cat":"정비사업","title":"강북구, 재개발·재건축 132곳을 한꺼번에 민다","img":"art/20261030-3.png","anchor":"s3"},{"cat":"금융/세제","title":"주담대 금리 4.88%…고정형은 처음으로 5%를 넘었다","img":"art/20261030-4.png","anchor":"s4"},{"cat":"임대주택","title":"서울시, 내년 공공임대 2만7200가구…청년 월세 지원도 확대","img":"art/20261030-5.png","anchor":"s5"},{"cat":"택지/도시개발","title":"새 택지 물량 72%가 김포·하남에…\"교통부터 깔아달라\"","img":"art/20261030-6.png","anchor":"s6"}]}};

const WD = ["일","월","화","수","목","금","토"];
const FS = [0.9, 1, 1.15, 1.3];   // 글자 크기 단계. 기본은 1(최적 크기), −로 90%, +로 115%·130%
const FS_DEFAULT = 1;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const parts = iso => { const [y,m,d] = iso.split("-").map(Number); const w = WD[new Date(y, m-1, d).getDay()]; return {y,m,d,w}; };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch(e) { return ""; } };
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const store = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} } };

let dayIdx = 0;
let fsIdx = (() => { const i = FS.indexOf(Number(store.get("dn-fs"))); return i >= 0 ? i : FS_DEFAULT; })();

function findArticle(day, n){ for (const c of day.categories) for (const a of c.articles) if (a.n === n) return {a, c}; return null; }
function firstSentence(t){ const m = t.match(/^.+?[다요]\.(?=\s|$)/); return m ? m[0] : t; }

// 그림으로 보는 오늘: 최신 날짜를 볼 때만, 그날 그림이 준비됐을 때만 보인다. 그림을 누르면 오늘의 주택 뉴스의 그 장면(#s1~#s6)으로 바로 간다.
function artStrip(day){
  const art = DATA.art;
  if (dayIdx !== 0 || !art || art.date !== day.date || !art.items || !art.items.length) return "";
  const go = it => `${esc(art.url)}#${esc(it.anchor)}`;
  return `<div class="art-b"><h3>인포그래픽 뉴스 <a href="${esc(art.url)}" target="_blank" rel="noopener">크게 보기 →</a></h3>
    <div class="strip">${art.items.map(it => `<a href="${go(it)}" target="_blank" rel="noopener"><img src="${esc(it.img)}" alt="${esc(it.cat)} 그림" loading="lazy" width="132" height="129"><span>${esc(it.cat)}</span><b>${esc(it.title)}</b></a>`).join("")}</div></div>`;
}

function cover(day, p){
  const hs = day.highlights.map(h => { const f = findArticle(day, h.n); return { text: h.text, n: h.n, cat: f ? f.c.name : "", art: f ? f.a : null }; });
  const lead = hs[0];
  const subs = hs.slice(1).map(h => `<a href="#a-${h.n}"><span class="hl-cat">${esc(h.cat)}</span><b>${esc(h.text)}</b></a>`).join("");
  return `<div class="cover">
    <div class="mast">
      <div class="mast-top"><span class="logo"><img src="${LOGO}" alt="한국주택협회 Korea Housing Association"></span></div>
      <div class="mast-row"><b>Daily News</b><span>${p.y}.${pad(p.m)}.${pad(p.d)} (${p.w})</span></div>
    </div>
    <div class="lead">
      <div class="lead-cat">오늘의 핵심 · ${esc(lead.cat)}</div>
      <h2>${esc(lead.text)}</h2>
      ${lead.art ? `<p>${esc(firstSentence(lead.art.body))}</p>` : ""}
      <a class="more" href="#a-${lead.n}">기사 전체 보기 →</a>
    </div>
    <div class="subs">${subs}</div>
    ${artStrip(day)}
    <div class="foot"><span class="stats">기사 ${day.count}건 · ${day.categories.length}개 분야</span></div>
  </div>`;
}

function applyFs(){
  document.documentElement.style.setProperty("--fs", FS[fsIdx]);
  $("#fsDown").disabled = fsIdx === 0;
  $("#fsUp").disabled = fsIdx === FS.length - 1;
  $("#fsLabel").setAttribute("aria-label", `글자 크기 ${Math.round(FS[fsIdx] * 100)}%`);
}

function render(){
  const day = DATA.days[dayIdx];
  const p = parts(day.date);
  document.title = `Daily News ${p.m}.${p.d}(${p.w}) · 주택·부동산`;

  // 안내 띠: 지난 날짜를 보는 중이거나, 오늘 자료가 아직 없을 때
  const today = new Date(); const tIso = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  const latest = DATA.days[0];
  const isWorkday = today.getDay() > 0 && today.getDay() < 6 && !(DATA.holidays || []).includes(tIso);
  let notice = "";
  if (dayIdx > 0) notice = `<div class="notice"><span>지난 뉴스를 보고 있습니다 · ${p.m}월 ${p.d}일(${p.w})</span><button type="button" data-go="0">최신 뉴스로</button></div>`;
  else if (latest.date !== tIso && isWorkday && today.getHours() >= 10) { const lp = parts(latest.date); notice = `<div class="notice"><span>오늘 뉴스가 아직 올라오지 않았습니다. 지금은 ${lp.m}월 ${lp.d}일(${lp.w}) 뉴스입니다.</span></div>`; }
  $("#notice").innerHTML = notice;

  $("#cover").innerHTML = cover(day, p);

  $("#catnav").innerHTML = day.categories.map((c, i) => `<a class="chip" href="#s-${i}" data-i="${i}">${esc(c.name)}<span>${c.articles.length}</span></a>`).join("");
  $("#list").innerHTML = day.categories.map((c, i) => `<section class="sec" id="s-${i}" data-i="${i}">
      <h2 class="sec-h"><b>${esc(c.name)}</b><span>${c.articles.length}건</span></h2>
      ${c.articles.map(a => `<article class="card" id="a-${a.n}">
        <h3>${esc(a.title)}</h3>
        <div class="meta">${esc(a.meta)}</div>
        <p>${esc(a.body)}</p>
        <a class="src" href="${esc(a.url)}" target="_blank" rel="noopener">원문 보기 <small>${esc(host(a.url))}</small>${arrow}</a>
      </article>`).join("")}
    </section>`).join("");

  watchSections();
}

let io;
function watchSections(){
  if (io) io.disconnect();
  const chips = [...document.querySelectorAll(".chip")];
  io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      const i = e.target.dataset.i;
      chips.forEach(c => c.classList.toggle("on", c.dataset.i === i));
      const on = chips[i]; if (on) on.parentElement.scrollTo({left: on.offsetLeft - 16, behavior: "smooth"});
    });
  }, {rootMargin: "-120px 0px -65% 0px"});
  document.querySelectorAll(".sec").forEach(s => io.observe(s));
}

function openSheet(){
  $("#days").innerHTML = DATA.days.map((d, i) => { const p = parts(d.date); return `<li><button type="button" data-go="${i}" class="${i === dayIdx ? "cur" : ""}">
    <div>${p.m}월 ${p.d}일 (${p.w})${i === 0 ? "<em>최신</em>" : ""}</div><span>기사 ${d.count}건</span></button></li>`; }).join("");
  $("#scrim").hidden = false; $("#sheet").hidden = false;
  const cur = $("#days .cur"); if (cur) cur.focus();
}
function closeSheet(){ $("#scrim").hidden = true; $("#sheet").hidden = true; $("#btnPast").focus(); }

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { dayIdx = +go.dataset.go; closeSheet(); render(); window.scrollTo({top: 0}); }
});
function stepFs(d){ fsIdx = Math.min(FS.length - 1, Math.max(0, fsIdx + d)); store.set("dn-fs", FS[fsIdx]); applyFs(); }
$("#fsDown").addEventListener("click", () => stepFs(-1));
$("#fsUp").addEventListener("click", () => stepFs(1));
$("#btnPast").addEventListener("click", openSheet);
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
$("#toTop").addEventListener("click", () => window.scrollTo({top: 0, behavior: "smooth"}));
applyFs();
render();
</script>

</body></html>
