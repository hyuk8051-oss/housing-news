<script>
const DATA = {"days":[{"date":"2026-11-19","count":15,"pdf_count":29,"highlights":[{"n":1,"text":"국토부·서울시 사전기획협의체 5개월 만에 재가동…도심복합사업 1만5993가구 숨통"},{"n":5,"text":"'강남·대형'은 내리고 '강북·소형'은 올라…서울 아파트값 온도차"},{"n":10,"text":"세금·분담금·재초환 삼중고…강남 재건축 호가 수억원씩 내렸다"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"국토부·서울시 사전기획협의체 5개월 만에 재가동…도심복합사업 1만5993가구 숨통","meta":"2026.11.19 06:05 · 서울경제","body":"국토교통부와 서울시가 용적률 인센티브를 둘러싼 이견으로 중단됐던 도심공공주택복합사업 사전기획협의체를 18일 5개월 만에 다시 열었다. 협의 대상은 불광근린공원, 약수역 인근, 장위12구역 등 서울 시내 8개 사업지로 모두 1만5993가구가 예정돼 있다. 정부는 용적률 인센티브를 1.2배에서 1.4배로 확대했지만 서울시는 일조권 침해 등을 충분히 검토해야 한다는 입장을 유지해 왔다. 이날 회의에서는 구체적인 용적률 수치보다 향후 통합심의위원회의 심의 방향과 환경영향 평가 등을 논의했다. 사전기획 단계에 묶여 있는 물량은 약 1만 가구이며, 대기 중인 사업까지 더하면 3만1310가구가 영향을 받는다는 것이 서울시 설명이다.","url":"https://www.sedaily.com/article/20116138"},{"n":2,"title":"국토부, '부정청약' 이혜훈 부부 래미안 원펜타스 분양계약 취소 요청","meta":"2026.11.18 15:34 · 파이낸셜뉴스","body":"국토교통부가 이혜훈 전 기획예산처 장관 후보자 부부의 서울 서초구 래미안 원펜타스 분양계약을 취소해 달라고 사업주체에 요청했다. 이 부부는 2024년 8월 36억7840만원에 계약했으나, 청약 당시 이미 혼인해 배우자의 서울 용산구 신혼집에서 생활하던 장남을 부양가족에 포함시킨 점이 문제가 됐다. 국토부는 장남을 제외하면 청약 가점이 69점으로 떨어져 당첨선에 미치지 못했을 것으로 판단했다. 주택법 65조는 거짓이나 부정한 방법으로 주택을 공급받은 경우 공급계약을 취소할 수 있도록 하고 있다. 고위 공직 후보자의 청약 과정이 실제 계약 취소 요청으로 이어진 사례라는 점에서 청약 질서 관리에 미칠 영향이 주목된다.","url":"https://www.fnnews.com/news/202611181533501917"}]},{"name":"시장동향","articles":[{"n":5,"title":"'강남·대형'은 내리고 '강북·소형'은 올라…서울 아파트값 온도차","meta":"2026.11.19 06:00 · 아시아경제","body":"한국부동산원 집계에서 서울 아파트 실거래가지수가 전월 대비 0.57% 올랐지만 권역별·규모별로 흐름이 엇갈렸다. 강북·동북권은 오름세를 이어간 반면 강남권은 큰 폭으로 떨어졌다. 규모별로는 소형과 초소형이 각각 1.36%, 1.33% 오른 반면 중대형은 2.01%, 대형은 1.21% 하락했다. 업계는 금리 인상과 대출 규제로 매입 부담이 상대적으로 낮은 지역과 규모로 수요가 쏠린 결과로 본다. 지난달 전세 거래량은 18.3% 늘고 월세 거래량은 6.0% 줄어 전세 비중이 50.3%로 다시 확대됐다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026111821315670589"},{"n":6,"title":"한강벨트는 급랭, 반도체벨트는 후끈…동탄 거래 절반이 신고가","meta":"2026.11.19 06:00 · 서울경제","body":"10월 서울 아파트 거래량이 전년 동월 대비 54% 줄었고, 마포·용산·성동 등 한강벨트 7개 구는 73.1% 급감했다. 대출 규제로 20억~25억원대 아파트를 살 수 있는 수요가 많지 않아 고가 단지 위주로 가격 조정이 나타나고 있다. 반면 경기 화성 동탄은 11월 거래의 44.5%가 신고가로 체결됐고 한 달 사이 1억원 이상 오른 사례도 나왔다. 7월 이후 누적 상승률은 한강벨트가 2.5~4.5%인 데 비해 반도체벨트는 8.5~11.3%에 달한다. 현지에서는 반도체 기업의 고소득 맞벌이 가구가 성과급과 사내대출을 활용해 매수에 나서는 것이 상승을 떠받친다는 분석이 나온다.","url":"https://www.sedaily.com/article/20116135"}]},{"name":"정비사업","articles":[{"n":10,"title":"세금·분담금·재초환 삼중고…강남 재건축 호가 수억원씩 내렸다","meta":"2026.11.19 05:20 · 이데일리","body":"서울 강남권 재건축 단지에서 호가를 1억5000만~2억5000만원씩 낮춘 매물이 나오고 있다. 대치동 은마아파트와 잠실주공5단지 등이 대표적으로, 세금 부담과 공사비 추가분담금, 재건축초과이익환수제 부담금이 겹치며 매도자와 매수자 모두 결정을 미루는 분위기다. 강남3구 아파트 매물은 1년 전보다 84% 늘었고 은마아파트는 258% 급증했다. 관리처분계획 인가 전후로 세금 계산 방식이 달라져 거래 조건의 불확실성도 커졌다. 업계에서는 부담금 규모가 확정되기 전까지 거래 위축이 이어질 것으로 보고 있다.","url":"https://www.edaily.co.kr/News/Read?newsId=01269366645647360"},{"n":11,"title":"재초환 부담금이 가른 아파트값…반포 같은 단지서 호가 10억 차이","meta":"2026.11.18 11:23 · 헤럴드경제","body":"서울 서초구 반포동 래미안트리니원에서 같은 면적의 매물이 부담금 납부 주체에 따라 50억~70억원대로 10억원 가까이 벌어진 것으로 나타났다. 조합원 1인당 최대 7억원에 이를 수 있는 재건축초과이익환수 부담금이 수도권 중저가 아파트 한 채 값에 맞먹는 수준이기 때문이다. 2024년 개정법으로 면제 기준이 높아졌지만 강남권 재건축 단지는 여전히 억대 부담금을 피하기 어렵다. 부담금이 확정되기 전 소유권이 넘어가면 누가 낼지를 두고 분쟁 가능성이 커져 중개 현장에서도 혼선이 빚어지고 있다. 제도의 적절성을 놓고는 정부와 지방자치단체가 서로 다른 입장을 보이고 있다.","url":"https://biz.heraldcorp.com/article/10941095"}]},{"name":"금융/세제","articles":[{"n":15,"title":"가계빚 2030조원 돌파…은행 주택관련대출 증가폭은 되레 확대","meta":"2026.11.18 12:00 · 뉴스웨이","body":"한국은행 집계에서 올해 3분기 말 가계신용 잔액이 2030조5000억원으로 사상 최대를 기록했다. 분기 증가액은 2분기보다 줄었는데, 증시 조정 영향으로 신용대출 등 기타대출이 감소한 것이 주된 이유다. 반면 예금은행의 주택관련대출 증가폭은 6조8000억원에서 9조원으로 오히려 커졌다. 판매신용도 환급행사와 장기할부 혜택 등의 영향으로 5조원 늘었다. 한국은행은 명목 국내총생산이 가계부채보다 빠르게 늘고 있어 가계부채 비율은 점차 개선될 것으로 전망했다.","url":"https://www.newsway.co.kr/news/view?ud=2026111810474105247"},{"n":16,"title":"넓은 평형 신청했다 수억원 분담금…강동 재건축 조합원들의 한숨","meta":"2026.11.19 06:30 · 한국경제","body":"서울 강동구 명일·길동 일대 재건축 단지에서 기존보다 넓은 주택형을 신청한 조합원들이 수억원대 추가분담금을 마주하고 있다. 삼익그린2차는 기존 전용 84㎡ 소유주가 신축 84㎡를 받으려 해도 약 2억6000만원의 분담금이 필요한 것으로 추산된다. 삼익파크에서는 2주택 이상 보유자의 납부 조건이 바뀌어 입주 시점까지 미루던 자금을 앞당겨 마련해야 하는 상황이 생겼다. 분담금은 기존 주택 평가액과 사업 수익성, 새 주택 분양가에 따라 정해지며 공사비가 오르면 더 늘어날 수 있다. 여기에 재건축초과이익환수 부담금이 별도로 부과될 수 있어 두 비용을 구분해 자금 계획을 세워야 한다는 조언이 나온다.","url":"https://www.hankyung.com/article/2026111838246"}]},{"name":"임대주택","articles":[{"n":17,"title":"LH, 대학가 빈 상가도 임대주택으로…청년 주거 안전망 넓힌다","meta":"2026.11.18 18:29 · 파이낸셜뉴스","body":"서울의 청년 매입임대주택 청약 경쟁률이 평균 130대 1로 전국 평균의 2.6배에 달할 만큼 수요가 몰리고 있다. 한국토지주택공사(LH)는 올해 전국 3만8224가구 매입을 목표로 잡고, 대학가 공실 상가를 주거용으로 바꾸는 방식까지 활용하기로 했다. LH는 신축매입임대주택은 후보지 발굴부터 입주까지 1~2년이면 가능하다고 설명했다. 정부는 공사비 상승에 대응해 수도권 규제지역 매입가격에 최대 15%까지 반영하는 원가법을 도입했고, 토지소유권 동의 요건을 100%에서 75%로, 서류심사 통과점수를 70점에서 65점으로 낮췄다. 앞으로 3년간 서울 25개 자치구에서 2만528가구를 모집하며 이 가운데 청년 몫이 1만4558가구다.","url":"https://www.fnnews.com/news/202611181830029550"},{"n":18,"title":"보증금 1억2400만원에 월 49만원…용산 청년안심주택 청년형 472대 1","meta":"2026.11.19 07:00 · 헤럴드경제","body":"서울 용산의 청년안심주택 청약에 약 2만8358명이 신청해 평균 경쟁률 44.7대 1을 기록했다. 635가구 모집 가운데 청년형 103가구에 2만2442명이 몰려 472대 1까지 치솟은 반면, 물량의 84%를 차지한 신혼부부형은 11.1대 1에 그쳤다. 보증금 1억2400만원에 월 임대료 49만원 수준으로 책정돼 입지 대비 부담이 작다는 점이 수요를 끌어모았다. 공공지원 민간임대주택은 임대료 인상률이 연 5% 이내로 제한되고 최장 10년 거주가 가능하다. 전문가들은 1인 청년 가구의 주거 선택지가 부족한 만큼 공공 물량에서 청년 신청자격을 넓힐 필요가 있다고 지적했다.","url":"https://biz.heraldcorp.com/article/10941610"}]},{"name":"택지/도시개발","articles":[{"n":21,"title":"[단독] 수도권 그린벨트 거래 10건 중 8건이 '지분 쪼개기'","meta":"2026.11.18 18:33 · 파이낸셜뉴스","body":"그린벨트 해제 후보지로 거론되는 서초·강남·과천·의왕 4곳의 개발제한구역 거래 가운데 74.8%가 투기성으로 의심되는 지분 거래인 것으로 나타났다. 2024년부터 올해 11월 중순까지 이 지역 거래 1027건 중 768건이 지분거래였고, 과천 서초 연접·선바위역 일대는 524건 중 436건(83.2%)에 달했다. 과천의 한 임야에서는 2024년 10월 한 달 동안 초소형 지분 직거래 87건이 집중되기도 했다. 고준석 연세대 상남경영원 교수는 최근에는 개인이 표시가 나지 않게 직거래로 지분을 쪼개고 있다며 해제 발표 전 선점을 노린 거래가 기승을 부린다고 설명했다. 이런 지분거래는 사업 추진 때 알박기 수단으로 악용될 수 있다는 지적도 나온다.","url":"https://www.fnnews.com/news/202611181833518648"},{"n":22,"title":"3기 신도시 입주 1~3년 밀리자…인프라 갖춘 기존 신도시로 눈길","meta":"2026.11.18 14:42 · 파이낸셜뉴스","body":"남양주 왕숙, 하남 교산, 고양 창릉, 부천 대장 등 3기 신도시의 본청약과 입주 일정이 당초 계획보다 1~3년씩 미뤄지고 있다. 토지 보상과 거주자 이주, 환경 관련 절차 등이 겹치면서 사업 추진이 지연된 결과다. 입주 시점과 교통망·학교·상업시설 조성 시점이 어긋나면 초기 인프라 공백이 생길 수 있다는 우려가 나온다. 이에 따라 광교·일산·검단·고덕 등 기반시설이 이미 갖춰진 기존 신도시의 신규 단지로 실수요자의 관심이 옮겨가는 분위기다. 분양 업계는 생활 인프라가 완성된 지역의 신규 공급에 청약 수요가 몰릴 것으로 보고 있다.","url":"https://www.fnnews.com/news/202611181349474785"}]},{"name":"주택품질/안전","articles":[{"n":25,"title":"경기도, 노후 공동주택 전기·소방 합동점검…1622세대 겨울철 화재 예방","meta":"2026.11.18 21:42 · 국토교통뉴스","body":"경기도가 한국전기안전공사 경기본부, 수원·오산소방서, 주택관리공단과 함께 노후 공동주택 전기·소방 합동점검에 나섰다. 점검 대상은 수원 매탄6단지 주공아파트를 시작으로 오산 운암6단지, 수원 백설마을 주공아파트 등 3개 단지 1622세대이며 11월 18일부터 25일까지 진행된다. 한국전기안전공사는 점검인력 20여 명을 투입해 누전차단기 작동 여부와 옥내 배선 상태를 확인하고 필요하면 차단기·스위치 교체 등 경미한 시설 개선을 지원한다. 관할 소방서는 소화기와 화재감지기 등 세대 내 소방시설을 점검하고 초기 대응 요령을 교육한다. 경기도는 이번 점검 결과를 토대로 2027~2029년 관계기관이 참여하는 정기 합동점검 체계를 구축할 방침이다.","url":"https://www.guktonews.co.kr/10153"}]},{"name":"분양정보","articles":[{"n":26,"title":"'디에이치 반포124' 분양가 심의 보류…청약 일정 12월로 밀려","meta":"2026.11.18 18:42 · 한국경제","body":"서울 서초구 반포주공1단지를 재건축하는 디에이치 반포124의 분양가 심의위원회가 추가 검토가 필요하다며 결정을 보류했다. 재심의는 12월 4일 오후 2시에 열릴 예정이어서 당초 11월 27일 모집공고, 12월 7~8일 청약으로 잡혔던 일정이 미뤄질 전망이다. 현대건설이 시공하는 이 단지는 5007가구 규모로 약 1801가구가 일반분양된다. 분양가상한제가 적용돼 인근 고가 아파트와의 가격 차이가 크게 벌어질 것으로 예상되면서 30억 로또로 불린다. 조합은 재심의 결과에 따라 연내 분양 가능 여부를 다시 판단할 계획이다.","url":"https://www.hankyung.com/article/2026111857156"}]},{"name":"논설/사설","articles":[{"n":29,"title":"[취재수첩] 청년 두 번 울리는 청년안심주택","meta":"2026.11.18 17:37 · 한국경제","body":"서울시 청년안심주택에서 입주자 모집과 보증금 관리의 허점이 잇따라 드러났다. 해링턴 플레이스 용산 리버뷰에서는 당첨자 635명뿐 아니라 예비당첨자 수백 명에게도 당첨 문자가 잘못 발송됐고, 강변스카이타워에서는 민간 사업자가 자격을 제대로 확인하지 않아 당첨자 85명 중 19명이 부적격자로 밝혀졌다. 도림브라보 입주자 4명은 계약 만기가 지나도 보증금을 돌려받지 못하고 있으며, 전체 81가구 중 43가구가 보증보험을 갱신하지 않아 위험에 노출됐다. 지난해에만 4개 사업장에서 296명이 보증금 미반환 피해를 봤다. 서울시가 2030년까지 1만7500가구를 공급하겠다고 밝힌 만큼 물량 확대에 앞서 모집·계약·보증금 반환 전 과정의 신뢰 회복이 필요하다는 지적이다.","url":"https://www.hankyung.com/article/2026111855271"}]}]},{"date":"2026-11-18","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"아파트 리모델링 동의율 75%→70%로 완화…주택법 시행령 국무회의 의결"},{"n":3,"text":"자가보유율 62.0% 역대 최고…\"내 집 필요\" 응답은 3년째 하락"},{"n":7,"text":"1.7조 광명 철산주공13단지 재건축, 현대건설 단독 응찰로 유찰"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"아파트 리모델링 동의율 75%→70%로 완화…주택법 시행령 국무회의 의결","meta":"2026.11.17 17:19 · 한국경제","body":"국토교통부는 17일 리모델링 동의 요건을 낮추는 내용의 주택법 시행령 개정안이 국무회의에서 의결됐다고 밝혔다. 주택단지 전체와 개별 동을 리모델링할 때 필요한 구분소유자·의결권 동의율이 각각 75% 이상에서 70% 이상으로 완화되며, 동별 50% 이상 동의 요건은 현행대로 유지된다. 수직증축 리모델링의 안전성 검토 전문기관에는 기존 한국건설기술연구원·국토안전관리원에 더해 한국부동산원이 추가돼 세 곳으로 늘어난다. 장기 복무 군인의 분양가상한제 주택 거주의무 예외 확대, 지역주택조합 조합원 간 혼인 시 자격 특례도 함께 담겼다. 리모델링 관련 두 규정은 2027년 1월 1일부터 시행된다.","url":"https://www.hankyung.com/article/2026111726131"},{"n":2,"title":"오세훈 서울시장 \"재초환은 제2의 종부세…전면 재검토해야\"","meta":"2026.11.17 19:01 · 파이낸셜뉴스","body":"오세훈 서울시장은 17일 서울시의회 시정질문에서 재건축초과이익환수제에 대해 부작용이 심각해 전면 재검토해야 한다는 것이 서울시의 일관된 입장이라고 밝혔다. 오 시장은 양도소득세와의 이중과세 논란이 있고 부담금이 집값에 반영돼 상승 요인이 될 수 있다고 주장했으며, 제2의 종합부동산세 논란을 야기할 수 있다고 말했다. 재건축 분담금에 재초환 부담금까지 더해지면 일반 급여소득자나 은퇴한 고령 소유주가 집을 떠날 수밖에 없다는 우려도 내놨다. 서초구 반포현대에 179억원, 강남구 은마아파트에 1인당 평균 4억6000만원의 재건축부담금 예정액이 통지된 상태다. 주택 공급 부족 책임 논쟁에 대해서는 박원순 시정에서 정비구역 389곳이 해제돼 약 43만호의 공급 기회가 사라졌다고 반박했다.","url":"https://www.fnnews.com/news/202611171901339848"}]},{"name":"시장동향","articles":[{"n":3,"title":"자가보유율 62.0% 역대 최고…\"내 집 필요\" 응답은 3년째 하락","meta":"2026.11.17 16:56 · 뉴스1","body":"국토교통부가 17일 발표한 2025년도 주거실태조사에서 전체 가구 자가보유율은 62.0%로 2006년 조사 시작 이후 가장 높았다. 자가점유율도 59.1%로 전년보다 0.7%포인트 올랐고, 수도권 자가보유율은 55.6%에서 56.0%로 소폭 상승했다. 반면 내 집을 반드시 보유해야 한다는 응답은 85.6%로 3년 연속 낮아졌다. 주거이동률은 31.2%로 반등했고 평균 거주기간은 8.4년으로 집계됐다. 이번 조사는 전국 6만1000가구를 대상으로 이뤄졌다.","url":"https://www.news1.kr/realestate/general/6356442"},{"n":4,"title":"서울 PIR 11.7배…소득 한 푼 안 쓰고 12년 모아야 내 집 마련","meta":"2026.11.17 17:20 · 한국경제","body":"2025년도 주거실태조사에서 서울의 연소득 대비 주택가격 비율(PIR)은 11.7배로 나타났다. 소득을 전혀 쓰지 않고 약 12년을 모아야 서울에서 집을 살 수 있다는 의미다. 가구주가 된 뒤 생애 최초로 주택을 마련하기까지 걸린 기간은 7.9년에서 8.0년으로 늘어 조사 시작 이후 가장 길었다. 수도권 임차가구는 월소득의 약 20%를 임대료로 지출했고, 경기 지역 임차가구의 월소득 대비 임대료 비율은 15.2%에서 17.4%로 2.2%포인트 상승했다. 전국 자가보유율은 62.0%로 역대 최고를 기록했다.","url":"https://www.hankyung.com/article/2026111726121"}]},{"name":"정비사업","articles":[{"n":7,"title":"1.7조 광명 철산주공13단지 재건축, 현대건설 단독 응찰로 유찰","meta":"2026.11.17 17:04 · 데일리한국","body":"경기 광명 철산주공13단지 재건축조합이 17일 시공사 선정 입찰을 마감한 결과 현대건설만 입찰서를 제출해 유찰됐다. 현장설명회에는 건설사 세 곳이 참석했지만 실제 입찰에는 한 곳만 참여했다. 이 단지는 지상 49층, 3719가구로 재건축되며 공사비는 약 1조7160억원 규모다. 입찰보증금은 4000억원으로 책정됐고 컨소시엄 참여는 허용되지 않았다. 조합은 다음 주 2차 현장설명회를 열 예정이며, 다시 단독 응찰이 나오면 수의계약 전환 여부를 논의할 계획이다.","url":"https://daily.hankooki.com/news/articleView.html?idxno=1426131"},{"n":8,"title":"사당17구역 재개발 현장설명회에 대우·롯데 등 4개사 참여","meta":"2026.11.17 12:30 · 시사오늘","body":"서울 동작구 사당17구역 재개발조합이 17일 연 1차 현장설명회에 대우건설·롯데건설·제일건설·진흥기업 등 4개사가 참여했다. 이 구역은 지상 23층, 856가구 규모로 조성되며 공사비는 3.3㎡당 955만원, 총 4430억원 수준으로 추산된다. 입찰 마감은 2027년 1월 4일이며, 조합은 입찰 결과에 따라 2027년 2~3월 시공사 선정 총회를 열 계획이다. 다만 건설사들이 사업 조건과 입찰 지침을 검토 중이어서 실제 입찰 참여는 유동적이다. 사당17구역은 신속통합기획으로 2026년 1월 구역 지정, 8월 조합 설립 인가를 받아 사업 속도가 빠른 편이다.","url":"https://www.sisaon.co.kr/news/articleView.html?idxno=206135"}]},{"name":"금융/세제","articles":[{"n":9,"title":"주담대 변동금리가 고정금리 추월…차주 선택 셈법 복잡해져","meta":"2026.11.17 19:14 · 세계일보","body":"17일 기준 5대 시중은행의 6개월 변동형 주택담보대출 금리 상단이 연 6.51%로, 5년 고정형 상단 6.40%보다 0.11%포인트 높아지는 역전 현상이 나타났다. 10월 신규취급액 기준 코픽스가 연 3.62%로 2년 8개월 만에 최고치를 기록하면서 변동형 금리가 오른 반면, 고정형 기준인 5년물 은행채 금리는 4.514%에서 4.057%로 내렸기 때문이다. 한국은행의 추가 인상 가능성이 남아 있어 코픽스와 단기 은행채 금리는 더 오를 수 있다는 관측이 나온다. 반면 장기 은행채 금리는 경기 전망에 따라 방향이 불확실하다. 전문가들은 급하지 않은 주택 구입이라면 내년 초까지 관망할 것을 권했다.","url":"https://www.segye.com/newsView/20261117515501"},{"n":10,"title":"리츠협회 \"미분양 빌라·주거용 오피스텔도 CR리츠 세제 혜택 줘야\"","meta":"2026.11.17 16:03 · 한국경제","body":"한국리츠협회는 기업구조조정(CR)리츠의 취득세 감면 대상을 아파트뿐 아니라 연립·다세대주택과 주거용 오피스텔까지 넓혀 달라고 17일 건의했다. 현재는 수도권 밖에서 매입한 아파트에만 세제 혜택이 적용돼 빌라를 매입하면 취득세를 60% 더 내야 하는 등 주택 유형별로 과세가 엇갈린다는 지적이다. 협회는 지방 미분양 주택이 3만 가구에 육박하고 이 가운데 85%가 광역시 밖에 몰려 있다는 점을 근거로 들었다. 리츠가 수익의 90% 이상을 투자자에게 배당해야 하는 구조여서 재정 부담 없이 미분양을 해소할 수 있다는 주장도 폈다. 세제 지원 확대 여부는 정부 판단에 달려 있다.","url":"https://www.hankyung.com/article/202611172329i"}]},{"name":"임대주택","articles":[{"n":11,"title":"세입자 임대료 부담 8년 만에 최고…월소득의 17%를 임대료로","meta":"2026.11.18 01:10 · 서울신문","body":"국토교통부 2025년도 주거실태조사에서 전국 임차가구의 월소득 대비 월임대료 비율(RIR)은 17.0%로 전년 15.8%보다 1.2%포인트 올랐다. 조사를 매년 실시로 바꾼 2017년 이후 8년 만에 가장 높은 수치이며 1년 새 상승 폭도 2017년 이후 최대다. 서울은 21.5%로 전국에서 가장 높았고 세종 18.2%, 경기 17.4% 순이었다. 청년 임차가구는 17.4%, 신혼부부는 20.2%로 전체 평균을 크게 웃돌았다. 전세의 월세 전환이 이어지면서 임차가구의 주거비 부담이 구조적으로 커지고 있다는 분석이 나온다.","url":"https://www.seoul.co.kr/news/economy/2026/11/18/20261118032001"},{"n":12,"title":"올해 서울 아파트 전셋값 상승률 작년의 3.7배…평균 6억4538만원","meta":"2026.11.18 05:45 · 뉴스1","body":"한국부동산원 집계 결과 올해 1~10월 서울 아파트 전세가격지수 누적 상승률은 9.03%로 지난해 같은 기간 2.42%의 약 3.7배에 달했다. 지난달 서울 아파트 평균 전셋값은 6억4538만원으로 1년 전 5억8298만원보다 6240만원(10.7%) 올랐다. 대출 규제로 매수 자금을 마련하지 못한 수요가 계약 갱신 등으로 전세시장에 남으면서 수요가 누적된 영향이다. 갭투자가 사라져 임대 목적의 주택 공급이 줄어든 점도 전세 매물 부족을 키웠다. 입주 물량 감소까지 겹쳐 전셋값 상승 압력이 당분간 이어질 것이라는 전망이 나온다.","url":"https://www.news1.kr/realestate/general/6356698"}]},{"name":"택지/도시개발","articles":[{"n":14,"title":"서울시, 18일 도심복합사업 사전기획협의체 개최…국토부와 갈등 봉합","meta":"2026.11.17 16:58 · 아시아경제","body":"도심공공주택복합사업 지연 책임을 두고 국토교통부와 충돌했던 서울시가 18일 8개 사업지에 대한 사전기획협의체를 열기로 했다. LH는 17일 서울시와 국토부, 관할 자치구에 협의체 개최 요청 공문을 전달했다. 서울시와 국토부는 쟁점이었던 용적률 완화 범위에 대해 상당 부분 이견을 좁힌 것으로 알려졌다. 협의가 지연된 8개 지구의 주택 공급 규모는 모두 1만5993가구다. 협의체 개최로 도시계획 절차가 재개되면 해당 물량의 공급에 속도가 붙을 전망이다.","url":"https://view.asiae.co.kr/article/2026111716445817500"}]},{"name":"주택품질/안전","articles":[{"n":15,"title":"안성 아파트 공사현장 18층에서 불…작업자 12명 자력 대피","meta":"2026.11.17 11:11 · 인천일보","body":"17일 오전 9시 59분쯤 경기 안성시 옥산동 아파트 공사현장 18층에서 불이 났다. 현장에 있던 12명이 스스로 대피했으며, 소방당국은 장비 28대와 인력 57명을 투입해 오전 10시 45분 불을 완전히 껐다. 화재 발생 46분 만의 진화였다. 소방당국은 인명피해 여부를 확인하고 있다고 밝혔다. 정확한 화재 원인과 피해 규모는 조사가 진행되고 있다.","url":"https://www.incheonilbo.com/news/articleView.html?idxno=1336991"},{"n":16,"title":"거실을 침실로 바꾸고 AI가 냉난방 조절…건설사 미래 아파트 경쟁","meta":"2026.11.17 17:22 · 한국경제","body":"GS건설이 인공지능과 가변형 공간 기술을 결합한 미래 주거상품 비욘드 리빙을 공개했다. LG전자와 함께 개발한 AI 홈은 거주자 상황을 인식해 조명과 냉난방, 환기를 자동 제어하며 2027년 하반기부터 단계적으로 적용될 예정이다. 삼성물산과 현대건설, 대우건설도 가변형 구조와 AI 기술 개발에 나서고 있다. 인구구조와 생활방식 변화로 주거 편의성과 서비스가 아파트 브랜드 경쟁력을 가르는 요소로 떠올랐다는 평가가 나온다. 건설사들은 기후 대응 기술까지 포함한 주거 솔루션 개발 경쟁을 벌이고 있다.","url":"https://www.hankyung.com/article/2026111726101"}]},{"name":"분양정보","articles":[{"n":17,"title":"연말까지 영·호남에 1.9만가구 분양…호남 물량 6배로 급증","meta":"2026.11.17 17:21 · 한국경제","body":"이달과 다음 달 영남·호남에서 분양 예정인 민간 아파트는 1만8992가구로 집계됐다. 영남이 1만2011가구로 지난해 같은 기간보다 29.7% 늘었고, 부산이 4461가구로 가장 많다. 호남은 6981가구로 지난해 같은 기간의 6배를 웃도는 수준이다. 호반건설은 부산 동구에 호반써밋 초량을 공급하고, 대우건설은 경북도청 신도시 인근에 푸르지오 단지를 선보인다. 두산건설과 현대엔지니어링 등도 연말 분양을 준비하고 있다.","url":"https://www.hankyung.com/article/2026111726171"}]},{"name":"논설/사설","articles":[{"n":20,"title":"[톡톡! 부동산] 월급의 5분의 1이 집세…결혼도 출산도 가로막는 월세의 덫","meta":"2026.11.17 16:32 · 핀포인트뉴스","body":"2025년도 주거실태조사를 근거로 월세 부담이 청년과 신혼부부의 생애 설계를 가로막고 있다고 지적한 칼럼이다. 신혼부부 임차가구의 월소득 대비 임대료 비율은 20.2%로 1년 새 2.5%포인트 올랐고, 청년 임차가구도 17.4%, 서울은 21.5%에 이른다고 짚었다. 임차가구의 평균 거주기간은 3.7년으로 자가가구 11.5년에 크게 못 미쳐 주거 불안정도 함께 커졌다고 봤다. 필자는 청년들이 결혼을 미루는 이유로 경제적 여건에 이어 보증금을 포함한 주택 마련의 어려움을 꼽았다는 조사 결과를 들어 주거비가 인구 문제와 직결된다고 주장했다. 생애 최초 주택 마련 기간이 8.0년으로 역대 최장이고 서울 PIR이 11.7배라는 점도 근거로 제시했다.","url":"https://www.pinpointnews.co.kr/news/articleView.html?idxno=505127"}]}]},{"date":"2026-11-17","count":15,"pdf_count":22,"highlights":[{"n":1,"text":"홍지선 국토부 장관, 국내 최대 모듈러 공공주택 현장 점검…2030년까지 2만 가구 발주"},{"n":4,"text":"서울 집값 석 달째 상승폭 둔화…경기 상승률이 서울 추월"},{"n":10,"text":"목동4단지도 현대건설 단독 응찰로 유찰…목동 6개 단지 모두 무경쟁"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"홍지선 국토부 장관, 국내 최대 모듈러 공공주택 현장 점검…2030년까지 2만 가구 발주","meta":"2026.11.16 16:38 · 이투데이","body":"홍지선 국토교통부 장관이 16일 세종시 5-1 생활권 L5블록 통합공공임대주택 건설현장을 찾아 모듈러 공법 시공 과정을 점검했다. 이 사업은 전체 1327가구 가운데 450가구를 모듈러 공법으로 짓는 국내 최대 규모로, 공동주택에 스마트 턴키 방식이 처음 적용됐다. 국토부는 2027년부터 2030년까지 공공주택 모듈러 발주 물량을 2만 가구로 확대하고, 일반 공법보다 비싼 공사비를 호당 3500만원씩 지원하겠다고 밝혔다. 홍 장관은 모듈러 공법이 건설산업을 노동 중심에서 기술 중심으로 바꾸고 공사기간도 크게 줄일 수 있는 핵심 대안이라고 평가했다. 정부는 모듈러 특별법 제정도 함께 추진하고 있다.","url":"https://www.etoday.co.kr/news/view/2648835"},{"n":2,"title":"재초환 부과 시한 해석 놓고 국토부 고심…이달 중 법령해석 내놓기로","meta":"2026.11.16 17:40 · 머니투데이방송","body":"서초구청이 반포현대 재건축조합에 재건축초과이익환수 부담금 예정액 179억원을 통보하면서 부과 시한을 둘러싼 법 해석 논란이 커지고 있다. 조합원 80명 기준으로 1인당 평균 2억2000만원이 넘는 금액이다. 준공 후 5개월이 지난 시점부터 5년이 지나면 부과할 수 없다는 규정을 적용하면 올해 12월까지 부과해야 하지만, 2년 전 개정법의 특례를 적용하면 2029년 8월까지 가능하다는 해석도 나온다. 적용 방식에 따라 부과 시한이 최대 2년 8개월가량 달라진다. 국토교통부 장관은 재초환이 주택가격 안정과 과도한 재산권 침해 사이의 균형 문제라고 언급했고, 국토부는 이달 안에 법령 해석을 발표하기로 했다.","url":"https://news.mtn.co.kr/article/2026111616105037897"}]},{"name":"시장동향","articles":[{"n":4,"title":"서울 집값 석 달째 상승폭 둔화…경기 상승률이 서울 추월","meta":"2026.11.16 14:00 · 이투데이","body":"한국부동산원이 16일 발표한 10월 전국주택가격동향조사에 따르면 서울 주택 매매가격은 0.65% 올라 7월 1.09%, 8월 0.97%, 9월 0.84%에 이어 석 달 연속 오름폭이 줄었다. 강남구(-1.24%)와 서초구(-0.75%)는 석 달 연속 하락한 반면 서대문구(1.35%)와 노원구(1.34%)는 1% 넘게 올라 지역별 온도차가 뚜렷했다. 부동산원은 일부 지역에서 하락 매물이 나오며 조정 거래가 발생한 반면 선호 지역에서는 상승 계약이 체결돼 상승과 하락이 혼재했다고 설명했다. 경기는 0.66% 올라 전월(0.63%)보다 오름폭이 커지며 서울을 앞질렀고, 아파트만 보면 경기(0.87%)가 서울(0.54%)을 크게 웃돌았다. 전·월세도 화성 동탄과 수원 영통구 등 주거 선호지역을 중심으로 상승세가 이어졌다.","url":"https://www.etoday.co.kr/news/view/2648598"},{"n":5,"title":"서울 연립·다세대 상승률, 아파트 웃돌았다…올해 누적 격차도 좁혀","meta":"2026.11.16 14:21 · 파이낸셜뉴스","body":"10월 서울 연립·다세대주택 매매가격은 0.85% 올라 아파트(0.54%)와 단독·다가구(0.49%)를 모두 앞질렀다. 올해 누적 상승률은 아파트 8.90%, 연립·다세대 8.25%로 격차가 0.65%p까지 좁혀졌다. 지난해 같은 기간과 비교하면 연립·다세대의 상승폭 확대(4.82%p)가 아파트(1.73%p)보다 훨씬 컸다. 아파트값 부담과 대출 규제로 밀려난 수요가 상대적으로 저렴한 빌라로 옮겨간 영향으로 풀이된다. 전세와 월세는 역세권·대단지를 중심으로 아파트 상승률이 가장 높게 나타났다.","url":"https://www.fnnews.com/news/202611161049080983"}]},{"name":"정비사업","articles":[{"n":10,"title":"목동4단지도 현대건설 단독 응찰로 유찰…목동 6개 단지 모두 무경쟁","meta":"2026.11.16 15:53 · 아주경제","body":"목동신시가지 4단지 재건축 시공사 선정 1차 입찰이 16일 마감됐으나 현대건설만 단독 응찰해 유찰됐다. 4단지 예정 공사비는 1조6389억원으로 3.3㎡당 1010만원인데, 목동 재건축 단지 가운데 처음으로 1000만원을 넘겼다. 그럼에도 목동 6개 단지가 모두 첫 입찰에서 단독 응찰로 유찰되면서 조합이 여러 건설사의 공사비와 설계 조건을 비교하기 어려워졌다. 무경쟁 입찰이 반복되면 조합의 협상력이 약해지고 공사비 인상 시 주민 부담이 커질 수 있다는 우려가 나온다. 조합은 재입찰을 거쳐 내년 2월 안에 시공사 선정 총회를 여는 것을 목표로 하고 있다.","url":"https://www.ajunews.com/view/20261116152022576"},{"n":11,"title":"대우건설, 여의도 화랑아파트 재건축 수주…여의도 두 번째 사업지","meta":"2026.11.16 16:09 · 조세금융신문","body":"대우건설이 서울 영등포구 여의도동 화랑아파트 소규모재건축사업 시공사로 선정됐다. 공작아파트에 이은 두 번째 여의도 정비사업 수주로, 총공사비는 2749억원 규모다. 지하 4층~지상 최고 49층, 1개 동, 268가구로 지어지며 단지명으로 '써밋 더 한강'을 제안했다. 네덜란드 건축설계그룹 UN스튜디오가 설계에 참여했고 모든 가구에서 한강을 볼 수 있도록 배치했으며, 천장고는 일반 아파트보다 높은 2.7~3.7m를 적용한다. 대우건설은 여의도 장미아파트 재건축 수주에도 적극 나설 계획이라고 밝혔다.","url":"https://www.tfmedia.co.kr/news/article.html?no=208932"}]},{"name":"금융/세제","articles":[{"n":13,"title":"코픽스 2년 8개월 만에 최고…17일부터 변동형 주담대 금리 인상","meta":"2026.11.16 15:56 · 한국일보","body":"10월 신규취급액 기준 코픽스가 연 3.62%로 전월보다 0.19%포인트 올라 7개월 연속 상승하며 2년 8개월 만에 최고 수준을 기록했다. 이에 따라 KB국민은행은 17일부터 코픽스 연동 주택담보대출 변동금리(6개월)를 연 4.66~6.06%에서 4.85~6.25%로 올린다. 우리은행도 같은 기준 금리를 연 4.85~6.05%에서 5.04~6.24%로 인상한다. 우리은행의 경우 변동형 금리가 5년 고정형(4.94~6.14%)을 웃도는 이례적인 역전 현상이 나타났다. 변동형 주담대는 통상 6개월마다 금리가 재산정돼 재산정 시점을 맞은 차주들의 이자 부담이 커질 전망이다.","url":"https://www.hankookilbo.com/news/article/A2026111615170000104"},{"n":14,"title":"은행권, 새해 주담대 수요 선점 나서…신용대출 빗장은 더 조여","meta":"2026.11.16 16:49 · 머니투데이","body":"KB국민은행을 제외한 NH농협·하나·우리·신한 등 4대 시중은행이 모기지보험 가입 제한을 풀면서 주택담보대출 취급을 다시 늘리고 있다. 내년 1월 새 가계대출 총량이 배정되는 것을 앞두고 선제적으로 주담대 수요를 확보하려는 전략으로 풀이된다. 반면 신용대출은 규제를 강화해 우리은행은 개인 신용대출 한도 증액을 전면 중단했다. 증시 조정 이후 반등을 노린 이른바 '빚투' 수요가 신용대출 증가를 부추긴다는 우려 때문이다. 11월 13일 기준 5대 은행 신용대출은 6832억원 늘어 주담대 증가액(4358억원)을 크게 웃돌았다.","url":"https://www.mt.co.kr/finance/2026/11/16/2026111616072335425"}]},{"name":"임대주택","articles":[{"n":16,"title":"같은 단지인데 신규·갱신 전셋값 6.6억 격차…전세 매물 줄자 부담 확대","meta":"2026.11.16 13:20 · 뉴스1","body":"서울 강동구 올림픽파크포레온에서 신규 전세보증금과 갱신 전세보증금의 차이가 6억5500만원까지 벌어졌다. 같은 단지에서 신규 계약은 16억원대, 갱신 계약은 9억4500만원대에 체결되고 있다. 전세 매물이 계속 줄면서 서울 전세수급지수는 120.2를 기록해 수요가 공급을 크게 웃돌고 있다. 갱신권 사용과 월세화가 겹치며 신규로 집을 구해야 하는 세입자의 부담이 커지는 구조다. 업계에서는 반포 등 분양 대기 수요가 매수로 전환할 가능성도 제기된다.","url":"https://www.news1.kr/realestate/general/6355277"},{"n":17,"title":"오피스텔 월세는 뛰는데 분양은 미달…시장 온도차 뚜렷","meta":"2026.11.16 15:51 · 이투데이","body":"오피스텔 월세가격은 오르고 있지만 신규 분양시장에서는 청약 미달이 잇따르고 있다. 서울 영등포구 'GD 메트로 타워'는 770실 모집에 99건만 접수돼 평균 경쟁률이 0.13대 1에 그쳤다. 아파트 대출 규제에 따른 대체 수요가 입지와 분양가, 상품성을 따져 선별적으로 움직이고 있다는 분석이다. 서울 오피스텔 월세가격은 1.02% 올랐지만 매매가격 상승률은 0.07%로 둔화했다. 전문가들은 모든 오피스텔이 아니라 방 2~3개를 갖춘 아파트 대체형 중심으로 가격이 오르고 있다고 설명했다.","url":"https://www.etoday.co.kr/news/view/2648662"}]},{"name":"택지/도시개발","articles":[{"n":18,"title":"LH 흑자 전환했지만 부채 185조…공급 확대와 조직 개혁 동시 과제","meta":"2026.11.17 06:00 · 뉴스핌","body":"한국토지주택공사(LH)는 상반기 매출 9조3626억원으로 전년 대비 37% 늘고 영업이익 3955억원을 거두며 흑자로 돌아섰다. 그러나 부채는 185조7048억원으로 12조원 늘었고 부채비율도 230.8%에서 237.5%로 높아졌다. 직접 주택 건설과 임대주택 공급이 늘면서 초기 사업비 부담이 커졌고, 임대주택 사업에서는 수입보다 1조4652억원 많은 원가 부담이 이어지고 있다. 2030년까지 부채가 372조원대로 늘고 연간 지급이자도 3조원에서 7조원으로 두 배 이상 불어날 것으로 전망된다. 이성훈 사장은 공급 확대를 위한 자금 조달과 조직 분리 개혁 완수라는 이중 과제를 안게 됐다.","url":"https://www.newspim.com/news/view/20261116001117"}]},{"name":"주택품질/안전","articles":[{"n":19,"title":"경산·포항 아파트에서 밤사이 화재 잇따라…주민 8명 부상","meta":"2026.11.16 08:38 · 경향신문","body":"경북 지역에서 밤사이 아파트 화재가 두 건 발생해 모두 8명이 다쳤다. 경산시 백천동 15층 아파트 10층에서 불이 나 허벅지에 2도 화상을 입은 1명과 연기를 마신 7명이 병원으로 옮겨졌다. 이 불로 주민 138명이 대피했으며 소방관들이 거동이 불편한 주민 38명을 직접 업어 구조했다. 포항시 북구 45층 아파트 42층에서도 보조배터리 발화로 추정되는 불이 났으나 25명이 안전하게 대피해 인명피해는 없었다. 경찰과 소방당국이 두 화재의 정확한 원인을 조사하고 있다.","url":"https://www.khan.co.kr/article/202611160838001/"}]},{"name":"분양정보","articles":[{"n":20,"title":"쇼핑시설 낀 '몰세권' 단지 몸값 급등…연말 분양도 잇따라","meta":"2026.11.16 09:48 · 파이낸셜뉴스","body":"백화점·복합쇼핑몰·아웃렛을 끼고 있는 아파트값이 분양가의 3~4배 이상으로 뛰며 신고가를 경신하고 있다. 동탄역 롯데캐슬 전용 84㎡는 2017년 4억7200만원에서 현재 22억원대에 거래되고 있고, 광명역파크자이도 약 3.3배 올랐다. 영등포와 대구의 이른바 몰세권 단지들은 청약에서 60~100대 1의 높은 경쟁률을 기록했다. 백화점과 쇼핑몰이 단순 구매 공간을 넘어 문화·여가를 함께 즐기는 생활 거점으로 바뀌면서 선호도가 높아졌다는 분석이다. 연말까지 영등포, 안산, 평택 등에서 쇼핑시설 인근 단지 분양이 예정돼 있다.","url":"https://www.fnnews.com/news/202611160944143340"}]},{"name":"논설/사설","articles":[{"n":21,"title":"[사설] 지방 재건축 '재초환' 손질 필요하다","meta":"2026.11.16 17:06 · 중도일보","body":"사설은 재건축초과이익환수제가 수도권 투기 억제를 위해 도입된 제도인 만큼 지방 재건축에 그대로 적용하는 것은 부적절하다고 주장했다. 미실현 이익에 부담금을 매기는 것은 과잉금지 원칙에 어긋난다며 비수도권 재건축은 대상에서 제외해야 한다고 했다. 지방은 주택가격 상승폭이 작아 정상주택가격상승분 공제액도 적어 부담금이 상대적으로 과도해진다는 점을 근거로 들었다. 사업성 악화로 재건축이 지연되거나 중단되면 도시 내 주택 공급이 위축될 수 있다고 지적했다. 수도권과 지방의 사업 수익 구조 차이가 큰 만큼 동일 기준 적용은 불합리하다며 제도 개선을 촉구했다.","url":"https://www.joongdo.co.kr/web/view.php?key=20261116010005519"},{"n":22,"title":"[편집국에서] 집은 남아도는데 집값은 계속 오른다","meta":"2026.11.16 17:02 · 중도일보","body":"칼럼은 대전 선호 지역 아파트 호가가 30억원대까지 오르며 서울 수준의 가격대를 형성하고 있다고 지적했다. 집은 넘쳐나는데 일부 지역의 집값만 오르는 역설적 현상이 벌어지고 있다는 진단이다. 지역별 주거 선호도 차이가 뚜렷해지면서 선호 지역은 진입 장벽이 높아지고 비선호 지역에는 미분양이 쌓이는 악순환이 나타난다고 봤다. 필자는 지역별 수급 상황을 세밀하게 분석해 미분양 집중 지역과 수요 지역에 맞는 차별화된 공급 정책이 필요하다고 주장했다. 아울러 원도심의 기반시설과 교육 인프라를 확충해 주거 경쟁력을 높여야 한다고 제언했다.","url":"https://www.joongdo.co.kr/web/view.php?key=20261116010005347"}]}]},{"date":"2026-11-16","count":15,"pdf_count":24,"highlights":[{"n":1,"text":"국토부 \"토허제·규제지역 연장 12월 결론…재초환 부과시기는 이달 중 정리\""},{"n":4,"text":"'성동·강동구 하락' 한강벨트까지 냉기 번졌다"},{"n":7,"text":"재초환 '날벼락'에…재건축 조합장들 한자리에 모인다"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"국토부 \"토허제·규제지역 연장 12월 결론…재초환 부과시기는 이달 중 정리\"","meta":"2026.11.13 15:53 · 뉴스핌","body":"국토교통부는 11월 13일 정부서울청사에서 제3차 주택공급 정례브리핑을 열고 서울 전역과 경기 12개 시·군·구에 지정된 토지거래허가구역, 투기과열지구, 조정대상지역의 연장 여부를 12월 중 결론 내겠다고 밝혔다. 김영국 주택토지실장은 토허제 지정 이후 시장과 국민에게 미친 영향을 종합 분석 중이라고 설명했다. 정우진 주택공급추진본부장은 재건축초과이익환수제 부담금 부과기한 논란에 대해 법제처 유권해석을 거쳐 이달 안에 결론을 내겠다며 현장 혼란이 심해 조속히 정리할 필요가 있다고 말했다. 국토부는 재개발·재건축 알박기 대응책으로 보상 후 미퇴거 시 이행강제금을 물리고 협조 주민에게는 장려금을 주는 방안도 검토 중이라고 덧붙였다.","url":"https://www.newspim.com/news/view/20261113001166"},{"n":2,"title":"정부 \"서울 집값 하향 안정 중\"…수도권 내년 3월까지 4만4000가구 입주","meta":"2026.11.13 17:43 · 경향신문","body":"정부는 11월 13일 주택공급 정례브리핑에서 서울 주택시장에 하향 안정 신호가 늘고 있다고 진단했다. 근거로 강남·서초구 아파트값이 14주 연속 하락한 점과 11월 11일 기준 서울 아파트 매매 매물이 8만 건을 넘어 연초보다 40% 이상 늘어난 점을 제시했다. 정부는 서울을 포함한 수도권에서 이달부터 내년 1분기까지 아파트 4만4000가구가 입주한다고 밝혔다. 연말까지 1만6000가구, 내년 1분기 2만8000가구가 집들이에 나서며 이 가운데 서울 물량은 내년 1분기 약 6000가구다.","url":"https://khan.co.kr/article/202611131743001"}]},{"name":"시장동향","articles":[{"n":4,"title":"'성동·강동구 하락' 한강벨트까지 냉기 번졌다","meta":"2026.11.14 08:00 · 비즈워치","body":"서울 집값 조정이 강남3구를 넘어 한강벨트로 번지고 있다. 한국부동산원 주간 통계에서 성동구는 32주 만에 0.02% 하락하며 마이너스로 돌아섰고 강동구도 33주 만에 0.01% 내렸다. 송파구는 하락폭이 0.35%로 커졌다. 반면 경기 남부는 반도체 호재를 등에 업고 수원 영통구 0.60%, 군포 0.56%, 화성 동탄구 0.56% 등 강세를 이어갔다. 업계에서는 매수세 위축에 따른 조정이라는 해석과 수도권 하방 경직성이 유지될 것이라는 전망이 엇갈린다.","url":"https://news.bizwatch.co.kr/article/real_estate/2026/11/13/0054"},{"n":5,"title":"\"한 달 새 4억 내렸는데도 안 팔려\"…강남벨트 거래 절벽","meta":"2026.11.14 12:22 · 서울경제","body":"강남권 일부 단지에서 호가를 크게 낮춘 매물이 나오고 있지만 거래가 좀처럼 성사되지 않고 있다. 10월 서울 아파트 거래량은 3724건으로 1년 전 8533건보다 56.3% 줄었다. 성동구는 59건으로 84%, 강동구는 169건으로 69% 급감했다. 성동구와 강동구 아파트값이 각각 32주·33주 만에 하락 전환한 것도 거래 급감에 따른 조정이라는 분석이 많다. 반면 서울 외곽에서는 15억원 이하 단지를 중심으로 매수세가 이어지며 상승세가 계속되고 있다.","url":"https://www.sedaily.com/NewsView/20114310"}]},{"name":"정비사업","articles":[{"n":7,"title":"재초환 '날벼락'에…재건축 조합장들 한자리에 모인다","meta":"2026.11.13 15:24 · 파이낸셜뉴스","body":"재건축초과이익환수제 부담금 통지가 본격화되면서 전국 재건축 조합장들이 공동 대응에 나선다. 전국 20여 개 단지 조합장들은 11월 19일 서울 서초구에 모여 재초환 폐지를 위한 법적 대응 방안을 논의하기로 했다. 서울뿐 아니라 경기·대전·대구·부산 조합장들이 참여하며 반포 현대, 신반포 시리즈, 철산주공, 대구 범어우방 등이 포함됐다. 서초구는 이미 국토교통부에 재초환 폐지 탄원서를 전달했고, 서울에서만 46개 단지가 부담금 부과 예상 대상으로 꼽힌다.","url":"https://www.fnnews.com/news/202611131524554357"},{"n":8,"title":"\"집 팔고 나가라는 거냐\"…은마 '4억6334만원 청구서'에 반발","meta":"2026.11.14 10:30 · 한국경제","body":"서울 강남구 대치동 은마아파트 재건축 조합원들이 가구당 평균 4억6334만원의 재초환 부담금 예정액을 통보받았다. 논란의 핵심은 부담금 산정에 쓰인 종료시점 주택가액이다. 현재 32억원으로 평가된 주택이 완공 시점인 2035년 81억원이 될 것으로 가정됐는데, 이는 연평균 9.67% 상승을 전제한 수치다. 조합원들은 정부가 집값 안정을 말하면서 부담금 산정에는 높은 상승률을 적용했다고 반발하고 있다. 실거주 고령층이 미실현 이익에 대한 현금 납부 탓에 매도로 내몰린다는 지적도 나온다.","url":"https://www.hankyung.com/article/2026111348856"}]},{"name":"금융/세제","articles":[{"n":12,"title":"금융위, 주택 PF 밀착관리 2028년 착공 사업장까지 확대","meta":"2026.11.13 10:51 · 이투데이","body":"금융위원회는 주택공급 정례브리핑에서 부동산 PF 밀착관리 대상을 내년 착공·준공 예정 사업장에서 2028년 예정 사업장까지 넓히겠다고 밝혔다. 9월 말 기준 밀착관리 대상 주거용 PF 사업장은 279곳, 16만8000가구 규모다. 지원을 희망한 64곳 가운데 8곳의 자금 애로를 해소했으며 이들 물량은 약 6000가구다. 서울 신촌 사업장은 한국자산관리공사 펀드에서 760억원을 투자받았고, PF 공동대출 1조원도 추가 조성됐다. 금융위는 사업장마다 금융감독원·금융기관 담당자를 1명씩 지정해 인허가와 자금 조달을 함께 챙기기로 했다.","url":"https://www.etoday.co.kr/news/view/2647825"},{"n":13,"title":"가계대출 다시 증가…10월 주택담보대출 4조원 늘어","meta":"2026.11.15 12:00 · 비즈워치","body":"10월 전 금융권 가계대출이 6조4000억원 늘며 한 달 만에 증가세로 돌아섰다. 9월에는 2조2000억원 감소했으나 10월 들어 반등했다. 주택담보대출 증가폭이 3조2000억원에서 4조원으로 커진 것이 주된 요인이고, 신용대출도 9월 2조9000억원 감소에서 10월 1조2000억원 증가로 전환했다. 5대 은행의 10월 말 가계대출 잔액은 783조6000억원으로 한 달 새 2조8000억원 늘었다. 은행들이 내년 1월 실행분부터 모기지보험 가입 제한을 푸는 등 대출 빗장을 단계적으로 풀고 있어 증가세가 이어질지 주목된다.","url":"https://news.bizwatch.co.kr/article/finance/2026/11/13/0028"}]},{"name":"임대주택","articles":[{"n":15,"title":"정부 안정 진단에도…수도권 전세 수급 불균형은 여전","meta":"2026.11.15 16:51 · 아시아투데이","body":"정부는 서울 전월세 매물 증가를 시장 안정 신호로 평가했지만 수도권 전세 수급 불균형은 계속되고 있다. 11월 2주 기준 경기 전세수급지수는 110.7로 5년여 만에 최고 수준이고 서울은 120.2, 인천은 110.4를 기록했다. 모두 기준선 100을 웃돌아 전세를 구하려는 수요가 매물보다 많다는 뜻이다. 경기에서는 서해안권 117.0, 경부1권 116.2 등 수요 우위가 두드러졌다. 정부는 내년 1분기까지 수도권 4만4000가구 입주와 공공분양·임대 10만가구 공급으로 시장을 달래겠다는 방침이다.","url":"https://www.asiatoday.co.kr/kn/view.php?key=20261115010005486"},{"n":16,"title":"전월세 물가 1.4% 상승…3년10개월 만에 최대폭","meta":"2026.11.16 00:19 · 국민일보","body":"지난달 전월세 소비자물가가 1년 전보다 1.4% 올라 3년 10개월 만에 가장 큰 폭으로 상승했다. 월세는 1.5% 올라 12년 10개월 만에 최고치를 기록했고 전세도 1.4% 상승했다. 지역별로는 울산 2.4%, 서울 2.1%, 세종 1.6% 순으로 오름폭이 컸다. 신규 입주물량 감소와 전세 매물 부족이 원인으로 꼽힌다. 9월 신규 전세자금대출 금리도 연 4.57%로 전월보다 0.22%포인트 올라 세입자 부담이 가중되고 있다.","url":"https://www.kmib.co.kr/article/20261115501358"}]},{"name":"택지/도시개발","articles":[{"n":17,"title":"LH, 하반기 1.6조 민간참여 공공주택 공모…모듈러 대단지 2곳 포함","meta":"2026.11.16 06:00 · 대한경제","body":"한국토지주택공사가 11월 13일 제5차 민간참여 공공주택사업 공모를 공고했다. 남양주왕숙2, 수원당수, 고양창릉, 시흥거모 일대 6개 블록 5782가구로 사업비는 1조6118억원 규모다. 3개 패키지로 나뉘며 남양주왕숙2 555가구와 고양창릉 668가구에는 모듈러 공법 적용이 의무화됐다. LH는 다음 달까지 4개 블록 약 3000가구(9000억원)를 추가 공모해 하반기 총 10개 블록 9000여 가구를 발주할 계획이다. 연내 사업자를 뽑아 2027년 착공하는 것이 목표다.","url":"https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611131505332890963"},{"n":18,"title":"3기 신도시 공급 가시화…사업 지연·인프라 부족은 '변수'","meta":"2026.11.15 13:56 · 아이뉴스24","body":"3기 신도시 가운데 인천 계양이 12월 1285가구로 첫 입주를 시작한다. 공공분양 747가구와 신혼희망타운 538가구로 구성된다. 이어 부천 대장이 내년 11월 1640가구, 고양 창릉이 내년 12월 2089가구, 하남 교산이 2029년 6월 입주할 예정이다. 다만 남양주 왕숙2는 A-6블록 21개월, A-7블록 16개월 등 총 1063가구 규모의 건설 일정이 밀렸다. 계양은 12월 입주가 시작되지만 첫 초등학교 개교는 2029년 3월이어서 기반시설 공백 문제가 과제로 남는다.","url":"https://www.inews24.com/view/2026063"}]},{"name":"주택품질/안전","articles":[{"n":19,"title":"국토부, 겨울철 건설현장 2946곳 안전점검…아파트 현장이 32%","meta":"2026.11.16 06:00 · 노컷뉴스","body":"국토교통부가 11월 16일부터 12월 24일까지 전국 건설현장 2946곳을 대상으로 동절기 안전점검에 나선다. 국토부와 5개 지방국토관리청, LH, 국토안전관리원 등 12개 기관이 참여한다. 점검 대상은 SOC 42%, 아파트 32%, 일반 건축물 26%로 구성돼 주거용 현장이 3분의 1을 차지한다. 가설비계·안전난간 등 임시시설물 관리, 한중콘크리트 보온 양생, 흙막이 가시설 동결 변형, 추락방지 시설 등을 집중 확인한다. 국토부는 안전·품질관리 미흡이나 부실시공이 확인되면 벌점과 과태료를 예외 없이 부과하겠다고 밝혔다.","url":"https://www.nocutnews.co.kr/news/6606747"}]},{"name":"분양정보","articles":[{"n":21,"title":"씨 마른 강남권 분양…서울 1순위 청약자 4년 만에 최저","meta":"2026.11.15 10:05 · 헤럴드경제","body":"올해 서울 아파트 1순위 청약 신청자가 11월 11일 기준 15만5890명으로 지난해 같은 기간 30만3218명보다 48.6% 줄었다. 2022년 이후 4년 만의 최저치다. 청약 수요가 몰리는 강남3구 일반분양이 서초구 잠원동 오티에르 반포 43가구와 서초동 아크로드서초 30가구 등 2개 단지 73가구에 그쳐 전년 652가구 대비 88.8% 급감한 영향이 컸다. 공급이 줄면서 경쟁은 오히려 치열해져 강남3구 1순위 평균 경쟁률은 870.0대 1로 전년 285.5대 1의 3배가 됐다. 아크로드서초는 30가구 모집에 3만2973명이 몰려 1099.1대 1을 기록했다.","url":"https://biz.heraldcorp.com/article/10937347"}]},{"name":"논설/사설","articles":[{"n":23,"title":"[사설] 집값은 하락 조짐, 전·월세는 급등…엇갈린 주택시장","meta":"2026.11.13 11:00 · 아시아경제","body":"사설은 강남 하락세와 서울 외곽 상승폭 둔화에도 서울 아파트값이 92주 연속 올랐다는 점에서 하락기 진입을 말하기는 이르다고 짚었다. 반면 올해 1~9월 서울 아파트 전셋값이 8.21% 올랐고 성북구 13.58%, 노원구 12.96% 등 비강남권 상승폭이 컸다는 점을 문제로 지목했다. 갱신계약 비중이 늘어난 것도 세입자의 선택권이 넓어져서가 아니라 이사할 대체 물량이 없기 때문일 수 있다고 봤다. 중장기 임대주택 공급 계획만으로는 당장의 전·월세 부담을 덜기 어려운 만큼 입주가 부족한 지역부터 임대 물량을 확보하고 실거주 의무·대출 규제의 부작용을 점검해야 한다고 주장했다.","url":"https://view.asiae.co.kr/article/2026111309440783536"}]}]},{"date":"2026-11-13","count":15,"pdf_count":27,"highlights":[{"n":1,"text":"홍지선 국토부 장관 \"재초환, 집값 안정 효과와 재산권 침해 함께 검토\""},{"n":6,"text":"한강벨트도 꺾였다…성동·강동 8개월 만에 하락 전환"},{"n":12,"text":"억대 재초환 부담금 통지 본격화…\"산정 방식부터 손봐야\""}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"홍지선 국토부 장관 \"재초환, 집값 안정 효과와 재산권 침해 함께 검토\"","meta":"2026.11.12 17:11 · 파이낸셜뉴스","body":"홍지선 국토교통부 장관은 11월 12일 국회 국토교통위원회 전체회의에서 재건축초과이익환수제(재초환) 폐지론에 대해 \"재초환 자체가 무조건 옳다, 그르다 판단할 사항은 아니다\"라며 신중한 입장을 밝혔다. 홍 장관은 재초환이 주택시장 가격 안정화 효과가 분명히 있지만 개인 재산권 침해 소지도 있는 만큼 종합적으로 검토할 필요가 있다고 말했다. 현재 폐지안이 국회에 계류 중인 상태로, 논의가 진행되면 국토부도 의견을 제시하겠다고 덧붙였다. 시장 진단과 관련해서는 매물이 쌓이고 거래가 줄어드는 현상을 하락기 진입 신호로 볼 수 있다고 설명했으며, 강남 3구는 이미 하락세라고 했다. 전월세 안정책으로는 충분한 주택공급이 근본 대책이라며 수도권 임대주택 공급을 지속 확충하겠다고 밝혔다.","url":"https://www.fnnews.com/news/202611121703534064"},{"n":2,"title":"'주거중심형' 도심복합 운영기준 이달 발표 전망…대로변 50% 동의 검토","meta":"2026.11.13 06:05 · 뉴스1","body":"서울시가 주거중심형 도심공공주택복합사업의 운영기준을 이르면 11월 말 공개할 것으로 전해졌다. 검토안에는 사업구역 둘레의 8분의 1 이상이 간선도로 등 대로에 접해야 한다는 요건이 담긴 것으로 알려졌다. 대로변에 접한 토지·건물 소유자에 대해서는 별도로 50% 이상의 동의를 받도록 하는 방안도 함께 논의되고 있다. 업계에서는 대로변 건물주 설득이 사업 성패를 가르는 변수가 될 수 있다며 동의 요건이 높으면 사업 추진이 제약될 수 있다고 우려한다. 서울시는 아직 확정된 내용은 없다며 기준이 검토 단계에 있다고 설명했다.","url":"https://www.news1.kr/realestate/general/6352284"}]},{"name":"시장동향","articles":[{"n":6,"title":"한강벨트도 꺾였다…성동·강동 8개월 만에 하락 전환","meta":"2026.11.12 17:32 · 한국경제","body":"서울 아파트값 하락세가 강남 3구를 넘어 성동구와 강동구까지 번졌다. 성동구는 32주, 강동구는 33주 만에 각각 하락 전환했다. 두 지역의 아파트 매물은 1년 전보다 각각 143%, 49.6% 늘어난 것으로 나타났다. 강남권과의 가격 격차가 줄면서 관망세가 짙어졌고, 대출 규제가 겹쳐 추가 조정 가능성도 거론된다. 반면 서울 중저가 지역과 경기 남부, 전세 시장은 여전히 강세를 보이고 있다.","url":"https://www.hankyung.com/article/2026111235101"},{"n":7,"title":"3분기 서울 아파트 거래액 반토막…매수심리 올해 최저","meta":"2026.11.13 04:30 · 머니투데이","body":"올해 3분기 서울 아파트 매매거래액은 14조5930억원으로 직전 분기보다 49% 줄었고 거래량도 43.9% 감소했다. 전국 아파트 거래액 감소분의 51.7%를 서울이 차지했다. 건당 평균 거래액도 12억4600만원에서 11억3200만원으로 9.2% 내려갔다. 4분기 들어 서울 매수우위지수는 5주 연속 낮아져 올해 최저 수준으로 떨어졌고, 한강 이남 지수는 지난해 2월 수준까지 내려갔다. 시장에서는 대출 규제와 금융비용 부담에 경기 불확실성이 겹쳐 매수자 관망세가 이어지는 것으로 보고 있다.","url":"https://www.mt.co.kr/estate/2026/11/13/2026111215182422352"}]},{"name":"정비사업","articles":[{"n":12,"title":"억대 재초환 부담금 통지 본격화…\"산정 방식부터 손봐야\"","meta":"2026.11.13 07:01 · 서울경제","body":"강남권 재건축 단지들이 조합원 1인당 수억원대의 재건축초과이익환수 부담금 예정액을 잇따라 통지하고 있다. 대치동 은마아파트는 1인당 평균 4억6334만원, 반포현대는 2억2375만원을 통보했다. 관리처분계획인가에서 준공까지 8~10년이 걸리면서 예정액과 실제 확정액의 격차가 커지는 점이 문제로 지적된다. 세종대 교수는 취득 시점별 안분과 예정액·확정액 괴리에 상한을 두는 방안을 제안했다. 국토교통부 장관이 제도의 재산권 침해 소지를 언급하며 검토 의사를 밝힌 가운데 업계에서는 산정 방식 개편 요구가 커지고 있다.","url":"https://www.sedaily.com/article/20113742"},{"n":13,"title":"노원 태릉우성, 최고 33층 704가구 재건축…한국자산신탁이 시행","meta":"2026.11.12 17:31 · 머니투데이","body":"서울 노원구가 태릉우성아파트 재건축 사업시행자로 한국자산신탁을 지정했다. 2만9178.8㎡ 부지에 기존 432가구를 최고 33층 704가구로 다시 짓는 사업으로, 이 중 87가구는 공공주택으로 공급된다. 올해 5월 정비구역으로 지정된 뒤 신청 23일 만에 사업시행자가 정해졌으며 2034년 11월 준공이 목표다. 사업성 보정계수 1.68을 적용해 용적률은 299.46%까지 허용됐다. 노원로1가길과 이어지는 폭 6m 공공보행통로와 노인·보육시설도 함께 조성된다.","url":"https://www.mt.co.kr/estate/2026/11/12/2026111217281121743"}]},{"name":"금융/세제","articles":[{"n":15,"title":"서울 근저당 설정 1년 새 46% 급증…'집주인 대출' 확산","meta":"2026.11.12 18:34 · 파이낸셜뉴스","body":"대출 규제가 강남권을 넘어 서울 전역으로 확대되면서 매도인이 매수인에게 자금을 빌려주고 근저당권을 설정하는 이른바 셀러 파이낸싱이 늘고 있다. 지난 10월 서울의 근저당권 설정등기 신청은 2만884건으로 전년 동월 1만4243건보다 46.6% 증가했다. 광진구는 351건에서 3070건으로 급증했고 서초구도 91.7% 늘었다. 중개업소들은 거래를 성사시키려면 집주인 대출이 사실상 필수가 됐다고 설명한다. 전문가는 이런 방식이 대출 규제의 가격 조정 효과를 약화시킬 수 있다고 우려했다.","url":"https://www.fnnews.com/news/202611121835081726"},{"n":16,"title":"2금융권에 인터넷은행까지…집단대출 경쟁 과열","meta":"2026.11.13 07:00 · 이데일리","body":"정부가 지난 8월 집단대출을 가계대출 관리 대상에서 분리한 뒤 금융권 경쟁이 거세지고 있다. 지난달 집단대출 잔액은 2조4000억원 늘어 4월 이후 반년 만에 월간 증가폭이 2조원을 넘어섰다. 시중은행뿐 아니라 상호금융과 카카오뱅크까지 뛰어들어 연 4.2~4.4%대 금리로 고객을 끌어모으고 있다. 상호금융권 관계자는 금융당국이 실수요자를 위해 규제를 완화한 기조에 맞춰 관리하고 있다고 설명했다. 카카오뱅크는 비대면 방식으로 틈새시장을 공략하고 있다.","url":"https://www.edaily.co.kr/News/Read?newsId=02020486645645392&mediaCodeNo=257"}]},{"name":"임대주택","articles":[{"n":17,"title":"전세사기 피해자 480명 추가 인정…누적 4만2039명","meta":"2026.11.12 13:48 · 서울경제","body":"국토교통부가 전세사기 피해자 480명을 추가로 인정하면서 누적 피해자가 4만2039명으로 늘었다. 피해자의 약 76%는 40세 미만 청년층이며 임차보증금은 대부분 3억원 이하다. 지역별로는 수도권이 전체의 60.7%를 차지했다. 한국토지주택공사(LH)의 피해주택 매입 실적은 1만1542가구로 집계됐다. 정부는 피해주택 매입 절차를 일원화하고 안전계약 컨설팅 사업도 함께 추진하고 있다.","url":"https://www.sedaily.com/article/20113453"},{"n":18,"title":"서울시, 청년 월세 이어 관리비도 지원…내년 하반기 시행 목표","meta":"2026.11.13 07:09 · 서울경제","body":"서울시가 월세 외에 관리비까지 부담이 커진 청년 주거비를 덜기 위해 관리비 지원을 추진한다. 오세훈 서울시장은 11월 12일 대학생·임대인·전문가와 간담회를 열고 지원 방안을 논의했다. 한 동국대 학생은 보증금 1000만원에 월세 50만원인데 관리비가 10만~20만원 더 붙는다며, 임대료 인상 제한을 피해 관리비를 올리는 사례를 전했다. 서울시는 조례를 개정해 내년 하반기부터 관리비를 지원한다는 계획이다. 아울러 2030년까지 맞춤형 청년주택 7만4000가구와 공유주택 6000가구를 공급할 방침으로, 9월까지 1만1000가구를 공급해 연간 목표의 84%를 달성했다.","url":"https://www.sedaily.com/article/20113741"}]},{"name":"택지/도시개발","articles":[{"n":19,"title":"노들역 인근 저층주거지에 42층 938가구…224가구는 장기전세","meta":"2026.11.12 17:31 · 한국경제","body":"서울 동작구 지하철 9호선 노들역 인근 노후 저층주거지가 대규모 아파트 단지로 바뀐다. 최고 42층 4개 동에 938가구가 들어서며 이 가운데 224가구는 장기전세주택으로 공급된다. 여의도 업무지구와 가까워 직주근접 수요를 흡수할 것으로 기대된다. 서울시는 11월 11일 도시·건축공동위원회에서 이 지구단위계획 변경안을 통과시켰다. 같은 회의에서 목동 CBS 방송국 부지는 지식산업센터 계획을 바꿔 시니어 대상 장기임차주택으로 개발하기로 했다.","url":"https://www.hankyung.com/article/2026111235041"},{"n":20,"title":"옛 국립보건원 부지 연내 매각 무산…면적 줄여 재매각 검토","meta":"2026.11.13 06:10 · 뉴스1","body":"서울시가 추진한 은평구 옛 국립보건원 부지의 연내 매각이 무산됐다. 4만8000㎡ 규모를 4545억원에 내놓은 공개매각에 응찰자가 없어 유찰됐다. 서울시는 내년 상반기 매각 면적을 2만1000㎡ 수준으로 줄여 다시 내놓는 방안을 검토하고 있다. 이 부지는 청년 미래타운 조성 계획의 일부였으나 사업이 지연되고 있다. 지역에서는 공공시설 조성을 요구하는 목소리가 나오고 있다.","url":"https://www.news1.kr/realestate/general/6352362"}]},{"name":"주택품질/안전","articles":[{"n":21,"title":"서울 공동주택 절반이 주차장 기준 미달…민원 3건 중 1건이 주차","meta":"2026.11.12 15:37 · 아시아경제","body":"서울 공동주택 3047개 단지를 분석한 결과 49.4%인 1506곳이 가구당 주차대수 1.08대에 못 미치는 것으로 나타났다. 아파트 민원 약 10만건 가운데 주차 관련이 33%로 가장 많아 층간소음 20%와 흡연 19%를 앞섰다. 자치구별로는 노원구 67.6%, 금천구 64.6%, 도봉구 62.3% 순으로 주차 여건이 열악했다. 택배·배달 차량의 상시 주차와 지정 구역 침범도 이웃 간 갈등 요인으로 지목됐다. 입주민들은 낮과 밤을 가리지 않고 주차 공간을 찾아 단지를 돌아야 하는 상황이다.","url":"https://asiae.co.kr/visual-news/article/2026111215372201685"}]},{"name":"분양정보","articles":[{"n":23,"title":"반포 디에이치 반포124, 다음 달 1801가구 일반분양","meta":"2026.11.12 17:29 · 한국경제","body":"서울 서초구 반포주공1단지 1·2·4주구를 재건축한 디에이치 반포124가 다음 달 일반분양에 나선다. 일반분양 물량은 1801가구이며 단지 전체는 최고 35층 50개 동 5700가구 규모다. 강남 3구에서 39년 만에 나오는 최대 공급 물량으로 꼽힌다. 전용 59~130㎡로 구성되며 입주는 내년 하반기 예정이다. 7만7550㎡ 규모 커뮤니티에는 아이스링크와 수영장, 실내 골프연습장, 영화관이 들어서고 9호선 구반포역과 4·9호선 동작역을 이용할 수 있다.","url":"https://www.hankyung.com/article/2026111235111"}]},{"name":"논설/사설","articles":[{"n":26,"title":"[기고] 주택 공급의 속도, 주민 협력이 완성한다","meta":"2026.11.13 05:00 · 머니투데이","body":"김이탁 국토교통부 제1차관은 기고에서 주택 공급 속도를 높이기 위한 정부의 제도 개편을 설명했다. 국토부는 지난 8월 공공택지 최단기 착공모델을 도입해 기존 68개월 걸리던 절차를 37개월로 줄였고, 이를 통해 향후 5년간 약 8만9000호를 앞당겨 공급할 계획이라고 밝혔다. 다만 부지 확보에는 토지 소유자와 주민의 협조가 필수적이라며 조기 이주 시 추가 보상금을 지급하는 한편 정당한 사유 없이 퇴거를 미루면 원칙대로 대응하겠다고 했다. 지난 9월 공공주택 특별법 개정으로 협조 장려금 지급 근거가 마련됐고 내년 3월 시행이 목표라고 덧붙였다. 신속한 주택공급은 정부의 실행력과 국민의 신뢰가 함께할 때 가능하다는 것이 글의 요지다.","url":"https://www.mt.co.kr/estate/2026/11/13/2026111208063655180"}]}]},{"date":"2026-11-12","count":15,"pdf_count":24,"highlights":[{"n":1,"text":"주택공급 걸림돌 '버티기·알박기' 뽑아낸다"},{"n":6,"text":"한달새 1.5만건 불어난 서울·경기 아파트 매물…집값 하락 신호탄?"},{"n":12,"text":"홍지선 \"재초환 부과 기준 조만간 결론…혼란 막을 것\""}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"주택공급 걸림돌 '버티기·알박기' 뽑아낸다","meta":"2026.11.11 17:29 · 한국경제","body":"정부가 재개발 현장의 명도집행 방해와 이른바 '알박기' 등 정비사업 지연 요인에 대한 전국 실태조사에 착수한다. 이재명 대통령이 지난 10일 국무회의에서 이 문제를 거론하며 경찰청과 행정안전부, 법무부에 관련 사례를 전수 점검하라고 지시한 데 따른 후속 조치다. 올해 수도권 주택 착공 목표는 26만8000가구이지만 10월 둘째 주까지 착공 물량은 9만9000여 가구로 목표의 37%에 그쳤다. 국토교통부는 이주비 대출 기준 변경과 인허가·금융 통합지원센터 출범 등 지원책을 함께 추진하고 있다. 업계에서는 알박기 처벌 요건을 명확히 하는 등 제도 정비가 병행돼야 실효성이 있다는 의견이 나온다.","url":"https://www.hankyung.com/article/2026111108941"},{"n":2,"title":"홍지선 국토장관, 주 2회 공급 현장 방문… 3기 신도시·정비구역 직접 챙긴다","meta":"2026.11.12 04:00 · 머니투데이","body":"홍지선 국토교통부 장관이 지난 9월 취임 이후 매주 1~2회 주택공급 현장을 직접 방문하며 사업 진행 상황을 점검하고 있다. 수도권 3기 신도시와 재건축 구역, 도심 공공주택 복합사업 등이 주된 점검 대상이다. 홍 장관은 최근 약수역 공공주택 복합사업 현장을 찾아 서울시에 절차를 서둘러 달라고 요구했고, 신규택지로 발표된 김포아라지구(3만7000가구)에 대해서는 입주 전까지 서울지하철 5호선 연장사업을 마칠 수 있도록 지원하겠다고 밝혔다. 정부는 수도권에서 향후 5년간 150만가구 이상 착공을 목표로 하고 있으며, 연내 통합 주택공급 지원센터 출범을 추진 중이다.","url":"https://www.mt.co.kr/estate/2026/11/12/2026111119484626786"},{"n":3,"title":"국토부·서울시 전방위 충돌…도심복합 승인권부터 남산 곤돌라까지","meta":"2026.11.12 05:05 · 뉴스1","body":"국토교통부와 서울시가 주요 주택공급 현안을 놓고 전방위로 충돌하고 있다. 홍지선 국토부 장관은 서울시의 사전기획협의체 운영이 도심 공공주택 복합사업 지연의 원인이라며 \"법에 없는 절차로 사업이 지연되고 있다\"고 지적했다. 갈등 사안은 도심복합사업 승인권뿐 아니라 남산 곤돌라, GTX-A 삼성역 등으로 번지고 있다. 여권에서는 용산공원 부지를 활용한 주택공급 법안 발의도 추진되고 있어 양측의 대립이 당분간 이어질 전망이다.","url":"https://www.news1.kr/realestate/general/6350924"}]},{"name":"시장동향","articles":[{"n":6,"title":"한달새 1.5만건 불어난 서울·경기 아파트 매물…집값 하락 신호탄?","meta":"2026.11.11 17:13 · 머니투데이","body":"서울과 경기 지역 아파트 매물이 한 달 사이 1만5500건 이상 늘었다. 서울은 7만4576건에서 8만1714건으로 7138건(9.6%) 증가했고, 경기는 15만4543건에서 16만2906건으로 8363건(5.4%) 늘었다. 노원구와 성북구 등 외곽·중저가 지역의 매물 증가가 두드러졌고, 경기에서는 안양 동안구와 성남 분당구의 증가폭이 컸다. 이들 지역은 올해 경기에서 집값이 가장 많이 오른 곳이다. 업계에서는 대출 규제와 금리 부담, 단기 급등 피로감이 겹치며 매수자의 관망세가 짙어진 결과라는 분석이 나온다.","url":"https://www.mt.co.kr/estate/2026/11/11/2026111114261264163"},{"n":7,"title":"\"강남은 빠지고 성북은 뛰고\"…15억 이하로 번진 서울 집값 온기","meta":"2026.11.12 06:00 · 뉴시스","body":"서울 주택시장에서 고가 지역과 중저가 지역의 흐름이 뒤바뀌는 현상이 나타나고 있다. 강남구와 서초구, 송파구 등 고가 지역은 13주 연속 하락세를 보인 반면 15억원 이하 중저가 지역은 상승세를 이어가고 있다. 특히 성북구의 오름세가 두드러진다. NH투자증권 관계자는 비싼 동네는 내려오고 중위가격 지역은 올라오면서 가격 격차가 좁혀지고 있다고 설명했다. 대출 규제로 수요가 15억원 이하 구간에 몰린 영향이 크며, 내년에도 상승폭은 둔화되겠지만 부족한 입주 물량이 가격을 떠받칠 것이라는 전망이 제시됐다.","url":"https://www.newsis.com/view/?id=NISX20261111_0003863450"},{"n":8,"title":"동탄 묶어도 병점 5%↑…경기 12곳 집값 '규제선' 넘었다","meta":"2026.11.12 06:00 · 뉴시스","body":"정부가 지난 7월 경기 화성 동탄구와 용인 기흥구, 구리시를 규제지역으로 추가 지정한 뒤 인접한 비규제지역으로 아파트값 강세가 번지고 있다. 비규제지역 29개 시·구 가운데 12곳이 규제지역 지정 기준을 넘어선 것으로 나타났다. 8~10월 수원 권선구가 5.53%, 군포시가 5.45%, 화성 병점구가 5.05% 올랐다. 경기 전체 3분기 거래량은 23.2% 줄었지만 이들 12곳은 0.3% 늘었고 오산시와 병점구는 각각 34.7%, 24.6% 증가했다. 전문가들은 대출 규제를 피하려는 수요가 비규제지역으로 이동한 풍선효과로 분석했다.","url":"https://www.newsis.com/view/?id=NISX20261111_0003864382"}]},{"name":"정비사업","articles":[{"n":12,"title":"홍지선 \"재초환 부과 기준 조만간 결론…혼란 막을 것\"","meta":"2026.11.11 19:37 · 한국경제","body":"홍지선 국토교통부 장관이 재건축초과이익환수제 부담금 부과 시점과 관련해 유권해석을 의뢰했으며 결과를 기다리고 있다고 밝혔다. 홍 장관은 조만간 결론을 내려 시장의 혼란을 막겠다고 설명했다. 여당은 공공주택특별법 시행령을 고쳐 서울시장에게 위임된 공공주택 사업승인권을 국토부 장관에게 되돌려 달라고 요구하고 있다. 서울 공공도심복합개발사업은 34곳에서 약 5만9000가구를 공급하는 대규모 사업이다. 홍 장관은 권한 회수를 곧바로 추진하기보다 서울시와의 실무 협의를 신속히 진행하겠다는 입장을 보였다.","url":"https://www.hankyung.com/article/202611111209i"},{"n":13,"title":"안쓰는 땅 많은데…재건축 학교용지 先확보 논란","meta":"2026.11.11 17:28 · 한국경제","body":"서울 양천구 목동 14개 단지 재건축을 앞두고 학교용지 확보 방식을 둘러싼 논란이 커지고 있다. 교육당국은 재건축이 끝나면 초·중학교 207개 학급이 부족해질 것으로 보고 학교용지를 미리 확보해야 한다는 입장이다. 목동6단지는 1362가구에서 2173가구로, 목동5단지는 1848가구에서 3930가구로 늘어나며, 강서양천교육지원청은 두 단지에서만 초등학교 43개 학급이 더 필요하다고 주장한다. 서울시는 기부채납 부지를 우선 공공공지로 지정한 뒤 교육부 심사를 거쳐 학교용지로 바꾸는 방안을 추진하고 있다. 2033~2035년 목동 가구 수는 2만6629가구에서 4만7366가구로 늘어날 전망이다.","url":"https://www.hankyung.com/article/2026111108871"}]},{"name":"금융/세제","articles":[{"n":17,"title":"'稅 부담'에 다주택 털고 실거주… 전월세 매물도 씨 마른다","meta":"2026.11.11 18:14 · 파이낸셜뉴스","body":"세제 개편 압박에 다주택자들이 보유 주택을 팔거나 증여하는 흐름이 뚜렷해지고 있다. 강남 3구의 올해 1~10월 증여 건수는 6056건으로 지난해 같은 기간 6175건에 근접했다. 문제는 전월세 물량 감소다. 서울 아파트 매매 매물은 연초 대비 43% 늘었지만 전세와 월세 매물은 함께 줄었고, 강남구 전세 매물은 1월 5996건에서 4376건으로 감소했다. 토지거래허가구역 규제로 주택을 사면 실거주해야 해 임대 목적 매입이 사실상 막힌 영향이 크다. 전문가들은 전월세 물량 감소가 전셋값 상승을 거쳐 매매가를 밀어 올릴 수 있다고 우려했다.","url":"https://www.fnnews.com/news/202611111814244253"}]},{"name":"임대주택","articles":[{"n":18,"title":"40대, 7억 넘는 전셋집 구했는데…'내 돈 어쩌나' 술렁","meta":"2026.11.11 17:50 · 한국경제","body":"올해 서울 아파트 전세 계약의 32.1%가 보증금 7억원을 넘어섰다. 지난해 25.7%에서 크게 늘어난 수치이며, 수도권 전체로는 15%가 7억원을 초과했다. 보증금이 7억원을 넘으면 주택도시보증공사(HUG)와 한국주택금융공사(HF)의 공적 전세보증에 가입할 수 없어 세입자가 민간 보증을 이용하며 추가 비용을 떠안게 된다. 서울 아파트 중위 전셋값은 6억4667만원, 평균은 7억2898만원으로 조사됐다. 성동구는 전세 계약의 54.5%, 과천시는 91.8%가 7억원을 넘었고, 올해 서울 월세 계약 비중은 51.02%로 2011년 통계 작성 이후 처음 절반을 넘었다.","url":"https://www.hankyung.com/article/2026111109601"},{"n":19,"title":"전세사기 피해 76%가 2030…보증보험 가입은 되레 감소","meta":"2026.11.11 17:38 · 한국경제","body":"올해 9월까지 전세사기 피해로 인정된 사례는 4만1559건이며 이 가운데 20·30대가 3만1534명으로 75.9%를 차지했다. 피해 보증금은 97.7%가 3억원 이하였고 20대는 95.7%가 2억원 이하였다. 지역별로는 수도권이 60.7%, 대전 11.0%, 부산 10.2% 순이었으며 주택 유형은 다세대주택 28.3%, 오피스텔 21.0%, 다가구주택 18.8% 순으로 나타났다. 한국토지주택공사(LH)가 9월 말까지 사들인 피해 주택은 1만1148가구다. 그럼에도 20·30대의 전세보증 가입 건수는 2023년 20만1947건에서 2025년 18만4153건으로 8.8% 줄었다.","url":"https://www.hankyung.com/article/2026111109641"}]},{"name":"택지/도시개발","articles":[{"n":21,"title":"옛 가리봉시장 부지에 공공주택 181가구 들어선다","meta":"2026.11.11 14:47 · 서울경제","body":"서울 구로구 가리봉동 옛 가리봉시장 부지에 공공임대주택 181가구가 들어선다. 전용 25㎡ 137가구와 31㎡ 44가구로 구성되며 주차면 166면과 청년센터, 전통시장 고객지원시설이 함께 조성된다. 당초 174가구에서 181가구로 늘었는데, 모듈러 공법 대신 철근콘크리트 공법을 적용해 높이 제한 안에서 한 개 층을 더 올릴 수 있게 된 덕분이다. 2027년 착공해 2030년 준공할 계획이다. 사업지는 가산디지털단지역에서 약 500m 떨어져 있고 서울디지털산업단지와 가깝다.","url":"https://www.sedaily.com/article/20112990"}]},{"name":"분양정보","articles":[{"n":22,"title":"'100대 1 vs 미달'…청약 큰장 열리자 '옥석 가리기'","meta":"2026.11.11 17:31 · 한국경제","body":"11월 수도권에서 21개 단지 약 7000가구가 분양되는 가운데 단지별 청약 성적이 극명하게 갈리고 있다. 수원 광교 자연앤 센트레빌 지분적립형 주택은 평균 100.46대 1의 경쟁률을 기록했고 공공분양 일부 주택형은 184.3대 1까지 치솟았다. 반면 평택 한화포레나 지제역은 1022가구 모집에 282건만 접수돼 경쟁률이 0.28대 1에 그쳤고 전체 모집 물량의 72.4%가 미달됐다. 전문가들은 대출 규제와 분양가 상승, 지역별 미분양 누적이 겹치며 입지와 가격 경쟁력에 따라 청약 수요가 양극화되고 있다고 분석했다.","url":"https://www.hankyung.com/article/2026111108851"}]},{"name":"논설/사설","articles":[{"n":23,"title":"[사설] 부동산, 당리당략보다 주거안정이 먼저","meta":"2026.11.12 04:05 · 머니투데이","body":"비거주 1주택자의 종합부동산세 공제 한도를 12억원에서 14억원으로 높이는 방안을 두고 당정이 엇갈리는 상황을 다룬 사설이다. 정부는 당초 9억원으로 낮추려다 여당 요구로 12억원을 유지하기로 했지만, 일부 의원은 14억원으로 올려야 한다고 주장하고 있다. 사설은 공제액을 정하는 합리적 근거가 뚜렷하지 않고 표심 우려가 앞선다고 지적했다. 기준은 정치적 유불리가 아니라 주거 안정이어야 한다는 것이 사설의 핵심 주장이다. 내 집 마련을 원하는 사람에게는 감당 가능한 구매 기회를, 세입자에게는 전월세 주택을 충분히 공급하는 일이 먼저라고 강조했다.","url":"https://www.mt.co.kr/opinion/2026/11/12/2026111116315982337"},{"n":24,"title":"[사설] 부동산 세제 당정 엇박자, 서민 주거불안부터 해소해야","meta":"2026.11.11 23:10 · 세계일보","body":"부동산 세제 개편을 둘러싼 여당 내부 갈등을 비판하고 정책 방향 재검토를 촉구한 사설이다. 여권에서 1주택 규제를 더 풀라는 요구가 나오는 배경에 2028년 총선에 대한 우려가 자리하고 있다고 진단했다. 사설은 비거주 1주택에 대한 차등 과세가 공정과세·과세형평과 거리가 멀다고 평가했다. 또 임대주택 공급 축소와 전월세 급등이 서민의 주거 고통을 키우고 있는 것이 현실이라고 지적했다. 정책을 점진적으로 손질하되 임대 물량을 대폭 확대하고 주거비 부담을 덜어주는 데서 출발해야 한다고 제언했다.","url":"https://www.segye.com/newsView/20261111516040"}]}]},{"date":"2026-11-11","count":15,"pdf_count":20,"highlights":[{"n":1,"text":"부정청약 354건 적발…위장전입 334건, 전원 수사의뢰"},{"n":6,"text":"서울 아파트값 91주 연속 상승…역대 최장 기록 또 경신"},{"n":11,"text":"서초·강남 10개 재건축조합, 재초환 폐지 2차 탄원서 제출"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"부정청약 354건 적발…위장전입 334건, 전원 수사의뢰","meta":"2026.11.10 13:35 · 한국경제","body":"국토교통부와 국무조정실 부동산 감독 추진단은 지난해 7월부터 올해 3월까지 서울 등 43개 단지에서 분양한 2만5000가구 당첨자를 전수 점검해 부정청약 의심 사례 354건을 적발하고 전원 수사의뢰하기로 했다. 유형별로는 위장전입이 334건(94.4%)으로 대부분을 차지했고 위장미혼 18건, 청약자격 매매 1건, 위장퇴사 1건이 뒤를 이었다. 서울의 한 의사 부부는 청약 공고일 직전 병원을 퇴사했다가 공고일 직후 재입사하는 방식으로 소득 기준을 맞춰 신혼부부 특별공급에 당첨된 것으로 조사됐다. 점검 대상 가구 수는 지난해 상반기(2만8000가구)보다 줄었지만 적발 건수는 252건에서 354건으로 40.5% 늘었다. 정부는 의료시설 이용내역과 직장 소재지, 전월세 계약내역까지 확인 범위를 넓혔으며, 부정청약이 확정되면 주택 환수와 형사처벌, 10년간 청약 제한 조치가 뒤따른다.","url":"https://www.hankyung.com/article/202611107416i"},{"n":2,"title":"기부채납으로 용적률 올리고 분양가도 높였나…국토부 검증 착수","meta":"2026.11.11 05:05 · 뉴스1","body":"국토교통부가 분양가상한제 적용 아파트의 기부채납 비용 적정성 검증에 착수했다. 국토부는 서초구·송파구 등 지방자치단체에 관련 자료 제출을 요청하고, 기부채납으로 용적률 혜택을 받은 단지가 그 비용을 분양가 가산비에 과다하게 반영했는지 점검하고 있다. 검증 대상에는 기부채납 시설로 분류됐지만 사실상 입주민 전용으로 운영되는 공공시설도 포함된다. 국토부는 이번 점검 결과를 토대로 기부채납 가산비 산정 기준을 손질하는 등 분양가상한제 개편을 추진할 계획이다. 업계에서는 가산비 인정 범위가 좁아지면 정비사업 사업성에 영향이 불가피하다는 반응이 나온다.","url":"https://www.news1.kr/realestate/general/6349618"},{"n":3,"title":"용적률 1.2배 높인다면서…중앙도시계획위 심의 또 받으라는 국토부","meta":"2026.11.11 07:05 · 서울경제","body":"정부가 민간 재개발·재건축의 용적률을 법정 상한의 1.2배까지 올려주는 특례를 추진하면서, 적용 여부를 중앙도시계획위원회 심의로 결정하기로 해 이중 심의 논란이 일고 있다. 지방자치단체 심의에 더해 중앙정부 심의가 추가되면서 사업 속도를 높이겠다는 취지와 달리 절차가 늘어난다는 지적이다. 특례는 3년 한시로 운영되며 강남3구(강남·서초·송파)와 용산구는 시장 과열 우려를 이유로 대상에서 제외된다. 지난해 6월부터 올해 11월까지 강남3구를 뺀 서울 아파트값이 17.23% 올라 강남3구(11.04%)보다 상승폭이 컸던 점을 들어, 사업성이 낮은 지역이 오히려 특례에서 배제될 수 있다는 우려도 제기된다. 국토교통부는 LH가 수도권 22개 구역 3만9000가구를 맡아 2027년 착공하는 공공 주도 정비사업에 무게를 싣고 있다.","url":"https://www.sedaily.com/article/20112568"}]},{"name":"시장동향","articles":[{"n":6,"title":"서울 아파트값 91주 연속 상승…역대 최장 기록 또 경신","meta":"2026.11.11 06:30 · 한국경제","body":"한국부동산원 주간 조사에서 서울 아파트 매매가격이 0.07% 올라 91주 연속 상승을 기록했다. 문재인 정부 시절 최장 기록인 86주를 이미 넘어섰고, 내년 1월 첫째 주까지 오름세가 이어지면 전례 없는 100주 연속 상승이 된다. 강북권이 0.19% 올라 상승을 이끈 반면 강남권은 0.03% 내렸으며, 서대문구(0.31%)·금천구(0.30%)·성북구(0.30%)의 상승폭이 컸다. 다만 증시 변동성과 가격 피로감으로 매수세 자체는 약해졌다는 것이 현장의 평가다. 전문가들은 상승세가 비규제 외곽으로 번지는 풍선효과가 나타나면 규제지역 추가 지정과 대출 규제 강화로 이어질 수 있다고 내다봤다.","url":"https://www.hankyung.com/article/2026111080226"},{"n":7,"title":"서울서 집 넓히려면 4억4000만원…소형 거래 쏠림 심화","meta":"2026.11.10 17:25 · 한국경제","body":"올해 3분기 서울에서 전용 60㎡ 이하 소형 아파트 대신 60~85㎡ 중형을 사려면 평균 4억4000만원을 더 부담해야 하는 것으로 나타났다. 서울 소형 평균 가격은 8억149만원, 중형은 12억4107만원이었고, 경기는 두 면적대 격차가 1억5000만원 수준에 그쳤다. 가격 부담이 커지면서 서울의 소형 거래 비중은 3분기 47.2%로 2년 새 7.4%포인트 올라 전체 면적대 가운데 가장 높았다. 서울 아파트 거래량은 1만3251건으로 전년 동기 대비 27.7% 줄었지만 소형의 감소폭은 상대적으로 작았다. 반면 경기는 60~85㎡ 거래가 49.0%로 절반에 육박해 이른바 국민평형 선호가 유지됐다.","url":"https://www.hankyung.com/article/2026111082551"},{"n":8,"title":"2년 내 수도권 오피스텔 2만3400실 공급 가능…6억원 기준이 걸림돌","meta":"2026.11.10 18:22 · 파이낸셜뉴스","body":"2027~2028년 2년간 수도권에서 공급 가능한 오피스텔이 2만3400여 실에 이르는 것으로 조사됐다. 민간 보유 토지에서 8728실, LH 미분양 택지에서 1만4720실이 나올 수 있다는 집계다. 그러나 현행 제도가 오피스텔을 빌라·도시형생활주택과 묶어 전용 60㎡ 이하, 수도권 6억원 이하를 주택 수 제외 요건으로 두고 있어 실제 공급으로 이어지기 어렵다는 지적이 나온다. 업계는 가격 기준을 수도권 9억원·지방 6억원으로 올리고 면적 기준도 전용 85㎡ 이하로 넓혀야 한다고 요구하고 있다. 아울러 일몰제로 운영되는 현행 특례를 상시 제도로 전환하고 1세대 1주택 특례 세제 혜택 범위를 확대해 달라는 의견도 제기됐다.","url":"https://www.fnnews.com/news/202611101822288214"}]},{"name":"정비사업","articles":[{"n":11,"title":"서초·강남 10개 재건축조합, 재초환 폐지 2차 탄원서 제출","meta":"2026.11.10 12:37 · 파이낸셜뉴스","body":"서초구가 재건축초과이익환수제 폐지를 촉구하는 2차 탄원서를 국토교통부에 전달했다. 탄원에는 주민 6936명이 참여했고, 반포현대·반포3주구 등 서초구 9개 재건축조합과 강남구 1개 조합 등 모두 10개 조합이 이름을 올렸다. 조합들은 재초환이 실현되지 않은 잠재 이익에 부담금을 매겨 사유재산권을 침해하고, 기부채납·재산세·양도세에 더해지는 이중·삼중 과세라고 주장했다. 서초구는 재건축부담금 부과기한에 대한 명확한 유권해석을 13일까지 회신해 달라고 공문으로 요청했다. 전성수 서초구청장은 폐지해야 마땅한 제도라면서도 현행법에 따라 절차를 이행할 수밖에 없다는 입장을 밝혔다.","url":"https://www.fnnews.com/news/202611101152371504"},{"n":12,"title":"재초환 부담에 눌린 강남 재건축…가격 메리트 커졌다는 분석도","meta":"2026.11.11 06:00 · 뉴시스","body":"재건축초과이익환수 부담금 부과 가능성이 강남권 재건축 단지의 시세를 끌어내리는 요인으로 작용하고 있다. 재초환은 사업 개시·준공 시점에 따라 부담금이 2억원 이상 차이 날 수 있어 매수자들이 가격을 깎는 근거로 삼고 있다는 설명이다. 대치동 은마아파트와 잠실주공5단지의 작은 평형은 각각 30억원대, 36억원대까지 조정받았다. 김건우 분전아카데미 대표는 초기 재개발보다 이미 사업이 진행된 재건축이 생각보다 비싸지 않다며, 재초환을 감안해도 현재 강남 재건축의 가격 메리트가 가장 크다고 평가했다. 다만 주변 신축 가격이 추가로 내리면 재건축도 함께 조정받을 수 있어 매수 시점 판단이 필요하다는 신중론도 함께 제시됐다.","url":"https://www.newsis.com/view/NISX20261110_0003861733"},{"n":13,"title":"디에이치반포124 분양공고에 공공보행통로 통행권 명시","meta":"2026.11.11 06:00 · 서울경제","body":"서초구가 다음 달 분양하는 디에이치반포124의 입주자모집공고에 공공보행통로 지역권 설정 내용을 담기로 했다. 계약서뿐 아니라 분양공고 단계에서 통행 권리를 알려, 입주 후 생기는 통로 폐쇄 분쟁을 사전에 차단하겠다는 취지다. 그동안 재건축조합은 인허가 과정에서 개방을 약속하지만, 입주 후 구성된 입주자대표회의가 외부인 통행을 막는 사례가 반복돼 왔다. 서초구는 1억2000만원을 들여 연구용역을 발주해 통행로를 막는 관리주체에 대한 행정처분 근거를 마련하고 서울시·국토교통부에 제도 개선을 건의할 계획이다. 강남구와 송파구의 대규모 정비사업에도 공공보행통로가 예정돼 있어 이번 조치가 선례가 될 것으로 보인다.","url":"https://www.sedaily.com/article/20112591"}]},{"name":"금융/세제","articles":[{"n":14,"title":"장특공제 정부안대로면 양도세 7억 늘어…여당 완화론에 강남 촉각","meta":"2026.11.11 05:20 · 뉴스1","body":"정부가 추진하는 장기보유특별공제 축소안이 그대로 시행되면 강남권 고가 주택의 양도소득세 부담이 최대 7억원 이상 늘어날 수 있다는 전망이 제시됐다. 더불어민주당 소속 서울 지역 의원들을 중심으로 공제 축소 폭을 완화해야 한다는 요구가 제기되고 있고, 관련 국민동의청원 참여자는 2만4000명을 넘어섰다. 집주인들은 세 부담이 확정되기 전까지 매도 시점을 저울질하며 국회 논의를 지켜보는 분위기다. 다만 전문가들은 세 부담이 다소 줄더라도 대출 규제가 유지되는 한 강남권 매매·전세시장에 미치는 영향은 제한적일 것으로 평가했다. 세제개편안은 종부세 기본공제 등 다른 쟁점과 맞물려 국회 심의가 진행 중이다.","url":"https://www.news1.kr/realestate/general/6349629"},{"n":15,"title":"이형일 부총리 \"종부세 공제, 실거주 우대 원칙 지켜야\"","meta":"2026.11.10 19:31 · 한국일보","body":"이형일 부총리 겸 기획재정부 장관이 종합부동산세 기본공제를 거주용과 비거주용에 동일하게 적용하면 실거주 우대 원칙이 지켜지지 않는다고 밝혔다. 정부 원안은 실거주 1주택자 공제를 14억원으로 올리고 비거주 1주택자는 9억원으로 낮추는 내용이었다. 더불어민주당 서울 지역 의원들은 비거주 공제액도 12억원에서 14억원으로 올려 달라고 요구해 왔다. 당정협의 결과 비거주 공제액을 9억원으로 축소하는 방안은 폐기되고 현행 12억원이 유지되는 것으로 정리됐다. 정부는 부득이한 사유로 거주하지 못하는 경우에는 14억원 수준의 공제를 적용할 수 있도록 시행령에서 정하기로 했다.","url":"https://www.hankookilbo.com/news/article/A2026111019110004863"}]},{"name":"임대주택","articles":[{"n":17,"title":"전셋값 뛰는데 전세대출 금리까지…세입자 주거비 이중고","meta":"2026.11.10 14:49 · 아주경제","body":"5대 은행이 지난 9월 새로 취급한 전세자금대출 평균금리는 연 4.47%로 전월보다 0.15%포인트 올랐고, 1년 전(연 3.74%)과 비교하면 0.73%포인트 상승했다. 같은 4억원을 빌려도 연간 이자가 1496만원에서 1788만원으로 늘어 월 24만원가량 부담이 커지는 셈이다. 서울 아파트 평균 전셋값은 지난달 7억2898만원으로 1년 전보다 10.9% 올랐다. 서울 아파트 전세 매물은 2만6069건에서 2만1721건으로 16.7% 줄어 품귀 현상이 이어지고 있다. 올해 9월까지 서울 아파트 임대차 거래 중 월세 비중은 52.7%로 작년 같은 기간보다 8.3%포인트 높아졌다.","url":"https://www.ajunews.com/view/20261110142424375"},{"n":18,"title":"올림픽파크포레온 전세 만기 1056건 동시 도래…보증금 7499억원","meta":"2026.11.10 13:52 · 서울경제","body":"국내 최대 단지인 강동구 올림픽파크포레온(1만2032가구)에서 입주 2년 만에 전세 계약 만기가 한꺼번에 돌아오면서 서울 동남권 전세시장이 흔들리고 있다. 다음 달부터 내년 3월까지 만기가 도래하는 임대차 계약은 1056건, 보증금 합계는 7499억원이며, 내년 11월까지로 넓히면 1301건·9157억원에 이른다. 전용 84㎡ 전세는 올해 초 11억원에서 16억5000만원으로, 전용 59㎡는 13억원 수준으로 뛰었다. 2024년 2월 주택법 개정으로 실거주 의무 시작 시점이 최초 입주 가능일로부터 3년 뒤로 미뤄졌는데, 통상적인 2+2년 전세 계약과 맞물리면서 집주인들이 내년 11월까지 집을 비워 달라고 요구하는 상황이 벌어지고 있다. 업계는 공급 부족이 2027년까지 이어지다가 집주인들의 실거주 의무가 끝나는 2028년 11월 이후에야 숨통이 트일 것으로 보고 있다.","url":"https://www.sedaily.com/article/20112416"}]},{"name":"분양정보","articles":[{"n":19,"title":"국내 첫 지분적립형 공공분양 1순위 경쟁률 100대 1","meta":"2026.11.11 01:24 · 한국경제","body":"경기주택도시공사(GH)가 수원 광교신도시에 공급한 광교 자연앤 센트레빌의 지분적립형 일반공급 72가구에 7233명이 몰려 1순위 경쟁률 100.45대 1을 기록했다. 특별공급에서도 지분적립형 168가구에 1만1985건이 접수돼 71.34대 1의 경쟁률을 나타냈으며, 일반 공공분양 물량보다 약 2배 높았다. 지분적립형은 분양대금을 20~30년에 걸쳐 4~5년 간격으로 나눠 내면서 주택 지분을 단계적으로 취득하는 방식으로, 최초 취득 지분은 25% 수준이다. 초기 자금 부담이 작아 실수요자 관심이 높았다는 분석이 나온다. LH는 다음 달 고양창릉 S2블록 1057가구 가운데 284가구를 지분적립형으로 공급할 예정이다.","url":"https://www.hankyung.com/article/2026111086411"}]},{"name":"논설/사설","articles":[{"n":20,"title":"[사설] 종부세 완화 놓고 맞선 당청, 전월세 불안부터 살펴야","meta":"2026.11.10 21:19 · 서울신문","body":"사설은 여당이 종부세 완화를 요구하고 청와대가 실거주 우대 원칙을 고수하면서 당청 이견이 좁혀지지 않고 있다고 지적했다. 국회 검토보고서를 인용해 실거주자에 대한 세제 혜택이 임대주택 공급을 줄이고 임대료 상승을 부를 수 있다는 점을 경고했다. 서울 아파트 전세 매물이 1년 전보다 15.6% 줄고 월세는 1년 새 22만원 올라 세입자 부담이 커진 현실도 함께 제시했다. 시민 74%가 전월세 부담이 늘었다고 답했고 43%는 전월세 안정을 최우선 과제로 꼽았다는 조사 결과도 인용됐다. 사설은 집 가진 사람의 세금만 문제가 아니라 집 없는 서민의 주거 불안도 절박하다며 임대 물량 유지와 주거비 완화 대책을 함께 마련할 것을 촉구했다.","url":"https://www.seoul.co.kr/news/editOpinion/editorial/2026/11/11/20261111027007"}]}]},{"date":"2026-11-10","count":15,"pdf_count":22,"highlights":[{"n":1,"text":"전세사기 피해 보증금, 정부가 최소 3분의 1 보장…10일 사전신청"},{"n":5,"text":"토지거래허가구역이 갈랐다…산본 거래 2배 늘 때 분당은 반토막"},{"n":9,"text":"'강남권 재초환 1호' 반포현대에 179억 통지…1인당 2억2000만원"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"전세사기 피해 보증금, 정부가 최소 3분의 1 보장…10일 사전신청","meta":"2026.11.09 18:04 · 한국경제","body":"국토교통부가 전세사기 피해자가 돌려받지 못한 임차보증금의 최소 3분의 1을 보장하는 '최소보장제'를 13일부터 시행한다. 10일부터는 LH 청약플러스에서 온라인 사전신청을 받는다. 경·공매로 회수한 금액이 보증금의 3분의 1에 못 미치면 정부가 부족분을 현금으로 지급하는 구조로, 보증금 1억원 중 1000만원만 회수했다면 2333만원을, 한 푼도 받지 못했다면 3333만원을 받는다. 신탁사기처럼 적법한 임대 권한이 없는 사람과 계약한 피해자는 경·공매 절차가 끝나기 전에도 지원금을 먼저 받을 수 있다. 신청 후 90일 이내에 지급 여부가 결정된다.","url":"https://www.hankyung.com/article/2026110957081"},{"n":2,"title":"민주당 수도권 의원 20여 명 '전실모' 결성…11일 전월세 토론회로 출범","meta":"2026.11.09 16:27 · 신아일보","body":"더불어민주당 수도권 지역구 의원 20여 명이 '전월세 주거 안정화를 위한 부동산 실용주의 의원 모임'(전실모)을 결성하고 11일 국회에서 첫 공개 토론회를 열어 공식 출범한다. 김영배·김준혁·민병덕·박민규 의원 등이 참여한다. 이들은 정부 주택정책이 강남 집값 억제에 치우쳐 중산층·서민의 전월세 시장 안정에는 소홀했다고 지적한다. 전세시장 불안이 '생존형 매수'로 이어져 서울 외곽 집값을 밀어올렸다는 문제의식 아래 비거주 1주택 규제와 대출 규제를 다시 살펴보겠다는 계획이다. 토론회에서는 명지대·중앙대 교수진이 분석과 대안을 발표한다.","url":"https://www.shinailbo.co.kr/news/articleView.html?idxno=5081433"},{"n":3,"title":"'비거주 14억' 요구한 여당에 대통령실 제동…당청 엇박자 노출","meta":"2026.11.10 00:16 · 서울신문","body":"더불어민주당이 1주택자 종합부동산세 기본공제를 거주 여부와 관계없이 14억원으로 통일하자고 공개 요구했으나 대통령실이 난색을 표했다. 권칠승 민주당 정책위의장은 정부와 논의를 이어가겠다고 밝혔지만, 대통령실은 부동산 세제가 회의 안건이 아니었다며 선을 그어 당정 간 엇박자가 드러났다. 현재 정부안은 실거주 1주택 14억원, 비거주 1주택 12억원으로 공제를 차등화하는 내용이다. 수도권 지역구 의원들은 2028년 총선을 앞두고 부동산 민심 악화를 우려하고 있다. 진보당은 노정현 대변인을 통해 투기 목적 보유자의 세 부담을 줄이는 것은 용납할 수 없다고 비판했다.","url":"https://www.seoul.co.kr/news/politics/2026/11/10/20261110004003"}]},{"name":"시장동향","articles":[{"n":5,"title":"토지거래허가구역이 갈랐다…산본 거래 2배 늘 때 분당은 반토막","meta":"2026.11.09 18:06 · 한국경제","body":"지난해 10·15 대책 이후 1년간 수도권 1기 신도시 아파트 거래가 토지거래허가구역 지정 여부에 따라 엇갈렸다. 군포 산본은 1532건에서 3190건으로 108.2%, 부천 중동은 1546건에서 2842건으로 83.8% 늘었고 고양 일산도 34% 증가했다. 반면 허가구역으로 묶인 성남 분당은 5033건에서 2967건으로 41.0% 줄었고 안양 평촌도 2.5% 감소했다. 가격은 반대로 움직여 분당 3.3㎡당 중위가격은 5224만원에서 7081만원으로 35.5% 올랐고 평촌은 22% 상승한 반면, 산본은 8.3%, 중동은 5.4% 오르는 데 그쳤고 일산은 2% 내렸다. 허가구역에서는 매수 후 실거주 의무가 붙어 갭투자가 막히면서 거래가 위축된 것으로 풀이된다.","url":"https://www.hankyung.com/article/2026110957091"},{"n":6,"title":"서울 전세난, '준서울' 광명으로…경기 전셋값 상승률 1위","meta":"2026.11.10 05:20 · 뉴스1","body":"서울 전세난이 '준서울'로 불리는 경기 광명으로 번지고 있다. 광명 아파트 전셋값은 올해 들어 15.1% 올라 경기도에서 가장 높은 누적 상승률을 기록했다. 전세 매물은 1년 전 같은 시기보다 73.7% 줄어든 558건에 그쳐 품귀 현상이 뚜렷하다. 1000가구가 넘는 단지에서도 전세 물건이 한 건도 없다는 현장 중개업소 설명이 나온다. 고준석 교수는 재건축 이주 수요가 전세시장을 더 불안하게 만들 수 있다고 내다봤으며, 하안주공 이주도 변수로 꼽힌다.","url":"https://www.news1.kr/realestate/general/6348061"}]},{"name":"정비사업","articles":[{"n":9,"title":"'강남권 재초환 1호' 반포현대에 179억 통지…1인당 2억2000만원","meta":"2026.11.09 17:01 · 뉴스1","body":"서울 서초구가 반포현대(현 반포센트레빌아스테리움) 재건축조합에 재건축초과이익 부담금 예정액 179억원을 통지했다. 조합원 80명 기준으로 1인당 약 2억2000만원 수준이다. 강남권에서 재초환 부담금 부과 절차가 본격화된 첫 사례로, 조합은 50일간 이의신청을 할 수 있고 검토를 거쳐 금액이 달라질 수 있다. 대치동 은마아파트에는 1인당 평균 4억6000만원대 부담금 예정액이 통지된 것으로 전해졌다. 업계에서는 부담금이 현실화되면서 강남권 재건축 사업이 위축될 수 있다는 우려가 나온다.","url":"https://www.news1.kr/realestate/general/6348067"}]},{"name":"금융/세제","articles":[{"n":10,"title":"'종부세 공제 14억' 절충안 거론…실거주 인정 범위 넓히나","meta":"2026.11.09 18:03 · 한국경제","body":"1주택자 종합부동산세 기본공제를 둘러싼 당정 이견이 커지면서 절충안이 거론되고 있다. 정부는 비거주 1주택자 차등을 완전히 없애는 데는 선을 그었지만, 실거주로 인정하는 범위를 넓히는 방안이 대안으로 제시된다. 근무지 이전, 질병 치료, 가족 돌봄 등으로 집을 비운 경우 최대 3년까지 실거주로 보는 방식이다. 양도소득세 장기보유특별공제도 2029년 이후 일률적인 한도를 두는 대신 보유 기간에 따라 한도를 차등하는 안이 검토된다. 민주당에서는 30~40년 보유한 1주택자에게 같은 한도를 적용하는 것은 과하다는 의견이 나온다.","url":"https://www.hankyung.com/article/2026110958251"},{"n":11,"title":"여당 요구에 또 흔들리는 세제개편…비거주 1주택 차등 논란 재점화","meta":"2026.11.10 06:00 · 뉴스1","body":"여당 요구로 정부 세제개편안이 다시 흔들리면서 비거주 1주택자 종부세 차등 논란이 재점화됐다. 더불어민주당은 거주 여부와 무관하게 기본공제를 14억원으로 통일하자고 압박하고 있다. 정부는 당초 비거주 1주택 공제를 9억원으로 낮추려다 12억원 유지로 물러섰고, 실거주 14억원·비거주 12억원이라는 차등 자체는 지키겠다는 입장이다. 정부는 가상자산 과세 유예와 개인종합자산관리계좌(ISA) 축소 철회 등도 잇따라 내놓았다. 전문가들은 사전 협의와 설명이 부족한 채 수정이 반복돼 정책 신뢰가 떨어지고 있다고 지적한다.","url":"https://www.news1.kr/economy/trend/6348171"}]},{"name":"임대주택","articles":[{"n":14,"title":"LH, 서울 역세권 오피스텔 1000가구 매입…노·도·강은 한도 없이","meta":"2026.11.09 16:12 · 한국경제","body":"한국토지주택공사(LH)가 청년·신혼부부 임대주택으로 공급할 서울 역세권 주거용 오피스텔 1000가구를 매입한다. 지하철역 출입구에서 1km 이내, 2011년 1월 이후 사용승인, 30실 초과 건물, 전용 85㎡ 이하가 대상이다. 청년형은 전용 16~60㎡, 신혼·신생아형은 방 2개 이상인 36~85㎡를 받는다. 노원·도봉·강북구 오피스텔은 1000가구 한도와 무관하게 신청 물량에 따라 추가로 매입한다. 사용승인 1년 이내이고 기존 세입자가 없어 바로 입주자를 모집할 수 있는 신축을 우선하며, 매도 희망자는 12월 4일까지 신청할 수 있다.","url":"https://www.hankyung.com/article/202611095484i"},{"n":15,"title":"\"비거주 종부세 올리면 전세 거둬들인다\"…전월세 공급 위축 우려","meta":"2026.11.09 18:57 · 국민일보","body":"2028년 시행 예정인 비거주 1주택자 종부세 공제 차등화를 두고 전월세 공급이 줄어들 수 있다는 경고가 나왔다. 정부안은 1주택자 기본공제를 실거주 14억원, 비거주 12억원으로 나누고 주택 수와 관계없이 최고세율 5%를 적용하는 내용이다. 최한수 교수는 비거주자에게 불이익을 주면 사실상 서울 전역을 비우라는 신호가 돼 정치적으로 지속하기 어렵다고 지적했다. 김인만 부동산경제연구소장은 서울의 비거주 1주택자를 약 83만 명으로 추산하며 이들의 세입자 주거 안정이 흔들릴 수 있다고 우려했다. 민주당은 장기보유 혜택 축소에는 공감하면서도 공정과세를 넘어선 정책 목적에 보유세를 쓰는 것에는 의문을 제기했다.","url":"https://www.kmib.co.kr/article/20261109501719"}]},{"name":"택지/도시개발","articles":[{"n":16,"title":"송도 생활형숙박시설, 오피스텔로 전환…연수구 첫 사례 214실","meta":"2026.11.09 18:05 · 한국경제","body":"인천경제자유구역청이 4일 '힐스테이트 송도 스테이에디션' 214실의 오피스텔 용도변경을 승인했다. 송도가 있는 연수구에서 생활형숙박시설이 오피스텔로 바뀐 첫 사례다. 2024년 6월 준공된 이 건물은 608실 규모로, 업무지구라는 지구단위계획 제약 때문에 전환이 미뤄져 왔으나 인천경제청이 9월 지구단위계획을 바꿔 길을 열었다. 시행사인 고려자산개발이 공공기여금 43억원을 부담해 수분양자가 따로 낼 비용은 없다. 608실 가운데 214실이 전환을 마쳤고 19실이 2차 신청을 기다리고 있으며, 나머지도 소유자가 원하면 전환할 수 있다.","url":"https://www.hankyung.com/article/2026110957061"}]},{"name":"분양정보","articles":[{"n":17,"title":"10일 수도권 7곳 1순위 청약…일반분양 3823가구 쏟아진다","meta":"2026.11.09 18:07 · 한국경제","body":"10일 전국 12개 단지에서 5215가구의 청약이 진행되며 이 가운데 약 80%가 이날 하루에 몰린다. 평택·의정부·구리 등 수도권 7곳에서 1순위 청약을 받고 일반분양 물량은 3823가구다. 공급 규모가 가장 큰 단지는 한화 건설부문이 평택시 세교동에 짓는 '한화포레나 지제역'으로 전용 84~116㎡ 1098가구를 모두 일반분양한다. 평택 고덕 우미린(623가구), 의정부 '힐스테이트 회룡역 파크뷰'(909가구), 수원 광교신도시의 국내 첫 지분적립형 공공분양 '광교 자연앤 센트레빌'(600가구)도 포함된다. 시흥·구리·용인 단지와 춘천·구미 등 지방 2곳도 같은 날 청약을 받는다.","url":"https://www.hankyung.com/article/2026110957121"},{"n":18,"title":"지방 청약자 41%가 '1000가구 이상 대단지'로 몰렸다","meta":"2026.11.09 14:12 · 서울경제","body":"지방 분양시장에서 1000가구가 넘는 대단지로 청약 수요가 쏠리고 있다. 올해 10월까지 지방에서 분양한 100개 단지 가운데 대단지는 공급량의 20% 수준인데, 전체 청약자 13만3001명 중 41.3%인 5만4886명이 대단지에 몰렸다. 단지당 평균 청약 건수는 대단지가 2744건으로 그 외 단지 976건의 2.8배였다. 경쟁률 상위 20개 단지 중 6곳이 대단지였고, 진주 '포레나 힐스테이트'가 21.15대 1, 천안 '아이파크시티'가 11.01대 1을 기록했다. 업계는 커뮤니티·관리비·환금성 등 규모의 경제 효과로 검증된 단지에 수요가 집중된다고 설명한다.","url":"https://www.sedaily.com/article/20111947"}]},{"name":"논설/사설","articles":[{"n":20,"title":"[사설] 여당도 수긍하지 못하는 정부의 부동산 세제 개편","meta":"2026.11.10 00:10 · 한국일보","body":"더불어민주당이 8일 당정협의에서 정부 종합부동산세 개편안의 수정을 요구했다고 사설은 전했다. 정부안은 1주택자 기본공제를 실거주 14억원, 비거주 12억원으로 차등하는 내용으로, 비거주 공제는 당초 9억원에서 12억원으로 한 차례 올라온 수치다. 여당은 거주 여부로 나누지 말고 14억원으로 통일해야 한다고 주장한다. 사설은 서울 집값이 91주 연속 오른 상황에서 2028년 총선을 의식한 여당이 사정상 집을 세놓은 사람의 세 부담 증가를 우려한다고 짚었다. 정부는 집을 투자 대상이 아니라 사는 곳으로 봐야 하며 거주 여부에 따른 차등이 공평하다는 입장이다.","url":"https://www.hankookilbo.com/news/article/A2026110914390002109"},{"n":21,"title":"[세종로의 아침] 매물 늘고 거래량 줄면, 집값은 내려갈까","meta":"2026.11.10 00:27 · 서울신문","body":"허백윤 산업부 기자는 8·3 세제개편 발표 이후 서울 아파트 매물이 8월 3일 6만409건에서 11월 8일 8만528건으로 33.3% 늘어난 점에 주목했다. 강남3구가 서울 전체 매물의 38%를 차지하며, 올해 누적 변동률은 강남구 -2.02%, 서초구 -0.23%로 하락 흐름이 뚜렷하다. 그러나 서울 집값은 91주 연속 상승 중이고 주간 상승폭만 0.16%에서 0.07%로 줄었을 뿐이다. 칼럼은 강남 아파트값이 2억원 내리는 사이 강북과 외곽에서는 매매가와 전셋값이 1억~2억원씩 오르고 월세도 뛰었다고 지적했다. 매물 증가와 거래 감소가 실수요자의 주거 불안을 덜어줄지에 대해서는 회의적인 시각을 드러냈다.","url":"https://www.seoul.co.kr/news/editOpinion/column/politics-story/2026/11/10/20261110025001"}]}]},{"date":"2026-11-09","count":15,"pdf_count":26,"highlights":[{"n":1,"text":"LH, 공공주택 종합심사낙찰제 10년 만에 손질…\"공사비 거품 뺀다\""},{"n":4,"text":"서울 아파트 매물 8만건 돌파…석 달 새 33% 늘었지만 거래는 급감"},{"n":10,"text":"재건축부담금 5조3000억 통보…79개 사업장에 청구서"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"LH, 공공주택 종합심사낙찰제 10년 만에 손질…\"공사비 거품 뺀다\"","meta":"2026.11.06 17:20 · 한국경제","body":"한국토지주택공사(LH)가 2015년 도입한 종합심사낙찰제를 10년 만에 개편해 실질적인 가격경쟁을 유도하기로 했다. 경쟁사 평균보다 낮은 금액을 써낸 업체에 더 높은 점수를 주는 방식으로 바꿔, 여러 업체가 같은 금액을 써내 나란히 만점을 받는 관행을 막겠다는 것이다. LH 아파트 공사의 낙찰률은 2021년 75%에서 지난해 92%까지 올랐고, 3300억원 규모 공사에서는 입찰 50개사 중 37개사가 가격 부문 만점을 받은 사례도 있었다. LH는 예정가격 기준을 설계가의 98~102%에서 2015년 이전의 96~100%로 되돌리면 연간 약 13억7000만원을 아낄 수 있다고 추산했다. 정부는 2027년 1월부터 10억원 미만 공사까지 기술자격 심사를 확대할 계획이지만, 건설업계는 자재비 상승 국면에서 적자 시공이 늘 수 있다고 우려한다.","url":"https://www.hankyung.com/article/2026110614281"},{"n":2,"title":"공공주택 사업승인 71%가 일정 연기…최대 6년씩 밀렸다","meta":"2026.11.08 18:38 · 파이낸셜뉴스","body":"최근 1년간 공공주택 사업승인 물량의 71.1%가 일정이 미뤄졌고, 지연 기간은 1개월에서 최대 72개월에 달한 것으로 나타났다. 석문국가산업단지와 장항국가생태산업단지 등 3곳은 6년씩 사업이 늦춰졌다. LH 자료 기준으로 사업승인 후 착공하지 못한 물량은 전국 111개 지구 20만9270가구이며, 이 가운데 79.9%가 토지보상과 기반시설 문제로 지연됐다. 남양주왕숙, 안산신길 등 3기 신도시 사업지도 16~26개월씩 일정이 밀렸다. 이재명 대통령이 보상 절차를 서두르라고 주문했지만, 전문가들은 재산권과 감정평가 분쟁 소지를 고려하면 기간 단축이 쉽지 않다고 지적한다.","url":"https://www.fnnews.com/news/202611081838255680"}]},{"name":"시장동향","articles":[{"n":4,"title":"서울 아파트 매물 8만건 돌파…석 달 새 33% 늘었지만 거래는 급감","meta":"2026.11.08 06:05 · 파이낸셜뉴스","body":"11월 7일 기준 서울 아파트 매매 매물은 8만528건으로, 정부가 세제개편안을 발표한 8월 3일의 6만409건보다 2만119건(33.3%) 늘었다. 반면 9월 서울 아파트 매매거래량은 신고일 기준 3915건으로 지난해 같은 달보다 42.4% 줄었다. 매물은 쌓이는데 거래는 끊기는 흐름 속에서 강남3구는 가격이 내리고 나머지 22개 자치구는 올라 지역별 온도차가 뚜렷했다. 2021년에도 세 부담 강화로 매물이 늘었다가 이후 매물이 거둬들여지고 가격이 반등한 전례가 있어, 전문가들은 내년 6월 1일 보유세 과세기준일을 앞둔 4월까지 매물 회수 가능성을 거론한다. 공공주택 공급 정보를 더 적극적으로 알려 매수 대기 수요를 청약으로 돌려야 한다는 제언도 나왔다.","url":"https://www.fnnews.com/news/202611080605530182"},{"n":5,"title":"경기 아파트값 8주째 서울 추월…경매장엔 33명 몰려","meta":"2026.11.08 14:37 · 아시아경제","body":"11월 첫째 주 경기 아파트값은 전주 대비 0.20% 올라 서울 상승폭(0.07%)의 세 배 가까이 됐고, 8주 연속 서울을 앞질렀다. 용인 기흥구와 군포시, 안양 동안구, 화성 동탄구 등 서울 접근성이 좋은 지역이 상승을 이끌었다. 서울은 91주 연속 올랐지만 상승폭은 3주째 줄었고 강남·서초·송파는 하락했다. 규제가 덜한 경기권으로 수요가 옮겨가면서 경매시장에서도 응찰자가 33명까지 몰려 감정가를 웃도는 낙찰 사례가 나왔다.","url":"https://www.asiae.co.kr/article/real-estate-general/2026110814371847452"}]},{"name":"정비사업","articles":[{"n":10,"title":"재건축부담금 5조3000억 통보…79개 사업장에 청구서","meta":"2026.11.08 17:50 · 한국경제","body":"8월 말 기준 전국 79개 재건축 사업장에 통보된 재건축초과이익 부담금 예정액이 5조3000억원에 이르는 것으로 집계됐다. 서울이 53곳 4조3600억원으로 가장 많고, 강남3구와 용산구가 3조800억원으로 서울 전체의 70%를 차지한다. 용산구 한강맨션 조합원은 1인당 약 7억2200만원, 대치동 은마아파트는 평균 4억6300만원을 부담해야 할 것으로 추산됐다. 재초환은 2006년 도입돼 조합원 1인당 초과이익 8000만원을 넘는 금액의 최대 50%를 환수하는 제도다. 조합과 조합원 사이의 납부 책임을 둘러싼 법적 다툼도 정리되지 않아 향후 거래에 혼선이 생길 수 있다는 지적이 나온다.","url":"https://www.hankyung.com/article/2026110833101"},{"n":11,"title":"은마아파트 재초환 예정액 2조444억…조합원 1인당 4억6334만원","meta":"2026.11.06 17:39 · 서울경제","body":"강남구청은 지난 10월 30일 대치동 은마아파트 재건축조합에 재건축부담금 예정액 약 2조444억원을 통지했다. 조합원 1인당 평균 부담액은 약 4억6334만원으로 추산된다. 이번 통지는 확정 고지가 아니라 2035년 10월 15일 준공을 전제로 한 예정액이며, 실제 부담금은 준공 시점의 시세와 개발비용을 반영해 확정된다. 공사비 상승으로 조합원 분담금이 이미 늘어날 전망인 상황에서 부담금까지 겹치면 사업 추진 부담이 크게 커진다는 우려가 나온다. 조합은 2027년 상반기 이주를 목표로 하고 있다.","url":"https://www.sedaily.com/article/20111287"}]},{"name":"금융/세제","articles":[{"n":18,"title":"종부세 기본공제 '14억 통일' 요구에 대통령실 제동…당정 이견","meta":"2026.11.09 07:30 · 서울경제","body":"더불어민주당은 11월 8일 고위당정협의회에서 1주택자 종합부동산세 기본공제를 실거주 여부와 관계없이 14억원으로 통일해 달라고 정부에 요청했다. 대통령실은 실거주와 비거주 구분을 없애면 정책 일관성이 훼손되고 부동산 정책 신뢰가 떨어진다며 수용하기 어렵다는 입장을 밝혔다. 정부는 8월 세제개편안에서 실거주 1주택 공제를 12억원에서 14억원으로 올리고 비거주는 9억원으로 낮추려 했으나, 여당 반발로 9월 수정안에서 비거주 공제를 현행 12억원으로 유지했다. 민주당은 남은 2억원 차이까지 없애야 한다는 입장으로, 내년 보유세 고지서가 2028년 4월 총선을 앞둔 서울 민심에 영향을 줄 수 있다는 우려가 깔려 있다.","url":"https://www.sedaily.com/article/20111698"}]},{"name":"임대주택","articles":[{"n":19,"title":"서울 아파트 월세 비중 51%…중랑구는 85%로 역대 최고","meta":"2026.11.09 06:30 · 한국경제","body":"올해 1~9월 서울 아파트 임대차 계약 중 월세 비중은 51.1%였고 9월에는 55.3%까지 올랐다. 중랑구는 월세 비중이 85%로, 2011년 통계 작성 이후 처음으로 80%를 넘긴 자치구가 됐다. 고금리와 대출 규제로 세입자가 큰 보증금을 마련하기 어려워진 데다, 집주인도 역전세 위험과 세제 변화로 월세를 선호하게 된 영향이다. 서울 월세 비중은 2011년 1월 16.9%에서 올해 6월 55.8%로 역대 최고를 기록했다. 전세 매물은 3년 새 3만3898건에서 11월 6일 기준 2만1783건으로 35.8% 줄었다.","url":"https://www.hankyung.com/article/2026110608116"},{"n":20,"title":"\"월세 내년에도 안 떨어진다\"…전세 줄고 월세 오르는 구조","meta":"2026.11.07 03:00 · 파이낸셜뉴스","body":"서울 아파트 평균 월세가 1년 새 15% 올랐고 임대차 계약 10건 중 4건은 월세가 100만원을 넘는 것으로 나타났다. 전문가들은 고금리와 물가, 임대인의 세 부담 증가가 임차인에게 전가되고 있다고 분석했다. 전월세 전환율이 시장금리를 웃돌 때 전세의 월세 전환이 가격 상승을 더 키운다는 설명이다. 지방은 집값 정체로 전세를 유지할 유인이 줄었고, 서울은 대출 규제가 월세 전환을 앞당기는 등 지역별 원인도 다르다. 전문가들은 내년에도 월세 상승 압력이 이어질 것으로 보며, 전세대출 금리와 월세·매수 비용을 비교해 선택하라고 조언하고 대출 규제 완화와 외곽 매수 세제 지원을 해법으로 제시했다.","url":"https://www.fnnews.com/news/202611070300326152"}]},{"name":"택지/도시개발","articles":[{"n":21,"title":"금천구 석수역 인근 40년 철재상가, 43층 944가구로 탈바꿈","meta":"2026.11.08 07:58 · 아시아경제","body":"서울 금천구 시흥3동 966-2 일대 중앙철재상가 자리가 43층 944가구 규모의 주거·상업 복합단지로 개발된다. 서울시 시장정비위원회가 지난 10월 30일 이 계획을 통과시켰다. 40년 된 철재상가는 화재와 붕괴 위험이 지적돼 왔고 금속 가공 과정의 분진·소음으로 인근 주민 민원도 이어졌다. 금천구는 공공체육시설을 함께 넣고 주변 지형을 고려해 계획을 세웠으며, 지역 활성화 효과를 기대한다고 밝혔다. 행정 절차 고시 후 정비구역으로 정식 지정된다.","url":"https://www.asiae.co.kr/article/real-estate-dev-sales/2026110807584486758"}]},{"name":"주택품질/안전","articles":[{"n":22,"title":"외국인 근로자 늘어난 아파트 건설현장…품질관리 사각지대","meta":"2026.11.08 09:25 · 아시아타임즈","body":"건설현장의 외국인 근로자는 2024년 기준 하루 평균 22만9541명으로 전체 건설인력의 14.7%를 차지해 2020년 11.8%보다 크게 늘었다. 젊은 내국인이 열악한 처우를 이유로 현장을 떠나면서 숙련 인력이 줄어든 결과로, 충분한 교육과 경험 없이 투입되는 사례도 적지 않다. 언어 장벽 탓에 시공 기준과 안전 지시가 제대로 전달되지 않아 감독 공백이 생기고, 이는 아파트 시공 품질 저하로 이어진다는 지적이 나온다. GS건설 등 대형 건설사는 120여개 언어를 지원하는 AI 번역 프로그램을 도입했지만 중소 건설사는 이런 투자를 감당하기 어렵다. 전문가들은 건설기능인 등급제의 실효성을 높이는 등 직업훈련 체계를 손봐야 한다고 강조한다.","url":"https://www.asiatime.co.kr/article/20261105500388"}]},{"name":"분양정보","articles":[{"n":23,"title":"파주 운정·과천 4가구에 8000명 몰려…분상제 청약 과열","meta":"2026.11.08 17:00 · 헤럴드경제","body":"분양가상한제가 적용된 소규모 분양 물량에 청약 수요가 대거 몰렸다. 파주 운정중앙역 우미린 더센트럼은 전용 84㎡ 1가구 모집에 2564명이 신청해 2000대 1을 넘는 경쟁률을 기록했다. 과천 디에트르 프레스티지도 전용 59㎡ 2가구에 3264명이 몰려 1632대 1을 나타냈다. 파주는 시세보다 4000만~5000만원, 과천은 10억원가량 저렴하다는 점이 수요를 끌어모은 배경으로 꼽힌다. 전세난에 따른 수요와 함께, 정부가 12월부터 잔여 물량을 공공주택으로 돌리기 전에 청약하려는 움직임도 겹쳤다는 분석이 나온다.","url":"https://biz.heraldcorp.com/article/10929723"},{"n":24,"title":"서울 연말 분양 3750가구…반포 디에이치 1801가구 최대어","meta":"2026.11.09 06:19 · 서울경제","body":"11~12월 서울에서 12개 단지, 일반분양 약 3750가구가 공급될 예정이다. 9~10월 두 달간 일반분양이 27가구에 그쳤던 것과 비교하면 크게 늘어난 물량이며, 지난해 같은 기간의 6배 수준이다. 최대 단지는 반포주공1단지 1·2·4주구를 재건축하는 서초구 '디에이치 반포 124'로 총 5007가구 중 1801가구가 일반분양돼 연말 물량의 48%를 차지한다. 전용 84㎡ 분양가는 30억원 안팎으로 예상되는데 인근 시세가 57억~62억8000만원대여서 20억~30억원대 시세차익 기대가 나온다. 이 밖에 서초동 롯데캐슬아트팰리스 146가구, 강북구 북서울한울채시그니프 534가구, 종로구 경희궁에피트 135가구 등이 예정돼 있으며, 올해 서울 평균 청약경쟁률이 60대 1에 이른 만큼 분상제 단지에 수요가 집중될 전망이다.","url":"https://www.sedaily.com/article/20111688"}]},{"name":"논설/사설","articles":[{"n":25,"title":"[사설] 재건축 걸림돌 5조 재초환…부담 덜어 공급 숨통 틔워야","meta":"2026.11.08 17:44 · 한국경제","body":"전국 79개 재건축 사업장에 통보된 재초환 부담금 예정액이 5조3000억원에 이르며 서울 53곳, 경기 15곳에 집중돼 있다는 점을 짚었다. 대치동 은마는 조합원 1인당 4억6600만원, 용산 한강맨션은 7억원이 넘고 '재초환 1호'인 반포현대는 이번 주 가구당 평균 2억2000만원대 고지서를 받는다고 전했다. 2006년 도입된 이 제도는 지금까지 실제로 징수된 적이 없다는 점도 지적했다. 사설은 공사비 상승으로 사업성이 이미 흔들리는 상황에서 부담금까지 더해지면 정부의 공급 확대 기조와 충돌한다고 주장했다. 제도를 폐지하거나 주민 부담을 크게 줄여 공급 속도를 높여야 한다는 것이 사설의 결론이다.","url":"https://www.hankyung.com/article/2026110832991"},{"n":26,"title":"[광화문뷰] \"공급! 공급! 공급!\" 누구를 위한 공급대책인가","meta":"2026.11.07 20:11 · 아주경제","body":"홍승우 논설위원은 주택 공급 확대 자체는 맞는 방향이지만 시점과 인구 구조를 함께 봐야 한다고 지적했다. 정부가 수도권 23만가구 추가 공급과 10만가구 이상 신규 택지를 발표했지만, 실제 입주는 빨라야 2030년이어서 지금의 청년·신혼부부에게는 때를 놓친 대책이 될 수 있다는 것이다. 출산율 하락과 주택 구입 연령대 인구 감소를 고려하면 그때까지 수요가 유지될지도 불확실하다고 봤다. 칼럼은 공급 물량을 늘리는 것만으로는 부족하며 '누구에게, 언제까지, 어떤 주택을' 공급할 것인지를 분명히 하고 당장의 주거비 부담도 함께 다뤄야 한다고 주문했다.","url":"https://www.ajunews.com/view/20261107201113028"}]}]},{"date":"2026-11-06","count":15,"pdf_count":23,"highlights":[{"n":1,"text":"홍지선 국토장관 \"수도권 주택공급 수요 못 미쳐…공급에 총력\""},{"n":5,"text":"서울 아파트값 91주 연속 상승했지만 오름폭 7개월 만에 최저"},{"n":11,"text":"李 대통령 잇단 정비사업 부정 언급…국토부·서울시 공조 차질 우려"}],"categories":[{"name":"정부정책","articles":[{"n":1,"title":"홍지선 국토장관 \"수도권 주택공급 수요 못 미쳐…공급에 총력\"","meta":"2026.11.05 16:03 · 파이낸셜뉴스","body":"홍지선 국토교통부 장관이 5일 소셜미디어를 통해 결혼과 1인 가구 증가로 주택 수요는 이어지는데 서울과 수도권 주택 공급은 아직 그에 미치지 못하고 있다고 밝혔다. 홍 장관은 2022년 이후 인허가와 착공 부진을 해소하기 위해 범정부 역량을 모아 세 차례 공급대책을 마련했고, 5년간 수도권 150만가구 이상 공급을 추진하고 있다고 설명했다. 해법으로는 재개발·재건축 활성화와 공공도심복합사업의 신속 추진을 제시했으며, 서울시에도 적극적인 공급대책 마련을 요청했다. 서울 주택시장에 대해서는 가격 상승세가 둔화하고 매물이 늘어나는 등 일부 긍정적 신호가 나타나고 있다고 평가했다.","url":"https://www.fnnews.com/news/202611051554195998"},{"n":2,"title":"김이탁 국토부 1차관 \"인허가·금융 통합지원센터 이달 출범\"","meta":"2026.11.05 14:57 · 머니투데이방송","body":"김이탁 국토교통부 1차관은 5일 2026 MTN 도시정비포럼에서 인허가 기능과 금융 지원 기능을 합친 통합지원센터를 11월 말 출범시키겠다고 밝혔다. 김 차관은 금융당국 인력 1명이 약 20개 사업장을 전담해 수도권 주요 재개발·재건축 사업의 자금조달을 관리하는 방식을 설명했다. 한국부동산원은 조합을 대상으로 공사비와 사업성 분석 컨설팅을 강화한다. 정부는 서울에서 정비사업을 통해 연간 3만가구 이상 착공을 목표로 절차 간소화와 초기 사업비 지원 확대를 추진하며, 현장에서 실제로 기간이 줄고 주민 부담이 낮아지는지 확인해 미흡한 부분은 계속 보완하겠다고 밝혔다.","url":"https://news.mtn.co.kr/article/2026110514573754231"}]},{"name":"시장동향","articles":[{"n":5,"title":"서울 아파트값 91주 연속 상승했지만 오름폭 7개월 만에 최저","meta":"2026.11.05 18:05 · 한국경제","body":"한국부동산원이 5일 발표한 11월 1주(2일 기준) 주간 아파트 가격 동향에서 서울 아파트 매매가격은 0.07% 올라 91주 연속 상승했지만 상승폭은 3주째 줄며 7개월 만에 가장 낮았다. 부동산원은 고강도 대출 규제와 증시 변동성 확대로 매수 여력이 위축됐다고 설명했다. 강남구(-0.39%), 서초구(-0.37%), 송파구(-0.17%)는 하락세를 이어간 반면 경기는 0.20% 올라 서울을 웃돌았고 용인 기흥구가 0.60%로 수도권 최고 상승률을 기록했다. 전세가격은 서울 0.16%, 전국 0.10% 오르며 상승세를 유지했다.","url":"https://www.hankyung.com/article/2026110589821"},{"n":6,"title":"강남·서초 13주 연속 하락…올해 누적 상승분 모두 반납","meta":"2026.11.05 18:26 · 파이낸셜뉴스","body":"서울 아파트값이 91주 연속 올랐지만 강남구와 서초구는 13주 연속 하락하며 올해 누적 상승률이 나란히 마이너스로 돌아섰다. 지난주보다 하락폭이 커졌고 송파구도 약세를 이어가 강남3구 전체가 조정 국면에 들어섰다. 개포동 성원대치2단지는 10월 초 20억2500만원에서 한 달 만에 14억원으로 6억원 넘게 떨어졌고, 반포동과 잠실 일대에서도 수억원대 하락 거래가 나왔다. 업계는 8·3 세제 개편안에 따른 보유세 부담 확대 전망과 기준금리 인상이 고가 주택이 몰린 강남·서초에 상대적으로 큰 부담으로 작용한 것으로 분석했다.","url":"https://www.fnnews.com/news/202611051826036115"}]},{"name":"정비사업","articles":[{"n":11,"title":"李 대통령 잇단 정비사업 부정 언급…국토부·서울시 공조 차질 우려","meta":"2026.11.06 06:00 · 뉴스핌","body":"이재명 대통령은 4일 서울 성북구 장위9구역 공공재개발 현장을 찾아 공공이 재개발을 하면 속도도 빨라지고 부정부패 소지도 줄어드는데 여전히 민간 주도로 하려는 움직임이 많은 것은 부정부패 때문이라고 말했다. 이 발언으로 정부 정책의 무게중심이 민간 정비사업에서 공공정비사업으로 옮겨갈 가능성이 거론된다. 오세훈 서울시장은 최근 3년간 서울 주택공급의 약 90%를 민간사업이 담당했다고 반박했다. 업계에서는 국토교통부와 서울시가 추진해 온 정비사업 활성화 공조에 차질이 빚어질 수 있다는 우려가 나온다.","url":"https://www.newspim.com/news/view/20261105001386"},{"n":12,"title":"서울시 \"민간 재개발 죄악시 안 돼\"…대통령 발언에 공식 반박","meta":"2026.11.05 16:59 · 아시아경제","body":"서울시는 5일 보도자료를 내고 민간 재개발을 죄악시하는 접근은 주택공급 확대에 도움이 되지 않는다며 이재명 대통령의 발언을 반박했다. 시는 서울 재개발 계획 물량의 약 90%가 민간 재개발인 만큼 사업이 위축되지 않도록 정부가 규제 개선과 사업성 지원에 나서야 한다고 밝혔다. 또 공공재개발이 사업기간을 10년 이상에서 5년으로 줄이겠다고 했지만 서울에서 아직 착공한 공공재개발 사업장이 없고, 사업성 문제로 공공에서 민간으로 방식을 바꾼 구역도 있다고 지적했다. 대통령이 방문한 장위9구역에 대해서도 행정절차상 하자와 주민 소송이 있었다고 언급했다.","url":"https://view.asiae.co.kr/article/2026110516593805784"}]},{"name":"금융/세제","articles":[{"n":15,"title":"민주당 서울시당, 부동산 세제개편 당정협의 추진…\"3주 내 결론\"","meta":"2026.11.05 18:22 · 뉴스1","body":"더불어민주당 서울시당이 5일 부동산 세제개편안을 두고 정부와 당정협의를 추진하기로 했다. 국회 재정경제기획위원회에서 세법개정안이 처리되기 전 3주 안에 당 차원의 입장을 정리하겠다는 계획이다. 다만 종합부동산세 1세대1주택 기본공제 14억원 적용과 양도소득세 장기보유특별공제 축소를 두고 지역별로 의견이 엇갈려 이날 회의에서는 결론을 내지 못했다. 정부안은 종부세 과세 기준을 주택 수에서 주택가액과 실거주 여부로 바꾸는 내용을 담고 있다.","url":"https://www.news1.kr/politics/assembly/6344781"},{"n":16,"title":"주담대 막히자 임대시장 공략…은행권, 무주택 세입자 서비스 경쟁","meta":"2026.11.05 16:30 · 서울신문","body":"금융당국의 주택담보대출 규제로 매매 관련 대출 영업이 위축되자 은행권이 무주택 세입자 대상 서비스로 고객 접점을 넓히고 있다. 케이뱅크는 5일 공공임대주택 모집 정보와 대출 상품을 함께 볼 수 있는 '행복주택 모아보기'를 내놨고, KB국민은행은 KB부동산에서 공공임대 모집 알림과 AI 기반 '집찾는 AI'를 제공한다. 우리은행은 '전세 지킴이'로 깡통전세 위험을 진단하고, 신한은행은 청년·다문화가정·장애인 전세대출 고객에게 반환보증료를 지원하며 하나은행은 청년 대상 전월세 사기 보장 보험을 무료로 제공한다. KB국민·신한·하나·우리·NH농협 등 5대 은행의 10월 말 전세대출 잔액은 118조7265억원으로 9월보다 5715억원 줄었다.","url":"https://www.seoul.co.kr/news/economy/finance/2026/11/05/20261105500254"}]},{"name":"임대주택","articles":[{"n":17,"title":"LH, 올해 수도권 매입임대 4만가구 착공…2년 새 18배로","meta":"2026.11.05 18:26 · 파이낸셜뉴스","body":"한국토지주택공사(LH)가 올해 수도권 매입임대주택 착공 물량을 4만가구 규모로 늘린다고 5일 밝혔다. 2024년 2200가구와 비교하면 2년 만에 18배 이상 늘어난 규모다. 이성훈 LH 사장은 지난 9월 발표된 정부 주거안정 플랜에 따라 청년과 신혼부부가 부담 가능한 비용으로 안정적으로 살 수 있도록 공공임대주택을 대폭 확대하고 있다고 설명했다. LH는 2028년까지 서울에서 2만가구 이상을 공급할 계획이며 동대문구·구로구·마포구 등에서 입주자 모집이 예정돼 있다. 이날 서울 금천구 청년 매입임대주택에서 열린 주거복지 국민소통 토론회에서는 역세권 우수 입지 공급 확대와 청약 절차 개선이 과제로 제시됐다.","url":"https://www.fnnews.com/news/202611051826227681"},{"n":18,"title":"민주당 주거복지특위, 공적주택 119만호 첫 점검…\"취약계층 몫 줄까\" 우려","meta":"2026.11.05 16:45 · 비즈니스포스트","body":"더불어민주당 주거복지특별위원회와 서울시당 주택공급정책특별위원회는 5일 국회의원회관에서 '주거안정플랜, 현장에서 다시 묻다' 1차 간담회를 열었다. 국토교통부는 내년 예산에 공공주택 공급 재원 30조원을 배정하고, 청년에게 물량의 50%를 우선 배정하는 보편적 공공임대를 도입하며 소득·자산 요건을 완화할 계획이라고 밝혔다. 시민사회는 확대 방향에는 공감하면서도 소득 기준 완화로 혜택이 상대적으로 소득이 높은 청년에게 쏠리고 취약계층 몫이 줄어들 수 있다고 지적했다. 계약갱신청구권 확대와 민간임대 등록 의무화 등 세입자 보호 강화도 제안됐다.","url":"https://www.businesspost.co.kr/BP?command=article_view&num=451294"}]},{"name":"주택품질/안전","articles":[{"n":19,"title":"신축 아파트 하자 분쟁 5년간 2만3000건…대형 건설사도 예외 없어","meta":"2026.11.05 10:41 · 아시아타임즈","body":"신축 아파트에서 누수·균열·마감 불량 같은 하자가 이어지면서 2021~2025년 5년간 하자 분쟁이 2만3085건 접수됐다. 연평균 4600건 수준이며 실제 하자로 판정된 비율은 약 68%에 이른다. 하자 유형은 기능 불량이 18%로 가장 많고 들뜸·탈락, 균열, 결로, 누수가 뒤를 이었다. SK에코플랜트가 시공한 아파트에서 대규모 침수 피해가 발생하는 등 대형 건설사도 예외가 아니었다. 전문가는 관리감독자 역량 부족과 불법 재하도급이 고질적 품질 문제를 낳는다며 사전점검 확대를 넘어 시공 과정의 품질 관리와 하자 보수 이행을 관리하는 체계가 필요하다고 지적했다.","url":"https://www.asiatime.co.kr/article/20261105500139"}]},{"name":"분양정보","articles":[{"n":20,"title":"수도권 민간아파트 분양가 1년 새 25.7% 급등…서울은 38% 올라","meta":"2026.11.05 09:00 · 글로벌이코노믹","body":"9월 말 기준 최근 1년간 수도권 민간아파트의 ㎡당 평균 분양가는 1095만9000원으로 지난해 같은 기간 871만7000원보다 25.7% 올랐다. 3.3㎡당 약 3623만원 수준이다. 서울은 1377만9000원에서 1901만8000원으로 38.0% 올라 3.3㎡당 약 6287만원을 기록했다. 건설공사비지수가 전년 동월 대비 6.0% 오르고 수도권 주택 준공 물량이 21.6% 줄어든 점이 배경으로 꼽힌다. 경기 성남 분당구 '더샵 분당하이스트' 전용 84㎡는 27억3900만~29억8100만원에 책정됐다.","url":"https://www.g-enews.com/article/Real-Estate/2026/11/2026110508313393562aa6f4cdad_1"},{"n":21,"title":"계룡건설 '엘리프 시흥 더프라임' 분양…전용 84㎡ 5억원대","meta":"2026.11.05 14:50 · 중도일보","body":"계룡건설이 시흥거모 공공주택지구에서 짓는 '엘리프 시흥 더프라임'이 분양에 들어갔다. 분양가상한제가 적용돼 전용 84㎡ 최고 분양가가 5억9930만원으로 6억원 미만에 책정됐고 초기 계약금은 5%로 낮췄다. 총 338가구 가운데 304가구가 일반분양이며, 시흥시와 경기도, 서울·인천에 사는 만 19세 이상 세대주와 세대원이 신청할 수 있고 1주택자도 추첨제에 참여할 수 있다. 특별공급은 11월 9일, 1·2순위 청약은 10~11일, 당첨자 발표는 17일이다. 4호선·수인분당선 신길온천역을 걸어서 이용할 수 있고 반월·시화 산업단지와 가깝다.","url":"https://www.joongdo.co.kr/web/view.php?key=20261105010001890"}]},{"name":"논설/사설","articles":[{"n":22,"title":"[사설] 주택공급, 서로 탓하면 막힌 사업은 누가 푸나","meta":"2026.11.05 14:45 · 아주경제","body":"아주경제는 사설에서 공공개발의 효율성을 강조하는 대통령과 민간 주도를 옹호하는 서울시장의 논쟁을 두고 양쪽 모두 문제가 있다고 지적했다. 대통령에게는 민간 재개발을 부정부패와 연결하는 인식부터 거둬야 한다고 촉구했다. 서울시장에게는 공공개발 만능론을 비판하면서 정비사업 만능론에 기대서는 안 된다고 경고했다. 사설은 서로를 비판할 것이 아니라 금융·세제·도시계획·인허가 수단을 동원해 실제로 주택이 공급되도록 책임을 다해야 한다고 주장했다.","url":"https://www.ajunews.com/view/20261105144331113"},{"n":23,"title":"[사설] '민간 주도 많은 건 부패 탓' 주택 공급도 편 가르기 하나","meta":"2026.11.05 12:00 · 문화일보","body":"문화일보는 사설에서 이재명 대통령이 여전히 민간 주도로 하려는 움직임이 많은 것은 소위 부정부패 때문이라고 말한 데 대해 과도한 일반화라고 비판했다. 최근 3년간 서울에서 공급된 주택 10채 중 9채가량을 민간이 담당했고 아파트 공급의 63%가 재개발·재건축으로 이뤄졌다는 점을 근거로 들었다. 대통령 논리대로면 그 주택 대부분이 부정부패로 지어졌다는 뜻이 된다는 것이다. 사설은 한국토지주택공사(LH)의 신도시 사전 투기 사건을 들어 공공개발도 부패에서 자유롭지 않다고 지적했다.","url":"https://www.munhwa.com/article/11629044"}]}]}],"holidays":["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-02","2026-05-01","2026-05-05","2026-05-25","2026-06-03","2026-06-06","2026-08-17","2026-09-24","2026-09-25","2026-09-26","2026-10-05","2026-10-09","2026-12-25"],"art":{"date":"2026-11-19","url":"https://claude.ai/artifact/PvEbpwQSfGxroF4CKyyK7W","items":[{"cat":"정부정책","title":"멈춰 있던 국토부·서울시 협의, 5개월 만에 다시 열렸다","img":"art/20261119-1.png","anchor":"s1"},{"cat":"시장동향","title":"강남 큰 집은 내리고 강북 작은 집은 올랐다","img":"art/20261119-2.png","anchor":"s2"},{"cat":"정비사업","title":"재건축 부담금 청구서가 날아들자 강남이 술렁였다","img":"art/20261119-3.png","anchor":"s3"},{"cat":"금융/세제","title":"가계빚 2030조원, 그래도 주택대출은 더 늘었다","img":"art/20261119-4.png","anchor":"s4"},{"cat":"임대주택","title":"대학가 빈 상가가 청년 임대주택으로 바뀐다","img":"art/20261119-5.png","anchor":"s5"},{"cat":"택지/도시개발","title":"그린벨트 거래 넷 중 셋이 '지분 쪼개기'였다","img":"art/20261119-6.png","anchor":"s6"}]}};
